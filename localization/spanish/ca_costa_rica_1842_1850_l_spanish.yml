l_spanish:
 # CAFM - Costa Rica 1842-1850: new events, modifier and names
 # Sources: TSE (2008); Corella Ovares, Revista de Historia (UNA) 80 (2019)

 ca_costa_rica_events.221.t:0 "El jefe de Estado que no quiso gobernar"
 ca_costa_rica_events.221.d:0 "Diciembre de 1844. Francisco María Oreamuno asumió el 21 de noviembre y a las pocas semanas renunció. La Asamblea no aceptó la renuncia, así que él simplemente volvió a sus haciendas de Cartago. Rafael Moya gobierna interinamente y las facciones ya buscan un sucesor."
 ca_costa_rica_events.221.f:0 "Hay hombres que quieren el título, pero no el cargo."
 ca_costa_rica_events.221.a:0 "Que José Rafael de Gallegos tome el gobierno."
 ca_costa_rica_events.221.b:0 "Oreamuno debe volver a San José y gobernar."
 ca_costa_rica_events.222.t:0 "Muerte en Sociedad"
 ca_costa_rica_events.222.d:0 "Mayo de 1845. Llegan noticias de El Salvador: Braulio Carrillo ha sido asesinado en el pueblo de Sociedad. El capitán Domingo Lagos, con quien había reñido por una mina, fue a buscarlo con soldados, y Carrillo fue fusilado sin juicio. El Arquitecto del Estado ha muerto en tierra extranjera."
 ca_costa_rica_events.222.f:0 "Construyó un Estado y murió sin tener uno."
 ca_costa_rica_events.222.a:0 "Silencio oficial."
 ca_costa_rica_events.222.b:0 "Honrar al Arquitecto del Estado."
 ca_costa_rica_events.223.t:0 "La caída de Gallegos"
 ca_costa_rica_events.223.d:0 "7 de junio de 1846. Los cuarteles se han alzado contra el gobierno de José Rafael de Gallegos. José María Alfaro ha sido proclamado otra vez jefe de Estado provisional y promete una nueva constitución."
 ca_costa_rica_events.223.f:0 "En Costa Rica, los generales también votan."
 ca_costa_rica_events.223.a:0 "Alfaro, jefe de Estado provisional."
 ca_costa_rica_events.223.b:0 "El gobierno legal resistirá."
 ca_costa_rica_events.224.t:0 "La Constitución de 1847"
 ca_costa_rica_events.224.d:0 "Enero de 1847. Alfaro ha promulgado una nueva constitución. Puntarenas es puerto libre, el camino al Pacífico avanza y los electores se preparan para elegir un nuevo presidente."
 ca_costa_rica_events.224.f:0 "Tres constituciones en cinco años."
 ca_costa_rica_events.224.a:0 "Jurar la nueva constitución."
 ca_costa_rica_events.224.b:0 "Aplazarla."
 ca_costa_rica_events.231.t:0 "La República de Costa Rica"
 ca_costa_rica_events.231.d:0 "31 de agosto de 1848. El presidente Castro Madriz ha decretado lo que todos ya sabían: la Federación está muerta y Costa Rica es una república soberana. El Estado de Costa Rica es ahora la República de Costa Rica."
 ca_costa_rica_events.231.f:0 "Se corta el último lazo con la Unión."
 ca_costa_rica_events.231.a:0 "¡Viva la República!"
 ca_costa_rica_events.231.b:0 "Seguir siendo un Estado, por si la Unión renace."
 ca_costa_rica_events.232.t:0 "La bandera de Pacífica Fernández"
 ca_costa_rica_events.232.d:0 "Septiembre de 1848. La nueva República tiene nuevos símbolos. La esposa del presidente, Pacífica Fernández, ha diseñado una bandera que añade una franja roja al azul y blanco de la Federación, inspirada en los ideales de la Revolución francesa."
 ca_costa_rica_events.232.f:0 "Azul, blanco y ahora rojo."
 ca_costa_rica_events.232.a:0 "Izar la nueva bandera."
 ca_costa_rica_events.233.t:0 "La reforma de 1848"
 ca_costa_rica_events.233.d:0 "Noviembre de 1848. La reforma constitucional ha endurecido los requisitos para votar y para ocupar cargos. Los cafetaleros y comerciantes están encantados; los artesanos de San José, no."
 ca_costa_rica_events.233.f:0 "Una república para quien pueda pagarla."
 ca_costa_rica_events.233.a:0 "El voto es de quienes tienen propiedad."
 ca_costa_rica_events.233.b:0 "Abrir el voto a más propietarios."
 ca_costa_rica_events.234.t:0 "La renuncia de Castro"
 ca_costa_rica_events.234.d:0 "15 de noviembre de 1849. Con el tesoro en crisis y la élite cafetalera en su contra, el presidente Castro Madriz ha perdido al ejército. El general José Manuel Quirós, el mismo oficial que desconoció a Aguilar en 1838, se niega ahora a reconocer al presidente."
 ca_costa_rica_events.234.f:0 "El mismo general, otro presidente."
 ca_costa_rica_events.234.a:0 "Castro renuncia."
 ca_costa_rica_events.234.b:0 "Resistir y enviar a Quirós al exilio."
 ca_costa_rica_events.235.t:0 "«¡No nos venderán al Ecuador!»"
 ca_costa_rica_events.235.d:0 "4 de junio de 1850. El general Manuel Quirós y unos quince oficiales, la mayoría de su propia familia, planeaban tomar un cuartel y exigir la salida del «señor Flores» y de Castro. El rumor que hicieron correr era que el gobierno pensaba vender a nuestros soldados al general ecuatoriano Juan José Flores. Apenas una veintena de hombres respondió al llamado."
 ca_costa_rica_events.235.f:0 "Un golpe que termina antes de empezar."
 ca_costa_rica_events.235.a:0 "El complot ha fracasado. Arrestar a los cabecillas."
 ca_costa_rica_events.235.b:0 "Desmentir el rumor y purgar el alto mando."
 ca_cos_cafe_londres:0 "Café a Londres"
 ca_cos_cafe_londres_desc:0 "El café costarricense navega ahora directo a Inglaterra."
 Moya_Murillo:0 "Moya Murillo"
