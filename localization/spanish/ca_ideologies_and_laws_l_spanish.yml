 # ==========================================
 # 2. IDEOLOGIES
 # ==========================================
 ideology_taiping_moralist:0 "Moralismo Taiping"
 ideology_taiping_king:0 "Hijo de Shangdi"
 ideology_guilds:0 "Tradicionalistas Económicos"
 ideology_guilds_desc:0 "#lore Los gremios ven las leyes económicas progresistas como una amenaza para su existencia.#!"
 ideology_communalist:0 "Comunalista"
 ideology_communalist_desc:0 "Este grupo quiere autonomía comunal en su trabajo, libre de la opresión de las élites."
 ideology_silhak:0 "Silhak"
 ideology_donghak:0 "Donghak"

 # Central American Ideologies
 ideology_central_american_reactionary:0 "Regionalista"
 ideology_central_american_reactionary_desc:0 "Este grupo cree que el gobierno debe reformarse en una confederación, o disolverse por completo, y que las provincias deben volverse plenamente independientes."
 ideology_central_american_reactionary_2:0 "Centralistas"
 ideology_central_american_reactionary_2_desc:0 "Este grupo cree que el gobierno debe reformarse en una república unitaria, o disolverse por completo."
 ideology_central_america_caudillo:0 "Disolucionista"
 ideology_central_america_caudillo_desc:0 "Este líder quiere la plena independencia de cada región del país, libre de cualquier gobierno desigual o federal."
 ideology_liberalismo:0 "Liberalismo"
 ideology_liberalismo_desc:0 "Este grupo se opone a un gobierno fuertemente centralizado y cree en cierto grado de reforma social acorde con las ideologías europeas. Apoya el libre comercio y la restricción del poder de las corporaciones."
 ideology_conservadurismo:0 "Conservadurismo"
 ideology_conservadurismo_desc:0 "Este grupo apoya un Estado fuertemente centralizado con políticas comerciales proteccionistas y el mantenimiento de la configuración aristocrática de la sociedad. Recelan de los extranjeros, a menudo con tendencias xenófobas, y critican la importación de ideologías foráneas."
 ideology_soberania_aristocratica:0 "Soberanía Aristocrática"
 ideology_soberania_aristocratica_desc:0 "Este grupo tiene una visión esencialmente jerárquica y elitista de la organización social."
 ideology_crucismo:0 "Crucismo"
 ideology_crucismo_desc:0 "La Cruz Parlante de Chan Santa Cruz ha ordenado a los mayas alzarse contra sus amos. Sacerdote, oráculo y general son uno solo; los cruzoob cambian caoba por rifles británicos y nunca más se inclinarán ante el dzul."
 ideology_agroexportadores:0 "Agroexportadores"
 ideology_agroexportadores_desc:0 "Este grupo cree que la política económica debe centrarse en la agricultura y en los intereses de los agricultores, que ven en los mercados vecinos lugares lucrativos para vender sus productos."
 ideology_artesanado:0 "Artesanado"
 ideology_artesanado_desc:0 "Este grupo cree que la política económica debe orientarse a los intereses de los artesanos y proteger sus ganancias de los productos extranjeros baratos."
 ideology_unitarian:0 "Unitario"
 ideology_unitarian_desc:0 "Este líder cree fervientemente que la mejor forma de organización para la nación es un gobierno general fuerte que pueda aprovechar el potencial nacional en beneficio de todos sus ciudadanos."
 ideology_federalist:0 "Federalista"
 ideology_federalist_desc:0 "Este líder cree fervientemente que la mejor forma de organización para la nación es un gobierno general limitado por la autonomía local."
 ideology_incan_reclaimer:0 "Restaurador Inca"
 ideology_incan_reclaimer_desc:0 "Este líder busca liberar a la población indígena de la opresión colonial y reclamar su herencia imperial."
 ideology_liberal_monarchist:0 "Monárquico Liberal"
 ideology_liberal_monarchist_desc:0 "Este líder cree que la mejor manera de lograr estabilidad para un Estado liberal es tener una monarquía que sirva como figura cohesionadora en torno a la cual la nación pueda unirse."
 ideology_autocratic_autonomist:0 "Autonomista Autocrático"
 ideology_autocratic_autonomist_desc:0 "Este líder cree en la primacía de un gobierno central estable y poderoso que proteja la autonomía local de la anarquía y del gobierno de la turba."
 ideology_ca_leader_autocratic_autonomist:0 "Autonomista Autocrático"
 ideology_ca_leader_autocratic_autonomist_desc:0 "Este líder cree en la primacía de un gobierno central estable y poderoso que proteja la autonomía local de la anarquía y del gobierno de la turba."
 ca_ideology_constitutionalist:0 "Constitucionalista"
 ca_ideology_constitutionalist_desc:0 "#lore Este grupo cree en el gobierno constitucional y en el papel de instituciones democráticas fuertes en el arte de gobernar.#!"
 
 # Guatemala Flavor Ideologies
 ideology_maya_autonomism:0 "Autonomía Maya"
 ideology_maya_autonomism_desc:0 "Esta facción rechaza las repúblicas criollas y busca recuperar las tierras comunales, proteger sus lenguas nativas y establecer un gobierno de consejos agrarios sin injerencia de la capital."
 
 # El Salvador Flavor Ideologies
 ideology_coffee_liberalism:0 "Liberalismo Cafetalero"
 ideology_coffee_liberalism_desc:0 "Movidos por la fiebre del «grano de oro», estos oligarcas creen que el progreso de la nación reside en la privatización total de la tierra, el libre comercio y un gobierno reservado estrictamente a los más ricos."
 ideology_cuscatleco_nationalism:0 "Nacionalismo Cuscatleco"
 ideology_cuscatleco_nationalism_desc:0 "Convencida de que la densidad poblacional y la disciplina salvadoreñas los hacen superiores, esta facción promueve la expansión territorial mediante una dictadura militarizada y el reclutamiento masivo."
 
 # Nicaragua Flavor Ideologies
 ideology_granadine_legitimism:0 "Legitimismo Granadino"
 ideology_granadine_legitimism_desc:0 "La élite conservadora de Granada aborrece las ideas ilustradas de sus rivales leoneses. Defiende un orden paternalista, rígidamente católico y autoritario para salvar a la nación de la anarquía moral."
 ideology_anti_imperialist_sovereigntism:0 "Soberanismo Antiimperialista"
 ideology_anti_imperialist_sovereigntism_desc:0 "Forjados en las cenizas de las intervenciones extranjeras, exigen la expulsión inmediata de los intereses corporativos imperialistas. Apoyan una economía cooperativa sostenida por movimientos guerrilleros populares."
 ideology_slaver_filibusterism:0 "Filibusterismo Esclavista"
 ideology_slaver_filibusterism_desc:0 "Un destino manifiesto oscuro y rapaz. Esta facción extranjera busca subyugar repúblicas enteras, reintroducir instituciones esclavistas y gobernar mediante una jerarquía racial absoluta."
 
 # Costa Rica Flavor Ideologies
 ideology_carrillismo:0 "Carrillismo"
 ideology_carrillismo_desc:0 "Inspirados en Braulio Carrillo, sostienen que el aislamiento pacífico y una mano institucional firme son la única manera de evitar que Costa Rica sea arrastrada a las interminables guerras civiles del resto de Centroamérica."
 ideology_olympus_liberalism:0 "Liberalismo del Olimpo"
 ideology_olympus_liberalism_desc:0 "Una generación de pensadores que busca erradicar la influencia de la Iglesia mediante una educación pública agresiva. Promueven el avance científico, pero creen que solo la élite educada debe tener derecho al voto."
 ideology_chacara_social_democracy:0 "Socialdemocracia Chacarera"
 ideology_chacara_social_democracy_desc:0 "Basada en la tradición del pequeño agricultor independiente (el chacarero), esta facción promueve reformas agrarias pacíficas, un sufragio verdaderamente universal y un Estado de bienestar temprano."
 
 # Panama Flavor Ideologies
 ideology_mercantile_transitism:0 "Transitismo Mercantil"
 ideology_mercantile_transitism_desc:0 "El istmo de Panamá debe su existencia al comercio mundial. Esta facción exige fronteras totalmente abiertas y cero aranceles, haciendo del país el puente definitivo del capitalismo global."
 ideology_isthmian_separatism:0 "Separatismo Istmeño"
 ideology_isthmian_separatism_desc:0 "Hartos del abandono y del centralismo lejano, los separatistas buscan cortar lazos y establecer una república soberana, aunque eso implique depender militarmente de potencias navales extranjeras."

 ideology_ca_criollo_elite:0 "Élite Criolla"
 ideology_ca_criollo_elite_desc:0 "Este grupo busca mantener las estructuras de poder tradicionales heredadas de la época colonial, favoreciendo la oligarquía y el agrarismo."
 
 ideology_ca_liberal:0 "Liberalismo Radical"
 ideology_ca_liberal_desc:0 "Un feroz movimiento liberal que exige una economía de laissez-faire, sufragio universal y el desmantelamiento del viejo orden aristocrático."
 
 ideology_ca_constitutionalist:0 "Constitucionalista"
 ideology_ca_constitutionalist_desc:0 "Este grupo cree en el gobierno constitucional y en el papel de instituciones democráticas fuertes en el arte de gobernar."

 ideology_central_american_federal:0 "Federalista"
 ideology_central_american_federal_desc:0 "Aboga por un sistema federal fuerte en el que los estados conserven una autonomía significativa bajo una bandera centroamericana unida."

 ideology_ca_isolationist_expansionism:0 "Expansionismo Aislacionista"
 ideology_ca_isolationist_expansionism_desc:0 "Promueve la colonización de la frontera y la autosuficiencia, al tiempo que cierra agresivamente las fronteras a la influencia extranjera."

 ideology_ca_guilds:0 "Tradicionalismo Gremial"
 ideology_ca_guilds_desc:0 "Los gremios ven las leyes económicas progresistas como una amenaza para su existencia y exigen estrictas protecciones mercantilistas."

 ideology_ca_communalist:0 "Comunalista"
 ideology_ca_communalist_desc:0 "Este grupo quiere autonomía comunal en su trabajo, libre de la opresión de las élites, y aboga por milicias locales y la abolición de la esclavitud."

 ideology_ca_secularist:0 "Secularista"
 ideology_ca_secularist_desc:0 "Dedicado a apartar a la Iglesia de todos los asuntos del Estado, defiende la educación pública y la separación total entre Iglesia y Estado."

 ideology_ca_soberania_aristocratica:0 "Soberanía Aristocrática"
 ideology_ca_soberania_aristocratica_desc:0 "Este grupo tiene una visión esencialmente jerárquica y elitista de la organización social."

 ideology_ca_criollo_liberal:0 "Liberalismo Criollo"
 ideology_ca_criollo_liberal_desc:0 "Apoya la modernización económica y las libertades civiles, pero estrictamente para la élite culturalmente aceptada."

 ideology_ca_criollo_paternalistic:0 "Paternalismo Criollo"
 ideology_ca_criollo_paternalistic_desc:0 "Un enfoque conservador que combina el agrarismo tradicional con una autoridad estatal fuerte y tutelar sobre las clases bajas."

 ideology_ca_criollo_stratocratic:0 "Estratocracia Criolla"
 ideology_ca_criollo_stratocratic_desc:0 "Cree que solo una casta militar fuerte surgida de la élite tradicional puede mantener el orden y la supremacía nacional."

 ideology_ca_artesanado:0 "Artesanado"
 ideology_ca_artesanado_desc:0 "Este grupo cree que la política económica debe orientarse a los intereses de los artesanos y proteger sus ganancias de los productos extranjeros baratos."

 ideology_ca_agroexportadores:0 "Agroexportadores"
 ideology_ca_agroexportadores_desc:0 "Este grupo cree que la política económica debe centrarse en la agricultura de exportación y el libre comercio para acceder a lucrativos mercados extranjeros."

 ideology_ca_colonialist:0 "Colonialista"
 ideology_ca_colonialist_desc:0 "Busca expandir agresivamente las fronteras nacionales y explotar los territorios fronterizos aún sin aprovechar para obtener recursos."

 ideology_ca_enclavist:0 "Enclavista"
 ideology_ca_enclavist_desc:0 "Dispuesto a arrendar la soberanía y los recursos nacionales a corporaciones extranjeras a cambio de capital e infraestructura."

 ideology_ca_radical_enclavist:0 "Enclavista Nacional"
 ideology_ca_radical_enclavist_desc:0 "Una postura paradójica que combina la explotación corporativa extranjera extrema con duras políticas etnoestatales y segregacionistas."

 ideology_ca_autocratic_autonomist:0 "Autonomista Autocrático"
 ideology_ca_autocratic_autonomist_desc:0 "Este líder cree en la primacía de un gobierno central estable y poderoso que proteja la autonomía local de la anarquía."

 ideology_ca_servile:0 "Conservadurismo Servil"
 ideology_ca_servile_desc:0 "Profundamente tradicionalista, busca una oligarquía autoritaria estrechamente entrelazada con la religión del Estado."

 ideology_ca_coffee_liberal:0 "Liberalismo Cafetalero"
 ideology_ca_coffee_liberal_desc:0 "Movidos por la fiebre del «grano de oro», estos oligarcas creen que el progreso de la nación reside en la privatización total de la tierra y el libre comercio."

 ideology_ca_indigenous_communalism:0 "Comunalismo Indígena"
 ideology_ca_indigenous_communalism_desc:0 "Lucha por la restitución de las tierras ancestrales, la aceptación multicultural y el desmantelamiento de la agricultura comercial explotadora."

 ideology_ca_separatist:0 "Separatismo Soberanista"
 ideology_ca_separatist_desc:0 "Aboga por la independencia y el aislamiento totales de la región, rechazando los ejércitos profesionales en favor de milicias nacionales."

 ideology_ca_enclavist_pick:0 "Enclavista Colaboracionista"
 ideology_ca_enclavist_pick_desc:0 "Corteja activamente al capital extranjero y el libre comercio, eliminando los controles migratorios para facilitar las operaciones de corporaciones internacionales."

 ideology_ca_moralist:0 "Moralista"
 ideology_ca_moralist_desc:0 "Una ideología estrictamente religiosa que exige que las leyes del Estado reflejen la ley divina, oponiéndose al secularismo a cada paso."

 ideology_ca_papal_moralist:0 "Moralista Papal"
 ideology_ca_papal_moralist_desc:0 "Jura lealtad suprema al Papa y exige un Estado teocrático o una monarquía profundamente devota que imponga la supremacía católica."

 # ==========================================
 # SPECIFIC LEADER FLAVOR IDEOLOGIES
 # ==========================================
 ideology_ca_liberal_monarchist:0 "Monárquico Liberal"
 ideology_ca_liberal_monarchist_desc:0 "Este líder cree que la mejor manera de lograr estabilidad para un Estado liberal es tener una monarquía que sirva como figura cohesionadora en torno a la cual la nación pueda unirse."

 ideology_ca_unitarian:0 "Unitario"
 ideology_ca_unitarian_desc:0 "Este líder cree fervientemente que la mejor forma de organización es un gobierno fuerte y altamente centralizado."

 ideology_ca_federalist:0 "Federalista"
 ideology_ca_federalist_desc:0 "Este líder cree fervientemente que la mejor forma de organización es un gobierno general limitado por una fuerte autonomía local."

 ideology_ca_reformer:0 "Reformista"
 ideology_ca_reformer_desc:0 "Dedicado a mejorar gradualmente la sociedad mediante cambios constitucionales, educación y la ampliación de las libertades."

 ideology_ca_morazanista:0 "Morazanista"
 ideology_ca_morazanista_desc:0 "Seguidores de la visión radical de Francisco Morazán: una Federación Centroamericana férreamente unida, laica y progresista."

 ideology_ca_filibuster:0 "Filibustero"
 ideology_ca_filibuster_desc:0 "Impulsado por un oscuro destino manifiesto, busca conquistar territorios para imponer una jerarquía racial absoluta y reintroducir la esclavitud."

 ideology_ca_imperial_monarchist:0 "Panhispanista Imperial"
 ideology_ca_imperial_monarchist_desc:0 "Sueña con reunir el fracturado mundo hispanohablante bajo una monarquía fuerte, devota y autocrática."

 ideology_ca_banana_socialism:0 "Socialismo Bananero"
 ideology_ca_banana_socialism_desc:0 "Una variante tropical del comunismo centrada en colectivizar las vastas plantaciones de propiedad extranjera y establecer una república de consejos."

 ideology_ca_jesuit_theocracy:0 "Teocracia Jesuita"
 ideology_ca_jesuit_theocracy_desc:0 "Exige el gobierno absoluto de la orden religiosa sobre el Estado, proscribiendo la disidencia e imponiendo una estricta educación católica."

 ideology_ca_miskito_hegemony:0 "Hegemonía Misquita"
 ideology_ca_miskito_hegemony_desc:0 "Busca establecer un poderoso reino marítimo indígena-británico a lo largo de la costa, dominando el comercio y la política regional."

 ideology_ca_neo_mayan_restoration:0 "Restauración Neomaya"
 ideology_ca_neo_mayan_restoration_desc:0 "Un levantamiento indígena tradicionalista que busca expulsar la influencia colonial, recuperar las tierras ancestrales y establecer un etnoestado."

 ideology_ca_hermit_isolationism:0 "Aislacionismo Ermitaño"
 ideology_ca_hermit_isolationism_desc:0 "Inspirado en el modelo del «Dr. Francia», exige el cierre total de fronteras, comercio y diplomacia para forjar una autocracia completamente autosuficiente."

 ideology_ca_tropical_bonapartism:0 "Bonapartismo Tropical"
 ideology_ca_tropical_bonapartism_desc:0 "Combina el gobierno militar autocrático con reformas ilustradas, buscando construir un Estado moderno y laico por la pura voluntad de un emperador carismático."

 ideology_ca_tropical_utopian:0 "Utopismo Selvático"
 ideology_ca_tropical_utopian_desc:0 "Inspirados en los socialistas utópicos europeos, intentan construir comunas igualitarias y cooperativas lejos de la capital corrupta."

 ideology_ca_canal_company_rule:0 "Gobierno de la Compañía del Canal"
 ideology_ca_canal_company_rule_desc:0 "Una dictadura corporativa en la que el aparato estatal existe únicamente para facilitar la construcción, operación y rentabilidad de la ruta de tránsito interoceánico."

 ideology_ca_syncretic_cult:0 "Culto Sincrético"
 ideology_ca_syncretic_cult_desc:0 "Un movimiento religioso milenarista que combina creencias indígenas con misticismo cristiano y busca una teocracia guiada por la profecía divina."

 ideology_ca_bolivarian_integration:0 "Integracionista Bolivariano"
 ideology_ca_bolivarian_integration_desc:0 "Aboga por la integración política y militar total de Centroamérica en la visión más amplia de la Gran Colombia."

 ideology_ca_corsair_republic:0 "República Corsaria"
 ideology_ca_corsair_republic_desc:0 "Una ideología caótica impulsada por contrabandistas, que rechaza el arte de gobernar burocrático en favor del libre comercio absoluto y el oportunismo marítimo."

 ideology_ca_agrarian_luddism:0 "Ludismo Agrario"
 ideology_ca_agrarian_luddism_desc:0 "Ferozmente opuestos a la industrialización, estos rompemáquinas buscan mantener una sociedad agraria puramente tradicional y de baja tecnología."

 ideology_ca_cientifico_technocracy:0 "Tecnocracia Científica"
 ideology_ca_cientifico_technocracy_desc:0 "Pensadores positivistas que creen que la nación debe regirse por principios científicos, una eficiencia implacable y una élite ilustrada."

 ideology_ca_late_unionist:0 "Unionista Diplomático"
 ideology_ca_late_unionist_desc:0 "Un reformista moderado que busca la reunificación pacífica y diplomática de Centroamérica mediante el comercio compartido y la cooperación burocrática."

 ideology_ca_peasant_caudillismo:0 "Caudillismo Campesino"
 ideology_ca_peasant_caudillismo_desc:0 "Un caudillo populista profundamente tradicional que se apoya en levas campesinas leales y en el fervor religioso para mantener un control local absoluto."

 ideology_ca_creole_caribbean:0 "Creole Afrocaribeño"
 ideology_ca_creole_caribbean_desc:0 "Las comunidades creoles anglófonas y protestantes de la costa caribeña, de Bluefields a Belice y más tarde Limón, más ligadas a Kingston y Nueva Orleans que a las capitales del altiplano. Quieren puertos abiertos, libertad de culto y que los gobiernos hispanos los dejen en paz."
 
 ideology_ca_masonic_liberal:0 "Liberalismo Masónico"
 ideology_ca_masonic_liberal_desc:0 "Las logias masónicas fueron la verdadera red organizativa del liberalismo centroamericano: una hermandad de abogados, oficiales y comerciantes juramentados a la educación laica, el libre pensamiento y el fin del privilegio clerical."
 
 ideology_ca_mutualism:0 "Mutualismo Artesano"
 ideology_ca_mutualism_desc:0 "Sociedades de artesanos y asociaciones de socorro mutuo que reúnen los ahorros de sus miembros contra la enfermedad, la muerte y los tiempos difíciles. Ni gremio ni sindicato, son el semillero del que crecerá el movimiento obrero organizado."
 
 ideology_ca_pact_confederalist:0 "Confederalismo del Pacto"
 ideology_ca_pact_confederalist_desc:0 "Herederos del Pacto de Chinandega, creen que Centroamérica puede reunificarse pacíficamente, por tratado entre Estados soberanos, sin las bayonetas de ningún caudillo."
 
 ideology_ca_moravian_pietism:0 "Pietismo Moravo"
 ideology_ca_moravian_pietism_desc:0 "Desde 1849, los misioneros moravos de Herrnhut predican, enseñan e imprimen biblias a lo largo de la Costa de los Mosquitos. Sus conversos quieren escuelas, sobriedad, libertad de culto y mantener el Reino de la Mosquitia fuera de manos católicas."
 
 ideology_ca_barrismo:0 "Barrismo"
 ideology_ca_barrismo_desc:0 "La Reforma Liberal con la espada en la mano. Las tierras de la Iglesia y las tierras comunales se confiscan para el café, el trabajo indígena se recluta por decreto, las escuelas se secularizan y Centroamérica será reunificada, quiera o no."
 
 ideology_ca_morismo:0 "Morismo"
 ideology_ca_morismo_desc:0 "El credo de la Campaña Nacional: la riqueza del café paga un ejército ciudadano, y ese ejército marcha más allá de la frontera para expulsar a los filibusteros del istmo. Prosperidad en casa, soberanía para toda Centroamérica."
 
 ideology_ca_soto_rosa_reformism:0 "Reformismo Positivista"
 ideology_ca_soto_rosa_reformism_desc:0 "Orden y progreso para una nación de caudillos: códigos civiles, una burocracia asalariada, escuelas laicas y concesiones mineras al capital extranjero para financiar un Estado moderno donde nunca lo hubo."
 
 ideology_ca_mexican_annexationist:0 "Anexionismo Mexicano"
 ideology_ca_mexican_annexationist_desc:0 "Ciudad de Guatemala está lejos y es hostil; México está cerca y es generoso. Desde los días del imperio de Iturbide, el altiplano occidental alberga una facción que preferiría ser un estado mexicano antes que una provincia guatemalteca."
 

 # ==========================================
 # 3. LAWS & GOVERNMENT TYPES
 # ==========================================
 #law_land_reform_coffee_oligarchy: "Coffee Oligarchy Land Regime"
 #law_land_reform_coffee_oligarchy_desc: "Large coffee haciendas keep legal control of land and property; smallholders face high barriers to land ownership."
 #law_land_reform_communal_lands: "Communal Lands"
 #law_land_reform_communal_lands_desc: "Recognises community/communal land rights and customary tenure; reduces large-scale enclosure."
 #law_land_reform_banana_republic: "Banana Export Concessions"
 #law_land_reform_banana_republic_desc: "Legal framework that privileges export concessions and foreign companies in plantation agriculture."
 #law_land_reform_hacienda_system: "Hacienda Land Regime"
 #law_land_reform_hacienda_system_desc: "Large landed estates (haciendas) legally structured to supply regional markets and the export economy."
 # ==========================================
 # Law Group
 # ==========================================
 lawgroup_ca_state_structure:0 "Estructura del Estado"
 law_ca_departmental_state:0 "Departamento"
 law_ca_departmental_state_desc:0 "Bajo una república unitaria, este antiguo estado se gobierna como un departamento de la Unión. Sus gobernadores son nombrados por la capital, sus rentas fluyen al tesoro central y el resentimiento local crece."
 law_ca_sovereign_state:0 "Estado Soberano"
 law_ca_sovereign_state_desc:0 "Esta nación centroamericana se mantiene fuera de cualquier Unión y no responde a ninguna autoridad federal ni confederal."
 
 # ==========================================
 # Economic System (Source 9)
 # ==========================================
 law_central_american_agrarianism:0 "Agrarismo Agroexportador"
 law_central_american_agrarianism_desc:0 "Un modelo económico centrado en las exportaciones agrícolas, que beneficia principalmente a la élite terrateniente adinerada y a los agricultores comerciales que venden cultivos comerciales a mercados extranjeros."

 # ==========================================
 # Governance Principles (Source 10)
 # ==========================================
 law_ca_coffeacracia:0 "Cafetocracia"
 law_ca_coffeacracia_desc:0 "Un sistema político dominado por completo por la acaudalada oligarquía cafetalera exportadora, donde el Estado existe principalmente para servir a los intereses de las plantaciones y reprimir el descontento rural."

 law_ca_tecnocracy:0 "Tecnocracia Positivista"
 law_ca_tecnocracy_desc:0 "Un gobierno dirigido por élites intelectuales y científicos que impulsan la doctrina de «Orden y Progreso». Prioriza la modernización rápida y la asimilación cultural desde arriba."

 law_ca_junta:0 "Junta Militar Absoluta"
 law_ca_junta_desc:0 "Un duro régimen autoritario en el que las fuerzas armadas ostentan el poder absoluto, gobiernan por decreto y reprimen toda oposición política con puño de hierro."

 law_ca_consejo_junta:0 "Consejo de Junta"
 law_ca_consejo_junta_desc:0 "Un gobierno cívico-militar de transición que equilibra el poder de las fuerzas armadas con élites civiles e intelectuales, lo que da mayor estabilidad pero procesos políticos más lentos."

 # ==========================================
 # Land Reform (Source 11)
 # ==========================================
 law_land_reform_coffee_oligarchy:0 "Oligarquía Cafetalera"
 law_land_reform_coffee_oligarchy_desc:0 "Políticas agrarias diseñadas para consolidar el territorio en enormes y muy rentables plantaciones de café y tabaco, restringiendo la movilidad campesina para asegurar mano de obra barata."

 law_land_reform_communal_lands:0 "Tierras Comunales"
 law_land_reform_communal_lands_desc:0 "Un sistema tradicional en el que la tierra es poseída y trabajada comunalmente por el campesinado rural, protegiéndolo del avance de las grandes haciendas agrícolas."

 law_land_reform_banana_republic:0 "Concesiones Bananeras"
 law_land_reform_banana_republic_desc:0 "Vastas extensiones de tierra e infraestructura se conceden a compañías fruteras extranjeras, abaratando la construcción pero mermando el poder de los terratenientes nacionales tradicionales."

 law_land_reform_hacienda_system:0 "Sistema de Haciendas"
 law_land_reform_hacienda_system_desc:0 "Un sistema arcaico de propiedad de la tierra que restringe fuertemente la migración campesina, asegurando una mano de obra cautiva y local para las grandes haciendas aristocráticas."

 # ==========================================
 # Policing (Source 13)
 # ==========================================
 law_ca_policia_comunal:0 "Policía Comunal"
 law_ca_policia_comunal_desc:0 "El orden público lo gestionan localmente las comunidades rurales según sus costumbres tradicionales, empoderando al campesinado en lugar de a las autoridades del Estado central."

 # ==========================================
 # State Structure (Source 14)
 # ==========================================
 law_ca_central_american_federal:0 "República Federal"
 law_ca_central_american_federal_desc:0 "Una estructura estatal equilibrada en la que las provincias gozan de una autonomía local significativa sin dejar de ser leales a un gobierno federal central."

 law_ca_central_american_unitary:0 "República Unitaria"
 law_ca_central_american_unitary_desc:0 "Una estructura estatal altamente centralizada en la que toda autoridad emana de la capital. Otorga un gran poder central, pero a menudo provoca disturbios en las provincias periféricas."

 law_ca_central_american_confederated:0 "Confederación"
 law_ca_central_american_confederated_desc:0 "Una asociación laxa de Estados soberanos en la que el gobierno central prácticamente no tiene autoridad ni base tributaria; a menudo es el preludio de la disolución total."

 law_ca_federal_state:0 "Estado Federal"
 law_ca_federal_state_desc:0 "Esta nación funciona como un estado constituyente dentro de un sistema federal más amplio, equilibrando su autonomía local con sus obligaciones hacia el gobierno central."

 law_ca_confederated_state:0 "Estado Confederado"
 law_ca_confederated_state_desc:0 "Esta nación actúa como un estado muy independiente dentro de una confederación laxa, conservando sus ingresos fiscales y aportando muy poco a la autoridad central."

 law_ca_autonomous_state:0 "Estado Autónomo"
 law_ca_autonomous_state_desc:0 "Este estado goza de un autogobierno y una autonomía casi totales, y actúa de forma prácticamente independiente del poder central."

 # ==========================================
 # Army Model (Source 15)
 # ==========================================
 law_ca_comunal_milicia:0 "Milicia Comunal"
 law_ca_comunal_milicia_desc:0 "Las fuerzas armadas dependen de levas de campesinos locales reunidas a toda prisa y comandadas por la aristocracia terrateniente, lo que da una fuerza de combate barata pero inexperta."

 law_ca_caudillismo:0 "Caudillismo"
 law_ca_caudillismo_desc:0 "El ejército gira en torno a caudillos regionales carismáticos y sus leales levas campesinas, creando ejércitos privados fragmentados pero ferozmente leales que empoderan a la aristocracia."

 law_regionalist_militia:0 "Milicia Regionalista"
 law_regionalist_militia_desc:0 "La defensa se apoya en milicias regionales organizadas en lugar de un ejército federal profesional, fomentando la capacidad de defensa local y resistiendo la influencia del gobierno central."
 

 # ==========================================
 # MOVEMENT IDEOLOGIES (CENTRAL AMERICA)
 # ==========================================
 ideology_ca_unitarian_movement:0 "Movimiento Unitario"
 ideology_ca_unitarian_movement_desc:0 "#lore Este movimiento aboga por un Estado altamente centralizado gobernado directamente desde la capital, rechazando por completo el federalismo.#!"

 ideology_ca_federalist_movement:0 "Movimiento Federalista"
 ideology_ca_federalist_movement_desc:0 "#lore Esta facción busca mantener o restaurar la estructura federal, equilibrando un gobierno general con una fuerte autonomía local.#!"

 ideology_ca_autocratic_autonomist_movement:0 "Movimiento Autonomista Autocrático"
 ideology_ca_autocratic_autonomist_movement_desc:0 "#lore Un movimiento impulsado por caudillos locales que desean una soberanía regional gestionada con puño de hierro, libre de la supervisión central.#!"

 ideology_ca_separatist_movement:0 "Movimiento Separatista"
 ideology_ca_separatist_movement_desc:0 "#lore Localistas radicales que exigen la plena independencia de cualquier unión o confederación, priorizando las milicias y el gobierno locales.#!"

 ideology_central_american_reactionary_movement:0 "Movimiento Reaccionario"
 ideology_central_american_reactionary_movement_desc:0 "#lore Tradicionalistas que desean que la sociedad vuelva a sus raíces coloniales, empoderando a la Iglesia y a la policía local.#!"

 ideology_ca_liberal_movement:0 "Movimiento Reformista Radical"
 ideology_ca_liberal_movement_desc:0 "#lore Un feroz movimiento liberal que exige una economía de laissez-faire, sufragio universal y el desmantelamiento del viejo orden aristocrático.#!"

 ideology_ca_guilds_movement:0 "Movimiento Gremial"
 ideology_ca_guilds_movement_desc:0 "#lore Un movimiento económico tradicionalista que busca proteger a los artesanos y gremios locales mediante un estricto mercantilismo y proteccionismo.#!"

 ideology_ca_communalist_movement:0 "Movimiento Comunalista"
 ideology_ca_communalist_movement_desc:0 "#lore Un movimiento igualitario que lucha por abolir la esclavitud y el ejército profesional, favoreciendo las milicias locales y la justicia comunal.#!"

 ideology_ca_secularist_movement:0 "Movimiento Secularista"
 ideology_ca_secularist_movement_desc:0 "#lore Pensadores liberales centrados por completo en apartar a la Iglesia de los asuntos del Estado y promover la educación pública y laica.#!"

 ideology_ca_criollo_liberal_movement:0 "Movimiento Liberal Criollo"
 ideology_ca_criollo_liberal_movement_desc:0 "#lore Una facción liberal elitista que apoya reformas económicas y laborales, pero mantiene la exclusividad cultural para la clase criolla.#!"

 ideology_ca_artesanado_movement:0 "Movimiento Artesano"
 ideology_ca_artesanado_movement_desc:0 "#lore Muy centrado en proteger las industrias y los artesanos locales mediante el intervencionismo y aranceles elevados.#!"

 ideology_ca_agroexportadores_movement:0 "Movimiento Agroexportador"
 ideology_ca_agroexportadores_movement_desc:0 "#lore Impulsado por las élites del sector primario, este movimiento exige libre comercio para exportar sus cultivos comerciales a los mercados mundiales.#!"

 ideology_ca_colonialist_movement:0 "Movimiento Colonialista"
 ideology_ca_colonialist_movement_desc:0 "#lore Expansionistas que buscan explotar los territorios fronterizos y extraer riqueza mediante una colonización agresiva.#!"

 ideology_ca_enclavist_movement:0 "Movimiento Enclavista"
 ideology_ca_enclavist_movement_desc:0 "#lore Una facción totalmente dispuesta a entregar los recursos y la soberanía nacionales a corporaciones extranjeras a cambio de riqueza.#!"

 ideology_ca_radical_enclavist_movement:0 "Movimiento Enclavista Nacional"
 ideology_ca_radical_enclavist_movement_desc:0 "#lore Un movimiento corporativista extremo que exige la explotación total de los recursos por entidades extranjeras, unida a feroces políticas etnoestatales.#!"

 ideology_ca_constitutionalist_movement:0 "Movimiento Constitucionalista"
 ideology_ca_constitutionalist_movement_desc:0 "#lore Reformistas que priorizan el establecimiento de una constitución fuerte y democrática con sufragio ampliado y libertades civiles.#!"
