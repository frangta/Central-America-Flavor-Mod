 ig_huasos:0 "Huasos"
 ig_huasos_desc:0 "Los huasos son los campesinos y hábiles jinetes chilenos, que se encuentran generalmente en el valle central. Su vida gira en torno a la actividad agrícola."
 ig_gauchos:0 "Gauchos"
 ig_gauchos_desc:0 "Jinetes migratorios expertos en la ganadería tradicional. Dedican su vida a enlazar y criar ganado y caballos."
