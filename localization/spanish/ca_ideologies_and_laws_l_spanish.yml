 # ===================================================================
 # INDEPENDENT AND VARIANTS
 # ===================================================================
 law_ca_mandamientos:0 "Mandamientos"
 law_ca_mandamientos_desc:0 "Los pueblos indígenas están obligados a suministrar cuotas de jornaleros a las plantaciones. La cosecha queda asegurada, pero a un costo terrible para las comunidades."
 law_ca_municipalismo:0 "Municipalismo"
 law_ca_municipalismo_desc:0 "Los concejos municipales administran y gravan sus propios distritos. Los viejos cabildos actúan como contrapeso del poder de la capital."
 law_ca_escuela_laica:0 "Escuela Laica, Gratuita y Obligatoria"
 law_ca_escuela_laica_desc:0 "La educación primaria es gratuita, obligatoria y costeada por el Estado, con independencia de la Iglesia."
 law_ca_guardia_nacional:0 "Guardia Nacional"
 law_ca_guardia_nacional_desc:0 "Una fuerza militar y policial combinada, entrenada y armada por una potencia extranjera. Eficaz para mantener el orden, pero abre la puerta a la influencia extranjera."
 law_ca_federal_army:0 "Ejército Federal"
 law_ca_federal_army_desc:0 "Un ejército profesional que responde al gobierno federal y no a cada uno de los estados."

 # ===================================================================
 # AMENDMENTS - GENERIC
 # ===================================================================
 amendment_vagrancy_laws:0 "Leyes contra la Vagancia"
 amendment_vagrancy_laws_desc:0 "Quien no pueda demostrar que tiene empleo puede ser obligado a trabajar en las haciendas."
 amendment_jefes_politicos:0 "Jefes Políticos"
 amendment_jefes_politicos_desc:0 "Cada departamento está gobernado por un agente del Ejecutivo que manda su policía y su milicia."

 # ===================================================================
 # AMENDMENTS - HISTORICAL CONSTITUTIONS
 # ===================================================================
 amendment_costa_rica_1830s:0 "Ley Fundamental del Estado Libre"
 amendment_costa_rica_1830s_desc:0 "La carta fundacional del Estado Libre de Costa Rica."
 amendment_ca_bases_y_garantias:0 "Decreto de Bases y Garantías"
 amendment_ca_bases_y_garantias_desc:0 "El decreto de Braulio Carrillo de 1841 suprime las municipalidades y concentra el poder en un jefe de Estado perpetuo."
 amendment_free_costa_rica_reform:0 "Constitución de 1844"
 amendment_free_costa_rica_reform_desc:0 "Una nueva carta para el Estado Libre de Costa Rica que restablece el gobierno representativo."
 amendment_costa_rica_1st_republic:0 "Constitución de 1847"
 amendment_costa_rica_1st_republic_desc:0 "Costa Rica se proclama república, plenamente independiente de cualquier Unión."
 amendment_costa_rica_socialist_republic:0 "Pacto Nacional de los Trabajadores"
 amendment_costa_rica_socialist_republic_desc:0 "Obreros y campesinos se unen en un nuevo pacto social."
 amendment_nicaragua_1826:0 "Constitución de 1826"
 amendment_nicaragua_1826_desc:0 "La primera constitución del Estado de Nicaragua, inspirada en la Constitución de Cádiz."
 amendment_nicaragua_1838:0 "Constitución de 1838"
 amendment_nicaragua_1838_desc:0 "Una carta conservadora que separa a Nicaragua de la Federación."
 amendment_nicaragua_1858:0 "Constitución de 1858"
 amendment_nicaragua_1858_desc:0 "Tras la Guerra Nacional, los conservadores inauguran tres décadas de gobierno estable."
 amendment_nicaragua_1893:0 "La Libérrima"
 amendment_nicaragua_1893_desc:0 "La constitución liberal de José Santos Zelaya seculariza el Estado."
 amendment_nicaragua_1905:0 "Constitución de 1905"
 amendment_nicaragua_1905_desc:0 "Zelaya reescribe la constitución para mantenerse en el poder."
 amendment_nicaragua_1911:0 "Constitución de 1911"
 amendment_nicaragua_1911_desc:0 "Una restauración conservadora respaldada por los Estados Unidos."
 amendment_honduras_1839:0 "Constitución de 1839"
 amendment_honduras_1839_desc:0 "La primera carta de Honduras tras abandonar la Federación."
 amendment_honduras_1880:0 "Constitución de 1880"
 amendment_honduras_1880_desc:0 "La reforma liberal de Marco Aurelio Soto abre el país a la minería y la modernización."
 amendment_el_salvador_1824:0 "Constitución de 1824"
 amendment_el_salvador_1824_desc:0 "La primera constitución liberal del Estado de El Salvador dentro de la Federación."
 amendment_el_salvador_1841:0 "Constitución de 1841"
 amendment_el_salvador_1841_desc:0 "El Salvador abandona la Federación bajo la influencia de sus generales."
 amendment_el_salvador_1886:0 "Constitución de 1886"
 amendment_el_salvador_1886_desc:0 "La república cafetalera consolida el poder de las grandes familias."
 amendment_guatemala_1825:0 "Constitución de 1825"
 amendment_guatemala_1825_desc:0 "La constitución liberal del Estado de Guatemala durante la época federal."
 amendment_guatemala_1851:0 "Acta Constitutiva de 1851"
 amendment_guatemala_1851_desc:0 "El orden conservador de Rafael Carrera, aliado con la Iglesia."
 amendment_guatemala_1879:0 "Constitución de 1879"
 amendment_guatemala_1879_desc:0 "La reforma liberal de Justo Rufino Barrios: anticlericalismo y ferrocarriles."
 amendment_los_altos_1838:0 "Constitución de Los Altos"
 amendment_los_altos_1838_desc:0 "Quetzaltenango y el altiplano occidental proclaman su propio estado."
 amendment_chiapas_1826:0 "Constitución de Chiapas"
 amendment_chiapas_1826_desc:0 "La primera constitución de Chiapas."

 # ===================================================================
 # AMENDMENTS - CENTRAL AMERICAN LAWS
 # ===================================================================
 amendment_ca_libretas_jornaleros:0 "Libretas de Jornaleros"
 amendment_ca_libretas_jornaleros_desc:0 "Todo jornalero debe portar una libreta que registra sus deudas y su patrón."
 amendment_ca_exencion_fiscal:0 "Exención Fiscal a los Finqueros"
 amendment_ca_exencion_fiscal_desc:0 "Las fincas cafetaleras quedan exentas de la mayoría de los impuestos."
 amendment_ca_inversion_barones:0 "Inversión de los Barones del Café"
 amendment_ca_inversion_barones_desc:0 "Los barones del café pagan los caminos y puertos que transportan su cosecha."
 amendment_ca_darwinismo_social:0 "Darwinismo Social"
 amendment_ca_darwinismo_social_desc:0 "El Estado favorece la inmigración europea y trata a la mayoría indígena como un obstáculo para el progreso."
 amendment_ca_educacion_positivista:0 "Educación Positivista"
 amendment_ca_educacion_positivista_desc:0 "Las escuelas enseñan ciencia y deber cívico en lugar del catecismo."
 amendment_ca_fomento_cientifico:0 "Fomento Científico"
 amendment_ca_fomento_cientifico_desc:0 "Ingenieros del Estado dirigen el desarrollo de minas y talleres."
 amendment_ca_tribunales_militares:0 "Tribunales Militares"
 amendment_ca_tribunales_militares_desc:0 "Los civiles acusados de sedición son juzgados por consejos de guerra."
 amendment_ca_presupuesto_negro:0 "Presupuesto Negro"
 amendment_ca_presupuesto_negro_desc:0 "Una parte oculta del tesoro va a parar a los oficiales."
 amendment_ca_leva_suprema:0 "Leva Suprema"
 amendment_ca_leva_suprema_desc:0 "Todo hombre apto puede ser reclutado a la fuerza."
 amendment_ca_gabinete_transicion:0 "Gabinete de Transición"
 amendment_ca_gabinete_transicion_desc:0 "Ministros civiles comparten el gabinete con los generales."
 amendment_ca_pacto_generales:0 "Pacto de Generales"
 amendment_ca_pacto_generales_desc:0 "A los oficiales se les paga bien para que permanezcan en sus cuarteles."
 amendment_ca_amnistia_politica:0 "Amnistía Política"
 amendment_ca_amnistia_politica_desc:0 "Se permite el regreso de los exiliados y se libera a los presos."
 amendment_ca_justicia_consuetudinaria:0 "Justicia Consuetudinaria"
 amendment_ca_justicia_consuetudinaria_desc:0 "Los ancianos de los pueblos resuelven las disputas según la costumbre local."
