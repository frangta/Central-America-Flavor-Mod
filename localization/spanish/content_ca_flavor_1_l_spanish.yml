 je_ca_historic_situation_in_nicaragua:0 "La cuestión nicaragüense"
 je_ca_historic_situation_in_nicaragua_reason:0 "Nicaragua está dividida entre León y Granada, entre liberales y conservadores, mientras los caudillos locales luchan por el poder bajo la sombra cada vez más tenue de la Federación. Comerciantes extranjeros, élites regionales y jerarcas de la Iglesia compiten por decidir el destino de la nación. Que Nicaragua siga fiel a la causa centroamericana o busque la independencia marcará el destino del istmo."
 je_ca_historic_situation_in_costarica:0 "El dilema costarricense"
 je_ca_historic_situation_in_costarica_reason:0 "Lejos de los centros del poder federal, Costa Rica lleva mucho tiempo dividida entre el aislamiento y la lealtad a la unión. El estancamiento económico y las disputas con Guatemala por los impuestos y la representación han alimentado los pedidos de autonomía. San José y Cartago se disputan la supremacía, y la pregunta sigue en pie: ¿seguirá Costa Rica obedeciendo a una autoridad federal lejana o se abrirá su propio camino?"
 je_ca_historic_situation_in_elsalvador:0 "La lucha salvadoreña"
 je_ca_historic_situation_in_elsalvador_reason:0 "El Salvador, que fue el corazón de la Federación, enfrenta ahora una agitación creciente. La derrota de las fuerzas de Morazán y la influencia cada vez mayor de las facciones conservadoras amenazan con deshacer años de reformas liberales. Mientras la rebelión se extiende, el gobierno salvadoreño debe elegir entre sostener la bandera de la federación o abrazar la independencia nacional."
 je_ca_historic_situation_in_guatemala:0 "La crisis guatemalteca"
 je_ca_historic_situation_in_guatemala_reason:0 "Guatemala, sede de la capital federal, es el centro tanto de la autoridad como de la disidencia. Su poderosa Iglesia, sus élites arraigadas y sus levantamientos campesinos la han convertido en un campo de batalla de ideologías. El colapso del orden aquí significaría el fin de la federación misma, y los hombres fuertes y las facciones regionales ya se están repartiendo sus propios dominios."
 je_ca_situation_in_losaltos:0 "El surgimiento de Los Altos"
 je_ca_situation_in_losaltos_reason:0 "Las tierras altas de Quetzaltenango y Totonicapán se han declarado Estado de Los Altos y rechazan el dominio de la Ciudad de Guatemala. Inspirados por los ideales liberales y la autonomía económica, los altenses buscan ser reconocidos como una entidad federal separada. Su rebelión representa a la vez la esperanza de la reforma y el riesgo de la fragmentación total."
 je_ca_historic_situation_in_honduras:0 "La división hondureña"
 je_ca_historic_situation_in_honduras_reason:0 "Honduras, marcada por las guerras entre liberales y conservadores, se ha convertido en una tierra de lealtades cambiantes. Los caudillos regionales mandan en Comayagua y Tegucigalpa, mientras las tropas federales luchan por mantener la unidad. A medida que los estados vecinos se separan, Honduras está en una encrucijada: luchar por la supervivencia de la Federación o reclamar su propia soberanía."
 je_historic_central_america_falls_apart:0 "La caída de la Federación Centroamericana"
 je_historic_central_america_falls_apart_reason:0 "El sueño de una Centroamérica unida se desmorona. Años de divisiones internas, rivalidades regionales y luchas entre liberales y conservadores han llevado a la Federación al borde de la disolución. Las guerras civiles, los movimientos separatistas y la intromisión extranjera amenazan con despedazar lo que queda de la República Federal.\n\nMientras la agitación se extiende por Guatemala, El Salvador, Honduras, Nicaragua y Costa Rica, el gobierno central debe decidir si mantiene la unidad mediante reformas o lucha por preservar el viejo orden. Cada mes trae nuevas rebeliones, nuevas declaraciones de independencia y la esperanza cada vez más débil de una Centroamérica unida."
 je_central_american_fragile_unity_reason:0 "La República Federal sigue en pie, pero a duras penas. Los Estados obedecen al gobierno federal cuando les conviene, retienen sus contingentes y levantan sus propias tropas. Cada crisis pone a prueba si la unión jurada en 1824 aguantará un año más."
 je_ca_federalists_vs_separatists_situation:0 "Federalistas contra separatistas"
 je_ca_federalists_vs_separatists_situation_reason:0 "Dos bandos se disputan el futuro de nuestro Estado. Los #bold federalistas#! (oficiales liberales, partidarios de Morazán y comerciantes que ganan con el mercado común) quieren seguir en la República. Los #bold separatistas#! (notables locales, el clero y caudillos que resienten las contribuciones y levas federales) exigen gobernarse solos.\n\nCada elección, golpe y guerra mueve la balanza. Si se imponen los federalistas, el Estado sigue en la Federación; si se imponen los separatistas, se separa."
