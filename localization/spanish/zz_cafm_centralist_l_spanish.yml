l_spanish:
 # CAFM - Ruta centralista de la UCA (18 nov 2026)
 je_ca_centralist_republic:0 "La República una e indivisible"
 je_ca_centralist_republic_reason:0 "Los centralistas quieren lo que la Constitución de 1824 nunca dio: un solo gobierno, una sola capital y un ejército que obedezca a la Unión y no a los Estados. Para imponerla hay que ganarse antes al ejército, encontrar aliados en los Estados y apartar a Morazán del poder.

Cada paso acerca la República unitaria y a la vez alimenta la resistencia: primero la de los liberales y los federalistas; después, la de los separatistas. Hay que llegar antes que ellos."
 je_ca_centralist_status_objectives:0 "#bold Fase I: La mano dura#!
Antes de imponer la Unión hay que preparar el terreno: ganarse al ejército, buscar apoyo en los Estados, hacer propaganda y apartar a Morazán del poder. Hasta entonces, el Congreso no se puede disolver."
 je_ca_centralist_status_crisis:0 "#bold La República se tambalea#!
La capital apenas gobierna fuera de sus murallas. Si la unidad llega a cero, la Federación se rompe."
 je_ca_centralist_unity_full_tt:0 "La unidad de la República llega a #bold 100#!"
 je_ca_centralist_unity_b_tt:0 "La unidad de la República es de al menos #bold 40#!"
 je_ca_centralist_unity_zero_tt:0 "La unidad de la República cae a #bold 0#!"
 je_ca_centralist_fail_separatist_tt:0 "Tras aparecer los separatistas, #bold 3#! de los 5 Estados están Rebeldes o separados"
 je_ca_centralist_deadline_tt:0 "Llega el #bold 1 de enero de 1845#!"
 ca_frca_unity_bar_name:0 "Unidad de la República"
 ca_frca_unity_bar_desc:0 "Cuánto de la República gobierna de verdad la capital. A #bold 80#! empieza la fase IV; a #bold 100#!, la República unitaria."
 ca_frca_unity_bar_desc2:0 "La sube cada imposición: botones, leyes y Estados leales. La bajan los Estados rebeldes y separados, los intelectuales en el gobierno y los federalistas."
 ca_frca_unity_bar_left:0 "Unidad"
 ca_frca_unity_bar_right:0 "República unitaria"
 ca_cen_army_bar_left:0 "Ejército federal"
 ca_cen_army_bar_right:0 "Ejército centralista"
 CA_CEN_UNITY_LAW_UNITARY:0 "Ley unitaria en vigor"
 CA_CEN_UNITY_ARMY_GOV:0 "El ejército #bold centralista#! está en el gobierno"
 CA_CEN_UNITY_LOYAL:0 "Estados leales"
 CA_CEN_UNITY_REBEL:0 "Estados rebeldes"
 CA_CEN_UNITY_SEPARATED:0 "Estados separados"
 CA_CEN_UNITY_INTELLIGENTSIA:0 "Los intelectuales están en el gobierno"
 CA_CEN_UNITY_RIVAL:0 "Los federalistas dominan el gobierno (−50 o menos)"
 ca_frca_cvf_bar_name:0 "Quién manda en la República"
 ca_cen_army_bar_name:0 "Apoyo del ejército"
 ca_cen_army_bar_desc:0 "A #bold 100#! el ejército abraza el centralismo."
 ca_cen_army_bar_desc2:0 "Mientras Morazán mande el ejército, la mayoría de los oficiales le seguirá siendo fiel."
 CA_CEN_ARMY_GENERALS:0 "Generales unitarios"
 CA_CEN_ARMY_GOV:0 "El ejército está en el gobierno"
 CA_CEN_ARMY_HAPPY:0 "El ejército está contento"
 CA_CEN_ARMY_ANGRY:0 "El ejército está descontento"
 CA_CEN_ARMY_MORAZAN:0 "Morazán manda el ejército"
 ca_cen_button_reorganize:0 "Reorganizar a los centralistas"
 ca_cen_button_reorganize_desc:0 "Reunir a los oficiales afines, pagar sus deudas y prometer ascensos. Apoyo del ejército +10."
 ca_cen_button_propaganda:0 "Propaganda centralista"
 ca_cen_button_propaganda_desc:0 "Periódicos, sermones y hojas sueltas a favor de una sola República."
 ca_cen_button_propaganda_tt:0 "Durante un año: más apoyo al movimiento unitario y más poder centralista. La presión separatista baja."
 ca_cen_button_conspiracy:0 "Conspiración contra Morazán"
 ca_cen_button_conspiracy_desc:0 "Una bala en la noche resolvería muchas cosas. Si falla, el escándalo nos perseguirá."
 ca_cen_button_coup:0 "Preparar el golpe"
 ca_cen_button_coup_desc:0 "Los cuarteles están con nosotros. Falta elegir el día."
 ca_cen_button_campaign:0 "Campaña unitaria"
 ca_cen_button_campaign_desc:0 "Ganar votos para la elección federal del 1 de junio de 1838. Cada campaña suma puntos a los centralistas (máximo 3)."
 ca_cen_button_dissolve_congress_desc:0 "Cerrar el Congreso federal. Se acaba la parálisis: el gobierno podrá aprobar leyes. Empieza la fase II."
 ca_cen_can_conspire_tt:0 "Hay al menos un general unitario, o el poder centralista es de al menos 45"
 ca_cen_army_won_tt:0 "El ejército se ha pasado al centralismo (objetivo 1)"
 ca_cen_campaign_max_tt:0 "Menos de 3 campañas"
 ca_cen_morazan_removed_tt:0 "Morazán ya no está en el poder (objetivo 4)"
 ca_cen_paralysis_lifted_tt:0 "Se acaba la #bold parálisis federal#!: el gobierno puede aprobar leyes"
 ca_cen_propaganda:0 "Propaganda centralista"
 ca_cen_propaganda_desc:0 "Los púlpitos y la prensa afín piden una sola República."
 ca_cen_morazan_martyr:0 "Morazán, mártir"
 ca_cen_morazan_martyr_desc:0 "La muerte de Morazán ha convertido su causa en una bandera."
 ca_cen_army_neutral:0 "Al margen de la campaña"
 ca_cen_army_neutral_desc:0 "El ejército no interviene en la elección federal."
 cafm_cen.1.t:0 "El ejército cambia de bando"
 cafm_cen.1.d:0 "Los oficiales ya no brindan por la Constitución de 1824 sino por una sola República. En los cuarteles se dice que la patria necesita un gobierno fuerte, y que los Estados han tenido demasiado tiempo para demostrar que no saben gobernarse."
 cafm_cen.1.f:0 "«Un solo gobierno, una sola espada.»"
 cafm_cen.1.a:0 "El ejército es nuestro"
 cafm_cen.1.a_tt:0 "Las Fuerzas Armadas adoptan la ideología #bold centralista#!"
 cafm_cen.2.t:0 "Aliados en los Estados"
 cafm_cen.2.d:0 "No todos los Estados quieren la soberanía que les dio 1824. Algunos gobiernos ven en la capital un escudo contra los caudillos locales y las guerras de vecinos, y empiezan a mirar a la Unión con buenos ojos."
 cafm_cen.2.f:0 "«Mejor un gobierno lejano que diez tiranos cercanos.»"
 cafm_cen.2.a:0 "Contamos con ellos"
 cafm_cen.3.t:0 "La conspiración"
 cafm_cen.3.d_success:0 "Los conjurados cumplieron. Morazán ha muerto y un general unitario ha tomado el mando antes de que nadie pudiera reaccionar. Sus partidarios ya lo llaman mártir."
 cafm_cen.3.d_failure:0 "La conspiración fue descubierta. Los conjurados huyeron o están presos, y la prensa liberal publica los nombres de quienes pagaron. El escándalo salpica a todo el partido centralista."
 cafm_cen.3.f:0 "«Las balas no siempre van adonde se las manda.»"
 cafm_cen.3.a:0 "Que se cumpla la voluntad de la República"
 cafm_cen.3.b:0 "Negarlo todo"
 cafm_cen.4.t:0 "El golpe se prepara"
 cafm_cen.4.d:0 "Los jefes de los cuarteles han dado su palabra. Falta decidir cuánto dinero y cuánta prisa poner en ello."
 cafm_cen.4.f:0 "«El que pega primero pega dos veces.»"
 cafm_cen.4.a:0 "Con lo que tenemos basta"
 cafm_cen.4.b:0 "Comprar a los indecisos"
 cafm_cen.5.t:0 "Rumores en los cuarteles"
 cafm_cen.5.d:0 "Se habla demasiado en las cantinas. Algunos oficiales dudan y otros piden garantías antes de comprometerse."
 cafm_cen.5.f:0 "«Tres pueden guardar un secreto si dos están muertos.»"
 cafm_cen.5.a:0 "Pagar su silencio"
 cafm_cen.5.b:0 "Apartar a los dudosos"
 cafm_cen.5.c:0 "Esperar a que se calme"
 cafm_cen.6.t:0 "El golpe"
 cafm_cen.6.d:0 "Al amanecer, las tropas ocuparon el palacio. Morazán ha salido al destierro y un general unitario gobierna la República."
 cafm_cen.6.f:0 "«La patria no se discute: se manda.»"
 cafm_cen.6.a:0 "Gobernar por decreto"
 cafm_cen.6.b:0 "Mantener las formas de la República"
 cafm_cen.7.t:0 "El golpe, descubierto"
 cafm_cen.7.d:0 "Morazán supo del complot a tiempo. Los oficiales comprometidos han sido destituidos y los federalistas salen a la calle a defender la Constitución."
 cafm_cen.7.f:0 "«Ha fallado. Habrá que esperar.»"
 cafm_cen.7.a:0 "Tiempos peores vendrán para ellos"
 cafm_cen.8.t:0 "La elección federal de 1838"
 cafm_cen.8.d_won:0 "Los votos han hablado: el candidato centralista gana la presidencia de la República. Morazán deja el poder y se marcha de la capital."
 cafm_cen.8.d_lost:0 "Morazán vuelve a ganar. Los federalistas celebran en las calles y la oposición centralista tendrá que buscar otro camino."
 cafm_cen.8.f:0 "«Las urnas también son un campo de batalla.»"
 cafm_cen.8.a:0 "Una nueva República empieza hoy"
 cafm_cen.8.b:0 "No será la última palabra"
 cafm_cen.9.t:0 "La espada y la urna"
 cafm_cen.9.d:0 "Se acerca la elección federal. Mientras Morazán mande el ejército, los cuarteles votarán por él. Los centralistas exigen que la tropa se mantenga al margen de la campaña."
 cafm_cen.9.f:0 "«Un soldado no vota: obedece.»"
 cafm_cen.9.a:0 "Que los cuarteles callen"
 cafm_cen.9.a_tt:0 "Durante la campaña, el ejército pierde peso político y la elección la decide el poder de los bandos"
 cafm_cen.10.t:0 "Morazán contraataca"
 cafm_cen.10.d:0 "Morazán sigue en el poder y ya no disimula: destituye a los funcionarios centralistas, llama a los Estados a defender la Constitución y los liberales vuelven a llenar las plazas."
 cafm_cen.10.f:0 "«Mientras yo viva, la Federación vive.»"
 cafm_cen.10.a:0 "Hemos llegado tarde"
 cafm_cen.11.t:0 "Aparecen los separatistas"
 cafm_cen.11.d:0 "Ya no se pide más autonomía: en algunos Estados se habla abiertamente de romper con la Unión. Las élites locales, cansadas de intendentes y estancos, empiezan a organizarse por su cuenta."
 cafm_cen.11.f:0 "«Si la capital no nos escucha, que se quede sola.»"
 cafm_cen.11.a:0 "Que vengan"
 cafm_cen.11.a_tt:0 "Desde ahora pueden salir los separatismos de los Estados, y la revuelta separatista puede hacer fracasar el diario"
 cafm_cen.12.t:0 "La ley de la República unitaria"
 cafm_cen.12.d:0 "Sin Congreso que la detenga, la ley que convierte a los Estados en departamentos está lista para promulgarse."
 cafm_cen.12.f:0 "«Una sola ley para toda la nación.»"
 cafm_cen.12.a:0 "Promulgarla"
 cafm_cen.12.b:0 "Todavía no"
 cafm_cen.13.t:0 "La Guardia Nacional"
 cafm_cen.13.d:0 "Las milicias de los Estados obedecen a sus gobernadores. Una Guardia Nacional con oficiales de carrera obedecería solo a la República."
 cafm_cen.13.f:0 "«Un ejército, una bandera.»"
 cafm_cen.13.a:0 "Crear la Guardia Nacional"
 cafm_cen.13.b:0 "Todavía no"
 cafm_cen.14.t:0 "La religión del Estado"
 cafm_cen.14.d:0 "Con el concordato firmado, el clero pide que la fe católica sea la religión de la República."
 cafm_cen.14.f:0 "«Dios y la patria, una sola causa.»"
 cafm_cen.14.a:0 "Que así sea"
 cafm_cen.14.b:0 "Todavía no"
