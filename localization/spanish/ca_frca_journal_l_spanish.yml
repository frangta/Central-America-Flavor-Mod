l_spanish:
 # CAFM - F3 - Diario de la Federacion: fases, desenlaces y tooltips
 je_frca_status_federal_1:0 "#bold Fase I: La crisis#!\nLas reformas liberales de la Federación dividen a los Estados. El Congreso debate mientras las provincias se inquietan. Mantén leales a los Estados hasta que el Congreso Federal se reúna en 1838."
 je_frca_status_federal_2:0 "#bold Fase II: La desintegración#!\nEl Congreso ha permitido que los Estados se organicen como quieran. Uno por uno ponen a prueba cuánto puede doblarse la Unión antes de romperse."
 je_frca_status_federal_3:0 "#bold Fase III: La guerra#!\nLos Estados han tomado las armas contra el gobierno federal. El destino de la República se decidirá en el campo de batalla."
 je_frca_status_federal_4:0 "#bold Fase IV: La resistencia#!\nLa Federación sigue en pie, pero las potencias extranjeras, el clero conservador y los caudillos locales presionan en todos los frentes. Resiste hasta 1845."
 je_frca_status_centralist_1:0 "#bold Fase I: La mano dura#!\nEl gobierno quiere una sola República gobernada desde una capital. Los Estados resienten a cada intendente federal enviado a gobernarlos."
 je_frca_status_centralist_2:0 "#bold Fase II: El Congreso silenciado#!\nEl Congreso federal ya no existe. Sin un foro para sus quejas, los Estados responden al gobierno central con desafío."
 je_frca_status_centralist_3:0 "#bold Fase III: La guerra de la Unión#!\nLa República será una e indivisible, aunque haya que sostenerla con bayonetas."
 je_frca_status_centralist_4:0 "#bold Fase IV: La República de hierro#!\nLa Unión se ha impuesto, pero sus enemigos no han desaparecido. Las potencias extranjeras y los generales ambiciosos esperan la primera señal de debilidad."
 je_frca_status_crisis:0 "#bold #N ¡La Federación se desmorona!#!#!\nEl apoyo a la Unión ha caído por debajo de 50. Sin Estados leales y sin una acción decidida, la República no sobrevivirá."

 je_frca_outcome_a_tt:0 "#bold La República sobrevive#! (1 de enero de 1845):"
 je_frca_outcome_b_tt:0 "#bold La unión por la espada#! (1 de enero de 1845):"
 je_frca_outcome_c_tt:0 "#bold La Confederación#! (solo en la ruta federal):"
 je_frca_not_won_war_tt:0 "La Unión no se ha restaurado por la fuerza de las armas"
 je_frca_core_regions_tt:0 "Posee al menos un estado en cada uno de Guatemala, El Salvador, Honduras, Nicaragua y Costa Rica"
 je_frca_fronts_lost_max_1_tt:0 "No se ha perdido más de 1 frente de la Resistencia"
 je_frca_fronts_lost_max_2_tt:0 "No se han perdido más de 2 frentes de la Resistencia"
 je_frca_diet_signed_tt:0 "La Dieta de los Estados ha firmado el Pacto de Confederación"
 je_frca_fail_independent_tt:0 "3 o más de los cinco Estados principales son plenamente independientes"
 je_frca_fail_recognized_tt:0 "El gobierno federal ha reconocido la independencia de un Estado principal"
 je_frca_fail_exile_tt:0 "Morazán se ha ido al exilio"
 je_frca_timeout_d2_tt:0 "Sin victoria, unión ni confederación, la Federación se desvanece en paz."
