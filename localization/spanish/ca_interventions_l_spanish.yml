 ca_central_america.35.t:0 "Intervención federal en Costa Rica"
 ca_central_america.35.d_ok:0 "La expedición federal ha entrado en San José. Carrillo se ha visto obligado a apartarse y un jefe de Estado unionista ha ocupado su lugar."
 ca_central_america.35.d_ko:0 "La expedición federal ha fracasado en el Valle Central. Carrillo sale más fuerte que nunca y sus partidarios se burlan de la debilidad de la Federación."
 ca_central_america.35.f:0 "La guerra decide lo que el Congreso no pudo."
 ca_central_america.35.a:0 "Dejar una guarnición federal."
 ca_central_america.35.b:0 "Retirar las tropas."
 ca_central_america.35.c:0 "Replegarse."
 ca_central_america.35.e:0 "Enviar refuerzos."
 ca_central_america.36.t:0 "Intervención federal en Honduras"
 ca_central_america.36.d_ok:0 "Las tropas federales han restablecido el orden en Comayagua. Ferrera y sus hombres han sido expulsados del campo y no molestarán al Estado por un tiempo."
 ca_central_america.36.d_ko:0 "La campaña federal en Honduras ha fracasado. Ferrera se ha impuesto y su prestigio entre los soldados crece."
 ca_central_america.36.f:0 "La guerra decide lo que el Congreso no pudo."
 ca_central_america.36.a:0 "Dejar una guarnición federal."
 ca_central_america.36.b:0 "Retirar las tropas."
 ca_central_america.36.c:0 "Replegarse."
 ca_central_america.36.e:0 "Enviar refuerzos."
 ca_central_america.37.t:0 "Intervención federal en Nicaragua"
 ca_central_america.37.d_ok:0 "El ejército federal ha asegurado León, que ahora es un bastión de la Unión en Nicaragua."
 ca_central_america.37.d_ko:0 "La intervención federal ha fracasado. La vieja guerra entre León y Granada vuelve a encenderse."
 ca_central_america.37.f:0 "La guerra decide lo que el Congreso no pudo."
 ca_central_america.37.a:0 "Dejar una guarnición federal."
 ca_central_america.37.b:0 "Retirar las tropas."
 ca_central_america.37.c:0 "Replegarse."
 ca_central_america.37.e:0 "Enviar refuerzos."
 ca_central_america.38.t:0 "Intervención federal en El Salvador"
 ca_central_america.38.d_ok:0 "El ejército federal ha aplastado a los rebeldes en los alrededores de San Salvador. El Estado vuelve a ser el baluarte de la Federación."
 ca_central_america.38.d_ko:0 "La intervención federal en El Salvador ha fracasado, y los separatistas se envalentonan en la propia sede de la Unión."
 ca_central_america.38.f:0 "La guerra decide lo que el Congreso no pudo."
 ca_central_america.38.a:0 "Dejar una guarnición federal."
 ca_central_america.38.b:0 "Retirar las tropas."
 ca_central_america.38.c:0 "Replegarse."
 ca_central_america.38.e:0 "Enviar refuerzos."
 ca_central_america.39.t:0 "Intervención federal en Guatemala"
 ca_central_america.39.d_ok:0 "Las tropas federales han dispersado las bandas de Carrera y han recuperado el control del campo guatemalteco. Por ahora."
 ca_central_america.39.d_ko:0 "El ejército federal ha sido derrotado en las montañas de Guatemala. El poder de Carrera crece y los conservadores ya no temen a la Unión."
 ca_central_america.39.f:0 "La guerra decide lo que el Congreso no pudo."
 ca_central_america.39.a:0 "Dejar una guarnición federal."
 ca_central_america.39.b:0 "Retirar las tropas."
 ca_central_america.39.c:0 "Replegarse."
 ca_central_america.39.e:0 "Enviar refuerzos."
 ca_central_america.40.t:0 "Intervención federal en Los Altos"
 ca_central_america.40.d_ok:0 "Las tropas federales han llegado a Quetzaltenango y han asegurado el Sexto Estado frente a sus enemigos."
 ca_central_america.40.d_ko:0 "La columna federal de socorro no ha logrado llegar a los Altos. Los Altos está solo, expuesto a los ejércitos de Guatemala."
 ca_central_america.40.f:0 "La guerra decide lo que el Congreso no pudo."
 ca_central_america.40.a:0 "Dejar una guarnición federal."
 ca_central_america.40.b:0 "Retirar las tropas."
 ca_central_america.40.c:0 "Replegarse."
 ca_central_america.40.e:0 "Enviar refuerzos."
 ca_central_america.35.ok_tt:0 "Carrillo es #bold depuesto#! y vuelve un jefe de Estado unionista."
 ca_central_america.36.ok_tt:0 "#bold Ferrera#! queda fuera de la política hondureña durante #bold 2 años#!."
 ca_central_america.37.ok_tt:0 "#bold León#! se convierte en un bastión federal en Nicaragua."
 ca_central_america.38.ok_tt:0 "#bold Bastión federal#!: la lealtad de El Salvador no puede bajar de Vacilante durante #bold 24 meses#!."
 ca_central_america.39.ok_tt:0 "Carrera ha sido rechazado, al menos por un tiempo."
 ca_central_america.40.ok_tt:0 "Los Altos está a salvo de Guatemala, por ahora."
 ca_central_america.reinforce_ok_tt:0 "Si los refuerzos vencen, el Estado queda #bold pacificado#!."
 ca_central_america.reinforce_ko_tt:0 "Si vuelven a fracasar, el Estado cae en #N crisis#! y puede deslizarse hacia la #N guerra civil#!."
 ca_central_america.41.t:0 "Intervención denegada"
 ca_central_america.41.d:0 "El gobierno federal se ha negado a enviar ayuda a [SCOPE.sCountry('ca_target').GetName]. Los oficiales refunfuñan por la inacción y el Estado recordará quién lo abandonó."
 ca_central_america.41.f:0 "Nuestros recursos son demasiado escasos para todos."
 ca_central_america.41.a:0 "Es lo mejor."
 ca_central_america.41.b:0 "Enviar un emisario a dar explicaciones."
 ca_central_america.41.b_tt:0 "El emisario tiene un #bold 50%#! de probabilidad de evitar las consecuencias en el Estado."
 ca_intervention_cooldown_tt:0 "La Federación ha rechazado una intervención en los últimos 180 días."
 ca_request_intervention_button_name:0 "Responder a una petición de intervención"
 ca_request_intervention_button_desc:0 "Un Estado miembro ha pedido ayuda a la Federación contra sus separatistas."
 ca_central_america.63.t:0 "Guerra civil en Nicaragua"
 ca_central_america.63.d:0 "León y Granada vuelven a estar en guerra. Liberales y conservadores, federalistas y separatistas, han tomado las armas en todo el Estado."
 ca_central_america.63.f:0 "Hermano contra hermano."
 ca_central_america.63.a:0 "Combatir a los rebeldes."
 ca_central_america.63.b:0 "Pedir ayuda a la Federación."
 ca_central_america.63.c:0 "Negociar con ellos."
 ca_central_america.65.t:0 "Guerra civil en Costa Rica"
 ca_central_america.65.d:0 "Las rencillas del Valle Central se han convertido en guerra abierta. Las ciudades de Costa Rica están divididas entre los amigos y los enemigos de la Federación."
 ca_central_america.65.f:0 "Hermano contra hermano."
 ca_central_america.65.a:0 "Combatir a los rebeldes."
 ca_central_america.65.b:0 "Pedir ayuda a la Federación."
 ca_central_america.65.c:0 "Negociar con ellos."
 ca_central_america.67.t:0 "Guerra civil en Honduras"
 ca_central_america.67.d:0 "Bandas armadas leales a caudillos rivales combaten por toda Honduras. El destino del Estado, y su lugar en la Unión, se decidirá por la fuerza."
 ca_central_america.67.f:0 "Hermano contra hermano."
 ca_central_america.67.a:0 "Combatir a los rebeldes."
 ca_central_america.67.b:0 "Pedir ayuda a la Federación."
 ca_central_america.67.c:0 "Negociar con ellos."
 ca_central_america.69.t:0 "Guerra civil en Guatemala"
 ca_central_america.69.d:0 "Los ejércitos campesinos de las montañas se han alzado contra el gobierno. El nombre de Carrera está en todas las bocas y el campo está en llamas."
 ca_central_america.69.f:0 "Hermano contra hermano."
 ca_central_america.69.a:0 "Combatir a los rebeldes."
 ca_central_america.69.b:0 "Pedir ayuda a la Federación."
 ca_central_america.69.c:0 "Negociar con ellos."
 ca_central_america.71.t:0 "Guerra civil en El Salvador"
 ca_central_america.71.d:0 "El corazón de la Federación se desgarra. Unionistas y separatistas combaten en las calles de San Salvador y en todo el Estado."
 ca_central_america.71.f:0 "Hermano contra hermano."
 ca_central_america.71.a:0 "Combatir a los rebeldes."
 ca_central_america.71.b:0 "Pedir ayuda a la Federación."
 ca_central_america.71.c:0 "Negociar con ellos."
 ca_central_america.73.t:0 "Guerra en los Altos"
 ca_central_america.73.d:0 "Tropas guatemaltecas y bandas conservadoras marchan sobre Quetzaltenango. El Sexto Estado debe luchar por su supervivencia."
 ca_central_america.73.f:0 "Hermano contra hermano."
 ca_central_america.73.a:0 "Combatir a los rebeldes."
 ca_central_america.73.b:0 "Pedir ayuda a la Federación."
 ca_central_america.73.c:0 "Negociar con ellos."
 ca_central_america.116.t:0 "Los Altos piden ayuda"
 ca_central_america.116.d:0 "Enviados de Quetzaltenango han llegado a la capital federal. Guatemala marcha sobre el Sexto Estado y Los Altos ruega a la Federación armas y hombres."
 ca_central_america.116.f:0 "«No abandonen al Sexto Estado.»"
 ca_central_america.116.a:0 "Enviar ayuda a los Altos."
 ca_central_america.116.b:0 "No podemos dividir Guatemala."
