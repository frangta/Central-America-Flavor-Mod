l_spanish:
 # CAFM - F7 - Intervenciones y guerras civiles de los estados
 ca_central_america.28.t:0 "Nicaragua pide intervención federal"
 ca_central_america.28.d:0 "El gobierno de Nicaragua ya no puede contener solo a los separatistas y pide ayuda a la Federación. Sus enviados hablan de bandas armadas en el campo y de una capital que quizá no resista mucho más."
 ca_central_america.28.f:0 "«Sin la Unión no habrá orden.»"
 ca_central_america.28.a:0 "Enviar el ejército federal."
 ca_central_america.28.b:0 "Enviar dinero y armas."
 ca_central_america.28.c:0 "Ignorar la petición."
