l_spanish:
 # CAFM - diarios, botones, modificadores y nombres de NIC/HON/MKT (10 nov 2026)
 cafm_Patrick:0 "Patrick"
 cafm_Silvestre:0 "Silvestre"
 cafm_Madriz:0 "Madriz"
 je_ca_nic_division:0 "León contra Granada"
 je_ca_nic_division_lobby:0 "Las dos ciudades que forman Nicaragua no se ponen de acuerdo en quién la gobierna."
 je_ca_nic_division_reason:0 "León es liberal, comercial y ruidosa; Granada es terrateniente, clerical y paciente. Cada elección, cada nombramiento y cada guerra desde 1821 las han leído las dos como una jugada contra la otra."
 je_ca_nic_division_status_guerra:0 "Legitimistas y Democráticos, con ejércitos. Esto ya no es política."
 je_ca_nic_division_status_ruptura:0 "Cada ciudad tiene su gobierno y su tesoro."
 je_ca_nic_division_status_tension:0 "La rivalidad es pública, y los dos bandos están contando fusiles."
 je_ca_nic_division_status_baja:0 "León y Granada están de pleito, como siempre, y nada más que eso."
 je_ca_nic_division_conclusion_managua:0 "La sede del gobierno está en un pueblo que no es de ninguna de las dos ciudades. No es una reconciliación, pero va a aguantar."
 je_ca_nic_division_conclusion_guerra:0 "El pleito se ha vuelto guerra, y la guerra va a durar más que todos los que la empezaron."
 je_ca_nic_fonseca:0 "El Gran Mariscal"
 je_ca_nic_fonseca_lobby:0 "El mando general del ejército se está volviendo el gobierno del Estado."
 je_ca_nic_fonseca_reason:0 "A Casto Fonseca le dieron el ejército los políticos de León, que creían que lo iban a tener ellos. Él cobra las levas, él cerró la prensa y él cerró las escuelas."
 je_ca_nic_fonseca_status_dictadura:0 "Levas a bayoneta, sin prensa y sin escuelas."
 je_ca_nic_fonseca_status_mariscal:0 "Se hace llamar Gran Mariscal, y nadie lo corrige."
 je_ca_nic_fonseca_status_mando:0 "El ejército le responde a Fonseca, no al Director."
 je_ca_nic_fonseca_status_baja:0 "Hay un mando general, y todavía le rinde cuentas al gobierno."
 je_ca_nic_fonseca_conclusion_caido:0 "El mariscal ya no está. Lo que venga después, no será él."
 je_ca_nic_fonseca_conclusion_mariscal:0 "Nicaragua le pertenece a su Gran Mariscal."
 je_ca_nic_transito:0 "La ruta del tránsito"
 je_ca_nic_transito_lobby:0 "El río San Juan y el istmo de Rivas son el camino más corto entre dos océanos."
 je_ca_nic_transito_reason:0 "Quien tenga la boca del San Juan tiene la ruta. Ahora mismo la tiene un rey misquito con un cónsul británico, y dos imperios están pujando por lo que queda."
 je_ca_nic_transito_status_ruta:0 "La ruta funciona y nos paga por pasajero."
 je_ca_nic_transito_status_contrato:0 "Hay contrato firmado y una compañía trabajando."
 je_ca_nic_transito_status_interes:0 "Las potencias se han fijado en el río. Eso ya vale algo por sí solo."
 je_ca_nic_transito_status_bajo:0 "Un río, un lago y doce leguas de camino, y nadie pagando por ninguno."
 je_ca_nic_transito_conclusion_nuestra:0 "La ruta está abierta y los peajes son nuestros."
 je_ca_nic_transito_conclusion_ajena:0 "El camino entre los océanos pasa por nuestro territorio y lo administran otros."
 je_ca_hon_republica:0 "El nacimiento de la República"
 je_ca_hon_republica_lobby:0 "Honduras ha salido de la Federación y tiene que volverse un Estado por su cuenta."
 je_ca_hon_republica_reason:0 "Una constitución, un tesoro, un puerto, una escuela y un clero en paz con el gobierno. Honduras no tiene ninguna de esas cosas en 1838 y va a necesitar todas."
 je_ca_hon_republica_status_nacion:0 "Una constitución, una universidad y un puerto propio. Esto es un país."
 je_ca_hon_republica_status_estado:0 "Hay constitución y hay un gobierno que dura más que su presidente."
 je_ca_hon_republica_status_papel:0 "Una república de papel, gobernada desde donde esté parado el presidente."
 je_ca_hon_republica_conclusion_hecha:0 "Honduras es una república de hecho y no solo en el decreto que la fundó."
 je_ca_hon_republica_conclusion_papel:0 "Nueve años y dos constituciones, y el Estado sigue siendo lo que diga el general de la semana."
 je_ca_hon_costa:0 "La costa que no gobernamos"
 je_ca_hon_costa_lobby:0 "De Trujillo a Cabo Gracias a Dios no hay aduana ni guarnición."
 je_ca_hon_costa_reason:0 "Las compañías de caoba de Belice trabajan nuestros ríos y no le pagan a nadie, el reino misquito reclama la costa, y la única marina de estas aguas es británica."
 je_ca_hon_costa_status_perdida:0 "La costa norte es hondureña en el mapa y en ningún otro lado."
 je_ca_hon_costa_status_ocupacion:0 "Un puerto o una isla nuestros están bajo bandera ajena."
 je_ca_hon_costa_status_presion:0 "Buques de guerra y cortadores de madera, y de nosotros ni una respuesta a ninguno."
 je_ca_hon_costa_status_nuestra:0 "La costa es nuestra, apenas, y por ahora nadie la está probando."
 je_ca_hon_costa_conclusion_recuperada:0 "La costa norte le paga aduana a Honduras."
 je_ca_hon_costa_conclusion_perdida:0 "Tenemos un litoral al que no podemos llegar, ni cobrarle, ni defenderlo."
 je_ca_mkt_protectorado:0 "La corona y el protector"
 je_ca_mkt_protectorado_lobby:0 "El reino está reconocido por Gran Bretaña, que es a la vez su escudo y su dueño."
 je_ca_mkt_protectorado_reason:0 "Londres nos reconoció en 1837, coronó a nuestro rey en Belice y manda un cónsul general que firma en nombre del rey. Cada protección se ha pagado con una decisión."
 je_ca_mkt_protectorado_status_oficina:0 "La corona existe. Nadie debajo de ella decide nada."
 je_ca_mkt_protectorado_status_tutela:0 "El reino no firma nada por sí solo."
 je_ca_mkt_protectorado_status_consul:0 "Un cónsul en Bluefields decide lo que el reino quiere."
 je_ca_mkt_protectorado_status_corona:0 "Hay un protector, y todavía hay un rey que le contesta."
 je_ca_mkt_protectorado_conclusion_corona:0 "El reino decide lo suyo, y el protector es un tratado y no un gobernador."
 je_ca_mkt_protectorado_conclusion_oficina:0 "El reino misquito está archivado en Belice, en protectorados."
 je_ca_mkt_reino:0 "El reino de la Mosquitia"
 je_ca_mkt_reino_lobby:0 "Cuatrocientas leguas de costa, unos pocos miles de súbditos y ningún Estado."
 je_ca_mkt_reino_reason:0 "Un consejo que legisle, una milicia, un registro de tierras, un tribunal y una aduana. El reino tiene corona y le falta todo lo que suele venir debajo de una."
 je_ca_mkt_reino_status_estado:0 "Una milicia, un tribunal, un registro de tierras y un puerto que paga."
 je_ca_mkt_reino_status_consejo:0 "Hay consejo, y aprueba leyes que quedan escritas."
 je_ca_mkt_reino_status_costa:0 "Una orilla con un rey encima, y nada detrás de la orilla."
 je_ca_mkt_reino_conclusion_hecho:0 "El reino gobierna su costa con instituciones propias."
 je_ca_mkt_reino_conclusion_costa:0 "Veinte años después sigue siendo una orilla con un rey encima."
 ca_button_nic_mediar:0 "Mediar entre las ciudades"
 ca_button_nic_mediar_desc:0 "Mandar comisionados a León y a Granada con dinero y cargos para las dos. Compra una temporada de calma y nunca sale barato."
 ca_button_nic_capital_alterna:0 "La capital alterna"
 ca_button_nic_capital_alterna_desc:0 "El gobierno se sienta en cada ciudad por turnos. Nadie queda contento y nadie queda fuera, que es todo lo que se puede conseguir."
 ca_button_nic_pagar_al_mariscal:0 "Pagar al ejército del mariscal"
 ca_button_nic_pagar_al_mariscal_desc:0 "Un ejército pagado en plata necesita menos levas, y un general con la tropa pagada necesita menos al gobierno."
 ca_button_nic_cortejar_companias:0 "Cortejar a las compañías del tránsito"
 ca_button_nic_cortejar_companias_desc:0 "Reconocimientos, concesiones y una buena cena para quien llegue con una carta de Nueva York o de Londres."
 ca_button_hon_ordenar_hacienda:0 "Ordenar la hacienda"
 ca_button_hon_ordenar_hacienda_desc:0 "Revisar las aduanas, pagar los atrasos y poner por escrito quién debe qué. Cuesta dinero averiguar lo poco que hay."
 ca_button_hon_pactar_con_el_clero:0 "Pactar con el clero"
 ca_button_hon_pactar_con_el_clero_desc:0 "Los curas de parroquia son la única administración que llega a todos los pueblos de Honduras. Gobernar con ellos sale más barato que gobernar sin ellos."
 ca_button_hon_guarnecer_trujillo:0 "Guarnecer Trujillo"
 ca_button_hon_guarnecer_trujillo_desc:0 "Una compañía y una batería en el único puerto de la costa norte al que se puede llegar de verdad desde Comayagua."
 ca_button_hon_protestar_en_londres:0 "Protestar en Londres"
 ca_button_hon_protestar_en_londres_desc:0 "Una nota formal al Foreign Office. Ha funcionado una vez: la ocupación de la Isla del Tigre la desautorizó el propio gobierno que mandó la escuadra."
 ca_button_mkt_pedir_subvencion:0 "Pedirle a Belice la asignación"
 ca_button_mkt_pedir_subvencion_desc:0 "El superintendente pagará las cuentas del reino. Cada pago es también una decisión que le toca tomar a él."
 ca_button_mkt_firmar_con_el_sello:0 "Firmar con nuestro sello"
 ca_button_mkt_firmar_con_el_sello_desc:0 "El sello del rey en los documentos del rey, sin el refrendo del cónsul. Es poca cosa y es toda la cuestión."
 ca_button_mkt_convocar_consejo:0 "Convocar al consejo"
 ca_button_mkt_convocar_consejo_desc:0 "Los criollos de Bluefields se reúnen, legislan y se van a casa. Cada sesión vuelve más difícil impedir la siguiente."
 ca_button_mkt_conceder_cortes:0 "Conceder licencias de corte"
 ca_button_mkt_conceder_cortes_desc:0 "Las compañías de Belice prefieren pagar una licencia a discutirla. El dinero es bueno y es dinero de la gente de la que estamos intentando ser independientes."
 nic_asamblea_constituyente:0 "La asamblea constituyente"
 nic_asamblea_constituyente_desc:0 "La asamblea se reúne en Chinandega, que no es León ni Granada."
 nic_estado_soberano:0 "Libre, soberano e independiente"
 nic_estado_soberano_desc:0 "Declarado el 30 de abril de 1838."
 nic_fidelidad_federal:0 "Fiel a la Unión"
 nic_fidelidad_federal_desc:0 "Nicaragua no ha roto el pacto federal."
 nic_constitucion_1838:0 "La Constitución de 1838"
 nic_constitucion_1838_desc:0 "Dos cámaras y un Director Supremo con periodo de dos años."
 nic_guerra_del_38:0 "La guerra de 1839"
 nic_guerra_del_38_desc:0 "En guerra con El Salvador junto a Honduras."
 nic_gran_mariscal_mando:0 "Fonseca tiene el ejército"
 nic_gran_mariscal_mando_desc:0 "El mando general le responde a un solo hombre."
 nic_levas_del_mariscal:0 "Las levas del mariscal"
 nic_levas_del_mariscal_desc:0 "Levas a bayoneta, la prensa callada y las escuelas cerradas."
 nic_gran_mariscal:0 "El Gran Mariscal"
 nic_gran_mariscal_desc:0 "Nicaragua le pertenece a su general."
 nic_gobierno_civil:0 "Gobierno civil"
 nic_gobierno_civil_desc:0 "El ejército vuelve a rendirle cuentas al Director."
 nic_leon_saqueada:0 "León saqueada"
 nic_leon_saqueada_desc:0 "Cincuenta días de sitio y las casas quemadas."
 nic_amnistia:0 "La amnistía"
 nic_amnistia_desc:0 "Perdonados por la rebelión, y con la cuenta por pagar."
 nic_capital_managua:0 "La sede en Managua"
 nic_capital_managua_desc:0 "Una capital que no es de ninguna de las dos ciudades."
 nic_guerra_de_bandos:0 "La guerra de los bandos"
 nic_guerra_de_bandos_desc:0 "Legitimistas en Granada, Democráticos en León."
 nic_mandato_largo:0 "Un mandato de cuatro años"
 nic_mandato_largo_desc:0 "Bastante para gobernar."
 nic_protesta_en_londres:0 "Protesta en Londres"
 nic_protesta_en_londres_desc:0 "Una nota formal sobre la boca del San Juan."
 nic_greytown_cedido:0 "Greytown cedido"
 nic_greytown_cedido_desc:0 "Nuestro único puerto atlántico tiene nombre inglés."
 nic_contrato_del_transito:0 "El contrato del tránsito"
 nic_contrato_del_transito_desc:0 "Doce años para abrir un canal, y el camino mientras tanto."
 nic_rio_del_estado:0 "El río del Estado"
 nic_rio_del_estado_desc:0 "La ruta explotada por el gobierno y no por una compañía."
 nic_peaje_del_san_juan:0 "El peaje del San Juan"
 nic_peaje_del_san_juan_desc:0 "Cobrado por pasajero, entre Nueva York y San Francisco."
 nic_ruta_del_transito:0 "La ruta del tránsito"
 nic_ruta_del_transito_desc:0 "Abierta, funcionando, y nuestra."
 nic_rio_ajeno:0 "Un río ajeno"
 nic_rio_ajeno_desc:0 "La ruta pasa por nuestro suelo y les paga a otros."
 hon_fidelidad_federal:0 "Fiel a la Unión"
 hon_fidelidad_federal_desc:0 "Honduras no ha declarado la separación."
 hon_constitucion_1839:0 "La Constitución de 1839"
 hon_constitucion_1839_desc:0 "Un presidente, una cámara y un Estado católico."
 hon_constitucion_1848:0 "La Constitución de 1848"
 hon_constitucion_1848_desc:0 "Decretada por Juan Lindo el 4 de febrero."
 hon_constitucion_vigente:0 "La Constitución se cumple"
 hon_constitucion_vigente_desc:0 "Escrita, y obedecida."
 hon_colegio_tridentino:0 "El Colegio Tridentino"
 hon_colegio_tridentino_desc:0 "El seminario de Comayagua, reabierto."
 hon_colegio_laico:0 "Un colegio laico"
 hon_colegio_laico_desc:0 "Educación que no pasa por el obispo."
 hon_puerto_de_la_paz:0 "El puerto de La Paz"
 hon_puerto_de_la_paz_desc:0 "Aduana propia en el golfo de Fonseca."
 hon_diezmo_restituido:0 "El diezmo restituido"
 hon_diezmo_restituido_desc:0 "Abolido en 1829, otra vez ley con Ferrera."
 hon_universidad_nacional:0 "La Universidad Nacional"
 hon_universidad_nacional_desc:0 "Salida de la academia literaria del padre Reyes."
 hon_gesto_mexicano:0 "Guerra a los Estados Unidos"
 hon_gesto_mexicano_desc:0 "Una declaración en apoyo de México, y ninguna marina detrás."
 hon_prudencia_diplomatica:0 "Prudencia diplomática"
 hon_prudencia_diplomatica_desc:0 "No meterse en pleitos donde no hay nada que ganar."
 hon_aduana_de_la_costa:0 "Aduana en la costa"
 hon_aduana_de_la_costa_desc:0 "Los ríos de la madera pagan por fin algo."
 hon_isla_ocupada:0 "La Isla del Tigre ocupada"
 hon_isla_ocupada_desc:0 "Tomada por un cónsul que actuó por su cuenta."
 hon_puerto_ocupado:0 "Un puerto bajo bandera ajena"
 hon_puerto_ocupado_desc:0 "Ocupado, y sin escuadra nuestra que responda."
 hon_pacto_de_chinandega:0 "El pacto de Chinandega"
 hon_pacto_de_chinandega_desc:0 "Apoyo estadounidense a un canal que desagüe en el golfo de Fonseca."
 hon_alianza_ocotepeque:0 "La alianza de Ocotepeque"
 hon_alianza_ocotepeque_desc:0 "Honduras y El Salvador, contra Guatemala."
 hon_estado_en_pie:0 "Un Estado en pie"
 hon_estado_en_pie_desc:0 "Una constitución, un puerto y una universidad."
 hon_republica_hecha:0 "La República hecha"
 hon_republica_hecha_desc:0 "De hecho, y no solo en el decreto fundador."
 hon_republica_de_papel:0 "Una república de papel"
 hon_republica_de_papel_desc:0 "Dos constituciones y ninguna administración."
 hon_costa_recuperada:0 "La costa recuperada"
 hon_costa_recuperada_desc:0 "De Trujillo a Cabo Gracias a Dios le paga aduana a Honduras."
 hon_costa_perdida:0 "La costa perdida"
 hon_costa_perdida_desc:0 "Un litoral al que no llegamos, ni cobramos, ni defendemos."
 hon_costa_sin_aduana:0 "La costa sin aduana"
 hon_costa_sin_aduana_desc:0 "Las compañías de Belice cortan y no le pagan a nadie."
 mkt_reino_reconocido:0 "El reino reconocido"
 mkt_reino_reconocido_desc:0 "Gran Bretaña reconoció al reino misquito en 1837."
 mkt_consul_en_bluefields:0 "Un cónsul en Bluefields"
 mkt_consul_en_bluefields_desc:0 "Administra bien, y decide."
 mkt_tutela_britanica:0 "La tutela británica"
 mkt_tutela_britanica_desc:0 "El reino no firma nada por sí solo."
 mkt_oficina_en_belice:0 "Una oficina en Belice"
 mkt_oficina_en_belice_desc:0 "Una corona sin nadie debajo que decida."
 mkt_corona_propia:0 "Una corona propia"
 mkt_corona_propia_desc:0 "El protector es un tratado y no un gobernador."
 mkt_consejo_que_legisla:0 "Un consejo que legisla"
 mkt_consejo_que_legisla_desc:0 "Los criollos de Bluefields ponen las leyes por escrito."
 mkt_estado_del_reino:0 "Las instituciones del reino"
 mkt_estado_del_reino_desc:0 "Una milicia, un tribunal y un registro de tierras."
 mkt_reino_hecho:0 "El reino en pie"
 mkt_reino_hecho_desc:0 "Gobierna su costa con instituciones propias."
 mkt_solo_una_costa:0 "Solo una orilla"
 mkt_solo_una_costa_desc:0 "Un rey, y nada detrás de la playa."
 mkt_aduana_de_greytown:0 "La aduana de Greytown"
 mkt_aduana_de_greytown_desc:0 "Derechos de puerto en el camino entre los océanos."
 mkt_licencias_de_caoba:0 "Licencias de caoba"
 mkt_licencias_de_caoba_desc:0 "Las compañías de Belice pagan por fin por el corte."
 mkt_comercio_de_la_costa:0 "El comercio de la costa"
 mkt_comercio_de_la_costa_desc:0 "Zarzaparrilla, carey y las balandras jamaiquinas."
 mkt_pacto_con_los_caciques:0 "Un pacto con los caciques"
 mkt_pacto_con_los_caciques_desc:0 "Río arriba lo gobiernan los que viven ahí."
 mkt_frontera_acordada:0 "Una frontera acordada"
 mkt_frontera_acordada_desc:0 "El reclamo del norte termina en Cabo Gracias a Dios."
 nic_fonseca_down_15_tt:0 "#R El Gran Mariscal#! retrocede #b 15#!"
 hon_costa_down_8_tt:0 "#R La costa#! retrocede #b 8#!"
 mkt_protectorado_down_12_tt:0 "#R La tutela británica#! retrocede #b 12#!"
