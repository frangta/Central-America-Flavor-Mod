l_spanish:
 # CAFM F27: localizacion que faltaba (tipos de gobierno, textos del menu de inicio de los diarios, condiciones del diario de la UCA)
 gov_ca_uca_republic:0 "República Federal"
 gov_ca_uca_republic_desc:0 "La República Federal de Centroamérica: cinco Estados unidos por la Constitución de 1824. Un presidente federal y un Congreso gobiernan desde la capital, mientras cada Estado conserva su propio jefe de Estado y su asamblea."
 gov_ca_talamanca_cacique:0 "Cacicazgo de Talamanca"
 gov_ca_talamanca_cacique_desc:0 "Los pueblos bribri y cabécar de Talamanca siguen a su propio cacique hereditario, que gobierna los valles de montaña fuera del alcance de la Federación."
 gov_ca_jefe_estado_desc:0 "Un Estado miembro de la Federación, gobernado por un jefe de Estado electo bajo su propia constitución mientras sigue ligado al pacto federal."
 gov_ca_director_supremo_desc:0 "Un Estado que ha salido de la Federación, gobernado por un director supremo electo por un periodo corto, como Nicaragua y Honduras después de 1838."
 gov_ca_jefe_supremo_desc:0 "Un caudillo se ha adueñado del Estado y gobierna de por vida, por encima de la constitución."
 gov_ca_junta_desc:0 "Tras una revuelta de cuartel, los oficiales gobiernan el país directamente."
 gov_ca_republica_bananera_desc:0 "Una república cuyo gobierno responde a las compañías fruteras extranjeras dueñas de los ferrocarriles, los puertos y las plantaciones."
 gov_ca_republica_cafetalera_desc:0 "Una república dirigida por y para las familias cafetaleras que controlan la tierra, el crédito y el comercio de exportación."
 gov_ca_presidential_oligarchy_desc:0 "Una república presidencial en la que solo votan los ricos y los propietarios."
 gov_ca_presidential_democracy_desc:0 "Una república presidencial elegida por un amplio sufragio popular."
 gov_ca_cos_confederacion_desc:0 "Costa Rica encabeza una confederación de los Estados del sur del istmo bajo su propio presidente."
 gov_ca_cos_ciudad_liga_desc:0 "Desde la Guerra de la Liga, las ciudades del Valle Central se gobiernan a sí mismas, cada una bajo su propio jefe político."
 gov_ca_cos_reino_desc:0 "Costa Rica ha coronado a su propio monarca."
 gov_ca_cos_republica_obrera_desc:0 "Una república gobernada por consejos de obreros y campesinos."
 gov_ca_cos_jefatura_morazan_desc:0 "Francisco Morazán gobierna Costa Rica como jefe de Estado provisional mientras prepara la restauración de la Federación."
 gov_ca_cos_jefatura_vitalicia_desc:0 "El Decreto de Bases y Garantías ha hecho a Braulio Carrillo jefe de Estado vitalicio."
 gov_ca_cos_primera_republica_desc:0 "Costa Rica se ha proclamado república soberana, fuera de la antigua Federación."
 gov_ca_cos_estado_1844_desc:0 "La Constitución de 1844 rige Costa Rica, con elecciones directas y separación de poderes."
 gov_ca_cos_republica_olimpo_desc:0 "Los intelectuales liberales de la generación del Olimpo gobiernan la república en nombre del orden y el progreso."
 gov_ca_cos_cuarteles_desc:0 "Los cuarteles de San José ponen y quitan presidentes."
 je_frca_bar_threshold_a_tt:0 "El #bold apoyo a la Federación#! es de al menos #bold 120#!"
 je_frca_bar_threshold_b_tt:0 "El #bold apoyo a la Federación#! es de al menos #bold 80#!"
 je_frca_route_federal_tt:0 "La Federación sigue la #bold ruta federal#!"
 ca_fvs_bar_display_name:0 "Federalistas contra separatistas"
 ca_fvs_bar_display_desc:0 "En #bold 100#! ganan los federalistas; en #bold 0#!, los separatistas."
 je_ca_fvs_result_beats_tt:0 "La lucha se ha resuelto a favor de los #bold federalistas#!"
 je_ca_fvs_result_falls_tt:0 "La lucha se ha resuelto a favor de los #bold separatistas#!"
