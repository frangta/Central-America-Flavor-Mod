l_spanish:
 # CAFM - F8 - Guerra federal y desenlaces
 ca_central_america.42.t:0 "La Guerra Federal"
 ca_central_america.42.d:0 "Los Estados que se han separado no volverán por sí solos. En los cuarteles los oficiales exigen una campaña para restaurar la Unión por la fuerza; en el Congreso, otros dicen que ha llegado la hora de aceptar el fin de la Federación."
 ca_central_america.42.f:0 "«La República la salvarán sus soldados, o nadie.»"
 ca_central_america.42.a:0 "¡Lucharemos por la Federación!"
 ca_central_america.42.a_tt:0 "La Federación declara una #bold guerra de reanexión#! a cada Estado principal independiente. Si al terminar las guerras ningún Estado principal es independiente, la Unión habrá #bold ganado#!."
 ca_central_america.42.b:0 "Aceptar la disolución."
 ca_central_america.42.b_tt:0 "#N La Federación se disolverá.#!"
 ca_central_america.43.t:0 "Derrota en la Guerra Federal"
 ca_central_america.43.d:0 "Los ejércitos federales han sido derrotados. Los Estados separados siguen libres y ya no queda ninguna fuerza capaz de mantener unida la Unión."
 ca_central_america.43.f:0 "Se arría la bandera de los cinco volcanes."
 ca_central_america.43.a:0 "Se acabó."
 ca_central_america.44.t:0 "Victoria en la Guerra Federal"
 ca_central_america.44.d:0 "Los Estados rebeldes han sido derrotados y devueltos a la Unión. La Federación sigue en pie, pero ha sido restaurada por la espada y sus enemigos ya conspiran."
 ca_central_america.44.f:0 "«Una bandera, una República.»"
 ca_central_america.44.a:0 "¡Viva la Federación!"
 ca_central_america.44.b:0 "Mostrar clemencia con los vencidos."
 ca_central_america.77.t:0 "El exilio de Morazán"
 ca_central_america.77.d:0 "Tras su derrota en la Ciudad de Guatemala el 18 y 19 de marzo de 1840, Francisco Morazán se ha retirado a El Salvador. Sin ejército y sin aliados, se ha embarcado en La Libertad con sus últimos oficiales leales. La República Federal de Centroamérica ha perdido su espada y su símbolo."
 ca_central_america.77.f:0 "El Águila se va, pero la causa de la Unión permanece."
 ca_central_america.77.a:0 "El Águila parte."
 ca_central_america.77.a_tt:0 "#N Morazán se va al exilio: la Federación se disolverá.#!"
 ca_central_america.122.t:0 "La Federación se desvanece"
 ca_central_america.122.d:0 "No ha habido victoria, ni unión, ni confederación. Año tras año los Estados han dejado de enviar diputados e impuestos, y ahora la República Federal solo existe en el papel. Sus últimos funcionarios aceptan dejar que los Estados sigan su propio camino en paz."
 ca_central_america.122.f:0 "No con una batalla, sino con una firma."
 ca_central_america.122.a:0 "Que cada Estado siga su propio camino."
 ca_frca_six_states_tt:0 "#bold República de los Seis Estados#!: Los Altos sigue siendo miembro leal de la Unión."
 ca_frca_federal_victory:0 "Victoria federal"
 ca_frca_federal_victory_desc:0 "La Unión se ha restaurado en el campo de batalla."
 ca_frca_clemency:0 "Clemencia federal"
 ca_frca_clemency_desc:0 "Los Estados vencidos han sido tratados con misericordia."
 ca_frca_republic_consolidated:0 "República consolidada"
 ca_frca_republic_consolidated_desc:0 "La República Federal ha sobrevivido a su mayor crisis."
 ca_frca_union_by_sword:0 "La unión por la espada"
 ca_frca_union_by_sword_desc:0 "La Unión descansa sobre las bayonetas de su ejército."
 ca_frca_reconquest_unrest:0 "Estado reconquistado"
 ca_frca_reconquest_unrest_desc:0 "Este Estado volvió a la Unión por la fuerza."
 ca_frca_six_states:0 "República de los Seis Estados"
 ca_frca_six_states_desc:0 "Los Altos está con la Federación como su sexto Estado."
 ca_frca_federation_diminished:0 "Federación disminuida"
 ca_frca_federation_diminished_desc:0 "Solo algunos de los Estados siguen en la Federación."
 ca_federal_war_play:0 "La Guerra Federal"
