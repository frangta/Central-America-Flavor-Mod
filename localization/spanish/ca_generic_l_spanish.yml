l_spanish:
 # CAFM - F17 - Eventos genericos (grupo 16), cadenas y dinamicos
 ca_central_america.88.t:0 "[SCOPE.sCharacter('regional_caudillo').GetFullName], caudillo de [SCOPE.sState('caudillo_state').GetName]"
 ca_central_america.88.d:0 "En [SCOPE.sState('caudillo_state').GetName], donde la autoridad de la capital es débil, [SCOPE.sCharacter('regional_caudillo').GetFullName] ha reunido hombres armados que solo le obedecen a él. Ofrece mantener el orden en la región, con sus propias condiciones."
 ca_central_america.88.f:0 "«Donde no llega la ley, manda el caudillo.»"
 ca_central_america.88.a:0 "Reconocerlo como el hombre fuerte de la región."
 ca_central_america.88.b:0 "Enviarlo al exilio."
 ca_central_america.89.t:0 "Una intriga palaciega"
 ca_central_america.89.d:0 "[SCOPE.sCharacter('corrupt_politician').GetFullName], líder de los terratenientes, conspira para derribar a los ministros que se le oponen. En la capital no se habla de otra cosa."
 ca_central_america.89.f:0 "«En palacio, los cuchillos se afilan de noche.»"
 ca_central_america.89.a:0 "Dejar que la intriga siga su curso."
 ca_central_america.89.b:0 "Purgar el gabinete."
 ca_central_america.90.t:0 "[SCOPE.sState('demanding_state').GetName] exige autonomía"
 ca_central_america.90.d:0 "Los notables de [SCOPE.sState('demanding_state').GetName] exigen gobernar sus propios asuntos: sus impuestos, su milicia y sus jueces."
 ca_central_america.90.f:0 "«Nadie conoce nuestras necesidades mejor que nosotros.»"
 ca_central_america.90.a:0 "Conceder la autonomía."
 ca_central_america.90.b:0 "Negarla."
 ca_central_america.91.t:0 "Auge del café en [SCOPE.sState('boom_state').GetName]"
 ca_central_america.91.d:0 "Los precios del café están altos y los cafetales de [SCOPE.sState('boom_state').GetName] enriquecen a sus dueños. El tesoro quiere su parte."
 ca_central_america.91.f:0 "«Cada grano es una moneda.»"
 ca_central_america.91.a:0 "Dejar que los cafetaleros prosperen."
 ca_central_america.91.b:0 "Gravar fuertemente el café."
 ca_central_america.92.t:0 "Los acreedores llaman a la puerta"
 ca_central_america.92.d:0 "El tesoro no puede pagar sus deudas. Los tenedores de bonos de Londres exigen su dinero y los comerciantes locales se niegan a prestar más."
 ca_central_america.92.f:0 "«Un país que no paga no recibe préstamos.»"
 ca_central_america.92.a:0 "Austeridad."
 ca_central_america.92.b:0 "Dejar de pagar."
 ca_central_america.93.t:0 "Terremoto en [SCOPE.sState('earthquake_state').GetName]"
 ca_central_america.93.d:0 "La tierra ha sacudido [SCOPE.sState('earthquake_state').GetName]. Iglesias y casas se han derrumbado y los sobrevivientes duermen a la intemperie."
 ca_central_america.93.f:0 "«Los volcanes nunca están quietos mucho tiempo.»"
 ca_central_america.93.a:0 "Enviar socorro."
 ca_central_america.93.b:0 "Se reconstruirán por su cuenta."
 ca_central_america.94.t:0 "La campaña de alfabetización"
 ca_central_america.94.d:0 "Los liberales proponen una campaña para enseñar a leer al pueblo: escuelas en cada pueblo, maestros pagados por el Estado. El clero prefiere seguir enseñando el catecismo."
 ca_central_america.94.f:0 "«A un pueblo que lee no se le puede engañar.»"
 ca_central_america.94.a:0 "Educación laica."
 ca_central_america.94.b:0 "Dejar la educación a la Iglesia."
 ca_central_america.95.t:0 "Revuelta campesina en [SCOPE.sState('rebellion_state').GetName]"
 ca_central_america.95.d:0 "Los campesinos de [SCOPE.sState('rebellion_state').GetName] se han alzado contra los recaudadores y los terratenientes que les quitan sus tierras comunales."
 ca_central_america.95.f:0 "«La tierra para quien la trabaja.»"
 ca_central_america.95.a:0 "Concesiones agrarias."
 ca_central_america.95.b:0 "Represión militar."
 ca_central_america.96.t:0 "Una oferta de [SCOPE.sCountry('foreign_power').GetName]"
 ca_central_america.96.d:0 "El enviado de [SCOPE.sCountry('foreign_power').GetName] ofrece un préstamo en condiciones generosas. Generosas, al menos, hasta que venza el primer pago."
 ca_central_america.96.f:0 "«El oro de afuera siempre viene con condiciones.»"
 ca_central_america.96.a:0 "Aceptar el préstamo."
 ca_central_america.96.b:0 "Rechazarlo."
 ca_central_america.97.t:0 "Problemas fronterizos con [SCOPE.sCountry('border_neighbor').GetName]"
 ca_central_america.97.d:0 "Se han visto tropas de [SCOPE.sCountry('border_neighbor').GetName] de nuestro lado de la frontera. ¿Es un error, una provocación o el primer paso de una invasión?"
 ca_central_america.97.f:0 "«Las fronteras se trazan con tinta y se borran con sangre.»"
 ca_central_america.97.a:0 "Movilizar el ejército."
 ca_central_america.97.b:0 "Buscar un arreglo pacífico."
 ca_central_america.98.t:0 "El ejército quiere más"
 ca_central_america.98.d:0 "Los oficiales se quejan: están mal pagados, mal armados y mal dirigidos. Quieren un ejército de verdad y quieren voz en el gobierno."
 ca_central_america.98.f:0 "«Un ejército sin pan es un peligro para todos.»"
 ca_central_america.98.a:0 "Construir un ejército centralizado."
 ca_central_america.98.b:0 "Dejar el ejército como está."
 ca_central_america.168.t:0 "[SCOPE.sCharacter('ca_cau').GetFullName] se pronuncia"
 ca_central_america.168.d:0 "El caudillo que reconocimos ha ido más lejos. [SCOPE.sCharacter('ca_cau').GetFullName] ha proclamado su propio gobierno en su bastión y ya no reconoce la autoridad de la capital."
 ca_central_america.168.f:0 "«No me rebelo; simplemente gobierno.»"
 ca_central_america.168.a:0 "Tenemos que ocuparnos de él."
 ca_central_america.169.t:0 "Cómo tratar al caudillo"
 ca_central_america.169.d:0 "El caudillo defiende su bastión con hombres leales. Podemos reconocerlo como vasallo, marchar contra él o comprarlo."
 ca_central_america.169.f:0 "«Todo hombre tiene su precio; algunos prefieren cobrarlo en poder.»"
 ca_central_america.169.a:0 "Un pacto: será nuestro vasallo."
 ca_central_america.169.b:0 "Una campaña para aplastarlo."
 ca_central_america.169.c:0 "Comprarlo."
 ca_caudillo_campaign_play:0 "Campaña contra el caudillo"
 ca_central_america.170.t:0 "El caudillo marcha sobre la capital"
 ca_central_america.170.d:0 "Tras dos años en su bastión, el caudillo ve que el gobierno es débil. Sus hombres marchan sobre la capital y en los cuarteles algunos oficiales lo esperan."
 ca_central_america.170.f:0 "«Quien tiene la capital tiene la República.»"
 ca_central_america.170.a:0 "Defender la capital."
 ca_central_america.170.b:0 "Dejar que tome el poder."
 ca_central_america.171.t:0 "El fin del caudillo"
 ca_central_america.171.d:0 "El caudillo ha sobrevivido a todos los intentos de quitarlo. Su bastión es ahora un Estado propio y nadie espera que vuelva."
 ca_central_america.171.d2:0 "La aventura del caudillo ha terminado. Su bastión ha vuelto a la autoridad del gobierno, de un modo u otro."
 ca_central_america.171.f:0 "«Los caudillos van y vienen; las montañas se quedan.»"
 ca_central_america.171.a:0 "Así termina la era de este caudillo."
 ca_central_america.172.t:0 "Los pueblos de [SCOPE.sState('ca_pst').GetName] se alzan"
 ca_central_america.172.d:0 "La represión no ha acabado con la revuelta. Los pueblos de [SCOPE.sState('ca_pst').GetName] han expulsado a las autoridades y se gobiernan mediante sus propios concejos."
 ca_central_america.172.f:0 "«Fuimos indios antes que ciudadanos.»"
 ca_central_america.172.a:0 "Esto no puede seguir así."
 ca_central_america.173.t:0 "La Iglesia media"
 ca_central_america.173.d:0 "El obispo se ofrece a mediar con los pueblos rebeldes: volverán a la obediencia si el gobierno respeta sus tierras y sus costumbres."
 ca_central_america.173.f:0 "«La cruz puede lo que el fusil no.»"
 ca_central_america.173.a:0 "Aceptar la mediación."
 ca_central_america.173.b:0 "Ninguna concesión a los rebeldes."
 ca_central_america.174.t:0 "La montaña resiste"
 ca_central_america.174.d:0 "Los pueblos rebeldes se han echado al monte. El ejército no puede alcanzarlos y la guerra cuesta más cada mes. En los valles vecinos, los campesinos escuchan."
 ca_central_america.174.f:0 "«Cada cerro es una fortaleza.»"
 ca_central_america.174.a:0 "Enviar el ejército."
 ca_central_america.174.b:0 "Aguantar y esperar."
 ca_peasant_campaign_play:0 "Campaña en las montañas"
 ca_central_america.175.t:0 "El fin de la rebelión"
 ca_central_america.175.d:0 "Las comunidades rebeldes han conservado su autonomía. Se gobiernan solas, no pagan impuestos y reconocen al gobierno solo de nombre."
 ca_central_america.175.d2:0 "Las comunidades rebeldes han vuelto a la autoridad del Estado, por acuerdo o por la fuerza."
 ca_central_america.175.f:0 "«La tierra recuerda.»"
 ca_central_america.175.a:0 "Así termina la rebelión."
 ca_central_america.130.t:0 "Erupción volcánica en [SCOPE.sState('ca_dyn_state').GetName]"
 ca_central_america.130.d:0 "Uno de los volcanes de [SCOPE.sState('ca_dyn_state').GetName] ha hecho erupción. La ceniza cubre los campos y los pueblos de sus faldas han quedado sepultados."
 ca_central_america.130.a:0 "Enviar socorro."
 ca_central_america.130.b:0 "No hay nada que hacer."
 ca_central_america.131.t:0 "Una plaga de langostas"
 ca_central_america.131.d:0 "Nubes de langostas han caído sobre los campos. El maíz, los frijoles y los cafetos jóvenes han desaparecido."
 ca_central_america.131.a:0 "Comprar grano en el extranjero."
 ca_central_america.131.b:0 "Los campesinos se las arreglarán."
 ca_central_america.132.t:0 "Un huracán en la costa caribe"
 ca_central_america.132.d:0 "Un huracán ha barrido la costa caribe de [SCOPE.sState('ca_dyn_state').GetName]. Los puertos y las plantaciones están en ruinas, y los británicos ofrecen ayuda desde Belice."
 ca_central_america.132.a:0 "Aceptar la ayuda británica."
 ca_central_america.132.b:0 "Reconstruiremos solos."
 ca_central_america.133.t:0 "Una epidemia de viruela"
 ca_central_america.133.d:0 "La viruela se extiende por los pueblos. Los médicos tienen la vacuna, pero la gente le teme más que a la enfermedad."
 ca_central_america.133.a:0 "Una campaña de vacunación."
 ca_central_america.133.b:0 "Dejar que pase."
 ca_central_america.134.t:0 "La crisis del añil"
 ca_central_america.134.d:0 "El precio del añil se ha desplomado en Europa. Los añileros, los comerciantes y los trabajadores de los obrajes están arruinados."
 ca_central_america.134.a:0 "Ayudar a los añileros."
 ca_central_america.134.b:0 "Que decida el mercado."
 ca_central_america.135.t:0 "Contrabando en la costa"
 ca_central_america.135.d:0 "Los aduaneros informan que la mitad de las mercancías que llegan al país entran por caletas escondidas, sin pagar un centavo."
 ca_central_america.135.a:0 "Perseguir a los contrabandistas."
 ca_central_america.135.b:0 "Mejor un poco de comercio que ninguno."
 ca_central_america.136.t:0 "Bandidos en los caminos"
 ca_central_america.136.d:0 "Los bandidos asaltan las recuas en los caminos reales. Los comerciantes exigen protección."
 ca_central_america.136.a:0 "Enviar el ejército."
 ca_central_america.136.b:0 "Que los pueblos armen sus propias guardias."
 ca_central_america.137.t:0 "Motín en el cuartel"
 ca_central_america.137.d:0 "La guarnición de la capital se ha amotinado: los soldados llevan meses sin cobrar."
 ca_central_america.137.a:0 "Pagarles."
 ca_central_america.137.b:0 "Castigar a los cabecillas."
 ca_central_america.138.t:0 "Una elección amañada"
 ca_central_america.138.d:0 "Todos saben que la elección fue amañada: los muertos votaron, los vivos no, y las urnas llegaron llenas."
 ca_central_america.138.a:0 "Anular la elección."
 ca_central_america.138.b:0 "Aceptar el resultado."
 ca_central_america.139.t:0 "El diezmo en disputa"
 ca_central_america.139.d:0 "Los campesinos se niegan a pagar el diezmo a la Iglesia y los liberales proponen abolirlo del todo."
 ca_central_america.139.a:0 "Abolir el diezmo."
 ca_central_america.139.b:0 "Mantener el diezmo."
 ca_central_america.140.t:0 "La rivalidad de las ciudades"
 ca_central_america.140.d:0 "León y Granada dicen ser la verdadera capital de Nicaragua, y ninguna obedecerá a un gobierno instalado en la otra."
 ca_central_america.140.d2:0 "Comayagua y Tegucigalpa dicen ser la verdadera capital de Honduras: una tiene al obispo y la tradición; la otra, la plata y los comerciantes."
 ca_central_america.140.d3:0 "Cartago, la vieja capital colonial, y San José, la nueva ciudad rica, dicen ser el corazón de Costa Rica."
 ca_central_america.140.f:0 "«Dos ciudades, un solo trono.»"
 ca_central_america.140.a:0 "La capital se queda donde está."
 ca_central_america.140.b:0 "Trasladar la capital a la ciudad rival."
 ca_central_america.140.c:0 "La capital alternará entre ambas."
 ca_central_america.141.t:0 "Sequía en el campo"
 ca_central_america.141.d:0 "No han llegado las lluvias. El maíz muere en los campos y el precio de los alimentos sube en los mercados."
 ca_central_america.141.a:0 "Comprar grano."
 ca_central_america.141.b:0 "Dejar que los precios se acomoden."
 ca_central_america.142.t:0 "Colonos europeos"
 ca_central_america.142.d:0 "Una compañía europea de colonización propone asentar familias en nuestras tierras vacías del Atlántico, con caminos y un puerto propios."
 ca_central_america.142.a:0 "Recibir a los colonos."
 ca_central_america.142.b:0 "No necesitamos extranjeros."
 ca_central_america.143.t:0 "La concesión del canal"
 ca_central_america.143.d:0 "Una compañía extranjera pide una concesión para abrir un canal entre los océanos a través de nuestro territorio. Promete riquezas; también promete un enclave extranjero."
 ca_central_america.143.a:0 "Otorgar la concesión."
 ca_central_america.143.b:0 "El canal debe ser nuestro."
 ca_central_america.144.t:0 "La fiebre del oro de California"
 ca_central_america.144.d:0 "Se ha encontrado oro en California. Miles de viajeros quieren cruzar Centroamérica camino a las minas, y pagan bien."
 ca_central_america.144.a:0 "Abrir una ruta de tránsito."
 ca_central_america.144.b:0 "Mantener fuera a los extranjeros."
 ca_central_america.145.t:0 "Filibusteros"
 ca_central_america.145.d:0 "Aventureros armados han desembarcado en la costa hablando de colonias, esclavos e imperios. Son pocos, pero están bien armados."
 ca_central_america.145.a:0 "Movilizarse contra ellos."
 ca_central_america.145.b:0 "Ignorarlos."
 ca_central_america.146.t:0 "Una disputa fronteriza con [SCOPE.sCountry('ca_dyn_neighbor').GetName]"
 ca_central_america.146.d:0 "Una aldea de la frontera dice pertenecer a [SCOPE.sCountry('ca_dyn_neighbor').GetName] y ambos gobiernos han enviado soldados."
 ca_central_america.146.a:0 "Negociar."
 ca_central_america.146.b:0 "Mantener la línea."
 ca_central_america.147.t:0 "Exiliados piden asilo"
 ca_central_america.147.d:0 "Un grupo de exiliados de [SCOPE.sCountry('ca_dyn_neighbor').GetName] ha cruzado la frontera y pide asilo. Su gobierno exige que se los entreguemos."
 ca_central_america.147.a:0 "Concederles asilo."
 ca_central_america.147.b:0 "Entregarlos."
 ca_central_america.148.t:0 "Escasez de moneda"
 ca_central_america.148.d:0 "No hay suficiente moneda en los mercados. Los comerciantes pagan con granos de cacao y pagarés, y el tesoro no puede cobrar sus impuestos."
 ca_central_america.148.a:0 "Acuñar nueva moneda."
 ca_central_america.148.b:0 "Permitir la moneda extranjera."
 ca_central_america.149.t:0 "Armas desde Belice"
 ca_central_america.149.d:0 "Comerciantes británicos de Belice venden fusiles a quien pague: rebeldes, caudillos y jefes misquitos por igual."
 ca_central_america.149.a:0 "Confiscar las armas."
 ca_central_america.149.b:0 "Dejar que vendan."
 ca_peasant_concessions:0 "Concesiones a los pueblos"
 ca_peasant_concessions_desc:0 "El gobierno ha respetado las tierras y costumbres de los pueblos."
 ca_peasant_guerrilla:0 "Guerra en las montañas"
 ca_peasant_guerrilla_desc:0 "El ejército libra una guerra de guerrillas que no puede ganar."
 ca_clean_vote:0 "Un voto limpio"
 ca_clean_vote_desc:0 "La elección amañada fue anulada."
 ca_rigged_vote:0 "Un voto amañado"
 ca_rigged_vote_desc:0 "Todos saben que la elección fue amañada."
 ca_capital_moved:0 "La capital trasladada"
 ca_capital_moved_desc:0 "El gobierno se muda a una nueva capital."
 ca_capital_alternating:0 "Una capital alterna"
 ca_capital_alternating_desc:0 "La capital se traslada entre dos ciudades rivales."
 ca_food_relief:0 "Socorro alimentario"
 ca_food_relief_desc:0 "El gobierno compra grano para los hambrientos."
 ca_drought:0 "Sequía"
 ca_drought_desc:0 "No han llegado las lluvias."
 ca_european_colony:0 "Colonos europeos"
 ca_european_colony_desc:0 "Familias europeas colonizan las tierras del Atlántico."
 ca_new_coinage:0 "Nueva acuñación"
 ca_new_coinage_desc:0 "La casa de moneda ha emitido nuevas monedas."
 ca_foreign_coin:0 "Moneda extranjera"
 ca_foreign_coin_desc:0 "Las monedas extranjeras circulan libremente en los mercados."
