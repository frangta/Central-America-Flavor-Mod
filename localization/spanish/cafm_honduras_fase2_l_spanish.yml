l_spanish:
 # CAFM - Nicaragua fase 2, Honduras fase 2 y la Mosquitia (10 nov 2026)
 ca_honduras_events.43.t:0 "Honduras se sale de la Unión"
 ca_honduras_events.43.d:0 "En octubre la asamblea declara a Honduras separada de la República Federal. Nicaragua se fue en abril, Costa Rica antes. De la Unión queda El Salvador y una cuenta."
 ca_honduras_events.43.f:0 "«Somos un estado que ha dejado de ser parte de algo y todavía no ha empezado a ser nada.»"
 ca_honduras_events.43.a:0 "Declarar la separación"
 ca_honduras_events.43.b:0 "Esperar a los otros estados"
 ca_honduras_events.44.t:0 "Un presidente en Juticalpa"
 ca_honduras_events.44.d:0 "El veintiuno de septiembre los conservadores nombran presidente al general Francisco Zelaya y Ayes, y toma el cargo en Juticalpa porque Comayagua y Tegucigalpa le son las dos inseguras."
 ca_honduras_events.44.f:0 "«El gobierno de Honduras está donde el presidente esté parado.»"
 ca_honduras_events.44.a:0 "Zelaya y Ayes, presidente"
 ca_honduras_events.45.t:0 "San Pedro Perulapán"
 ca_honduras_events.45.d:0 "El veinticinco de septiembre las columnas aliadas se encontraron con Morazán en territorio salvadoreño y quedaron deshechas. Está vencido en todas partes menos en un campo de batalla."
 ca_honduras_events.45.f:0 "«Cuatro estados contra él, y todavía gana las peleas de verdad.»"
 ca_honduras_events.45.a:0 "Una derrota que aguantamos"
 ca_honduras_events.46.t:0 "La Soledad"
 ca_honduras_events.46.d:0 "El trece de noviembre Zelaya volvió a perder, a las puertas de Tegucigalpa y contra Cabañas. El presidente ha sido derrotado ya en su propio país, a la vista de la segunda ciudad."
 ca_honduras_events.46.f:0 "«Comayagua gobierna y Tegucigalpa pelea. Ese es el arreglo.»"
 ca_honduras_events.46.a:0 "Sostener Comayagua"
 ca_honduras_events.46.b:0 "Entenderse con Tegucigalpa"
 ca_honduras_events.47.t:0 "La Constitución del Estado"
 ca_honduras_events.47.d:0 "La asamblea constituyente que se reunió en 1838 tiene por fin un texto: un presidente, una cámara, un Estado católico y requisitos de propiedad para votar. En el papel, Honduras existe."
 ca_honduras_events.47.f:0 "«En el papel. Lo demás lo iremos viendo.»"
 ca_honduras_events.47.a:0 "Promulgarla"
 ca_honduras_events.47.b:0 "Gobernar por decreto un rato más"
 ca_honduras_events.48.t:0 "Ferrera, primer presidente constitucional"
 ca_honduras_events.48.d:0 "Electo en junio y juramentado el primero de enero. Es un militar que piensa gobernar con las clases que perdieron terreno con la Federación, y les va a devolver lo que Morazán les quitó."
 ca_honduras_events.48.f:0 "«El primer presidente bajo la Constitución, y el primero en descubrir lo poco que lo ata.»"
 ca_honduras_events.48.a:0 "Francisco Ferrera"
 ca_honduras_events.48.b:0 "Un presidente civil"
 ca_honduras_events.69.t:0 "Los cortes de Belice"
 ca_honduras_events.69.d:0 "Las compañías de caoba de Belice trabajan los ríos de la costa norte y no le pagan a nadie. No hay aduana entre Trujillo y Cabo Gracias a Dios, y la única autoridad en esa costa iza una bandera que no reconocemos."
 ca_honduras_events.69.f:0 "«La costa es nuestra en el mapa y de nadie en el suelo.»"
 ca_honduras_events.69.a:0 "Cobrarle a los cortes"
 ca_honduras_events.69.b:0 "No podemos vigilar una selva"
 ca_honduras_events.49.t:0 "El Colegio Tridentino reabre"
 ca_honduras_events.49.d:0 "Ferrera ha reabierto el seminario de Comayagua. Es la única institución de Honduras que forma a alguien para algo, y los forma para la Iglesia."
 ca_honduras_events.49.f:0 "«Toda nuestra clase letrada le va a deber la educación al obispo.»"
 ca_honduras_events.49.a:0 "Reabrirlo"
 ca_honduras_events.49.b:0 "Un colegio laico en su lugar"
 ca_honduras_events.50.t:0 "El puerto de La Paz"
 ca_honduras_events.50.d:0 "El gobierno reabre el puerto del Pacífico en el golfo de Fonseca. Todo lo que Honduras vende ha estado saliendo por la aduana de otro, y este es el primer intento en veinte años de cambiar eso."
 ca_honduras_events.50.f:0 "«Un país que exporta por puertos ajenos no pone sus precios.»"
 ca_honduras_events.50.a:0 "Reabrir el puerto"
 ca_honduras_events.50.b:0 "El tesoro no da para un puerto"
 ca_honduras_events.51.t:0 "El diezmo restituido"
 ca_honduras_events.51.d:0 "El diezmo abolido en 1829 vuelve a ser ley. La Iglesia recupera su renta y el gobierno consigue un clero que leerá sus decretos desde el púlpito."
 ca_honduras_events.51.f:0 "«La administración más barata de Centroamérica: la que te llevan los curas de parroquia.»"
 ca_honduras_events.51.a:0 "Restituir el diezmo"
 ca_honduras_events.51.b:0 "Dejar 1829 como está"
 ca_honduras_events.52.t:0 "El año de la viruela"
 ca_honduras_events.52.d:0 "La viruela ha pasado por Comayagua y por Tegucigalpa, y el tesoro no tiene con qué atenderla. Lo que queda de la renta pública ya está comprometido con el ejército."
 ca_honduras_events.52.f:0 "«El único acto visible del Estado este año va a ser una cuarentena que no puede imponer.»"
 ca_honduras_events.52.a:0 "Gastar lo que no tenemos"
 ca_honduras_events.52.b:0 "Que lo lleven las parroquias"
 ca_honduras_events.53.t:0 "Los bienes de la Iglesia devueltos"
 ca_honduras_events.53.d:0 "Ferrera ordena devolver los bienes confiscados bajo la Federación. Los hombres que los perdieron son los hombres que lo pusieron en el cargo, que es toda la explicación."
 ca_honduras_events.53.f:0 "«Una revolución deshecha por decreto, a favor de los que pagaron el decreto.»"
 ca_honduras_events.53.a:0 "Devolver los bienes"
 ca_honduras_events.53.b:0 "El Estado se queda con lo que tomó"
 ca_honduras_events.54.t:0 "Texiguat, Liure, El Corpus, Danlí"
 ca_honduras_events.54.d:0 "Cuatro pueblos del sur se han levantado en otros tantos años, y la administración se ha pasado el periodo entero sofocándolos. Nadie se acuerda de qué iba el primero."
 ca_honduras_events.54.f:0 "«Un gobierno cuya única política es la marcha al siguiente pueblo.»"
 ca_honduras_events.54.a:0 "Sofocarlos"
 ca_honduras_events.54.b:0 "Oír lo que piden"
 ca_honduras_events.55.t:0 "Fin del segundo periodo de Ferrera"
 ca_honduras_events.55.d:0 "El treinta y uno de diciembre se le vence el periodo. Ha restituido el diezmo, el seminario, los bienes de la Iglesia y el ejército, y deja el tesoro como lo encontró."
 ca_honduras_events.55.f:0 "«Entrega la presidencia. No entrega el ejército.»"
 ca_honduras_events.55.a:0 "Que se cumpla el periodo"
 ca_honduras_events.55.b:0 "Prorrogarlo una vez más"
 ca_honduras_events.56.t:0 "Coronado Chávez"
 ca_honduras_events.56.d:0 "La cámara lo elige por dos años y toma el cargo el ocho de enero. Gobernará con un consejo de ministros, y dos de sus miembros son Santos Guardiola y Casto Alvarado."
 ca_honduras_events.56.f:0 "«Fíjense en los nombres del consejo. Uno de ellos va a ser el problema siguiente.»"
 ca_honduras_events.56.a:0 "Coronado Chávez, presidente"
 ca_honduras_events.57.t:0 "Juan Lindo vuelve a casa"
 ca_honduras_events.57.d:0 "El doce de febrero el abogado de Tegucigalpa que gobernó en Comayagua, en Guatemala y en San Salvador toma la presidencia de su propio país. Tiene cincuenta y seis años y ya ha llevado tres estados."
 ca_honduras_events.57.f:0 "«Ha gobernado media Centroamérica. Honduras era el último de la lista.»"
 ca_honduras_events.57.a:0 "Juan Lindo, presidente"
 ca_honduras_events.58.t:0 "Guerra a los Estados Unidos"
 ca_honduras_events.58.d:0 "Lindo declara la guerra a los Estados Unidos en apoyo de México. Honduras no tiene marina, ni dinero, ni frontera con ninguna de las dos partes. Carrera nos ha dicho sin rodeos que esto es una locura."
 ca_honduras_events.58.f:0 "«Un gesto. Pero es la primera política exterior que alguien tiene aquí en diez años.»"
 ca_honduras_events.58.a:0 "Declararla igual"
 ca_honduras_events.58.b:0 "Hacerle caso a Carrera"
 ca_honduras_events.59.t:0 "La Academia del padre Reyes"
 ca_honduras_events.59.d:0 "José Trinidad Reyes ha abierto una academia literaria en Tegucigalpa, y el gobierno piensa hacer una universidad con ella. Es un cura que escribe teatro y enseña física, que en Honduras lo vuelve una institución él solo."
 ca_honduras_events.59.f:0 "«Un hombre, un cuarto, y la primera universidad que va a tener este país.»"
 ca_honduras_events.59.a:0 "Hacerla universidad"
 ca_honduras_events.59.b:0 "Con la academia basta"
 ca_honduras_events.60.t:0 "La Constitución de 1848"
 ca_honduras_events.60.d:0 "Lindo decreta una nueva Constitución el cuatro de febrero. Es la segunda en nueve años, que es o una señal de progreso o una señal de que nadie obedece la primera."
 ca_honduras_events.60.f:0 "«Una constitución nueva sale más barata que hacer cumplir la vieja.»"
 ca_honduras_events.60.a:0 "Decretarla"
 ca_honduras_events.60.b:0 "Quedarnos con la que hay"
 ca_honduras_events.61.t:0 "El Plumper en Trujillo"
 ca_honduras_events.61.d:0 "En octubre el HMS Plumper entró en Trujillo exigiendo mil doscientos pesos por caoba decomisada a las compañías de Belice. El desembarco tomó el puerto, rompió lo que encontró y se fue con el dinero."
 ca_honduras_events.61.f:0 "«Mil doscientos pesos, cobrados por un buque de guerra, a un país sin marina.»"
 ca_honduras_events.61.a:0 "Pagar y protestar"
 ca_honduras_events.61.b:0 "Guarnecer Trujillo"
 ca_honduras_events.62.t:0 "La Isla del Tigre"
 ca_honduras_events.62.d:0 "El cónsul Chatfield ha ordenado que la tropa del HMS Gorgon ocupe la Isla del Tigre, en nuestro propio golfo, sin autorización de su propio gobierno. La guarnición del coronel Lechuga no disparó un tiro."
 ca_honduras_events.62.f:0 "«Un cónsul, por su cuenta, le ha tomado una isla a una república.»"
 ca_honduras_events.62.a:0 "Protestar en todas las capitales"
 ca_honduras_events.62.b:0 "Ofrecer la isla a Washington"
 ca_honduras_events.63.t:0 "El pacto de Chinandega"
 ca_honduras_events.63.d:0 "Squier ha sacado adelante un pacto que garantiza el apoyo estadounidense a cualquier canal que desagüe en el golfo de Fonseca, y quiere un tratado bilateral que asegure nuestra soberanía sobre la Isla del Tigre. Nos está usando contra Chatfield, y nosotros lo estamos usando a él."
 ca_honduras_events.63.f:0 "«La isla no vale nada. Que dos imperios te quieran vale muchísimo.»"
 ca_honduras_events.63.a:0 "Firmar con Squier"
 ca_honduras_events.63.b:0 "Arreglarlo directo con Londres"
 ca_honduras_events.64.t:0 "Veintiún cañonazos"
 ca_honduras_events.64.d:0 "El veintiséis de diciembre la escuadra británica evacúa la Isla del Tigre y la devuelve con salva de veintiún cañonazos. Londres había desautorizado la ocupación casi en cuanto se enteró."
 ca_honduras_events.64.f:0 "«La tomaron en silencio y la devolvieron con banda.»"
 ca_honduras_events.64.a:0 "La isla vuelve a ser nuestra"
 ca_honduras_events.65.t:0 "Squier se pasa"
 ca_honduras_events.65.d:0 "En enero el agente estadounidense proclama la soberanía conjunta sobre la isla. Washington lo desautoriza en semanas. Los dos imperios han desautorizado ya a su propio hombre en el mismo pleito."
 ca_honduras_events.65.f:0 "«Nuestra soberanía sobrevivió porque los dos agentes se pasaron de órdenes.»"
 ca_honduras_events.65.a:0 "Agradecer la desautorización"
 ca_honduras_events.66.t:0 "Clayton y Bulwer"
 ca_honduras_events.66.d:0 "El diecinueve de abril las dos potencias acuerdan neutralizar Centroamérica en lo relativo a un canal interoceánico. Ninguna ocupará, fortificará ni colonizará. La crisis de nuestro golfo acaba en un tratado que no firmamos."
 ca_honduras_events.66.f:0 "«Protegidos por un acuerdo entre los dos países de los que había que protegerse.»"
 ca_honduras_events.66.a:0 "Un tratado que no firmamos"
 ca_honduras_events.67.t:0 "El pacto de Pespire"
 ca_honduras_events.67.d:0 "Guardiola ha convocado sus asambleas en La Paz y en Cedros y se ha alzado contra el gobierno. El Salvador ha mandado a Victoriano Castellanos a mediar, por instrucciones de Vasconcelos. El general sale del país y los civiles se quedan con la presidencia."
 ca_honduras_events.67.f:0 "«Un caudillo sacado del país a fuerza de hablar, y por un vecino. Aquí no había pasado nunca.»"
 ca_honduras_events.67.a:0 "Aceptar la mediación"
 ca_honduras_events.67.b:0 "Arreglarlo con el ejército"
 ca_honduras_events.68.t:0 "Ocotepeque"
 ca_honduras_events.68.d:0 "El cuatro de enero, en Ocotepeque, Lindo firma con El Salvador contra Guatemala. A Nicaragua se la invitó y no quiso. Dos mil hondureños marcharán con los cuatro mil de Vasconcelos."
 ca_honduras_events.68.f:0 "«Lindo gobernó Guatemala una vez. Sabe exactamente contra quién marcha.»"
 ca_honduras_events.68.a:0 "Firmar la alianza"
 ca_honduras_events.68.b:0 "Honduras se queda en casa"
