l_spanish:
 # CAFM - Guatemala 1836-1851 (10 nov 2026). Diseño: CAFM_GUATEMALA.md
 ca_guatemala_events.38.t:0 "Los Códigos de Livingston"
 ca_guatemala_events.38.d:0 "Desde hoy los Códigos de Livingston son la ley de Guatemala: juicio por jurados, habeas corpus, presunción de inocencia. El doctor Gálvez nos ha dado el código más moderno de América. El problema es que nueve de cada diez guatemaltecos no pueden leer la citación que los llama al jurado, y las penitenciarías que la ley exige nunca se construyeron."
 ca_guatemala_events.38.f:0 "«Una ley que el pueblo no puede leer es una ley escrita para otro.»"
 ca_guatemala_events.38.a:0 "Aplicarlos enteros"
 ca_guatemala_events.38.b:0 "Aplicarlos solo en la capital"
 ca_guatemala_events.38.c:0 "Suspender la reforma"
 ca_guatemala_events.3.t:0 "El cólera en la Montaña"
 ca_guatemala_events.3.d:0 "El cólera ha pasado de Belice a Chiquimula y Mita. El gobierno manda médicos, botiquines y la orden de echar cloro en los pozos. En los pueblos ven soldados cortando los caminos y desconocidos vertiendo polvos en el agua, y sacan la única conclusión que les parece razonable."
 ca_guatemala_events.3.f:0 "«No vinieron a curarnos. Vinieron a acabar con nosotros.»"
 ca_guatemala_events.3.a:0 "Cordones sanitarios y medicina en los ríos"
 ca_guatemala_events.3.b:0 "Dejar a los pueblos en paz"
 ca_guatemala_events.3.c:0 "Que los curas repartan la medicina"
 ca_guatemala_events.4.t:0 "Mataquescuintla"
 ca_guatemala_events.4.d:0 "En Mataquescuintla la gente ha atacado al gobernador que venía a imponer la cuarentena. Un joven porquero llamado Rafael Carrera lo ayudó a escapar por el monte, y después se quedó con la gente. El pueblo no va a entregar a los que lo hicieron."
 ca_guatemala_events.4.f:0 "«Le salvó la vida al gobernador y conservó la confianza del pueblo. Las dos cosas nos van a costar caro.»"
 ca_guatemala_events.4.a:0 "Mandar tropa de la capital"
 ca_guatemala_events.4.b:0 "Negociar con los pueblos"
 ca_guatemala_events.4.c:0 "Un castigo ejemplar"
 ca_guatemala_events.9.t:0 "El manifiesto del veneno"
 ca_guatemala_events.9.d:0 "Los campesinos de Santa Rosa han elegido jefe a un pequeño agricultor, Teodoro Mejía. Ha derrotado a los soldados que mandamos y ha publicado un manifiesto: el gobierno quiere envenenar a los campesinos con el pretexto del cólera, para quitarles sus parcelas. Todos los pueblos del oriente lo están leyendo."
 ca_guatemala_events.9.f:0 "«Una mentira viaja más rápido que un médico.»"
 ca_guatemala_events.9.a:0 "Desmentirlo por bando público"
 ca_guatemala_events.9.b:0 "Fusilar a quien lo repita"
 ca_guatemala_events.9.c:0 "Abrir los depósitos de medicina a los pueblos"
 ca_guatemala_events.10.t:0 "La amnistía"
 ca_guatemala_events.10.d:0 "El doctor Gálvez ofrece el perdón a todo el que deponga las armas y vuelva a su casa. Algunos de sus ministros lo llaman rendición. Él responde que un gobierno que no puede perdonar ya está perdido."
 ca_guatemala_events.10.f:0 "«Más vale un rebelde perdonado que un súbdito muerto.»"
 ca_guatemala_events.10.a:0 "Amnistía para quien se desarme"
 ca_guatemala_events.10.b:0 "Ningún perdón a los rebeldes"
 ca_guatemala_events.11.t:0 "El decreto de Jumay"
 ca_guatemala_events.11.d:0 "El decreto traslada a los vecinos de Jumay a Cuajiniquilapa y reparte su ejido entre otros dos pueblos. Es la clase de orden que lleva diez años llenando los tribunales de pleitos y los montes de hombres furiosos. El Boletín Oficial todavía puede imprimir una retractación."
 ca_guatemala_events.11.f:0 "«Les hemos quitado la tierra de debajo de los pies y nos preguntamos por qué no se están quietos.»"
 ca_guatemala_events.11.a:0 "Revocarlo y garantizar los ejidos"
 ca_guatemala_events.11.b:0 "Mantener el decreto"
 ca_guatemala_events.12.t:0 "Una legua cuadrada para cada pueblo"
 ca_guatemala_events.12.d:0 "El gobierno garantizará a cada pueblo una legua cuadrada de ejido, fuera del alcance de los agrimensores y de los que compran tierra baldía por caballerías. El tesoro perderá lo que habrían pagado las haciendas."
 ca_guatemala_events.12.f:0 "«La tierra sale más barata que un ejército.»"
 ca_guatemala_events.12.a:0 "Garantizar los ejidos"
 ca_guatemala_events.12.b:0 "Negar la garantía"
 ca_guatemala_events.13.t:0 "Carrera entra en la capital"
 ca_guatemala_events.13.d:0 "El veintiocho renunció el doctor Gálvez. El treinta y uno los hombres de la Montaña bajaron a la plaza central con machetes, fusiles viejos y ramas verdes en el sombrero. No han saqueado la ciudad. Están esperando a que les digan que se cumplirán sus demandas."
 ca_guatemala_events.13.f:0 "«La ciudad nunca había visto al campo. Ahora el campo está parado en su plaza.»"
 ca_guatemala_events.13.a:0 "Molina promete cumplir sus demandas"
 ca_guatemala_events.13.b:0 "Defender la ciudad"
 ca_guatemala_events.14.t:0 "Las demandas de la Montaña"
 ca_guatemala_events.14.d:0 "No piden ministerios. Quieren que baje el impuesto sobre la tierra, que no se dé tierra ni empleo público a extranjeros, y que se acabe la venta de tierras de los pueblos a las compañías de colonización."
 ca_guatemala_events.14.f:0 "«Ninguna de sus demandas habla de la capital. Todas hablan del suelo que pisan.»"
 ca_guatemala_events.14.a:0 "Conceder las demandas"
 ca_guatemala_events.14.b:0 "Prometer ahora y olvidar después"
 ca_guatemala_events.15.t:0 "Los Altos se separa"
 ca_guatemala_events.15.d:0 "Quetzaltenango no se deja gobernar por una capital que ha caído en manos de la Montaña. Los distritos de occidente se han declarado Estado de Los Altos, con su asamblea, su aduana y su propio asiento en la Federación."
 ca_guatemala_events.15.f:0 "«No se fueron de Guatemala. Se fueron de lo que Guatemala ha llegado a ser.»"
 ca_guatemala_events.15.a:0 "Aceptarlo por ahora"
 ca_guatemala_events.15.b:0 "Mandar tropa enseguida"
 ca_guatemala_events.16.t:0 "Morazán invade"
 ca_guatemala_events.16.d:0 "El presidente de la Federación ha cruzado la frontera con mil soldados salvadoreños para restablecer el orden liberal en Guatemala. Su ejército está mejor instruido que cualquier cosa que podamos poner en el campo."
 ca_guatemala_events.16.f:0 "«Que se quede con la ciudad. El monte es nuestro.»"
 ca_guatemala_events.16.a:0 "Ceder la capital y pelear en el monte"
 ca_guatemala_events.16.b:0 "Darle batalla campal"
 ca_guatemala_events.17.t:0 "Antigua y Villa Nueva"
 ca_guatemala_events.17.d:0 "Antigua cayó en nuestras manos el nueve. Dos días después, en Villa Nueva, la artillería federal sorprendió a nuestras columnas en campo abierto y las deshizo. Es la peor derrota que ha sufrido la Montaña."
 ca_guatemala_events.17.f:0 "«Perdimos el campo. No perdimos los pueblos.»"
 ca_guatemala_events.17.a:0 "Retirarse a la Montaña"
 ca_guatemala_events.17.b:0 "Seguir peleando con lo que queda"
 ca_guatemala_events.18.t:0 "La tregua con Guzmán"
 ca_guatemala_events.18.d:0 "El general Agustín Guzmán ofrece una tregua. Es liberal y soldado honrado, y cree que la guerra terminó. Firmar nos da el invierno para juntar pólvora, plomo y hombres."
 ca_guatemala_events.18.f:0 "«Una tregua es una estación, no una paz.»"
 ca_guatemala_events.18.a:0 "Firmar y rearmarse en silencio"
 ca_guatemala_events.18.b:0 "Rechazar la tregua"
 ca_guatemala_events.19.t:0 "La segunda entrada"
 ca_guatemala_events.19.d:0 "Carrera está otra vez en la capital, y esta vez nadie se lo discute. Mariano Rivera Paz vuelve al gobierno. Cuatro días después la asamblea retoma la soberanía que Guatemala cedió en 1824: libre, soberana e independiente de la Federación."
 ca_guatemala_events.19.f:0 "«La Unión era un techo que levantamos sobre cinco casas. El techo se vino abajo.»"
 ca_guatemala_events.19.a:0 "Restablecer a Rivera Paz y romper con la Federación"
 ca_guatemala_events.19.b:0 "Que Carrera tome el gobierno él mismo"
 ca_guatemala_events.20.t:0 "La reconquista de Los Altos"
 ca_guatemala_events.20.d:0 "Los Altos lleva un año gobernándose solo, y parte de ese año lo pasó reprimiendo a sus propios pueblos indígenas en Santa Catarina Ixtahuacán. Carrera está en el paso con dos mil hombres y el apoyo callado de esos mismos pueblos."
 ca_guatemala_events.20.f:0 "«Los Altos pidió librarse de Guatemala. Sus pueblos pidieron librarse de Los Altos.»"
 ca_guatemala_events.20.a:0 "Invadir y disolver el estado"
 ca_guatemala_events.20.b:0 "Ofrecer un pacto de autonomía"
 ca_guatemala_events.21.t:0 "La última invasión de Morazán"
 ca_guatemala_events.21.d:0 "Ha vuelto con el último ejército que la Federación puede juntar, y ha tomado parte de la ciudad. Se pelea calle por calle y casa por casa, y cada hora bajan más hombres del monte a su espalda."
 ca_guatemala_events.21.f:0 "«Se metió en la única ciudad de Centroamérica que ya no le tiene miedo.»"
 ca_guatemala_events.21.a:0 "Defender la capital casa por casa"
 ca_guatemala_events.21.b:0 "Abrir negociaciones"
 ca_guatemala_events.22.t:0 "La grana de los valles"
 ca_guatemala_events.22.d:0 "La grana ha sustituido al añil como la riqueza de Guatemala. Los nopales de Amatitlán y Antigua son pequeños, trabajosos y asombrosamente rentables, y todo nuestro comercio de exportación descansa ahora sobre un insecto."
 ca_guatemala_events.22.f:0 "«Un tinte conocido es más seguro que un grano desconocido.»"
 ca_guatemala_events.22.a:0 "Impulsar la grana en Amatitlán y Antigua"
 ca_guatemala_events.22.b:0 "Mantener el añil junto a ella"
 ca_guatemala_events.23.t:0 "El Convenio de Guadalupe"
 ca_guatemala_events.23.d:0 "Los pleitos de tierras han sobrevivido a los hombres que los empezaron. El convenio crea un solo juez en la capital para oír todas las disputas de tierras de la república, para que ningún corregidor las resuelva a favor de sus amigos."
 ca_guatemala_events.23.f:0 "«Veinte años de pleitos, y un solo juzgado para acabarlos.»"
 ca_guatemala_events.23.a:0 "Nombrar al juez de tierras"
 ca_guatemala_events.23.b:0 "Dejar los pleitos a los corregidores"
 ca_guatemala_events.24.t:0 "La ley de trabajo de 1846"
 ca_guatemala_events.24.d:0 "Los hacendados no encuentran brazos para la cosecha. La ley obligaría a todo hombre sin propiedad ni oficio a alquilarse, y permitiría a las autoridades entregarlo a la hacienda que lo pida."
 ca_guatemala_events.24.f:0 "«Cuando lo hacía la Corona lo llamábamos vagancia.»"
 ca_guatemala_events.24.a:0 "Restablecer el trabajo forzoso"
 ca_guatemala_events.24.b:0 "Rechazar la ley"
 ca_guatemala_events.25.t:0 "El estanco del aguardiente"
 ca_guatemala_events.25.d:0 "Se perdió el grano y el tesoro está vacío. El estanco del aguardiente lo llenaría en una temporada. También pondría un agente del gobierno en cada alambique de los que el oriente lleva manejando desde que se fueron los españoles."
 ca_guatemala_events.25.f:0 "«No hay manera más rápida de levantar dinero, ni de ganarse más enemigos.»"
 ca_guatemala_events.25.a:0 "Restablecer el estanco"
 ca_guatemala_events.25.b:0 "Dejar los alambiques en paz"
 ca_guatemala_events.26.t:0 "San Juan Sacatepéquez"
 ca_guatemala_events.26.d:0 "El pueblo se ha negado a pagar los impuestos nuevos y ha echado al recaudador. Entró la tropa. Hay muertos de los dos lados y los pueblos de alrededor están mirando a ver qué pasa ahora."
 ca_guatemala_events.26.f:0 "«Cada pueblo es ahora una pregunta que el gobierno tiene que contestar.»"
 ca_guatemala_events.26.a:0 "Reprimirlo"
 ca_guatemala_events.26.b:0 "Negociar con el pueblo"
 ca_guatemala_events.27.t:0 "El Decreto 15: la República de Guatemala"
 ca_guatemala_events.27.d:0 "El gobierno ya avisó a los demás estados y ahora lo pone en la ley. Guatemala es una república soberana, con una población superior a la de muchas repúblicas del antiguo y del nuevo mundo, más de trescientos pueblos y todos los elementos de un poder independiente."
 ca_guatemala_events.27.f:0 "«No nos vamos de Centroamérica. Estamos admitiendo que Centroamérica se fue de nosotros.»"
 ca_guatemala_events.27.a:0 "Proclamar la República"
 ca_guatemala_events.27.b:0 "Esperar a que renazca la Unión"
 ca_guatemala_events.28.t:0 "El levantamiento de Palencia"
 ca_guatemala_events.28.d:0 "José Lucio López, hacendado de Palencia, se ha levantado en Sansur y San Guayaba contra el gobierno que él ayudó a hacer. El oriente está lleno de hombres que pelearon por Carrera en 1838 y desde entonces solo han visto impuestos y levas."
 ca_guatemala_events.28.f:0 "«La Montaña lo hizo. La Montaña lo puede deshacer.»"
 ca_guatemala_events.28.a:0 "Perseguirlo"
 ca_guatemala_events.28.b:0 "Comprarlo con tierras"
 ca_guatemala_events.29.t:0 "El asalto a Palencia"
 ca_guatemala_events.29.d:0 "Han tomado la hacienda del propio Carrera en Palencia y se han llevado unos setecientos fusiles. Peor que los fusiles: entre los que lo hicieron había oficiales que sirvieron a sus órdenes hace nueve años."
 ca_guatemala_events.29.f:0 "«Se han armado en su propia casa.»"
 ca_guatemala_events.29.a:0 "Reconocer el golpe y reorganizarse"
 ca_guatemala_events.29.b:0 "Culpar a los liberales y perseguirlos"
 ca_guatemala_events.30.t:0 "San Jerónimo y Santa Catarina"
 ca_guatemala_events.30.d:0 "Los rebeldes han atacado Santa Catarina Mita y saqueado la gran hacienda de San Jerónimo, en Verapaz, la propiedad más rica de la Iglesia en la república."
 ca_guatemala_events.30.f:0 "«Queman el granero de la Iglesia y el domingo siguen oyendo misa.»"
 ca_guatemala_events.30.a:0 "Defender las haciendas"
 ca_guatemala_events.30.b:0 "Abandonar Verapaz por ahora"
 ca_guatemala_events.31.t:0 "Patzún"
 ca_guatemala_events.31.d:0 "Han asesinado a Sotero Carrera en Antigua. Serapio Cruz se ha levantado en occidente, y los liberales de Chiquimula se han unido a los Lucíos en el oriente. El presidente ha ido él mismo a Patzún."
 ca_guatemala_events.31.f:0 "«Ha perdido un hermano y ha encontrado una guerra por los dos lados.»"
 ca_guatemala_events.31.a:0 "Derrotar a Cruz en Patzún"
 ca_guatemala_events.31.b:0 "Perdonarlo"
 ca_guatemala_events.32.t:0 "El caudillo renuncia"
 ca_guatemala_events.32.d:0 "El oriente está perdido, el occidente está sublevado, y el hombre que ha mantenido unida la república durante diez años no la va a mantener por la fuerza. Ha renunciado a la presidencia y ha salido para Chiapas. Juan Antonio Martínez, liberal moderado, toma el gobierno."
 ca_guatemala_events.32.f:0 "«No lo derribaron. Se fue andando y le dejó la casa a los que la querían.»"
 ca_guatemala_events.32.a:0 "Renunciar y salir al exilio"
 ca_guatemala_events.32.b:0 "Aguantar por la fuerza"
 ca_guatemala_events.33.t:0 "Los Altos otra vez"
 ca_guatemala_events.33.d:0 "Con Carrera fuera, los liberales de Quetzaltenango han declarado independiente a Los Altos por segunda vez. La misma asamblea, la misma aduana, la misma reclamación."
 ca_guatemala_events.33.f:0 "«Diez años, y el occidente no ha cambiado de opinión.»"
 ca_guatemala_events.33.a:0 "Mandar tropa"
 ca_guatemala_events.33.b:0 "Reconocerlos"
 ca_guatemala_events.34.t:0 "Vicente Cruz a las puertas"
 ca_guatemala_events.34.d:0 "Vicente Cruz, que fue vicepresidente con Carrera, ha traído a los rebeldes del oriente hasta las murallas de la capital. Las únicas tropas que pueden romper el sitio son las que están peleando en Los Altos."
 ca_guatemala_events.34.f:0 "«Todos los soldados que tenemos están en la provincia equivocada.»"
 ca_guatemala_events.34.a:0 "Llamar a las tropas de Los Altos"
 ca_guatemala_events.34.b:0 "Negociar con Cruz"
 ca_guatemala_events.35.t:0 "El Tratado de Zacapa"
 ca_guatemala_events.35.d:0 "El general Mariano Paredes, moderado y viejo soldado de Carrera, ha sido elegido presidente y ofrece a los rebeldes los términos de Zacapa: amnistía, mandos locales y el fin de las levas forzosas. Algunos de sus jefes no quieren firmar."
 ca_guatemala_events.35.f:0 "«Una paz que firma la mitad del enemigo es media paz.»"
 ca_guatemala_events.35.a:0 "Firmar el tratado"
 ca_guatemala_events.35.b:0 "Guerra sin cuartel"
 ca_guatemala_events.36.t:0 "El regreso del caudillo"
 ca_guatemala_events.36.d:0 "Volvió de Chiapas en abril y lo derrotaron en Huehuetenango, y no cambió nada: para el veintidós el corregidor de Suchitepéquez se había pronunciado por él, y en junio el gobierno mandó gente a tratar con él. Está pidiendo el ejército."
 ca_guatemala_events.36.f:0 "«Perdió la batalla y ganó el país, que es como lo ha hecho siempre.»"
 ca_guatemala_events.36.a:0 "Nombrarlo comandante general"
 ca_guatemala_events.36.b:0 "Negárselo"
 ca_guatemala_events.37.t:0 "La Arada"
 ca_guatemala_events.37.d:0 "Vasconcelos ha entrado en Chiquimula con seis mil salvadoreños y hondureños, los jefes Lucíos y todos los liberales guatemaltecos del exilio. Carrera tiene mil quinientos hombres y una loma sobre el río, en San José de la Arada."
 ca_guatemala_events.37.f:0 "«Cuatro contra uno, y el terreno es nuestro.»"
 ca_guatemala_events.37.a:0 "Dar batalla en Chiquimula"
 ca_guatemala_events.37.b:0 "Replegarse sobre la capital"
