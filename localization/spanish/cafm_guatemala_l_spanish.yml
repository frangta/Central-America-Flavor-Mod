 gua_e9_a_tt:0 "El bando no sirve de nada: los pueblos le creen a Mejía."
 gua_e28_a_tt:0 "A López lo matan en pocas semanas, pero los demás jefes siguen peleando con su nombre."
 je_ca_gua_montana:0 "La Montaña"
 je_ca_gua_montana_desc:0 "Los pueblos del oriente se han levantado en armas contra el gobierno liberal."
 je_ca_gua_montana_reason:0 "El cólera, los Códigos de Livingston y veinte años de agrimensores han armado al oriente. Si la Montaña llega a la capital, se acabó el experimento liberal."
 je_ca_gua_montana_status_incontenible:0 "La Montaña ya no se puede contener. Los caminos a la capital están abiertos."
 je_ca_gua_montana_status_alta:0 "La Montaña está en rebelión abierta y ha encontrado un jefe."
 je_ca_gua_montana_status_baja:0 "Hay inquietud en los pueblos del oriente, pero todavía no hay ejército."
 je_ca_gua_montana_conclusion_apagada:0 "La revuelta se apagó sola. El gobierno liberal sobrevive."
 je_ca_gua_montana_conclusion_carrera:0 "Los hombres de la Montaña están parados en la plaza central. El doctor Gálvez ha renunciado."
 je_ca_gua_lucios:0 "Los Lucíos"
 je_ca_gua_lucios_desc:0 "El oriente se ha levantado contra el gobierno conservador que ayudó a crear."
 je_ca_gua_lucios_reason:0 "El trabajo forzoso, el estanco del aguardiente y las levas han puesto a los propios veteranos de Carrera en su contra. El Salvador está mirando."
 je_ca_gua_lucios_status_sitio:0 "Los Lucíos dominan el oriente y están a las puertas de la capital."
 je_ca_gua_lucios_status_alta:0 "La revuelta ha pasado de Palencia y el gobierno está perdiendo el campo."
 je_ca_gua_lucios_status_baja:0 "Hay partidas armadas en el oriente, pero el gobierno todavía tiene los caminos."
 je_ca_gua_lucios_conclusion_arada:0 "Los Lucíos están deshechos y se acabó la amenaza liberal de El Salvador."
 je_ca_gua_lucios_conclusion_liberales:0 "Los liberales se han quedado con la república. El caudillo no va a volver."
 ca_button_gua_comisionados:0 "Comisionados a la Montaña"
 ca_button_gua_comisionados_desc:0 "Mandar comisionados a oír las quejas de los pueblos antes de que salgan los machetes. Cuesta autoridad, y la Montaña se enfría."
 ca_button_gua_juez_tierras:0 "El juez de tierras"
 ca_button_gua_juez_tierras_desc:0 "Aplicar de veras el Convenio de Guadalupe: un solo juez en la capital para todos los pleitos de tierras de la república. Los hacendados no nos lo van a agradecer."
 ca_button_gua_estanco:0 "El estanco del aguardiente"
 ca_button_gua_estanco_desc:0 "Poner un agente del gobierno en cada alambique del oriente. Llena el tesoro y llena los montes."
 ca_button_gua_llamar_caudillo:0 "Llamar al caudillo"
