 # CAFM - F5 - Los Altos: textos nuevos
 ca_central_america.2.c:0 "Aprobar el Sexto Estado, con el Soconusco."
 ca_central_america.2.opt_d:0 "Enviar una comisión a estudiar el asunto."
 ca_central_america.2.approve_tt:0 "#bold Los Altos#! se establecerá como #bold Estado miembro#! de la Federación, sin el Soconusco."
 ca_central_america.2.approve_soconusco_tt:0 "#bold Los Altos#! se establecerá como #bold Estado miembro#! de la Federación, #bold incluido el Soconusco#!. A México no le agradará."
 ca_central_america.2.postpone_tt:0 "El Congreso volverá a votar en #bold 6 meses#!. Si lo aplaza una segunda vez, los Altos perderán la paciencia."
 ca_central_america.2.postpone_rebellion_tt:0 "Es el segundo aplazamiento: #N los Altos se alzarán#!."
 ca_central_america.4.c:0 "Que Guatemala se ocupe de sus propios Altos."
 ca_central_america.4.c_tt:0 "La Federación no intervendrá. Cuando Guatemala salga de la Unión #bold reclamará Los Altos#! y podrá recuperarlos por la fuerza.\nEl #bold frente conservador#! empezará un nivel más alto en la Fase IV."
 ca_central_america.120.b_tt:0 "Los Altos quedarán silenciados por ahora, pero si el grito vuelve a alzarse #N tomarán las armas#!."
