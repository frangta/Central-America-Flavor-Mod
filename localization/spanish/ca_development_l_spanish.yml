 ca_coffee_events.1.t:0 "La élite cafetalera"
 ca_coffee_events.1.d:0 "Un puñado de familias se ha enriquecido con el café. Quieren más tierra, crédito barato y un gobierno que las escuche."
 ca_coffee_events.1.f:0 "«El café es oro que crece en los árboles.»"
 ca_coffee_events.1.a:0 "Darles tierra y crédito."
 ca_coffee_events.1.b:0 "Limitar su poder."
 ca_coffee_events.2.t:0 "La República del Café"
 ca_coffee_events.2.d:0 "El café ha transformado el país. Los caminos llevan a los puertos, los bancos prestan a los cafetaleros y las grandes familias del café se sientan en el gobierno."
 ca_coffee_events.2.f:0 "«La República huele a café tostado.»"
 ca_coffee_events.2.a:0 "El futuro está en el café."
 ca_coffee_events.3.t:0 "Los ejidos"
 ca_coffee_events.3.d:0 "Los cafetaleros codician las tierras comunales de los pueblos, los viejos ejidos. Si se vendieran, el café cubriría todo el país; pero los campesinos perderían la tierra que los alimenta."
 ca_coffee_events.3.f:0 "«¿Tierra para el café o tierra para el maíz?»"
 ca_coffee_events.3.a:0 "Abolir las tierras comunales."
 ca_coffee_events.3.b:0 "Respetar los ejidos."
 ca_economy.1.t:0 "El milagro agroexportador"
 ca_economy.1.d:0 "El café, el banano y los barcos que los transportan han hecho al país más rico que nunca. La pregunta es quién se quedará con las ganancias."
 ca_economy.1.f:0 "«El mundo quiere nuestra fruta.»"
 ca_economy.1.a:0 "¡Por fin la prosperidad!"
 ca_economy.2.t:0 "Las compañías bananeras"
 ca_economy.2.d:0 "Compañías fruteras extranjeras ofrecen construir plantaciones, ferrocarriles y puertos en la costa caribe. A cambio quieren tierras, exenciones de impuestos y manos libres."
 ca_economy.2.f:0 "«Traen ferrocarriles; se llevarán el país.»"
 ca_economy.2.a:0 "Otorgar las concesiones."
 ca_economy.2.b:0 "Solo con nuestras condiciones."
 ca_economy.3.t:0 "El ferrocarril al Atlántico"
 ca_economy.3.d:0 "Un ferrocarril de la capital al Caribe llevaría el café a Europa en semanas en lugar de meses. La pregunta es quién lo pagará."
 ca_economy.3.f:0 "«Rieles de hierro hasta el mar.»"
 ca_economy.3.a:0 "Lo construirá el capital extranjero."
 ca_economy.3.b:0 "Lo construiremos con nuestro propio dinero."
 ca_military.1.t:0 "El fin de la era de los caudillos"
 ca_military.1.d:0 "El ejército obedece ahora al gobierno y no al revés. Los generales que antes ponían y quitaban presidentes se han retirado o han aprendido a saludar."
 ca_military.1.f:0 "«La espada sirve a la ley.»"
 ca_military.1.a:0 "Un ejército moderno para una República moderna."
 ca_military.2.t:0 "Los caudillos se atrincheran"
 ca_military.2.d:0 "La reforma ha fracasado. Los caudillos son más fuertes que nunca, y todo general con unos cientos de hombres sueña con la banda presidencial."
 ca_military.2.f:0 "«Quien tiene los soldados tiene la República.»"
 ca_military.2.a:0 "Así sea."
 ca_military.3.t:0 "La academia militar"
 ca_military.3.d:0 "El gobierno quiere fundar una academia militar para formar oficiales que deban su grado al mérito y no a un caudillo. ¿Quién les enseñará?"
 ca_military.3.f:0 "«Los oficiales se hacen, no nacen.»"
 ca_military.3.a:0 "Contratar instructores extranjeros."
 ca_military.3.b:0 "Enseñarán nuestros propios oficiales."
 ca_military.4.t:0 "[SCOPE.sCharacter('ca_caudillo_general').GetFullName] se niega a disolver sus tropas"
 ca_military.4.d:0 "El gobierno ha ordenado disolver las milicias, pero [SCOPE.sCharacter('ca_caudillo_general').GetFullName] se niega. Sus hombres le son leales a él, no a la República."
 ca_military.4.f:0 "«Mis soldados van adonde yo voy.»"
 ca_military.4.a:0 "Desarmarlo por la fuerza."
 ca_military.4.b:0 "Comprar su lealtad."
 ca_culture.1.t:0 "La Ilustración centroamericana"
 ca_culture.1.d:0 "Escuelas en cada pueblo, periódicos en cada café y una universidad que es el orgullo de la nación. Ha crecido leyendo toda una generación de abogados, médicos y poetas."
 ca_culture.1.f:0 "«Un pueblo que lee no puede ser esclavizado.»"
 ca_culture.1.a:0 "El saber es nuestra riqueza."
 ca_culture.1.tt:0 "La Ilustración se ha completado."
 ca_culture.2.t:0 "La universidad"
 ca_culture.2.d:0 "El país necesita una universidad para formar a sus abogados, médicos e ingenieros. Los liberales quieren una universidad laica del Estado; la Iglesia, una pontificia."
 ca_culture.2.f:0 "«Luz, libertad y saber.»"
 ca_culture.2.a:0 "Una universidad laica del Estado."
 ca_culture.2.b:0 "Una universidad pontificia."
 ca_culture.3.t:0 "La prensa liberal"
 ca_culture.3.d:0 "Un grupo de jóvenes liberales quiere fundar un periódico que lo discuta todo: el gobierno, la Iglesia y el futuro de la Unión."
 ca_culture.3.f:0 "«La tinta es más peligrosa que la pólvora.»"
 ca_culture.3.a:0 "Que impriman lo que quieran."
 ca_culture.3.b:0 "Solo con licencia del gobierno."
 ca_culture.4.t:0 "Las escuelas normales"
 ca_culture.4.d:0 "Para enseñar a leer al pueblo, el país necesita maestros. El gobierno puede fundar escuelas normales para formarlos o dejar la enseñanza a los curas párrocos, como siempre."
 ca_culture.4.f:0 "«Primero los maestros, luego las escuelas.»"
 ca_culture.4.a:0 "Fundar escuelas normales."
 ca_culture.4.b:0 "Los curas enseñarán como siempre."
 ca_coffee_republic_modifier:0 "La República del Café"
 ca_coffee_republic_modifier_desc:0 "El café manda en la economía y las familias del café mandan en el país."
