l_spanish:
 # CAFM - Nicaragua fase 2, Honduras fase 2 y la Mosquitia (10 nov 2026)
 ca_mosquitia_events.1.t:0 "Londres reconoce el reino"
 ca_mosquitia_events.1.d:0 "El gobierno británico reconoce formalmente al reino misquito como Estado independiente. El reconocimiento no vino porque lo pidiéramos. Vino porque la pretensión española sobre esta costa está por fin muerta y alguien tenía que heredarla."
 ca_mosquitia_events.1.f:0 "«Somos un reino porque a un imperio le conviene que lo seamos.»"
 ca_mosquitia_events.1.a:0 "Aceptar el reconocimiento"
 ca_mosquitia_events.1.b:0 "Un reino no necesita permiso"
 ca_mosquitia_events.2.t:0 "El testamento del rey"
 ca_mosquitia_events.2.d:0 "El testamento de Robert Charles Frederick crea un consejo para llevar los asuntos del reino y aconsejar una regencia para su heredero. El heredero es un niño de siete años. El consejo es la primera institución escrita que ha tenido esta costa."
 ca_mosquitia_events.2.f:0 "«Un consejo en el papel, para un reino sin capital y sin tesoro.»"
 ca_mosquitia_events.2.a:0 "Constituir el consejo"
 ca_mosquitia_events.2.b:0 "Que decidan los caciques como siempre"
 ca_mosquitia_events.3.t:0 "El desembarco en San Juan"
 ca_mosquitia_events.3.d:0 "El doce de agosto el superintendente de Honduras Británica y el rey desembarcaron en San Juan del Norte y declararon el pueblo y toda la Costa Atlántica parte del reino. El aduanero nicaragüense lo miró desde la playa."
 ca_mosquitia_events.3.f:0 "«El rey reclamó un puerto. El superintendente decidió cuál.»"
 ca_mosquitia_events.3.a:0 "Reclamar la boca del río"
 ca_mosquitia_events.3.b:0 "El río no es nuestro"
 ca_mosquitia_events.4.t:0 "El príncipe Wellington, el coronel Johnson, el general Lowrey"
 ca_mosquitia_events.4.d:0 "El cuatro de mayo Londres reconoce una regencia de tres hombres con títulos ingleses que se pusieron ellos mismos. Gobernarán hasta que coronen al niño, y gobiernan desde donde atracan los barcos."
 ca_mosquitia_events.4.f:0 "«Tres regentes, tres títulos, y ningún acuerdo sobre quién manda a quién.»"
 ca_mosquitia_events.4.a:0 "Que gobiernen los tres regentes"
 ca_mosquitia_events.4.b:0 "Un regente, no tres"
 ca_mosquitia_events.5.t:0 "Un cónsul en Bluefields"
 ca_mosquitia_events.5.d:0 "Gran Bretaña declara un nuevo protectorado y manda a Patrick Walker como cónsul general ante el rey, con sede en Bluefields. No es un embajador ante una corte. Es el nuevo secretario de la corte, y va a firmar por ella."
 ca_mosquitia_events.5.f:0 "«El reino ha conseguido un gobierno, y no lo eligió.»"
 ca_mosquitia_events.5.a:0 "Recibir al cónsul"
 ca_mosquitia_events.5.b:0 "Recibirlo, y quedarse con el sello"
 ca_mosquitia_events.6.t:0 "Del cabo de Honduras al San Juan"
 ca_mosquitia_events.6.d:0 "El protectorado se declara desde el cabo de Honduras, al norte, hasta la boca del San Juan, al sur, San Juan del Norte incluido. En el papel son cuatrocientas leguas de costa. En el suelo son los pueblos donde pueden atracar los barcos."
 ca_mosquitia_events.6.f:0 "«Nuestra frontera está donde pueda amarrar una goleta.»"
 ca_mosquitia_events.6.a:0 "Reclamar la costa entera"
 ca_mosquitia_events.6.b:0 "Reclamar solo lo que gobernamos"
 ca_mosquitia_events.7.t:0 "La coronación en Belice"
 ca_mosquitia_events.7.d:0 "El siete de mayo coronan a George Augustus Frederick en Belice, con unos doce años, siguiendo la forma de 1816. Lo coronan rey de la Costa de Mosquitos en la capital de otro país."
 ca_mosquitia_events.7.f:0 "«A un rey coronado en el extranjero se lo puede descoronar en el extranjero.»"
 ca_mosquitia_events.7.a:0 "Coronarlo en Belice"
 ca_mosquitia_events.7.b:0 "Coronarlo en Bluefields"
 ca_mosquitia_events.8.t:0 "El rey despide a los regentes"
 ca_mosquitia_events.8.d:0 "Tiene trece años y ha disuelto el consejo de regencia, y lo ha reemplazado con hombres escogidos por él: criollos de Bluefields que leen, escriben y comercian. Los tres regentes de títulos ingleses están fuera."
 ca_mosquitia_events.8.f:0 "«El primer acto de su reinado es deshacerse de los que se lo llevaban.»"
 ca_mosquitia_events.8.a:0 "Un consejo de criollos de Bluefields"
 ca_mosquitia_events.8.b:0 "Conservar a los regentes"
 ca_mosquitia_events.9.t:0 "Las leyes del consejo"
 ca_mosquitia_events.9.d:0 "El consejo nuevo ha aprobado leyes sobre una milicia local, sobre concesiones de tierra, sobre procedimiento judicial y sobre el corte de madera. Cuatro leyes. Es más gobierno del que ha tenido esta costa en trescientos años."
 ca_mosquitia_events.9.f:0 "«Una milicia, un registro de tierras, un tribunal y una licencia de madera. Eso es un Estado.»"
 ca_mosquitia_events.9.a:0 "Aprobar las cuatro"
 ca_mosquitia_events.9.b:0 "Solo la ley de la milicia"
 ca_mosquitia_events.10.t:0 "El ultimátum"
 ca_mosquitia_events.10.d:0 "El rey emite un ultimátum: las fuerzas nicaragüenses deben salir de San Juan del Norte antes del primero de enero. El ultimátum va en nombre del rey. Los dos buques de guerra que lo van a hacer cumplir no son suyos."
 ca_mosquitia_events.10.f:0 "«Nuestro primer ultimátum, y no hemos tenido que hacer una marina para mandarlo.»"
 ca_mosquitia_events.10.a:0 "Mandar el ultimátum"
 ca_mosquitia_events.10.b:0 "Negociar con Nicaragua"
 ca_mosquitia_events.11.t:0 "El primero de enero"
 ca_mosquitia_events.11.d:0 "El ultimátum venció y las fuerzas misquitas y británicas, con dos buques de guerra, tomaron San Juan del Norte. La guarnición se fue. El pueblo queda anexado al reino."
 ca_mosquitia_events.11.f:0 "«El reino tiene un puerto en el Atlántico y un río interoceánico detrás.»"
 ca_mosquitia_events.11.a:0 "Tomar el pueblo"
 ca_mosquitia_events.11.b:0 "Ocuparlo solo en nombre del rey"
 ca_mosquitia_events.12.t:0 "Greytown"
 ca_mosquitia_events.12.d:0 "El siete de marzo Nicaragua firma un tratado que cede el pueblo, y se rebautiza Greytown por el gobernador de Jamaica. La única renta de verdad del reino serán los derechos de un puerto con nombre de funcionario británico."
 ca_mosquitia_events.12.f:0 "«Ganamos un puerto y perdimos el ponerle nombre en la misma semana.»"
 ca_mosquitia_events.12.a:0 "Cobrar los derechos de puerto"
 ca_mosquitia_events.12.b:0 "Conservar el nombre viejo"
 ca_mosquitia_events.13.t:0 "Walker ha muerto"
 ca_mosquitia_events.13.d:0 "El cónsul general ha muerto, en el mismo año de su mayor éxito. Quien mande Londres a continuación heredará un reino que acaba de aprender cuánto se puede hacer en su propio nombre."
 ca_mosquitia_events.13.f:0 "«El hombre que firmaba por nosotros ya no está. La pregunta es si ahora firma alguien por nosotros.»"
 ca_mosquitia_events.13.a:0 "Que gobierne solo el consejo"
 ca_mosquitia_events.13.b:0 "Pedirle a Belice otro cónsul"
 ca_mosquitia_events.14.t:0 "Clayton y Bulwer"
 ca_mosquitia_events.14.d:0 "El diecinueve de abril las dos potencias acuerdan que ninguna ocupará, fortificará ni colonizará Nicaragua, Costa Rica ni la Costa de Mosquitos. El reino está nombrado en el tratado y no fue consultado."
 ca_mosquitia_events.14.f:0 "«Protegidos y vendidos en la misma frase.»"
 ca_mosquitia_events.14.a:0 "Un tratado donde nos nombran"
 ca_mosquitia_events.14.b:0 "Protestar que nos repartan"
 ca_mosquitia_events.15.t:0 "El Prometheus"
 ca_mosquitia_events.15.d:0 "El veintiuno de noviembre un buque de guerra británico disparó sobre un vapor estadounidense en nuestro puerto por derechos impagos. Los derechos son del reino. Ninguna de las dos marinas de la bahía lo mencionó."
 ca_mosquitia_events.15.f:0 "«Se pelearon por nuestra tarifa sin consultarnos ni una vez.»"
 ca_mosquitia_events.15.a:0 "Los derechos son del reino"
 ca_mosquitia_events.15.b:0 "Que lo lleve el cónsul"
 ca_mosquitia_events.16.t:0 "Los ríos de la caoba"
 ca_mosquitia_events.16.d:0 "Las compañías de Belice trabajan el Patuca, el Coco y el Escondido, y les pagan a los caciques en ron y tela cuando pagan algo. La ley de corte de madera del consejo existe para convertir eso en una licencia."
 ca_mosquitia_events.16.f:0 "«Lo más rico que tenemos es la madera, y no nos han pagado por un solo palo.»"
 ca_mosquitia_events.16.a:0 "Cobrar las licencias"
 ca_mosquitia_events.16.b:0 "Que los caciques sigan con lo suyo"
 ca_mosquitia_events.17.t:0 "Zarzaparrilla y carey"
 ca_mosquitia_events.17.d:0 "Entre temporadas de madera la costa vive de la raíz de zarzaparrilla, el carey y lo que compren las balandras jamaiquinas. No es mucho, y es el único ingreso que es enteramente nuestro."
 ca_mosquitia_events.17.f:0 "«Comercio chico, en botes chicos, y nadie en Londres tiene una opinión al respecto.»"
 ca_mosquitia_events.17.a:0 "Proteger el comercio chico"
 ca_mosquitia_events.17.b:0 "Cortejar a las casas jamaiquinas"
 ca_mosquitia_events.18.t:0 "Río arriba"
 ca_mosquitia_events.18.d:0 "El consejo se sienta en Bluefields y legisla para una costa. Río arriba los sumus y los ramas le responden a sus propios caciques y no han visto nunca a un recaudador misquito, ni mucho menos a un cónsul británico."
 ca_mosquitia_events.18.f:0 "«Somos un reino de la orilla. Todo lo de atrás es de otros.»"
 ca_mosquitia_events.18.a:0 "Gobernar por medio de los caciques"
 ca_mosquitia_events.18.b:0 "Mandar la milicia río arriba"
 ca_mosquitia_events.19.t:0 "Honduras reclama el norte"
 ca_mosquitia_events.19.d:0 "Tegucigalpa insiste en que la costa del cabo de Honduras a Cabo Gracias a Dios es territorio hondureño y que el reino es un invento británico. Las dos mitades de eso son en parte ciertas."
 ca_mosquitia_events.19.f:0 "«Ellos tienen el mapa y nosotros los caseríos. Ninguno de los dos tiene el río.»"
 ca_mosquitia_events.19.a:0 "Sostener el reclamo del norte"
 ca_mosquitia_events.19.b:0 "Quedarse en Cabo Gracias a Dios"
 ca_mosquitia_events.20.t:0 "Una oficina en Belice"
 ca_mosquitia_events.20.d:0 "El rey firma lo que le ponen delante, el consejo se reúne cuando lo convoca el cónsul y la renta del reino es una asignación. Todavía hay una corona. Ya no hay nadie debajo de ella que decida nada."
 ca_mosquitia_events.20.f:0 "«El reino sobrevive. Está archivado en Belice, en protectorados.»"
 ca_mosquitia_events.20.a:0 "Firmar lo que nos pongan"
 ca_mosquitia_events.20.b:0 "El consejo se reunirá por su cuenta"
