l_spanish:
 # =========================================================================
 # CAFM - Bocas del Toro (1836-1837): new texts
 # Source: letter of Ildefonso de Paredes, 21 Jan 1837, Revista del
 # Archivo Nacional 3 (1938), pp. 72-73
 # =========================================================================

 ca_costa_rica_events.161.d_defendida:0 "18 de diciembre de 1836. Ildefonso de Paredes ha llegado a Bocas del Toro con dos buques de guerra, solo para encontrar el Distrito de Morazán guarnecido y preparado. Filemón Galindo se negó a retirarse. Tras un tenso intercambio de notas, los barcos granadinos han levado anclas. Nueva Granada no olvidará la afrenta."
 ca_costa_rica_events.161.b:0 "El distrito resiste. Paredes se retira."

 ca_costa_rica_events.162.t:0 "La carta de Paredes"
 ca_costa_rica_events.162.d:0 "21 de enero de 1837. Llega una carta desde Bocas del Toro, firmada por Ildefonso de Paredes como jefe político del cantón por la República de la Nueva Granada. Bocas del Toro, escribe, «pertenece indisputablemente a la Nueva Granada». Pide a San José que explique sus intenciones y que declare si reconoce el tratado del 15 de marzo de 1825 entre Colombia y Centroamérica, que la Nueva Granada aún considera vigente."
 ca_costa_rica_events.162.f:0 "«Libertad y Orden», dice la firma. Ninguna de las dos para nosotros."
 ca_costa_rica_events.162.a:0 "Llevar la protesta a la Federación."
 ca_costa_rica_events.162.b:0 "Responderle nosotros mismos, sin esperar a San Salvador."
 ca_costa_rica_events.162.c:0 "Aceptar el statu quo del tratado de 1825."

 je_ca_cos_bocas_del_toro_status_defendida:0 "El Distrito de Morazán resistió. Nueva Granada se retiró, pero no ha renunciado."
