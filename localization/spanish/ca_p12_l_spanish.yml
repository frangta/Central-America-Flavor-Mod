l_spanish:
 # CAFM P12 - diario "Nuestro papel en la República" (espectro federal y widget)
 CA_ROLE_BOX:0 "#bold [GetPlayer.GetRuler.GetFullName]#! gobierna el Estado.  Aguja: #bold [GetPlayer.MakeScope.ScriptValue('ca_role_spectrum_value')|0]#! (de -50 a +50)\nLealtad a la Federación: #bold [GetPlayer.MakeScope.ScriptValue('ca_role_own_loyalty')|0]#! / 3  ·  Lucha interna: #bold [GetPlayer.MakeScope.Var('ca_fvs_bar').GetValue|0]#! / 100 (100 = ganan los federalistas)\nFacciones en el Estado: Federalistas #bold [GetPlayer.MakeScope.Var('ca_federalist_influence').GetValue|0]#! / 3 · Centralistas #bold [GetPlayer.MakeScope.Var('ca_centralist_influence').GetValue|0]#! / 3 · Separatistas #bold [GetPlayer.MakeScope.Var('ca_separatist_influence').GetValue|0]#! / 3"
 je_ca_state_role_in_federation_zone_centralist:0 "La aguja está en el #bold centralismo#!: nuestro Estado se somete a la capital federal y a su orden unitario."
 je_ca_state_role_in_federation_zone_federal:0 "La aguja está en el #bold pacto federal#!: soberanos en casa y leales a la Unión, como quiso la Constitución de 1824."
 je_ca_state_role_in_federation_zone_separatist:0 "La aguja está en el #bold separatismo#!: la soberanía del Estado pesa más que la Unión."
 ca_role_zone_cen_on:0 "#bold Centralismo#!"
 ca_role_zone_cen_off:0 "#lore Centralismo#!"
 ca_role_zone_fed_on:0 "#bold Pacto federal#!"
 ca_role_zone_fed_off:0 "#lore Pacto federal#!"
 ca_role_zone_sep_on:0 "#bold Separatismo#!"
 ca_role_zone_sep_off:0 "#lore Separatismo#!"
 ca_role_zone_cen_tt:0 "#bold Centralismo#! (aguja de #v -50#! a #v -17#!)\nEfecto: +20 de autoridad, -10 de deseo de libertad, -2 de aprobación de la intelligentsia.\nCon la facción centralista a 3, se prepara el golpe centralista."
 ca_role_zone_fed_tt:0 "#bold Pacto federal#! (aguja de #v -16#! a #v +16#!)\nEfecto: +5 de legitimidad."
 ca_role_zone_sep_tt:0 "#bold Separatismo#! (aguja de #v +17#! a #v +50#!)\nEfecto: +10 de deseo de libertad, +1 de aprobación de los terratenientes.\nEn modo dinámico, solo en esta zona pueden saltar los eventos de separatismo y de declaración de independencia."
 ca_role_btn_federation:0 "Apoyar la Federación (aguja hacia 0)"
 ca_role_btn_confederation:0 "Apoyar la Confederación (aguja +5)"
 ca_role_btn_sabotage:0 "Sabotear la Federación (aguja +10)"
 ca_role_btn_centralists:0 "Apoyar a los centralistas (aguja -10)"
 ca_role_spectrum_allows_separatism_tt:0 "La aguja de #bold Nuestro papel en la República#! está en la zona separatista (#v +17#! o más)"
 ca_spectrum_zone_centralist:0 "Estado centralista"
 ca_spectrum_zone_centralist_desc:0 "Nuestro Estado se somete a la capital federal."
 ca_spectrum_zone_federal:0 "Estado federal"
 ca_spectrum_zone_federal_desc:0 "Nuestro Estado mantiene el pacto federal de 1824."
 ca_spectrum_zone_separatist:0 "Estado separatista"
 ca_spectrum_zone_separatist_desc:0 "Nuestro Estado pone su soberanía por encima de la Unión."
