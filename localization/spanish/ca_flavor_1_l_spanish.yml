l_spanish:
 # ==========================================
 # 1. CONCEPTS & DIPLOMATIC PACTS
 # ==========================================
 concept_constitution:0 "Constitución"
 concept_constitution_desc:0 "Los principios fundamentales según los cuales se reconoce que un Estado está gobernado."
 concept_ca_confederation:0 "Confederación"
 concept_ca_confederation_desc:0 "Una unión laxa de Estados soberanos unidos para la acción común."
 concept_ca_chartered_company:0 "Compañía con cédula"
 concept_ca_chartered_company_desc:0 "Las [Concept('concept_recognized_power','$concept_recognized_powers$')] pueden establecer una $concept_chartered_company$. Una $concept_chartered_company$ es un tipo de [concept_subject] más autónomo, capaz de iniciar sus propias [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] y que no está obligado a unirse a las [Concept('concept_war','$concept_wars$')] de su [Concept('concept_overlord','$concept_overlord_possessive$')]. Debe pagar cada semana el #v 20%#! de sus ingresos del [concept_treasury] a su $concept_overlord$ y tiene restricciones para declarar la independencia."
 concept_real_union:0 "Unión real"
 concept_real_union_desc:0 "Dos [Concept('concept_country', '$concept_countries$')] pueden unirse en una $concept_real_union$, un [concept_subject] que simboliza la unión de dos o más $concept_countries$ que comparten algunas instituciones del Estado, a diferencia de las uniones personales. El súbdito no puede iniciar sus propias [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], pero está obligado a unirse a las [Concept('concept_war','$concept_wars$')] de su $concept_overlord$."
 concept_ca_dependency:0 "Dependencia"
 concept_ca_dependency_desc:0 "Un país grande puede convertir una región en $concept_ca_dependency$, una relación de [concept_subject] en la que el socio menor está casi totalmente integrado en el [concept_overlord]. El súbdito no puede iniciar sus propias [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], pero está obligado a unirse a las [Concept('concept_war','$concept_wars$')] de su $concept_overlord$."
 concept_confederative_partner:0 "Socio confederado"
 concept_confederative_partner_desc:0 "Dos países pueden unirse como $confederative_partner$, una relación de [concept_subject] en la que el socio menor es casi totalmente independiente pero mantiene una estrecha relación con el [concept_overlord]. El súbdito está protegido por su señor en las [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] y está obligado a unirse a las [Concept('concept_war','$concept_wars$')] de su $concept_overlord$."
 concept_ca_autonomous_province:0 "Provincia autónoma"
 concept_ca_autonomous_province_desc:0 "Un país puede ser poco más que una región con una autonomía considerable, lo que lo convierte en una [concept_ca_autonomous_province], una relación de [concept_subject] en la que el socio menor está casi totalmente integrado en el [concept_overlord]. El [concept_subject] está protegido por su señor en las [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], pero no está obligado a unirse a las [Concept('concept_war','$concept_wars$')] de su $concept_overlord$. A una $concept_ca_autonomous_province$ no se le puede conceder la independencia, pero el [concept_subject] puede ganarla frente a su [concept_overlord] en un $concept_diplomatic_play$."
 concept_defensive_pact_confederation:0 "Pacto defensivo"
 concept_defensive_pact_confederation_desc:0 "Un [concept_diplomatic_pact] entre dos [Concept('concept_country','$concept_countries$')]. Los $concept_countries$ con un $concept_defensive_pact$ siempre pueden ponerse del lado del otro en las [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] en las que sean el objetivo principal, tenga o no el otro bando un [concept_active_interest] en la [concept_strategic_region] afectada. Esto no se aplica a las $concept_diplomatic_plays$ en las que la otra parte es la iniciadora, ni cuando respalda a un tercer $concept_country$ como objetivo principal."

 ca_confederative_partner:0 "Socio confederado"
 ca_confederative_partner_desc:0 "Hacer de este país un socio de nuestra Confederación."
 ca_confederative_partner_action_propose_name:0 "Proponer la Confederación"
 ca_confederative_partner_action_break_name:0 "Salir de la Confederación"
