 # ==========================================
 # JOURNAL ENTRIES (Situations & Events)
 # ==========================================
 
 je_ca_agro_export_boom:0 "El auge agroexportador"
 je_ca_agro_export_boom_reason:0 "La demanda mundial de nuestros cultivos comerciales se dispara. Ampliando nuestras plantaciones, atrayendo inversión extranjera y modernizando nuestra infraestructura, podemos inaugurar una era de prosperidad económica sin precedentes."
 
 je_ca_military_reform:0 "Reformas militares centroamericanas"
 je_ca_military_reform_reason:0 "Nuestras fuerzas armadas dependen hoy de tácticas coloniales anticuadas y de milicias locales indisciplinadas. Debemos profesionalizar el ejército y centralizar el mando para asegurar nuestra soberanía y mantener el orden interno."
 
 je_national_geological_survey:0 "Inspección geológica nacional"
 je_national_geological_survey_reason:0 "Para aprovechar plenamente la riqueza natural oculta de nuestra nación, debemos encargar una inspección geológica completa. Cartografiar nuestras regiones indómitas revelará nuevas vetas minerales y posibles sitios de excavación."
 je_annex_subject_overlord:0 "Integrando [SCOPE.sCountry('annex_target_scope').GetName]"
 je_annex_subject_overlord_concluded:0 "Integrando a un súbdito"
 je_annex_subject_overlord_reason:0 "Hemos iniciado el proceso para integrar por completo a nuestro súbdito en nuestra nación. Mientras ninguna potencia extranjera interfiera, sus instituciones se fundirán poco a poco con las nuestras."
 je_annex_subject_overlord_goal:0 "Meses de integración"
 je_annex_subject_junior:0 "Integración en [SCOPE.sCountry('overlord_scope').GetName]"
 je_annex_subject_junior_concluded:0 "Integración en el señor"
 je_annex_subject_junior_reason:0 "Nuestro señor ha iniciado el proceso para absorber nuestra nación. A menos que intervenga una potencia extranjera, pronto dejaremos de existir como Estado separado."
 je_annex_subject_junior_goal:0 "Meses de integración"

 je_ca_central_american_fragile_unity:0 "Una unidad frágil"
 je_ca_central_american_fragile_unity_reason:0 "La República Federal de Centroamérica se mantiene unida por poco más que la costumbre y el miedo. Federalistas, centralistas y separatistas tiran del istmo en direcciones distintas. Quien incline la balanza decidirá si Centroamérica sobrevive como una sola nación o se rompe en pedazos."

 je_ca_company_independence:0 "Independencia de la compañía"
 je_ca_company_independence_reason:0 "Gobernamos estas tierras con una cédula otorgada por un señor lejano. Si la compañía pierde sus privilegios, la colonia que construyó tendrá que aprender a valerse por sí misma."
 je_ca_company_autonomy:0 "Autonomía de la compañía"
 je_ca_company_autonomy_reason:0 "Nuestra compañía con cédula ha prosperado lo suficiente como para exigir más libertad a su señor. Una colonia rica puede negociar en sus propios términos."
 je_ca_company_bankruptcy:0 "Bancarrota de la compañía"
 je_ca_company_bankruptcy_reason:0 "La compañía ha caído en deudas. Si no puede pagar a sus acreedores, su señor tomará el control directo de sus asuntos."

 je_ca_national_geological_survey:0 "Inspección geológica nacional"
 je_ca_national_geological_survey_reason:0 "Para aprovechar plenamente la riqueza natural oculta de nuestra nación, debemos encargar una inspección geológica completa. Cartografiar nuestras regiones indómitas revelará nuevas vetas minerales y posibles sitios de excavación."
  
