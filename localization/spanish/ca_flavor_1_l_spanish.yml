 # UCA - United Provinces of Central America

 # RDT - Talamanca (Bribri / Indigenous Autonomy)
 RDT_FLAVOR_TEXT:0 "En lo profundo de las selvas impenetrables y las montañas escarpadas del sur, los pueblos indígenas de Talamanca han conservado durante siglos su autonomía y sus tradiciones ancestrales. Tras resistir a los conquistadores españoles y a los nuevos Estados centroamericanos, los bribris y cabécares se mantienen como feroces defensores de sus tierras soberanas. En un mundo que se industrializa rápidamente y tiene hambre de recursos, debes guiar a tu pueblo para adaptarse, resistir y sobrevivir al avance del colonialismo."

# CIP - Soconusco (Disputed Neutral Territory)
 CIP_FLAVOR_TEXT:0 "El Soconusco se encuentra en la frontera fracturada entre la República Mexicana y la República Federal de Centroamérica. Tras el derrumbe del Primer Imperio Mexicano, mientras Chiapas era anexionada por México, la valiosa y rica región del Soconusco declaró con valentía su neutralidad absoluta. Hoy, como territorio muy disputado y codiciado por las potencias del norte y del sur, este rico enclave agrícola debe navegar aguas diplomáticas traicioneras. Al amanecer de 1836, ¿mantendrá el Soconusco su precaria autonomía o se verá obligado a tomar partido mientras el istmo se hunde en el caos?"
 
