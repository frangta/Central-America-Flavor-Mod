 # ==========================================
 # 3. JOURNAL ENTRIES (JEs) & CAUDILLO FLAVOR
 # ==========================================
 je_central_america_falls_apart:0 "La disolución de Centroamérica"
 je_central_america_falls_apart_reason:0 "La última década ha dejado a Centroamérica polarizada. Las tensiones entre liberales y conservadores crecen cada día y, a menos que logremos restablecer el orden en las provincias, el futuro de la Unión parece incierto."
 je_ca_reunify_central_america:0 "Reunificación centroamericana"
 je_ca_reunify_central_america_reason:0 "El derrumbe de las Provincias Unidas del Centro de América en feudos dispersos ha dejado a la región empobrecida y expuesta a la explotación más codiciosa. Si Centroamérica quiere aprovechar plenamente el potencial de la era moderna, debe mantenerse unida."
 je_central_american_national_identity:0 "Una nueva identidad nacional"
 je_central_american_national_identity_reason:0 "Aunque una vez formamos parte de un conjunto mayor, compartiendo un gobierno colonial y una dirección común con nuestros vecinos, nos hemos distanciado mucho desde que ganamos la independencia. Es hora de asumir plenamente una nueva identidad [SCOPE.sCulture('new_ca_national_culture').GetName]."
 je_central_american_national_identity_emergence:0 ""
 je_central_american_national_identity_emergence_goal:0 ""
 je_central_american_national_identity_emergence_reason:0 ""
 je_central_american_national_identity_integrate_a_state:0 "Promover la identidad nacional"
 je_central_american_national_identity_integrate_a_state_desc:0 "Inicia una campaña para impulsar la integración de nuestra nueva cultura nacional en todo el país, creando nuevas patrias [SCOPE.sCulture('new_ca_national_culture').GetName] en nuestros [Concept('concept_incorporated_state', '$concept_incorporated_states$')] [SCOPE.sCulture('old_ca_national_culture').GetName]."
 je_ca_coffee_boom:0 "El auge del café"
 je_ca_coffee_boom_reason:0 "La demanda mundial de café es una oportunidad sin precedentes para modernizar nuestra nación."
 je_ca_state_role_in_federation:0 "Nuestro papel en la República"
 je_ca_state_role_in_federation_reason:0 "Debemos decidir si nuestro futuro está ligado a la capital federal o si nuestro destino es la soberanía."
 je_ca_enlightenment:0 "La Ilustración centroamericana"
 je_ca_enlightenment_reason:0 "Promover la educación laica y las ideas liberales para sacar a nuestra población del oscurantismo."
 je_central_american_fragile_unity:0 ""
 je_frca_support_progress_desc:0 "El nivel actual de apoyo a la República Federal de Centroamérica en medio de crecientes tensiones separatistas. Cada punto representa la lealtad de los Estados al ideal federal. A medida que el apoyo decae, el sueño de una Centroamérica unida se desvanece."
 ca_je_fragile_unity_goal_tt:0 "Objetivo: restaurar y estabilizar la frágil unidad de Centroamérica."
 je_federalists_vs_separatists_goal_tt:0 "Federalistas contra separatistas: una disputa por el control. Los federalistas buscan la unidad; los separatistas presionan por la independencia."
 je_restore_order_gua_button:0 ""
