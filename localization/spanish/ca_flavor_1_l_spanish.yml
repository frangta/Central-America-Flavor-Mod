 ca_button_centralist_discipline:0 "Disciplina centralista"
 ca_button_centralist_discipline_desc:0 "Usar el ejército para imponer la autoridad del gobierno federal en las provincias rebeldes. Se restablecerá el orden, pero crecerá el resentimiento entre las clases medias y bajas."
 ca_button_federalist_support:0 "Movilizar el apoyo federalista"
 ca_button_federalist_support_desc:0 "Los intelectuales del gobierno llaman a los ciudadanos a defender la República Federal con panfletos y discursos a favor de la Unión."

 ca_button_sabotage_federation:0 "Sabotear la Federación"
