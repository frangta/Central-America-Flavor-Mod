 ca_confederative_partner_action_notification_desc:0 "Hemos sido invitados a unirnos a la Confederación."
 ca_confederative_partner_action_ask_to_break_name:0 "Pedir salir de la Confederación"
 ca_confederative_partner_proposal_notification_break_name:0 "Ruptura de la Confederación"
 ca_confederative_partner_proposal_notification_break_desc:0 "Han salido de la Confederación."
 ca_confederative_partner_proposal_break_accepted_name:0 "Salida aceptada"
