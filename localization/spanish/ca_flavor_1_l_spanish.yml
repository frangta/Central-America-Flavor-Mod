 ca_button_support_confederation:0 "Promover una Confederación"
 ca_button_support_confederation_desc:0 "Proponer una confederación laxa de Estados soberanos: unidos en el nombre y en la defensa, pero libres de gobernarse. Un camino intermedio entre la Unión y la separación."

