 ca_armed_forces_support_fascist:0 "[SCOPE.gsInterestGroup('army_scope').GetName] apoyará a [SCOPE.sParty('fascist_party').GetName] bajo el liderazgo de [SCOPE.sCharacter('army_leader').GetFullName]"

 ca_caudillo.2.a:0 "Un gran día para el orden y la disciplina."
 ca_caudillo.2.f:0 "Y así el padre se ha vuelto, como todos los hombres, demasiado viejo y demasiado cansado para seguir. Ahora, querido hijo, el país está listo para dar sus primeros pasos de verdad. Vivimos sin la mirada de nuestra madre y sin la vara de nuestro padre. Hoy cada cual toma sus decisiones. Y tus nietos nos mirarán y dirán: «y vivieron felices y comieron perdices»."
 ca_caudillo.4.t:0 "Continuismo"
 ca_caudillo.4.d:0 "Según la Constitución [ROOT.GetCountry.GetAdjective], el mandato de [SCOPE.sCharacter('ruler_scope').GetFullName] ha terminado y hay que nombrar un nuevo [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle]. Claro que la Constitución siempre puede enmendarse, o quizá el cargo deba ir a [SCOPE.sCharacter('ruler_scope').GetHerHis] protegido, [SCOPE.sCharacter('president_successor_scope').GetFullName]."
 ca_caudillo.4.f:0 "«Su mandato ha terminado. Las leyes de [ROOT.GetCountry.GetNameNoFormatting]...»\n\n«¡Yo soy la ley en [ROOT.GetCountry.GetNameNoFormatting]!»"
 ca_caudillo.4.a:0 "Prorrogar el mandato del [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle]."
 ca_caudillo.5.t:0 "El hacedor de reyes"
 ca_caudillo.5.desc:0 "Como líder de [SCOPE.gsInterestGroup('army_scope').GetName], [SCOPE.sCharacter('army_leader').GetFullName] debe decidir si los militares respaldarán a [SCOPE.sParty('liberal_party').GetName] o a [SCOPE.sParty('conservative_party').GetName]."

