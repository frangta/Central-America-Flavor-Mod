l_spanish:
 # CAFM - F15 - Cadenas de los estados (E1-E4)
 ca_nicaragua_events.3.t:0 "León contra Granada"
 ca_nicaragua_events.3.d:0 "La vieja rivalidad entre la León liberal y la Granada conservadora ha vuelto a encenderse. Ambas ciudades arman sus milicias y cada una acusa a la otra de conspirar para apoderarse del Estado."
 ca_nicaragua_events.3.f:0 "«Dos ciudades, dos banderas, un solo Estado.»"
 ca_nicaragua_events.3.a:0 "Apoyar a Granada."
 ca_nicaragua_events.3.b:0 "Apoyar a León."
 ca_nicaragua_events.3.c:0 "Mediar entre las ciudades."
 ca_honduras_events.41.t:0 "[SCOPE.sCharacter('hon_rebel').GetFullName] se alza"
 ca_honduras_events.41.d:0 "[SCOPE.sCharacter('hon_rebel').GetFullName] ha reunido a los descontentos en asambleas por todo el país y ha tomado las armas contra el gobierno. Los caudillos que han gobernado Honduras durante una década están divididos y los vecinos ofrecen mediar."
 ca_honduras_events.41.f:0 "«Asambleas por la mañana, fusiles por la noche.»"
 ca_honduras_events.41.a:0 "Llamar a los mediadores."
 ca_honduras_events.41.b:0 "Aplastar el levantamiento."
 ca_honduras_events.42.t:0 "El Pacto de Pespire"
 ca_honduras_events.42.d:0 "Con la mediación de [SCOPE.sCountry('hon_mediator').GetName], el gobierno y los rebeldes han firmado un pacto. [SCOPE.sCharacter('hon_exile').GetFullName] saldrá del país, y con él se va el poder de los viejos caudillos. Por primera vez en años, Honduras será gobernada por civiles."
 ca_honduras_events.42.f:0 "«La espada se va al exilio; la ley se queda.»"
 ca_honduras_events.42.a:0 "Firmar el pacto."
 ca_el_salvador_events.11.t:0 "El desafío de [SCOPE.sCharacter('els_strongman').GetFullName]"
 ca_el_salvador_events.11.d:0 "[SCOPE.sCharacter('els_strongman').GetFullName] manda el ejército de El Salvador y ya no oculta sus ambiciones. Quiere el poder absoluto en casa y la dirección de los Estados centroamericanos, por la fuerza si es necesario."
 ca_el_salvador_events.11.f:0 "«El Salvador dirigirá, o no lo hará nadie.»"
 ca_el_salvador_events.11.a:0 "El general asume el poder absoluto."
 ca_el_salvador_events.11.b:0 "¡La resistencia civil se alza contra el caudillo!"
 ca_el_salvador_events.11.c:0 "Someterse a la Dieta de la Confederación."
 ca_guatemala_events.5.t:0 "La caída de Gálvez"
 ca_guatemala_events.5.d:0 "El gobierno de Mariano Gálvez se derrumba. El cólera, los Códigos de Livingston y los nuevos impuestos han puesto al campo en su contra, los rebeldes de la Montaña están a las puertas de la capital y hasta sus propios liberales le piden que renuncie."
 ca_guatemala_events.5.f:0 "«Al reformador lo deshacen sus reformas.»"
 ca_guatemala_events.5.a:0 "Gálvez renuncia."
 ca_guatemala_events.5.b:0 "Gálvez se aferra al poder."
 ca_guatemala_events.5.c:0 "La Montaña toma la capital."
 nic_legado_zepeda:0 "El legado de Zepeda"
 nic_legado_zepeda_desc:0 "Las reformas de José Zepeda le han sobrevivido."
 hon_ciudad_agraviada:0 "La ciudad agraviada"
 hon_ciudad_agraviada_desc:0 "La ciudad que perdió la capital rumia sus agravios."
 hon_mandato_vencido_mod:0 "El mandato vencido"
 hon_mandato_vencido_mod_desc:0 "El gobierno gobierna con el mandato ya vencido."
 hon_gobierno_civil:0 "Gobierno civil"
 hon_gobierno_civil_desc:0 "Tras el Pacto de Pespire, Honduras está gobernada por civiles."
 ca_cos_castro_depuesto_mod:0 "El presidente depuesto"
 ca_cos_castro_depuesto_mod_desc:0 "El derrocamiento del presidente ha sacudido las instituciones."
 ca_cos_renuncia_rechazada_mod:0 "Una renuncia rechazada"
 ca_cos_renuncia_rechazada_mod_desc:0 "La Asamblea se negó a aceptar la renuncia del jefe de Estado."
 ca_cos_republica_unitaria_mod:0 "La República unitaria"
 ca_cos_republica_unitaria_mod_desc:0 "Costa Rica vuelve a ser una, bajo un solo gobierno."
 ca_cos_ciudades_agraviadas:0 "Las ciudades humilladas"
 ca_cos_ciudades_agraviadas_desc:0 "Cartago, Heredia y Alajuela resienten la pérdida de su soberanía."
