l_spanish:
 # CAFM - Nicaragua fase 2, Honduras fase 2 y la Mosquitia (10 nov 2026)
 ca_nicaragua_events.26.t:0 "La asamblea de Chinandega"
 ca_nicaragua_events.26.d:0 "La asamblea constituyente ha abierto sesiones en Chinandega, bajo el jefe de Estado José Núñez. Chinandega no es León ni Granada, que es la única razón por la que las dos ciudades aceptaron mandar diputados."
 ca_nicaragua_events.26.f:0 "«Un pueblo neutral, escogido porque ninguno de los dos bandos puede ganar una discusión en él.»"
 ca_nicaragua_events.26.a:0 "Que se reúna en Chinandega"
 ca_nicaragua_events.26.b:0 "Trasladarla a León"
 ca_nicaragua_events.27.t:0 "Libre, soberano e independiente"
 ca_nicaragua_events.27.d:0 "El treinta de abril la asamblea declara a Nicaragua libre e independiente de todo otro poder, y rompe el pacto federal con Centro América. Honduras ya se había ido. El Salvador todavía sostiene solo la bandera."
 ca_nicaragua_events.27.f:0 "«No nos salimos de un país. Nos salimos de una deuda y de un pleito.»"
 ca_nicaragua_events.27.a:0 "Romper el pacto federal"
 ca_nicaragua_events.27.b:0 "Seguir en la Federación"
 ca_nicaragua_events.28.t:0 "La Constitución del Estado"
 ca_nicaragua_events.28.d:0 "La asamblea tiene un texto: dos cámaras, un Director Supremo con periodo de dos años y la religión católica como religión del Estado. Dos años es poco para construir algo y bastante para que todos lo intenten."
 ca_nicaragua_events.28.f:0 "«Una constitución escrita por hombres que esperan estar fuera del cargo antes de que importe.»"
 ca_nicaragua_events.28.a:0 "Jurar la Constitución"
 ca_nicaragua_events.28.b:0 "Dejarla en borrador"
 ca_nicaragua_events.29.t:0 "El tratado con Honduras"
 ca_nicaragua_events.29.d:0 "El dieciocho de enero Nicaragua y Honduras firman un tratado de auxilio mutuo y entran en guerra contra El Salvador. Nuestra columna marcha bajo Bernardo Méndez. Morazán espera del otro lado."
 ca_nicaragua_events.29.f:0 "«Dos estados que acaban de salirse de la Unión, en guerra contra el estado que se quedó en ella.»"
 ca_nicaragua_events.29.a:0 "Marchar con Honduras"
 ca_nicaragua_events.29.b:0 "No mandar un hombre"
 ca_nicaragua_events.30.t:0 "Fonseca recibe el mando"
 ca_nicaragua_events.30.d:0 "Méndez volvió desacreditado de la guerra, y sus rivales de León le han entregado el mando general del ejército a Casto Fonseca. No es político y no finge serlo."
 ca_nicaragua_events.30.f:0 "«Los hombres que le dieron el ejército creen que serán ellos los que lo tengan.»"
 ca_nicaragua_events.30.a:0 "Darle el mando general"
 ca_nicaragua_events.30.b:0 "Buscar otro comandante"
 ca_nicaragua_events.31.t:0 "El Gran Mariscal"
 ca_nicaragua_events.31.d:0 "Ahora se hace llamar Gran Mariscal. Las levas son duras y las cobran los soldados, la prensa se ha callado y las escuelas de León han cerrado porque los maestros eran los que escribían en la prensa."
 ca_nicaragua_events.31.f:0 "«No hay gobierno. Hay un hombre con un grado que se dio él mismo.»"
 ca_nicaragua_events.31.a:0 "Dejarlo hacer"
 ca_nicaragua_events.31.b:0 "Oponerse al mariscal"
 ca_nicaragua_events.41.t:0 "Una bandera en la boca del río"
 ca_nicaragua_events.41.d:0 "El doce de agosto el superintendente de Honduras Británica y el rey misquito desembarcaron en San Juan del Norte y declararon que el pueblo y toda la Costa Atlántica pertenecen al reino. Nuestra aduana de allí ya no cobra nada."
 ca_nicaragua_events.41.f:0 "«Un rey que no hemos visto nunca es dueño de la única puerta que tenemos al Atlántico.»"
 ca_nicaragua_events.41.a:0 "Protestar en Londres"
 ca_nicaragua_events.41.b:0 "Guarnecer la boca del río"
 ca_nicaragua_events.41.c:0 "No tenemos barcos"
 ca_nicaragua_events.32.t:0 "Choluteca"
 ca_nicaragua_events.32.d:0 "El veintinueve de agosto el ejército del mariscal entró en Honduras y fue derrotado en Choluteca. Fue a la guerra para volverse indispensable y volvió habiendo demostrado lo contrario."
 ca_nicaragua_events.32.f:0 "«Se ha gastado la última plata del Estado demostrando que no puede ganar una batalla.»"
 ca_nicaragua_events.32.a:0 "La derrota del mariscal"
 ca_nicaragua_events.33.t:0 "Malespín frente a León"
 ca_nicaragua_events.33.d:0 "Las fuerzas hondureñas y salvadoreñas de Francisco Malespín han cruzado la frontera y se han plantado frente a León. El director Pérez está fuera; Emiliano Madriz tiene el cargo y el sitio."
 ca_nicaragua_events.33.f:0 "«Nuestro pleito con Granada ha metido en él a dos ejércitos extranjeros.»"
 ca_nicaragua_events.33.a:0 "Resistir el sitio"
 ca_nicaragua_events.33.b:0 "Que Granada negocie"
 ca_nicaragua_events.34.t:0 "Montenegro y el mariscal"
 ca_nicaragua_events.34.d:0 "El ocho de diciembre José del Montenegro, enviado por Granada, acuerda con Malespín formar un gobierno encabezado por Silvestre Selva. Granada ha negociado la rendición de una ciudad que no es Granada."
 ca_nicaragua_events.34.f:0 "«La ciudad que no está sitiada ha decidido lo que va a aceptar la ciudad sitiada.»"
 ca_nicaragua_events.34.a:0 "Aceptar el gobierno nuevo"
 ca_nicaragua_events.34.b:0 "León no reconoce nada"
 ca_nicaragua_events.35.t:0 "Silvestre Selva en Masaya"
 ca_nicaragua_events.35.d:0 "El dieciséis de diciembre toma el cargo en Masaya, que no es ninguna de las dos ciudades y es lo más cerca de neutral que se puede estar mientras hay un sitio a cuarenta leguas."
 ca_nicaragua_events.35.f:0 "«Un gobierno en un tercer pueblo, porque los dos primeros están en guerra.»"
 ca_nicaragua_events.35.a:0 "Silvestre Selva, Director"
 ca_nicaragua_events.36.t:0 "León, el veinticuatro de enero"
 ca_nicaragua_events.36.d:0 "La ciudad cayó tras cincuenta días de sitio. A Fonseca lo tomaron y lo fusilaron; a Madriz lo mataron; las casas fueron saqueadas y quemadas. Cualquier cosa de la que fuera el pleito entre León y Granada, esto es lo que costó."
 ca_nicaragua_events.36.f:0 "«El Gran Mariscal duró exactamente lo que duró el ejército que lo nombró.»"
 ca_nicaragua_events.36.a:0 "La ciudad saqueada"
 ca_nicaragua_events.36.b:0 "Salvar lo que se pueda"
 ca_nicaragua_events.37.t:0 "Sandoval, Director"
 ca_nicaragua_events.37.d:0 "El cuatro de abril toma el cargo José León Sandoval. Es de Granada, se hace cargo de un León quemado, y va a pasarse el periodo renunciando y que no le acepten la renuncia."
 ca_nicaragua_events.37.f:0 "«Un granadino gobernando León un mes después de que Granada ayudara a quemarlo.»"
 ca_nicaragua_events.37.a:0 "José León Sandoval"
 ca_nicaragua_events.38.t:0 "La amnistía"
 ca_nicaragua_events.38.d:0 "Una amnistía general, salvo los oficiales de teniente coronel en adelante que violaron la Constitución. No cancela la responsabilidad de nadie por los gastos de la guerra, que es la parte que la gente va a notar."
 ca_nicaragua_events.38.f:0 "«Perdonados por la rebelión, y con la cuenta todavía por pagar.»"
 ca_nicaragua_events.38.a:0 "Amnistía, salvo los jefes"
 ca_nicaragua_events.38.b:0 "Sin perdón para nadie"
 ca_nicaragua_events.39.t:0 "Chelón Valle"
 ca_nicaragua_events.39.d:0 "José María Valle levantó Chinandega, la perdió, la retomó un mes después y después cruzó a Honduras. Los disturbios llegaron a León y a Managua de paso."
 ca_nicaragua_events.39.f:0 "«Aquí un hombre puede tomar un pueblo dos veces en dos meses. Ese es todo el problema.»"
 ca_nicaragua_events.39.a:0 "Perseguirlo hasta Honduras"
 ca_nicaragua_events.39.b:0 "Dejarlo marchar"
 ca_nicaragua_events.40.t:0 "Managua, ciudad"
 ca_nicaragua_events.40.d:0 "El veinticuatro de julio Managua es elevada a ciudad y el gobierno se traslada allí. Está a medio camino entre León y Granada, no tiene bando propio y por eso es el único lugar que las dos aceptan."
 ca_nicaragua_events.40.f:0 "«La capital de Nicaragua es un acuerdo con vista al lago.»"
 ca_nicaragua_events.40.a:0 "La sede en Managua"
 ca_nicaragua_events.40.b:0 "La capital alterna"
 ca_nicaragua_events.49.t:0 "De dos años en dos años"
 ca_nicaragua_events.49.d:0 "José Guerrero sigue a Sandoval, y Norberto Ramírez seguirá a Guerrero. La Constitución le da al Director Supremo dos años, que alcanzan para aprender el oficio y no para ejercerlo."
 ca_nicaragua_events.49.f:0 "«Cada dos años elegimos a un hombre para que herede el mismo ejército sin pagar.»"
 ca_nicaragua_events.49.a:0 "Que gobierne quien pueda"
 ca_nicaragua_events.49.b:0 "Un Director por cuatro años"
 ca_nicaragua_events.42.t:0 "San Juan del Norte tomado"
 ca_nicaragua_events.42.d:0 "El ultimátum del rey misquito venció el primero de enero y dos buques de guerra británicos lo hicieron cumplir. Nuestra guarnición está fuera. El pueblo es ahora del reino, y lo del reino es ahora de Gran Bretaña."
 ca_nicaragua_events.42.f:0 "«Un reino de cuatro mil personas nos ha tomado el puerto, con la marina de otro.»"
 ca_nicaragua_events.42.a:0 "Dos fragatas son dos fragatas"
 ca_nicaragua_events.42.b:0 "Pelear por la boca del río"
 ca_nicaragua_events.43.t:0 "Greytown"
 ca_nicaragua_events.43.d:0 "El siete de marzo firmamos un tratado que cede el pueblo al reino, que lo rebautiza Greytown por el gobernador de Jamaica. Nuestro único puerto atlántico tiene ahora nombre inglés."
 ca_nicaragua_events.43.f:0 "«Ni el nombre nos dejaron.»"
 ca_nicaragua_events.43.a:0 "Firmar"
 ca_nicaragua_events.43.b:0 "No firmamos nada"
 ca_nicaragua_events.44.t:0 "Squier"
 ca_nicaragua_events.44.d:0 "Ephraim George Squier ha llegado como agente estadounidense en Centroamérica, y quiere la ruta del tránsito en manos americanas antes de que los británicos acaben de tomarla. Dos imperios quieren el mismo río, que es la mejor posición en la que hemos estado en años."
 ca_nicaragua_events.44.f:0 "«Cuando dos grandes potencias quieren lo mismo de ti, eres un país por un rato.»"
 ca_nicaragua_events.44.a:0 "Tratar con los americanos"
 ca_nicaragua_events.44.b:0 "Ni con unos ni con otros"
 ca_nicaragua_events.45.t:0 "El contrato"
 ca_nicaragua_events.45.d:0 "El veintiséis de agosto el gobierno firma con Cornelius Vanderbilt: derecho exclusivo para construir una vía de agua en doce años y, mientras tanto, la administración única de la ruta terrestre por Rivas."
 ca_nicaragua_events.45.f:0 "«Doce años para abrir un canal, y el camino mientras tanto. El camino es el negocio.»"
 ca_nicaragua_events.45.a:0 "Doce años para abrir el canal"
 ca_nicaragua_events.45.b:0 "El río es del Estado"
 ca_nicaragua_events.46.t:0 "El camino a California"
 ca_nicaragua_events.46.d:0 "Suben el San Juan en vapor, cruzan el lago y hacen las doce leguas de Rivas hasta el Pacífico. Entre Nueva York y San Francisco no hay camino más rápido, y todo él pasa por nuestro suelo."
 ca_nicaragua_events.46.f:0 "«Media fiebre del oro cruza Rivas a pie. Deberíamos estarles cobrando.»"
 ca_nicaragua_events.46.a:0 "Cobrar por cada pasajero"
 ca_nicaragua_events.46.b:0 "Que pasen y no molesten"
 ca_nicaragua_events.47.t:0 "Clayton y Bulwer"
 ca_nicaragua_events.47.d:0 "El diecinueve de abril Washington y Londres acuerdan no ocupar, fortificar ni colonizar Nicaragua, Costa Rica ni la Costa de Mosquitos. Ninguno de los dos nos preguntó, y cada uno lee el texto a su manera."
 ca_nicaragua_events.47.f:0 "«Dos potencias han firmado un tratado sobre nuestro territorio, en una ciudad que ninguno de nosotros ha visto.»"
 ca_nicaragua_events.47.a:0 "Que se neutralicen entre ellos"
 ca_nicaragua_events.48.t:0 "El Prometheus"
 ca_nicaragua_events.48.d:0 "El veintiuno de noviembre un buque de guerra británico disparó sobre el vapor estadounidense Prometheus en Greytown por derechos de puerto impagos. El puerto es nuestro en ningún mapa que nadie respete, y ahora hay dos marinas disparando en él."
 ca_nicaragua_events.48.f:0 "«Se están peleando por los derechos de un puerto que los dos nos quitaron.»"
 ca_nicaragua_events.48.a:0 "Protestar y cobrar igual"
 ca_nicaragua_events.48.b:0 "Dejar que se arreglen"
 ca_nicaragua_events.50.t:0 "Dos ganadores"
 ca_nicaragua_events.50.d:0 "León ha contado los votos y Granada también, y las dos cuentas no coinciden en quién es el Director Supremo. Los dos han jurado el cargo. Los dos tienen escolta."
 ca_nicaragua_events.50.f:0 "«La elección funcionó perfectamente. Produjo exactamente un Director por ciudad.»"
 ca_nicaragua_events.50.a:0 "Reconocer al de León"
 ca_nicaragua_events.50.b:0 "Reconocer al de Granada"
 ca_nicaragua_events.50.c:0 "Anular la elección"
 ca_nicaragua_events.51.t:0 "Una sede que no es de nadie"
 ca_nicaragua_events.51.d:0 "Cada ciudad tiene ya su gobierno, su tesoro y su idea de dónde está la capital. Hay una sola salida que haya funcionado alguna vez, y es un pueblo en el lago que no es de ninguna de las dos."
 ca_nicaragua_events.51.f:0 "«Nadie va a ceder la capital. Los dos se la van a dar a un tercer pueblo.»"
 ca_nicaragua_events.51.a:0 "Sede neutral en Managua"
 ca_nicaragua_events.51.b:0 "Que cada ciudad tenga su gobierno"
 ca_nicaragua_events.52.t:0 "Legitimistas y Democráticos"
 ca_nicaragua_events.52.d:0 "El pleito ya tiene nombres: Legitimistas en Granada, Democráticos en León, y ejércitos detrás de los dos. Esto no lo va a arreglar una elección, y todos los que están dentro lo saben."
 ca_nicaragua_events.52.f:0 "«Veinte años de esto, y al final alguien va a invitar a un extranjero a que ayude.»"
 ca_nicaragua_events.52.a:0 "La guerra de los bandos"
 ca_nicaragua_events.52.b:0 "Un congreso de paz"
