l_spanish:
 # CAFM — Nicaragua, Fase 1: El polvorín de Zepeda (1836–1837)
 # ca_nicaragua_events.2.* ya existe en ca_events_flavor_1_l_english.yml y se reutiliza.

 ca_Mendez:0 "Méndez"

 ca_nicaragua_events.1.c:0 "Jugar con Nicaragua."

 ca_nicaragua_events.6.t:0 "La audacia de José Zepeda"
 ca_nicaragua_events.6.d:0 "El jefe de Estado José Zepeda no gobernará un Estado de caudillos y ejércitos privados. Desde León presenta un programa que ningún gobierno nicaragüense se había atrevido a proponer: juicio por jurados, un Tribunal de Cuentas para fiscalizar el tesoro, la reapertura de las universidades de León y Granada, la prohibición de portar armas de fuego y la obligación de que los curas completen estudios universitarios antes de ordenarse. Los liberales de León lo aplauden. En Granada, las viejas familias leen los decretos como un ataque a todo lo que les dejó la colonia."
 ca_nicaragua_events.6.f:0 "Un Estado de leyes o un Estado de cuarteles."
 ca_nicaragua_events.6.a:0 "La modernidad no espera."
 ca_nicaragua_events.6.b:0 "Suavizar las reformas y hacer las paces con Granada."

 ca_nicaragua_events.7.t:0 "El Código Penal y el jurado"
 ca_nicaragua_events.7.d:0 "Los juristas de Zepeda han terminado un nuevo Código Penal que reemplaza la maraña de ordenanzas coloniales, junto con normas de procedimiento penal y juicio por jurados. Los oficiales que solo respondían ante sus propios jefes responderían ahora ante jueces civiles. El proyecto espera la firma del jefe de Estado."
 ca_nicaragua_events.7.f:0 "La ley llega a los cuarteles."
 ca_nicaragua_events.7.a:0 "Firmar el código."
 ca_nicaragua_events.7.b:0 "Archivarlo para tiempos más tranquilos."

 ca_nicaragua_events.9.t:0 "El Telégrafo Nicaragüense"
 ca_nicaragua_events.9.d:0 "El gobierno ha fundado un periódico oficial, El Telégrafo Nicaragüense, y los impresores de León quieren más: prensa libre, panfletos y hojas sueltas sin censura previa. Cada decreto ministerial se leerá, se alabará y se ridiculizará tanto en los cafés de León como en los salones de Granada."
 ca_nicaragua_events.9.f:0 "La tinta viaja más rápido que las tropas."
 ca_nicaragua_events.9.a:0 "Que las imprentas funcionen libremente."
 ca_nicaragua_events.9.b:0 "Basta con el periódico oficial."

 ca_nicaragua_events.10.t:0 "Descontento en Granada"
 ca_nicaragua_events.10.d:0 "Cartas interceptadas en el camino de Granada hablan de oficiales que se reúnen de noche, de comerciantes que se niegan a pagar las nuevas contribuciones y de un brindis «por el día en que León tenga otro amo». Nada de eso es todavía un delito, pero los informantes del gobierno están preocupados."
 ca_nicaragua_events.10.f:0 "Granada nunca olvida."
 ca_nicaragua_events.10.a:0 "Arrestar a los sospechosos."
 ca_nicaragua_events.10.b:0 "Comprar su lealtad."
 ca_nicaragua_events.10.c:0 "Que Dios nos proteja."

 ca_nicaragua_events.11.t:0 "La purga de los cuarteles"
 ca_nicaragua_events.11.d:0 "Armar la expedición de Quijano contra Guanacaste le ha costado al ejército hombres, dinero y orgullo, y los oficiales que la abastecieron culpan ahora al gobierno que la dejó marchar. Zepeda está convencido de que los oficiales conservadores de la guarnición de León conspiran contra él y propone destituirlos a todos de una vez."
 ca_nicaragua_events.11.f:0 "Una guarnición humillada busca a quién culpar."
 ca_nicaragua_events.11.a:0 "Purgar a los oficiales conservadores."
 ca_nicaragua_events.11.b:0 "Retroceder. Ahora no."

 ca_nicaragua_events.12.t:0 "Rumores en las sombras"
 ca_nicaragua_events.12.d:0 "Los nombres se repiten en cada informe: el coronel Bernardo Méndez, «el Pavo», y el médico Casto Fonseca. A ambos se los ve demasiado a menudo en el cuartel de León. Un preso de la cárcel de la ciudad presume de que pronto estará libre. Los amigos del jefe de Estado le ruegan que actúe antes de que sea tarde."
 ca_nicaragua_events.12.f:0 "Todos lo saben. Nadie puede probarlo."
 ca_nicaragua_events.12.a:0 "Arrestos masivos, esta noche."
 ca_nicaragua_events.12.b:0 "Pagar a la guarnición lo que pida."
 ca_nicaragua_events.12.c:0 "Que Dios nos proteja."

 ca_nicaragua_events.13.t:0 "La noche del cuartel"
 ca_nicaragua_events.13.d_triunfa:0 "La noche del 25 de enero, el coronel Bernardo Méndez y Casto Fonseca toman el cuartel de León. Liberan al preso Braulio Mendiola y lo envían con hombres armados a arrestar al jefe de Estado. José Zepeda y el coronel Román Valladares son sacados de sus casas y asesinados. Al amanecer no hay gobierno en León, solo el cuartel."
 ca_nicaragua_events.13.d_fracasa:0 "La noche del 25 de enero, el coronel Bernardo Méndez y Casto Fonseca toman el cuartel de León y liberan al preso Braulio Mendiola para que arreste al jefe de Estado. Pero la guardia de Zepeda resiste en la puerta. Herido, el jefe de Estado sobrevive; Mendiola cae en la calle y al alba los conjurados huyen de la ciudad. León despierta con su gobierno vivo."
 ca_nicaragua_events.13.f:0 "25 de enero de 1837."
 ca_nicaragua_events.13.a:0 "¡A las armas!"
 nic_golpe_triunfa_tt:0 "#N José Zepeda es asesinado.#! Los cuarteles toman el poder y la conspiración triunfa."
 nic_golpe_fracasa_tt:0 "#P José Zepeda sobrevive.#! Los terratenientes caen en desgracia y Nicaragua gana un periodo de paz institucional."

 ca_nicaragua_events.14.t:0 "El vacío de poder"
 ca_nicaragua_events.14.d:0 "José Núñez asume el cargo de jefe de Estado para completar el mandato de Zepeda. No castiga a los oficiales sublevados. Al contrario, el 26 de enero nombra a Bernardo Méndez comandante general de armas. El jurado, los códigos y la prensa libre quedan en el papel; en la práctica Nicaragua se gobierna desde los cuarteles, y con Zepeda muere la última voz fuerte de la Unión en León."
 ca_nicaragua_events.14.f:0 "La espada gobierna; la pluma firma."
 ca_nicaragua_events.14.a:0 "Núñez asume el cargo."

 nic_conspiracy_up_15_tt:0 "La #N Conspiración de los Cuarteles#! crece #N 15#!."
 nic_conspiracy_down_20_tt:0 "La #P Conspiración de los Cuarteles#! baja #P 20#!."
 nic_conspiracy_to_100_tt:0 "La #N Conspiración de los Cuarteles#! llega a #N 100#!: estalla el golpe."

 je_ca_nic_conspiracy:0 "La Conspiración de los Cuarteles"
 je_ca_nic_conspiracy_reason:0 "Las reformas de Zepeda le han ganado enemigos en Granada y en la guarnición de León. Si la conspiración llega a #N 100#!, los cuarteles se alzarán. Las reformas, las aventuras fallidas y los oficiales descontentos la alimentan; los arrestos y el dinero pueden ganar tiempo."
 je_ca_nic_conspiracy_status_baja:0 "Murmullos en la guarnición. Por ahora, la autoridad del jefe de Estado se sostiene."
 je_ca_nic_conspiracy_status_alta:0 "Los oficiales se reúnen de noche. Los comerciantes de Granada se niegan a pagar."
 je_ca_nic_conspiracy_status_critica:0 "Méndez y Fonseca están listos. El golpe es cuestión de semanas."

 nic_gobierno_desde_leon:0 "Gobernar desde León"
 nic_gobierno_desde_leon_desc:0 "Zepeda gobierna desde León y mantiene a raya a los caudillos."
 nic_tutela_federal:0 "Tutela federal"
 nic_tutela_federal_desc:0 "Nicaragua ha pedido a la Federación que restablezca el orden dentro de sus fronteras."
 nic_agitacion_aristocratica:0 "Agitación aristocrática"
 nic_agitacion_aristocratica_desc:0 "Las viejas familias de Granada se niegan a pagar y conspiran contra León."
 nic_reformas_zepeda:0 "Las reformas de Zepeda"
 nic_reformas_zepeda_desc:0 "Juicios por jurado, un Tribunal de Cuentas y universidades reabiertas."
 nic_pacto_granadino:0 "El pacto granadino"
 nic_pacto_granadino_desc:0 "Las reformas se han diluido para mantener tranquila a Granada."
 nic_codigo_penal:0 "El Código Penal"
 nic_codigo_penal_desc:0 "Un código penal moderno y el juicio por jurados reemplazan las ordenanzas coloniales."
 nic_codigo_engavetado:0 "Código engavetado"
 nic_codigo_engavetado_desc:0 "El nuevo código penal junta polvo en un cajón del ministerio."
 nic_telegrafo_libre:0 "Una prensa libre"
 nic_telegrafo_libre_desc:0 "El Telégrafo Nicaragüense y los impresores de León publican sin censura previa."
 nic_censura_parcial:0 "Censura parcial"
 nic_censura_parcial_desc:0 "Solo el periódico oficial imprime sin la aprobación de un censor."
 nic_arrestos_preventivos:0 "Arrestos preventivos"
 nic_arrestos_preventivos_desc:0 "Los sospechosos de conspirar llenan las cárceles de León."
 nic_arrestos_masivos:0 "Arrestos masivos"
 nic_arrestos_masivos_desc:0 "Redadas nocturnas contra oficiales y notables granadinos."
 nic_purga_cuartel:0 "Guarnición purgada"
 nic_purga_cuartel_desc:0 "Los oficiales conservadores han sido destituidos en masa."
 nic_purga_retroceso:0 "Un jefe de Estado débil"
 nic_purga_retroceso_desc:0 "Zepeda retrocedió ante sus propios oficiales."
 nic_heroe_nacional:0 "Héroe nacional"
 nic_heroe_nacional_desc:0 "Sobrevivió a la Noche del Cuartel del 25 de enero de 1837."
 nic_paz_institucional:0 "Paz institucional"
 nic_paz_institucional_desc:0 "El golpe fallido ha unido a Nicaragua en torno a su gobierno civil."
 nic_terratenientes_en_desgracia:0 "Terratenientes en desgracia"
 nic_terratenientes_en_desgracia_desc:0 "Su papel en el golpe fallido ha desacreditado a la élite granadina."
 nic_cuartel_al_poder:0 "El cuartel en el poder"
 nic_cuartel_al_poder_desc:0 "Méndez y Fonseca gobiernan Nicaragua desde el cuartel de León."
