l_spanish:
 CA_EW119_BOX_TITLE:0 "El estado de la Unión, 1836"
 CA_EW119_BAR:0 "Apoyo a la Federación: #bold [GetPlayer.MakeScope.ScriptValue('ca_ew119_bar_value')|0]#! / 200"
 CA_EW119_BAR_TT:0 "El #bold apoyo a la Federación#! es la barra del diario #bold La Federación se desmorona#!.\n\nEmpieza en 75. Sube cuando los Estados obedecen y el gobierno federal funciona, y baja con la secesión, la guerra civil y las promesas rotas. En 0 la Federación se disuelve."
 CA_EW119_LOYALTY:0 "Lealtad de los Estados:"
 CA_EW119_LOYALTY_TT:0 "Cada punto es un Estado de la Federación:\n#bold Verde#!: leal\n#bold Amarillo#!: vacilante\n#bold Naranja#!: rebelde\n#bold Gris#!: separado\n\nEl mapa de arriba usa los mismos colores."
 CA_EW119_GUA:0 "GUA"
 CA_EW119_ELS:0 "ELS"
 CA_EW119_HON:0 "HON"
 CA_EW119_NIC:0 "NIC"
 CA_EW119_COS:0 "COS"
 CA_EW119_DEBT:0 "Deuda inglesa: tramo #bold [GetPlayer.MakeScope.ScriptValue('ca_ew119_debt_tier')|0]#! de 4"
 CA_EW119_DEBT_TT:0 "El préstamo de 1825 de la casa Barclay, Herring, Richardson & Co. El tramo 4 es el más pesado. Pagar o renegociar baja el tramo; el impago enfada a Gran Bretaña."
 CA_EW119_PARALYSIS_ON:0 "Parálisis federal: #bold activa#! (no se pueden cambiar leyes)"
 CA_EW119_PARALYSIS_OFF:0 "Parálisis federal: no"
 CA_EW119_PARALYSIS_TT:0 "El Congreso federal está bloqueado. Mientras dure, no se puede empezar ni cancelar ninguna ley y el gobierno central pierde autoridad. Termina sola a los cinco años."
 CA_EW119_ARMY_ON:0 "Ejército federal: #bold en desorden#!"
 CA_EW119_ARMY_OFF:0 "Ejército federal: en orden"
 CA_EW119_ARMY_TT:0 "Tras años de guerra civil, el ejército federal está sin paga y dividido. Mientras dure, los generales mandan menos tropas y las unidades pelean peor."
 CA_EW119_CHOOSE:0 "Elige el camino de la Federación"
 CA_EW119_DIFFICULTY:0 "Dificultad:"
 CA_EW119_DIFF_VARIES:0 "#bold variable#!"
 CA_EW119_FED_TITLE:0 "Federalistas"
 CA_EW119_FED_DESC:0 "#bold Objetivo:#! mantener viva la Federación hasta 1845.\n- Gasta #bold Cohesión federal#! en acciones federales\n- El Congreso propone reformas\n- Recupera los Estados con campañas y negociación"
 CA_EW119_FED_TT:0 "#bold El camino histórico.#! Morazán y los liberales defienden la Constitución de 1824 y los derechos de los Estados."
 CA_EW119_CEN_TITLE:0 "Centralistas"
 CA_EW119_CEN_DESC:0 "#bold Objetivo:#! mantener la Unión por la fuerza.\n- Sin cohesión: intendentes y estados de sitio\n- Compra o aplasta a los caudillos\n- Cada orden arriesga una rebelión"
 CA_EW119_CEN_TT:0 "#bold Solo para el jugador.#! La capital federal gobierna el istmo con el ejército. El ejército lo aprueba; los terratenientes no."
 CA_EW119_STA_TITLE:0 "Un solo Estado"
 CA_EW119_STA_DESC:0 "#bold Objetivo:#! salir de la Federación y dirigir un Estado.\n- Sus propios diarios y elecciones\n- Su propio camino a la soberanía\n- Eliges el Estado en la ventana siguiente"
 CA_EW119_STA_TT:0 "#bold Solo para el jugador.#! Abre el selector de Estados. Desde ahí puedes volver a esta ventana."
 CA_EW119_GUIDE:0 "¿Cómo se juega?"
 CA_EW119_GUIDE_TT:0 "Abre la guía corta de la Federación: lealtad, barra, cohesión, caminos, frentes y deuda."
 CA_EW119_HISTORICAL_HINT:0 "El camino federalista es el histórico."
