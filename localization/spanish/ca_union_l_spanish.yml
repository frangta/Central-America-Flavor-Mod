 CA_UNITY_FAILED_CAMPAIGN:0 "La fallida campaña de unión"
 CA_CONGRESS_UNITY:0 "Unidad centroamericana"
 CA_CONGRESS_AT_WAR:0 "En guerra con un Estado centroamericano"
 CA_CONGRESS_CLOSED_REPUBLIC:0 "Costa Rica se ha cerrado al exterior"
 CA_CONGRESS_NIC_UNIONISM_DEAD:0 "Nicaragua ha renunciado a la Unión"
 CA_INVITE_FRIENDLY:0 "Relaciones amistosas"
 CA_INVITE_LIBERALS:0 "Liberales en el gobierno"
 CA_INVITE_LANDOWNERS:0 "Terratenientes poderosos"
 CA_INVITE_CLOSED_REPUBLIC:0 "Una república cerrada"
 je_ca_confederation:0 "La Confederación Centroamericana"
 je_ca_confederation_reason:0 "El Pacto de Chinandega ha creado una Confederación de Estados soberanos. La preside un delegado supremo y una Dieta representa a los socios, pero cada Estado conserva su propio ejército, su propio tesoro y sus propias rencillas. La Confederación solo sobrevivirá si sus socios aprenden a actuar juntos."
 je_ca_conf_status_strong:0 "Los socios actúan juntos y la Dieta es respetada."
 je_ca_conf_status_weak:0 "La Confederación se desmorona: los socios ignoran a la Dieta."
 je_ca_conf_status_normal:0 "La Confederación sobrevive, pero cada socio mira por sí mismo."
 je_ca_conf_complete_tt:0 "La cohesión confederal llega a 100"
 je_ca_conf_partners_tt:0 "Al menos 3 socios confederados"
 je_ca_conf_fail_tt:0 "La cohesión confederal cae a 0"
 je_ca_conf_few_partners_tt:0 "Menos de 2 socios confederados"
 je_ca_conf_timeout_tt:0 "Llega el año 1850"
 je_ca_patria_grande:0 "La Patria Grande"
 je_ca_patria_grande_reason:0 "Centroamérica fue una sola nación, y muchos todavía sueñan con verla unida otra vez. Congresos, tratados y, cuando todo lo demás falle, ejércitos podrán algún día restaurar la Patria Grande."
 je_ca_patria_grande_status_close:0 "El sueño de la Unión nunca ha estado tan cerca."
 je_ca_patria_grande_status_far:0 "La Unión sigue siendo un sueño lejano."
 je_ca_patria_grande_unity_tt:0 "La unidad centroamericana llega a 100"
 je_ca_patria_grande_states_tt:0 "Al menos 4 de los 5 Estados de 1823 bajo nuestro gobierno o como socios confederados"
 ca_button_conf_diet:0 "Convocar la Dieta"
 ca_button_conf_diet_desc:0 "La Dieta de la Confederación se reúne para resolver los asuntos comunes de los socios.\n\nCohesión confederal #G +10#!; relaciones con los socios #G +10#!."
 ca_button_conf_defense:0 "Defensa común"
 ca_button_conf_defense_desc:0 "Los socios prometen defenderse mutuamente de cualquier agresión.\n\nUn pacto defensivo con cada socio; cohesión confederal #G +10#!."
 ca_button_conf_customs:0 "Aduana y moneda comunes"
 ca_button_conf_customs_desc:0 "Un solo arancel aduanero y una moneda común para toda la Confederación.\n\nCohesión confederal #G +15#! y #G +1#! por mes."
 ca_button_conf_cohesion_40_tt:0 "La cohesión confederal es de al menos 40"
 ca_button_conf_invite:0 "Invitar a un Estado a la Confederación"
 ca_button_conf_invite_desc:0 "Invitamos a los Estados independientes de Centroamérica a unirse a la Confederación. Cada uno decide por sí mismo; los que se nieguen no volverán a escuchar en cinco años."
 ca_button_conf_invite_target_tt:0 "Hay un Estado centroamericano independiente al que se puede invitar"
 ca_button_unionist_congress:0 "Convocar un Congreso Unionista"
 ca_button_unionist_congress_desc:0 "Delegados de los Estados centroamericanos se reúnen para discutir la restauración de la Unión. Si el congreso tiene éxito, los Estados más amistosos podrán unirse a nosotros como socios confederados."
 ca_button_unionist_congress_tt:0 "La probabilidad de éxito depende de la unidad centroamericana y de las guerras entre los Estados."
 ca_conf_consolidated_mod:0 "Confederación consolidada"
 ca_conf_consolidated_mod_desc:0 "La Confederación ha demostrado que los Estados pueden actuar juntos."
 ca_conf_broken_mod:0 "Confederación rota"
 ca_conf_broken_mod_desc:0 "La Confederación se ha roto."
 ca_conf_customs_union_mod:0 "Aduana confederal"
 ca_conf_customs_union_mod_desc:0 "Un arancel aduanero y una moneda comunes para toda la Confederación."
 ca_conf_strong_delegate:0 "Un delegado supremo fuerte"
 ca_conf_strong_delegate_desc:0 "El delegado supremo habla con la autoridad del jefe de la Confederación."
 ca_national_war_mod:0 "La Guerra Nacional"
 ca_national_war_mod_desc:0 "Los ejércitos centroamericanos han combatido juntos contra los filibusteros."
 ca_patria_mayor_mod:0 "La República Mayor"
 ca_patria_mayor_mod_desc:0 "Una República Mayor de Centroamérica representa a sus miembros en el exterior."
 ca_patria_grande_reborn_mod:0 "La Patria Grande renace"
 ca_patria_grande_reborn_mod_desc:0 "Centroamérica vuelve a ser una sola nación."
 ca_central_america.158.t:0 "El delegado supremo"
 ca_central_america.158.d:0 "Cada año la Dieta debe elegir al delegado supremo que representa a la Confederación. El Estado cabeza quiere a uno de los suyos; los socios quieren a un hombre de su confianza."
 ca_central_america.158.f:0 "«El delegado es supremo solo de nombre.»"
 ca_central_america.158.a:0 "Un delegado de uno de los socios."
 ca_central_america.158.b:0 "Un delegado del Estado cabeza."
 ca_central_america.158.c:0 "Dejar el cargo vacante este año."
 ca_central_america.159.t:0 "Guatemala y Costa Rica responden"
 ca_central_america.159.d:0 "La Confederación ha invitado a los Estados que no firmaron el Pacto de Chinandega. Sus respuestas han llegado."
 ca_central_america.159.f:0 "«Cada Estado es celoso de su soberanía.»"
 ca_central_america.159.a:0 "Respetar su decisión."
 ca_central_america.159.b:0 "Dar la bienvenida a los nuevos socios."
 ca_central_america.160.t:0 "El desafío de [SCOPE.sCharacter('ca_conf_caudillo').GetFullName]"
 ca_central_america.160.d:0 "[SCOPE.sCharacter('ca_conf_caudillo').GetFullName], hombre fuerte de [SCOPE.sCountry('ca_conf_rebel').GetName], ya no obedece a la Dieta. Quiere encabezar él mismo la Confederación, con su ejército detrás."
 ca_central_america.160.f:0 "«La Dieta tiene leyes; él tiene bayonetas.»"
 ca_central_america.160.a:0 "Aceptar su liderazgo."
 ca_central_america.160.b:0 "Plantarle cara."
 ca_central_america.160.c:0 "Comprar su lealtad."
 ca_central_america.161.t:0 "El saqueo de León"
 ca_central_america.161.d:0 "Los ejércitos de los socios se han vuelto unos contra otros. Una ciudad centroamericana ha sido saqueada por soldados centroamericanos, y la Confederación que debía mantener la paz entre ellos no ha hecho nada."
 ca_central_america.161.f:0 "«Hermanos matando hermanos, en nombre de la Unión.»"
 ca_central_america.161.a:0 "La Confederación ha muerto."
 ca_central_america.161.b:0 "Reunir a los socios una última vez."
 ca_central_america.162.t:0 "El Congreso Unionista"
 ca_central_america.162.d:0 "Los delegados de los Estados centroamericanos se han reunido para discutir la restauración de la Unión. Tras semanas de discursos y banquetes, el congreso ha llegado a su veredicto."
 ca_central_america.162.f:0 "«Todo congreso termina con un brindis; pocos terminan con una Unión.»"
 ca_central_america.162.a:0 "¡Un paso hacia la Unión!"
 ca_central_america.162.b:0 "Otro congreso, otro fracaso."
 ca_central_america.162.success_tt:0 "El congreso ha tenido éxito: la unidad ha aumentado y los Estados más amistosos pueden haberse unido como socios confederados."
 ca_central_america.162.fail_tt:0 "El congreso ha fracasado: la unidad ha disminuido."
 ca_central_america.163.t:0 "La Guerra Nacional"
 ca_central_america.163.d:0 "Filibusteros extranjeros se han hecho con el poder en uno de los Estados del istmo y amenazan a todos los demás. Por primera vez en años, los ejércitos centroamericanos podrían luchar en el mismo bando."
 ca_central_america.163.f:0 "«Contra el invasor, todos los centroamericanos son hermanos.»"
 ca_central_america.163.a:0 "Enviar nuestro ejército contra los filibusteros."
 ca_central_america.163.b:0 "No es nuestra guerra."
 ca_central_america.164.t:0 "La campaña de la Unión"
 ca_central_america.164.d:0 "[SCOPE.sCharacter('ca_unionist_ruler').GetFullName] ha decidido que las palabras no bastan. Si los Estados no se unen por acuerdo, la Unión se proclamará por decreto y se defenderá con las armas."
 ca_central_america.164.f:0 "«¡La Unión o la muerte!»"
 ca_central_america.164.a:0 "Proclamar la Unión por decreto."
 ca_central_america.164.b:0 "Todavía no: el momento no ha llegado."
 ca_central_america.164.historic_tt:0 "La campaña termina en la batalla de Chalchuapa: el caudillo de la Unión cae y el sueño muere con él."
 ca_central_america.165.t:0 "La República Mayor"
 ca_central_america.165.d:0 "Varios Estados proponen un pacto: una República Mayor que los represente en el exterior y prepare, paso a paso, la Unión definitiva."
 ca_central_america.165.f:0 "«Primero un pacto, después una República.»"
 ca_central_america.165.a:0 "Firmar el pacto."
 ca_central_america.165.b:0 "Rechazarlo: un pacto sin Unión no vale nada."
 ca_central_america.167.t:0 "La República Mayor se disuelve"
 ca_central_america.167.d:0 "La República Mayor no ha sobrevivido a las rencillas de sus miembros. Uno de ellos se ha retirado y los demás ya no le ven sentido."
 ca_central_america.167.f:0 "«Otra Unión que solo vivió en el papel.»"
 ca_central_america.167.a:0 "Así termina."
 ca_central_america.166.t:0 "La Patria Grande renace"
 ca_central_america.166.d:0 "De Guatemala a Costa Rica, los cinco volcanes vuelven a ondear sobre una sola nación. El sueño de Morazán y de tantos otros, que tantos congresos no lograron cumplir, se ha hecho realidad."
 ca_central_america.166.f:0 "«Centroamérica vuelve a ser una.»"
 ca_central_america.166.a:0 "¡Viva la Patria Grande!"
 ca_conf_consolidated_tt:0 "La Confederación está consolidada: se puede perseguir la Patria Grande."
