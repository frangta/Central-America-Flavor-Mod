l_spanish:
 # =====================================================================
 # CAFM - Conceptos (2026-10-27)
 # =====================================================================
 concept_ca_frca:0 "República Federal de Centroamérica"
 concept_ca_frca_short:0 "Federación"
 concept_ca_frca_desc:0 "La $concept_ca_frca$ nació de la Constitución de 1824, que unió a Guatemala, El Salvador, Honduras, Nicaragua y Costa Rica como [Concept('concept_state','$concept_states$')] soberanos bajo un gobierno federal. En 1836 la Unión está desgastada por la guerra civil, la deuda y la rivalidad entre liberales y conservadores. Que sobreviva, se rehaga por la fuerza o se parta en cinco repúblicas depende de su [concept_ca_frca_support] y de la [concept_ca_state_structure] que elijan sus miembros."
 concept_ca_frca_support:0 "Apoyo federal"
 concept_ca_frca_support_desc:0 "El $concept_ca_frca_support$ mide cuánto creen todavía los [Concept('concept_state','$concept_states$')] miembros en la [concept_ca_frca]. Se sigue en el [concept_journal_entry] #b Caída de la Federación#! y cambia cada mes con la lealtad de cada Estado, la ayuda federal, las rebeliones y las decisiones de sus gobiernos. Si se derrumba, la Unión se disuelve."
 concept_ca_state_structure:0 "Estructura del Estado"
 concept_ca_state_structure_desc:0 "La $concept_ca_state_structure$ es un [concept_law_group] que define cómo se reparte el poder entre la capital federal y los [Concept('concept_state','$concept_states$')].\n\n#title El soberano de la Unión#! elige entre república #b federal#!, #b unitaria#! o #b confederada#!.\n#title Cada Estado miembro#! sigue al soberano: #b Estado federal#!, #b Estado departamental#!, #b Estado confederado#! o #b Estado autónomo#!.\n#title Un país centroamericano fuera de la Unión#! es un #b Estado soberano#!."
 concept_ca_federal_spectrum:0 "Espectro federal"
 concept_ca_federal_spectrum_desc:0 "El $concept_ca_federal_spectrum$ muestra dónde se sitúa un Estado miembro dentro de la [concept_ca_frca], de #v -50#! a #v +50#!.\n\n#b [concept_ca_centralists]#! (#v -50#! a #v -17#!): el Estado se somete a la capital federal.\n#b [concept_ca_federalists]#! (#v -16#! a #v +16#!): el Estado mantiene el pacto de 1824.\n#b [concept_ca_separatists]#! (#v +17#! a #v +50#!): el Estado pone su propia soberanía por delante.\n\nUnas Fuerzas Armadas poderosas y la Iglesia lo empujan al centralismo; liberales y artesanos urbanos en el gobierno lo devuelven al centro; un [concept_liberty_desire] alto, élites locales poderosas y el particularismo rural lo llevan al separatismo."
 concept_ca_centralists:0 "Centralistas"
 concept_ca_centralists_desc:0 "Los $concept_ca_centralists$, también llamados #i unitarios#! o #i serviles#!, quieren un solo gobierno fuerte en la capital. Su base son las Fuerzas Armadas, la Iglesia, las grandes familias de la Ciudad de Guatemala y buena parte de la población rural, que confiaba más en el viejo orden colonial que en las reformas liberales."
 concept_ca_federalists:0 "Federalistas"
 concept_ca_federalists_desc:0 "Los $concept_ca_federalists$ defienden la Constitución de 1824: [Concept('concept_state','$concept_states$')] soberanos unidos bajo un gobierno federal. Encabezados por liberales como Francisco Morazán, los apoyan abogados, académicos, comerciantes y los artesanos y jornaleros urbanos que llenaban las milicias liberales."
 concept_ca_separatists:0 "Separatistas"
 concept_ca_separatists_desc:0 "Los $concept_ca_separatists$ ponen la soberanía de su Estado por encima de la Unión. Unos quieren una [concept_ca_confederation] laxa; otros, una república del todo independiente. Son más fuertes entre las élites locales, los caudillos de provincia y las regiones resentidas con la capital federal."
 concept_ca_federal_dependency:0 "Estado federal"
 concept_ca_federal_dependency_desc:0 "Un $concept_ca_federal_dependency$ es un [concept_subject] que se gobierna a sí mismo en lo interno pero comparte gobierno federal, ejército y política exterior con su [concept_overlord]."
 concept_ca_protectorate:0 "Protectorado"
 concept_ca_protectorate_desc:0 "Un $concept_ca_protectorate$ es un [concept_subject] que lleva sus propios asuntos pero confía su defensa y sus relaciones exteriores a un [concept_overlord] más fuerte."
 concept_ca_confederative_partner:0 "Socio confederado"
 concept_ca_confederative_partner_desc:0 "Un $concept_ca_confederative_partner$ es un [concept_subject] casi del todo independiente, pero que sigue unido a su [concept_overlord] en una [concept_ca_confederation]."
 concept_ca_caudillo:0 "Caudillo"
 concept_ca_caudillo_desc:0 "Un $concept_ca_caudillo$ es un hombre fuerte cuya autoridad descansa en la lealtad personal, sus seguidores armados y el clientelismo local, no en las leyes ni en las instituciones. En las décadas posteriores a la independencia, caudillos como Rafael Carrera o Francisco Malespín hicieron y deshicieron gobiernos en toda Centroamérica."
 concept_ca_prospecting:0 "Estudio geológico nacional"
 concept_ca_prospecting_short:0 "Estudio"
 concept_ca_prospecting_desc:0 "Una vez investigada la #b Prospección#!, un país centroamericano puede iniciar un $concept_ca_prospecting$ para cartografiar la riqueza mineral de su territorio. Las expediciones y los geólogos extranjeros aceleran el estudio, y sus hallazgos pueden revelar nuevo [concept_resource_potential] en nuestros [Concept('concept_state','$concept_states$')]."
