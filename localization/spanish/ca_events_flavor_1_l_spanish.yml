 ca_costa_rica_events.81.t:0 "La respuesta desde San José"
 ca_costa_rica_events.81.d:0 "11 de agosto de 1836. Una nota del ministro federal Miguel Álvarez anuncia la mediación de Juan Mora Fernández y Pedro Bermúdez. Para cuando llega, las armas costarricenses ya han expulsado a Quijano del norte."
 ca_costa_rica_events.81.f:0 "La ayuda que llega tarde sigue siendo ayuda... a ojos de los periódicos."
 ca_costa_rica_events.81.a:0 "Agradecemos la oferta, pero el asunto ya lo han resuelto las armas costarricenses."
 ca_costa_rica_events.99.t:0 "El colapso del norte"
 ca_costa_rica_events.99.d:0 "San José no ha logrado restablecer el orden a tiempo. Guanacaste ha roto sus lazos con Costa Rica, y Nicaragua ya se presenta como protectora de la provincia norteña."
 ca_costa_rica_events.99.f:0 "El norte no se perdió en una batalla, sino en mil días de abandono."
 ca_costa_rica_events.99.a:0 "¡Hemos perdido el norte!"
 ca_costa_rica_events.161.t:0 "El desembarco de Paredes"
 ca_costa_rica_events.161.d:0 "18 de diciembre de 1836. Ildefonso de Paredes ha desembarcado en Bocas del Toro y le ha pedido sus credenciales a Filemón Galindo. No tenía ninguna. Sin que se disparara un tiro, el jefe político del Distrito Morazán abordó la goleta inglesa Constanza, fondeada en el puerto, y se marchó. La bandera de la Nueva Granada vuelve a ondear sobre las lagunas."
 ca_costa_rica_events.161.f:0 "Un distrito fundado sobre el papel, perdido en una tarde."
 ca_costa_rica_events.161.a:0 "Hemos sido humillados, pero no renunciaremos a nuestro reclamo."
 ca_costa_rica_events.191.t:0 "Luto en San José"
 ca_costa_rica_events.191.d:0 "Toribio Argüello, el hombre que los electores eligieron contra todo pronóstico, ha muerto. Sin un sucesor claro, la facción constitucional cierra filas y entrega el gobierno a sus propios hombres."
 ca_costa_rica_events.191.a:0 "La República llora a su líder."
 ca_costa_rica_events.201.t:0 "El Manifiesto de David"
 ca_costa_rica_events.201.d:0 "16 de julio de 1841. Desde David, en Chiriquí, Francisco Morazán ha publicado un manifiesto en defensa de la causa federal. Comienza con Montesquieu: «Cuando los traidores de la Patria ocupan los más altos cargos, el gobierno es opresión». Ya circulan copias en San José y Cartago."
 ca_costa_rica_events.201.f:0 "Exiliado, pero no silenciado."
 ca_costa_rica_events.201.a:0 "¡Quemad esos panfletos subversivos!"
 ca_costa_rica_events.201.b:0 "Que sus palabras circulen en las sombras."
 ca_costa_rica_events.202.t:0 "Sombras en Lima"
 ca_costa_rica_events.202.d:0 "Nuestros agentes informan que Morazán está en Lima. Se dice que el general Pedro Bermúdez costea su regreso, y que viejos veteranos de la Unión se reúnen en torno a él. Unos dicen que servirá al Perú; otros, que se prepara para volver."
 ca_costa_rica_events.202.f:0 "Un exiliado con un ejército ya no es un exiliado."
 ca_costa_rica_events.202.a:0 "Exigir a Lima su extradición."
 ca_costa_rica_events.202.b:0 "Enviarle oro en secreto."
 ca_costa_rica_events.203.t:0 "La encrucijada andina"
 ca_costa_rica_events.203.d:0 "Diciembre de 1841. Morazán ha rechazado el mando de una división peruana. En el puerto del Callao embarca en el Crusader con Cabañas, Saravia y un puñado de oficiales, rumbo a Centroamérica."
 ca_costa_rica_events.203.f:0 "Hay hombres que no pueden vivir lejos de su causa."
 ca_costa_rica_events.203.a:0 "«Mi destino está en Centroamérica»."
 ca_costa_rica_events.203.b:0 "«Acepto el mando en el Perú»."
 # ==========================================
 # 7. EVENTOS DE ESTADOS ESPECÍFICOS (Flavor Histórico)
 # ==========================================
 ca_nicaragua_events.1.t:0 "Anarquía en los lagos"
 ca_nicaragua_events.1.d:0 "Llegan informes angustiosos de Nicaragua, un estado completamente paralizado por la amarga y sangrienta rivalidad entre las élites liberales de León y el bloque conservador de Granada. Mientras el actual Jefe de Estado, José Zepeda, intenta desesperadamente aplicar reformas progresistas y pacificar el territorio antes del ciclo político de 1837, los caudillos militares locales conspiran constantemente contra su administración. Para el gobierno federal en San Salvador, el estado de casi anarquía perpetua de Nicaragua es un enorme lastre que amenaza con cortar la comunicación física y política entre nuestros estados del norte y del sur."
 ca_nicaragua_events.1.f:0 "La Federación se desangra en las ciudades divididas."
 ca_nicaragua_events.1.a:0 "Debemos apoyar el frágil gobierno de Zepeda."
 ca_nicaragua_events.1.b:0 "Dejadlos con sus interminables guerras civiles."

 ca_nicaragua_events.2.t:0 "El estado dividido"
 ca_nicaragua_events.2.d:0 "La República Federal nos ha traído poca paz, pero, a decir verdad, nuestras heridas más profundas nos las hemos infligido nosotros mismos. Nicaragua está violentamente desgarrada entre el bastión liberal de León y el baluarte conservador de Granada. El Jefe de Estado José Zepeda lucha por mantener una apariencia de orden constitucional y aplicar reformas vitales en medio de las constantes conspiraciones de militares insubordinados. A medida que nos acercamos al año crítico de 1837, el estado se tambalea al borde del colapso interno total. Debemos encontrar la manera de unir nuestras ciudades divididas y frenar a los caudillos, o el caos nos destruirá antes de que la Federación tenga siquiera la oportunidad de intervenir."
 ca_nicaragua_events.2.f:0 "León y Granada no pueden coexistir en paz."
 ca_nicaragua_events.2.a:0 "Debemos restablecer el orden por todos los medios necesarios."
 ca_nicaragua_events.2.b:0 "La Federación debe intervenir para salvarnos."


 ca_el_salvador_events.1.t:0 "El bastión liberal"
 ca_el_salvador_events.1.d:0 "San Salvador sigue siendo el corazón palpitante de nuestra Federación. Mientras otros estados se fracturan, las ideas ilustradas radicales siguen floreciendo aquí, proporcionando a Francisco Morazán la base política leal y los ejércitos que necesita para mantener unida esta unión. Sin embargo, su radicalismo inquebrantable y su constante movilización contra los terratenientes tradicionales están generando un profundo resentimiento entre las facciones conservadoras de los estados vecinos."
 ca_el_salvador_events.1.f:0 "La cuna del unionismo centroamericano."
 ca_el_salvador_events.1.a:0 "¡Viva Morazán y viva la República!"
 ca_el_salvador_events.1.b:0 "Su radicalismo aleja al resto de los estados."
 
 ca_guatemala_events.1.t:0 "La rebelión de La Montaña"
 ca_guatemala_events.1.d:0 "Un levantamiento masivo y aterrador amenaza la estabilidad de nuestras fronteras del norte. Rafael Carrera ha reunido a miles de campesinos furiosos, comunidades indígenas y clérigos fundamentalistas de las montañas. Marchan hacia Ciudad de Guatemala con un único y violento propósito: desmantelar por completo las reformas liberales de Mariano Gálvez, expulsar a todos los extranjeros y destruir el aparato estatal moderno que tanto nos ha costado construir."
 ca_guatemala_events.1.f:0 "¡Viva la Religión y mueran los extranjeros!"
 ca_guatemala_events.1.a:0 "Enviar tropas federales de inmediato."
 ca_guatemala_events.1.b:0 "Es un asunto local que debe resolver Gálvez."
 ca_guatemala_events.1.c:0 "Intentar negociar con Carrera."
 
 ca_honduras_events.1.t:0 "Tensión en Comayagua"
 ca_honduras_events.1.d:0 "Honduras se encuentra profunda y peligrosamente dividida. Como puente geográfico de nuestra república, su estabilidad es primordial. Sin embargo, mientras algunos líderes provinciales siguen obstinadamente leales al ideal federal, poderosas voces conservadoras en Comayagua ganan terreno con rapidez. Amenazan con cortar el vínculo físico entre El Salvador y el resto de la Unión, sustituyendo nuestros mandatos liberales por sus propias agendas autonomistas y tradicionalistas."
 ca_honduras_events.1.f:0 "La frágil provincia del medio."
 ca_honduras_events.1.a:0 "Debemos asegurar su lealtad."
 ca_honduras_events.1.b:0 "Sus disputas internas son agotadoras."
 ca_el_salvador_events.2.t:0 "La carga de la República"
 ca_el_salvador_events.2.d:0 "Como capital y vanguardia de la Federación, la supervivencia del gran sueño centroamericano descansa por completo sobre nuestros cansados hombros. Reaccionarios conservadores, campesinos rebeldes y ambiciosos dictadores locales nos rodean por todos lados. Hemos desangrado a nuestra juventud y vaciado nuestras arcas para financiar las campañas de Morazán, pero no permitiremos que el proyecto liberal de ilustración y unidad perezca en la oscuridad. La lucha continúa."
 ca_el_salvador_events.2.f:0 "Sangramos por la Unión."
 ca_el_salvador_events.2.a:0 "Marcharemos con Morazán hasta el amargo final."
 ca_el_salvador_events.2.b:0 "¿Es esta carga demasiado pesada para nosotros solos?"
 
 ca_guatemala_events.2.t:0 "Un estado en llamas"
 ca_guatemala_events.2.d:0 "La administración liberal de Mariano Gálvez está al borde del colapso total. Una devastadora epidemia de cólera asola el campo, y la Iglesia ha sabido convertir la tragedia en un arma, avivando la furia de la población rural. Ahora, el ejército montañés de Rafael Carrera marcha sobre la capital, prometiendo restaurar los valores tradicionales, proteger la fe y acabar violentamente con las reformas extranjeras que han alejado al pueblo llano. Nuestro estado se fractura desde dentro."
 ca_guatemala_events.2.f:0 "El viejo orden contraataca."
 ca_guatemala_events.2.a:0 "Debemos aplastar a Carrera para salvar la República."
 ca_guatemala_events.2.b:0 "Abrazar el levantamiento conservador."
 ca_guatemala_events.2.c:0 "¿Podemos encontrar un término medio?"
 
 
 ca_los_altos_soconusco_events.1.b:0 "Son rebeldes de Guatemala."

 ca_nicaragua_events.4.t:0 "Tratado Clayton-Bulwer"
 ca_nicaragua_events.4.d:0 "Británicos y estadounidenses acuerdan no colonizar en exclusiva Centroamérica."
 ca_nicaragua_events.4.f:0 "Deciden sobre nuestras tierras sin consultarnos."
