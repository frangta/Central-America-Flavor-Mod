 filibuster.2.f:0 ""
 filibuster.2.a:0 "¡Echemos a los gringos de vuelta al norte!"
 filibuster.2.b:0 "¡Yeehaw!"
 filibuster.4.t:0 "¡El filibustero estadounidense William Walker ha establecido un régimen en Nicaragua!"
 filibuster.4.d:0 "La invasión de Nicaragua por William Walker ha triunfado y ha establecido su propio gobierno, imponiendo el inglés como idioma oficial y restableciendo la esclavitud. Como república hermana centroamericana, esto es una amenaza directa a nuestra propia seguridad nacional; sin duda debemos actuar."
 filibuster.4.f:0 "«Pero papá, ya no somos una sola nación como en sus tiempos, ¿por qué tiene que ir a pelear por los nicaragüenses?»\n\n«Porque, mija, si no sacamos a ese yanqui Walker del país vecino, sabemos que esos filibusteros vendrán por nosotros después».\n\n«Hoy todos somos centroamericanos»."
 filibuster.4.a:0 "¡Muerte a los filibusteros!"
 filibuster.4.b:0 "Tenemos nuestros propios problemas; que otros se encarguen de esto"
 baja_filibusters:0 "Fuerza Expedicionaria de Walker"
 sonora_filibusters:0 "Filibusteros de Sonora"
 je_baj_usa:0 "Admitir a la Baja California en la Unión"
 je_baj_usa_reason:0 "Los filibusteros de William Walker han establecido en la Baja California una república basada en las leyes estadounidenses. Ahora que su independencia está asegurada, deberíamos admitirla en la Unión como estado."
 usa_annex_baj_tt:0 "Los Estados Unidos anexionarán la Baja California"
 je_snr_usa:0 "Admitir a Sonora en la Unión"
 je_snr_usa_reason:0 "Los filibusteros han establecido una república independiente en Sonora. Ahora que están seguros, deberíamos admitirlos en la Unión."
 usa_annex_snr_tt:0 "Los Estados Unidos anexionarán Sonora"
 filibuster_war:0 "Expedición de Walker a la Baja California"
 sonora_filibuster_war:0 "Expedición filibustera en Sonora"
 filibuster_war_nicaragua:0 "Invasión de Nicaragua por Walker"
 nicaragua_filibusters:0 "Filibusteros nicaragüenses de Walker"
