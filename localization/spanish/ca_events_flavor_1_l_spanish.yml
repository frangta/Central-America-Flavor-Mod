 # CAFM - National Geological Survey events (ca_prospecting.1 - .30)
 # Written to match events/ca_prospecting_events.txt (current version).
 # REPLACES the old ca_prospecting block in ca_events_flavor_1_l_english.yml
 # (lines 1270-1350). Delete that block or the keys will be duplicated.
 # ============================================================

 ca_prospecting.1.t:0 "Oro en los cauces"
 ca_prospecting.1.d:0 "Nuestros agrimensores en [SCOPE.sState('target_state').GetName] han encontrado rastros de oro en los cauces de los ríos. La noticia no seguirá siendo secreta por mucho tiempo, y la cuestión es quién se beneficiará de ella: los buscadores que acudan en masa a los ríos o el propio Estado."
 ca_prospecting.1.f:0 "Donde hay oro, siempre sobran dueños."
 ca_prospecting.1.a:0 "Abrir los yacimientos a la minería."
 ca_prospecting.1.b:0 "Declarar el oro propiedad del Estado."

 ca_prospecting.2.t:0 "Hierro en las colinas"
 ca_prospecting.2.d:0 "Se han cartografiado profundas vetas de hierro en las colinas de [SCOPE.sState('target_state').GetName]. Explotarlas requerirá tierras que hoy cultivan campesinos y que codician los terratenientes locales."
 ca_prospecting.2.f:0 "Hierro para rieles, hierro para fusiles, hierro para el futuro."
 ca_prospecting.2.a:0 "Marcar las vetas para su explotación."
 ca_prospecting.2.b:0 "Explotarlas, pero proteger los campos de los campesinos."

 ca_prospecting.3.t:0 "El aliento del volcán"
 ca_prospecting.3.d:0 "En torno a las fumarolas de un volcán de [SCOPE.sState('target_state').GetName], nuestros agrimensores han encontrado gruesas costras de azufre. El ejército ya lo reclama: sin azufre no hay pólvora."
 ca_prospecting.3.f:0 "La montaña humea, y los generales sonríen."
 ca_prospecting.3.a:0 "Registrar los yacimientos de azufre."
 ca_prospecting.3.b:0 "Entregar los yacimientos al ejército."

 ca_prospecting.4.t:0 "Un modesto yacimiento de plomo"
 ca_prospecting.4.d:0 "Se ha encontrado un pequeño yacimiento de plomo en [SCOPE.sState('target_state').GetName]. No es una gran fortuna, y el equipo de prospección está ansioso por pasar a regiones más prometedoras."
 ca_prospecting.4.f:0 "No todo hallazgo cambia el destino de una nación."
 ca_prospecting.4.a:0 "Marcarlo para una explotación futura."
 ca_prospecting.4.b:0 "Registrarlo y seguir adelante con la prospección."

 ca_prospecting.5.t:0 "El oro del altiplano"
 ca_prospecting.5.d:0 "En [SCOPE.sState('target_state').GetName], donde los españoles explotaron minas abandonadas hace mucho, nuestros geólogos han encontrado vetas de oro mucho más ricas de lo que nadie sospechaba. Los terratenientes locales ya se ofrecen a comprar la concesión."
 ca_prospecting.5.f:0 "Las viejas minas coloniales no estaban agotadas. Solo estaban olvidadas."
 ca_prospecting.5.a:0 "El Estado desarrollará las minas."
 ca_prospecting.5.b:0 "Vender la concesión a los terratenientes."

 ca_prospecting.6.t:0 "Fiebre del oro"
 ca_prospecting.6.d:0 "La noticia de un hallazgo de oro en [SCOPE.sState('target_state').GetName] se ha extendido como la pólvora. Los campesinos abandonan las haciendas para probar suerte en los ríos, y los terratenientes se quejan de que no queda nadie para levantar la cosecha."
 ca_prospecting.6.f:0 "Todo hombre con una batea cree que será el próximo rico."
 ca_prospecting.6.a:0 "Dejar que la fiebre del oro siga su curso."
 ca_prospecting.6.b:0 "Vender permisos mineros y gravar a los buscadores."

 ca_prospecting.7.t:0 "Mantos de carbón"
 ca_prospecting.7.d:0 "Se han encontrado mantos de carbón en [SCOPE.sState('target_state').GetName]. Un grupo de industriales bien relacionados se ofrece a desarrollarlos de inmediato, si el gobierno les otorga la concesión sin demasiadas preguntas."
 ca_prospecting.7.f:0 "El combustible de la era del vapor, enterrado bajo nuestros pies."
 ca_prospecting.7.a:0 "Registrar el carbón para una explotación futura."
 ca_prospecting.7.b:0 "Otorgar la concesión a los industriales."

 ca_prospecting.8.t:0 "Manaderos negros en Panamá"
 ca_prospecting.8.d:0 "Gracias a las técnicas modernas de prospección, nuestros geólogos han confirmado que los manaderos negros hallados en [SCOPE.sState('target_state').GetName] son petróleo. Una firma extranjera ofrece una fortuna por los derechos exclusivos."
 ca_prospecting.8.f:0 "Los nativos lo usaban para calafatear sus canoas. Los extranjeros lo quieren para sus máquinas."
 ca_prospecting.8.a:0 "El petróleo permanecerá en manos nacionales."
 ca_prospecting.8.b:0 "Vender los derechos a la firma extranjera."

 ca_prospecting.9.t:0 "¿Mina o cultivo?"
 ca_prospecting.9.d:0 "Un valle fértil de [SCOPE.sState('target_state').GetName] oculta un yacimiento de azufre bajo sus campos. Podemos abrir una mina y construir caminos hasta ella, o dejar la tierra a los agricultores que ya la trabajan."
 ca_prospecting.9.f:0 "El mismo valle no puede alimentar a la vez una mina y un pueblo."
 ca_prospecting.9.a:0 "Abrir la mina y construir los caminos."
 ca_prospecting.9.b:0 "Dejar el valle a los agricultores."

 ca_prospecting.10.t:0 "Una prospección chapucera"
 ca_prospecting.10.d:0 "Ingenieros extranjeros han descubierto que muchos de nuestros mapas de prospección son groseramente erróneos: ríos fuera de lugar, montañas que no existen, yacimientos inventados para justificar gastos. La prensa extranjera se burla de nosotros."
 ca_prospecting.10.f:0 "Parece que nuestros geólogos preferían el café a las montañas."
 ca_prospecting.10.a:0 "Admitir el error públicamente."
 ca_prospecting.10.b:0 "Descartar los mapas discretamente y empezar de nuevo."

 ca_prospecting.11.t:0 "Suelos volcánicos"
 ca_prospecting.11.d:0 "La prospección ha identificado vastas extensiones de rico suelo volcánico en [SCOPE.sState('target_state').GetName], ideal para el cultivo. Los terratenientes quieren comprarlo; los campesinos esperan que se reparta entre ellos."
 ca_prospecting.11.f:0 "El volcán que destruye es también el volcán que alimenta."
 ca_prospecting.11.a:0 "Abrir la tierra a la colonización y el cultivo."
 ca_prospecting.11.b:0 "Vender la tierra a los terratenientes."

 ca_prospecting.12.t:0 "Moreras en el altiplano"
 ca_prospecting.12.d:0 "Los botánicos que viajan con la prospección informan que el clima de [SCOPE.sState('target_state').GetName] es muy adecuado para las moreras y, por tanto, para la cría de gusanos de seda."
 ca_prospecting.12.f:0 "¿Seda centroamericana? Se han visto cosas más extrañas."
 ca_prospecting.12.a:0 "Fomentar la plantación de moreras."
 ca_prospecting.12.b:0 "Financiar un estudio científico en regla."

 ca_prospecting.13.t:0 "Laderas para el té"
 ca_prospecting.13.d:0 "Las laderas frescas y brumosas de [SCOPE.sState('target_state').GetName] se parecen a los jardines de té de Asia, según uno de los naturalistas de la prospección."
 ca_prospecting.13.f:0 "El café tiene un rival, al menos sobre el papel."
 ca_prospecting.13.a:0 "Plantar té en las laderas."
 ca_prospecting.13.b:0 "Tomar nota y seguir con la prospección."

 ca_prospecting.14.t:0 "Tierras algodoneras"
 ca_prospecting.14.d:0 "Las tierras bajas de [SCOPE.sState('target_state').GetName] son aptas para el algodón. Comerciantes británicos ya han mostrado interés en comprar la fibra en bruto, aunque nuestros propios fabricantes preferirían quedársela."
 ca_prospecting.14.f:0 "Las fábricas de Mánchester siempre tienen hambre."
 ca_prospecting.14.a:0 "Fomentar el cultivo de algodón."
 ca_prospecting.14.b:0 "Invitar a los compradores británicos de algodón."

 ca_prospecting.15.t:0 "Viñedos de las antiguas misiones"
 ca_prospecting.15.d:0 "En [SCOPE.sState('target_state').GetName], la prospección ha encontrado los restos de viñedos plantados por misioneros en tiempos coloniales. Las vides aún crecen silvestres entre las ruinas."
 ca_prospecting.15.f:0 "Los frailes siempre supieron dónde estaba la buena tierra."
 ca_prospecting.15.a:0 "Restaurar los viñedos para el comercio."
 ca_prospecting.15.b:0 "Dejar las vides a la Iglesia."

 ca_prospecting.16.t:0 "Los campos de amapola"
 ca_prospecting.16.d:0 "La prospección informa que el suelo de [SCOPE.sState('target_state').GetName] es ideal para la adormidera. Los comerciantes extranjeros pagarían bien, pero el clero ya ha denunciado la idea desde el púlpito."
 ca_prospecting.16.f:0 "Una flor rentable, y peligrosa."
 ca_prospecting.16.a:0 "Permitir el cultivo de la amapola."
 ca_prospecting.16.b:0 "Prohibir la amapola y mantener la paz."

 ca_prospecting.17.t:0 "Desecar los pantanos"
 ca_prospecting.17.d:0 "Grandes pantanos de [SCOPE.sState('target_state').GetName] podrían convertirse en fértiles tierras de cultivo si se desecaran. Las obras serían costosas, y los comerciantes locales sugieren dejar la tarea a la iniciativa privada."
 ca_prospecting.17.f:0 "Mosquitos hoy, cosechas mañana."
 ca_prospecting.17.a:0 "Financiar las obras de desecación."
 ca_prospecting.17.b:0 "Dejarlo a la iniciativa privada."

 ca_prospecting.18.t:0 "Tierras comunales en el camino"
 ca_prospecting.18.d:0 "Las mejores tierras identificadas en [SCOPE.sState('target_state').GetName] pertenecen a comunidades indígenas y campesinas que las han trabajado en común durante generaciones. Abrirlas al cultivo comercial significaría arrebatárselas."
 ca_prospecting.18.f:0 "No tienen escrituras, solo siglos de memoria."
 ca_prospecting.18.a:0 "Confiscar las tierras comunales para el cultivo."
 ca_prospecting.18.b:0 "Respetar las tierras comunales."

 ca_prospecting.19.t:0 "Derrumbe en la excavación"
 ca_prospecting.19.d:0 "Las fuertes lluvias han provocado un derrumbe en uno de los sitios de excavación de la prospección en [SCOPE.sState('target_state').GetName]. Hay trabajadores atrapados bajo el lodo, y los ingenieros preguntan si deben detener las obras."
 ca_prospecting.19.f:0 "La montaña siempre cobra su peaje."
 ca_prospecting.19.a:0 "Detener las obras y rescatar a los supervivientes."
 ca_prospecting.19.b:0 "Seguir excavando, cueste lo que cueste."

 ca_prospecting.20.t:0 "Aire envenenado"
 ca_prospecting.20.d:0 "Las minas de azufre de [SCOPE.sState('target_state').GetName] llenan el aire de humos asfixiantes. Los cultivos se marchitan, y los aldeanos culpan a la mina de las toses y las fiebres."
 ca_prospecting.20.f:0 "La mina huele a dinero. El pueblo huele a muerte."
 ca_prospecting.20.a:0 "La producción es lo primero."
 ca_prospecting.20.b:0 "Invertir en ventilación y métodos más limpios."

 ca_prospecting.21.t:0 "Perdidos en la espesura"
 ca_prospecting.21.d:0 "Una de nuestras expediciones de prospección lleva semanas sin dar noticias. Las últimas la situaban en lo profundo de un territorio inexplorado. Enviar una partida de búsqueda retrasaría toda la prospección."
 ca_prospecting.21.f:0 "Los mapas terminan donde empieza la selva."
 ca_prospecting.21.a:0 "Enviar una partida de búsqueda."
 ca_prospecting.21.b:0 "Confiar en que encuentren el camino de vuelta."

 ca_prospecting.22.t:0 "Tierras indígenas"
 ca_prospecting.22.d:0 "La prospección ha llegado a tierras de [SCOPE.sState('target_state').GetName] habitadas por comunidades que se niegan a dejar pasar a los agrimensores. Temen, no sin razón, que los mapas sean el primer paso para quitarles la tierra."
 ca_prospecting.22.f:0 "Para ellos, cada estaca del agrimensor es una frontera que se traza en su contra."
 ca_prospecting.22.a:0 "Abrir paso por la fuerza."
 ca_prospecting.22.b:0 "Negociar y compensar a las comunidades."

 ca_prospecting.23.t:0 "Bandidos en la ruta de la prospección"
 ca_prospecting.23.d:0 "Bandas de salteadores atacan a las partidas de prospección y a los colonos en los caminos de [SCOPE.sState('target_state').GetName], robando equipo y provisiones."
 ca_prospecting.23.f:0 "En la montaña, la ley es quien empuña el fusil."
 ca_prospecting.23.a:0 "Armar a los colonos y que se encarguen ellos."
 ca_prospecting.23.b:0 "Enviar al ejército a despejar los caminos."

 ca_prospecting.24.t:0 "Fiebre de la selva"
 ca_prospecting.24.d:0 "La malaria y la fiebre amarilla diezman a los equipos de prospección en las regiones selváticas. Los cargadores desertan, y los que quedan apenas pueden tenerse en pie."
 ca_prospecting.24.f:0 "La selva no necesita soldados para defenderse."
 ca_prospecting.24.a:0 "Replegarse y atender a los enfermos."
 ca_prospecting.24.b:0 "Seguir adelante a través de la selva."

 ca_prospecting.25.t:0 "Un consorcio extranjero del hierro"
 ca_prospecting.25.d:0 "Un consorcio de inversores europeos ofrece desarrollar los yacimientos de hierro de [SCOPE.sState('iron_state').GetName] con maquinaria moderna, a cambio de un monopolio a largo plazo. Los oficiales del ejército insisten en que el hierro es demasiado importante para dejarlo en manos extranjeras."
 ca_prospecting.25.f:0 "Quien controla el hierro controla los fusiles y los rieles."
 ca_prospecting.25.a:0 "Aceptar el consorcio extranjero."
 ca_prospecting.25.b:0 "Mantener el hierro bajo control nacional."

 ca_prospecting.26.t:0 "¿Quién paga la prospección?"
 ca_prospecting.26.d:0 "La prospección ha agotado su presupuesto. Podemos hipotecar ingresos futuros con prestamistas extranjeros o exigir que los Estados contribuyan a los costos, a riesgo de enfadar a las provincias."
 ca_prospecting.26.f:0 "Todos quieren las riquezas del subsuelo; nadie quiere pagar los mapas."
 ca_prospecting.26.a:0 "Hipotecar ingresos futuros."
 ca_prospecting.26.b:0 "Exigir contribuciones a los Estados."

 ca_prospecting.27.t:0 "Una prospección en plena agitación"
 ca_prospecting.27.d:0 "La llegada de los agrimensores a [SCOPE.sState('target_state').GetName] ha inflamado una región ya inquieta. Los terratenientes quieren que el trabajo continúe con escolta militar; los campesinos exigen que se detenga."
 ca_prospecting.27.f:0 "En una región al borde de la revuelta, un agrimensor parece un recaudador de impuestos."
 ca_prospecting.27.a:0 "Ponerse del lado de los terratenientes."
 ca_prospecting.27.b:0 "Pausar la prospección y calmar la región."

 ca_prospecting.28.t:0 "El espía geológico"
 ca_prospecting.28.d:0 "Nuestros guardias han sorprendido a un hombre copiando en secreto los mapas de la prospección. Confiesa trabajar para una potencia extranjera ansiosa por conocer la riqueza de nuestro subsuelo."
 ca_prospecting.28.f:0 "Nuestros mapas valen más fuera que dentro."
 ca_prospecting.28.a:0 "Arrestarlo públicamente."
 ca_prospecting.28.b:0 "Sobornarlo y enterrar el asunto."

 ca_prospecting.29.t:0 "Ruinas en la selva"
 ca_prospecting.29.d:0 "Guiados por comunidades mayas locales, nuestros agrimensores han descubierto las ruinas de una ciudad antigua en [SCOPE.sState('target_state').GetName]. Los eruditos la llaman un tesoro de la humanidad; los coleccionistas extranjeros ya ofrecen dinero por los objetos."
 ca_prospecting.29.f:0 "El pasado de nuestra tierra es más antiguo que cualquier república."
 ca_prospecting.29.a:0 "Proteger las ruinas para la ciencia y la nación."
 ca_prospecting.29.b:0 "Vender los objetos a coleccionistas extranjeros."

 ca_prospecting.30.t:0 "¿Quién protege a los agrimensores?"
 ca_prospecting.30.d:0 "Tras repetidos ataques a las partidas de prospección, los oficiales del ejército proponen poner toda la prospección bajo mando militar. La alternativa es pagar escoltas privadas con cargo al Tesoro."
 ca_prospecting.30.f:0 "La ciencia avanza, pero avanza mejor con bayonetas."
 ca_prospecting.30.a:0 "Pagar escoltas privadas."
 ca_prospecting.30.b:0 "Poner la prospección bajo mando militar."
 ##############
 #ca_prospecting.1.t: "Funding the Geological Survey"
 #ca_prospecting.1.d: "Mapping the rugged terrain of Central America is no small feat. Dense jungles, steep mountains, and tropical diseases stand between us and the wealth beneath our soil. How much of the national treasury are we willing to risk on this endeavor?"
 #ca_prospecting.1.a: "Equip them with the bare minimum."
 #ca_prospecting.1.b: "Provide adequate funding and supplies."
 #ca_prospecting.1.c: "Spare no expense. Bring the best experts!"
 #
 #ca_prospecting.2.t: "Disaster in the Highlands"
 #ca_prospecting.2.d: "Tragedy has struck our expedition. Heavy rains triggered a massive mudslide that not only buried our equipment and delayed our survey, but also permanently ruined several fertile terraces cultivated by local farmers."
 #ca_prospecting.2.a: "A terrible setback."
 #
 #ca_prospecting.3.t: "Clearing the Path to Progress"
 #ca_prospecting.3.d: "While carving paths through the dense vegetation for our geologists, the expedition has inadvertently cleared large tracts of highly fertile land. Local farmers are already rushing in to plant new crops."
 #ca_prospecting.3.a: "A fortunate side effect!"
 #
 #ca_prospecting.4.t: "Local Resistance"
 #ca_prospecting.4.d: "Rural communities have barricaded the roads, fearful that the arrival of state prospectors means the seizure of their ancestral lands for mining operations."
 #ca_prospecting.4.a: "Disperse them! Progress cannot be halted."
 #ca_prospecting.4.b: "Halt the survey. We must negotiate."
 #
 #ca_prospecting.5.t: "A Deep Vein Discovered"
 #ca_prospecting.5.d: "Our geologists have struck the motherlode! However, the vein runs deep below the water table. Simple picks and shovels will no longer suffice; we will need industrial pumps to extract this wealth."
 #ca_prospecting.5.a: "Mandate the use of heavy machinery."
 #ca_prospecting.5.b: "Note the location for future exploitation."
 #
 #ca_prospecting.6.t: "Local Gold Rush"
 #ca_prospecting.6.d: "News of gold nuggets found in a local river has spread like wildfire. Thousands of peasants are abandoning their harvests, rushing to the hills with pans and pickaxes in hopes of striking it rich."
 #ca_prospecting.6.a: "There's gold in those hills!"
 #
 #ca_prospecting.7.t: "The Foreign Consortium"
 #ca_prospecting.7.d: "A wealthy consortium of foreign investors has approached our government. They offer to fully finance the remainder of our geological survey, provided they are granted exclusive tax-exempt rights to the most lucrative mines."
 #ca_prospecting.7.a: "Accept their capital. We need the progress."
 #ca_prospecting.7.b: "Reject them. Our soil belongs to our people."
 #
 #ca_prospecting.8.t: "Missing Funds"
 #ca_prospecting.8.d: "A scandalous audit has revealed that a significant portion of the survey's budget has been embezzled by a regional governor and his landowning cronies to buy private estates."
 #ca_prospecting.8.a: "Arrest the thieves and seize the assets!"
 #ca_prospecting.8.b: "We cannot afford a political crisis. Ignore it."
 #
 #ca_prospecting.9.t: "The Inaccessible Vein"
 #ca_prospecting.9.d: "An immense deposit of minerals has been mapped, but it sits atop a jagged mountain range surrounded by ravines. Extracting it will be an absolute logistical nightmare."
 #ca_prospecting.9.a: "We will need railways to move this."
 #
 #ca_prospecting.10.t: "Jungle Fever"
 #ca_prospecting.10.d: "The expedition has entered the deep rainforests. Malaria and yellow fever are wreaking havoc among our porters, and morale is practically non-existent."
 #ca_prospecting.10.a: "Call them back. It's a death trap."
 #ca_prospecting.10.b: "Push forward! Replace those who fall."
 #
 #ca_prospecting.11.t: "Ancient Ruins Discovered"
 #ca_prospecting.11.d: "Instead of mineral wealth, our prospectors have stumbled upon a massive, overgrown complex of ancient Mayan ruins. It holds no economic value, but the academic world is mesmerized."
 #ca_prospecting.11.a: "A testament to our glorious past."
 #
 #ca_prospecting.12.t: "Fool's Gold"
 #ca_prospecting.12.d: "What was initially celebrated as the largest gold discovery of the century has turned out to be nothing but iron pyrite. The nation is the laughing stock of the international press."
 #ca_prospecting.12.a: "A humiliating mistake."
 #
 #ca_prospecting.13.t: "Porters on Strike"
 #ca_prospecting.13.d: "The local porters carrying the heavy surveying equipment are refusing to move another inch unless their wages are doubled immediately."
 #ca_prospecting.13.a: "Pay them what they ask."
 #ca_prospecting.13.b: "Fire them all! We'll find others."
 #
 #ca_prospecting.14.t: "Subsoil Rights Conflict"
 #ca_prospecting.14.d: "Powerful landowners are claiming that the minerals found beneath their haciendas belong entirely to them, challenging the state's authority over the subsoil."
 #ca_prospecting.14.a: "Grant them private mining rights."
 #ca_prospecting.14.b: "The subsoil is the absolute property of the State!"
 #
 #ca_prospecting.15.t: "The Church's Blessing"
 #ca_prospecting.15.d: "Local priests have enthusiastically joined the expedition, using their knowledge of the remote parishes to guide our geologists to unexplored caves and riverbeds."
 #ca_prospecting.15.a: "God guides our picks."
 #
 #ca_prospecting.16.t: "Geological Innovation"
 #ca_prospecting.16.d: "Necessity is the mother of invention. Our surveyors have developed a brilliant new technique for rapid mineral cataloging in tropical environments."
 #ca_prospecting.16.a: "Publish these findings!"
 #
 #ca_prospecting.17.t: "Black Gold"
 #ca_prospecting.17.d: "Excellent news! Massive, highly accessible coal seams have been discovered. This will undoubtedly become the fuel for our future industrialization."
 #ca_prospecting.17.a: "The steam age is upon us."
 #
 #ca_prospecting.18.t: "The Geological Spy"
 #ca_prospecting.18.d: "Our guards have caught a man making covert copies of our geological maps. He confesses to being a spy hired by a foreign power eager to know our resource capabilities."
 #ca_prospecting.18.a: "Arrest him quietly."
 #ca_prospecting.18.b: "He escaped before we could secure the maps!"
