 ca_central_america.77.b:0 "Intervenir"
 ca_central_america.78.t:0 "Independencia de Los Altos"
 ca_central_america.78.d:0 "El gobierno de Los Altos ha pedido formalmente a la Federación que reconozca su plena soberanía. Con la autoridad federal derrumbándose a su alrededor, los notables de Quetzaltenango ya no confían en que la Unión los proteja de Guatemala y prefieren valerse por sí mismos."
 ca_central_america.78.f:0 "El Sexto Estado se enfrenta solo a la tormenta."
 ca_central_america.78.a:0 "Reconocer el Estado Libre de Los Altos"
 ca_central_america.78.b:0 "¡Esto es ilegal! Pertenecen a Guatemala"

 ca_central_america.80.t:0 "La Unión se desmorona"
 ca_central_america.80.d:0 "La República Federal de Centroamérica se está deshaciendo. Uno a uno, los Estados retiran a sus diputados y sus impuestos, y el gobierno federal apenas gobierna algo más que su propia capital. Como líder de esta Unión moribunda, puedes intentar salvarla hasta el final o tomar las riendas de uno de los Estados que le sobrevivirán."
 ca_central_america.80.f:0 "Cuando la casa se derrumba, cada uno se refugia donde puede."
 ca_central_america.80.a:0 "Asumir el control de Guatemala."
 ca_central_america.80.b:0 "Asumir el control de El Salvador."
 ca_central_america.80.nic:0 "Asumir el control de Nicaragua."
 ca_central_america.80.alt:0 "Asumir el control de Los Altos."
 ca_central_america.87.t:0 "El Congreso de la República"
 ca_central_america.87.d:0 "El congreso se ha reunido para decidir el destino de la unión."
 ca_central_america.87.a:0 "¡Preservar la Unión!"
 ca_central_america.87.b:0 "Disolver la Unión."






# ==========================================
 # CAPÍTULO 1: NICARAGUA
 # ==========================================
 ca_central_america.101.t:0 "El eco de Granada"
 ca_central_america.101.d:0 "Las noticias llegan a la capital. Los conservadores granadinos y los liberales leoneses han tomado las armas o se han separado. El pueblo centroamericano empieza a dudar de la Federación."
 ca_central_america.101.f:0 "«La unión tiembla cuando sus hermanos pelean»."
 ca_central_america.101.a:0 "Malditos traidores..."
 ca_central_america.101.b:0 "Debemos censurar la prensa para evitar el pánico."

 ca_central_america.102.t:0 "El dilema en la capital"
 ca_central_america.102.d:0 "Refugiados de León, leales a la Federación, han llegado suplicando fondos urgentes porque Granada los está aplastando."
 ca_central_america.102.f:0 "«Piden oro que no tenemos, para pelear una guerra que no empezamos»."
 ca_central_america.102.a:0 "Abrir las arcas del tesoro."
 ca_central_america.102.b:0 "Nuestras reservas están vacías."

 ca_central_america.103.t:0 "Lágrimas en el Cocibolca"
 ca_central_america.103.d:0 "La guerra en Nicaragua por fin ha terminado. El destino de la región, y quizá de la propia Federación, está sellado."
 ca_central_america.103.a:0 "Se ha restablecido el orden en el istmo."
 ca_central_america.103.b:0 "Nicaragua está perdida para nosotros para siempre..."

 # ==========================================
 # CAPÍTULO 2: COSTA RICA
 # ==========================================
 ca_central_america.104.t:0 "El silencio de San José"
 ca_central_america.104.d:0 "A diferencia del caos de Nicaragua, las noticias de Costa Rica llegan como un golpe. Las élites cafetaleras costarricenses simplemente han dejado de enviar impuestos a la capital federal, alegando que la Federación no les aporta nada."
 ca_central_america.104.a:0 "Son unos ingratos."
 ca_central_america.104.b:0 "Confiscar sus exportaciones de café en nuestros puertos."

 ca_central_america.105.t:0 "Olor a traición"
 ca_central_america.105.d:0 "Potencias extranjeras como Gran Bretaña, que compran el café costarricense, están molestas por el bloqueo portuario. Han ofrecido a la Federación fondos para financiar la guerra a cambio de favores comerciales."
 ca_central_america.105.a:0 "Aceptamos el oro extranjero."
 ca_central_america.105.b:0 "Centroamérica no está en venta."

 ca_central_america.106.t:0 "El destino del Pacto"
 ca_central_america.106.d:0 "El conflicto en el sur ha llegado a su fin. El desenlace marcará el futuro de nuestra frontera meridional."
 ca_central_america.106.a:0 "Carrillo ha consolidado su tiranía..."
 ca_central_america.106.b:0 "El sur vuelve al redil."

 # ==========================================
 # CAPÍTULO 3: HONDURAS
 # ==========================================
 ca_central_america.107.t:0 "La puñalada en Comayagua"
 ca_central_america.107.d:0 "Las noticias llegan a la capital federal: los conservadores hondureños han tomado el control y han renunciado a la autoridad de la Federación. Es un golpe moral devastador, que demuestra que ni siquiera el estado natal del Director Supremo apoya el proyecto unionista."
 ca_central_america.107.a:0 "¡Es una traición imperdonable!"
 ca_central_america.107.b:0 "Debemos negociar con Ferrera..."

 ca_central_america.108.t:0 "Sangre en el río Ulúa"
 ca_central_america.108.d:0 "A diferencia de otros conflictos, la guerra en Honduras ha degenerado en una brutal campaña de guerrillas. Las poblaciones campesinas e indígenas se ven obligadas a luchar en ambos bandos, y la economía agrícola se está desplomando."
 ca_central_america.108.a:0 "Enviar oficiales para disciplinar a las milicias leales."
 ca_central_america.108.b:0 "Que se maten entre ellos."

 ca_central_america.109.t:0 "El destino del general Ferrera"
 ca_central_america.109.d:0 "Las armas han callado en Honduras. Ha llegado el momento de afrontar las consecuencias de esta amarga guerra civil."
 ca_central_america.109.a:0 "Ferrera ha triunfado..."
 ca_central_america.109.b:0 "La patria de Morazán es libre."

 # ==========================================
 # CAPÍTULO 4: GUATEMALA
 # ==========================================
 ca_central_america.110.t:0 "El rugido de la montaña"
 ca_central_america.110.d:0 "Las noticias que llegan a la capital son aterradoras. No se trata de un golpe de hombres de levita: miles de campesinos armados con machetes y mosquetes gritan «¡Viva la Religión y mueran los extranjeros!», acusando al gobierno federal de envenenar los ríos."
 ca_central_america.110.a:0 "La ignorancia es nuestro peor enemigo."
 ca_central_america.110.b:0 "¡Enviad a los médicos y al ejército!"

 ca_central_america.111.t:0 "El pánico de Gálvez"
 ca_central_america.111.d:0 "Mariano Gálvez, el líder liberal de Guatemala, está acorralado en la capital. Sus reformas causaron este desastre, y ahora exige que Morazán envíe todo el ejército para salvarlo de ser linchado por las turbas de Carrera."
 ca_central_america.111.a:0 "Morazán marchará sobre Guatemala."
 ca_central_america.111.b:0 "Gálvez cavó su propia tumba..."

 ca_central_america.112.t:0 "El destino del caudillo"
 ca_central_america.112.d:0 "La gran guerra del norte ha terminado. La lucha entre los liberales y las milicias de la montaña ha llegado a una conclusión definitiva."
 ca_central_america.112.a:0 "Nace la República Conservadora."
 ca_central_america.112.b:0 "La Hidra ha sido decapitada."

 # ==========================================
 # CAPÍTULO 5: EL SALVADOR
 # ==========================================
 ca_central_america.113.t:0 "El enemigo en casa"
 ca_central_america.113.d:0 "Milicias conservadoras y autonomistas han levantado barricadas en San Salvador. El Director Supremo mira por la ventana del palacio y comprende que la rebelión ya no está en Honduras ni en Nicaragua... está en su puerta."
 ca_central_america.113.a:0 "¡Proteged la capital a toda costa!"
 ca_central_america.113.b:0 "Evacuar a los funcionarios."

 ca_central_america.114.t:0 "La Leva Suprema"
 ca_central_america.114.d:0 "El ejército federal está agotado. Se decreta la «Leva Suprema»: todo hombre capaz de empuñar un fusil debe unirse al ejército. Los líderes locales exigen promesas políticas a cambio de combatir."
 ca_central_america.114.a:0 "Armar a los artesanos y campesinos."
 ca_central_america.114.b:0 "Solo confío en mis veteranos."

 ca_central_america.115.t:0 "El fin de la utopía"
 ca_central_america.115.d:0 "La batalla por El Salvador, el corazón mismo de la Federación, se ha decidido. La historia recordará este día para siempre."
 ca_central_america.115.a:0 "El exilio del Director Supremo..."
 ca_central_america.115.b:0 "¡La Federación aún vive!"

 # ==========================================
 # CAPÍTULO 6: LOS ALTOS
 # ==========================================

 ca_central_america.117.t:0 "La sombra de Carrera"
 ca_central_america.117.d:0 "Rafael Carrera no permitirá que le roben media Guatemala. Su temible «Ejército de la Montaña» marcha hacia Quetzaltenango. Los diplomáticos de Los Altos suplican fusiles, afirmando que «si Los Altos cae, todo el norte está perdido»."
 ca_central_america.117.a:0 "Desviar todas las armas disponibles al norte."
 ca_central_america.117.b:0 "Solo podemos ofrecerles asilo."

 ca_central_america.118.t:0 "Los mártires de Quetzaltenango"
 ca_central_america.118.d:0 "El conflicto por la independencia de Los Altos ha terminado. Las calles de Quetzaltenango son testigo del desenlace de esta lucha desesperada."
 ca_central_america.118.a:0 "Una masacre imperdonable..."
 ca_central_america.118.b:0 "¡El bastión del norte resiste!"
 ca_central_america.119.t:0 "La Federación en la encrucijada"
 ca_central_america.119.d:0 "1836. La República Federal de Centroamérica sobrevive, pero a duras penas. Los Estados resienten los impuestos y la autoridad de la capital federal, los conservadores conspiran en Guatemala y Honduras, y el proyecto liberal de Francisco Morazán pende de un hilo. El camino que elijamos ahora decidirá el destino del istmo."
 ca_central_america.119.f:0 "Cinco Estados, una bandera y ni una sola idea compartida de lo que debe ser la nación."
 ca_central_america.119.a:0 "Federalistas: respetar los derechos de los Estados."
 ca_central_america.119.b:0 "Centralistas: imponer la Unión por la fuerza."
 ca_central_america.119.c:0 "Esta Unión está condenada. Dirigiré un solo Estado."

 ca_central_america.120.t:0 "El grito del Sexto Estado"
 ca_central_america.120.d:0 "Quetzaltenango está en ebullición. Las élites criollas del altiplano occidental, cansadas de ser gobernadas desde Ciudad de Guatemala, exigen ser reconocidas como el Sexto Estado de la Federación: Los Altos. Si accedemos, Guatemala quedará dividida; si nos negamos, el altiplano podría alzarse por su cuenta."
 ca_central_america.120.f:0 "Las montañas de Los Altos nunca han obedecido a nadie por mucho tiempo."
 ca_central_america.120.a:0 "Llevar el asunto al Congreso Federal."
 ca_central_america.120.b:0 "Silenciar a los separatistas con mano firme."
 ca_central_america.120.c:0 "Que Guatemala resuelva su propia crisis."

 ca_central_america.121.t:0 "El peso de Guatemala"
 ca_central_america.121.d:0 "Guatemala, el Estado más grande y rico de la Federación, está plenamente bajo control federal. Su élite conservadora y su Iglesia resienten las reformas liberales, pero sus impuestos sostienen media República. El Congreso debe decidir hasta dónde se atreve a llegar."
 ca_central_america.121.f:0 "Quien gobierna Guatemala gobierna Centroamérica... o es devorado por ella."
 ca_central_america.121.a:0 "Imponer las reformas liberales, cueste lo que cueste."
 ca_central_america.121.b:0 "Mantener a las élites guatemaltecas de nuestro lado."
 ca_central_america.121.c:0 "El Congreso no logra ponerse de acuerdo."

 ca_central_america.122.b:0 "¡Reconquistar Los Altos!"
 
 
 
 ###########################
 ca_central_america.150.c:0 ""
 ca_central_america.1.b:0 "Censuraremos su prensa en la capital."
 ca_central_america.1.c:0 "No cederemos ante las quejas provinciales."
 ca_central_america.80.c:0 "Asumir el control de Honduras."
 ca_central_america.80.e:0 "Asumir el control de Costa Rica."
 ca_central_america.80.g:0 "Permanecer leal e intentar salvar la RFC."
 
 # Costa Rica cae ante los separatistas (84)
 
 # Nicaragua vence a los separatistas (86)
 ca_central_america.87.f:0 "Nicaragua se ha perdido sin remedio."

 # Caudillos (100)
 ca_central_america.100.t:0 "El ascenso del caudillo"
 ca_central_america.100.d:0 "La inestabilidad política ha dado lugar a un líder carismático que ha tomado el control local por la fuerza de las armas."
 ca_central_america.100.f:0 "Su lealtad es dudosa, pero su control sobre las milicias es absoluto."
 ca_central_america.100.a:0 "Nombrarlo jefe político y esperar lo mejor."
 ca_central_america.100.b:0 "Es un traidor. ¡Arrestadlo!"

 # Crisis y Economía (200 - 201)
 ca_central_america.200.t:0 "La fiebre del grano de oro"
 ca_central_america.200.d:0 "Las exportaciones de café han alcanzado niveles récord, atrayendo capital extranjero y llenando las arcas de la oligarquía."
 ca_central_america.200.a:0 "Fomentar la exportación."
 ca_central_america.200.b:0 "Gravar duramente las exportaciones."
 ca_central_america.201.t:0 "Caos financiero"
 ca_central_america.201.d:0 "La incapacidad de pagar nuestras deudas ha paralizado al gobierno. Los acreedores extranjeros exigen su dinero."
 ca_central_america.201.a:0 "Aplicar severas medidas de austeridad."
 ca_central_america.201.b:0 "Declarar formalmente la bancarrota."

 # Sociedad (300 - 302)
 ca_central_america.300.t:0 "La tierra tiembla"
 ca_central_america.300.d:0 "Un terremoto devastador ha reducido a escombros una de nuestras principales ciudades."
 ca_central_america.300.a:0 "Destinar fondos federales de emergencia."
 ca_central_america.300.b:0 "No hay fondos. Que los supervivientes se las arreglen solos."
 ca_central_america.301.t:0 "Campaña de alfabetización"
 ca_central_america.301.d:0 "La intelectualidad impulsa el establecimiento de una red de escuelas públicas laicas."
 ca_central_america.301.a:0 "La ignorancia es la madre de la tiranía."
 ca_central_america.301.b:0 "La Iglesia debe seguir guiando la moral."
 ca_central_america.302.t:0 "Levantamiento campesino"
 ca_central_america.302.d:0 "Las expropiaciones de tierras ejidales han agotado la paciencia de las comunidades indígenas y campesinas."
 ca_central_america.302.a:0 "Devolver algunas tierras comunales."
 ca_central_america.302.b:0 "Enviar al ejército a pacificar la región."

 # Diplomacia (400 - 402)
 ca_central_america.400.t:0 "Intereses extranjeros"
 ca_central_america.400.d:0 "Una potencia extranjera ofrece préstamos ventajosos a cambio de influencia sobre nuestro mercado."
 ca_central_america.400.a:0 "Aceptar su «generosa» ayuda."
 ca_central_america.400.b:0 "No seremos títeres de nadie."
 ca_central_america.401.t:0 "Incidentes fronterizos"
 ca_central_america.401.d:0 "Un país vecino ha movilizado tropas cerca de nuestra frontera."
 ca_central_america.401.a:0 "Enviar al ejército a defender nuestra soberanía."
 ca_central_america.401.b:0 "Buscar una solución diplomática pacífica."
 ca_central_america.402.t:0 "Reforma militar"
 ca_central_america.402.d:0 "Es hora de centralizar el mando y acabar con las milicias privadas de los caudillos."
 ca_central_america.402.a:0 "Establecer un Estado Mayor Federal."
 ca_central_america.402.b:0 "Los caudillos son un mal necesario."
 
 
 ###########Costarica events##########
 ca_costa_rica_events.1.t:0 "El dictador lejano"
 ca_costa_rica_events.1.d:0 "Llegan informes inquietantes de la periferia sur. Tras la sangrienta Guerra de la Liga de 1835, en la que Braulio Carrillo aplastó la oposición de Cartago, Alajuela y Heredia para centralizar el poder en San José, este ha roto por la fuerza los lazos con nuestros mandatos federales. Gobernando mediante decretos absolutos, Carrillo está moldeando Costa Rica según su propia visión de un Estado aislado. A medida que aumentan las tensiones políticas internas ante las próximas elecciones de 1837 para Jefe de Estado, figuras liberales y constitucionalistas —encabezadas por Manuel Aguilar Chacón y apoyadas por el Lic. Toribio Argüello— luchan por mantener la provincia alineada con los principios legales y federales. Si Carrillo neutraliza el movimiento de Aguilar, el estado podría separarse de la Unión para siempre."
 ca_costa_rica_events.1.f:0 "El control de la Federación se debilita en la periferia."
 ca_costa_rica_events.1.a:0 "Debemos restablecer la ley federal."
 ca_costa_rica_events.1.b:0 "Que gobierne sus montañas aisladas."
 ca_costa_rica_events.1.c:1 ""
# Eventos de introducción: Perspectiva del Estado Jugador (Local)
 ca_costa_rica_events.2.t:0 "Arquitecto del Estado"
 ca_costa_rica_events.2.d:0 "La República Federal no nos ha traído más que trastornos económicos y guerras civiles interminables. Apenas el año pasado, la sangrienta Guerra de la Liga (1835) desgarró nuestro estado por la sede de la capital, y solo terminó cuando Braulio Carrillo unificó la provincia bajo el dominio absoluto de San José. Ahora, mientras Costa Rica se acerca a las elecciones de 1837 para Jefe de Estado, nuestra dirigencia política está profundamente dividida. Manuel Aguilar Chacón, respaldado por Toribio Argüello y los constitucionalistas tradicionales, defiende la legalidad institucional y nuestros lazos con la región centroamericana. Mientras tanto, Carrillo aboga por una vía centralista y soberana que imponga el orden por decreto, rechazando la caótica Federación. Nuestra nación debe decidir su futuro en las urnas... o por la fuerza."
 ca_costa_rica_events.2.f:0 "Orden y progreso por la fuerza."
 ca_costa_rica_events.2.a:0 "Costa Rica se mantendrá sola y fuerte."
 ca_costa_rica_events.2.b:0 "Quizá la Federación todavía pueda salvarse..."
 ca_costa_rica_events.3:1 ""
 ca_costa_rica_events.3.t:1 "El cansancio del Arquitecto"
 ca_costa_rica_events.3.d:1 "Agotado por la Guerra de la Liga y por las interminables intrigas de Cartago, Heredia y Alajuela, Braulio Carrillo ha presentado su renuncia a la Asamblea. Muchos sospechan que es una maniobra para obligar a los diputados a renovarle su lealtad; otros creen que el hombre que construyó el Estado está de verdad cansado de cargarlo sobre sus hombros."
 ca_costa_rica_events.3.f:1 "«Yo no busqué el poder. El poder me buscó a mí, y no me suelta»."
 ca_costa_rica_events.3.a:1 "La Asamblea rechaza la renuncia."
 ca_costa_rica_events.3.b:1 "Aceptar la renuncia."
 ca_costa_rica_events.3.c:1 ""
 ca_costa_rica_events.4:1 ""
 ca_costa_rica_events.4.t:1 "El motín de la Villa"
 ca_costa_rica_events.4.d:1 "29 de junio de 1836. Manuel Quijano aguardaba emboscado en Los Ahogados mientras la infantería de la Villa de Guanacaste, hombres del lugar y nicaragüenses, se alzaba contra su comandante Antonio Elizondo, disparaba contra la caballería y capturaba a Enrique Cooper. Las autoridades leales se replegaron a Bagaces. Solo a las cuatro de la tarde salió a la luz la verdad: el temido invasor había traído apenas catorce hombres armados."
 ca_costa_rica_events.4.f:1 "El norte siempre ha mirado más hacia Nicaragua que hacia San José."
 ca_costa_rica_events.4.a:1 "¡Traición en el norte!"
 ca_costa_rica_events.4.b:1 ""
 ca_costa_rica_events.4.c:1 ""
 ca_costa_rica_events.5:1 ""
 ca_costa_rica_events.5.t:1 "El vacío de poder"
 ca_costa_rica_events.5.d:1 "Ausentes las autoridades leales, el alcalde segundo Juan Rafael Muñoz se ha proclamado jefe político, y se habla de entregar el cargo al nicaragüense Toribio Toruño. Detrás de ellos está la casa de don Pedro Muñoz, la más rica y la más nicaragüense de la villa. Al ver los pocos hombres que traía Quijano, los amotinados cambiaron de bando y lo expulsaron a tiros. Sin embargo, la autoridad de San José en el norte sigue en manos de los hombres que la traicionaron esa misma mañana."
 ca_costa_rica_events.5.f:1 "Donde el Estado no llega, manda el más fuerte."
 ca_costa_rica_events.5.a:1 "Que Villaseñor restablezca a las autoridades leales."
 ca_costa_rica_events.5.b:1 "Tolerar a Muñoz por ahora."
 ca_costa_rica_events.5.c:1 ""
 ca_costa_rica_events.6.t:1 "El saqueo de Bagaces"
 ca_costa_rica_events.6.d:1 "7 de julio de 1836. Los hombres de Quijano han saqueado Bagaces. El jefe político Rudesindo de la Guardia escapó con más de 3.300 pesos del tesoro, pero los estancos de tabaco y aguardiente del gobierno fueron saqueados. Nuestras tropas no pueden estar en todas partes: deben custodiar el dinero o proteger a la población."
 ca_costa_rica_events.6.f:1 "Un pueblo puede reconstruirse. La confianza en el gobierno, no tan fácilmente."
 ca_costa_rica_events.6.a:1 "Salvar el tesoro."
 ca_costa_rica_events.6.b:1 "Nuestra prioridad es salvar a los civiles."
 ca_costa_rica_events.6.c:1 ""
 ca_costa_rica_events.7:1 ""
 ca_costa_rica_events.7.t:1 "El desembarco en El Bolsón"
 ca_costa_rica_events.7.d:1 "Julio de 1836. La columna de Juan Belatín, zarpando desde Esparza, ha desembarcado en El Bolsón, en el golfo de Nicoya, y ha tomado a Quijano por la retaguardia. El invasor huye hacia la frontera con unas cuantas cajas de vino robadas como único botín."
 ca_costa_rica_events.7.f:1 "Los rebeldes vigilaban el camino. Nadie vigilaba el mar."
 ca_costa_rica_events.7.a:1 "¡Una maniobra brillante de Belatín!"
 ca_costa_rica_events.7.b:1 ""
 ca_costa_rica_events.7.c:1 ""
 ca_costa_rica_events.8:1 ""
 ca_costa_rica_events.8.t:1 "La oferta de Morazán"
 ca_costa_rica_events.8.d:1 "4 de agosto de 1836. La noticia de la invasión de Guanacaste ha llegado al gobierno federal. Morazán, que ya ha ordenado a Quijano deponer las armas, envía a San José como mediadores al exjefe de Estado Juan Mora Fernández y a Pedro Bermúdez."
 ca_costa_rica_events.8.f:1 "La Federación no puede apagar todos los incendios, pero al menos puede enviar a alguien a vigilar el humo."
 ca_costa_rica_events.8.a:1 "Enviar a Mora Fernández y Bermúdez como mediadores."
 ca_costa_rica_events.8.b:1 ""
 ca_costa_rica_events.8.c:1 ""
 ca_costa_rica_events.9.f:1 "Toda rebelión deja tras de sí una lista de nombres."
 ca_costa_rica_events.9.a:1 "Carrillo la lee en silencio."
 ca_costa_rica_events.9.b:1 ""
 ca_costa_rica_events.9.c:1 ""
 ca_costa_rica_events.10:1 ""
 ca_costa_rica_events.10.t:1 "Guanacaste, ciudad heroica"
 ca_costa_rica_events.10.d:1 "3 de septiembre de 1836. La Asamblea ha concedido a la Villa de Guanacaste el título de ciudad por haber rechazado a Quijano. Un gesto de gratitud... y un recordatorio de quién concede los títulos."
 ca_costa_rica_events.10.f:1 "La lealtad recompensada es lealtad que perdura."
 ca_costa_rica_events.10.a:1 "Un decreto para exaltar su valor."
 ca_costa_rica_events.10.b:1 ""
 ca_costa_rica_events.10.c:1 ""
 ca_costa_rica_events.11:1 ""
 ca_costa_rica_events.11.t:1 "La jugada maestra de Carrillo"
 ca_costa_rica_events.11.d:1 "El norte vuelve a estar tranquilo, y el Informe Jiménez reposa sobre el escritorio de Carrillo. Podría castigar a los hombres del 29 de junio y convertirlos en mártires. O podría hacer algo más astuto: ascender y condecorar a los oficiales de Guanacaste, para que León deje de confiar en ellos. Una amnistía silenciosa cerraría la herida sin espectáculo alguno."
 ca_costa_rica_events.11.f:1 "Ganar la guerra es fácil. Ganar la paz es el verdadero arte."
 ca_costa_rica_events.11.a:1 "Ascensos y honores para los leales."
 ca_costa_rica_events.11.b:1 "Ejecutar a los cabecillas."
 ca_costa_rica_events.11.c:1 "Una amnistía silenciosa."
 ca_costa_rica_events.12:1 ""
 ca_costa_rica_events.12.t:1 "Súbditos de la Corona en el Caribe"
 ca_costa_rica_events.12.d:1 "Febrero de 1836. Llegan informes de la costa caribeña: unos seiscientos o setecientos jamaicanos, súbditos de la Corona británica, se han asentado en torno a las lagunas de Bocas del Toro. Comercian con los pueblos locales y enarbolan la bandera británica sobre una costa que ningún gobierno hispanoamericano ha gobernado jamás de verdad."
 ca_costa_rica_events.12.f:1 "Donde hay un comerciante británico, un buque de guerra británico nunca anda lejos."
 ca_costa_rica_events.12.a:1 "Debemos vigilar esos asentamientos."
 ca_costa_rica_events.12.b:1 ""
 ca_costa_rica_events.12.c:1 ""
 ca_costa_rica_events.13:1 ""
 ca_costa_rica_events.13.t:1 "El título disputado de 1803"
 ca_costa_rica_events.13.d:1 "La Nueva Granada reclama Bocas del Toro en virtud de la Real Orden del 20 de noviembre de 1803, que colocó la Costa de Mosquitos bajo el Virreinato de Santa Fe. Nuestros juristas responden que la orden era militar y no territorial, y que el tratado del 15 de marzo de 1825 entre Colombia y Centroamérica congeló la posesión de cada república tal como estaba. En esa costa, dicen, la posesión era nuestra."
 ca_costa_rica_events.13.f:1 "Los viejos papeles españoles son las armas de las nuevas repúblicas."
 ca_costa_rica_events.13.a:1 "Nuestros derechos son innegables. Informad a la Federación."
 ca_costa_rica_events.13.b:1 "No podemos defender esa costa. Que se la quede la Nueva Granada."
 ca_costa_rica_events.13.c:1 ""
 ca_costa_rica_events.14:1 ""
 ca_costa_rica_events.14.t:1 "La expedición de Juan Galindo"
 ca_costa_rica_events.14.d:1 "30 de mayo de 1836. El gobierno federal proclama su jurisdicción sobre Bocas del Toro, decidido a frenar el avance británico por la costa. Confía la misión al coronel Juan Galindo, recién llegado de infructuosas negociaciones con Washington y Londres sobre Belice. Él se ofrece a izar la bandera federal sobre las lagunas antes de que la Nueva Granada pueda reaccionar."
 ca_costa_rica_events.14.f:1 "Galindo tiene más ambición que soldados, pero a veces la ambición basta."
 ca_costa_rica_events.14.a:1 "Financiar la expedición. ¡Por nuestra soberanía!"
 ca_costa_rica_events.14.b:1 "No tenemos fondos para aventuras en la selva."
 ca_costa_rica_events.14.c:1 ""
 ca_costa_rica_events.15:1 ""
 ca_costa_rica_events.15.t:1 "El Distrito Morazán"
 ca_costa_rica_events.15.d:1 "Galindo ha llegado a Bocas del Toro y ha organizado la costa como el Distrito Morazán de Costa Rica. Para gobernarlo ha dejado como jefe político a su propio padre, Filemón Galindo. Costa Rica tiene ahora un reclamo sobre las lagunas, y la Nueva Granada está furiosa."
 ca_costa_rica_events.15.f:1 "Una bandera clavada en la arena es un reclamo; defenderla es otro asunto."
 ca_costa_rica_events.15.a:1 "Una jugada audaz."
 ca_costa_rica_events.15.b:1 ""
 ca_costa_rica_events.15.c:1 ""
 ca_costa_rica_events.16:1 ""
 ca_costa_rica_events.16.t:1 "Velas granadinas"
 ca_costa_rica_events.16.d:1 "Diciembre de 1836. Los vigías de la costa avistan dos buques de guerra en el horizonte, que traen un destacamento de tropas granadinas y un nuevo jefe político para Bocas del Toro, Ildefonso de Paredes. Filemón Galindo no tiene soldados dignos de ese nombre."
 ca_costa_rica_events.16.f:1 "El mar trae las noticias antes que los correos."
 ca_costa_rica_events.16.a:1 "No tenemos con qué defender el distrito."
 ca_costa_rica_events.16.b:1 "Enviar refuerzos a Filemón Galindo."
 ca_costa_rica_events.16.c:1 ""
 ca_costa_rica_events.17:1 ""
 ca_costa_rica_events.17.t:1 "El clamor de Carrillo"
 ca_costa_rica_events.17.d:1 "19 de abril de 1837. San José conoce toda la historia: la Nueva Granada envió a Paredes a ocupar Bocas del Toro, y Galindo apenas escapó en un bote. Carrillo denuncia al gobierno federal, que ordenó la expedición y luego dejó a Costa Rica sola frente a la Nueva Granada. Exige que la Federación responda a la afrenta."
 ca_costa_rica_events.17.f:1 "«¿De qué sirve una Federación que no defiende a sus miembros?»"
 ca_costa_rica_events.17.a:1 "¡Exigimos acción inmediata de la Federación!"
 ca_costa_rica_events.17.b:1 ""
 ca_costa_rica_events.17.c:1 ""
 ca_costa_rica_events.18:1 ""
 ca_costa_rica_events.18.t:1 "El silencio de la Federación"
 ca_costa_rica_events.18.d:1 "Costa Rica exige que la Federación responda a la agresión de la Nueva Granada en Bocas del Toro. Pero el tesoro federal está vacío, el ejército está ocupado con las rebeliones del norte, y una guerra con la Nueva Granada podría acabar con la Unión."
 ca_costa_rica_events.18.f:1 "A veces el silencio es la respuesta más rotunda."
 ca_costa_rica_events.18.a:1 "Tenemos demasiados problemas en casa. Silencio."
 ca_costa_rica_events.18.b:1 "¡A las armas por Centroamérica!"
 ca_costa_rica_events.18.c:1 ""
 ca_costa_rica_events.19:1 ""
 ca_costa_rica_events.19.t:1 "Los electores de 1837"
 ca_costa_rica_events.19.d:1 "9 de abril de 1837. Los electores de segundo grado han votado. El período de Carrillo ha terminado, y San José lo respalda para la reelección. Cartago, Alajuela y Heredia, que aún recuerdan la Guerra de la Liga, apoyan al jurista Manuel Aguilar Chacón, el hombre que rechazó el cargo de Jefe de Estado en 1835. Un tercer nombre, Toribio Argüello, reúne un puñado de votos."
 ca_costa_rica_events.19.f:1 "Las urnas deciden, pero los cuarteles escuchan."
 ca_costa_rica_events.19.a:1 "Aguilar gana por veintidós votos contra diecisiete."
 ca_costa_rica_events.19.b:1 "Los electores se inclinan por Carrillo."
 ca_costa_rica_events.19.c:1 "El tercer hombre: Toribio Argüello."
 ca_costa_rica_events.20:1 ""
 ca_costa_rica_events.20.t:1 "El pronunciamiento de San José"
 ca_costa_rica_events.20.d:1 "27 de mayo de 1838. Las fuerzas de San José se han pronunciado contra el gobierno. A Manuel Aguilar se le han dado doce horas para abandonar la ciudad, y Braulio Carrillo vuelve a ser Jefe de Estado. El vicejefe de Estado Juan Mora Fernández lo llama por su nombre: una dictadura."
 ca_costa_rica_events.20.f:1 "El Arquitecto ha vuelto para terminar su edificio."
 ca_costa_rica_events.20.a:1 "Al exilio con Aguilar y Mora."
 ca_costa_rica_events.20.b:1 "Mantener a Juan Mora a nuestro lado, por legitimidad."
 ca_costa_rica_events.20.c:1 ""
 ca_costa_rica_events.21:1 ""
 ca_costa_rica_events.21.t:1 "La Ley de Bases y Garantías"
 ca_costa_rica_events.21.d:1 "8 de marzo de 1841. Carrillo ha promulgado el Decreto de Bases y Garantías. El Primer Jefe del Estado se vuelve inamovible y no responde ante nadie. Una Cámara Consultiva de cinco miembros, elegida por sufragio censitario en cuatro grados, y una Cámara Judicial nombrada por Carrillo sustituyen a los antiguos poderes. Se suprimen las municipalidades y el país se divide en cinco departamentos: San José, Cartago, Heredia, Alajuela y Guanacaste."
 ca_costa_rica_events.21.f:1 "Orden y progreso, les guste o no."
 ca_costa_rica_events.21.a:1 "El orden y el progreso exigen mano firme."
 ca_costa_rica_events.21.b:1 "Gobernar sin decreto."
 ca_costa_rica_events.21.c:1 ""
 ca_costa_rica_events.22:1 ""
 ca_costa_rica_events.22.t:1 "La primera elección directa"
 ca_costa_rica_events.22.d:1 "2 a 4 de junio de 1844. Por primera vez, los costarricenses han votado directamente por su Jefe de Estado. El terrateniente cartaginés Francisco María Oreamuno ha obtenido 1.541 votos, frente a 486 de Alfaro y 97 del viejo Juan Mora Fernández."
 ca_costa_rica_events.22.f:1 "Treinta nombres en la papeleta y un claro ganador."
 ca_costa_rica_events.22.a:1 "Oreamuno, por aplastante mayoría."
 ca_costa_rica_events.22.b:1 "Alfaro permanece en el cargo."
 ca_costa_rica_events.22.c:1 "Los electores se vuelcan hacia Juan Mora Fernández."
 ca_costa_rica_events.23:1 ""
 ca_costa_rica_events.23.t:1 "Los electores de 1847"
 ca_costa_rica_events.23.d:1 "11 de abril de 1847. Los electores de segundo grado han dado 99 votos a José María Castro Madriz, el joven doctor de Santo Tomás, frente a 52 de Alfaro. Con 29 años será el hombre más joven en dirigir Costa Rica, con Juan Rafael Mora Porras como vicepresidente."
 ca_costa_rica_events.23.f:1 "Un rector universitario en la silla presidencial."
 ca_costa_rica_events.23.a:1 "Castro Madriz, el presidente más joven."
 ca_costa_rica_events.23.b:1 "Alfaro permanece en el cargo."
 ca_costa_rica_events.23.c:1 "Apoyar al comerciante Manuel José Carazo."
 ca_costa_rica_events.24:1 ""
 ca_costa_rica_events.24.t:1 "Los electores de 1849"
 ca_costa_rica_events.24.d:1 "2 a 9 de diciembre de 1849. Tras diez días de interinato de Miguel Mora, los electores se han reunido. El magnate cafetalero Juan Rafael Mora Porras ha obtenido 49 votos, frente a 32 de Rafael Moya y 9 del viejo carrillista Manuel Antonio Bonilla."
 ca_costa_rica_events.24.f:1 "El café ha encontrado a su presidente."
 ca_costa_rica_events.24.a:1 "Juan Rafael Mora Porras."
 ca_costa_rica_events.24.b:1 "Rafael Moya."
 ca_costa_rica_events.24.c:1 "Manuel Antonio Bonilla."
 ca_costa_rica_events.25:1 ""
 ca_costa_rica_events.25.t:1 "La Universidad de Santo Tomás"
 ca_costa_rica_events.25.d:1 "3 de mayo de 1843. A instancias de su Ministro General, el joven doctor José María Castro Madriz, el jefe de Estado Alfaro ha promulgado el Decreto 11, que convierte la antigua Casa de Enseñanza de Santo Tomás, fundada por el obispo García Jerez en 1814, en universidad. Será la primera del país."
 ca_costa_rica_events.25.f:1 "Una república del café necesita abogados, y los abogados necesitan una universidad."
 ca_costa_rica_events.25.a:1 "Fundar la Universidad."
 ca_costa_rica_events.25.b:1 "El tesoro aún no puede pagar profesores."
 ca_costa_rica_events.25.c:1 ""
 ca_costa_rica_events.26:1 ""
 ca_costa_rica_events.26.t:1 "El Monarch de Le Lacheur"
 ca_costa_rica_events.26.d:1 "1843. William Le Lacheur, un capitán de Guernsey, ha fondeado el Monarch en Puntarenas. Hasta ahora nuestro café solo llegaba a Inglaterra a través de Valparaíso, reensacado como «Café Chileno». Le Lacheur ofrece llevarlo directamente a Londres y pagar a los productores a crédito a su regreso."
 ca_costa_rica_events.26.f:1 "El camino a Londres ya no pasa por Chile."
 ca_costa_rica_events.26.a:1 "Cargad el Monarch. ¡A Londres!"
 ca_costa_rica_events.26.b:1 "Seguir vendiendo a través de Valparaíso."
 ca_costa_rica_events.26.c:1 ""
 ca_costa_rica_events.27:1 ""
 ca_costa_rica_events.27.t:1 "La Constitución de 1844"
 ca_costa_rica_events.27.d:1 "9 de abril de 1844. La Asamblea Constituyente ha dado al Estado Libre de Costa Rica una nueva constitución, que sustituye a la Ley Fundamental de 1825. Por primera vez, el Jefe de Estado será elegido por el voto directo de los ciudadanos."
 ca_costa_rica_events.27.f:1 "El pueblo votará, siempre que posea algo."
 ca_costa_rica_events.27.a:1 "Proclamar la nueva constitución."
 ca_costa_rica_events.27.b:1 "Mantener la Ley Fundamental de 1825."
 ca_costa_rica_events.27.c:1 ""
