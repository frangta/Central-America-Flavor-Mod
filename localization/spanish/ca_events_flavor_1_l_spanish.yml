 ca_central_america.35.d:0 "El gobierno federal ha autorizado una campaña militar para restablecer el orden constitucional en Costa Rica."

 ca_central_america.36.d:0 "Las tropas federales se movilizan hacia Honduras para apoyar a los elementos leales y aplastar la rebelión."

 ca_central_america.37.d:0 "Se ha dado luz verde para pacificar Nicaragua y deponer por la fuerza a las autoridades separatistas."

 ca_central_america.38.d:0 "El ejército federal tomará el control directo de la seguridad en el estado de El Salvador para evitar más anarquía."

 ca_central_america.39.d:0 "Pese a las tensiones pasadas, el ejército federal intervendrá para proteger al estado de Guatemala de la revuelta campesina."

 ca_central_america.40.d:0 "Las tensiones aumentan en todos los estados miembros."
 

