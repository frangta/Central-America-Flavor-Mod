 #Centro American Flavor
 
 ca_central_america.1.t:0 "¿Un Sexto Estado para Los Altos?"
 ca_central_america.1.d:0 "Un periódico de Quetzaltenango ha propuesto que los departamentos de Quetzaltenango, Totonicapán, Sololá y Suchitepéquez se separen de Guatemala y formen un nuevo Estado de la Federación. Con unos doscientos mil habitantes, argumentan sus notables, el altiplano gozaría de mayor libertad de acción y de una representación más justa ante el gobierno federal, en lugar de ser gobernado desde Ciudad de Guatemala."
 ca_central_america.1.f:0 "«Los Altos pagan sus impuestos a Guatemala y no reciben a cambio más que órdenes»."
 ca_central_america.1.a:0 "El pueblo de Los Altos tiene derecho a ser escuchado."
 culture_central_america.1.t:0 "Fundamentos nacionales"
 culture_central_america.1.d:0 "Un despertar nacional en nuestro país ha llevado al surgimiento de una identidad [SCOPE.sCulture('new_ca_national_culture').GetName] propia entre los nacionalistas más destacados."
 culture_central_america.1.f:0 "«¡Nuestro grito sagrado es nuestro y solo nuestro! ¡Oíd el sonido de las cadenas rotas, y ved un templo sagrado erigido a la ley, la paz y la unión! ¡Qué azul es el cielo, qué gloriosa es la patria!»"
 culture_central_america.1.a:0 "¡Ya no somos [SCOPE.sCulture('old_central_american_culture').GetName]: ahora somos el pueblo [SCOPE.sCulture('new_ca_national_culture').GetName]!"
 culture_central_america.1.b:0 "¡Somos los herederos de un ideal mayor!"
 culture_central_america.2.t:0 "Valores nacionales"
 culture_central_america.2.d:0 "Una oleada de personas en las regiones vecinas a [SCOPE.sState('central_american_culture_state').GetName] ha comenzado a abrazar su nueva identidad [SCOPE.sCulture('new_ca_national_culture').GetName]."
 culture_central_america.2.f:0 "«¿Qué tierra majestuosa es esta, que alberga a un pueblo tan hermoso? ¡Nación amada, tierra amada, te pertenezco!»\n\nLa multitud aplaudió cortésmente la prosa recargada del poeta. Aunque sus palabras eran... floridas, el sentimiento se agradecía igualmente."
 culture_central_america.2.a:0 "¡Bienvenidos a la nación [SCOPE.sCulture('new_ca_national_culture').GetName]!"
 culture_central_america.3.t:0 "La nación [SCOPE.sCulture('new_ca_national_culture').GetName]"
 culture_central_america.3.d:0 "Desde todos los rincones del país, la gente habla de su patria [SCOPE.sCulture('new_ca_national_culture').GetName]. La identidad [SCOPE.sCulture('old_ca_national_culture').GetName] ya no existe."
 culture_central_america.3.f:0 "La bandera ondeaba en la plaza central mientras una procesión desfilaba a su alrededor, con trompetas resonando y tambores batiendo al unísono. «¡Que el sol renuncie a su luz antes de que rompamos el voto solemne que hicimos a nuestra patria!», rugió la multitud, con más sinceridad que nunca."
 culture_central_america.3.a:0 "¡Gloria al pueblo [SCOPE.sCulture('new_ca_national_culture').GetName]!"
 culture_central_america.4.t:0 "Una nación propia"
 culture_central_america.4.d:0 "El legado de la independencia de nuestra nación respecto de España ha impulsado el inicio de una identidad nacional desarrollada. Han comenzado los choques entre la visión de [ROOT.GetCountry.GetName] como nación única e independiente y el sueño de una América Latina indivisible."
 culture_central_america.4.f:0 "Durante siglos, las armas habían disparado, primero contra quienes resistían la conquista y luego contra quienes buscaban encadenar la nación a su antiguo amo. Una paz informal llegó con la huida de los ejércitos españoles, pero las armas nunca se detuvieron de verdad. Siguen al hombro, apuntando hacia dentro y hacia fuera, esperando el fin de esta confusión momentánea y un único blanco que perseguir."
 culture_central_america.4.a:0 "Nuestra patria da otro paso hacia la libertad."
 culture_central_america.4.b:0 "No somos más que una nación entre muchas."
