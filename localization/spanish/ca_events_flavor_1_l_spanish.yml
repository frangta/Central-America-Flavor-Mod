 ca_central_america_falls_apart:2 "Disolución centroamericana"
 ca_central_america_falls_apart_reason:0 "Los estados centroamericanos claman por la independencia. ¿Se la concederemos? Pronto nos darán un ultimátum."
 ca_central_america.2.t:1 "El Congreso Federal vota sobre Los Altos"
 ca_central_america.2.d:1 "La petición del altiplano occidental ha llegado al Congreso Federal. Los diputados de Quetzaltenango piden que Los Altos sea admitido como Sexto Estado de la Federación. La delegación de Guatemala lo llama una amputación; los liberales ven en él un aliado leal contra los conservadores de la capital. La votación no puede aplazarse para siempre."
 ca_central_america.2.f:1 "«Una República de seis Estados no es más débil que una de cinco, si los seis son leales»."
 ca_central_america.2.a:1 "Aprobar el Sexto Estado."
 ca_central_america.2.b:1 "Rechazar la petición: Guatemala permanece íntegra."
 ca_central_america.3.t:0 "El Estado de Los Altos"
 ca_central_america.3.d:0 "La Cámara de Diputados ha aprobado la creación del Estado de Los Altos. Quetzaltenango lo celebra con campanas y cohetes: el altiplano tiene ahora su propio gobierno, su propia asamblea y su propio escaño en la Federación. En Ciudad de Guatemala, los conservadores hablan de traición."
 ca_central_america.3.f:0 "«¡Viva el Sexto Estado!»"
 ca_central_america.3.a:0 "¡Viva el Sexto Estado!"
 ca_central_america.3.b:0 "Dirigiré Los Altos yo mismo."
 ca_central_america_capital_tt:0 "Cuando Centroamérica se disuelva, jugarás con el país que corresponda a tu estado capital. Puedes cambiar tu capital nacional desde la Lente Política."
 ca_central_america_breakup_status:0 "Los estados centroamericanos con gran agitación pueden separarse"
 #ca_central_america.2.t: "The fragility of Central America"
 #ca_central_america.2.d: "After the civil war, the liberals led by [SCOPE.sCharacter('ruler_scope').GetFullName],won the popular vote in the presidential election of 1830. outcome in the liberals having consolidated their power thanks to the president [SCOPE.sCharacter('ruler_scope').GetFullName]"
 #ca_central_america.2.f: "During the late 1833 presidential election, the electoral college elected Valle as Central America's next president. Valle defeated Morazán as many voters and politicians opposed Morazán's use of military force to settle disputes between [GetInterestGroupVariant('ig_intelligentsia',GetPlayer) and [GetInterestGroupVariant('ig_landowners',GetPlayer), and saw Valle as a moderate who could offer peace,The possible dissolution of [ROOT.GetCountry.GetName] and a civil war is imminent"
 ca_central_america.4.t:0 "Los Altos se levantan"
 ca_central_america.4.d:0 "La Federación se negó a reconocer a Los Altos, y el altiplano ha respondido con fusiles. Los notables criollos de Quetzaltenango han proclamado su propio gobierno, levantado milicias y tomado los departamentos occidentales de Guatemala. La autoridad federal en la región ha dejado simplemente de existir."
 ca_central_america.4.f:0 "Lo que el Congreso no quiso conceder, Quetzaltenango lo ha tomado."
 ca_central_america.4.a:0 "Aceptar el hecho consumado."
 ca_central_america.4.b:0 "¡Los Altos pertenecen a Guatemala y a la Unión!"

 # --- Dissolution and Reforms (Events 13-14) ---
 ca_central_america.13.t:0 "La disolución de Centroamérica"
 ca_central_america.13.d:0 "El sueño de Francisco Morazán se desvanece en la bruma. Las amargas rivalidades locales, el aislamiento geográfico y el profundo resentimiento contra la hegemonía guatemalteca han vuelto insostenible el pacto federal. El Congreso ha emitido un decreto que declara a los estados libres de organizarse como mejor les parezca: una sentencia de muerte para la Unión."
 ca_central_america.13.f:0 "Patria Grande, descansa en paz."
 ca_central_america.13.a:0 "Que cada Estado siga su propio camino"
 ca_central_america.13.b:0 "¡Jamás! Lucharemos hasta el último hombre por la Unión"


