 ca_setup_events.2.t:0 "La fragilidad de Centroamérica"
 ca_setup_events.2.d:0 "Tras la guerra civil, los liberales encabezados por [SCOPE.sCharacter('ruler_scope').GetFullName] ganaron el voto popular en la elección presidencial de 1830. Como resultado, los liberales consolidaron su poder gracias al presidente [SCOPE.sCharacter('ruler_scope').GetFullName]."
 ca_setup_events.2.f:0 "En la elección presidencial de finales de 1833, el colegio electoral eligió a Valle como próximo presidente de Centroamérica. Valle derrotó a Morazán porque muchos votantes y políticos se oponían al uso de la fuerza militar por parte de Morazán para resolver las disputas entre [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] y [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName], y veían en Valle a un moderado capaz de ofrecer la paz. La posible disolución de [ROOT.GetCountry.GetName] y una guerra civil son inminentes."
