 # ==========================================
 # El Salvador Electoral Events
 # ==========================================
 ca_el_salvador_events.9.t:0 "La salida de Vigil y el ascenso de Menéndez"
 ca_el_salvador_events.9.d:0 "Diego Vigil ha dejado el gobierno del Estado, y Timoteo Menéndez ha asumido como jefe de Estado interino, un liberal moderado aceptable para la Federación. Se enfrenta a una presión inmensa tanto de los oficiales morazanistas radicales como de los intrigantes conservadores que buscan alterar el equilibrio de poder."
 ca_el_salvador_events.9.a:0 "Timoteo Menéndez asume el cargo como moderado."
 ca_el_salvador_events.9.b:0 "Oficiales radicales pro-Morazán exigen el control total."
 ca_el_salvador_events.9.c:0 "Los conservadores intentan un golpe político."

 ca_el_salvador_events.10.t:0 "La elección de Juan José Guzmán"
 ca_el_salvador_events.10.d:0 "El Salvador celebra una elección ordinaria conforme a la Constitución de 1841. Juan José Guzmán busca construir un consenso para estabilizar el estado, pero las facciones puristas de todos los bandos se resisten a transigir con sus ideales."
 ca_el_salvador_events.10.a:0 "Juan José Guzmán busca la estabilidad mediante el consenso."
 ca_el_salvador_events.10.b:0 "Los liberales puros rechazan el consenso."
 ca_el_salvador_events.10.c:0 "Se produce una intervención militar preventiva."


 ca_el_salvador_events.12.t:0 "La caída de Malespín y Eugenio Aguilar"
 ca_el_salvador_events.12.d:0 "La dictadura de Malespín ha caído por fin. Eugenio Aguilar da un paso al frente para restaurar un gobierno civil liberal, pero los restos del antiguo régimen intentan sabotear la transición."
 ca_el_salvador_events.12.a:0 "Eugenio Aguilar restaura el gobierno civil liberal."
 ca_el_salvador_events.12.b:0 "Los leales a Malespín sabotean las elecciones."

 ca_el_salvador_events.13.t:0 "Doroteo Vasconcelos y los tambores de guerra"
 ca_el_salvador_events.13.d:0 "Doroteo Vasconcelos ha sido elegido a lomos de una ola de sentimiento antiguatemalteco. Está movilizando rápidamente al ejército y preparándose para un gran conflicto contra las fuerzas de Rafael Carrera en Guatemala."
 ca_el_salvador_events.13.a:0 "Vasconcelos se prepara para la guerra contra Guatemala."
 ca_el_salvador_events.13.b:0 "Los moderados logran frenar la retórica belicista."

 # ==========================================
 # Guatemala Events
 # ==========================================



 ca_guatemala_events.6.t:0 "Ratificación institucional"
 ca_guatemala_events.6.d:0 "El polvo empieza a asentarse. La asamblea debe decidir si ratifica formalmente a Mariano Rivera Paz como jefe de Estado, consolidando el gobierno conservador sobre Guatemala."
 ca_guatemala_events.6.a:0 "Mariano Rivera Paz es ratificado."
 ca_guatemala_events.6.b:0 "La oposición liberal intenta recuperar la asamblea."

 ca_guatemala_events.7.t:0 "El ascenso oficial de Rafael Carrera"
 ca_guatemala_events.7.d:0 "El analfabeto pero brillantemente carismático comandante Rafael Carrera se ha convertido en el hombre fuerte indiscutible de Guatemala. Ha llegado el momento de oficializar su poder."
 ca_guatemala_events.7.a:0 "Rafael Carrera es elegido Jefe de Estado."
 ca_guatemala_events.7.b:0 "La élite conservadora intenta mantener a un líder civil."

 ca_guatemala_events.8.t:0 "La renuncia de Carrera y el caos sucesorio"
 ca_guatemala_events.8.d:0 "En un movimiento sorprendente, Rafael Carrera se ha retirado temporalmente, dejando un vacío de poder en Guatemala. El caos político resultante ve a diversas facciones disputarse el control del estado."
 ca_guatemala_events.8.a:0 "Juan Antonio Martínez es elegido."
 ca_guatemala_events.8.b:0 "El general Mariano Paredes toma el control."
 ca_guatemala_events.8.c:0 "Los liberales aprovechan el exilio de Carrera."

 # ==========================================
 # Honduras Events
 # ==========================================

 ca_honduras_events.14.t:0 "La elección de Justo José de Herrera"
 ca_honduras_events.14.d:0 "El clima político de Honduras exige tacto. Justo José de Herrera ha surgido como un candidato civil moderado capaz de tender puentes entre las facciones enfrentadas."
 ca_honduras_events.14.a:0 "Herrera asume el cargo como civil moderado."
 ca_honduras_events.14.b:0 "Los militares exigen un hombre de armas."
 ca_honduras_events.14.c:0 "Los liberales radicales intentan tomar la Asamblea."

 ca_honduras_events.15.t:0 "El ascenso del general Francisco Ferrera"
 ca_honduras_events.15.d:0 "El general Francisco Ferrera, conocido como «el Mulatillo», ha consolidado su control sobre el estado hondureño, orientando su lealtad hacia una vía militarista y conservadora."
 ca_honduras_events.15.a:0 "Ferrera consolida el estado conservador."
 ca_honduras_events.15.b:0 "Se alza contra él la resistencia civil liberal."

 ca_honduras_events.16.t:0 "La sucesión de Ferrera"
 ca_honduras_events.16.d:0 "El segundo período de Ferrera termina y no puede ser reelegido otra vez, pero aún manda el ejército. Quiere un sucesor leal en la presidencia, mientras sectores de la élite terrateniente y de las clases medias urbanas se cansan de su gobierno militar."
 ca_honduras_events.16.a:0 "El hombre de Ferrera, Coronado Chávez, es elegido; Ferrera conserva el ejército."
 ca_honduras_events.16.b:0 "Los terratenientes se cansan del militarismo."
 ca_honduras_events.16.c:0 "¡Un levantamiento urbano contra la dictadura!"

 ca_honduras_events.17.t:0 "El triunfo de Juan Lindo"
 ca_honduras_events.17.d:0 "El estadista Juan Lindo ha llegado al poder en Honduras, prometiendo restaurar las instituciones civiles, fomentar la educación y frenar la influencia de los caudillos."
 ca_honduras_events.17.a:0 "Lindo promete educación e institucionalidad."
 ca_honduras_events.17.b:0 "Ferrera intenta sabotear a Lindo desde las sombras."

 ca_honduras_events.18.t:0 "La Constitución de 1848"
 ca_honduras_events.18.d:0 "Se ha redactado en Honduras una nueva constitución para consolidar un gobierno civil y limitar el poder de los caudillos militares. Su ratificación pondrá a prueba la lealtad última de las fuerzas armadas."
 ca_honduras_events.18.a:0 "Lindo es ratificado bajo la nueva constitución civil."
 ca_honduras_events.18.b:0 "Los militares se rebelan contra la nueva constitución."

 # ==========================================
 # Nicaragua Events
 # ==========================================
 ca_nicaragua_events.01.t:0 "El estado dividido"
 ca_nicaragua_events.01.d:0 "Nicaragua está desgarrada por una feroz y sangrienta rivalidad entre la ciudad liberal de León y el baluarte conservador de Granada. Este conflicto interno define la política nicaragüense por encima de todo."
 ca_nicaragua_events.01.f:0 "Una casa dividida contra sí misma no puede sostenerse."
 ca_nicaragua_events.01.a:0 "Debemos sortear esta amarga rivalidad."



 ca_nicaragua_events.19.t:0 "José Núñez y el fin de la Federación"
 ca_nicaragua_events.19.d:0 "Mientras la República Federal se tambalea, José Núñez da un paso al frente en Nicaragua. Navegando las traicioneras aguas entre León y Granada, se prepara para conducir a Nicaragua hacia la plena soberanía."
 ca_nicaragua_events.19.a:0 "José Núñez asume el poder como moderado leonés."
 ca_nicaragua_events.19.b:0 "Los conservadores de Granada imponen su fuerza."

 ca_nicaragua_events.20.t:0 "Las primeras elecciones constitucionales"
 ca_nicaragua_events.20.d:0 "Con Nicaragua constituyéndose como nación independiente, se celebran las primeras elecciones constitucionales. Patricio Rivas, un conservador de Granada, emerge como figura principal."
 ca_nicaragua_events.20.a:0 "Patricio Rivas, de Granada, se proclama vencedor."
 ca_nicaragua_events.20.b:0 "Los leoneses rechazan la autoridad de Rivas."

 ca_nicaragua_events.21.t:0 "Pablo Buitrago y el regreso liberal"
 ca_nicaragua_events.21.d:0 "El péndulo político vuelve a oscilar hacia León con el ascenso de Pablo Buitrago al poder, señal del resurgir del dominio liberal en Nicaragua."
 ca_nicaragua_events.21.a:0 "Pablo Buitrago asume el poder por León."
 ca_nicaragua_events.21.b:0 "Granada lanza un boicot político."

 ca_nicaragua_events.22.t:0 "La presidencia de Manuel Pérez"
 ca_nicaragua_events.22.d:0 "Manuel Pérez toma las riendas del estado en un intento de estabilizar la volátil nación, pero los ambiciosos caudillos militares siguen siendo una amenaza constante para el gobierno civil."
 ca_nicaragua_events.22.a:0 "Manuel Pérez asume el poder."
 ca_nicaragua_events.22.b:0 "Los caudillos militares exigen el control."

 ca_nicaragua_events.23.t:0 "Las ruinas de León y José León Sandoval"
 ca_nicaragua_events.23.d:0 "Tras un brutal saqueo militar de León, el conservador José León Sandoval es elevado al poder, dejando a las facciones liberales devastadas y sedientas de venganza."
 ca_nicaragua_events.23.a:0 "El conservador Sandoval asume el mando."
 ca_nicaragua_events.23.b:0 "Los supervivientes de León inician la resistencia armada."

 ca_nicaragua_events.24.t:0 "José María Guerrero y la amenaza británica"
 ca_nicaragua_events.24.d:0 "José María Guerrero de Arcos asume el cargo en medio de una grave crisis diplomática. El Imperio británico extiende su influencia sobre la Costa de Mosquitos, amenazando directamente la integridad territorial de Nicaragua."
 ca_nicaragua_events.24.a:0 "Guerrero asume el cargo entre tensiones por la Mosquitia."
 ca_nicaragua_events.24.b:0 "Los liberales aprovechan la debilidad diplomática."

 ca_nicaragua_events.25.t:0 "Norberto Ramírez y los tratados del canal"
 ca_nicaragua_events.25.d:0 "Norberto Ramírez busca asegurar el futuro de Nicaragua negociando tratados con potencias extranjeras para la construcción de un canal interoceánico. Esta medida, sin embargo, despierta la ira de los nacionalistas radicales."
 ca_nicaragua_events.25.a:0 "Ramírez inicia tratados del canal con potencias extranjeras."
 ca_nicaragua_events.25.b:0 "Los radicales rechazan los pactos extranjeros."


