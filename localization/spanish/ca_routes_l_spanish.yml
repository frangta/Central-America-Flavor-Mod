l_spanish:
 # CAFM - F11 - Rutas federal y centralista
 ca_federalist_events.1.t:0 "El Pacto Federal"
 ca_federalist_events.1.d:0 "La Federación necesita aliados para sobrevivir a la tormenta que se avecina. Cada uno de los grandes intereses de la República ofrece su apoyo, a cambio de un precio."
 ca_federalist_events.1.f:0 "«La Unión es un contrato, y todo contrato tiene sus cláusulas.»"
 ca_federalist_events.1.a:0 "Apoyarse en la intelectualidad liberal."
 ca_federalist_events.1.b:0 "Tranquilizar a los terratenientes de los Estados."
 ca_federalist_events.1.c:0 "Confiar en el ejército federal."
 ca_federalist_events.2.t:0 "La Constitución en juego"
 ca_federalist_events.2.d:0 "Los Estados se van y el Congreso les ha abierto la puerta. La Constitución federal de 1824 debe ser defendida, reformada o abandonada."
 ca_federalist_events.2.f:0 "«Una constitución que nadie obedece es solo papel.»"
 ca_federalist_events.2.a:0 "Defenderla por la fuerza de las armas."
 ca_federalist_events.2.b:0 "Reformarla: dar más autonomía a los Estados."
 ca_federalist_events.2.c:0 "Aceptar lo que no se puede cambiar."
 ca_federalist_events.3.t:0 "[SCOPE.sCharacter('ca_general').GetFullName] defiende la Federación"
 ca_federalist_events.3.d:0 "Ha llegado la guerra. [SCOPE.sCharacter('ca_general').GetFullName] se ofrece a dirigir el ejército federal contra los Estados rebeldes, pero pide el mando pleno y los medios para vencer."
 ca_federalist_events.3.f:0 "«Denme soldados y les daré una República.»"
 ca_federalist_events.3.a:0 "Dar al general el mando pleno."
 ca_federalist_events.3.b:0 "Mantener el ejército bajo control civil."
 ca_federalist_events.4.t:0 "La resistencia federal"
 ca_federalist_events.4.d:0 "La Federación ha sobrevivido a la guerra, pero sus enemigos están en todas partes: cónsules británicos, agentes mexicanos, curas enojados y coroneles ambiciosos. El gobierno debe elegir dónde mantenerse firme."
 ca_federalist_events.4.f:0 "«No podemos ser fuertes en todas partes.»"
 ca_federalist_events.4.a:0 "Concentrarse en el frente más peligroso."
 ca_federalist_events.4.b:0 "Movilizar a toda la República."
 ca_federalist_events.5.t:0 "La República restaurada"
 ca_federalist_events.5.d:0 "Contra todo pronóstico, la República Federal de Centroamérica ha sobrevivido a sus años más oscuros. Las campanas repican en San Salvador y Guatemala, y los cinco volcanes vuelven a ondear sobre todo el istmo."
 ca_federalist_events.5.f:0 "«¡Dios, Unión y Libertad!»"
 ca_federalist_events.5.a:0 "Celebrar la República."
 ca_federalist_events.5.b:0 "Recompensar a los Estados leales."
 ca_federalist_events.6.t:0 "Los maestros llegan a los pueblos"
 ca_federalist_events.6.d:0 "Jóvenes maestros formados en la capital llegan a los pueblos para abrir las nuevas escuelas laicas. Donde los reciben bien, la reforma avanza rápido."
 ca_federalist_events.6.f:0 "«Las leyes se hacen en la capital, pero se obedecen en las provincias.»"
 ca_federalist_events.6.a:0 "Pagarles bien y protegerlos."
 ca_federalist_events.6.b:0 "Que los pueblos paguen sus escuelas."
 ca_federalist_events.7.t:0 "¿Escuela o catecismo?"
 ca_federalist_events.7.d:0 "Los obispos exigen que las nuevas escuelas sigan enseñando el catecismo. Los liberales responden que la República debe educar ciudadanos, no feligreses."
 ca_federalist_events.7.f:0 "«Las leyes se hacen en la capital, pero se obedecen en las provincias.»"
 ca_federalist_events.7.a:0 "Nada de catecismo en la escuela pública."
 ca_federalist_events.7.b:0 "Un término medio: religión los domingos."
 ca_federalist_events.8.t:0 "Los púlpitos contra la escuela"
 ca_federalist_events.8.d:0 "Desde todos los púlpitos los curas predican contra las escuelas sin Dios. Los padres dejan a sus hijos en casa y la reforma se ha estancado."
 ca_federalist_events.8.f:0 "«Las leyes se hacen en la capital, pero se obedecen en las provincias.»"
 ca_federalist_events.8.a:0 "Cerrar las parroquias más rebeldes."
 ca_federalist_events.8.b:0 "Esperar tiempos más tranquilos."
 ca_federalist_events.9.t:0 "El Registro Civil"
 ca_federalist_events.9.d:0 "Los nacimientos, matrimonios y defunciones ya no los registrará el cura párroco sino el Estado. Los liberales quieren ir más lejos y reconocer el matrimonio civil."
 ca_federalist_events.9.f:0 "«Las leyes se hacen en la capital, pero se obedecen en las provincias.»"
 ca_federalist_events.9.a:0 "Introducir el matrimonio civil."
 ca_federalist_events.9.b:0 "Basta con el registro."
 ca_federalist_events.10.t:0 "¿Desterrar al prelado rebelde?"
 ca_federalist_events.10.d:0 "El arzobispo ha excomulgado a las autoridades federales. Algunos ministros quieren expulsarlo del país, como se hizo en 1829."
 ca_federalist_events.10.f:0 "«Las leyes se hacen en la capital, pero se obedecen en las provincias.»"
 ca_federalist_events.10.a:0 "Desterrarlo."
 ca_federalist_events.10.b:0 "Negociar con la Iglesia."
 ca_federalist_events.11.t:0 "La epidemia como castigo divino"
 ca_federalist_events.11.d:0 "Los fieles dicen que la epidemia es el castigo de Dios por la impiedad del gobierno. La separación de la Iglesia y el Estado ha perdido todo apoyo popular."
 ca_federalist_events.11.f:0 "«Las leyes se hacen en la capital, pero se obedecen en las provincias.»"
 ca_federalist_events.11.a:0 "Enviar médicos, no curas."
 ca_federalist_events.11.b:0 "Permitir las procesiones."
 ca_federalist_events.12.t:0 "Cabildos abiertos"
 ca_federalist_events.12.d:0 "En los pueblos de la República los ciudadanos se reúnen en cabildo abierto para elegir a sus autoridades. La reforma municipal es popular dondequiera que llega."
 ca_federalist_events.12.f:0 "«Las leyes se hacen en la capital, pero se obedecen en las provincias.»"
 ca_federalist_events.12.a:0 "Extender los cabildos abiertos."
 ca_federalist_events.12.b:0 "Mantenerlos bajo los jefes políticos."
 ca_federalist_events.13.t:0 "¿Un Senado de los Estados?"
 ca_federalist_events.13.d:0 "Los diputados de los Estados pequeños exigen un Senado donde cada Estado tenga la misma voz, o una capital que rote entre ellos."
 ca_federalist_events.13.f:0 "«Las leyes se hacen en la capital, pero se obedecen en las provincias.»"
 ca_federalist_events.13.a:0 "Un Senado de los Estados."
 ca_federalist_events.13.b:0 "Una capital rotativa."
 ca_federalist_events.14.t:0 "[SCOPE.sState('ca_weak_state').GetName] se resiste"
 ca_federalist_events.14.d:0 "Las autoridades de [SCOPE.sState('ca_weak_state').GetName] se niegan a aplicar la reforma municipal. Dicen que es una orden más de una capital en la que ya no confían."
 ca_federalist_events.14.f:0 "«Las leyes se hacen en la capital, pero se obedecen en las provincias.»"
 ca_federalist_events.14.a:0 "Insistir en la reforma."
 ca_federalist_events.14.b:0 "Dejar que conserven sus viejos concejos."
 ca_federalist_events.15.t:0 "Una concesión extranjera pide tierras"
 ca_federalist_events.15.d:0 "Una compañía extranjera ofrece colonizar las tierras vacías de la costa caribe, con caminos y colonos, a cambio de una enorme concesión."
 ca_federalist_events.15.f:0 "«El progreso tiene un precio.»"
 ca_federalist_events.15.a:0 "Otorgar la concesión."
 ca_federalist_events.15.b:0 "La tierra de la República no está en venta."
 ca_federalist_events.16.t:0 "No alcanzan las rentas federales"
 ca_federalist_events.16.d:0 "Los Estados se quedan con los estancos del tabaco y el aguardiente, y el tesoro federal no puede pagar al ejército ni a los funcionarios."
 ca_federalist_events.16.f:0 "«Una República sin dinero es una República sin soldados.»"
 ca_federalist_events.16.a:0 "Pedir prestado a los comerciantes."
 ca_federalist_events.16.b:0 "Recortar los sueldos de los funcionarios."
 ca_federalist_events.17.t:0 "Un Congreso sin quórum"
 ca_federalist_events.17.d:0 "Tantos diputados se han ido a casa que el Congreso federal no puede reunirse. Las leyes de la República esperan una votación que nunca llega."
 ca_federalist_events.17.f:0 "«Los escaños vacíos hablan más fuerte que cualquier discurso.»"
 ca_federalist_events.17.a:0 "Convocar una sesión extraordinaria."
 ca_federalist_events.17.b:0 "Gobernar por decreto por ahora."
 ca_federalist_events.18.t:0 "Los exiliados conspiran"
 ca_federalist_events.18.d:0 "Los conservadores desterrados después de 1829 conspiran desde La Habana y Chiapas. Sus agentes están en todas partes, comprando armas y prometiendo recompensas."
 ca_federalist_events.18.f:0 "«El pasado nunca se queda en el exilio.»"
 ca_federalist_events.18.a:0 "Ofrecerles una amnistía."
 ca_federalist_events.18.b:0 "Vigilarlos de cerca."
 ca_federalist_events.19.t:0 "La milicia cívica"
 ca_federalist_events.19.d:0 "Los clubes liberales proponen armar una milicia cívica de artesanos y pequeños agricultores para defender la Federación, independiente del ejército regular."
 ca_federalist_events.19.f:0 "«Cada ciudadano, un soldado de la República.»"
 ca_federalist_events.19.a:0 "Armar la milicia cívica."
 ca_federalist_events.19.b:0 "Solo el ejército porta armas."
 ca_federalist_events.20.t:0 "[SCOPE.sCharacter('ca_candidate').GetFullName] gana la elección federal"
 ca_federalist_events.20.d:0 "La elección federal ha terminado. [SCOPE.sCharacter('ca_candidate').GetFullName] dirigirá la República, pero los perdedores ya hablan de fraude."
 ca_federalist_events.20.f:0 "«Los votos se cuentan; las disputas no terminan.»"
 ca_federalist_events.20.a:0 "Aceptar el resultado."
 ca_federalist_events.20.b:0 "Impugnar el recuento en las provincias."
 ca_centralist_events.1.t:0 "La mano dura"
 ca_centralist_events.1.d:0 "El gobierno ha elegido el camino de una sola República. Necesita un pilar en el que apoyarse: el ejército, la Iglesia o los grandes terratenientes."
 ca_centralist_events.1.f:0 "«Primero el orden; la libertad, quizá, después.»"
 ca_centralist_events.1.a:0 "El ejército será nuestro pilar."
 ca_centralist_events.1.b:0 "La Iglesia bendecirá a la República."
 ca_centralist_events.1.c:0 "Los terratenientes mantendrán en orden las provincias."
 ca_centralist_events.2.t:0 "El Congreso disuelto"
 ca_centralist_events.2.d:0 "El Congreso federal ya no existe. Los ministros preguntan cómo se gobernará ahora la República."
 ca_centralist_events.2.f:0 "«La República tiene menos voces, pero una sola voluntad.»"
 ca_centralist_events.2.a:0 "Por decreto del gobierno."
 ca_centralist_events.2.b:0 "Mediante un Consejo de Estado provisional."
 ca_centralist_events.3.t:0 "[SCOPE.sCharacter('ca_general').GetFullName] y la guerra de la Unión"
 ca_centralist_events.3.d:0 "[SCOPE.sCharacter('ca_general').GetFullName] dirigirá la guerra para restaurar la República una e indivisible. El general pide facultades extraordinarias sobre las provincias en guerra."
 ca_centralist_events.3.f:0 "«Unidad o muerte.»"
 ca_centralist_events.3.a:0 "Conceder facultades extraordinarias."
 ca_centralist_events.3.b:0 "El gobierno conserva el mando."
 ca_centralist_events.4.t:0 "[SCOPE.sCharacter('ca_ruler').GetFullName] se proclama director supremo"
 ca_centralist_events.4.d:0 "La guerra está ganada, pero la República está agotada. Los oficiales instan a [SCOPE.sCharacter('ca_ruler').GetFullName] a tomar el título de director supremo y gobernar sin límites."
 ca_centralist_events.4.f:0 "«Un hombre, una República.»"
 ca_centralist_events.4.a:0 "Aceptar el poder supremo."
 ca_centralist_events.4.b:0 "Rechazarlo: la República necesita leyes, no un amo."
 ca_centralist_events.5.t:0 "La República unitaria"
 ca_centralist_events.5.d:0 "La República una e indivisible está en pie. De Guatemala a Costa Rica se obedecen las órdenes del gobierno central, de buen o mal grado."
 ca_centralist_events.5.f:0 "«Una bandera, una ley, una República.»"
 ca_centralist_events.5.a:0 "¡Viva la República!"
 ca_centralist_events.7.t:0 "Los intendentes juran"
 ca_centralist_events.7.d:0 "Los nuevos intendentes federales han jurado lealtad a la República y parten hacia las provincias. Su llegada hará realidad la ley unitaria."
 ca_centralist_events.7.f:0 "«La República se construye ley a ley.»"
 ca_centralist_events.7.a:0 "Darles amplios poderes."
 ca_centralist_events.7.b:0 "Que trabajen con los notables locales."
 ca_centralist_events.8.t:0 "¿Trasladar la capital?"
 ca_centralist_events.8.d:0 "Si la República ha de ser una, ¿dónde debe estar su capital? Los diputados de Guatemala la quieren de vuelta en su ciudad; otros proponen una capital que rote entre las provincias."
 ca_centralist_events.8.f:0 "«La República se construye ley a ley.»"
 ca_centralist_events.8.a:0 "La Ciudad de Guatemala, la mayor del istmo."
 ca_centralist_events.8.b:0 "Una capital que rote entre las provincias."
 ca_centralist_events.9.t:0 "[SCOPE.sState('ca_weak_state').GetName] protesta"
 ca_centralist_events.9.d:0 "Los notables de [SCOPE.sState('ca_weak_state').GetName] protestan por la pérdida de los derechos de su Estado. La ley unitaria se ha estancado."
 ca_centralist_events.9.f:0 "«La República se construye ley a ley.»"
 ca_centralist_events.9.a:0 "Enviar tropas."
 ca_centralist_events.9.b:0 "Prometerles privilegios locales."
 ca_centralist_events.10.t:0 "Oficiales de carrera"
 ca_centralist_events.10.d:0 "La primera promoción de oficiales de carrera ha egresado de la academia militar. Quieren un solo ejército, sin las milicias de los Estados."
 ca_centralist_events.10.f:0 "«La República se construye ley a ley.»"
 ca_centralist_events.10.a:0 "Un solo ejército para la República."
 ca_centralist_events.10.b:0 "Conservar las milicias por ahora."
 ca_centralist_events.11.t:0 "¿Reclutamiento o voluntarios?"
 ca_centralist_events.11.d:0 "La Guardia Nacional necesita hombres. Los oficiales quieren una leva general; los terratenientes no quieren perder a sus trabajadores."
 ca_centralist_events.11.f:0 "«La República se construye ley a ley.»"
 ca_centralist_events.11.a:0 "Una leva general."
 ca_centralist_events.11.b:0 "Solo voluntarios."
 ca_centralist_events.12.t:0 "Las milicias de [SCOPE.sState('ca_weak_state').GetName] se niegan a disolverse"
 ca_centralist_events.12.d:0 "Las milicias de [SCOPE.sState('ca_weak_state').GetName] se niegan a entregar sus armas a la Guardia Nacional."
 ca_centralist_events.12.f:0 "«La República se construye ley a ley.»"
 ca_centralist_events.12.a:0 "Desarmarlas por la fuerza."
 ca_centralist_events.12.b:0 "Incorporarlas tal como están."
 ca_centralist_events.13.t:0 "El Concordato"
 ca_centralist_events.13.d:0 "Roma está lista para firmar un concordato con la República: la Iglesia apoyará al gobierno a cambio de sus viejos privilegios."
 ca_centralist_events.13.f:0 "«La República se construye ley a ley.»"
 ca_centralist_events.13.a:0 "Firmar el Concordato."
 ca_centralist_events.13.b:0 "Todavía no."
 ca_centralist_events.14.t:0 "El Patronato"
 ca_centralist_events.14.d:0 "¿Quién nombra a los obispos: Roma o la República? El gobierno quiere conservar el viejo patronato regio de los reyes de España."
 ca_centralist_events.14.f:0 "«La República se construye ley a ley.»"
 ca_centralist_events.14.a:0 "La República conserva el patronato."
 ca_centralist_events.14.b:0 "Dejarlo en manos de Roma."
 ca_centralist_events.15.t:0 "Los intelectuales denuncian los privilegios"
 ca_centralist_events.15.d:0 "Abogados y periodistas denuncian el regreso de los privilegios de la Iglesia. La ley de religión de Estado ha perdido impulso."
 ca_centralist_events.15.f:0 "«La República se construye ley a ley.»"
 ca_centralist_events.15.a:0 "Cerrar sus periódicos."
 ca_centralist_events.15.b:0 "Dejarlos hablar."
 ca_centralist_events.6.t:0 "Golpe centralista en [SCOPE.sCountry('ca_coup_state').GetName]"
 ca_centralist_events.6.d:0 "Oficiales leales al gobierno central han tomado el poder en [SCOPE.sCountry('ca_coup_state').GetName]. Las nuevas autoridades prometen obediencia a la República."
 ca_centralist_events.6.f:0 "«Se ha restablecido el orden.»"
 ca_centralist_events.6.a:0 "Apoyar al nuevo gobierno."
 ca_centralist_events.6.b:0 "Mantener la distancia."
 ca_centralist_events.16.t:0 "La prensa bajo censura"
 ca_centralist_events.16.d:0 "Los censores leen cada periódico antes de imprimirse. La prensa liberal ha pasado a la clandestinidad y sus panfletos circulan en secreto."
 ca_centralist_events.16.f:0 "«Lo que no se puede imprimir se susurra.»"
 ca_centralist_events.16.a:0 "Endurecer la censura."
 ca_centralist_events.16.b:0 "Permitir algo de crítica."
 ca_centralist_events.17.t:0 "Los exiliados liberales"
 ca_centralist_events.17.d:0 "Los liberales desterrados por el gobierno han encontrado refugio en los países vecinos. Desde allí escriben, conspiran y esperan su momento."
 ca_centralist_events.17.f:0 "«El exilio es la antesala del regreso.»"
 ca_centralist_events.17.a:0 "Pedir a nuestros vecinos que los expulsen."
 ca_centralist_events.17.b:0 "Ignorarlos."
 ca_centralist_events.18.t:0 "Conspiración en [SCOPE.sState('ca_weak_state').GetName]"
 ca_centralist_events.18.d:0 "La policía ha descubierto una conspiración contra el gobierno central en [SCOPE.sState('ca_weak_state').GetName]. Sus cabecillas son notables locales muy conocidos."
 ca_centralist_events.18.f:0 "«Cada provincia tiene sus conspiradores.»"
 ca_centralist_events.18.a:0 "Arrestarlos a todos."
 ca_centralist_events.18.b:0 "Comprar su silencio."
 ca_centralist_events.19.t:0 "El Consejo de Estado"
 ca_centralist_events.19.d:0 "Los ministros proponen un Consejo de Estado de notables que asesore al gobierno, en sustitución del Congreso disuelto."
 ca_centralist_events.19.f:0 "«Los consejos salen más baratos que los votos.»"
 ca_centralist_events.19.a:0 "Crear el Consejo."
 ca_centralist_events.19.b:0 "No necesitamos consejeros."
 ca_centralist_events.20.t:0 "¿Continuidad?"
 ca_centralist_events.20.d:0 "El mandato del gobierno llega a su fin, pero sus partidarios dicen que la República no puede permitirse ahora un cambio de mando."
 ca_centralist_events.20.f:0 "«¿Para qué cambiar lo que funciona?»"
 ca_centralist_events.20.a:0 "Prorrogar el mandato."
 ca_centralist_events.20.b:0 "Respetar el plazo."

 # Modificadores (F11)
 ca_fed_pact_liberal:0 "Pacto Federal: los liberales"
 ca_fed_pact_liberal_desc:0 "La intelectualidad liberal es el pilar del Pacto Federal."
 ca_fed_pact_states:0 "Pacto Federal: los Estados"
 ca_fed_pact_states_desc:0 "El gobierno federal ha tranquilizado a los terratenientes de los Estados."
 ca_fed_pact_army:0 "Pacto Federal: el ejército"
 ca_fed_pact_army_desc:0 "El ejército federal es el garante de la Unión."
 ca_fed_constitutional_reform:0 "Reforma constitucional"
 ca_fed_constitutional_reform_desc:0 "La Constitución de 1824 se ha reformado para dar más autonomía a los Estados."
 ca_fed_realism:0 "Realismo federal"
 ca_fed_realism_desc:0 "El gobierno acepta lo que no puede cambiar."
 ca_fed_general_command:0 "Mando supremo"
 ca_fed_general_command_desc:0 "Este general tiene el mando supremo del ejército de la Unión."
 ca_fed_war_effort:0 "Esfuerzo de guerra de la Unión"
 ca_fed_war_effort_desc:0 "Toda la República está movilizada para la guerra."
 ca_fed_republic_restored:0 "La República restaurada"
 ca_fed_republic_restored_desc:0 "La República ha sobrevivido a sus años más oscuros."
 ca_fed_national_pride:0 "Tierra que no se vende"
 ca_fed_national_pride_desc:0 "La República se ha negado a vender su tierra a extranjeros."
 ca_fed_austerity:0 "Austeridad federal"
 ca_fed_austerity_desc:0 "Se han recortado los sueldos de los funcionarios federales."
 ca_fed_rule_by_decree:0 "Gobierno por decreto"
 ca_fed_rule_by_decree_desc:0 "El gobierno gobierna por decreto mientras el Congreso no puede reunirse."
 ca_fed_civic_militia:0 "Milicia cívica"
 ca_fed_civic_militia_desc:0 "Artesanos y pequeños agricultores están armados para defender la República."
 ca_fed_clean_election:0 "Una elección limpia"
 ca_fed_clean_election_desc:0 "Todos han aceptado el resultado de la elección."
 ca_cen_pillar_army:0 "Pilar de la República: el ejército"
 ca_cen_pillar_army_desc:0 "El ejército es el pilar de la República unitaria."
 ca_cen_pillar_church:0 "Pilar de la República: la Iglesia"
 ca_cen_pillar_church_desc:0 "La Iglesia bendice a la República unitaria."
 ca_cen_pillar_landowners:0 "Pilar de la República: los terratenientes"
 ca_cen_pillar_landowners_desc:0 "Los terratenientes mantienen en orden las provincias."
 ca_cen_rule_by_decree:0 "Gobierno por decreto"
 ca_cen_rule_by_decree_desc:0 "Sin Congreso, la República se gobierna por decreto."
 ca_cen_council_of_state:0 "Consejo de Estado"
 ca_cen_council_of_state_desc:0 "Un Consejo de Estado de notables asesora al gobierno."
 ca_cen_supreme_director:0 "Director supremo"
 ca_cen_supreme_director_desc:0 "El jefe de Estado gobierna como director supremo, sin límites."
 ca_enact_teachers_arrive:0 "Maestros en los pueblos"
 ca_enact_teachers_arrive_desc:0 "Los maestros de las nuevas escuelas laicas son bien recibidos en los pueblos."
 ca_enact_slow_support:0 "Apoyo tibio"
 ca_enact_slow_support_desc:0 "La reforma avanza, pero sin entusiasmo."
 ca_enact_firm_reform:0 "Reforma firme"
 ca_enact_firm_reform_desc:0 "El gobierno no cederá ni un palmo."
 ca_enact_compromise:0 "Un término medio"
 ca_enact_compromise_desc:0 "La reforma se ha suavizado para ganar apoyos."
 ca_enact_civil_registry:0 "El Registro Civil"
 ca_enact_civil_registry_desc:0 "El Estado registra ahora nacimientos, matrimonios y defunciones."
 ca_enact_open_councils:0 "Cabildos abiertos"
