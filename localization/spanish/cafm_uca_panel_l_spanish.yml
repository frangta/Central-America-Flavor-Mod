l_spanish:
 # CAFM - Rediseño del diario de la UCA, entrega 2 (10 nov 2026)
 CA_UCA_HDR_TITLE_FEDERAL:0 "La República Federal"
 CA_UCA_HDR_MOTTO_FEDERAL:0 "#i «Dios, Unión, Libertad»#!"
 CA_UCA_HDR_DESC_FEDERAL:0 "Cinco estados soberanos unidos por la Constitución de 1824. La Unión solo vive mientras los estados quieran seguir en ella."
 CA_UCA_HDR_TITLE_CENTRALIST:0 "El Gobierno Supremo"
 CA_UCA_HDR_MOTTO_CENTRALIST:0 "#i «Orden, Religión y Unión»#!"
 CA_UCA_HDR_DESC_CENTRALIST:0 "Una sola nación gobernada desde Guatemala. Los estados deben obedecer a la capital, por la ley o por la espada."
 CA_UCA_PW_FEDERAL:0 "Federalistas"
 CA_UCA_PW_CENTRALIST:0 "Centralistas"
 CA_UCA_PW_SEPARATIST:0 "Separatistas"
 CA_UCA_PW_FEDERAL_TT:0 "#b Poder federalista#! (0-100)\nGrupos de interés con la ideología federal (hasta 40), apoyo al movimiento federalista (hasta 30) y estados leales (hasta 30).\nCon #b 60#! el bando domina; con #b 15#! se derrumba."
 CA_UCA_PW_CENTRALIST_TT:0 "#b Poder centralista#! (0-100)\nGrupos de interés con la ideología unitaria (hasta 40), apoyo al movimiento unitario (hasta 30), y la ley unitaria, el estado de sitio, los intendentes y las reformas centralistas (hasta 30).\nCon #b 60#! el bando domina; con #b 15#! se derrumba."
 CA_UCA_PW_SEPARATIST_TT:0 "#b Poder separatista#! (0-100)\nGrupos de interés con la ideología separatista (hasta 40), apoyo a los movimientos nacionales de los estados (hasta 30), y estados rebeldes o separados (hasta 30).\nCon #b 60#! el bando domina; con #b 15#! se derrumba."
 CA_UCA_TAB_GOV:0 "Gobierno"
 CA_UCA_TAB_STATES:0 "Estados"
 CA_UCA_TAB_CRISIS:0 "Crisis"
 CA_UCA_TAB_GOV_TT:0 "Muestra las reformas y los decretos de nuestra ruta."
 CA_UCA_TAB_STATES_TT:0 "Muestra las intervenciones en los estados y sus peticiones de ayuda."
 CA_UCA_TAB_CRISIS_TT:0 "Muestra las medidas militares."
 CA_FVC_FEDERAL_RESERVE_ARMY:0 "Ejército federal de reserva"
 ca_button_reform_1835:0 "Reforma constitucional de 1835"
 ca_button_reform_1835_desc:0 "En 1835 el Congreso aprobó cambios a la Constitución de 1824 para dar al gobierno federal rentas propias y un distrito federal. Ahora los estados deben aceptarlos."
 ca_button_federal_commissioners:0 "Comisionados de conciliación"
 ca_button_federal_commissioners_desc:0 "Enviar comisionados federales al estado más inquieto para escuchar sus quejas y recuperarlo."
 ca_button_federal_commissioners_target_tt:0 "Al menos un estado está #b Rebelde#! o #b Vacilante#!"
 ca_button_federal_commissioners_effect_tt:0 "La lealtad del estado menos leal sube un nivel (primero los rebeldes, luego los vacilantes)."
 ca_button_federal_reserve_army:0 "Ejército federal de reserva"
 ca_button_federal_reserve_army_desc:0 "Levantar un ejército de reserva pagado por el tesoro federal. Defenderá la Unión, pero sus oficiales ganarán voz en el gobierno."
 ca_button_federal_reserve_army_fvc_tt:0 "#R Quién gobierna la Federación#! baja #b 15#! ahora y #b 0,5#! cada mes."
 ca_frca_commissioners_cost:0 "Comisionados federales"
 ca_frca_commissioners_cost_desc:0 "El gobierno ha gastado su autoridad para calmar a los estados."
 ca_frca_federal_reserve_army:0 "Ejército federal de reserva"
 ca_frca_federal_reserve_army_desc:0 "Un ejército de reserva pagado por el tesoro federal."
 ca_frca_reform_1835_imposed:0 "La Reforma de 1835 impuesta"
 ca_frca_reform_1835_imposed_desc:0 "El gobierno federal ha impuesto la reforma a los estados."
 ca_frca_reform_1835_negotiated:0 "La Reforma de 1835 pactada"
 ca_frca_reform_1835_negotiated_desc:0 "Los estados han aceptado la reforma tras largas negociaciones."
 ca_frca_coup_regime:0 "Un nuevo régimen"
 ca_frca_coup_regime_desc:0 "Un bando se ha apoderado del gobierno federal por la fuerza."
 cafm_uca_route.1.t:0 "La ruta federal"
 cafm_uca_route.1.d:0 "Hemos elegido defender la República de 1824. Los estados conservarán sus propios gobiernos, y la Unión dependerá de su buena voluntad. Nuestros enemigos son los separatistas que quieren romper la Unión y los serviles que quieren gobernarla desde Guatemala."
 cafm_uca_route.1.f:0 "«La unión hace la fuerza, y la Federación es la única unión que los estados aceptarán.»"
 cafm_uca_route.1.a:0 "¡Por la Federación!"
 cafm_uca_route.1.a_tt:0 "Vigile la barra #b Quién gobierna la Federación#!: si los centralistas la llevan a #b -100#!, los serviles tomarán el gobierno."
 cafm_uca_route.2.t:0 "La ruta centralista"
 cafm_uca_route.2.d:0 "Hemos elegido el orden antes que la libertad. Los estados obedecerán a la capital, la Iglesia recuperará su lugar y el ejército mantendrá la paz. Nuestros enemigos son los separatistas de las provincias y los liberales que aún sueñan con la República de Morazán."
 cafm_uca_route.2.f:0 "«Primero el orden; la libertad vendrá después, si es que viene.»"
 cafm_uca_route.2.a:0 "¡Orden, Religión y Unión!"
 cafm_uca_route.2.a_tt:0 "Vigile la barra #b Quién gobierna la Federación#!: si los federalistas la llevan a #b +100#!, los liberales se levantarán contra nosotros."
 cafm_uca_route.3.t:0 "Una conspiración servil"
 cafm_uca_route.3.d:0 "Oficiales del ejército federal se reúnen en secreto con terratenientes conservadores y sacerdotes. Dicen que la República es débil y que hace falta mano dura en Guatemala. Si se mueven, la Federación caerá en manos de los serviles."
 cafm_uca_route.3.f:0 "«En este país, las revoluciones empiezan en el cuartel y terminan en la catedral.»"
 cafm_uca_route.3.a:0 "Purgar a los oficiales desleales"
 cafm_uca_route.3.b:0 "Ganarlos con favores"
 cafm_uca_route.3.c:0 "Solo están hablando"
 cafm_uca_route.3.c_tt:0 "Por ahora no pasa nada."
 cafm_uca_route.4.t:0 "Un pronunciamiento liberal"
 cafm_uca_route.4.d:0 "Abogados, comerciantes y antiguos oficiales de Morazán han firmado un pronunciamiento contra el Gobierno Supremo. Piden el regreso de la Constitución de 1824 y del Congreso federal."
 cafm_uca_route.4.f:0 "«La República no ha muerto. Solo duerme.»"
 cafm_uca_route.4.a:0 "Desterrar a los cabecillas"
 cafm_uca_route.4.b:0 "Ofrecerles algunas concesiones"
 cafm_uca_route.4.c:0 "Ignorar el pronunciamiento"
 cafm_uca_route.4.c_tt:0 "Por ahora no pasa nada."
 cafm_uca_route.5.t:0 "El golpe servil"
 cafm_uca_route.5.d:0 "El ejército ha rodeado el palacio federal. Oficiales conservadores han tomado el gobierno en nombre del orden y la religión. La República Federal de 1824 ha terminado."
 cafm_uca_route.5.f:0 "«Las bayonetas han hablado donde las leyes no pudieron.»"
 cafm_uca_route.5.a:0 "La República ha caído"
 cafm_uca_route.6.t:0 "La revolución liberal"
 cafm_uca_route.6.d:0 "Los liberales se han levantado en la capital y en las provincias. El Gobierno Supremo se ha derrumbado y sus líderes han huido. La Unión ya no se gobernará desde Guatemala."
 cafm_uca_route.6.f:0 "«Ningún gobierno puede mandar a un pueblo que se niega a obedecer.»"
 cafm_uca_route.6.a:0 "El Gobierno Supremo ha caído"
 cafm_uca_route.7.t:0 "Un bando toma la delantera"
 cafm_uca_route.7.d_federal:0 "Los #b federalistas#! dirigen ahora la vida política de la Unión. Sus periódicos, sus clubes y sus oficiales marcan el tono en todos los estados."
 cafm_uca_route.7.d_centralist:0 "Los #b centralistas#! dirigen ahora la vida política de la Unión. El ejército, el clero y las grandes familias de Guatemala marcan el tono en todos los estados."
 cafm_uca_route.7.d_separatist:0 "Los #b separatistas#! dirigen ahora la vida política de la Unión. En cada estado, más gente quiere gobernarse sola."
 cafm_uca_route.7.f:0 "El poder siempre encuentra quien lo tome."
 cafm_uca_route.7.a:0 "Debemos tenerlo en cuenta"
 cafm_uca_route.8.t:0 "Un bando se derrumba"
 cafm_uca_route.8.d_federal:0 "Los #b federalistas#! han perdido casi todo su apoyo. Sus clubes están vacíos y sus periódicos han cerrado."
 cafm_uca_route.8.d_centralist:0 "Los #b centralistas#! han perdido casi todo su apoyo. Hasta el ejército y el clero les han dado la espalda."
 cafm_uca_route.8.d_separatist:0 "Los #b separatistas#! han perdido casi todo su apoyo. Los estados ya no hablan de dejar la Unión."
 cafm_uca_route.8.f:0 "Nada es tan solitario como una causa perdida."
 cafm_uca_route.8.a:0 "Así son las cosas"
 cafm_uca_route.9.t:0 "La República unitaria"
 cafm_uca_route.9.d:0 "Los estados son ahora departamentos de una sola república. Sus gobernadores se nombran en Guatemala, sus impuestos van al tesoro nacional y un solo ejército mantiene la paz desde Chiapas hasta Costa Rica."
 cafm_uca_route.9.f:0 "«Una nación, una ley, una capital.»"
 cafm_uca_route.9.a:0 "La Unión se ha salvado"
 cafm_uca_route.9.a_tt:0 "La Federación es ahora una república unitaria."
 cafm_uca_route.10.t:0 "La Reforma de 1835"
 cafm_uca_route.10.d:0 "El Congreso federal ha aprobado la reforma de la Constitución de 1824. Da al gobierno federal rentas propias y un distrito federal, pero los estados deben ratificarla, y muchos se niegan."
 cafm_uca_route.10.f:0 "«Una constitución que los estados no aceptan es solo papel.»"
 cafm_uca_route.10.a:0 "Imponer la reforma"
 cafm_uca_route.10.b:0 "Negociar con los estados"
