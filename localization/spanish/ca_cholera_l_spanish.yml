l_spanish:
 # CAFM - F16 - Colera y Codigos Livingston
 ca_central_america.14.t:0 "Los Códigos de Livingston"
 ca_central_america.14.d:0 "Los códigos penales redactados por el jurista estadounidense Edward Livingston están listos para entrar en vigor en Guatemala: juicio por jurados, matrimonio civil, divorcio y el fin de los privilegios del clero. Los liberales los llaman la ley del futuro; los curas y los terratenientes, la ley del diablo."
 ca_central_america.14.f:0 "«Un código para un pueblo que todavía no existe.»"
 ca_central_america.14.a:0 "Aplicar los códigos."
 ca_central_america.14.b:0 "Archivar la reforma."
 ca_central_america.15.t:0 "El cólera en Guatemala"
 ca_central_america.15.d:0 "El cólera ha aparecido en Chiquimula y en el distrito de Mita, y avanza hacia la capital. Los médicos proponen cordones sanitarios, pasaportes, lazaretos y cementerios fuera de las iglesias. En los pueblos de La Montaña corre un rumor: el gobierno está envenenando el agua."
 ca_central_america.15.f:0 "«La cura les asusta más que la enfermedad.»"
 ca_central_america.15.a:0 "Cordones sanitarios y juntas de sanidad."
 ca_central_america.15.b:0 "Dejar que siga su curso."
 ca_central_america.15.c:0 "Pedir al clero que calme los rumores."
 ca_central_america.16.t:0 "El cólera en [SCOPE.sState('ca_cholera_state').GetName]"
 ca_central_america.16.d:0 "El cólera ha estallado en [SCOPE.sState('ca_cholera_state').GetName]. Sin hospitales ni médicos, las autoridades solo pueden elegir entre cerrar los caminos o dejar correr la enfermedad."
 ca_central_america.16.f:0 "«El cólera no pide pasaporte.»"
 ca_central_america.16.a:0 "Poner el estado en cuarentena."
 ca_central_america.16.b:0 "Dejar que siga su curso."
 ca_central_america.17.t:0 "El cólera se extiende"
 ca_central_america.17.d:0 "El cólera ha pasado a [SCOPE.sState('ca_cholera_spread').GetName]. Viajeros, arrieros y soldados lo llevan de pueblo en pueblo."
 ca_central_america.17.f:0 "«De aldea en aldea, doblan las campanas.»"
 ca_central_america.17.a:0 "Rezar para que pase."
 ca_central_america.17.b:0 "Poner en cuarentena todos los estados afectados."
 ca_generic_cholera_mod:0 "Brote de cólera"
 ca_generic_cholera_mod_desc:0 "El cólera está matando a la gente de este estado."
 ca_cholera_clergy:0 "El clero calma los rumores"
 ca_cholera_clergy_desc:0 "Los curas predican que el cólera no es veneno."
