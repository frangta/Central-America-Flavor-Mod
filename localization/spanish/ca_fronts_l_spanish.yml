l_spanish:
 # CAFM - F10 - Los 4 frentes de la fase IV
 ca_central_america.150.t:0 "Exigencias británicas"
 ca_central_america.150.d:0 "El cónsul británico ha entregado una nota: la deuda de la antigua Federación debe pagarse, a los cortadores de madera de Belice hay que dejarlos en paz y el Rey Mosco está bajo la protección de la Corona. Londres espera una respuesta."
 ca_central_america.150.f:0 "«El Gobierno de Su Majestad considera el asunto con suma gravedad.»"
 ca_central_america.150.a:0 "Darles lo que quieren, por ahora."
 ca_central_america.150.b:0 "No nos inclinaremos ante Londres."
 ca_central_america.151.t:0 "El protectorado de la Mosquitia"
 ca_central_america.151.d:0 "Buques de guerra británicos han desembarcado infantes de marina en la Costa de los Mosquitos. La costa caribe de Nicaragua, desde el cabo Gracias a Dios hasta San Juan del Norte, queda ahora bajo la protección de la Corona británica."
 ca_central_america.151.f:0 "La Unión ha perdido su orilla del Caribe."
 ca_central_america.151.a:0 "No podemos detenerlos."
 ca_central_america.152.t:0 "México pone los ojos en el Soconusco"
 ca_central_america.152.d:0 "Agentes mexicanos recorren libremente el Soconusco y los ayuntamientos firman actas de adhesión a México. El gobierno de la Ciudad de México dice que solo atiende la voluntad del pueblo."
 ca_central_america.152.f:0 "«El Soconusco siempre ha sido mexicano.»"
 ca_central_america.152.a:0 "Enviar tropas y dinero federales al Soconusco."
 ca_central_america.152.b:0 "Protestar por la vía diplomática."
 ca_central_america.153.t:0 "La unión irrevocable"
 ca_central_america.153.d:0 "México ha proclamado la unión irrevocable del Soconusco con Chiapas. Nuestras protestas no han tenido respuesta y las tropas mexicanas ya custodian la frontera."
 ca_central_america.153.f:0 "El Soconusco está perdido."
 ca_central_america.153.a:0 "Una pérdida amarga."
 ca_central_america.154.t:0 "El altar y el trono"
 ca_central_america.154.d:0 "El clero predica contra la Federación desde todos los púlpitos. Se ve a los hombres de Carrera en los pueblos, y los conservadores de Guatemala exigen abiertamente que se devuelvan los privilegios de la Iglesia."
 ca_central_america.154.f:0 "«¡Viva la religión y mueran los extranjeros!»"
 ca_central_america.154.a:0 "Hacer concesiones a la Iglesia."
 ca_central_america.154.b:0 "La República no se inclinará ante el clero."
 ca_central_america.155.t:0 "Guatemala da la espalda"
 ca_central_america.155.d:0 "Los conservadores han ganado la batalla por Guatemala. Sus notables, su clero y sus campesinos ya no reconocen al gobierno federal."
 ca_central_america.155.f:0 "El gigante del norte ha elegido bando."
 ca_central_america.155.a:0 "Así sea."
 ca_central_america.156.t:0 "Cuarteles inquietos"
 ca_central_america.156.d:0 "Oficiales sin paga y coroneles ambiciosos se reúnen a puerta cerrada. En cada Estado un caudillo espera el momento en que el gobierno federal muestre debilidad."
 ca_central_america.156.f:0 "«Quien paga al ejército gobierna el país.»"
 ca_central_america.156.a:0 "Pagar a los oficiales lo que se les debe."
 ca_central_america.156.b:0 "El ejército obedecerá a la República."
 ca_central_america.157.t:0 "Los generales toman el poder"
 ca_central_america.157.d:0 "Los oficiales han perdido la paciencia. Las tropas han rodeado el palacio de gobierno y los generales dictan ahora la política de la Unión."
 ca_central_america.157.f:0 "La espada ha reemplazado a la ley."
 ca_central_america.157.a:0 "No tenemos opción."
 ca_frca_british_concessions:0 "Concesiones a Gran Bretaña"
 ca_frca_british_concessions_desc:0 "La Federación ha cedido ante las exigencias británicas."
 ca_frca_military_coup:0 "Gobierno militar"
 ca_frca_military_coup_desc:0 "Los generales dictan la política de la Unión."
