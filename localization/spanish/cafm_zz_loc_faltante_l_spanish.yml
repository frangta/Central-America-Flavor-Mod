 ca_federalist_events.21.t:0 "El Congreso propone: la escuela laica"
 ca_federalist_events.21.d:0 "Los diputados liberales quieren que las escuelas de la República las dirija el Estado y no los frailes. La instrucción primaria, dicen, es la base de una ciudadanía libre. El clero y las familias conservadoras protestan que es un ataque a la fe del pueblo."
 ca_federalist_events.21.f:0 "\"Sin instrucción pública no hay ciudadanos, solo súbditos.\""
 ca_federalist_events.22.t:0 "El Congreso propone: Iglesia y Estado"
 ca_federalist_events.22.d:0 "Un proyecto ante el Congreso acabaría con el diezmo y el fuero eclesiástico y separaría la Iglesia del Estado. Los liberales federales lo quieren desde 1829; los obispos lo llaman persecución."
 ca_federalist_events.22.f:0 "\"Al César lo que es del César, y que la República lleve sus propias cuentas.\""
 ca_federalist_events.23.t:0 "El Congreso propone: municipios libres"
 ca_federalist_events.23.d:0 "Los pueblos piden sus propios ayuntamientos, elegidos por los vecinos, con poder sobre sus caminos, sus mercados y sus escuelas. Los federalistas ven en el municipio la escuela de la República; las capitales de los Estados temen perder el control."
 ca_federalist_events.23.f:0 "\"La República empieza en la plaza del pueblo.\""
 ca_federalist_events.24.t:0 "El Congreso propone: libertad de imprenta"
 ca_federalist_events.24.d:0 "Los impresores de la capital piden al Congreso que suprima la censura previa. Los periódicos liberales podrían criticar al gobierno con libertad; también los serviles."
 ca_federalist_events.24.f:0 "\"La imprenta libre es el centinela de la República.\""
 ca_federalist_events.25.t:0 "El Congreso propone: una contribución justa"
 ca_federalist_events.25.d:0 "La contribución por cabeza pesa lo mismo sobre el peón que sobre el hacendado, y los pueblos se resisten a pagarla. La comisión de hacienda propone una contribución según la renta y la propiedad."
 ca_federalist_events.25.f:0 "\"Que cada Estado y cada ciudadano pague según sus medios.\""
 ca_federalist_events.26.t:0 "El Congreso propone: libre comercio"
 ca_federalist_events.26.d:0 "Los comerciantes de los puertos quieren que se levanten las viejas trabas coloniales y que la Federación se abra al comercio de todas las naciones. Los artesanos temen la avalancha de telas inglesas."
 ca_federalist_events.26.f:0 "\"El comercio es el lazo de los pueblos.\""
 ca_federalist_events.27.t:0 "El Congreso propone: un sufragio más amplio"
 ca_federalist_events.27.d:0 "Los diputados más radicales quieren extender el voto más allá de los propietarios, como prometía la Constitución de 1824. Los moderados advierten que los caudillos llevarán a los peones a votar en fila."
 ca_federalist_events.27.f:0 "\"La soberanía reside en el pueblo, no en su bolsa.\""
 ca_british_debt.7.t:0 "El cónsul insiste en sus reclamos"
 ca_british_debt.7.d:0 "El cónsul de Su Majestad ha enviado otra nota exigiendo el pago de los intereses atrasados del empréstito de Londres, junto con los reclamos de los comerciantes británicos por mercancías tomadas en nuestras guerras civiles. Su tono se endurece con cada carta."
 ca_british_debt.7.f:0 "\"El cónsul escribe como si fuera el gobernador de una colonia.\""
 ca_british_debt.8.t:0 "Los bonistas piden una aduana"
 ca_british_debt.8.d:0 "El comité de bonistas propone un trato: lo que recaude una de nuestras aduanas iría directo a Londres hasta reducir la deuda. Aliviaría la presión, pero habría agentes extranjeros en nuestros puertos."
 ca_british_debt.8.f:0 "\"Quieren la llave de nuestros puertos a cambio de paciencia.\""
 ca_british_debt.9.t:0 "Pago en especie"
 ca_british_debt.9.d:0 "Con el Tesoro vacío, el ministro de hacienda sugiere pagar a los bonistas en añil, grana y maderas preciosas en lugar de plata. Los comerciantes que venden esos productos perderán la ganancia de una cosecha."
 ca_british_debt.9.f:0 "\"Si no tenemos plata, que se lleven nuestro añil.\""
 ca_british_debt.10.t:0 "Bonos por tierras"
 ca_british_debt.10.d:0 "Un agente de Londres ofrece cambiar parte de los viejos bonos por tierras públicas, donde se asentarían colonos ingleses. Otras repúblicas del continente lo han hecho. Los pueblos cercanos a esas tierras ya están inquietos."
 ca_british_debt.10.f:0 "\"La tierra es lo único que le sobra a esta República.\""
 ca_british_debt.11.t:0 "Un banquero rival"
 ca_british_debt.11.d:0 "Un banquero de París y una casa comercial de Nueva York ofrecen comprar parte de nuestra deuda en mejores condiciones que Londres. Cambiar de acreedor enfadaría a los británicos, y el nuevo también esperará favores."
 ca_british_debt.11.f:0 "\"Cada acreedor es un amo nuevo.\""
 ca_british_debt.12.t:0 "Repartir la deuda entre los Estados"
 ca_british_debt.12.d:0 "Varios Estados proponen que cada uno tome su parte de la deuda federal y la pague por su cuenta. Aliviaría el Tesoro federal, pero también le diría a Londres que la Federación ya no responde por sus Estados."
 ca_british_debt.12.f:0 "\"Divide la deuda y dividirás la República.\""
 ca_british_debt.13.t:0 "La comisión del empréstito de 1825"
 ca_british_debt.13.d:0 "Los diputados piden una comisión que investigue el empréstito de 1825: cuánto llegó de verdad a la República y cuánto se quedó en manos de los banqueros y sus agentes. A Londres no le gustarán las preguntas."
 ca_british_debt.13.f:0 "\"Estamos pagando un dinero que nunca vimos.\""
 ca_british_debt.14.t:0 "Impago"
 ca_british_debt.14.d:0 "El Tesoro no puede hacer frente al próximo pago y los bonistas no esperarán más. Podemos declarar que suspendemos los pagos, o vaciar lo que queda en nuestras arcas."
 ca_british_debt.14.f:0 "\"No queda con qué pagar.\""
 ca_british_debt.14.a_tt:0 "#n Dejamos de pagar#! la deuda inglesa. Gran Bretaña puede responder con la fuerza."
 ca_british_debt.15.t:0 "La Marina Real bloquea nuestros puertos"
 ca_british_debt.15.d:0 "Han aparecido buques de guerra británicos frente a nuestros puertos y detienen a todo barco que intenta entrar o salir. El cónsul dice que el bloqueo durará hasta que paguemos."
 ca_british_debt.15.f:0 "\"Sus fragatas son los alguaciles de la City.\""
 ca_british_debt.16.t:0 "El ultimátum británico"
 ca_british_debt.16.d:0 "El cónsul ha entregado un ultimátum: o pagamos una buena parte de la deuda y los reclamos, o la Marina Real tomará lo que se le debe. Ya no hay lugar para promesas."
 ca_british_debt.16.f:0 "\"Paguen, o cobrarán los cañones.\""
 ca_british_debt.17.t:0 "Una isla en manos británicas"
 ca_british_debt.17.d:0 "Infantes de marina de un buque británico han desembarcado en una de nuestras islas y han izado la Union Jack como garantía de la deuda. El cónsul dice que se irán cuando paguemos."
 ca_british_debt.17.f:0 "\"Hoy una isla; mañana, la costa.\""
 ca_british_debt.18.t:0 "El rey mosquito y el Foreign Office"
 ca_british_debt.18.d:0 "Noticias de la costa caribe: los británicos han coronado a un nuevo rey mosquito y hablan de su reino como un protectorado de la Corona. En Londres, el Foreign Office liga nuestra deuda a los reclamos de la Costa de Mosquitos."
 ca_british_debt.18.f:0 "\"Un rey de los mosquitos, coronado en una iglesia británica.\""
 ca_british_debt.19.t:0 "La paz de los bonistas"
 ca_british_debt.19.d:0 "Con los cañones en silencio, Londres está dispuesta a llegar a un acuerdo: los reclamos se pagarán a plazos y se levantará el bloqueo. Es una paz humillante, pero es paz."
 ca_british_debt.19.f:0 "\"La paz, al precio de nuestro orgullo.\""
 ca_british_debt.20.t:0 "El arreglo final"
 ca_british_debt.20.d:0 "Solo queda un último plazo del empréstito de Londres. Los bonistas ofrecen cerrar la cuenta para siempre si lo pagamos ahora."
 ca_british_debt.20.f:0 "\"La última carta de Londres.\""
 ca_british_debt.20.b_tt:0 "La deuda sigue abierta."
 ca_british_debt.21.t:0 "¡Guerra con Inglaterra!"
 ca_british_debt.21.d:0 "Gran Bretaña ha decidido cobrar por la fuerza. La Marina Real navega hacia nuestras costas y el cónsul ha dejado la capital. Pase lo que pase, esta guerra se recordará."
 ca_british_debt.21.f:0 "\"El león ha venido a cobrar.\""
 ca_british_debt.21.a_tt:0 "Gran Bretaña abre una jugada diplomática contra nosotros por la deuda."
 ca_guide.1.t:0 "Cómo jugar la Federación"
 ca_guide.1.d:0 "La República Federal de Centroamérica empieza en 1836 ya deshaciéndose. Esta guía explica, página a página, cómo funcionan sus sistemas. Elige un tema."
 ca_guide.1.f:0 "\"Dios, Unión, Libertad.\""
 ca_guide.2.t:0 "La lealtad y el minimapa"
 ca_guide.2.d:0 "Cada Estado tiene una lealtad de 0 a 3: #bold Separado, Rebelde, Vacilante, Leal#!. El minimapa colorea cada Estado según su lealtad. Los meses de inestabilidad la bajan; la calma la sube. Pulsa un Estado en el minimapa para ver su panel y sus acciones: campaña federal, negociación y, en la ruta centralista, intendentes y estados de sitio. Las zonas nuevas (Costa de Mosquitos, Petén, Guanacaste, Talamanca, Bocas del Toro) tienen sus propias acciones."
 ca_guide.3.t:0 "La barra y las fases"
 ca_guide.3.d:0 "La barra de Apoyo va de 0 a 200. Los Estados Leales la suben cada mes; los Rebeldes y Separados la bajan. Por debajo de 50 la Federación está en crisis; en 0 se disuelve. El diario avanza por cuatro fases: #bold Crisis, Desintegración, Guerra y Resistencia#!."
 ca_guide.4.t:0 "La Cohesión federal"
 ca_guide.4.d:0 "En la ruta federal, la #bold Cohesión federal#! (0-100) mide lo bien que trabajan juntos los Estados. La legitimidad, los impuestos justos, un ejército federal y una capital fuera de Guatemala la suben; la deuda, la guerra civil, los Estados rebeldes y el centralismo la bajan. Se gasta en acciones federales y en negociar reformas con los Estados. En 75 el ejército jura la Constitución; por debajo de 25 los caudillos se envalentonan."
 ca_guide.5.t:0 "Las tres rutas"
 ca_guide.5.d:0 "En los primeros meses eliges: la ruta #bold federal#! (respetar a los Estados, reformar por el Congreso), la ruta #bold centralista#! (imponer la Unión por la fuerza) o #bold salir#! de la Federación y jugar un solo Estado. Cada ruta tiene sus propios botones, eventos y textos."
 ca_guide.6.t:0 "Los frentes"
 ca_guide.6.d:0 "En la fase IV la Federación lucha en cuatro frentes: #bold británico, mexicano, conservador y el de los caudillos#!. Cada uno va de En calma a Perdido. Más de un frente perdido cierra el camino a los mejores desenlaces."
 ca_guide.7.t:0 "La deuda inglesa"
 ca_guide.7.d:0 "El empréstito de 1825 pesa sobre el Tesoro. Los bonistas y el cónsul aprietan más a medida que crece su #bold presión#!: aduanas, pagos en especie, bloqueos y, al final, la guerra. Puedes pagar, negociar o dejar de pagar y enfrentarte a la Marina Real."
 ca_guide.8.t:0 "Las regiones"
 ca_guide.8.d:0 "Bocas del Toro depende de su #bold control efectivo#!: con 60 o más, los intentos extranjeros de tomarla fracasan. La Costa de Mosquitos es la puerta de los británicos; Petén limita con Belice y Yucatán; Guanacaste se disputa con Nicaragua; Talamanca sigue a su propio cacique; Los Altos puede llegar a ser el sexto Estado; el Soconusco mira a México."
 ca_guide.9.t:0 "Los desenlaces"
 ca_guide.9.d:0 "#bold A#!: la República sobrevive hasta 1845. #bold B#!: la unión por la espada, tras ganar la guerra federal. #bold C#!: una Confederación, firmada por la Dieta de los Estados. #bold D1#!: disolución violenta. #bold D2#!: la Federación simplemente se apaga en 1845."
 ca_guide.10.t:0 "Después de la Federación"
 ca_guide.10.d:0 "Los Estados que sobrevivan pueden formar uniones regionales, intentar reconstruir la Federación o un día proclamar la #bold Gran República de Centroamérica#!. La Confederación de 1842-1845 y el sueño de la Patria Grande vienen después."
 ca_central_america.119.a_guide_tt:0 "#bold Dificultad: difícil.#! Mantén viva la Federación hasta 1845. Gastas #bold Cohesión federal#! en acciones federales, el Congreso propone reformas y los Estados se recuperan con campañas y negociación."
 ca_central_america.119.b_guide_tt:0 "#bold Dificultad: muy difícil.#! Mantén la Unión por la fuerza. Sin cohesión: usas intendentes, estados de sitio y caudillos comprados, a costa de rebeliones."
 ca_central_america.119.c_guide_tt:0 "#bold Dificultad: variable.#! Sal de la Federación y juega un Estado: sus propios diarios, elecciones y el camino a la soberanía."
 ca_central_america.176.t:0 "Los británicos desembarcan desde la Costa de Mosquitos"
 ca_central_america.176.d:0 "Con nuestro control de Bocas del Toro debilitado, una goleta británica venida de la Costa de Mosquitos ha desembarcado hombres y ha izado la bandera mosquita en las islas de la laguna. Dicen que solo protegen a los súbditos del rey mosquito."
 ca_central_america.176.f:0 "\"Hoy la bandera mosquita; mañana, la británica.\""
 CA_ROLE_BOX:0 "#bold [GetPlayer.GetRuler.GetFullName]#! gobierna el Estado.\nLealtad a la Federación: #bold [GetPlayer.MakeScope.ScriptValue('ca_role_own_loyalty')|0]#! / 3  ·  Lucha interna: #bold [GetPlayer.MakeScope.Var('ca_fvs_bar').GetValue|0]#! / 100 (100 = ganan los federalistas)\nFacciones en el Estado: Federalistas #bold [GetPlayer.MakeScope.Var('ca_federalist_influence').GetValue|0]#! / 3 · Centralistas #bold [GetPlayer.MakeScope.Var('ca_centralist_influence').GetValue|0]#! / 3 · Separatistas #bold [GetPlayer.MakeScope.Var('ca_separatist_influence').GetValue|0]#! / 3"
