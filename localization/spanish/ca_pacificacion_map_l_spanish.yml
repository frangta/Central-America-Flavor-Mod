l_spanish:
 CA_PN_HEADER:0 "La frontera norte, 1836 — pacificado: #bold [GetPlayer.MakeScope.Var('ca_pacificacion_progress').GetValue|0]#! / 100"
 CA_PN_HEADER_TT:0 "Cuánto de Guanacaste y Nicoya vuelve a obedecer a San José. La zona del mapa pasa de #bold rojo#! (menos de 34) a #bold amarillo#! (34 a 66) y #bold verde#! (67 o más). Al llegar a 100 la campaña triunfa; si antes llega el 1 de enero de 1837, Guanacaste se pierde."
 CA_PN_MAP_TT:0 "El partido de Guanacaste y Nicoya en 1836. La línea discontinua es la frontera aproximada con Nicaragua. Los marcadores azules son hechos políticos; los rojos, combates."
 CA_PN_STAGES:0 "#bold La campaña de 1836#!"
 CA_PN_BEAT_1:0 "Mayo — El comisionado insultado (Rivas)"
 CA_PN_BEAT_1_TT:0 "El intendente Joaquín Rivas, enviado ante el jefe de Estado nicaragüense, es insultado y amenazado en la villa de Nicaragua. Quijano se mueve libre por la frontera."
 CA_PN_BEAT_2:0 "24–27 junio — Facultades extraordinarias"
 CA_PN_BEAT_2_TT:0 "La noticia de la invasión llega a San José. La Asamblea da a Carrillo facultades extraordinarias y 800 hombres marchan al norte con el coronel Vicente Villaseñor."
 CA_PN_BEAT_3:0 "29 junio — El motín de la Villa"
 CA_PN_BEAT_3_TT:0 "La infantería de la Villa de Guanacaste se alza contra su comandante Antonio Elizondo mientras Quijano espera en Los Ahogados. Las autoridades leales se repliegan a Bagaces."
 CA_PN_BEAT_4:0 "7 julio — El saqueo de Bagaces"
 CA_PN_BEAT_4_TT:0 "Los hombres de Quijano saquean Bagaces y los estancos de tabaco y aguardiente del gobierno."
 CA_PN_BEAT_5:0 "8 julio — El segundo asalto"
 CA_PN_BEAT_5_TT:0 "Quijano ataca otra vez la Villa de Guanacaste y lo rechazan la guarnición y las milicias de Nicoya y Santa Cruz."
 CA_PN_BEAT_6:0 "Julio — El desembarco en El Bolsón"
 CA_PN_BEAT_6_TT:0 "Una columna salida de Esparza desembarca en El Bolsón, en el golfo de Nicoya, y toma a Quijano por la espalda. Solo si la campaña llegó a 40."
 CA_PN_BEAT_7:0 "24 julio — Sapoá"
 CA_PN_BEAT_7_TT:0 "El ayudante Joaquín Alvarado sorprende a Quijano en la hacienda de Sapoá; el invasor huye al otro lado de la frontera. Solo con la expedición en campaña."
 CA_PN_BEAT_8:0 "4 agosto — Los mediadores de Morazán"
 CA_PN_BEAT_8_TT:0 "El gobierno federal envía a Juan Mora Fernández y Pedro Bermúdez a San José como mediadores."
 CA_PN_EXPEDITION_ON:0 "La expedición de Villaseñor está #bold en campaña#!."
 CA_PN_EXPEDITION_OFF:0 "La expedición #bold aún no ha salido#!."
 CA_JEMAP_ISTHMUS_TT:0 "Un Estado del istmo. Cuanto más rojo, más inestabilidad."
 CA_JEMAP_OUTSIDE_TT:0 "Fuera del istmo."
