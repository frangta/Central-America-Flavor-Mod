 # CAFM - Ruta centralista (18 nov 2026): textos del .119 al dia con el diario nuevo
 CA_EW119_CEN_DESC:0 "#bold Objetivo:#! imponer la República unitaria antes de que la resistencia la derribe.\n- Gánate al ejército y apoyo en los Estados\n- Haz propaganda y aparta a Morazán\n- Disuelve el Congreso y llena la barra de #bold Unidad#!"
 CA_EW119_CEN_TT:0 "#bold Solo para el jugador.#! Abre su propio diario, #bold La República una e indivisible#!. Al principio el ejército sigue siendo federal y Morazán gobierna: primero hay que preparar el terreno."
 ca_central_america.119.b_guide_tt:0 "#bold Dificultad: muy difícil.#! Impón la Unión antes de que te la quiten. Fase I: gánate al ejército, busca apoyo en los Estados, haz propaganda y aparta a Morazán (asesinato, golpe o elecciones) antes del 1 de diciembre de 1838. Después disuelve el Congreso, aprueba la ley unitaria y lleva la #bold Unidad#! a 100. Primero se te opondrán los liberales; con el tiempo, los separatistas."
