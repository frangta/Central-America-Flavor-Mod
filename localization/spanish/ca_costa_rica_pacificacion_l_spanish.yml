l_spanish:
 # =========================================================================
 # CAFM - The Pacification of the North (1836): new events and modifier
 # Source: R. Fernández Guardia, "La guerra de la Liga y la invasión de
 # Quijano", Revista del Archivo Nacional 3 (1939)
 # =========================================================================

 ca_costa_rica_events.40.t:0 "El comisionado ofendido"
 ca_costa_rica_events.40.d:0 "Mayo de 1836. El intendente Joaquín Rivas, enviado como nuestro comisionado ante el jefe de Estado nicaragüense José Zepeda, ha vuelto humillado: en el pueblo de Nicaragua fue insultado y amenazado. Mientras tanto, Manuel Quijano, el oficial que Carrillo desterró por conspirar con la Liga, se mueve con libertad entre León y Masaya entre los exiliados de la Liga, prometiendo levantar hombres contra San José."
 ca_costa_rica_events.40.f:0 "En León ya no hablan de exiliados. Hablan de un ejército."
 ca_costa_rica_events.40.a:0 "Exigir explicaciones a Zepeda."
 ca_costa_rica_events.40.b:0 "Reforzar la frontera norte."
 ca_costa_rica_events.40.c:0 "Pedir a la Federación que llame al orden a León."

 ca_costa_rica_events.41.t:0 "La Liga vuelve a la bandera"
 ca_costa_rica_events.41.d:0 "24 de junio de 1836. Un correo trae la noticia de la invasión, y al día siguiente Quijano abre en La Flor el correo destinado a Costa Rica. Carrillo convoca a la Asamblea, que le otorga facultades extraordinarias el 27 de junio. Ochocientos hombres marchan al norte al mando del coronel Vicente Villaseñor, y muchos antiguos cabecillas de la Liga se presentan como voluntarios. Solo Nicolás Ulloa dona 1.500 pesos."
 ca_costa_rica_events.41.f:0 "El año pasado combatieron a San José. Hoy marchan por ella."
 ca_costa_rica_events.41.a:0 "Facultades extraordinarias y un indulto para la Liga."
 ca_costa_rica_events.41.b:0 "Enviar a Villaseñor, pero no indultar a nadie."
 ca_costa_rica_events.41.c:0 "Esperar noticias más claras."

 ca_costa_rica_events.61.t:0 "El segundo asalto"
 ca_costa_rica_events.61.d:0 "8 de julio de 1836. Quijano se ha lanzado por segunda vez contra la Villa de Guanacaste y ha sido rechazado. Las milicias de Nicoya y Santa Cruz combatieron junto a la guarnición. Tomamos dos prisioneros, pero Juan Rafael Muñoz y los amotinados del 29 de junio impidieron perseguir al invasor."
 ca_costa_rica_events.61.f:0 "Algunos defensores pelean para ganar. Otros, para que la guerra no termine."
 ca_costa_rica_events.61.a:0 "Honrar a las milicias de Nicoya y Santa Cruz."
 ca_costa_rica_events.61.b:0 "Arrestar a los amotinados del 29 de junio."

 ca_costa_rica_events.71.t:0 "Sapoá"
 ca_costa_rica_events.71.d:0 "24 de julio de 1836. El ayudante Joaquín Alvarado ha sorprendido a Quijano en la hacienda de Sapoá. El invasor huyó al otro lado de la frontera, abandonando sus pertrechos, sus papeles y tres prisioneros. Entre los traidores en nuestro poder están el oficial Joaquín Jiménez, de Cartago, y José de Jesús Banegas, capturado en el segundo asalto."
 ca_costa_rica_events.71.f:0 "Los papeles que dejó Quijano nombran a más gente de la que jamás trajo consigo."
 ca_costa_rica_events.71.a:0 "Que los fusilen."
 ca_costa_rica_events.71.b:0 "Conmutar sus penas."
 ca_costa_rica_events.71.c:0 "Perseguir a Quijano hasta Nicaragua."

 ca_cos_purga_del_norte:0 "Purga del Norte"
 ca_cos_purga_del_norte_desc:0 "Los fusilamientos en Guanacaste han mostrado lo que les espera a quienes conspiran con León."
