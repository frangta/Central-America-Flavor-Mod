 ca_fvs_beats_election_desc:0 "Las elecciones en [SCOPE.sCountry('secession_country').GetName] han dado el gobierno a los unionistas. Los separatistas han perdido el control del Estado."
 ca_fvs_beats_coup_desc:0 "Oficiales leales a la Federación han tomado el poder en [SCOPE.sCountry('secession_country').GetName] y han expulsado a los dirigentes separatistas."
 ca_fvs_beats_civil_war_desc:0 "La guerra civil en [SCOPE.sCountry('secession_country').GetName] ha terminado y la han ganado los federalistas."
 ca_fvs_beats_morazan_desc:0 "Francisco Morazán ha tomado él mismo el gobierno de [SCOPE.sCountry('secession_country').GetName]. Mientras conserve San Salvador, el Estado seguirá siendo el baluarte de la Federación."
 ca_fvs_falls_election_desc:0 "Las elecciones en [SCOPE.sCountry('secession_country').GetName] han dado el gobierno a los enemigos de la Unión."
 ca_fvs_falls_coup_desc:0 "Un golpe en [SCOPE.sCountry('secession_country').GetName] ha llevado al poder a los separatistas. El nuevo gobierno ya no obedece a las autoridades federales."
 ca_fvs_falls_civil_war_desc:0 "La guerra civil en [SCOPE.sCountry('secession_country').GetName] ha terminado y la han ganado los separatistas."
 ca_fvs_falls_assembly_desc:0 "La Asamblea de [SCOPE.sCountry('secession_country').GetName] ha votado asumir la plena soberanía. Allí ya no queda nadie que obedezca al gobierno federal."
 ca_fvs_falls_revolt_desc:0 "La revuelta en [SCOPE.sCountry('secession_country').GetName] ha derribado al gobierno liberal. Sus nuevos dirigentes no quieren saber nada de la Federación."
 ca_central_america.79.t:0 "El Decreto del 30 de mayo de 1838"
 ca_central_america.79.d:0 "Incapaz de mantener el orden, el Congreso Federal debate un decreto que permitiría a los Estados organizarse como mejor les parezca. En la práctica abriría la puerta para que cada Estado salga de la Federación."
 ca_central_america.79.d_centralist:0 "El Congreso federal se ha convertido en el último refugio de quienes quieren desmantelar la República. El gobierno está listo para disolverlo y gobernar sin él."
 ca_central_america.79.f:0 "Ahora es la propia ley la que desmantela la ley."
 ca_central_america.79.a:0 "Permitir que los Estados se organicen como quieran."
 ca_central_america.79.b:0 "¡La República es una e indivisible!"
 ca_central_america.79.c:0 "Esta Unión ha muerto. Busquemos nuestro propio camino."
