l_spanish:
 # CAFM - F6 - Secesion, facciones y diarios del estado
 ca_central_america.18.t:0 "Separatismo en Costa Rica"
 ca_central_america.18.d:0 "En San José, el jefe de Estado Braulio Carrillo ya no oculta su desprecio por un gobierno federal lejano, pobre y siempre en guerra. Los cafetaleros del Valle Central quieren comerciar con el mundo en sus propios términos, y la Asamblea del Estado se prepara para declarar que Costa Rica se gobernará sola."
 ca_central_america.18.d2:0 "El gobierno de Costa Rica enfrenta un movimiento separatista que se ha ganado el apoyo de los cafetaleros y de gran parte de la Asamblea. Si lo seguimos, Costa Rica se declarará Estado autónomo, ligado a la Federación solo de nombre."
 ca_central_america.18.f:0 "Lejos de Guatemala, cerca de la prosperidad."
 ca_central_america.18.a:0 "Reconocer la autonomía de Costa Rica."
 ca_central_america.18.b:0 "Negociar concesiones."
 ca_central_america.18.c:0 "Usar mano dura."
 ca_central_america.18.v2a:0 "Seguir al movimiento: Costa Rica se gobernará sola."
 ca_central_america.18.v2b:0 "Contener a los separatistas."
 ca_central_america.18.v2c:0 "Pedir a la Federación que intervenga."
 ca_central_america.19.t:0 "Separatismo en Nicaragua"
 ca_central_america.19.d:0 "Las eternas disputas entre León y Granada han encontrado, por una vez, un enemigo común: el gobierno federal. La Asamblea Constituyente de Nicaragua debate si el Estado debe asumir la plena soberanía y dejar una Federación que no le trae más que impuestos y reclutamientos."
 ca_central_america.19.d2:0 "La Asamblea Constituyente debate si Nicaragua debe asumir la plena soberanía. León y Granada, por una vez, están de acuerdo en algo: la Federación les ha fallado."
 ca_central_america.19.f:0 "Ni León ni Granada obedecerán a Guatemala."
 ca_central_america.19.a:0 "Reconocer la autonomía de Nicaragua."
 ca_central_america.19.b:0 "Negociar concesiones."
 ca_central_america.19.c:0 "Usar mano dura."
 ca_central_america.19.v2a:0 "Seguir al movimiento: Nicaragua se gobernará sola."
 ca_central_america.19.v2b:0 "Contener a los separatistas."
 ca_central_america.19.v2c:0 "Pedir a la Federación que intervenga."
 ca_central_america.20.t:0 "Separatismo en Guatemala"
 ca_central_america.20.d:0 "La élite conservadora de Guatemala, el clero y los ejércitos campesinos de Rafael Carrera han derribado el orden liberal. En la Ciudad de Guatemala el clan Aycinena habla abiertamente de un Estado que ya no responde al gobierno federal."
 ca_central_america.20.d2:0 "Los conservadores de Guatemala, respaldados por el ejército campesino de Carrera, quieren que el Estado rompa con el gobierno federal y sus reformas liberales."
 ca_central_america.20.f:0 "Guatemala puede vivir sin la Federación."
 ca_central_america.20.a:0 "Reconocer la autonomía de Guatemala."
 ca_central_america.20.b:0 "Negociar concesiones."
 ca_central_america.20.c:0 "Usar mano dura."
 ca_central_america.20.v2a:0 "Seguir al movimiento: Guatemala se gobernará sola."
 ca_central_america.20.v2b:0 "Contener a los separatistas."
 ca_central_america.20.v2c:0 "Pedir a la Federación que intervenga."
 ca_central_america.21.t:0 "Separatismo en Honduras"
 ca_central_america.21.d:0 "Hasta en la patria de Morazán crece el descontento. La Asamblea hondureña en Comayagua se queja de una guerra que no eligió y de un gobierno federal que se lleva sus hombres y su plata. Muchos diputados hablan ya de una Honduras independiente."
 ca_central_america.21.d2:0 "La Asamblea de Comayagua está lista para declarar que Honduras se gobernará sola. Hasta la patria de Morazán está cansada de las guerras de la Federación."
 ca_central_america.21.f:0 "Honduras no será el campo de batalla de otros."
 ca_central_america.21.a:0 "Reconocer la autonomía de Honduras."
 ca_central_america.21.b:0 "Negociar concesiones."
 ca_central_america.21.c:0 "Usar mano dura."
 ca_central_america.21.v2a:0 "Seguir al movimiento: Honduras se gobernará sola."
 ca_central_america.21.v2b:0 "Contener a los separatistas."
 ca_central_america.21.v2c:0 "Pedir a la Federación que intervenga."
 ca_central_america.22.t:0 "Separatismo en El Salvador"
 ca_central_america.22.d:0 "San Salvador ha sido el corazón de la Federación, pero la Federación agoniza. Idos los demás Estados, los notables salvadoreños se preguntan por qué deben cargar con el peso de una República que ya no existe en ninguna otra parte."
 ca_central_america.22.d2:0 "Los notables de San Salvador sostienen que El Salvador no puede cargar solo con el peso de una Federación que ya no existe en ninguna otra parte."
 ca_central_america.22.f:0 "El corazón de la Federación está enfermo."
 ca_central_america.22.a:0 "Reconocer la autonomía de El Salvador."
 ca_central_america.22.b:0 "Negociar concesiones."
 ca_central_america.22.c:0 "Usar mano dura."
 ca_central_america.22.v2a:0 "Seguir al movimiento: El Salvador se gobernará solo."
 ca_central_america.22.v2b:0 "Contener a los separatistas."
 ca_central_america.22.v2c:0 "Pedir a la Federación que intervenga."
 ca_central_america.23.t:0 "La cuestión de Los Altos"
 ca_central_america.23.d2:0 "Los liberales de Quetzaltenango ya no confían en que la Federación proteja al Sexto Estado de Guatemala. Algunos quieren separarse y valerse por sí mismos; otros todavía esperan que lleguen las tropas federales."
 ca_central_america.23.f:0 "Los Altos se cuidan solos."
 ca_central_america.23.v2a:0 "Seguir al movimiento: Los Altos se gobernará solo."
 ca_central_america.23.v2b:0 "Contener a los separatistas."
 ca_central_america.23.v2c:0 "Pedir a la Federación que intervenga."
 ca_central_america.24.t:0 "Oposición a la secesión"
 ca_central_america.24.d:0 "Unionistas y liberales radicales han salido a las calles de [SCOPE.sCountry('secession_country').GetName] para protestar contra la separación de la Federación. Sus dirigentes exigen que el Estado vuelva a la Unión."
 ca_central_america.24.f:0 "«¡Viva la Federación!»"
 ca_central_america.24.a:0 "Apoyar a los manifestantes."
 ca_central_america.24.b:0 "Llamar a la calma y al orden."
 ca_central_america.24.c:0 "Reprimir a los unionistas."
 ca_central_america.24.e:0 "Negociar con ellos."
 ca_central_america.25.t:0 "Aceptación de la secesión"
 ca_central_america.25.d:0 "En [SCOPE.sCountry('secession_country').GetName] la separación se ha recibido con más alivio que enojo. El cansancio de la guerra está en todas partes y muchos ven ahora en el gobierno del propio Estado el único capaz de mantener la paz."
 ca_central_america.25.f:0 "Es hora de dejarlos ir."
 ca_central_america.25.a:0 "Es la voluntad del pueblo."
 ca_central_america.25.b:0 "Es una traición cobarde."
 ca_central_america.25.c:0 "Consolidar la separación."
 ca_central_america.25.e:0 "Ofrecer a la Federación un pacto de amistad."
 ca_central_america.45.t:0 "Independencia de Costa Rica"
 ca_central_america.45.d:0 "El 15 de noviembre de 1838, la Asamblea de Costa Rica ha declarado que el Estado es libre, soberano e independiente, y que ya no enviará diputados al Congreso federal."
 ca_central_america.45.f:0 "Un camino solitario."
 ca_central_america.45.d_petition:0 "El gobierno de Costa Rica ha pedido formalmente a la Federación que reconozca su plena soberanía. Sus enviados insisten en que quieren la paz con sus vecinos, pero ya no obedecerán al gobierno federal."
 ca_central_america.45.a:0 "Reconocer la independencia de Costa Rica."
 ca_central_america.45.b:0 "Negarse: Costa Rica pertenece a la Unión."
 ca_central_america.46.t:0 "Independencia de Nicaragua"
 ca_central_america.46.d:0 "El 30 de abril de 1838, la Asamblea Constituyente de Nicaragua ha declarado que el Estado es libre, soberano e independiente de la Federación."
 ca_central_america.46.f:0 "Comienza la ruptura."
 ca_central_america.46.d_petition:0 "El gobierno de Nicaragua ha pedido formalmente a la Federación que reconozca su plena soberanía. Sus enviados insisten en que quieren la paz con sus vecinos, pero ya no obedecerán al gobierno federal."
 ca_central_america.46.a:0 "Reconocer la independencia de Nicaragua."
 ca_central_america.46.b:0 "Negarse: Nicaragua pertenece a la Unión."
 ca_central_america.47.t:0 "Independencia de Guatemala"
 ca_central_america.47.d:0 "El 17 de abril de 1839, con Rafael Carrera dueño de la capital, Guatemala ha declarado que es un Estado libre e independiente y ha derogado las leyes federales."
 ca_central_america.47.f:0 "El gigante despierta."
 ca_central_america.47.d_petition:0 "El gobierno de Guatemala ha pedido formalmente a la Federación que reconozca su plena soberanía. Sus enviados insisten en que quieren la paz con sus vecinos, pero ya no obedecerán al gobierno federal."
 ca_central_america.47.a:0 "Reconocer la independencia de Guatemala."
 ca_central_america.47.b:0 "Negarse: Guatemala pertenece a la Unión."
 ca_central_america.48.t:0 "Independencia de Honduras"
 ca_central_america.48.d:0 "El 26 de octubre de 1838, la Asamblea de Comayagua ha declarado que Honduras es un Estado libre, soberano e independiente."
 ca_central_america.48.f:0 "Hasta la patria de Morazán se va."
 ca_central_america.48.d_petition:0 "El gobierno de Honduras ha pedido formalmente a la Federación que reconozca su plena soberanía. Sus enviados insisten en que quieren la paz con sus vecinos, pero ya no obedecerán al gobierno federal."
 ca_central_america.48.a:0 "Reconocer la independencia de Honduras."
 ca_central_america.48.b:0 "Negarse: Honduras pertenece a la Unión."
 ca_central_america.99.t:0 "Independencia de El Salvador"
 ca_central_america.99.d:0 "El 30 de enero de 1841, la Asamblea Constituyente de El Salvador ha declarado el Estado libre e independiente. El último baluarte de la Federación ha caído."
 ca_central_america.99.f:0 "El corazón deja de latir."
 ca_central_america.99.d_petition:0 "El gobierno de El Salvador ha pedido formalmente a la Federación que reconozca su plena soberanía. Sus enviados insisten en que quieren la paz con sus vecinos, pero ya no obedecerán al gobierno federal."
 ca_central_america.99.a:0 "Reconocer la independencia de El Salvador."
 ca_central_america.99.b:0 "Negarse: El Salvador pertenece a la Unión."
 ca_central_america.26.t:0 "Costa Rica: la cuestión de la independencia"
 ca_central_america.26.d:0 "Los separatistas han ganado la lucha dentro de Costa Rica. El Estado sigue perteneciendo a la Federación de nombre, pero su gobierno ya no la obedece. Ha llegado la hora de decidir cómo irse."
 ca_central_america.26.d_denied:0 "El gobierno federal se ha negado a reconocer la independencia de Costa Rica. Nuestros dirigentes deben elegir ahora entre someterse a la Unión o tomar las armas."
 ca_central_america.26.f:0 "Una despedida, con o sin disparos."
 ca_central_america.26.a:0 "Declarar la independencia en paz."
 ca_central_america.26.b:0 "Declarar la independencia en armas."
 ca_central_america.26.c:0 "Esperar un momento mejor."
 ca_central_america.26.d_opt:0 "Someterse a la Unión."
