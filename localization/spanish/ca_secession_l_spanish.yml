 ca_central_america.armed_war_tt:0 "[SCOPE.sCountry('secession_country').GetName] librará una #bold guerra de independencia#! contra la Federación.\nSi ganamos, sigue en la Unión (con lealtad #bold Rebelde#!, o anexionado en la ruta centralista). Si gana, será independiente."
 ca_central_america.50.t:0 "Los federalistas se imponen en El Salvador"
 ca_central_america.50.d:0 "Los federalistas han ganado la lucha dentro de El Salvador. Los separatistas han perdido el control del gobierno y el Estado vuelve a mirar hacia la Unión."
 ca_central_america.50.f:0 "La Unión todavía tiene amigos."
 ca_central_america.50.a:0 "Reincorporarlo como provincia federal."
 ca_central_america.50.b:0 "Mantenerlo como Estado miembro."
