l_spanish:
 # ============================================================
 # CAFM - Diario: La Deuda Inglesa
 # ============================================================
 je_ca_british_debt:0 "La Deuda Inglesa"
 je_ca_british_debt_reason:0 "En 1825 la Federación contrató en Londres un empréstito con la casa Barclay, Herring, Richardson & Co. para sostener a la joven república. La casa quebró al año siguiente y el Tesoro federal recibió apenas una fracción del dinero prometido, pero los bonos quedaron vivos en manos de los inversionistas de la City. Desde entonces, la 'deuda inglesa' pesa sobre las finanzas centroamericanas y sobre cada negociación con Su Majestad Británica."

 je_ca_british_debt_status_4:0 "La Federación carga con la totalidad del empréstito de Londres."
 je_ca_british_debt_status_3:0 "Aún debemos una parte considerable de la deuda inglesa."
 je_ca_british_debt_status_2:0 "Nuestra cuota de la deuda inglesa sigue siendo una carga para el Tesoro."
 je_ca_british_debt_status_1:0 "Solo queda un último tramo de la deuda inglesa por liquidar."

 je_ca_british_debt_paid_tt:0 "Se ha liquidado toda nuestra parte de la #v Deuda Inglesa#!"
 je_ca_british_debt_repudiated_tt:0 "Hemos #n repudiado#! la #v Deuda Inglesa#!"
 je_ca_british_debt_negotiation_cooldown_tt:0 "No hemos pedido una conversión de la deuda en los últimos #v 5#! años"

 # --- Botones ---
 je_ca_british_debt_negotiation_button:0 "Solicitar conversión de la deuda"
 je_ca_british_debt_negotiation_button_desc:0 "Enviar a nuestro agente financiero a Londres para proponer a los bonistas una conversión de los bonos en condiciones más favorables. Gran Bretaña decidirá si acepta."
 je_ca_british_debt_payment_button:0 "Pago extraordinario"
 je_ca_british_debt_payment_button_desc:0 "Destinar #v 25,000#! libras del Tesoro para amortizar un tramo de la deuda inglesa."
 je_ca_british_debt_repudiate_button:0 "Repudiar la deuda"
 je_ca_british_debt_repudiate_button_desc:0 "Declarar que esta nación no reconoce los compromisos contraídos en Londres. Los pagos cesarán, pero ningún banquero europeo volverá a confiar en nosotros por mucho tiempo."

 # --- Modificadores ---
 modifier_ca_british_debt_4:0 "Empréstito de Londres (completo)"
 modifier_ca_british_debt_4_desc:0 "Los intereses de todo el empréstito federal se pagan a los bonistas londinenses."
 modifier_ca_british_debt_3:0 "Empréstito de Londres (cuota mayor)"
 modifier_ca_british_debt_3_desc:0 "Pagamos la mayor cuota del empréstito federal repartido entre los Estados."
 modifier_ca_british_debt_2:0 "Empréstito de Londres (cuota media)"
 modifier_ca_british_debt_2_desc:0 "Pagamos nuestra cuota del empréstito federal repartido entre los Estados."
 modifier_ca_british_debt_1:0 "Empréstito de Londres (último tramo)"
 modifier_ca_british_debt_1_desc:0 "Solo queda un pequeño saldo de la deuda con los bonistas londinenses."
 modifier_ca_british_debt_good_credit:0 "Buen crédito en la City"
 modifier_ca_british_debt_good_credit_desc:0 "Haber honrado la deuda inglesa nos abre las puertas de los bancos de Londres."
 modifier_ca_british_debt_sovereign_finances:0 "Finanzas soberanas"
 modifier_ca_british_debt_sovereign_finances_desc:0 "Ningún banquero extranjero tiene ya derecho sobre nuestras aduanas."
 modifier_ca_british_debt_repudiated:0 "Deuda repudiada"
 modifier_ca_british_debt_repudiated_desc:0 "Tras repudiar la deuda inglesa, ningún prestamista extranjero confía en nuestra firma."

 # --- Eventos ---
 ca_british_debt.1.t:0 "La Deuda Inglesa, saldada"
 ca_british_debt.1.d:0 "Con el último pago enviado a Londres, nuestra parte del viejo empréstito federal queda liquidada. Los bonistas de la City retiran sus reclamos y, por primera vez desde la independencia, las rentas de nuestras aduanas nos pertenecen por completo."
 ca_british_debt.1.f:0 "\"Una república que paga lo que debe es una república que puede volver a pedir.\""
 ca_british_debt.1.a:0 "Cultivemos nuestro crédito en Londres."
 ca_british_debt.1.b:0 "¡Nunca más dependeremos de banqueros extranjeros!"

 ca_british_debt.2.t:0 "Liquidación en Centroamérica"
 ca_british_debt.2.d:0 "[SCOPE.sCountry('ca_debtor_scope').GetName] ha terminado de pagar su parte del empréstito centroamericano de 1825. Los tenedores de bonos celebran haber recuperado una inversión que muchos en la City daban por perdida."
 ca_british_debt.2.f:0 "\"Tarde, pero pagaron. Que no se diga que los americanos no cumplen.\""
 ca_british_debt.2.a:0 "Buenas noticias para la City."

 ca_british_debt.3.t:0 "Propuesta de conversión centroamericana"
 ca_british_debt.3.d:0 "El agente financiero de [SCOPE.sCountry('ca_debtor_scope').GetName] ha llegado a Londres con una propuesta: convertir los viejos bonos del empréstito federal en nuevos títulos a menor interés, a cambio de garantías sobre sus aduanas. Los bonistas piden la opinión del Foreign Office."
 ca_british_debt.3.f:0 "\"Más vale cobrar algo que no cobrar nada, y más vale un amigo agradecido que un deudor resentido.\""
 ca_british_debt.3.a:0 "Aconsejar a los bonistas que acepten."
 ca_british_debt.3.b:0 "Que paguen lo que firmaron."

 ca_british_debt.4.t:0 "Londres acepta la conversión"
 ca_british_debt.4.d:0 "Los bonistas, con el visto bueno de [SCOPE.sCountry('britain_scope').GetName], han aceptado nuestra propuesta de conversión. La carga anual de la deuda inglesa se reduce, aunque el gesto no ha sido gratuito: Londres esperará reciprocidad."
 ca_british_debt.4.f:0 "\"Nuestro agente volvió con menos deuda y más compromisos.\""
 ca_british_debt.4.a:0 "Un alivio para el Tesoro."

 ca_british_debt.5.t:0 "Londres rechaza la conversión"
 ca_british_debt.5.d:0 "Los bonistas han rechazado de plano nuestra propuesta y exigen el cumplimiento íntegro de lo pactado. En la prensa londinense se habla con desprecio de las 'repúblicas insolventes' de América Central."
 ca_british_debt.5.f:0 "\"Nos prestaron una fracción y nos cobran el todo.\""
 ca_british_debt.5.a:0 "Recordaremos este desaire."

 ca_british_debt.6.t:0 "Repudio en Centroamérica"
 ca_british_debt.6.d:0 "[SCOPE.sCountry('ca_debtor_scope').GetName] ha declarado que no reconoce la deuda contraída en Londres. Los tenedores de bonos exigen que el gobierno de Su Majestad intervenga en defensa de sus intereses."
 ca_british_debt.6.f:0 "\"Un cañonero frente a sus puertos convencerá a esos señores mejor que cien cartas.\""
 ca_british_debt.6.a:0 "Una protesta formal bastará."
 ca_british_debt.6.b:0 "Enviar un cañonero a sus puertos."
