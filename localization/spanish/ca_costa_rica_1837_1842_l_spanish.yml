l_spanish:
 # =========================================================================
 # CAFM - Costa Rica 1837-1842: new events, modifiers and names
 # Sources: TSE (2008); Villegas Arce, Rev. Ciencias Juridicas (UCR) 131 (2013);
 # Archivo Nacional de Costa Rica; Leiva, Cultura (1942)
 # =========================================================================

 ca_costa_rica_events.192.t:0 "Aguilar en Heredia"
 ca_costa_rica_events.192.d:0 "17 de abril de 1837. Manuel Aguilar Chacón y su vicejefe de Estado, Juan Mora Fernández, han asumido en Heredia. El nuevo jefe de Estado trae un programa de reconciliación: amnistía para los exiliados de la Liga, el fin del fuero militar y una capital compartida entre Heredia, sede del poder legislativo, y San José, sede del ejecutivo y de los tribunales."
 ca_costa_rica_events.192.f:0 "Un gobierno de juristas, vigilado por una ciudad de soldados."
 ca_costa_rica_events.192.a:0 "Amnistía, fin del fuero y poderes compartidos."
 ca_costa_rica_events.192.b:0 "Gobernar con cautela y no tocar el fuero."

 ca_costa_rica_events.193.t:0 "La conspiración de agosto"
 ca_costa_rica_events.193.d:0 "Agosto de 1837. Partidarios de Carrillo han sido sorprendidos planeando derrocar al gobierno. El complot ha fracasado, pero los cuarteles de San José no han olvidado quién les dio su paga y su orgullo."
 ca_costa_rica_events.193.f:0 "Un golpe fallido es un ensayo."
 ca_costa_rica_events.193.a:0 "Desarticularla en silencio."
 ca_costa_rica_events.193.b:0 "Castigar a los carrillistas para escarmiento."
 ca_costa_rica_events.193.c:0 "Ignorarla. No fue nada."

 ca_costa_rica_events.194.t:0 "El jefe de Estado enfermo"
 ca_costa_rica_events.194.d:0 "19 de diciembre de 1837. Manuel Aguilar ha caído enfermo y el vicejefe de Estado Juan Mora Fernández se hace cargo del gobierno hasta febrero. El antiguo jefe de Estado, que medió en Guanacaste hace apenas un año, sostiene ahora un Estado dividido entre los tribunales y los cuarteles."
 ca_costa_rica_events.194.f:0 "Un gobierno enfermo es una invitación."
 ca_costa_rica_events.194.a:0 "Mora gobierna hasta que vuelva Aguilar."

 ca_costa_rica_events.195.t:0 "La renuncia rechazada"
 ca_costa_rica_events.195.d:0 "Marzo de 1838. Agotado y todavía enfermo, Manuel Aguilar ha presentado su renuncia a la Asamblea."
 ca_costa_rica_events.195.f:0 "A algunos hombres se les mantiene en el cargo precisamente porque quieren irse."
 ca_costa_rica_events.195.a:0 "La Asamblea no la aceptará."
 ca_costa_rica_events.195.b:0 "Aceptarla. Asume Juan Mora Fernández."

 ca_costa_rica_events.196.t:0 "La Asamblea Constituyente"
 ca_costa_rica_events.196.d:0 "14 de noviembre de 1838. El Congreso Federal ha autorizado a los estados a organizarse como mejor les parezca, y Nicaragua ya siguió su propio camino. Bajo Carrillo, la Asamblea Constituyente de Costa Rica debe decidir ahora si el Estado sigue en una Federación que lo dejó solo en Bocas del Toro."
 ca_costa_rica_events.196.f:0 "Una Federación que no puede defender a sus miembros ya se ha disuelto sola."
 ca_costa_rica_events.196.a:0 "Costa Rica sale de la Federación."
 ca_costa_rica_events.196.b:0 "Seguir, como Estado federal autónomo."

 ca_costa_rica_events.197.t:0 "La conspiración de Joaquín Mora"
 ca_costa_rica_events.197.d:0 "Enero de 1839. El antiguo jefe de Estado provisional Joaquín Mora Fernández ha sido acusado de conspirar contra Carrillo, e incluso de planear su asesinato. El tribunal lo ha condenado a muerte."
 ca_costa_rica_events.197.f:0 "En el Estado de Carrillo, los tribunales pertenecen al Arquitecto."
 ca_costa_rica_events.197.a:0 "Conmutar la pena por el destierro."
 ca_costa_rica_events.197.b:0 "Que se cumpla la sentencia."
 ca_costa_rica_events.197.c:0 "Indultarlo."

 ca_costa_rica_events.198.t:0 "El asilo en Puntarenas"
 ca_costa_rica_events.198.d:0 "Abril de 1840. Derrotado en El Salvador, Francisco Morazán zarpó de La Libertad en la goleta Izalco con unos treinta veteranos. Ahora la goleta ha aparecido frente a Puntarenas, y el caído presidente de la Federación pide asilo."
 ca_costa_rica_events.198.f:0 "El Águila sin su ejército sigue siendo el Águila."
 ca_costa_rica_events.198.a:0 "Concederle asilo, con la condición de que siga hacia el sur."
 ca_costa_rica_events.198.b:0 "Negarle el desembarco."

 ca_costa_rica_events.205.t:0 "El tratado con el Estado del Istmo"
 ca_costa_rica_events.205.d:0 "22 de septiembre de 1841. El Estado del Istmo, que se ha separado de la Nueva Granada, busca reconocimiento. Sus enviados proponen una frontera en el Escudo de Veraguas, y Costa Rica podría reservarse sus derechos sobre Bocas del Toro."
 ca_costa_rica_events.205.f:0 "Un vecino que nos necesita es un vecino que escucha."
 ca_costa_rica_events.205.a:0 "Reconocer al Istmo y reservar nuestros derechos sobre Bocas."
 ca_costa_rica_events.205.b:0 "Exigir Bocas del Toro a cambio."
 ca_costa_rica_events.205.c:0 "No firmar."

 ca_costa_rica_events.321.t:0 "La anulación de las Bases y Garantías"
 ca_costa_rica_events.321.d:0 "6 de junio de 1842. Morazán ha declarado nulo el Decreto de Bases y Garantías de Carrillo. El jefe de Estado inamovible ya no existe y las municipalidades pueden volver."
 ca_costa_rica_events.321.f:0 "Un decreto borra otro."
 ca_costa_rica_events.321.a:0 "El decreto de la dictadura queda anulado."

 ca_costa_rica_events.322.t:0 "La leva por la Unión"
 ca_costa_rica_events.322.d:0 "Julio de 1842. En Chinandega, El Salvador, Honduras y Nicaragua discuten una confederación sin Morazán. El Águila responde levantando hombres y dinero en Costa Rica para restaurar la Federación por la fuerza. Muchos temen que Carrera intervenga y que hijos costarricenses mueran por una causa que no es la suya."
 ca_costa_rica_events.322.f:0 "La Unión, al parecer, se pagará con moneda costarricense."
 ca_costa_rica_events.322.a:0 "Imponer la leva y los préstamos forzosos."
 ca_costa_rica_events.322.b:0 "Moderar la leva."

 ca_costa_rica_events.323.t:0 "La Ley Fundamental restablecida"
 ca_costa_rica_events.323.d:0 "24 de agosto de 1842. La Asamblea Constituyente ha confirmado la anulación de las Bases y Garantías y ha restablecido la Ley Fundamental de 1825."
 ca_costa_rica_events.323.f:0 "Vuelve la vieja constitución, bajo un nuevo amo."
 ca_costa_rica_events.323.a:0 "La ley de 1825 vuelve a estar en vigor."

 ca_costa_rica_events.341.t:0 "El Pacto de El Jocote"
 ca_costa_rica_events.341.d:0 "11 de abril de 1842. En El Jocote, cerca de Alajuela, el ejército de Villaseñor se ha encontrado con los veteranos de Morazán. Los soldados murmuran que el Águila les ofrece más de lo que Carrillo les dio nunca."
 ca_costa_rica_events.341.f:0 "Todo depende de la lealtad de un solo ejército."
 ca_costa_rica_events.341.a:0 "El Pacto de El Jocote: el ejército se pasa a Morazán."
 ca_costa_rica_events.341.b:0 "Villaseñor se mantiene firme. El invasor es rechazado."

 ca_costa_rica_events.351.t:0 "La elección de Alfaro"
 ca_costa_rica_events.351.d:0 "27 de septiembre de 1842. António Pinto Soares, que encabezó la revuelta contra Morazán, ha entregado el poder tras dieciséis días. José María Alfaro Zamora ha sido elegido jefe de Estado y Costa Rica restablece sus relaciones con el resto de Centroamérica."
 ca_costa_rica_events.351.f:0 "Un soldado portugués salvó al Estado y lo devolvió."
 ca_costa_rica_events.351.a:0 "¡Viva el jefe de Estado Alfaro!"

 # --- Modifiers ---
 ca_cos_ciudad_heroica:0 "Ciudad heroica"
 ca_cos_ciudad_heroica_desc:0 "La Asamblea ha premiado a Guanacaste por rechazar a Quijano."
 ca_cos_reconciliacion_1837:0 "La reconciliación de 1837"
 ca_cos_reconciliacion_1837_desc:0 "El gobierno de Aguilar busca sanar las heridas de la Guerra de la Liga."
 ca_cos_censura_panfletos:0 "Panfletos quemados"
 ca_cos_censura_panfletos_desc:0 "La caza del manifiesto de Morazán mantiene ocupadas a las autoridades."
 ca_cos_estabilidad_carrillista:0 "Un Estado consolidado"
 ca_cos_estabilidad_carrillista_desc:0 "Las instituciones de San José han sobrevivido a las tormentas de la década de 1830."

 # --- Names ---
 Villasenor:0 "Villaseñor"

 # --- Existing modifiers that had no localization in the repo ---
 ca_cos_prestige_gain:0 "Prestigio nacional"
 ca_cos_prestige_gain_desc:0 "Los éxitos recientes han elevado la reputación del Estado."
 ca_cos_prestige_gain_small:0 "Un pequeño triunfo"
 ca_cos_prestige_gain_small_desc:0 "Un éxito modesto ha elevado la reputación del Estado."
 ca_cos_prestige_loss:0 "Humillación nacional"
 ca_cos_prestige_loss_desc:0 "Una humillación reciente ha dañado la reputación del Estado."
 ca_cos_prestige_loss_small:0 "Un pequeño revés"
 ca_cos_prestige_loss_small_desc:0 "Un revés menor ha dañado la reputación del Estado."
 ca_cos_ig_suppressed:0 "Reprimido por el gobierno"
 ca_cos_ig_suppressed_desc:0 "El gobierno ha recortado la influencia de este grupo."
 ca_cos_education_reform:0 "Reforma educativa"
 ca_cos_education_reform_desc:0 "Nuevas escuelas y una nueva universidad están formando a una generación."
