 ca_costa_rica_events.9.t:0 "El informe de Jiménez"
 ca_costa_rica_events.9.d:0 "10 de septiembre de 1836. El teniente Rafael Jiménez, el comandante que Carrillo envió a la guarnición de Guanacaste, ha entregado su informe. Hace graves acusaciones contra los hombres que se volvieron contra el gobierno el 29 de junio y nombra a quienes esperaban a Quijano. Lo que San José haga con esta lista decidirá si Guanacaste sigue siendo leal."
