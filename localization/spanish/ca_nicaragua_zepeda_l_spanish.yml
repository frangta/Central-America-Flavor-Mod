l_spanish:
 # =========================================================================
 # CAFM - Zepeda's conditional offer (1836) and Manuel Quijano
 # Source: R. Fernández Guardia, "La guerra de la Liga y la invasión de
 # Quijano", Revista del Archivo Nacional 3 (1939)
 # =========================================================================

 ca_nicaragua_events.8.t:0 "La oferta condicional de Zepeda"
 ca_nicaragua_events.8.d:0 "Primavera de 1836. Manuel Quijano, el oficial que Braulio Carrillo desterró de Costa Rica, ha llegado ante nosotros con Joaquín Bernardo Calvo y los demás exiliados de la Liga. En Masaya ya planean invadir Costa Rica con el apoyo de notables locales. San José, por su parte, nos ofrece 1.000 fardos de tabaco si los detenemos. Nuestra respuesta decidirá lo que ocurra en la frontera sur y quizá la suerte de Guanacaste, que San José nos quitó en 1824."
 ca_nicaragua_events.8.f:0 "En León todavía se habla de Guanacaste como nuestro."
 ca_nicaragua_events.8.a:0 "Que recluten, siempre que no nos comprometan. Si Guanacaste se pronuncia por Nicaragua, tendrá 500 hombres."
 ca_nicaragua_events.8.b:0 "Armar a Quijano abiertamente."
 ca_nicaragua_events.8.c:0 "Aceptar el tabaco de San José y expulsar a Quijano."

