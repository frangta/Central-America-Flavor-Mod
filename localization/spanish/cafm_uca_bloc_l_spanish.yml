 cafm_ig_struggle.1.d_federal:0 "Los federalistas ganan terreno entre [SCOPE.sInterestGroup('ca_struggle_ig').GetName]. Sus reuniones están llenas, y muchos antiguos miembros dicen ahora que la República de Morazán es la única forma de mantener unido el istmo."
 cafm_ig_struggle.1.d_centralist:0 "Los centralistas ganan terreno entre [SCOPE.sInterestGroup('ca_struggle_ig').GetName]. Muchos miembros dicen ahora que solo un gobierno fuerte en Guatemala puede poner orden en la Unión."
 cafm_ig_struggle.1.d_separatist:0 "Los separatistas ganan terreno entre [SCOPE.sInterestGroup('ca_struggle_ig').GetName]. Cada vez más miembros dicen que cada estado debe gobernarse solo y dejar atrás la Unión."
 cafm_ig_struggle.1.f:0 "«Una casa dividida contra sí misma no puede sostenerse.» Todos los bandos de la Unión se disputan ahora a la misma gente."
 cafm_ig_struggle.1.a:0 "Que elijan el nuevo camino"
