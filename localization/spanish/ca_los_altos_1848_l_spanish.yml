l_spanish:
 ca_los_altos_1848.1.t:0 "La restauración de Los Altos"
 ca_los_altos_1848.1.d:0 "Con Carrera fuera del poder y los liberales divididos en la capital, el concejo de Quetzaltenango ha proclamado, una vez más, la separación de Los Altos de Guatemala. El general #bold Agustín Guzmán#!, que mandó el ejército del Sexto Estado hace ocho años, ha sido nombrado presidente interino, y los notables del altiplano prometen elegir un gobierno provisional en pocos días.\n\nSan Salvador no oculta su simpatía por los rebeldes, y los hermanos Cruz levantan gente contra el gobierno en el oriente. Debemos decidir si dejamos ir al altiplano, si compramos su lealtad o si lo traemos de vuelta por la fuerza."
 ca_los_altos_1848.1.f:0 "«El Sexto Estado nunca murió; solo esperaba.»"
 ca_los_altos_1848.1.a:0 "Que Quetzaltenango se gobierne sola."
 ca_los_altos_1848.1.b:0 "Negociar con los notables del altiplano."
 ca_los_altos_1848.1.c:0 "¡Aplastar la rebelión!"
 ca_altos_1848_play:0 "Reincorporación de Los Altos"
