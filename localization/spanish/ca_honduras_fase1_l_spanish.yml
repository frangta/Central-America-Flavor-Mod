 # --- Diario je_ca_hon_caudillo ---
 je_ca_hon_caudillo:0 "La Sombra del Caudillo"
 je_ca_hon_caudillo_reason:0 "Honduras tiene un jefe, una Asamblea y una constitución, pero los hombres armados obedecen al comandante de armas. Cuanto más sube este valor, más gobiernan los cuarteles en lugar de la ley. A 40 entra en escena Francisco Ferrera; a 80 el régimen del comandante es abierto."
 je_ca_hon_caudillo_status_baja:0 "El gobierno civil todavía manda."
 je_ca_hon_caudillo_status_alta:0 "El comandante de armas pesa en cada decisión."
 je_ca_hon_caudillo_status_regimen:0 "Los cuarteles gobiernan en todo salvo en el nombre."
 je_ca_hon_caudillo_complete:0 "El caudillo se va al exilio."
 je_ca_hon_caudillo_fail:0 "El caudillo gobierna de por vida."

 # --- Modificadores ---
 hon_estado_inacabado:0 "Un Estado inacabado"
 hon_estado_inacabado_desc:0 "Ningún camino carretero une el interior con las costas, el contrabando vacía el tesoro y el Estado no tiene el monopolio de la violencia."
 hon_milicias_comarca:0 "Milicias de partido"
 hon_milicias_comarca_desc:0 "Las milicias rurales obedecen a sus hacendados y al comandante de armas antes que al gobierno civil."
 hon_media_leche:0 "La moneda de media leche"
 hon_media_leche_desc:0 "La moneda provisional de 1832, mitad plata y mitad cobre, se rechaza en muchos pueblos."
 hon_sede_tegucigalpa:0 "Gobierno en Tegucigalpa"
 hon_sede_tegucigalpa_desc:0 "El gobierno reside junto a las minas de plata y la Casa de Moneda."
 hon_sede_alterna:0 "Una capital alterna"
 hon_sede_alterna_desc:0 "El gobierno se traslada entre Comayagua y Tegucigalpa: costoso para la administración, pero ninguna ciudad se siente abandonada."
 hon_reforma_administrativa:0 "Reforma de la administración interior"
 hon_reforma_administrativa_desc:0 "La reforma de Rivera busca estabilidad y respeto para el Estado mediante una administración más sencilla y enérgica."
 hon_orden_militar:0 "Orden militar"
 hon_orden_militar_desc:0 "El comandante de armas mantiene el orden con el ejército, por encima de las autoridades civiles."
 hon_concesiones_mineras:0 "Concesiones mineras"
 hon_concesiones_mineras_desc:0 "Casas extranjeras explotan las viejas minas de Tegucigalpa y Yuscarán."
 hon_casa_de_moneda:0 "La Casa de Moneda de Tegucigalpa"
 hon_casa_de_moneda_desc:0 "La plata hondureña se acuña en moneda hondureña."
 hon_contrata_caoba:0 "La contrata de la caoba"
 hon_contrata_caoba_desc:0 "Cortadores británicos de Belice talan caoba en la costa norte bajo un contrato federal."
 hon_amnistia:0 "La amnistía de 1836"
 hon_amnistia_desc:0 "El gobierno indultó a los amotinados de Tegucigalpa, salvo a quienes siguen conspirando."
 hon_tegucigalpa_asolada:0 "Tegucigalpa asolada"
 hon_tegucigalpa_asolada_desc:0 "Las tropas retomaron la ciudad, pero muchos de sus habitantes no han vuelto a las minas."
 hon_cabildos:0 "Concesiones a los cabildos"
 hon_cabildos_desc:0 "El gobierno compró la paz de los cabildos a costa de su propia autoridad."
 hon_vacio_de_poder:0 "Vacío de poder"
 hon_vacio_de_poder_desc:0 "Un consejero provisional gobierna hasta que asuma un jefe electo."
 hon_prorroga_rivera:0 "La prórroga de Rivera"
 hon_prorroga_rivera_desc:0 "El jefe sigue en el cargo con el mandato vencido, contra las formas que antes defendía."
 hon_regimen_comandante:0 "El régimen del comandante"
 hon_regimen_comandante_desc:0 "Quienquiera que ocupe la silla del jefe, decide el comandante de armas."
