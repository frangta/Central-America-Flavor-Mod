 # =====================================================================
 # CAFM — HONDURAS — FASE 1 (1836–1837)
 # .1.c y .2–.7 de ca_honduras_events, diario je_ca_hon_caudillo y modificadores hon_*.
 # Los textos antiguos ca_honduras_events.2.* se quitaron de ca_events_flavor_1_l_english.yml.
 # =====================================================================

 ca_honduras_events.1.c:0 "Tomar las riendas de Honduras."

 # --- .2 Dos ciudades, un Estado ---
 ca_honduras_events.2.t:0 "Dos ciudades, un Estado"
 ca_honduras_events.2.d:0 "Desde 1830 Comayagua es nuestra capital permanente, sede del obispo y de la Asamblea. Pero la plata sale de Tegucigalpa, donde la Casa de Moneda acuña desde 1831 y los comerciantes llevan sus cuentas. Entre ambas hay montañas sin un solo camino carretero. La moneda de cobre de 1832 se rechaza en la mitad de los pueblos, los puertos de Omoa y Trujillo pagan sus derechos a la Federación y, en el campo, las milicias obedecen a sus hacendados antes que al jefe Joaquín Rivera. ¿Desde qué ciudad se gobernará este Estado inacabado?"
 ca_honduras_events.2.f:0 "Honduras tiene un mapa, un jefe y una Asamblea. Todavía no tiene caminos."
 ca_honduras_events.2.a:0 "Comayagua sigue siendo la capital, como manda la ley."
 ca_honduras_events.2.b:0 "El dinero está en Tegucigalpa; el gobierno también debería estarlo."
 ca_honduras_events.2.c:0 "Que el gobierno resida por turnos en ambas ciudades."

 # --- .3 La encrucijada de Rivera ---
 ca_honduras_events.3.t:0 "La encrucijada de Rivera"
 ca_honduras_events.3.d:0 "El primero de junio, el jefe Joaquín Rivera habló ante la Asamblea. Le pidió reformar la administración interior por «el método más sencillo y enérgico», para que el Estado ganara estabilidad y respeto, y proteger las vidas y las propiedades de los criminales que cruzan nuestras fronteras. Detrás de las palabras hay un tesoro vacío. A los soldados no se les ha pagado, la Iglesia conserva sus rentas y el mandato de Rivera termina en diciembre sin sucesor electo. El vicejefe y comandante Francisco Ferrera observa y espera."
 ca_honduras_events.3.f:0 "Rivera había rechazado una vez el poder porque ninguna elección se lo había dado. Ahora debe sostenerlo sin dinero."
 ca_honduras_events.3.a:0 "Reformar la administración, pagar la deuda y respetar la ley."
 ca_honduras_events.3.b:0 "Las rentas del clero pagarán las cuentas del Estado."
 ca_honduras_events.3.c:0 "Que el comandante de armas restablezca el orden."

 # --- .4 La plata de Tegucigalpa ---
 ca_honduras_events.4.t:0 "La plata de Tegucigalpa"
 ca_honduras_events.4.d:0 "Las reformas de Rivera necesitan ingresos, y la única riqueza que Honduras exporta en cantidad está en los viejos distritos mineros de Tegucigalpa y Yuscarán. Casas extranjeras ofrecen capital a cambio de concesiones. Otros nos piden fortalecer la Casa de Moneda, para que nuestra plata sea moneda nuestra y no de Guatemala."
 ca_honduras_events.4.f:0 "Durante dos siglos la plata de Tegucigalpa llenó otros tesoros."
 ca_honduras_events.4.a:0 "Otorgar concesiones a las casas mineras extranjeras."
 ca_honduras_events.4.b:0 "Invertir en la Casa de Moneda de Tegucigalpa."
 ca_honduras_events.4.c:0 "Dejar las minas a los dueños locales."

 # --- .5 La caoba de la costa norte ---
 ca_honduras_events.5.t:0 "La caoba de la costa norte"
 ca_honduras_events.5.d:0 "El gobierno federal ha concedido a comerciantes británicos de Belice un contrato para cortar caoba en nuestra costa norte, de Omoa a Trujillo. Los troncos salen en barcos británicos, los derechos van a la Federación y Honduras ve poco de ambos. Nuestros funcionarios en la costa preguntan si debemos respetar el contrato o exigir nuestra parte."
 ca_honduras_events.5.f:0 "En la costa norte, las hachas británicas llegan más lejos que la ley hondureña."
 ca_honduras_events.5.a:0 "Respetar el contrato federal."
 ca_honduras_events.5.b:0 "Exigir que Honduras reciba su parte."

 # --- .6 Navidad de fuego en Tegucigalpa ---
 ca_honduras_events.6.t:0 "Una Navidad de fuego en Tegucigalpa"
 ca_honduras_events.6.d:0 "El veinticuatro de diciembre estalló un motín contra las autoridades de Tegucigalpa que se extendió a varios pueblos del partido. La mayoría de los habitantes huyó a los montes y la ciudad quedó desierta. El levantamiento llega una semana antes de que venza el mandato de Rivera sin sucesor electo, y todas las facciones se preguntan quién gobernará en enero."
 ca_honduras_events.6.f:0 "«La ciudad quedó desolada, pues la mayor parte de sus habitantes huyó a los montes.» — Lorenzo Montúfar"
 ca_honduras_events.6.a:0 "Conceder una amnistía, salvo a quienes sigan conspirando."
 ca_honduras_events.6.b:0 "Que lo resuelvan las tropas."
 ca_honduras_events.6.c:0 "Negociar con los cabildos."

 # --- .7 El mandato vencido ---
 ca_honduras_events.7.t:0 "El mandato vencido"
 ca_honduras_events.7.d:0 "El mandato de Joaquín Rivera termina el último día de 1836 y ninguna elección ha producido un sucesor. La ley deja el ejecutivo a un miembro del Consejo hasta que la Asamblea pueda reunirse. Rivera siempre ha respetado las formas legales, pero el ejército, el clero y los comerciantes de Tegucigalpa tienen cada uno su propia idea de quién debe gobernar."
 ca_honduras_events.7.f:0 "Un jefe sin sucesor, un Estado sin gobierno."
 ca_honduras_events.7.a:0 "Rivera entrega el poder al consejero José María Martínez Salinas."
 ca_honduras_events.7.b:0 "Rivera prorroga su propio mandato hasta que vuelva el orden."
 ca_honduras_events.7.c:0 "El comandante de armas toma el poder."

