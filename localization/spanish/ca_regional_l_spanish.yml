l_spanish:
 # CAFM - F14 - Regional: Bocas del Toro, el Istmo, Talamanca y el Soconusco
 ca_central_america.6.t:0 "La cuestión de Bocas del Toro"
 ca_central_america.6.d:0 "Bocas del Toro, el puesto federal en el Caribe, es codiciado por dos potencias. Gran Bretaña, protectora de la Costa de los Mosquitos, lo quiere para su comercio; la Nueva Granada lo reclama como parte del Istmo. La Federación solo puede vigilar la costa y esperar."
 ca_central_america.6.f:0 "«Unas cuantas chozas, una laguna y tres banderas.»"
 ca_central_america.6.a:0 "Vigilar la costa."
 ca_central_america.6.a.tt:0 "Gran Bretaña y la Nueva Granada decidirán qué hacer con Bocas del Toro."
 ca_central_america.7.t:0 "Bocas del Toro: decide Gran Bretaña"
 ca_central_america.7.d:0 "La Federación Centroamericana le debe a Londres una fortuna que no puede pagar. En el Foreign Office algunos proponen tomar Bocas del Toro como pago; otros prefieren mantener la influencia británica mediante el protectorado de la Mosquitia, sin nuevas colonias."
 ca_central_america.7.d2:0 "La laguna de Bocas del Toro sería una buena base para el comercio británico en la costa caribe. En el Foreign Office algunos quieren tomarla; otros prefieren mantener la influencia británica mediante el protectorado de la Mosquitia, sin nuevas colonias."
 ca_central_america.7.f:0 "«El comercio sigue a la bandera, o la bandera sigue al comercio.»"
 ca_central_america.7.a:0 "Nos basta nuestra influencia a través de la Mosquitia."
 ca_central_america.7.b:0 "Tomar Bocas del Toro."
 ca_central_america.7.debt_tt:0 "Se condona parte de la deuda centroamericana a cambio del territorio."
 ca_central_america.8.t:0 "Bocas del Toro: decide la Nueva Granada"
 ca_central_america.8.d:0 "Bocas del Toro está en la frontera del antiguo virreinato y, para Bogotá, pertenece al Istmo. Una pequeña expedición desde Cartagena podría zanjar el asunto antes de que los centroamericanos reaccionen."
 ca_central_america.8.f:0 "«El título de 1803 es claro.»"
 ca_central_america.8.a:0 "Enviar la expedición desde Cartagena."
 ca_central_america.8.b:0 "Protestar y mantener nuestro reclamo."
 ca_central_america.9.t:0 "Bocas del Toro: decide la Federación"
 ca_central_america.9.d:0 "El Congreso Federal debe decidir qué hacer con su puesto en el Caribe. El general de origen irlandés Juan Galindo se ofrece a dirigir una expedición a Bocas y a la Costa de los Mosquitos. Algunos ministros van más lejos: convertir Bocas en un protectorado bajo su mando."
 ca_central_america.9.f:0 "«Galindo conoce la costa mejor que cualquiera de nosotros.»"
 ca_central_america.9.a:0 "Promulgar el decreto federal y enviar a Galindo."
 ca_central_america.9.b:0 "Crear un protectorado bajo Galindo."
 ca_central_america.10.t:0 "La Federación y su dependencia"
 ca_central_america.10.d:0 "La pequeña República de Bocas del Toro sobrevive bajo Galindo, pero no puede defenderse sola. Londres y Bogotá la vigilan. ¿Cuánto está dispuesta a dar la Federación?"
 ca_central_america.10.f:0 "«Una bandera necesita soldados para seguir en pie.»"
 ca_central_america.10.a:0 "Enviar una guarnición federal."
 ca_central_america.10.b:0 "Enviar dinero y comercio."
 ca_central_america.10.c:0 "Buscar su reconocimiento internacional."
 ca_central_america.10.opt_d:0 "Dejar Bocas a su suerte."
 ca_central_america.11.t:0 "El destino de Bocas del Toro"
 ca_central_america.11.d:0 "Bocas del Toro está en una encrucijada. Londres, Bogotá y quizá Washington mueven sus fichas. La Federación debe decidir si todavía puede conservar su puesto en el Caribe."
 ca_central_america.11.d2:0 "La pequeña República de Bocas del Toro, bajo protección centroamericana, está en una encrucijada. Todas las potencias con intereses en la costa caribe mueven sus fichas."
 ca_central_america.11.f:0 "«Quien se mueva primero se queda con la laguna.»"
 ca_central_america.11.uca_a:0 "Retirar la guarnición y mantener el reclamo."
 ca_central_america.11.uca_b:0 "Asegurar Bocas del Toro."
 ca_central_america.11.gbr_a:0 "No intervendremos."
 ca_central_america.11.gbr_b:0 "Ofrecer a Bocas nuestra protección."
 ca_central_america.11.clm_a:0 "Ocupar Bocas del Toro."
 ca_central_america.11.clm_b:0 "Reconocer Bocas a cambio de un tratado de límites."
 ca_central_america.11.usa_a:0 "Esto no es asunto nuestro."
 ca_central_america.11.usa_b:0 "Ofrecer un tratado de tránsito y protección."
 ca_central_america.11.weak_tt:0 "Sin guarnición ni dinero, la Federación no puede asegurar Bocas del Toro."
 ca_central_america.11.too_late_tt:0 "Otro se ha movido antes: solo conservamos un reclamo."
 ca_central_america.12.t:0 "La usurpación granadina"
 ca_central_america.12.d:0 "La Nueva Granada ha tomado Bocas del Toro. La Federación protesta, pero su ejército está ocupado en sus propias guerras y su tesoro está vacío. En San José, los costarricenses toman nota de lo poco que la Federación puede hacer por ellos."
 ca_central_america.12.f:0 "«Una protesta no cuesta nada; una guerra lo cuesta todo.»"
 ca_central_america.12.a:0 "Una protesta formal, y silencio."
 ca_central_america.12.b:0 "Guerra para recuperar Bocas del Toro."
 ca_bocas_recovery_play:0 "Recuperación de Bocas del Toro"
 ca_central_america.61.t:0 "El Estado Libre del Istmo"
 ca_central_america.61.d:0 "Mientras la Nueva Granada se desgarra en guerra civil, los notables de Panamá han proclamado el Estado Libre del Istmo. Bogotá debe decidir si negocia con ellos o los aplasta."
 ca_central_america.61.f:0 "«El Istmo pertenece a quienes viven en él.»"
 ca_central_america.61.a:0 "Tolerarlos y negociar."
 ca_central_america.61.b:0 "Aplastar la rebelión."
 ca_isthmus_war_play:0 "Reconquista del Istmo"
 ca_central_america.34.t:0 "El Istmo pide reconocimiento"
 ca_central_america.34.d:0 "El Estado Libre del Istmo ha enviado emisarios para pedirnos que reconozcamos su independencia. Apoyarlo enojaría a la Nueva Granada, pero un Panamá amigo protegería nuestro flanco caribe."
 ca_central_america.34.f:0 "«Un istmo entre dos mares y entre dos naciones.»"
 ca_central_america.34.a:0 "Reconocer y apoyar al Istmo."
 ca_central_america.34.b:0 "No intervendremos."
 ca_central_america.75.t:0 "Guerra en el Istmo"
 ca_central_america.75.d:0 "La Nueva Granada ha enviado su ejército a sofocar el Estado Libre del Istmo. Los notables de Panamá deben elegir entre luchar o volver a Bogotá en las mejores condiciones posibles."
 ca_central_america.75.f:0 "«Mejor un Istmo libre que una provincia tranquila.»"
 ca_central_america.75.a:0 "¡Resistir!"
 ca_central_america.75.b:0 "Negociar nuestro regreso a la Nueva Granada."
 ca_central_america.75.support_tt:0 "Centroamérica envía dinero y armas al Istmo."
 ca_central_america.76.t:0 "El Istmo toma las armas"
 ca_central_america.76.d:0 "Los autonomistas de Panamá han tomado las armas. Quieren un Estado propio y dicen que Bogotá los ha olvidado. La Nueva Granada debe decidir si lucha por el Istmo o lo deja ir."
 ca_central_america.76.f:0 "«Bogotá está lejos y el mar está cerca.»"
 ca_central_america.76.a:0 "Aplastarlos."
 ca_central_america.76.b:0 "Dejarlos ir."
 ca_central_america.60.t:0 "El Istmo vuelve a la Nueva Granada"
 ca_central_america.60.d:0 "El Estado Libre del Istmo ha firmado un acuerdo con Bogotá y vuelve a la Nueva Granada, con promesas de autonomía en las que pocos creen."
 ca_central_america.60.f:0 "«El Istmo vuelve, pero no olvida.»"
 ca_central_america.60.a:0 "Así sea."
 ca_central_america.62.t:0 "El Istmo pide unirse a Centroamérica"
 ca_central_america.62.d:0 "El gobierno de Panamá ha propuesto unirse a Centroamérica como Estado de la Federación. Nos daría el camino entre los dos mares; también nos daría una guerra con la Nueva Granada."
 ca_central_america.62.f:0 "«Dos mares, una Unión.»"
 ca_central_america.62.a:0 "Dar la bienvenida al Istmo a la Federación."
 ca_central_america.62.b:0 "No podemos permitírnoslo."
 ca_central_america.59.t:0 "Panamá se queda solo"
 ca_central_america.59.d:0 "Panamá ha sobrevivido a sus primeros años como Estado independiente. Su fortuna es el tránsito entre los océanos, y todas las grandes potencias lo quieren."
 ca_central_america.59.f:0 "«La encrucijada del mundo.»"
 ca_central_america.59.a:0 "Neutralidad del tránsito."
 ca_central_america.59.b:0 "Buscar un protector poderoso."
 ca_bocas_federal_protection:0 "Protección federal"
 ca_bocas_federal_protection_desc:0 "La Federación garantiza la independencia de Bocas del Toro."
 ca_isthmus_resistance:0 "Resistencia del Istmo"
 ca_isthmus_resistance_desc:0 "La gente del Istmo defiende su Estado Libre."
 ca_isthmus_occupation:0 "Ocupación del Istmo"
 ca_isthmus_occupation_desc:0 "Tropas granadinas patrullan las calles de Panamá."
 ca_isthmus_neutral_transit:0 "Tránsito neutral"
 ca_isthmus_neutral_transit_desc:0 "Panamá vive del tránsito neutral entre los océanos."
 ca_panama_events.1.t:0 "El incidente Russell"
 ca_panama_events.1.d:0 "El vicecónsul británico en Panamá, Joseph Russell, ha sido arrestado tras una riña con las autoridades locales. Londres exige satisfacción y sus buques de guerra ya navegan hacia Cartagena."
 ca_panama_events.1.f:0 "«Quien insulta a un cónsul insulta a la Corona.»"
 ca_panama_events.1.a:0 "Disculparse y pagar una indemnización."
 ca_panama_events.1.b:0 "Nuestros tribunales son soberanos."
 ca_panama_events.2.t:0 "La guarnición de Bocas del Toro"
 ca_panama_events.2.d:0 "Soldados granadinos de Cartagena ocupan ahora Bocas del Toro. Bogotá está satisfecha; los notables de Panamá se preguntan por qué el gobierno es tan generoso en soldados para una laguna y tan tacaño con el Istmo."
 ca_panama_events.2.f:0 "«Soldados para Bocas, nada para Panamá.»"
 ca_panama_events.2.a:0 "Bocas vuelve a ser nuestro."
 ca_panama_events.3.t:0 "La Constitución del Estado del Istmo"
 ca_panama_events.3.d:0 "El Estado Libre del Istmo ha convocado una convención para redactar su constitución. Los liberales quieren una carta federal y laica; los conservadores, un gobernador fuerte y los viejos privilegios."
 ca_panama_events.3.f:0 "«Una constitución para dos mares.»"
 ca_panama_events.3.a:0 "Una constitución liberal."
 ca_panama_events.3.b:0 "Un gobernador fuerte."
 ca_panama_events.4.t:0 "El regreso negociado"
 ca_panama_events.4.d:0 "Bogotá ofrece recuperar el Istmo con una amnistía y promesas de autonomía. La guerra civil en la Nueva Granada termina y el Estado Libre está solo."
 ca_panama_events.4.f:0 "«Mejor volver con honor que ser arrastrados.»"
 ca_panama_events.4.a:0 "Aceptar el acuerdo."
 ca_panama_events.4.b:0 "Rechazarlo: el Istmo sigue libre."
 ca_panama_events.5.t:0 "El Tratado Mallarino-Bidlack"
 ca_panama_events.5.d:0 "Los Estados Unidos proponen un tratado: garantizarán la neutralidad del Istmo y la soberanía de la Nueva Granada sobre él, a cambio del libre tránsito de sus ciudadanos y mercancías."
 ca_panama_events.5.f:0 "«Una garantía que puede convertirse en correa.»"
 ca_panama_events.5.a:0 "Firmar el tratado."
 ca_panama_events.5.b:0 "No necesitamos tutores."
 ca_panama_events.6.t:0 "La fiebre del oro"
 ca_panama_events.6.d:0 "Se ha encontrado oro en California, y el camino más rápido de Nueva York a San Francisco cruza el Istmo. Miles de viajeros llegan a Panamá: traen dinero, enfermedades y problemas."
 ca_panama_events.6.f:0 "«Todos van a California, y todos pasan por aquí.»"
 ca_panama_events.6.a:0 "Abrir el camino y cobrar a los viajeros."
 ca_panama_events.6.b:0 "Controlar estrictamente el tráfico."
 ca_panama_events.7.t:0 "El contrato del ferrocarril"
 ca_panama_events.7.d:0 "Una compañía estadounidense pide el derecho de construir un ferrocarril a través del Istmo, con tierras, el monopolio del tránsito y noventa y nueve años para explotarlo."
 ca_panama_events.7.f:0 "«Noventa y nueve años es mucho tiempo.»"
 ca_panama_events.7.a:0 "Otorgar el contrato."
 ca_panama_events.7.b:0 "Rechazar la concesión."
 ca_panama_events.8.t:0 "El Tratado Clayton-Bulwer"
 ca_panama_events.8.d:0 "Londres y Washington han acordado que ninguno controlará por sí solo un canal entre los océanos. Nadie preguntó a Bogotá, a Panamá ni a los centroamericanos."
 ca_panama_events.8.f:0 "«Las grandes potencias se reparten lo que no es suyo.»"
 ca_panama_events.8.a:0 "Tomar nota."
 ca_panama_events.9.t:0 "Un nuevo puerto en el Atlántico"
 ca_panama_events.9.d:0 "La compañía del ferrocarril ha fundado una nueva ciudad en el extremo atlántico de la línea. Los estadounidenses la llaman Aspinwall, por el financista; el gobierno quiere llamarla Colón."
 ca_panama_events.9.f:0 "«Un nombre es una bandera.»"
 ca_panama_events.9.a:0 "Se llamará Colón."
 ca_panama_events.9.b:0 "Que los estadounidenses la llamen Aspinwall."
 ca_panama_events.10.t:0 "El Estado Federal de Panamá"
 ca_panama_events.10.d:0 "Se ha inaugurado el ferrocarril entre los océanos y el Istmo está más rico y orgulloso que nunca. Sus diputados exigen un Estado Federal con gobierno propio, dentro de la República."
 ca_panama_events.10.f:0 "«Panamá para los panameños, dentro de la República.»"
 ca_panama_events.10.a:0 "Aceptar el Estado Federal."
 ca_panama_events.10.b:0 "El Istmo es una provincia como cualquier otra."
 ca_panama_events.11.t:0 "El peaje del tránsito"
 ca_panama_events.11.d:0 "Cada viajero que cruza el Istmo paga un peaje. Los comerciantes de Panamá dicen que es demasiado alto; el tesoro, que es demasiado bajo."
 ca_panama_events.11.a:0 "Subir el peaje."
 ca_panama_events.11.b:0 "Bajarlo."
 ca_panama_events.12.t:0 "Los arrieros del Camino de Cruces"
 ca_panama_events.12.d:0 "Los arrieros que llevan mercancías por el viejo Camino de Cruces temen los nuevos tiempos. Exigen el monopolio de la ruta."
 ca_panama_events.12.a:0 "Concederles el monopolio."
 ca_panama_events.12.b:0 "El camino es libre para todos."
 ca_panama_events.13.t:0 "Bandidos en el camino"
 ca_panama_events.13.d:0 "Los bandidos atacan las caravanas que cruzan el Istmo. Los viajeros exigen protección y los cónsules extranjeros amenazan con enviar la suya."
 ca_panama_events.13.a:0 "Enviar soldados desde la capital."
 ca_panama_events.13.b:0 "Que el Istmo forme su propia guardia."
 ca_panama_events.14.t:0 "¿Un puerto libre?"
 ca_panama_events.14.d:0 "Los comerciantes de Panamá proponen hacer de la ciudad un puerto libre, sin derechos de aduana, para atraer el comercio de ambos océanos."
 ca_panama_events.14.a:0 "Hacer de Panamá un puerto libre."
 ca_panama_events.14.b:0 "Las aduanas son necesarias."
 ca_panama_events.15.t:0 "El impuesto de tonelaje"
 ca_panama_events.15.d:0 "El tesoro quiere un impuesto por cada tonelada que se embarque a través del Istmo. Las compañías navieras amenazan con llevar su negocio a Nicaragua."
 ca_panama_events.15.a:0 "Imponer el impuesto."
 ca_panama_events.15.b:0 "Nada de impuestos nuevos."
 ca_panama_events.16.t:0 "Intramuros y Arrabal"
 ca_panama_events.16.d:0 "Dentro de las murallas viven los notables blancos; fuera, en el arrabal de Santa Ana, los artesanos y la gente de color. Su rivalidad decide cada elección en Panamá."
 ca_panama_events.16.a:0 "Ponerse del lado de los notables."
 ca_panama_events.16.b:0 "Ponerse del lado del arrabal."
 ca_panama_events.17.t:0 "Fiebre amarilla"
 ca_panama_events.17.d:0 "La fiebre amarilla mata a viajeros y trabajadores por centenares. La ciudad pide médicos y dinero."
 ca_panama_events.17.a:0 "Enviar médicos."
 ca_panama_events.17.b:0 "Panamá se las arreglará sola."
 ca_panama_events.18.t:0 "El cólera en el Istmo"
 ca_panama_events.18.d:0 "El cólera ha llegado con los barcos. Las autoridades debaten si cerrar el puerto o mantener abierto el tránsito."
 ca_panama_events.18.a:0 "Cerrar el puerto."
 ca_panama_events.18.b:0 "Mantener abierto el tránsito."
 ca_panama_events.19.t:0 "Los obreros del ferrocarril"
 ca_panama_events.19.d:0 "Miles de obreros de Jamaica, China e Irlanda han venido a construir el ferrocarril. Están mal pagados y mueren de fiebre; ahora están en huelga."
 ca_panama_events.19.a:0 "Obligarlos a volver al trabajo."
 ca_panama_events.19.b:0 "Mediar con la compañía."
 ca_panama_events.20.t:0 "Comités de vigilancia extranjeros"
 ca_panama_events.20.d:0 "Los viajeros estadounidenses han formado comités de vigilancia para mantener el orden en el camino, y ahorcan a quien quieren."
 ca_panama_events.20.a:0 "Disolverlos por la fuerza."
 ca_panama_events.20.b:0 "Tolerarlos."
 ca_panama_events.21.t:0 "Un gobernador de fuera"
 ca_panama_events.21.d:0 "El gobierno ha nombrado para el Istmo a un gobernador que nunca ha pisado Panamá. Los notables están ofendidos."
 ca_panama_events.21.a:0 "Se queda."
 ca_panama_events.21.b:0 "Nombrar a un nativo del Istmo."
 ca_panama_events.22.t:0 "Un cabildo abierto"
 ca_panama_events.22.d:0 "Los notables de Panamá han convocado un cabildo abierto para discutir los asuntos del Istmo sin esperar órdenes de la capital."
 ca_panama_events.22.a:0 "Prohibirlo."
 ca_panama_events.22.b:0 "Dejar que se reúna."
 ca_panama_events.23.t:0 "[SCOPE.sCharacter('ca_pan_general').GetFullName] se pronuncia"
 ca_panama_events.23.d:0 "[SCOPE.sCharacter('ca_pan_general').GetFullName] ha lanzado un pronunciamiento que exige más autonomía para el Istmo y amenaza con marchar sobre la capital."
 ca_panama_events.23.a:0 "Arrestarlo."
 ca_panama_events.23.b:0 "Negociar con él."
 ca_panama_events.24.t:0 "Contrabando y aduanas"
 ca_panama_events.24.d:0 "El contrabando es el negocio más rentable del Istmo, y los aduaneros son los mejores clientes de los contrabandistas."
 ca_panama_events.24.a:0 "Purgar las aduanas."
 ca_panama_events.24.b:0 "Hacerse de la vista gorda."
 ca_panama_events.25.t:0 "La autonomía en la convención"
 ca_panama_events.25.d:0 "En la convención nacional, los diputados del Istmo exigen un estatuto especial para su provincia."
 ca_panama_events.25.a:0 "Conceder un estatuto especial."
 ca_panama_events.25.b:0 "Una sola ley para todas las provincias."
 ca_panama_events.26.t:0 "Un cañonero extranjero"
 ca_panama_events.26.d:0 "Un cañonero extranjero ha anclado frente a Panamá para proteger a sus ciudadanos. Su capitán da órdenes como si el puerto fuera suyo."
 ca_panama_events.26.a:0 "Protestar con firmeza."
 ca_panama_events.26.b:0 "Pedirle cortésmente que se retire."
 ca_panama_events.27.t:0 "Filibusteros en tránsito"
 ca_panama_events.27.d:0 "Aventureros armados camino de Centroamérica cruzan el Istmo. Dicen que son colonos; nadie les cree."
 ca_panama_events.27.a:0 "Arrestarlos."
 ca_panama_events.27.b:0 "Dejarlos pasar."
 ca_panama_events.28.t:0 "¿Panamá o Nicaragua?"
 ca_panama_events.28.d:0 "Las grandes potencias debaten dónde construir el canal entre los océanos: a través del Istmo de Panamá o por el lago de Nicaragua."
 ca_panama_events.28.a:0 "Hacer gestiones a favor de Panamá."
 ca_panama_events.28.b:0 "Que decidan los ingenieros."
 ca_panama_events.29.t:0 "Los gunas de la costa"
 ca_panama_events.29.d:0 "Los gunas de la costa caribe (Guna Yala) comercian libremente con goletas extranjeras y se niegan a obedecer a las autoridades del Istmo."
 ca_panama_events.29.a:0 "Respetar su autonomía."
 ca_panama_events.29.b:0 "Imponer nuestra autoridad."
 ca_panama_events.30.t:0 "El Darién y los emberá"
 ca_panama_events.30.d:0 "Los emberá de la selva del Darién piden protección contra los colonos que entran en sus tierras."
 ca_panama_events.30.a:0 "Protegerlos."
 ca_panama_events.30.b:0 "La tierra es para los colonos."
 CA_ISTMO_TRANSIT:0 "El tránsito a California"
 CA_ISTMO_RAILROAD:0 "El Ferrocarril de Panamá"
 CA_ISTMO_INDEPENDENT:0 "El Istmo se gobierna solo"
 je_ca_historic_situation_in_panama:0 "La encrucijada del Istmo"
 je_ca_historic_situation_in_panama_reason:0 "El Istmo de Panamá es el camino más estrecho entre los océanos. Sus notables quieren gobernarse solos; la capital quiere conservarlo; las grandes potencias quieren el tránsito. Quien tenga Panamá debe equilibrarlos a todos."
 je_ca_historic_situation_in_panama_goal:0 "Con 100 de autonomía, el Istmo puede alzarse por su independencia; con 0, la capital lo absorbe. Un término medio puede llevar a un Estado Federal."
 je_ca_istmo_status_high:0 "El Istmo quiere gobernarse solo."
 je_ca_istmo_status_low:0 "La capital gobierna el Istmo con mano firme."
 je_ca_istmo_status_mid:0 "El Istmo y la capital mantienen un equilibrio incómodo."
 je_ca_istmo_absorbed_tt:0 "La autonomía del Istmo cae a 0"
 ca_isthmus_federal_state:0 "Estado Federal de Panamá"
 ca_isthmus_federal_state_desc:0 "El Istmo se gobierna como Estado Federal."
 ca_isthmus_absorbed:0 "El Istmo absorbido"
 ca_isthmus_absorbed_desc:0 "La capital gobierna el Istmo directamente."
 ca_isthmus_colon:0 "Colón"
 ca_isthmus_colon_desc:0 "El nuevo puerto del Atlántico lleva el nombre de Colón."
 ca_isthmus_humiliation:0 "Diplomacia de cañonero"
 ca_isthmus_humiliation_desc:0 "Un buque de guerra extranjero da órdenes en nuestro puerto."
 ca_talamanca_events.1.t:0 "Un rey para Talamanca"
 ca_talamanca_events.1.d:0 "Los caciques bribris y cabécares han coronado a Santiago Mayas como rey de Talamanca. El nuevo rey pide ser reconocido y recibir los regalos que recibían sus antepasados."
 ca_talamanca_events.1.f:0 "«En las montañas manda el rey de Talamanca.»"
 ca_talamanca_events.1.a:0 "Reconocerlo y pagarle una asignación."
 ca_talamanca_events.1.b:0 "No reconocemos reyes."
 ca_talamanca_events.2.t:0 "Los caciques como jefes políticos"
 ca_talamanca_events.2.d:0 "El gobierno propone nombrar al rey de Talamanca y a los principales caciques jefes políticos, con un sueldo del Estado. Serían nuestros funcionarios y seguirían siendo señores de su pueblo."
 ca_talamanca_events.2.f:0 "«Un sueldo convierte a un rey en súbdito.»"
 ca_talamanca_events.2.a:0 "Nombrarlos jefes políticos."
 ca_talamanca_events.2.b:0 "Nada de sueldos para caciques."
 ca_talamanca_events.3.t:0 "Un rey de Talamanca en la capital"
 ca_talamanca_events.3.d:0 "El rey de Talamanca ha bajado de las montañas para visitar la capital. Los periódicos se burlan de él; el gobierno debe decidir cómo recibirlo."
 ca_talamanca_events.3.f:0 "«El rey llevaba una casaca prestada.»"
 ca_talamanca_events.3.a:0 "Recibirlo con honores."
 ca_talamanca_events.3.b:0 "Tratarlo como a cualquier otro súbdito."
 ca_talamanca_events.4.t:0 "La crisis sucesoria"
 ca_talamanca_events.4.d:0 "El rey Santiago Mayas ha sido asesinado. William Forbes y otros pretendientes se disputan la corona y los pueblos de la montaña están en guerra. El gobierno puede intervenir, mediar o esperar."
 ca_talamanca_events.4.f:0 "«Una corona sin ley de sucesión es un puñal.»"
 ca_talamanca_events.4.a:0 "Enviar tropas a imponer el orden."
 ca_talamanca_events.4.b:0 "Mediar entre los pretendientes."
 ca_talamanca_events.4.c:0 "Que lo resuelvan ellos."
 ca_talamanca_events.5.t:0 "La colonia de Talamanca"
 ca_talamanca_events.5.d:0 "Un plan propone una colonia agrícola y militar en Talamanca, bajo la protección del nuevo rey, Antonio Saldaña. Colonos, soldados y misioneros abrirían las montañas al Estado."
 ca_talamanca_events.5.f:0 "«Arado, fusil y cruz.»"
 ca_talamanca_events.5.a:0 "Fundar la colonia."
 ca_talamanca_events.5.b:0 "Dejar en paz las montañas."
 ca_talamanca_events.6.t:0 "Misioneros para Talamanca"
 ca_talamanca_events.6.d:0 "Un grupo de misioneros pide permiso para entrar en Talamanca y construir una misión entre los bribris."
 ca_talamanca_events.6.a:0 "Dejarlos ir."
 ca_talamanca_events.6.b:0 "Talamanca no está preparada."
 ca_talamanca_events.7.t:0 "Cacao y carey"
 ca_talamanca_events.7.d:0 "La gente de Talamanca comercia cacao y concha de carey con los comerciantes de Matina. El comercio podría protegerse, o gravarse."
 ca_talamanca_events.7.a:0 "Proteger el comercio."
 ca_talamanca_events.7.b:0 "Gravarlo."
 ca_talamanca_events.8.t:0 "Una incursión misquita"
 ca_talamanca_events.8.d:0 "Saqueadores misquitos han bajado por la costa y atacado los pueblos de Talamanca, llevándose cautivos y bienes."
 ca_talamanca_events.8.a:0 "Enviar tropas a la costa."
 ca_talamanca_events.8.b:0 "No podemos proteger cada pueblo."
 ca_talamanca_events.9.t:0 "Un reclamo sobre Talamanca"
 ca_talamanca_events.9.d:0 "Los dueños de Bocas del Toro afirman que Talamanca pertenece al Istmo, y sus agentes visitan a los caciques."
 ca_talamanca_events.9.a:0 "Rechazar el reclamo con firmeza."
 ca_talamanca_events.9.b:0 "Negociar una frontera."
 ca_talamanca_events.10.t:0 "Un explorador pide una concesión"
 ca_talamanca_events.10.d:0 "Un explorador extranjero pide una concesión en Talamanca: habla de oro, caucho y un camino al Caribe."
 ca_talamanca_events.10.a:0 "Otorgar la concesión."
 ca_talamanca_events.10.b:0 "Negarla."
 ca_talamanca_events.11.t:0 "Exigencias de [SCOPE.sCountry('ca_tal_lord').GetName]"
 ca_talamanca_events.11.d:0 "Nuestro señor, [SCOPE.sCountry('ca_tal_lord').GetName], se entromete en los asuntos de Talamanca. Los ancianos preguntan cómo debemos responder."
 ca_talamanca_events.11.f:0 "«Las montañas siempre han sido nuestras.»"
 ca_talamanca_events.11.a:0 "Aceptar, por ahora."
 ca_talamanca_events.11.b:0 "Resistir."
 ca_button_talamanca_integrate:0 "Integrar Talamanca"
 ca_button_talamanca_integrate_desc:0 "Hacer del rey y los caciques funcionarios del Estado, con una asignación. Influencia #G +0,5#! por mes; cuesta dinero cada mes."
 ca_button_talamanca_conquer:0 "Conquistar Talamanca"
 ca_button_talamanca_conquer_desc:0 "Abrir las montañas por la fuerza, con colonias militares. Influencia #G +0,75#! por mes, pero las relaciones con Talamanca empeoran."
 ca_button_talamanca_coexist:0 "Convivir con Talamanca"
 ca_button_talamanca_coexist_desc:0 "Respetar la autonomía de Talamanca y comerciar con ella. Influencia #G +0,25#! por mes; las relaciones con Talamanca mejoran."
 je_ca_historic_situation_in_talamanca:0 "La cuestión de Talamanca"
 je_ca_historic_situation_in_talamanca_reason:0 "En las montañas de Talamanca, los pueblos bribri y cabécar obedecen a sus propios reyes y caciques. El Estado reclama la tierra pero no la gobierna. Puede integrarlos, conquistarlos o aprender a vivir a su lado."
 je_ca_historic_situation_in_talamanca_goal:0 "Llegar a 100 de influencia en Talamanca por el camino elegido. Con 0, Talamanca se libera."
 je_ca_talamanca_status_integrate:0 "Estamos integrando a los caciques en el Estado."
 je_ca_talamanca_status_conquer:0 "Estamos abriendo Talamanca por la fuerza."
 je_ca_talamanca_status_coexist:0 "Vivimos junto a Talamanca y comerciamos con ella."
 je_ca_talamanca_status_none:0 "Todavía no hemos elegido cómo tratar con Talamanca."
 je_ca_talamanca_complete_tt:0 "La influencia en Talamanca llega a 100"
 je_ca_talamanca_path_tt:0 "Se ha elegido un camino para Talamanca"
 CA_TALAMANCA_PATH_INTEGRATE:0 "Integración de los caciques"
 CA_TALAMANCA_PATH_CONQUER:0 "Colonias militares"
 CA_TALAMANCA_PATH_COEXIST:0 "Comercio y autonomía"
 ca_talamanca_integrated:0 "Talamanca integrada"
 ca_talamanca_integrated_desc:0 "Los caciques de Talamanca sirven al Estado como jefes políticos."
 ca_talamanca_conquered:0 "Talamanca conquistada"
 ca_talamanca_conquered_desc:0 "Las montañas de Talamanca se han abierto por la fuerza."
 ca_talamanca_partnership:0 "Asociación con Talamanca"
 ca_talamanca_partnership_desc:0 "Talamanca conserva su autonomía y comercia libremente con nosotros."
 ca_talamanca_resistance:0 "Resistencia en las montañas"
 ca_talamanca_resistance_desc:0 "La gente de Talamanca resiste la intromisión de su señor."
 ca_los_altos_soconusco_events.1.t:0 "El Soconusco neutral"
 ca_los_altos_soconusco_events.1.d:0 "El Soconusco está en disputa entre México y Centroamérica desde la independencia. En 1825 ambos bandos retiraron sus tropas y la provincia se gobierna sola, pero todos saben que la cuestión no está resuelta."
 ca_los_altos_soconusco_events.1.f:0 "«Ni mexicanos ni guatemaltecos: soconusquenses.»"
 ca_los_altos_soconusco_events.1.a:0 "Decidiremos nuestro propio futuro."
 ca_los_altos_soconusco_events.2.t:0 "Los Altos invita al Soconusco"
 ca_los_altos_soconusco_events.2.d:0 "El nuevo Estado de Los Altos invita al Soconusco a unírsele: las mismas tierras altas, los mismos caminos del café, la misma desconfianza hacia la Ciudad de Guatemala."
 ca_los_altos_soconusco_events.2.f:0 "«De Quetzaltenango a Tapachula, un solo pueblo.»"
 ca_los_altos_soconusco_events.2.a:0 "Estrechar nuestros lazos con Los Altos."
 ca_los_altos_soconusco_events.2.b:0 "No pertenecemos a nadie."
 ca_los_altos_soconusco_events.3.t:0 "Las actas de adhesión"
 ca_los_altos_soconusco_events.3.d:0 "En los ayuntamientos del Soconusco, notables leales a México firman actas de adhesión a la República Mexicana. Los demás los llaman traidores."
 ca_los_altos_soconusco_events.3.f:0 "«Tinta en el papel, y soldados detrás.»"
 ca_los_altos_soconusco_events.3.a:0 "Anular las actas."
 ca_los_altos_soconusco_events.3.b:0 "No podemos detenerlos."
 ca_los_altos_soconusco_events.4.t:0 "La unión irrevocable"
 ca_los_altos_soconusco_events.4.d:0 "El presidente Santa Anna ha decretado la unión irrevocable del Soconusco con el departamento mexicano de Chiapas. Funcionarios mexicanos van en camino para tomar posesión de la provincia."
 ca_los_altos_soconusco_events.4.f:0 "«Irrevocable es una palabra muy grande.»"
 ca_los_altos_soconusco_events.4.a:0 "El decreto ya se ha promulgado."
 ca_los_altos_soconusco_events.5.t:0 "La protesta de Guatemala"
 ca_los_altos_soconusco_events.5.d:0 "Guatemala ha protestado contra la anexión mexicana del Soconusco. La nota es enérgica; que la siga algo más es otra cuestión."
 ca_los_altos_soconusco_events.5.f:0 "«La protesta es el arma de los débiles.»"
 ca_los_altos_soconusco_events.5.a:0 "Protestar y mantener el reclamo."
 ca_los_altos_soconusco_events.5.b:0 "Prepararse para la guerra."
 ca_los_altos_soconusco_events.6.t:0 "Contrabando de cacao"
 ca_los_altos_soconusco_events.6.d:0 "El cacao del Soconusco cruza la frontera de contrabando para evitar los derechos de ambos lados. Los contrabandistas tienen amigos en todas partes."
 ca_los_altos_soconusco_events.6.a:0 "Cerrar la frontera con México."
 ca_los_altos_soconusco_events.6.b:0 "Cerrar la frontera con Guatemala."
 ca_los_altos_soconusco_events.7.t:0 "[SCOPE.sCharacter('ca_soc_caudillo').GetFullName] se pronuncia"
 ca_los_altos_soconusco_events.7.d:0 "[SCOPE.sCharacter('ca_soc_caudillo').GetFullName] ha reunido hombres armados y ha declarado que el Soconusco debe elegir amo ahora."
 ca_los_altos_soconusco_events.7.a:0 "Respaldar la causa centroamericana."
 ca_los_altos_soconusco_events.7.b:0 "Respaldar la causa mexicana."
 ca_los_altos_soconusco_events.8.t:0 "El cura predica por México"
 ca_los_altos_soconusco_events.8.d:0 "El cura párroco de Tapachula predica cada domingo que el Soconusco pertenece a la Iglesia mexicana y a la nación mexicana."
 ca_los_altos_soconusco_events.8.a:0 "Pedir al obispo que lo traslade."
 ca_los_altos_soconusco_events.8.b:0 "Dejarlo predicar."
 ca_los_altos_soconusco_events.9.t:0 "Una partida mexicana cruza la frontera"
 ca_los_altos_soconusco_events.9.d:0 "Una partida armada de Chiapas ha cruzado la frontera, ha izado la bandera mexicana en una aldea y ha regresado."
 ca_los_altos_soconusco_events.9.a:0 "Perseguirlos."
 ca_los_altos_soconusco_events.9.b:0 "Evitar el enfrentamiento."
 ca_los_altos_soconusco_events.10.t:0 "La guarnición sin paga"
 ca_los_altos_soconusco_events.10.d:0 "La guarnición de Tapachula lleva meses sin cobrar. Los soldados dicen que México paga puntualmente."
 ca_los_altos_soconusco_events.10.a:0 "Pagarles."
 ca_los_altos_soconusco_events.10.b:0 "No hay dinero."
 ca_central_america.5.t:0 "El destino del Soconusco"
 ca_central_america.5.d:0 "El Soconusco ha elegido: su gente se siente centroamericana y el partido mexicano ha perdido. Ahora la provincia debe decidir con quién caminará."
 ca_central_america.5.d2:0 "El partido mexicano ha ganado en el Soconusco. Los funcionarios de Santa Anna toman posesión de la provincia y sus notables centroamericanos deben decidir si se someten, resisten o piden ayuda."
 ca_central_america.5.f:0 "«Entre dos naciones, el Soconusco elige.»"
 ca_central_america.5.a:0 "Seguir siendo un Estado de la Federación."
 ca_central_america.5.b:0 "Unirse a Guatemala."
 ca_central_america.5.c:0 "Unirse a Los Altos."
 ca_central_america.5.opt_d:0 "Seguir independiente."
 ca_central_america.5.e:0 "Aceptar la anexión a México."
 ca_central_america.5.opt_f:0 "¡Resistir!"
 ca_central_america.5.g:0 "Pedir ayuda a Centroamérica."
 ca_central_america.5.h:0 "Ya no podemos resistir más."
 ca_soconusco_war_play:0 "La defensa del Soconusco"
 CA_SOCONUSCO_LOYAL:0 "Leal a la Federación"
 CA_SOCONUSCO_REBEL:0 "En rebeldía contra la Federación"
 CA_SOCONUSCO_SEPARATED:0 "Separado de la Federación"
 je_ca_soconusco:0 "El Soconusco"
 je_ca_soconusco_reason:0 "El Soconusco está en disputa entre México y Centroamérica desde la independencia. Su gente centroamericana, mexicana y chiapaneca tira en direcciones distintas, y ambos vecinos están atentos."
 je_ca_soconusco_goal:0 "En 100, con más centroamericanos que mexicanos, el Soconusco elige Centroamérica. En 0, o si los mexicanos llegan al 45 % de la población, cae en manos de México."
 je_ca_soconusco_status_ca:0 "El Soconusco se inclina hacia Centroamérica."
 je_ca_soconusco_status_mex:0 "El Soconusco se inclina hacia México."
 je_ca_soconusco_status_neutral:0 "El Soconusco sigue indeciso."
 je_ca_soconusco_complete_tt:0 "La barra llega a 100"
 je_ca_soconusco_culture_tt:0 "Hay al menos tantos centroamericanos como mexicanos"
 je_ca_soconusco_fail_tt:0 "La barra cae a 0"
 je_ca_soconusco_mexican_tt:0 "Los mexicanos son al menos el 45 % de la población"
 ca_soconusco_war_fever:0 "Fiebre de guerra por el Soconusco"
 ca_soconusco_war_fever_desc:0 "La pérdida del Soconusco ha inflamado el país."
