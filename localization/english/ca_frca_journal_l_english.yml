l_english:
 # CAFM - F3 - Diario de la Federacion: fases, desenlaces y tooltips
 je_frca_status_federal_1:0 "#bold Phase I: The Crisis#!\nThe liberal reforms of the Federation divide the States. Congress debates while the provinces grow restless. Keep the States loyal until the Federal Congress meets in 1838."
 je_frca_status_federal_2:0 "#bold Phase II: The Disintegration#!\nCongress has allowed the States to organize themselves as they wish. One by one they test how far the Union will bend before it breaks."
 je_frca_status_federal_3:0 "#bold Phase III: The War#!\nThe States have taken up arms against the federal government. The fate of the Republic will be decided on the battlefield."
 je_frca_status_federal_4:0 "#bold Phase IV: The Resistance#!\nThe Federation still stands, but foreign powers, conservative clergy and local caudillos press on every front. Hold on until 1845."
 je_frca_status_centralist_1:0 "#bold Phase I: The Strong Hand#!\nThe government wants a single Republic ruled from one capital. The States resent every federal intendant sent to govern them."
 je_frca_status_centralist_2:0 "#bold Phase II: The Silenced Congress#!\nThe federal Congress is no more. Without a forum for their grievances, the States answer the central government with defiance."
 je_frca_status_centralist_3:0 "#bold Phase III: The War of the Union#!\nThe Republic will be one and indivisible, even if it must be held together by bayonets."
 je_frca_status_centralist_4:0 "#bold Phase IV: The Iron Republic#!\nThe Union has been imposed, but its enemies have not disappeared. Foreign powers and ambitious generals wait for the first sign of weakness."
 je_frca_status_crisis:0 "#bold #N The Federation is falling apart!#!#!\nSupport for the Union has dropped below 50. Without loyal States and decisive action, the Republic will not survive."

 je_frca_outcome_a_tt:0 "#bold The Republic Survives#! (January 1st, 1845):"
 je_frca_outcome_b_tt:0 "#bold Union by the Sword#! (January 1st, 1845):"
 je_frca_outcome_c_tt:0 "#bold The Confederation#! (federal path only):"
 je_frca_not_won_war_tt:0 "The Union has not been restored by force of arms"
 je_frca_core_regions_tt:0 "Owns at least one state in each of Guatemala, El Salvador, Honduras, Nicaragua and Costa Rica"
 je_frca_fronts_lost_max_1_tt:0 "No more than 1 front of the Resistance has been lost"
 je_frca_fronts_lost_max_2_tt:0 "No more than 2 fronts of the Resistance have been lost"
 je_frca_diet_signed_tt:0 "The Diet of the States has signed the Pact of Confederation"
 je_frca_fail_independent_tt:0 "3 or more of the five core States are fully independent"
 je_frca_fail_recognized_tt:0 "The federal government has recognized the independence of a core State"
 je_frca_fail_exile_tt:0 "Morazán has gone into exile"
 je_frca_timeout_d2_tt:0 "Without victory, union or confederation, the Federation fades away peacefully."
