l_english:
 # CAFM - Nicaragua fase 2, Honduras fase 2 y la Mosquitia (10 nov 2026)
 ca_mosquitia_events.1.t:0 "London Recognizes the Kingdom"
 ca_mosquitia_events.1.d:0 "The British government formally recognizes the Mosquito kingdom as an independent state. Recognition did not come because we asked for it. It came because Spain's claim to this coast is finally dead and somebody had to inherit it."
 ca_mosquitia_events.1.f:0 "\"We are a kingdom because it suits an empire that we should be one.\""
 ca_mosquitia_events.1.a:0 "Accept the recognition"
 ca_mosquitia_events.1.b:0 "A kingdom needs no permission"
 ca_mosquitia_events.2.t:0 "The King's Will"
 ca_mosquitia_events.2.d:0 "Robert Charles Frederick's will creates a council to oversee the kingdom's affairs and advise a regency for his heir. The heir is a boy of seven. The council is the first written institution this coast has ever had."
 ca_mosquitia_events.2.f:0 "\"A council on paper, for a kingdom with no capital and no treasury.\""
 ca_mosquitia_events.2.a:0 "Constitute the council"
 ca_mosquitia_events.2.b:0 "The headmen will decide as always"
 ca_mosquitia_events.3.t:0 "The Landing at San Juan"
 ca_mosquitia_events.3.d:0 "On the twelfth of August the superintendent of British Honduras and the king landed at San Juan del Norte and declared the town and the whole Atlantic coast part of the kingdom. The Nicaraguan customs officer watched from the beach."
 ca_mosquitia_events.3.f:0 "\"The king claimed a port. The superintendent decided which port.\""
 ca_mosquitia_events.3.a:0 "Claim the river mouth"
 ca_mosquitia_events.3.b:0 "The river is not ours"
 ca_mosquitia_events.4.t:0 "Prince Wellington, Colonel Johnson, General Lowrey"
 ca_mosquitia_events.4.d:0 "On the fourth of May London recognizes a regency of three men with English titles they gave themselves. They will govern until the boy is crowned, and they govern from wherever the ships call."
 ca_mosquitia_events.4.f:0 "\"Three regents, three titles, and no agreement about who outranks whom.\""
 ca_mosquitia_events.4.a:0 "Let the three regents govern"
 ca_mosquitia_events.4.b:0 "One regent, not three"
 ca_mosquitia_events.5.t:0 "A Consul at Bluefields"
 ca_mosquitia_events.5.d:0 "Britain declares a new protectorate and sends Patrick Walker as consul-general to the king, with his seat at Bluefields. He is not an ambassador to a court. He is the court's new clerk, and he will be signing for it."
 ca_mosquitia_events.5.f:0 "\"The kingdom has acquired a government, and it did not choose it.\""
 ca_mosquitia_events.5.a:0 "Receive the consul"
 ca_mosquitia_events.5.b:0 "Receive him, and keep the seal"
 ca_mosquitia_events.6.t:0 "From Cape Honduras to the San Juan"
 ca_mosquitia_events.6.d:0 "The protectorate is declared to run from Cape Honduras in the north to the mouth of the San Juan in the south, San Juan del Norte included. On paper that is four hundred leagues of coast. On the ground it is the towns where ships can land."
 ca_mosquitia_events.6.f:0 "\"Our border is wherever a schooner can tie up.\""
 ca_mosquitia_events.6.a:0 "Claim the whole coast"
 ca_mosquitia_events.6.b:0 "Claim only what we govern"
 ca_mosquitia_events.7.t:0 "The Coronation at Belize"
 ca_mosquitia_events.7.d:0 "On the seventh of May George Augustus Frederick is crowned at Belize, at about twelve years of age, following the form used in 1816. He is crowned king of the Mosquito Coast in another country's capital."
 ca_mosquitia_events.7.f:0 "\"A king crowned abroad is a king who can be uncrowned abroad.\""
 ca_mosquitia_events.7.a:0 "Crown him at Belize"
 ca_mosquitia_events.7.b:0 "Crown him at Bluefields"
 ca_mosquitia_events.8.t:0 "The King Dismisses the Regents"
 ca_mosquitia_events.8.d:0 "He is thirteen and he has abolished the regency council, replacing it with men of his own choosing: Creoles from Bluefields who read, write and trade. The three regents with English titles are out."
 ca_mosquitia_events.8.f:0 "\"The first act of his reign is to get rid of the men who ran it for him.\""
 ca_mosquitia_events.8.a:0 "A council of Bluefields Creoles"
 ca_mosquitia_events.8.b:0 "Keep the regents"
 ca_mosquitia_events.9.t:0 "The Laws of the Council"
 ca_mosquitia_events.9.d:0 "The new council has passed laws on a local militia, on land grants, on judicial procedure and on the cutting of wood. Four laws. It is more government than this coast has had in three hundred years."
 ca_mosquitia_events.9.f:0 "\"A militia, a land register, a court and a timber licence. That is a state.\""
 ca_mosquitia_events.9.a:0 "Enact all four"
 ca_mosquitia_events.9.b:0 "The militia law only"
 ca_mosquitia_events.10.t:0 "The Ultimatum"
 ca_mosquitia_events.10.d:0 "The king issues an ultimatum: Nicaraguan forces are to be out of San Juan del Norte before the first of January. The ultimatum is in the king's name. The two warships that will enforce it are not his."
 ca_mosquitia_events.10.f:0 "\"Our first ultimatum, and we did not have to build a navy to send it.\""
 ca_mosquitia_events.10.a:0 "Send the ultimatum"
 ca_mosquitia_events.10.b:0 "Negotiate with Nicaragua instead"
 ca_mosquitia_events.11.t:0 "The First of January"
 ca_mosquitia_events.11.d:0 "The ultimatum expired and Mosquito and British forces, with two warships, took San Juan del Norte. The garrison left. The town is annexed to the kingdom."
 ca_mosquitia_events.11.f:0 "\"The kingdom has a port on the Atlantic and an interoceanic river behind it.\""
 ca_mosquitia_events.11.a:0 "Take the town"
 ca_mosquitia_events.11.b:0 "Occupy it in the king's name alone"
 ca_mosquitia_events.12.t:0 "Greytown"
 ca_mosquitia_events.12.d:0 "On the seventh of March Nicaragua signs a treaty ceding the town, and it is renamed Greytown after the governor of Jamaica. The kingdom's only real revenue will now be the harbour dues of a port named after a British official."
 ca_mosquitia_events.12.f:0 "\"We won a port and lost the naming of it in the same week.\""
 ca_mosquitia_events.12.a:0 "Collect the harbour dues"
 ca_mosquitia_events.12.b:0 "Keep the old name"
 ca_mosquitia_events.13.t:0 "Walker Is Gone"
 ca_mosquitia_events.13.d:0 "The consul-general is dead, within the year of his greatest success. Whoever London sends next will inherit a kingdom that has just learned how much can be done in its own name."
 ca_mosquitia_events.13.f:0 "\"The man who signed for us is gone. The question is whether anyone signs for us now.\""
 ca_mosquitia_events.13.a:0 "The council governs alone"
 ca_mosquitia_events.13.b:0 "Ask Belize for another consul"
 ca_mosquitia_events.14.t:0 "Clayton and Bulwer"
 ca_mosquitia_events.14.d:0 "On the nineteenth of April the two powers agree that neither will occupy, fortify or colonize Nicaragua, Costa Rica or the Mosquito Coast. The kingdom is named in the treaty and was not asked about it."
 ca_mosquitia_events.14.f:0 "\"Protected and traded away in the same sentence.\""
 ca_mosquitia_events.14.a:0 "A treaty we are named in"
 ca_mosquitia_events.14.b:0 "Protest being disposed of"
 ca_mosquitia_events.15.t:0 "The Prometheus"
 ca_mosquitia_events.15.d:0 "On the twenty-first of November a British warship fired on an American steamer in our harbour over unpaid dues. The dues are the kingdom's. Neither of the two navies in the bay mentioned that."
 ca_mosquitia_events.15.f:0 "\"They fought over our tariff without once consulting us about it.\""
 ca_mosquitia_events.15.a:0 "The dues are the kingdom's"
 ca_mosquitia_events.15.b:0 "Let the consul handle it"
 ca_mosquitia_events.16.t:0 "The Mahogany Rivers"
 ca_mosquitia_events.16.d:0 "The Belize companies work the Patuca, the Coco and the Escondido, and they pay the headmen in rum and cloth when they pay at all. The council's woodcutting law exists to turn that into a licence fee."
 ca_mosquitia_events.16.f:0 "\"The richest thing we have is the timber, and we have never been paid for a stick of it.\""
 ca_mosquitia_events.16.a:0 "Charge for the licences"
 ca_mosquitia_events.16.b:0 "Let the headmen keep their arrangements"
 ca_mosquitia_events.17.t:0 "Sarsaparilla and Turtle Shell"
 ca_mosquitia_events.17.d:0 "Between the timber seasons the coast lives on sarsaparilla root, turtle shell and what the Jamaican sloops will buy. It is not much, and it is the only income that is entirely ours."
 ca_mosquitia_events.17.f:0 "\"Small trade, in small boats, and nobody in London has an opinion about it.\""
 ca_mosquitia_events.17.a:0 "Protect the small trade"
 ca_mosquitia_events.17.b:0 "Court the Jamaican houses"
 ca_mosquitia_events.18.t:0 "Upriver"
 ca_mosquitia_events.18.d:0 "The council sits in Bluefields and legislates for a coast. Upriver the Sumu and the Rama answer to their own headmen and have never seen a Mosquito tax collector, let alone a British consul."
 ca_mosquitia_events.18.f:0 "\"We are a kingdom of the shoreline. Everything behind it is somebody else's.\""
 ca_mosquitia_events.18.a:0 "Govern through the headmen"
 ca_mosquitia_events.18.b:0 "Send the militia upriver"
 ca_mosquitia_events.19.t:0 "Honduras Claims the North"
 ca_mosquitia_events.19.d:0 "Tegucigalpa insists the coast from Cape Honduras to Cabo Gracias a Dios is Honduran territory and that the kingdom is a British invention. Both halves of that are partly true."
 ca_mosquitia_events.19.f:0 "\"They have the map and we have the villages. Neither of us has the river.\""
 ca_mosquitia_events.19.a:0 "Hold the northern claim"
 ca_mosquitia_events.19.b:0 "Settle on Cabo Gracias a Dios"
 ca_mosquitia_events.20.t:0 "An Office in Belize"
 ca_mosquitia_events.20.d:0 "The king signs what is put in front of him, the council meets when the consul convenes it, and the kingdom's revenue is an allowance. There is still a crown. There is no longer anyone under it who decides anything."
 ca_mosquitia_events.20.f:0 "\"The kingdom survives. It is filed in Belize, under protectorates.\""
 ca_mosquitia_events.20.a:0 "Sign what is put before us"
 ca_mosquitia_events.20.b:0 "The council will meet on its own"
