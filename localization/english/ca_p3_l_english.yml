 # CAFM P3 (punto 3): "The Congress Proposes..."
 ca_federalist_events.21.t:0 "The Congress Proposes: Secular Schools"
 ca_federalist_events.21.d:0 "The liberal deputies want the schools of the Republic taught by the State and not by the friars. Primary instruction, they say, is the foundation of a free citizenry. The clergy and the conservative families protest that it is an attack on the faith of the people."
 ca_federalist_events.21.f:0 "\"Without public instruction there are no citizens, only subjects.\""
 ca_federalist_events.22.t:0 "The Congress Proposes: Church and State"
 ca_federalist_events.22.d:0 "A bill before the Congress would end the tithe and the special courts of the clergy and separate the Church from the State. The federal liberals have wanted it since 1829; the bishops call it persecution."
 ca_federalist_events.22.f:0 "\"Render unto Caesar what is Caesar's, and let the Republic keep its own accounts.\""
 ca_federalist_events.23.t:0 "The Congress Proposes: Free Municipalities"
 ca_federalist_events.23.d:0 "The towns ask for their own councils, elected by their neighbors, with power over their roads, their markets and their schools. The federalists see in the municipality the school of the Republic; the capitals of the States fear losing control."
 ca_federalist_events.23.f:0 "\"The Republic begins in the town square.\""
 ca_federalist_events.24.t:0 "The Congress Proposes: Freedom of the Press"
 ca_federalist_events.24.d:0 "The printers of the capital ask the Congress to abolish prior censorship. The liberal newspapers would be free to criticize the government; so would the servile ones."
 ca_federalist_events.24.f:0 "\"A free press is the sentinel of the Republic.\""
 ca_federalist_events.25.t:0 "The Congress Proposes: A Fair Contribution"
 ca_federalist_events.25.d:0 "The head tax weighs equally on the peon and on the landowner, and the towns resist it. The finance committee proposes a contribution in proportion to income and property."
 ca_federalist_events.25.f:0 "\"Let each State and each citizen pay according to their means.\""
 ca_federalist_events.26.t:0 "The Congress Proposes: Free Trade"
 ca_federalist_events.26.d:0 "The merchants of the ports want the old colonial restrictions lifted and the Federation opened to the trade of every nation. The artisans fear the flood of English cloth."
 ca_federalist_events.26.f:0 "\"Commerce is the bond of peoples.\""
 ca_federalist_events.27.t:0 "The Congress Proposes: Broader Suffrage"
 ca_federalist_events.27.d:0 "The most radical deputies want to extend the vote beyond the property owners, as the Constitution of 1824 promised. The moderates warn that the caudillos will march the peons to the polls."
 ca_federalist_events.27.f:0 "\"The sovereignty resides in the people, not in their purses.\""
 ca_federalist_events.21.a:0 "Present it to the Congress"
 ca_federalist_events.21.b:0 "Negotiate it first with the States"
 ca_federalist_events.21.c:0 "Postpone it"
