 ca_enact_states_pact:0 "Pact with the States"
 ca_enact_states_pact_desc:0 "The States agreed to the reform before the vote."

 # CAFM P3 (punto 2): the British debt
 je_ca_british_debt_default_tt:0 "We have #n defaulted#! on the #v English Debt#!"
 ca_british_debt.6.c:0 "Gunboat diplomacy"
 ca_british_debt.7.t:0 "The Consul Presses His Claims"
 ca_british_debt.7.d:0 "Her Majesty's consul has sent another note demanding payment of the overdue interest of the London loan, together with the claims of British merchants for goods seized in our civil wars. His tone grows sharper with every letter."
 ca_british_debt.7.f:0 "\"The consul writes as if he were the governor of a colony.\""
 ca_british_debt.7.a:0 "Pay something to calm him"
 ca_british_debt.7.b:0 "Promise to pay soon"
 ca_british_debt.7.c:0 "Reject his insolence"
 ca_british_debt.8.t:0 "The Bondholders Ask for a Customs House"
 ca_british_debt.8.d:0 "The committee of bondholders proposes a deal: the revenue of one of our customs houses would go directly to London until the debt is reduced. It would ease the pressure, but foreign agents would sit in our ports."
 ca_british_debt.8.f:0 "\"They want the key to our ports in exchange for patience.\""
 ca_british_debt.8.a:0 "Mortgage the customs house"
 ca_british_debt.8.b:0 "Our customs are not for sale"
 ca_british_debt.9.t:0 "Payment in Kind"
 ca_british_debt.9.d:0 "With the Treasury empty, the finance minister suggests paying the bondholders in indigo, cochineal and precious woods instead of silver. The merchants who sell those goods will lose a season's profit."
 ca_british_debt.9.f:0 "\"If we have no silver, let them take our indigo.\""
 ca_british_debt.9.a:0 "Pay in kind"
 ca_british_debt.9.b:0 "Keep the goods for our trade"
 ca_british_debt.10.t:0 "Bonds for Land"
 ca_british_debt.10.d:0 "A London agent offers to exchange part of the old bonds for public lands, where English colonists would settle. Other republics of the continent have done the same. The towns near those lands are already uneasy."
 ca_british_debt.10.f:0 "\"Land is the only thing this Republic has in abundance.\""
 ca_british_debt.10.a:0 "Grant the lands"
 ca_british_debt.10.b:0 "Not one acre to the foreigner"
 ca_british_debt.11.t:0 "A Rival Banker"
 ca_british_debt.11.d:0 "A banker from Paris and a merchant house from New York both offer to buy part of our debt on better terms than London. Changing creditors would anger the British, and the new one will also expect favors."
 ca_british_debt.11.f:0 "\"Every creditor is a new master.\""
 ca_british_debt.11.a:0 "Accept the French offer"
 ca_british_debt.11.b:0 "Accept the American offer"
 ca_british_debt.11.c:0 "Stay with London"
 ca_british_debt.12.t:0 "Dividing the Debt among the States"
 ca_british_debt.12.d:0 "Several States propose that each one take its share of the federal debt and pay it on its own. It would relieve the federal Treasury, but it would also tell London that the Federation no longer answers for its States."
 ca_british_debt.12.f:0 "\"Divide the debt and you divide the Republic.\""
 ca_british_debt.12.a:0 "Divide it"
 ca_british_debt.12.b:0 "The debt is federal, and so is our duty"
 ca_british_debt.13.t:0 "The Commission on the Loan of 1825"
 ca_british_debt.13.d:0 "Deputies ask for a commission to investigate the loan of 1825: how much of it ever reached the Republic, and how much stayed in the hands of the bankers and their agents. London will not like the questions."
 ca_british_debt.13.f:0 "\"We are paying for money we never saw.\""
 ca_british_debt.13.a:0 "Appoint the commission"
 ca_british_debt.13.b:0 "Better not stir that up"
 ca_british_debt.14.t:0 "Default"
 ca_british_debt.14.d:0 "The Treasury cannot meet the next payment, and the bondholders will not wait any longer. We can declare that we suspend payments, or empty what remains of our coffers."
 ca_british_debt.14.f:0 "\"There is nothing left to pay with.\""
 ca_british_debt.14.a:0 "Suspend the payments"
 ca_british_debt.14.a_tt:0 "We #n default#! on the English Debt. Britain may answer with force."
 ca_british_debt.14.b:0 "Pay at any cost"
 ca_british_debt.15.t:0 "The Royal Navy Blockades Our Ports"
 ca_british_debt.15.d:0 "British warships have appeared off our ports and stop every ship that tries to enter or leave. The consul says the blockade will last until we pay."
 ca_british_debt.15.f:0 "\"Their frigates are the bailiffs of the City.\""
 ca_british_debt.15.a:0 "We will endure"
 ca_british_debt.15.b:0 "Pay to lift the blockade"
 ca_british_debt.16.t:0 "The British Ultimatum"
 ca_british_debt.16.d:0 "The consul has delivered an ultimatum: either we pay a large installment of the debt and the claims, or the Royal Navy will take what is owed. There is no more room for promises."
 ca_british_debt.16.f:0 "\"Pay, or the guns will collect.\""
 ca_british_debt.16.a:0 "Pay the installment"
 ca_british_debt.16.b:0 "We will not yield to threats"
 ca_british_debt.17.t:0 "An Island in British Hands"
 ca_british_debt.17.d:0 "Marines from a British warship have landed on one of our islands and raised the Union Jack, as security for the debt. The consul says they will leave when we pay."
 ca_british_debt.17.f:0 "\"Today an island; tomorrow, the coast.\""
 ca_british_debt.17.a:0 "Protest to the world"
 ca_british_debt.17.b:0 "Accept it and negotiate"
 ca_british_debt.18.t:0 "The Mosquito King and the Foreign Office"
 ca_british_debt.18.d:0 "News from the Caribbean coast: the British have crowned a new Mosquito king and speak of his kingdom as a protectorate of the Crown. In London, the Foreign Office links our debt to the claims of the Mosquito Shore."
 ca_british_debt.18.f:0 "\"A king of the Mosquitos, crowned in a British church.\""
 ca_british_debt.18.a:0 "Protest in London"
 ca_british_debt.18.b:0 "Buy the goodwill of the coast"
 ca_british_debt.19.t:0 "The Bondholders' Peace"
 ca_british_debt.19.d:0 "With the guns silent, London is ready to settle: the claims will be paid in installments and the blockade lifted. It is a humiliating peace, but a peace."
 ca_british_debt.19.f:0 "\"Peace, at the price of our pride.\""
 ca_british_debt.19.a:0 "Sign the agreement"
 ca_british_debt.20.t:0 "The Final Settlement"
 ca_british_debt.20.d:0 "Only a last installment of the London loan remains. The bondholders offer to close the account for good if we pay it now."
 ca_british_debt.20.f:0 "\"The last letter from London.\""
 ca_british_debt.20.a:0 "Pay and close the account"
 ca_british_debt.20.b:0 "Not yet"
 ca_british_debt.20.b_tt:0 "The debt stays open."
 ca_british_debt.21.t:0 "War with England!"
 ca_british_debt.21.d:0 "Britain has decided to collect by force. The Royal Navy sails for our coasts, and the consul has left the capital. Whatever the outcome, this war will be remembered."
 ca_british_debt.21.f:0 "\"The lion has come to collect.\""
 ca_british_debt.21.a:0 "To arms!"
 ca_british_debt.21.a_tt:0 "Britain opens a diplomatic play against us over the debt."
 ca_debt_war_play:0 "The English Debt"
 dp_ca_debt_gunboat:0 "Gunboat Diplomacy"
 dp_ca_debt_gunboat_desc:0 "Britain collects the debts of the London bondholders by force."
 dp_ca_debt_protectorate:0 "A British Protectorate"
 dp_ca_debt_protectorate_desc:0 "Britain takes advantage of the debt to place the Federation under its protection."
 ca_debt_customs_mortgaged:0 "Mortgaged Customs House"
 ca_debt_customs_mortgaged_desc:0 "The revenue of a customs house goes straight to the London bondholders."
 ca_debt_paid_in_kind:0 "Debt Paid in Kind"
 ca_debt_paid_in_kind_desc:0 "Our exports pay the interest of the London loan."
 ca_debt_land_concession:0 "Lands for the Bondholders"
 ca_debt_land_concession_desc:0 "Public lands were exchanged for old bonds, and foreign colonists are arriving."
 ca_debt_blockade:0 "British Blockade"
 ca_debt_blockade_desc:0 "The Royal Navy closes our ports until the debt is paid."
 ca_debt_island_occupied:0 "An Island Occupied"
 ca_debt_island_occupied_desc:0 "British marines hold one of our islands as security for the debt."
 ca_debt_commission:0 "Commission on the 1825 Loan"
 ca_debt_commission_desc:0 "The investigation of the loan of 1825 shows that the Republic will not pay blindly."
