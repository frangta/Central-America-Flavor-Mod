 # CAFM P5 (punto 9): guide
 ca_decision_federation_guide:0 "How to Play the Federation"
 ca_decision_federation_guide_desc:0 "Open a short guide to the mechanics of the Federal Republic. It changes nothing in the game."
 ca_guide.close:0 "Close the guide"
 ca_guide.back:0 "Back to the index"
 ca_guide.1.t:0 "How to Play the Federation"
 ca_guide.1.d:0 "The Federal Republic of Central America begins in 1836 already falling apart. This guide explains, page by page, how its systems work. Choose a topic."
 ca_guide.1.f:0 "\"Dios, Unión, Libertad.\""
 ca_guide.1.loyalty:0 "Loyalty and the minimap"
 ca_guide.1.bar:0 "The bar and the phases"
 ca_guide.1.cohesion:0 "Federal Cohesion"
 ca_guide.1.routes:0 "The three routes"
 ca_guide.1.fronts:0 "The fronts (phase IV)"
 ca_guide.1.debt:0 "The English Debt"
 ca_guide.1.regions:0 "The regions"
 ca_guide.1.outcomes:0 "The outcomes"
 ca_guide.1.after:0 "After the Federation"
 ca_guide.2.t:0 "Loyalty and the Minimap"
 ca_guide.2.d:0 "Each State has a loyalty from 0 to 3: #bold Separated, Rebel, Wavering, Loyal#!. The minimap colors each State by its loyalty. Months of turmoil lower it; calm raises it. Click a State on the minimap to see its panel and its actions: federal campaign, negotiation and, on the centralist route, intendants and states of siege. The new zones (Mosquito Coast, Petén, Guanacaste, Talamanca, Bocas del Toro) have their own actions."
 ca_guide.3.t:0 "The Bar and the Phases"
 ca_guide.3.d:0 "The Support bar goes from 0 to 200. Loyal States raise it every month; Rebel and Separated States lower it. Below 50 the Federation is in crisis; at 0 it dissolves. The journal advances through four phases: #bold Crisis, Disintegration, War and Resistance#!."
 ca_guide.4.t:0 "Federal Cohesion"
 ca_guide.4.d:0 "On the federal route, #bold Federal Cohesion#! (0-100) measures how well the States work together. Legitimacy, fair taxes, a federal army and a capital outside Guatemala raise it; debt, civil war, rebel States and centralization lower it. It is spent on federal actions and on negotiating reforms with the States. At 75 the army swears by the Constitution; below 25 the caudillos grow bolder."
 ca_guide.5.t:0 "The Three Routes"
 ca_guide.5.d:0 "In the first months you choose: the #bold federal#! route (respect the States, reform through the Congress), the #bold centralist#! route (impose the Union by force) or #bold leave#! the Federation and play a single State. Each route has its own buttons, events and texts."
 ca_guide.6.t:0 "The Fronts"
 ca_guide.6.d:0 "In phase IV the Federation fights on four fronts: #bold British, Mexican, conservative and the caudillos#!. Each goes from Calm to Lost. More than one lost front closes the way to the best outcomes."
 ca_guide.7.t:0 "The English Debt"
 ca_guide.7.d:0 "The loan of 1825 weighs on the Treasury. The bondholders and the consul push harder as their #bold pressure#! grows: customs houses, payments in kind, blockades and, in the end, war. You can pay, negotiate, or default and face the Royal Navy."
 ca_guide.8.t:0 "The Regions"
 ca_guide.8.d:0 "Bocas del Toro depends on its #bold effective control#!: with 60 or more, foreign seizures fail. The Mosquito Coast is the door for the British; Petén borders Belize and Yucatán; Guanacaste is disputed with Nicaragua; Talamanca follows its own cacique; Los Altos may become the sixth State; the Soconusco looks to Mexico."
 ca_guide.9.t:0 "The Outcomes"
 ca_guide.9.d:0 "#bold A#!: the Republic survives to 1845. #bold B#!: union by the sword, after winning the federal war. #bold C#!: a Confederation, signed by the Diet of the States. #bold D1#!: violent dissolution. #bold D2#!: the Federation simply fades away in 1845."
 ca_guide.10.t:0 "After the Federation"
 ca_guide.10.d:0 "The States that survive can form regional unions, try to rebuild the Federation, or one day proclaim the #bold Great Republic of Central America#!. The Confederation of 1842-1845 and the dream of the Patria Grande come later."
