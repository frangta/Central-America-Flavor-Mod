 ca_central_america.176.t:0 "The British Land from the Mosquito Coast"
 ca_central_america.176.d:0 "With our hold on Bocas del Toro weak, a British schooner from the Mosquito Coast has landed men and raised the Mosquito flag on the islands of the lagoon. They say they are only protecting the subjects of the Mosquito king."
 ca_central_america.176.f:0 "\"The Mosquito flag today; the British one tomorrow.\""
 ca_central_america.176.a:0 "Send troops to the lagoon"
 ca_central_america.176.b:0 "We cannot stop them"

 # CAFM P5 (punto 9): .119
 ca_central_america.119.a_guide_tt:0 "#bold Difficulty: hard.#! Keep the Federation alive until 1845. You spend #bold Federal Cohesion#! on federal actions, the Congress proposes reforms, and the States can be won back with campaigns and negotiation."
 ca_central_america.119.b_guide_tt:0 "#bold Difficulty: very hard.#! Hold the Union together by force. No cohesion: you use intendants, states of siege and bought caudillos, at the price of rebellion."
 ca_central_america.119.c_guide_tt:0 "#bold Difficulty: varies.#! Leave the Federation and play one State: its own journals, elections and the road to sovereignty."

