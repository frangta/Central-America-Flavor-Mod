l_english:
 # CAFM - El Salvador 1836-1851 (10 nov 2026)
 ca_el_salvador_events.14.t:0 "Guatemala Withdraws"
 ca_el_salvador_events.14.d:0 "On the seventeenth of April the assembly in Guatemala resumed the sovereignty it gave up in 1824. Nicaragua, Honduras and Costa Rica are already gone. The Federal Republic of Central America now consists of one state, and we are it."
 ca_el_salvador_events.14.f:0 "\"We are not the last state of the Union. We are the Union.\""
 ca_el_salvador_events.14.a:0 "We will hold the Union alone"
 ca_el_salvador_events.14.b:0 "There is nothing left to hold"
 ca_el_salvador_events.15.t:0 "Cañas Builds a Government"
 ca_el_salvador_events.15.d:0 "Antonio José Cañas has divided the administration into four ministries: finance, war, foreign affairs and the interior. It is the first time anyone in El Salvador has written down who is responsible for what."
 ca_el_salvador_events.15.f:0 "\"A state is four men who know whose job it is.\""
 ca_el_salvador_events.15.a:0 "Create the four ministries"
 ca_el_salvador_events.15.b:0 "Govern as we always have"
 ca_el_salvador_events.16.t:0 "A Federation of One"
 ca_el_salvador_events.16.d:0 "Diego Vigil holds the federal presidency, and the federal army, such as it is, is quartered in our towns and paid from our treasury. The other states send nothing. They have not even sent an explanation."
 ca_el_salvador_events.16.f:0 "\"The Federation is a flag, a president and a bill that only we are paying.\""
 ca_el_salvador_events.16.a:0 "Pay the federal army out of our own revenue"
 ca_el_salvador_events.16.b:0 "Take the federal treasury for the state"
 ca_el_salvador_events.17.t:0 "Carrera Names Our Commander"
 ca_el_salvador_events.17.d:0 "After Morazán's defeat, Rafael Carrera has installed Colonel Francisco Malespín at the head of the Salvadoran army. He is ours by nationality and Guatemala's by appointment."
 ca_el_salvador_events.17.f:0 "\"They did not conquer us. They simply chose our general.\""
 ca_el_salvador_events.17.a:0 "Accept the appointment"
 ca_el_salvador_events.17.b:0 "Refuse him the command"
 ca_el_salvador_events.18.t:0 "The Federation Dissolved"
 ca_el_salvador_events.18.d:0 "The assembly has voted to end it. There is no Congress to hear the decree, no other state to ratify it and no president to sign it who is not already ours. The Federal Republic of Central America ends on the thirty-first of March, 1840."
 ca_el_salvador_events.18.f:0 "\"It did not break. It was put down, carefully, by the last man holding it.\""
 ca_el_salvador_events.18.a:0 "Dissolve the Federation"
 ca_el_salvador_events.18.b:0 "Refuse to let it die"
 ca_el_salvador_events.19.t:0 "Morazán Sails"
 ca_el_salvador_events.19.d:0 "On the eighth of April the President of the Federation and Diego Vigil boarded a schooner at La Libertad, bound for Costa Rica and then Panama. Thirty veterans went with them."
 ca_el_salvador_events.19.f:0 "\"He leaves the way he governed: with thirty men and no money.\""
 ca_el_salvador_events.19.a:0 "Let them go"
 ca_el_salvador_events.19.b:0 "Keep Morazán in El Salvador"
 ca_el_salvador_events.20.t:0 "Malespín Brings Down Cañas"
 ca_el_salvador_events.20.d:0 "The general wanted to govern through Cañas and Cañas would not be governed through. The revolt has forced his resignation. Villacorta refuses the office; Senator Norberto Ramírez takes it."
 ca_el_salvador_events.20.f:0 "\"Our general has learned he does not need a president. Only a presidency.\""
 ca_el_salvador_events.20.a:0 "Let the revolt stand"
 ca_el_salvador_events.20.b:0 "Break the revolt"
 ca_el_salvador_events.21.t:0 "Juan Lindo, Provisional Chief"
 ca_el_salvador_events.21.d:0 "A Honduran lawyer who has governed in Comayagua and in Guatemala now governs in San Salvador. He is a conservative, a Catholic and a man the generals will listen to, which is three things we have been short of."
 ca_el_salvador_events.21.f:0 "\"A foreigner, a lawyer and a believer. We could do much worse, and recently have.\""
 ca_el_salvador_events.21.a:0 "Accept Lindo"
 ca_el_salvador_events.21.b:0 "A Salvadoran for El Salvador"
 ca_el_salvador_events.22.t:0 "The University of El Salvador"
 ca_el_salvador_events.22.d:0 "The constituent assembly has decreed a university. There is no building, no faculty and no money; there is a decree, and two reales of every bag of indigo leaving La Unión are set aside to pay for it."
 ca_el_salvador_events.22.f:0 "\"Two reales a bag. That is what a country costs.\""
 ca_el_salvador_events.22.a:0 "Found the university"
 ca_el_salvador_events.22.b:0 "The treasury needs the money more"
 ca_el_salvador_events.23.t:0 "Free, Sovereign and Independent"
 ca_el_salvador_events.23.d:0 "On the twenty-second of February the assembly declares El Salvador a sovereign and independent state, and Juan Lindo its first president. We were the last to leave the Union because we were the only ones left in it."
 ca_el_salvador_events.23.f:0 "\"Everyone else walked out. We had to turn off the lights.\""
 ca_el_salvador_events.23.a:0 "Declare independence"
 ca_el_salvador_events.23.b:0 "Hold the federal title a while longer"
 ca_el_salvador_events.24.t:0 "Morazán Wants to Come Home"
 ca_el_salvador_events.24.d:0 "He is in the south with ships and men, and he is asking El Salvador to receive him as it did in 1840. Malespín says the man who commands our army decides who lands on our coast."
 ca_el_salvador_events.24.f:0 "\"The Republic's last president is asking permission to enter the Republic's last state.\""
 ca_el_salvador_events.24.a:0 "Refuse him the coast"
 ca_el_salvador_events.24.b:0 "Receive him as president"
 ca_el_salvador_events.25.t:0 "The General and the Bishop"
 ca_el_salvador_events.25.d:0 "San Salvador has its own diocese now, and Jorge Viteri y Ungo is its first bishop. He has broken with President Juan José Guzmán, and he has found in Malespín a soldier willing to be the Church's arm."
 ca_el_salvador_events.25.f:0 "\"A bishop who needs a sword, and a sword that needs absolution.\""
 ca_el_salvador_events.25.a:0 "Let the bishop and the general work together"
 ca_el_salvador_events.25.b:0 "Keep the Church out of it"
 ca_el_salvador_events.26.t:0 "Malespín Takes the Presidency"
 ca_el_salvador_events.26.d:0 "On the first of February the general stops being the man behind the president and becomes the president. He has also blocked Manuel José Arce from returning to reclaim the office he lost fifteen years ago."
 ca_el_salvador_events.26.f:0 "\"He has not taken power. He has finally stopped pretending he did not have it.\""
 ca_el_salvador_events.26.a:0 "The general becomes president"
 ca_el_salvador_events.26.b:0 "Keep a civilian in office"
 ca_el_salvador_events.27.t:0 "War with Nicaragua"
 ca_el_salvador_events.27.d:0 "The intrigues between liberals and conservatives have reached the point of soldiers. Guatemala will support us; Honduras will not. The target is León, where the Salvadoran liberals in exile have made themselves at home."
 ca_el_salvador_events.27.f:0 "\"A war against the city that shelters our enemies, fought by the man who made them enemies.\""
 ca_el_salvador_events.27.a:0 "March on León"
 ca_el_salvador_events.27.b:0 "Refuse the war"
 ca_el_salvador_events.28.t:0 "León"
 ca_el_salvador_events.28.d:0 "The city fell on the twenty-fourth of January after a siege that left it burning. What the army did there in the following days will be remembered in Nicaragua for a century."
 ca_el_salvador_events.28.f:0 "\"We took the city. We will be paying for it long after we have lost it.\""
 ca_el_salvador_events.28.a:0 "Let the army take its payment"
 ca_el_salvador_events.28.b:0 "Spare the city"
 ca_el_salvador_events.29.t:0 "Barrios and Cabañas"
 ca_el_salvador_events.29.d:0 "While the general is in Nicaragua, Gerardo Barrios and Trinidad Cabañas have put the question to acting president Joaquín Guzmán. On the second of February he deposes Malespín. The general is in another country with our army."
 ca_el_salvador_events.29.f:0 "\"He has the army. They have the capital. One of those can be taken back.\""
 ca_el_salvador_events.29.a:0 "Depose Malespín"
 ca_el_salvador_events.29.b:0 "Stand by the general"
 ca_el_salvador_events.30.t:0 "The Excommunication"
 ca_el_salvador_events.30.d:0 "The general has had a priest shot. Bishop Viteri, who made him, has now excommunicated him. In a country where the Church marries, buries and records every soul, that is a sentence of political death."
 ca_el_salvador_events.30.f:0 "\"The sword that served the Church has been cut off by it.\""
 ca_el_salvador_events.30.a:0 "Publish the excommunication"
 ca_el_salvador_events.30.b:0 "Expel the bishop instead"
 ca_el_salvador_events.31.t:0 "San Fernando, Chalatenango"
 ca_el_salvador_events.31.d:0 "He came back in November with another invasion, and it ended in a private quarrel in a small town on the Honduran border. Francisco Malespín was killed on the twenty-fifth. His head was displayed in San Salvador."
 ca_el_salvador_events.31.f:0 "\"He died the way the country he ruled has been dying: in a village argument, over something personal.\""
 ca_el_salvador_events.31.a:0 "The caudillo is dead"
 ca_el_salvador_events.31.b:0 "Avenge him"
 ca_el_salvador_events.32.t:0 "The Fairs of San Miguel"
 ca_el_salvador_events.32.d:0 "Every November the whole east comes to San Miguel: the indigo of the obrajes, the hides from Honduras, the cottons from Belize. The council auctions the stalls in the first days of the month and charges two reales for the ground."
 ca_el_salvador_events.32.f:0 "\"One month of the year, San Miguel is the capital of three countries.\""
 ca_el_salvador_events.32.a:0 "Protect the fairs"
 ca_el_salvador_events.32.b:0 "Ship direct around the Horn"
 ca_el_salvador_events.33.t:0 "Habilitación"
 ca_el_salvador_events.33.d:0 "The merchant advances money or goods against the coming indigo harvest at about five per cent. He also sets the price of the indigo and the value of the goods, which is where the real interest is."
 ca_el_salvador_events.33.f:0 "\"Whoever lends decides what everything is worth. That is the whole economy in one sentence.\""
 ca_el_salvador_events.33.a:0 "Leave the merchants to it"
 ca_el_salvador_events.33.b:0 "A public credit fund instead"
 ca_el_salvador_events.34.t:0 "The Port of La Unión"
 ca_el_salvador_events.34.d:0 "Between San Francisco and Guayaquil there is no better anchorage, and it is ours. Fifty-eight of every hundred ships that reach El Salvador drop anchor in the bay of Conchagua, and the south of Honduras ships through it too."
 ca_el_salvador_events.34.f:0 "\"A good harbour is worth more than a good general and lasts longer.\""
 ca_el_salvador_events.34.a:0 "Build up La Unión"
 ca_el_salvador_events.34.b:0 "Build up Acajutla and the west"
 ca_el_salvador_events.35.t:0 "The British Blockade"
 ca_el_salvador_events.35.d:0 "Consul Chatfield has the squadron off our coast on behalf of the British bondholders. In a year when six ships reached the whole coast, the customs house is the government and the government has no customs house."
 ca_el_salvador_events.35.f:0 "\"He does not need to invade. He only needs to wait offshore.\""
 ca_el_salvador_events.35.a:0 "Endure the blockade"
 ca_el_salvador_events.35.b:0 "Pay Chatfield what he asks"
 ca_el_salvador_events.38.t:0 "Morazán Comes Home"
 ca_el_salvador_events.38.d:0 "Seven years after San José, his remains have been brought back to San Salvador and buried with the honours of a head of state. Half the country weeps and the other half watches who is weeping."
 ca_el_salvador_events.38.f:0 "\"Costa Rica shot him. We buried him. Guatemala is still afraid of him.\""
 ca_el_salvador_events.38.a:0 "Bury him with state honours"
 ca_el_salvador_events.38.b:0 "A quiet burial"
 ca_el_salvador_events.36.t:0 "Doroteo Vasconcelos"
 ca_el_salvador_events.36.d:0 "The new president is a liberal, a unionist and a man who believes that what was broken in 1840 can be mended by 1855. He intends to begin with Guatemala, which is where it broke."
 ca_el_salvador_events.36.f:0 "\"He is not planning a war. He is planning a restoration, and the war is a detail.\""
 ca_el_salvador_events.36.a:0 "A liberal and unionist government"
 ca_el_salvador_events.36.b:0 "Govern for the merchants instead"
 ca_el_salvador_events.37.t:0 "Los Altos and the Exiles"
 ca_el_salvador_events.37.d:0 "Quetzaltenango has declared itself independent of Guatemala again, and the Guatemalan liberals are crossing our border by the dozen. Carrera has asked us to close it."
 ca_el_salvador_events.37.f:0 "\"Every exile is a man with a reason, and we are collecting reasons.\""
 ca_el_salvador_events.37.a:0 "Grant them asylum"
 ca_el_salvador_events.37.b:0 "Close the border"
 ca_el_salvador_events.39.t:0 "Money and Rifles for the Mountain"
 ca_el_salvador_events.39.d:0 "The Lucíos hold eastern Guatemala and they are asking for what rebels always ask for. Twenty thousand pesos and the rifles to go with them would keep Carrera busy for another year."
 ca_el_salvador_events.39.f:0 "\"It is cheaper than a war and it is still a war.\""
 ca_el_salvador_events.39.a:0 "Fund the Mountain"
 ca_el_salvador_events.39.b:0 "Keep our hands clean"
 ca_el_salvador_events.40.t:0 "The Alliance of Ocotepeque"
 ca_el_salvador_events.40.d:0 "On the fourth of January, at Ocotepeque, Juan Lindo signs with us. Nicaragua was invited and declined. Two states against the one that beat all five."
 ca_el_salvador_events.40.f:0 "\"Two is not five. But two is not one.\""
 ca_el_salvador_events.40.a:0 "Sign the alliance"
 ca_el_salvador_events.40.b:0 "Go no further"
 ca_el_salvador_events.41.t:0 "The Ultimatum"
 ca_el_salvador_events.41.d:0 "We demand that President Paredes stand down and that Rafael Carrera be exiled from Central America. Guatemala has until our troops reach the border to answer."
 ca_el_salvador_events.41.f:0 "\"We have asked a country to hand us the only man who has never lost.\""
 ca_el_salvador_events.41.a:0 "Send the ultimatum"
 ca_el_salvador_events.41.b:0 "Withdraw the demands"
 ca_el_salvador_events.42.t:0 "La Arada"
 ca_el_salvador_events.42.d:0 "Carrera has fortified the foothills above the San José river, with a meadow and cane fields in front of him. He has fifteen hundred men. We have four thousand Salvadorans and two thousand Hondurans, and the ground he has chosen."
 ca_el_salvador_events.42.f:0 "\"Four to one, and he is the one who picked the field.\""
 ca_el_salvador_events.42.a:0 "The army breaks"
 ca_el_salvador_events.42.b:0 "The army holds"
 ca_el_salvador_events.42.c:0 "Refuse battle and withdraw"
 ca_el_salvador_events.43.t:0 "Carrera at Santa Ana"
 ca_el_salvador_events.43.d:0 "He crossed the border and took Santa Ana, and then President Paredes recalled him because we had asked for terms. He could have taken San Salvador. Everyone here knows it, including him."
 ca_el_salvador_events.43.f:0 "\"He went home because he was told to. That is the part that should frighten us.\""
 ca_el_salvador_events.43.a:0 "Make peace with Guatemala"
 ca_el_salvador_events.43.b:0 "Fight on"
