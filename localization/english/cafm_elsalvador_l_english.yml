 je_ca_els_bastion:0 "The Last Bastion"
 je_ca_els_bastion_desc:0 "El Salvador is the only state left in the Federal Republic of Central America."
 je_ca_els_bastion_reason:0 "The other four states have resumed their sovereignty. The flag, the president and the bill are all ours now."
 je_ca_els_bastion_status_sola:0 "We hold the Union alone, and it is bleeding the treasury dry."
 je_ca_els_bastion_status_media:0 "The Federation exists on paper and in San Salvador, and nowhere else."
 je_ca_els_bastion_status_viva:0 "There is still a Union worth the name, and others who answer to it."
 je_ca_els_bastion_conclusion_salvada:0 "The Union has survived. It is smaller than it was, and it is still a Union."
 je_ca_els_bastion_conclusion_disuelta:0 "The Federal Republic of Central America is dissolved."
 je_ca_els_malespin:0 "The Caudillo Malespín"
 je_ca_els_malespin_desc:0 "The commander of the army is becoming the government."
 je_ca_els_malespin_reason:0 "Carrera gave us the general, the bishop gave him legitimacy, and the civil government has given him everything else."
 je_ca_els_malespin_status_regimen:0 "The general governs. The president signs."
 je_ca_els_malespin_status_alta:0 "The army answers to Malespín, not to the government."
 je_ca_els_malespin_status_baja:0 "The general is strong, but the civil government still decides."
 je_ca_els_malespin_conclusion_caido:0 "The caudillo has fallen."
 je_ca_els_malespin_conclusion_perpetuo:0 "El Salvador belongs to its general."
 je_ca_els_arada:0 "The Road to La Arada"
 je_ca_els_arada_desc:0 "Vasconcelos means to restore the Union, beginning with Guatemala."
 je_ca_els_arada_reason:0 "Asylum for the exiles, money for the Mountain, an alliance with Honduras. Each step makes the war likelier and the army readier."
 je_ca_els_arada_status_listo:0 "The army is paid, armed and allied. If it comes to a battle, we can win it."
 je_ca_els_arada_status_medio:0 "We are committed to the quarrel but not yet ready for the war."
 je_ca_els_arada_status_bajo:0 "There is talk of restoring the Union. There is not yet an army to do it with."
 je_ca_els_arada_conclusion_victoria:0 "The war with Guatemala has not destroyed us."
 je_ca_els_arada_conclusion_derrota:0 "Five hundred and twenty-eight dead at a river in Chiquimula."
 ca_button_els_pagar_federal:0 "Pay the Federal Army"
 ca_button_els_pagar_federal_desc:0 "The federal troops have not been paid in months. Our treasury is the only one left that can do it."
 ca_button_els_llamar_estados:0 "Call on the Other States"
 ca_button_els_llamar_estados_desc:0 "Send commissioners to Honduras and Nicaragua. One state that answers would make us a Union again."
 ca_button_els_llamar_estados_tt:0 "Honduras or Nicaragua exists"
 ca_button_els_cortejar_obispo:0 "Court the Bishop"
 ca_button_els_cortejar_obispo_desc:0 "Viteri made the general and Viteri can unmake him. The Church would rather deal with a government than with a sword."
 ca_button_els_comprar_fusiles:0 "Buy Rifles in Belize"
 ca_button_els_comprar_fusiles_desc:0 "The British merchants will sell to anyone with silver. It is expensive, and it is the only way to arm an army here."
 ca_button_els_comprar_fusiles_tt:0 "The coast is not under blockade"
 els_ultimo_bastion:0 "The Last Bastion"
 els_ultimo_bastion_desc:0 "El Salvador pays for a Federation that no longer has anyone else in it."
 els_administracion_canas:0 "The Four Ministries"
 els_administracion_canas_desc:0 "Finance, war, foreign affairs and the interior."
 els_pagar_ejercito_federal:0 "Paying the Federal Army"
 els_pagar_ejercito_federal_desc:0 "Our revenue is keeping the Federation's soldiers fed."
 els_union_salvada:0 "The Union Preserved"
 els_union_salvada_desc:0 "Smaller than it was, and still standing."
 els_estado_soberano:0 "Free, Sovereign and Independent"
 els_estado_soberano_desc:0 "Declared on 22 February 1841."
 els_universidad:0 "The University of El Salvador"
 els_universidad_desc:0 "Paid for with two reales from every bag of indigo leaving La Unión."
 els_regimen_malespin:0 "The Regime of the Caudillo"
 els_regimen_malespin_desc:0 "The general governs and the president signs."
 els_guerra_del_caudillo:0 "The Caudillo's War"
 els_guerra_del_caudillo_desc:0 "A war against Nicaragua, fought for reasons that belong to one man."
 els_ferias_san_miguel:0 "The Fairs of San Miguel"
 els_ferias_san_miguel_desc:0 "Every November the east becomes a market."
 els_embarque_directo:0 "Direct Shipping"
 els_embarque_directo_desc:0 "Indigo goes round the Horn without waiting for the fair."
 els_habilitacion:0 "Habilitación"
 els_habilitacion_desc:0 "Credit against the coming harvest, at five per cent and the merchant's price."
 els_credito_publico:0 "Public Credit"
 els_credito_publico_desc:0 "The state lends against the harvest, and sets no price."
 els_puerto_la_union:0 "The Port of La Unión"
 els_puerto_la_union_desc:0 "The best anchorage between San Francisco and Guayaquil."
 els_acajutla:0 "The Port of Acajutla"
 els_acajutla_desc:0 "The west ships through Sonsonate."
 els_bloqueo_britanico:0 "The British Blockade"
 els_bloqueo_britanico_desc:0 "Consul Chatfield's squadron is sitting on our customs revenue."
 els_memoria_de_morazan:0 "The Memory of Morazán"
 els_memoria_de_morazan_desc:0 "He is buried in San Salvador with the honours of a head of state."
 els_alianza_ocotepeque:0 "The Alliance of Ocotepeque"
 els_alianza_ocotepeque_desc:0 "El Salvador and Honduras, against Guatemala."
 els_desastre_de_la_arada:0 "The Disaster of La Arada"
 els_desastre_de_la_arada_desc:0 "The army that was going to restore the Union is gone."
 els_vencedor_de_chiquimula:0 "The Victor of Chiquimula"
 els_vencedor_de_chiquimula_desc:0 "Carrera has been beaten, and Central America knows it."
