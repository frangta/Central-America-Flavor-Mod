 # --- Diario je_ca_hon_caudillo ---
 je_ca_hon_caudillo:0 "The Caudillo's Shadow"
 je_ca_hon_caudillo_reason:0 "Honduras has a Jefe, an Assembly and a constitution, but the men with rifles answer to the commander of arms. The higher this value climbs, the more the barracks govern in place of the law. At 40 Francisco Ferrera enters the scene; at 80 the commander's regime is open."
 je_ca_hon_caudillo_status_baja:0 "The civil government still rules."
 je_ca_hon_caudillo_status_alta:0 "The commander of arms weighs on every decision."
 je_ca_hon_caudillo_status_regimen:0 "The barracks govern in all but name."
 je_ca_hon_caudillo_complete:0 "The caudillo goes into exile."
 je_ca_hon_caudillo_fail:0 "The caudillo rules for life."

 # --- Modificadores ---
 hon_estado_inacabado:0 "An Unfinished State"
 hon_estado_inacabado_desc:0 "No cart roads link the interior with the coasts, contraband empties the treasury and the state does not hold a monopoly on violence."
 hon_milicias_comarca:0 "District Militias"
 hon_milicias_comarca_desc:0 "Rural militias obey their hacendados and the commander of arms before the civil government."
 hon_media_leche:0 "The Media Leche Coin"
 hon_media_leche_desc:0 "The provisional coin of 1832, half silver and half copper, is refused in many villages."
 hon_sede_tegucigalpa:0 "Government in Tegucigalpa"
 hon_sede_tegucigalpa_desc:0 "The government sits beside the silver mines and the Mint."
 hon_sede_alterna:0 "An Alternating Capital"
 hon_sede_alterna_desc:0 "The government moves between Comayagua and Tegucigalpa: costly for the administration, but neither city feels abandoned."
 hon_reforma_administrativa:0 "Reform of the Interior Administration"
 hon_reforma_administrativa_desc:0 "Rivera's reform seeks stability and respect for the state through simpler and more energetic administration."
 hon_orden_militar:0 "Military Order"
 hon_orden_militar_desc:0 "The commander of arms keeps order with the army, above the civil authorities."
 hon_concesiones_mineras:0 "Mining Concessions"
 hon_concesiones_mineras_desc:0 "Foreign houses work the old mines of Tegucigalpa and Yuscarán."
 hon_casa_de_moneda:0 "The Mint of Tegucigalpa"
 hon_casa_de_moneda_desc:0 "Honduran silver is struck into Honduran coin."
 hon_contrata_caoba:0 "The Mahogany Contract"
 hon_contrata_caoba_desc:0 "British cutters from Belize fell mahogany on the north coast under a federal contract."
 hon_amnistia:0 "The Amnesty of 1836"
 hon_amnistia_desc:0 "The government pardoned the mutineers of Tegucigalpa, except those who keep conspiring."
 hon_tegucigalpa_asolada:0 "Tegucigalpa Laid Waste"
 hon_tegucigalpa_asolada_desc:0 "The troops retook the city, but many of its people have not returned to the mines."
 hon_cabildos:0 "Concessions to the Town Councils"
 hon_cabildos_desc:0 "The government bought peace from the town councils at the cost of its own authority."
 hon_vacio_de_poder:0 "Power Vacuum"
 hon_vacio_de_poder_desc:0 "A provisional councillor governs until an elected Jefe takes office."
 hon_prorroga_rivera:0 "Rivera's Extended Term"
 hon_prorroga_rivera_desc:0 "The Jefe remains in office after his term expired, against the forms he once defended."
 hon_regimen_comandante:0 "The Commander's Regime"
 hon_regimen_comandante_desc:0 "Whoever sits in the Jefe's chair, the commander of arms decides."
