l_english:
 # CAFM - Nicaragua fase 2, Honduras fase 2 y la Mosquitia (10 nov 2026)
 ca_nicaragua_events.26.t:0 "The Assembly at Chinandega"
 ca_nicaragua_events.26.d:0 "The constituent assembly has opened its sessions at Chinandega under head of state José Núñez. Chinandega is neither León nor Granada, which is the only reason both cities agreed to send deputies."
 ca_nicaragua_events.26.f:0 "\"A neutral town, chosen because neither faction can win an argument in it.\""
 ca_nicaragua_events.26.a:0 "Let it sit at Chinandega"
 ca_nicaragua_events.26.b:0 "Move it to León"
 ca_nicaragua_events.27.t:0 "Free, Sovereign and Independent"
 ca_nicaragua_events.27.d:0 "On the thirtieth of April the assembly declares Nicaragua free and independent of every other power, and breaks the federal pact with Central America. Honduras had already gone. El Salvador is still holding the flag alone."
 ca_nicaragua_events.27.f:0 "\"We did not leave a country. We left a debt and a quarrel.\""
 ca_nicaragua_events.27.a:0 "Break the federal pact"
 ca_nicaragua_events.27.b:0 "Stay in the Federation"
 ca_nicaragua_events.28.t:0 "The Constitution of the State"
 ca_nicaragua_events.28.d:0 "The assembly has a text: two chambers, a Supreme Director with a two-year term, and a Catholic religion of state. Two years is short enough that nobody can build anything and long enough that everybody will try."
 ca_nicaragua_events.28.f:0 "\"A constitution written by men who expect to be out of office before it matters.\""
 ca_nicaragua_events.28.a:0 "Swear the Constitution"
 ca_nicaragua_events.28.b:0 "Leave it a draft"
 ca_nicaragua_events.29.t:0 "The Treaty with Honduras"
 ca_nicaragua_events.29.d:0 "On the eighteenth of January Nicaragua and Honduras sign a treaty of mutual aid and go to war against El Salvador. Our column marches under Bernardo Méndez. Morazán is waiting on the other side."
 ca_nicaragua_events.29.f:0 "\"Two states that have just left the Union, at war with the state that stayed in it.\""
 ca_nicaragua_events.29.a:0 "March with Honduras"
 ca_nicaragua_events.29.b:0 "Send not one man"
 ca_nicaragua_events.30.t:0 "Fonseca Takes the Command"
 ca_nicaragua_events.30.d:0 "Méndez came back from the war discredited, and his rivals in León have handed the general command of the army to Casto Fonseca. He is not a politician and does not pretend to be one."
 ca_nicaragua_events.30.f:0 "\"The men who gave him the army believe they will be the ones holding it.\""
 ca_nicaragua_events.30.a:0 "Give him the general command"
 ca_nicaragua_events.30.b:0 "Find another commander"
 ca_nicaragua_events.31.t:0 "The Grand Marshal"
 ca_nicaragua_events.31.d:0 "He calls himself Grand Marshal now. The levies are heavy and collected by soldiers, the press has gone quiet, and the schools in León have closed because the teachers were the ones writing in the press."
 ca_nicaragua_events.31.f:0 "\"There is no government. There is a man with a rank he gave himself.\""
 ca_nicaragua_events.31.a:0 "Let him do as he likes"
 ca_nicaragua_events.31.b:0 "Stand up to the Marshal"
 ca_nicaragua_events.41.t:0 "A Flag at the Mouth of the River"
 ca_nicaragua_events.41.d:0 "On the twelfth of August the superintendent of British Honduras and the Mosquito king landed at San Juan del Norte and declared that the town and the whole Atlantic coast belong to the kingdom. Our customs house there collects nothing now."
 ca_nicaragua_events.41.f:0 "\"A king we have never seen owns the only door we have to the Atlantic.\""
 ca_nicaragua_events.41.a:0 "Protest in London"
 ca_nicaragua_events.41.b:0 "Garrison the river mouth"
 ca_nicaragua_events.41.c:0 "We have no ships"
 ca_nicaragua_events.32.t:0 "Choluteca"
 ca_nicaragua_events.32.d:0 "On the twenty-ninth of August the Marshal's army crossed into Honduras and was beaten at Choluteca. He went to war to make himself indispensable and came back having proved the opposite."
 ca_nicaragua_events.32.f:0 "\"He has spent the state's last silver proving he cannot win a battle.\""
 ca_nicaragua_events.32.a:0 "The Marshal's defeat"
 ca_nicaragua_events.33.t:0 "Malespín Before León"
 ca_nicaragua_events.33.d:0 "Honduran and Salvadoran forces under Francisco Malespín have crossed the border and sat down in front of León. Director Pérez is out; Emiliano Madriz has the office and the siege."
 ca_nicaragua_events.33.f:0 "\"Our quarrel with Granada has brought two foreign armies into it.\""
 ca_nicaragua_events.33.a:0 "Hold the city"
 ca_nicaragua_events.33.b:0 "Let Granada negotiate"
 ca_nicaragua_events.34.t:0 "Montenegro and the Marshal"
 ca_nicaragua_events.34.d:0 "On the eighth of December José del Montenegro, sent by Granada, agrees with Malespín to form a government under Silvestre Selva. Granada has negotiated the surrender of a city that is not Granada."
 ca_nicaragua_events.34.f:0 "\"The city that is not besieged has decided what the besieged city will accept.\""
 ca_nicaragua_events.34.a:0 "Accept the new government"
 ca_nicaragua_events.34.b:0 "León recognizes nothing"
 ca_nicaragua_events.35.t:0 "Silvestre Selva at Masaya"
 ca_nicaragua_events.35.d:0 "On the sixteenth of December he takes office at Masaya, which is neither of the two cities and is as close as anyone can get to neutral while a siege is going on forty leagues away."
 ca_nicaragua_events.35.f:0 "\"A government in a third town, because the first two are at war.\""
 ca_nicaragua_events.35.a:0 "Silvestre Selva, Director"
 ca_nicaragua_events.36.t:0 "León, the Twenty-Fourth of January"
 ca_nicaragua_events.36.d:0 "The city fell after a fifty-day siege. Fonseca was taken and shot; Madriz was killed; the houses were looted and burned. Whatever the quarrel between León and Granada was about, this is what it cost."
 ca_nicaragua_events.36.f:0 "\"The Grand Marshal lasted exactly as long as the army that named him.\""
 ca_nicaragua_events.36.a:0 "The city sacked"
 ca_nicaragua_events.36.b:0 "Save what can be saved"
 ca_nicaragua_events.37.t:0 "Sandoval, Director"
 ca_nicaragua_events.37.d:0 "On the fourth of April José León Sandoval takes office. He is from Granada, he is taking over a burned León, and he will spend his term resigning and being refused."
 ca_nicaragua_events.37.f:0 "\"A Granadan governing León a month after Granada helped burn it.\""
 ca_nicaragua_events.37.a:0 "José León Sandoval"
 ca_nicaragua_events.38.t:0 "The Amnesty"
 ca_nicaragua_events.38.d:0 "A general amnesty, excluding officers of the rank of lieutenant colonel and above who broke the Constitution. It does not cancel anyone's liability for the cost of the war, which is the part people will notice."
 ca_nicaragua_events.38.f:0 "\"Forgiven for the rebellion, still billed for it.\""
 ca_nicaragua_events.38.a:0 "Amnesty, except the chiefs"
 ca_nicaragua_events.38.b:0 "No pardon for anyone"
 ca_nicaragua_events.39.t:0 "Chelón Valle"
 ca_nicaragua_events.39.d:0 "José María Valle has raised Chinandega, lost it, retaken it a month later and then crossed into Honduras. The disturbances reached León and Managua on the way."
 ca_nicaragua_events.39.f:0 "\"A man can take a town twice in two months here. That is the whole problem.\""
 ca_nicaragua_events.39.a:0 "Chase him into Honduras"
 ca_nicaragua_events.39.b:0 "Let him go"
 ca_nicaragua_events.40.t:0 "Managua, City"
 ca_nicaragua_events.40.d:0 "On the twenty-fourth of July Managua is raised to the rank of city and the government moves there. It is halfway between León and Granada, has no faction of its own, and is therefore the only place either of them will accept."
 ca_nicaragua_events.40.f:0 "\"The capital of Nicaragua is a compromise with a lake view.\""
 ca_nicaragua_events.40.a:0 "The seat at Managua"
 ca_nicaragua_events.40.b:0 "Alternate the capital"
 ca_nicaragua_events.49.t:0 "Two Years at a Time"
 ca_nicaragua_events.49.d:0 "José Guerrero follows Sandoval, and Norberto Ramírez will follow Guerrero. The Constitution gives the Supreme Director two years, which is long enough to learn the job and not long enough to do it."
 ca_nicaragua_events.49.f:0 "\"Every two years we elect a man to inherit the same unpaid army.\""
 ca_nicaragua_events.49.a:0 "Let whoever can, govern"
 ca_nicaragua_events.49.b:0 "A Director for four years"
 ca_nicaragua_events.42.t:0 "San Juan del Norte Taken"
 ca_nicaragua_events.42.d:0 "The Mosquito king's ultimatum expired on the first of January and two British warships enforced it. Our garrison is out. The town is now the kingdom's, and the kingdom's is now Britain's."
 ca_nicaragua_events.42.f:0 "\"A kingdom of four thousand people has taken our port, with someone else's navy.\""
 ca_nicaragua_events.42.a:0 "Two frigates are two frigates"
 ca_nicaragua_events.42.b:0 "Fight for the river mouth"
 ca_nicaragua_events.43.t:0 "Greytown"
 ca_nicaragua_events.43.d:0 "On the seventh of March we sign a treaty ceding the town to the kingdom, which renames it Greytown after the governor of Jamaica. Our only Atlantic port now has an English name."
 ca_nicaragua_events.43.f:0 "\"They did not even keep the name.\""
 ca_nicaragua_events.43.a:0 "Sign"
 ca_nicaragua_events.43.b:0 "We sign nothing"
 ca_nicaragua_events.44.t:0 "Squier"
 ca_nicaragua_events.44.d:0 "Ephraim George Squier has arrived as the American agent in Central America, and he wants the transit route in American hands before the British finish taking it. Two empires want the same river, which is the best position we have been in for years."
 ca_nicaragua_events.44.f:0 "\"When two great powers want the same thing from you, you are briefly a country.\""
 ca_nicaragua_events.44.a:0 "Deal with the Americans"
 ca_nicaragua_events.44.b:0 "Neither one nor the other"
 ca_nicaragua_events.45.t:0 "The Contract"
 ca_nicaragua_events.45.d:0 "On the twenty-sixth of August the government signs with Cornelius Vanderbilt: the exclusive right to build a waterway within twelve years, and meanwhile the sole administration of the overland route across Rivas."
 ca_nicaragua_events.45.f:0 "\"Twelve years to dig a canal, and the road in the meantime. The road is the deal.\""
 ca_nicaragua_events.45.a:0 "Twelve years to open the canal"
 ca_nicaragua_events.45.b:0 "The river belongs to the State"
 ca_nicaragua_events.46.t:0 "The Road to California"
 ca_nicaragua_events.46.d:0 "They come up the San Juan by steamer, cross the lake, and ride the twelve leagues of Rivas to the Pacific. Between New York and San Francisco there is no faster way, and all of it is on our ground."
 ca_nicaragua_events.46.f:0 "\"Half the gold rush walks across Rivas. We should be charging them for it.\""
 ca_nicaragua_events.46.a:0 "Charge for every passenger"
 ca_nicaragua_events.46.b:0 "Let them pass and leave us alone"
 ca_nicaragua_events.47.t:0 "Clayton and Bulwer"
 ca_nicaragua_events.47.d:0 "On the nineteenth of April Washington and London agree not to occupy, fortify or colonize Nicaragua, Costa Rica or the Mosquito Coast. Neither of them asked us, and each of them reads the text differently."
 ca_nicaragua_events.47.f:0 "\"Two powers have signed a treaty about our territory, in a city neither of us has seen.\""
 ca_nicaragua_events.47.a:0 "Let them neutralize each other"
 ca_nicaragua_events.48.t:0 "The Prometheus"
 ca_nicaragua_events.48.d:0 "On the twenty-first of November a British warship fired on the American steamer Prometheus at Greytown over unpaid harbour dues. The port is ours on no map anyone respects, and now two navies are shooting in it."
 ca_nicaragua_events.48.f:0 "\"They are fighting over the harbour dues of a port they both took from us.\""
 ca_nicaragua_events.48.a:0 "Protest, and charge anyway"
 ca_nicaragua_events.48.b:0 "Let them settle it"
 ca_nicaragua_events.50.t:0 "Two Winners"
 ca_nicaragua_events.50.d:0 "León has counted the votes and so has Granada, and the two counts do not agree on who the Supreme Director is. Both men have been sworn in. Both have an escort."
 ca_nicaragua_events.50.f:0 "\"The election worked perfectly. It produced exactly one Director for each city.\""
 ca_nicaragua_events.50.a:0 "Recognize León's man"
 ca_nicaragua_events.50.b:0 "Recognize Granada's man"
 ca_nicaragua_events.50.c:0 "Annul the election"
 ca_nicaragua_events.51.t:0 "A Seat Neither City Owns"
 ca_nicaragua_events.51.d:0 "Each city now has its own government, its own treasury and its own idea of where the capital is. There is one way out of this that has ever worked, and it is a town on the lake that belongs to neither of them."
 ca_nicaragua_events.51.f:0 "\"Nobody will give up the capital. Both will give it to a third town.\""
 ca_nicaragua_events.51.a:0 "A neutral seat at Managua"
 ca_nicaragua_events.51.b:0 "Let each city keep its government"
 ca_nicaragua_events.52.t:0 "Legitimists and Democrats"
 ca_nicaragua_events.52.d:0 "The quarrel has names now: Legitimists in Granada, Democrats in León, and armies behind both. It will not be settled by an election, and everyone involved knows it."
 ca_nicaragua_events.52.f:0 "\"Twenty years of this, and at the end of it someone will invite a foreigner to help.\""
 ca_nicaragua_events.52.a:0 "The war of the factions"
 ca_nicaragua_events.52.b:0 "A congress of peace"
