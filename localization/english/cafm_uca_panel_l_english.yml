l_english:
 # CAFM - Rediseño del diario de la UCA, entrega 2 (10 nov 2026)
 CA_UCA_HDR_TITLE_FEDERAL:0 "The Federal Republic"
 CA_UCA_HDR_MOTTO_FEDERAL:0 "#i \"God, Union, Liberty\"#!"
 CA_UCA_HDR_DESC_FEDERAL:0 "Five sovereign States bound by the Constitution of 1824. The Union lives only as long as the States choose to stay in it."
 CA_UCA_HDR_TITLE_CENTRALIST:0 "The Supreme Government"
 CA_UCA_HDR_MOTTO_CENTRALIST:0 "#i \"Order, Religion and Union\"#!"
 CA_UCA_HDR_DESC_CENTRALIST:0 "One nation ruled from Guatemala. The States must obey the capital, by law or by the sword."
 CA_UCA_PW_FEDERAL:0 "Federalists"
 CA_UCA_PW_CENTRALIST:0 "Centralists"
 CA_UCA_PW_SEPARATIST:0 "Separatists"
 CA_UCA_PW_FEDERAL_TT:0 "#b Federalist power#! (0-100)\nInterest groups with the Federal ideology (up to 40), support for the Federalist movement (up to 30) and loyal States (up to 30).\nAt #b 60#! the faction dominates; at #b 15#! it collapses."
 CA_UCA_PW_CENTRALIST_TT:0 "#b Centralist power#! (0-100)\nInterest groups with the Unitarian ideology (up to 40), support for the Unitarian movement (up to 30), and the unitary law, state of siege, intendants and centralist reforms (up to 30).\nAt #b 60#! the faction dominates; at #b 15#! it collapses."
 CA_UCA_PW_SEPARATIST_TT:0 "#b Separatist power#! (0-100)\nInterest groups with the Separatist ideology (up to 40), support for the national movements of the States (up to 30), and rebel or separated States (up to 30).\nAt #b 60#! the faction dominates; at #b 15#! it collapses."
 CA_UCA_TAB_GOV:0 "Government"
 CA_UCA_TAB_STATES:0 "States"
 CA_UCA_TAB_CRISIS:0 "Crisis"
 CA_UCA_TAB_GOV_TT:0 "Show the reforms and decrees of our path."
 CA_UCA_TAB_STATES_TT:0 "Show the interventions in the States and their requests for help."
 CA_UCA_TAB_CRISIS_TT:0 "Show the military measures."
 CA_FVC_FEDERAL_RESERVE_ARMY:0 "Federal reserve army"
 ca_button_reform_1835:0 "Constitutional Reform of 1835"
 ca_button_reform_1835_desc:0 "In 1835 Congress approved changes to the Constitution of 1824 to give the federal government its own revenue and a federal district. The States must now accept them."
 ca_button_federal_commissioners:0 "Commissioners of Conciliation"
 ca_button_federal_commissioners_desc:0 "Send federal commissioners to the most restless State to listen to its complaints and win it back."
 ca_button_federal_commissioners_target_tt:0 "At least one State is #b Rebel#! or #b Wavering#!"
 ca_button_federal_commissioners_effect_tt:0 "The loyalty of the least loyal State rises by one level (Rebel first, then Wavering)."
 ca_button_federal_reserve_army:0 "Federal Reserve Army"
 ca_button_federal_reserve_army_desc:0 "Raise a reserve army paid by the federal treasury. It will defend the Union, but its officers will gain a voice in government."
 ca_button_federal_reserve_army_fvc_tt:0 "#R Who Rules the Federation#! falls by #b 15#! now and by #b 0.5#! every month."
 ca_frca_commissioners_cost:0 "Federal Commissioners"
 ca_frca_commissioners_cost_desc:0 "The government has spent its authority to calm the States."
 ca_frca_federal_reserve_army:0 "Federal Reserve Army"
 ca_frca_federal_reserve_army_desc:0 "A reserve army paid by the federal treasury."
 ca_frca_reform_1835_imposed:0 "The Reform of 1835 Imposed"
 ca_frca_reform_1835_imposed_desc:0 "The federal government has imposed the reform on the States."
 ca_frca_reform_1835_negotiated:0 "The Reform of 1835 Agreed"
 ca_frca_reform_1835_negotiated_desc:0 "The States have accepted the reform after long talks."
 ca_frca_coup_regime:0 "A New Regime"
 ca_frca_coup_regime_desc:0 "A faction has seized the federal government by force."
 cafm_uca_route.1.t:0 "The Federal Path"
 cafm_uca_route.1.d:0 "We have chosen to defend the Republic of 1824. The States will keep their own governments, and the Union will rest on their good will. Our enemies are the separatists who want to break the Union, and the serviles who want to rule it from Guatemala."
 cafm_uca_route.1.f:0 "\"Union is strength, and the Federation is the only Union that the States will accept.\""
 cafm_uca_route.1.a:0 "For the Federation!"
 cafm_uca_route.1.a_tt:0 "Watch the bar #b Who Rules the Federation#!: if the Centralists push it to #b -100#!, the serviles will seize the government."
 cafm_uca_route.2.t:0 "The Centralist Path"
 cafm_uca_route.2.d:0 "We have chosen order over freedom. The States will obey the capital, the Church will have its old place, and the army will keep the peace. Our enemies are the separatists in the provinces and the liberals who still dream of Morazán’s Republic."
 cafm_uca_route.2.f:0 "\"Order first; liberty will come later, if it ever comes.\""
 cafm_uca_route.2.a:0 "Order, Religion and Union!"
 cafm_uca_route.2.a_tt:0 "Watch the bar #b Who Rules the Federation#!: if the Federalists push it to #b +100#!, the liberals will rise against us."
 cafm_uca_route.3.t:0 "A Servile Conspiracy"
 cafm_uca_route.3.d:0 "Officers of the federal army are meeting in secret with conservative landowners and priests. They say the Republic is weak and that a strong hand is needed in Guatemala. If they move, the Federation will fall to the serviles."
 cafm_uca_route.3.f:0 "\"In this country, a revolution starts in the barracks and ends in the cathedral.\""
 cafm_uca_route.3.a:0 "Purge the disloyal officers"
 cafm_uca_route.3.b:0 "Win them over with favours"
 cafm_uca_route.3.c:0 "They are only talking"
 cafm_uca_route.3.c_tt:0 "Nothing happens for now."
 cafm_uca_route.4.t:0 "A Liberal Pronouncement"
 cafm_uca_route.4.d:0 "Liberal lawyers, merchants and old officers of Morazán have signed a pronouncement against the Supreme Government. They call for the return of the Constitution of 1824 and of the federal Congress."
 cafm_uca_route.4.f:0 "\"The Republic is not dead. It is only sleeping.\""
 cafm_uca_route.4.a:0 "Exile the leaders"
 cafm_uca_route.4.b:0 "Offer them some concessions"
 cafm_uca_route.4.c:0 "Ignore the pronouncement"
 cafm_uca_route.4.c_tt:0 "Nothing happens for now."
 cafm_uca_route.5.t:0 "The Servile Coup"
 cafm_uca_route.5.d:0 "The army has surrounded the federal palace. Conservative officers have taken control of the government in the name of order and religion. The Federal Republic of 1824 is over."
 cafm_uca_route.5.f:0 "\"The bayonets have spoken where the laws could not.\""
 cafm_uca_route.5.a:0 "The Republic has fallen"
 cafm_uca_route.6.t:0 "The Liberal Revolution"
 cafm_uca_route.6.d:0 "The liberals have risen in the capital and the provinces. The Supreme Government has collapsed, and its leaders have fled. The Union will not be ruled from Guatemala any longer."
 cafm_uca_route.6.f:0 "\"No government can rule a people that refuses to be ruled.\""
 cafm_uca_route.6.a:0 "The Supreme Government has fallen"
 cafm_uca_route.7.t:0 "A Faction Takes the Lead"
 cafm_uca_route.7.d_federal:0 "The #b Federalists#! now lead the political life of the Union. Their newspapers, their clubs and their officers set the tone in every State."
 cafm_uca_route.7.d_centralist:0 "The #b Centralists#! now lead the political life of the Union. The army, the clergy and the great families of Guatemala set the tone in every State."
 cafm_uca_route.7.d_separatist:0 "The #b Separatists#! now lead the political life of the Union. In every State, more people want to govern themselves."
 cafm_uca_route.7.f:0 "Power always finds someone to hold it."
 cafm_uca_route.7.a:0 "We must take this into account"
 cafm_uca_route.8.t:0 "A Faction Collapses"
 cafm_uca_route.8.d_federal:0 "The #b Federalists#! have lost almost all their support. Their clubs are empty and their newspapers have closed."
 cafm_uca_route.8.d_centralist:0 "The #b Centralists#! have lost almost all their support. Even the army and the clergy have turned away from them."
 cafm_uca_route.8.d_separatist:0 "The #b Separatists#! have lost almost all their support. The States no longer talk of leaving the Union."
 cafm_uca_route.8.f:0 "Nothing is as lonely as a lost cause."
 cafm_uca_route.8.a:0 "So it goes"
 cafm_uca_route.9.t:0 "The Unitary Republic"
 cafm_uca_route.9.d:0 "The States are now departments of a single republic. Their governors are named in Guatemala, their taxes go to the national treasury, and one army keeps the peace from Chiapas to Costa Rica."
 cafm_uca_route.9.f:0 "\"One nation, one law, one capital.\""
 cafm_uca_route.9.a:0 "The Union is saved"
 cafm_uca_route.9.a_tt:0 "The Federation is now a unitary republic."
 cafm_uca_route.10.t:0 "The Reform of 1835"
 cafm_uca_route.10.d:0 "The federal Congress has approved the reform of the Constitution of 1824. It gives the federal government its own revenue and a federal district, but the States must ratify it, and many of them refuse."
 cafm_uca_route.10.f:0 "\"A constitution that the States will not accept is only paper.\""
 cafm_uca_route.10.a:0 "Impose the reform"
 cafm_uca_route.10.b:0 "Negotiate with the States"
