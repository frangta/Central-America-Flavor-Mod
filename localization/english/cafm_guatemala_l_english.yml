l_english:
 # CAFM - Guatemala 1836-1851 (10 nov 2026). Diseño: CAFM_GUATEMALA.md
 ca_guatemala_events.38.t:0 "The Livingston Codes"
 ca_guatemala_events.38.d:0 "From today the Livingston Codes are the law of Guatemala: trial by jury, habeas corpus, the presumption of innocence. Dr. Gálvez has given us the most modern code in America. The trouble is that nine of every ten Guatemalans cannot read the summons that calls them to serve on a jury, and the penitentiaries the law demands were never built."
 ca_guatemala_events.38.f:0 "\"A law that the people cannot read is a law written for somebody else.\""
 ca_guatemala_events.38.a:0 "Apply them in full"
 ca_guatemala_events.38.b:0 "Apply them only in the capital"
 ca_guatemala_events.38.c:0 "Suspend the reform"
 ca_guatemala_events.3.t:0 "Cholera in the Mountain"
 ca_guatemala_events.3.d:0 "The cholera has crossed from Belize into Chiquimula and Mita. The government sends physicians, medicine chests and orders to put chlorine in the wells. In the villages they see soldiers blocking the roads and strangers pouring powder into the water, and they draw the only conclusion that makes sense to them."
 ca_guatemala_events.3.f:0 "\"They did not come to cure us. They came to finish us.\""
 ca_guatemala_events.3.a:0 "Sanitary cordons and medicine in the rivers"
 ca_guatemala_events.3.b:0 "Leave the villages alone"
 ca_guatemala_events.3.c:0 "Ask the priests to hand out the medicine"
 ca_guatemala_events.4.t:0 "Mataquescuintla"
 ca_guatemala_events.4.d:0 "In Mataquescuintla a crowd has attacked the governor sent to enforce the quarantine. A young pig drover named Rafael Carrera helped him escape over the hills — and then stayed behind with the crowd. The village will not give up the men who did it."
 ca_guatemala_events.4.f:0 "\"He saved the governor's life, and kept the village's trust. Both will cost us dearly.\""
 ca_guatemala_events.4.a:0 "Send troops from the capital"
 ca_guatemala_events.4.b:0 "Negotiate with the villages"
 ca_guatemala_events.4.c:0 "Make an example of them"
 ca_guatemala_events.9.t:0 "The Manifesto of the Poison"
 ca_guatemala_events.9.d:0 "The peasants of Santa Rosa have elected a smallholder, Teodoro Mejía, as their chief. He has beaten the soldiers we sent and published a manifesto: the government means to poison the campesinos under the pretext of the cholera, so that their plots may be taken from them. Every village in the east is reading it."
 ca_guatemala_events.9.f:0 "\"A lie travels faster than a doctor.\""
 ca_guatemala_events.9.a:0 "Deny it by public proclamation"
 ca_guatemala_events.9.b:0 "Shoot anyone who repeats it"
 ca_guatemala_events.9.c:0 "Open the medicine stores to the villages"
 ca_guatemala_events.10.t:0 "The Amnesty"
 ca_guatemala_events.10.d:0 "Dr. Gálvez offers a pardon to every man who lays down his arms and goes home. Some of his ministers call it surrender. He answers that a government which cannot forgive has already lost."
 ca_guatemala_events.10.f:0 "\"Better a pardoned rebel than a dead subject.\""
 ca_guatemala_events.10.a:0 "Amnesty for all who disarm"
 ca_guatemala_events.10.b:0 "No pardon for rebels"
 ca_guatemala_events.11.t:0 "The Decree of Jumay"
 ca_guatemala_events.11.d:0 "The decree moves the people of Jumay to Cuajiniquilapa and divides their common land between two other villages. It is the kind of order that has filled the courts for ten years and the hills with angry men. The Boletín Oficial can still print a retraction."
 ca_guatemala_events.11.f:0 "\"We have taken the land from under their feet and we wonder why they will not stand still.\""
 ca_guatemala_events.11.a:0 "Revoke it and guarantee the ejidos"
 ca_guatemala_events.11.b:0 "Uphold the decree"
 ca_guatemala_events.12.t:0 "A Square League for Every Village"
 ca_guatemala_events.12.d:0 "The government will guarantee every town one square league of communal land, beyond the reach of surveyors and of the men who buy vacant land by the caballería. The treasury will lose what the haciendas would have paid."
 ca_guatemala_events.12.f:0 "\"Land is cheaper than an army.\""
 ca_guatemala_events.12.a:0 "Guarantee the ejidos"
 ca_guatemala_events.12.b:0 "Deny the guarantee"
 ca_guatemala_events.13.t:0 "Carrera Enters the Capital"
 ca_guatemala_events.13.d:0 "On the twenty-eighth Dr. Gálvez resigned. On the thirty-first the men of the Mountain came down into the central plaza with machetes, old muskets and green branches in their hats. They have not sacked the city. They are waiting to be told that their demands will be met."
 ca_guatemala_events.13.f:0 "\"The city has never seen the country before. Now the country is standing in its square.\""
 ca_guatemala_events.13.a:0 "Molina promises to meet their demands"
 ca_guatemala_events.13.b:0 "Defend the city"
 ca_guatemala_events.14.t:0 "The Demands of the Mountain"
 ca_guatemala_events.14.d:0 "They are not asking for ministries. They want the tax on land lowered, no land and no public employment for foreigners, and an end to the sale of village land to the colonization companies."
 ca_guatemala_events.14.f:0 "\"Not one of their demands is about the capital. Every one of them is about the ground they stand on.\""
 ca_guatemala_events.14.a:0 "Grant the demands"
 ca_guatemala_events.14.b:0 "Promise now, forget later"
 ca_guatemala_events.15.t:0 "Los Altos Breaks Away"
 ca_guatemala_events.15.d:0 "Quetzaltenango will not be governed by a capital that has fallen to the Mountain. The western districts have declared themselves the State of Los Altos, with their own assembly, their own customs and their own claim to the Federation."
 ca_guatemala_events.15.f:0 "\"They did not leave Guatemala. They left what Guatemala has become.\""
 ca_guatemala_events.15.a:0 "Accept it for now"
 ca_guatemala_events.15.b:0 "Send troops at once"
 ca_guatemala_events.16.t:0 "Morazán Invades"
 ca_guatemala_events.16.d:0 "The President of the Federation has crossed the border with a thousand Salvadoran soldiers to restore the liberal order in Guatemala. His army is better drilled than anything we can put in the field."
 ca_guatemala_events.16.f:0 "\"Let him have the city. The hills are ours.\""
 ca_guatemala_events.16.a:0 "Give up the capital and fight in the hills"
 ca_guatemala_events.16.b:0 "Meet him in open battle"
 ca_guatemala_events.17.t:0 "Antigua and Villa Nueva"
 ca_guatemala_events.17.d:0 "Antigua fell to us on the ninth. Two days later, at Villa Nueva, the federal artillery caught our columns in the open and broke them. It is the worst defeat the Mountain has suffered."
 ca_guatemala_events.17.f:0 "\"We lost the field. We did not lose the villages.\""
 ca_guatemala_events.17.a:0 "Fall back to the Mountain"
 ca_guatemala_events.17.b:0 "Fight on with what is left"
 ca_guatemala_events.18.t:0 "The Truce with Guzmán"
 ca_guatemala_events.18.d:0 "General Agustín Guzmán offers a truce. He is a liberal and an honest soldier, and he believes the war is over. Signing will give us the winter to gather powder, lead and men."
 ca_guatemala_events.18.f:0 "\"A truce is a season, not a peace.\""
 ca_guatemala_events.18.a:0 "Sign, and rearm in silence"
 ca_guatemala_events.18.b:0 "Refuse the truce"
 ca_guatemala_events.19.t:0 "The Second Entry"
 ca_guatemala_events.19.d:0 "Carrera is in the capital again, and this time nobody is contesting it. Mariano Rivera Paz is restored to the government. Four days later the assembly resumes the sovereignty Guatemala gave up in 1824: free, sovereign and independent of the Federation."
 ca_guatemala_events.19.f:0 "\"The Union was a roof we built over five houses. The roof has fallen in.\""
 ca_guatemala_events.19.a:0 "Restore Rivera Paz and break with the Federation"
 ca_guatemala_events.19.b:0 "Carrera takes the government himself"
 ca_guatemala_events.20.t:0 "The Reconquest of Los Altos"
 ca_guatemala_events.20.d:0 "Los Altos has spent a year governing itself, and spent part of that year putting down its own indigenous villages at Santa Catarina Ixtahuacán. Carrera is at the pass with two thousand men and the quiet support of those same villages."
 ca_guatemala_events.20.f:0 "\"The Altos asked to be free of Guatemala. Its own towns asked to be free of the Altos.\""
 ca_guatemala_events.20.a:0 "Invade and dissolve the state"
 ca_guatemala_events.20.b:0 "Offer a pact of autonomy"
 ca_guatemala_events.21.t:0 "Morazán's Last Invasion"
 ca_guatemala_events.21.d:0 "He has come back with the last army the Federation can raise, and he has taken part of the city. The fighting is street by street, house by house, and every hour more men come down from the hills behind him."
 ca_guatemala_events.21.f:0 "\"He walked into the one city in Central America that no longer fears him.\""
 ca_guatemala_events.21.a:0 "Defend the capital house by house"
 ca_guatemala_events.21.b:0 "Open negotiations"
 ca_guatemala_events.22.t:0 "The Cochineal of the Valleys"
 ca_guatemala_events.22.d:0 "Cochineal has replaced indigo as the wealth of Guatemala. The nopal plantations of Amatitlán and Antigua are small, laborious and astonishingly profitable, and the whole of our export trade now rests on an insect."
 ca_guatemala_events.22.f:0 "\"A known dye is safer than an unknown bean.\""
 ca_guatemala_events.22.a:0 "Push cochineal in Amatitlán and Antigua"
 ca_guatemala_events.22.b:0 "Keep indigo alongside it"
 ca_guatemala_events.23.t:0 "The Convenio de Guadalupe"
 ca_guatemala_events.23.d:0 "The land suits have outlived the men who started them. The convention creates a single judge in the capital to hear every dispute over land in the republic, so that no corregidor may decide them for his friends."
 ca_guatemala_events.23.f:0 "\"Twenty years of lawsuits, and one courtroom to end them.\""
 ca_guatemala_events.23.a:0 "Appoint the land judge"
 ca_guatemala_events.23.b:0 "Leave the suits to the corregidores"
 ca_guatemala_events.24.t:0 "The Labour Law of 1846"
 ca_guatemala_events.24.d:0 "The hacendados cannot find hands for the harvest. The law would oblige every man without property or trade to hire himself out, and would let the authorities deliver him to the estate that asks for him."
 ca_guatemala_events.24.f:0 "\"We called it vagrancy when the Crown did it.\""
 ca_guatemala_events.24.a:0 "Restore forced labour"
 ca_guatemala_events.24.b:0 "Refuse the law"
 ca_guatemala_events.25.t:0 "The Aguardiente Monopoly"
 ca_guatemala_events.25.d:0 "The grain has failed and the treasury is empty. The monopoly on aguardiente would fill it in a season. It would also put a government agent in every village still that the east has been running since the Spanish left."
 ca_guatemala_events.25.f:0 "\"There is no faster way to raise money, and none to make more enemies.\""
 ca_guatemala_events.25.a:0 "Restore the monopoly"
 ca_guatemala_events.25.b:0 "Leave the stills alone"
 ca_guatemala_events.26.t:0 "San Juan Sacatepéquez"
 ca_guatemala_events.26.d:0 "The village has refused the new taxes and driven out the collector. Troops went in. There are dead on both sides and the surrounding towns are watching to see what happens next."
 ca_guatemala_events.26.f:0 "\"Every village is now a question the government has to answer.\""
 ca_guatemala_events.26.a:0 "Put it down"
 ca_guatemala_events.26.b:0 "Negotiate with the village"
 ca_guatemala_events.27.t:0 "Decree 15: The Republic of Guatemala"
 ca_guatemala_events.27.d:0 "The government has notified the other states and now puts it in law. Guatemala is a sovereign republic, with a population greater than many republics of the old world and the new, more than three hundred towns, and every element of an independent power."
 ca_guatemala_events.27.f:0 "\"We are not leaving Central America. We are admitting that it left us.\""
 ca_guatemala_events.27.a:0 "Proclaim the Republic"
 ca_guatemala_events.27.b:0 "Wait for the Union to revive"
 ca_guatemala_events.28.t:0 "The Rising at Palencia"
 ca_guatemala_events.28.d:0 "José Lucio López, a landowner of Palencia, has risen at Sansur and San Guayaba against the government he helped to make. The east is full of men who fought for Carrera in 1838 and have been taxed and conscripted ever since."
 ca_guatemala_events.28.f:0 "\"The Mountain made him. The Mountain can unmake him.\""
 ca_guatemala_events.28.a:0 "Hunt him down"
 ca_guatemala_events.28.b:0 "Buy him off with land"
 ca_guatemala_events.29.t:0 "The Raid on Palencia"
 ca_guatemala_events.29.d:0 "They have taken Carrera's own hacienda at Palencia and carried off some seven hundred rifles. Worse than the rifles: among the men who did it were officers who served under him nine years ago."
 ca_guatemala_events.29.f:0 "\"They have armed themselves from his own house.\""
 ca_guatemala_events.29.a:0 "Admit the blow and reorganise"
 ca_guatemala_events.29.b:0 "Blame the liberals and hunt them"
 ca_guatemala_events.30.t:0 "San Jerónimo and Santa Catarina"
 ca_guatemala_events.30.d:0 "The rebels have struck Santa Catarina Mita and sacked the great estate of San Jerónimo in Verapaz, the richest property of the Church in the republic."
 ca_guatemala_events.30.f:0 "\"They burn the Church's granary and still hear mass on Sunday.\""
 ca_guatemala_events.30.a:0 "Defend the estates"
 ca_guatemala_events.30.b:0 "Abandon Verapaz for now"
 ca_guatemala_events.31.t:0 "Patzún"
 ca_guatemala_events.31.d:0 "Sotero Carrera has been murdered in Antigua. Serapio Cruz has risen in the west, and the liberals of Chiquimula have joined the Lucíos in the east. The President has gone himself to Patzún."
 ca_guatemala_events.31.f:0 "\"He has lost a brother and found a war on two sides.\""
 ca_guatemala_events.31.a:0 "Defeat Cruz at Patzún"
 ca_guatemala_events.31.b:0 "Pardon him"
 ca_guatemala_events.32.t:0 "The Caudillo Resigns"
 ca_guatemala_events.32.d:0 "The east is lost, the west is in revolt, and the man who has held the republic together for ten years will not hold it by force. He has resigned the presidency and ridden for Chiapas. Juan Antonio Martínez, a moderate liberal, takes the government."
 ca_guatemala_events.32.f:0 "\"He did not fall. He walked out, and left the house to those who wanted it.\""
 ca_guatemala_events.32.a:0 "Resign and go into exile"
 ca_guatemala_events.32.b:0 "Hold on by force"
 ca_guatemala_events.33.t:0 "Los Altos Again"
 ca_guatemala_events.33.d:0 "With Carrera gone, the liberals of Quetzaltenango have declared the Altos independent for the second time. The same assembly, the same customs house, the same claim."
 ca_guatemala_events.33.f:0 "\"Ten years, and the west has not changed its mind.\""
 ca_guatemala_events.33.a:0 "Send troops"
 ca_guatemala_events.33.b:0 "Recognise them"
 ca_guatemala_events.34.t:0 "Vicente Cruz at the Gates"
 ca_guatemala_events.34.d:0 "Vicente Cruz, who was vice president under Carrera, has brought the rebels of the east to the walls of the capital. The only troops who can break the siege are the ones fighting in the Altos."
 ca_guatemala_events.34.f:0 "\"Every soldier we have is in the wrong province.\""
 ca_guatemala_events.34.a:0 "Recall the troops from the Altos"
 ca_guatemala_events.34.b:0 "Negotiate with Cruz"
 ca_guatemala_events.35.t:0 "The Treaty of Zacapa"
 ca_guatemala_events.35.d:0 "General Mariano Paredes, a moderate and an old soldier of Carrera's, has been elected president and offers the rebels terms at Zacapa: amnesty, local commands, and an end to the forced levies. Some of their chiefs will not sign."
 ca_guatemala_events.35.f:0 "\"A peace that half the enemy signs is half a peace.\""
 ca_guatemala_events.35.a:0 "Sign the treaty"
 ca_guatemala_events.35.b:0 "War without quarter"
 ca_guatemala_events.36.t:0 "The Return of the Caudillo"
 ca_guatemala_events.36.d:0 "He came back from Chiapas in April and was beaten at Huehuetenango, and it changed nothing: by the twenty-second the corregidor of Suchitepéquez had declared for him, and in June the government sent men to treat with him. He is asking for the army."
 ca_guatemala_events.36.f:0 "\"He lost the battle and won the country, which is the way he has always done it.\""
 ca_guatemala_events.36.a:0 "Name him commander in chief"
 ca_guatemala_events.36.b:0 "Refuse him"
 ca_guatemala_events.37.t:0 "La Arada"
 ca_guatemala_events.37.d:0 "Vasconcelos has crossed into Chiquimula with six thousand Salvadorans and Hondurans, the Lucío chiefs and every Guatemalan liberal in exile. Carrera has fifteen hundred men and a hill above the river at San José de la Arada."
 ca_guatemala_events.37.f:0 "\"Four to one, and the ground is ours.\""
 ca_guatemala_events.37.a:0 "Give battle at Chiquimula"
 ca_guatemala_events.37.b:0 "Fall back on the capital"
