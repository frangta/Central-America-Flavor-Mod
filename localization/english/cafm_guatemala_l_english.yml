 gua_e9_a_tt:0 "The proclamation changes nothing: the villages believe Mejía."
 gua_e28_a_tt:0 "López is killed within weeks, but the other chiefs keep fighting under his name."
 je_ca_gua_montana:0 "The Mountain"
 je_ca_gua_montana_desc:0 "The villages of the east have taken up arms against the liberal government."
 je_ca_gua_montana_reason:0 "Cholera, the Livingston Codes and twenty years of land surveys have armed the east. If the Mountain reaches the capital, the liberal experiment is over."
 je_ca_gua_montana_status_incontenible:0 "The Mountain cannot be contained. The roads to the capital are open."
 je_ca_gua_montana_status_alta:0 "The Mountain is in open revolt and has found a commander."
 je_ca_gua_montana_status_baja:0 "There is unrest in the eastern villages, but no army yet."
 je_ca_gua_montana_conclusion_apagada:0 "The revolt has burned itself out. The liberal government survives."
 je_ca_gua_montana_conclusion_carrera:0 "The men of the Mountain are standing in the central plaza. Dr. Gálvez has resigned."
 je_ca_gua_lucios:0 "The Lucíos"
 je_ca_gua_lucios_desc:0 "The east has risen against the conservative government it helped to create."
 je_ca_gua_lucios_reason:0 "Forced labour, the aguardiente monopoly and the levies have turned Carrera's own veterans against him. El Salvador is watching."
 je_ca_gua_lucios_status_sitio:0 "The Lucíos hold the east and are at the gates of the capital."
 je_ca_gua_lucios_status_alta:0 "The revolt has spread beyond Palencia and the government is losing the countryside."
 je_ca_gua_lucios_status_baja:0 "There are armed bands in the east, but the government still holds the roads."
 je_ca_gua_lucios_conclusion_arada:0 "The Lucíos are broken and the liberal threat from El Salvador is finished."
 je_ca_gua_lucios_conclusion_liberales:0 "The liberals have taken the republic. The caudillo will not be coming back."
 ca_button_gua_comisionados:0 "Commissioners to the Mountain"
 ca_button_gua_comisionados_desc:0 "Send commissioners to hear the villages' complaints before the machetes come out. It costs authority, and the Mountain cools."
 ca_button_gua_juez_tierras:0 "The Land Judge"
 ca_button_gua_juez_tierras_desc:0 "Apply the Convenio de Guadalupe in earnest: one judge in the capital for every land dispute in the republic. The hacendados will not thank us."
 ca_button_gua_estanco:0 "The Aguardiente Monopoly"
 ca_button_gua_estanco_desc:0 "Put a government agent on every still in the east. It fills the treasury and fills the hills."
 ca_button_gua_llamar_caudillo:0 "Call the Caudillo Home"
 ca_button_gua_llamar_caudillo_desc:0 "Send word to Chiapas. He will come back, and he will come back with the army."
 ca_button_gua_llamar_caudillo_tt:0 "The Lucíos are at #b 40#! or above"
 gua_codigos_livingston:0 "The Livingston Codes"
 gua_codigos_livingston_desc:0 "Trial by jury and habeas corpus in a country where nine of ten cannot read."
 gua_livingston_capital:0 "The Codes in the Capital"
 gua_livingston_capital_desc:0 "The new courts sit in the capital; the countryside keeps its alcaldes."
 gua_colera_morbus:0 "Cholera Morbus"
 gua_colera_morbus_desc:0 "The epidemic is crossing the republic from east to west."
 gua_cordones_sanitarios:0 "Sanitary Cordons"
 gua_cordones_sanitarios_desc:0 "Troops hold the roads between the villages. Fewer die, and less is collected."
 gua_curas_medicina:0 "The Priests Hand Out the Medicine"
 gua_curas_medicina_desc:0 "The villages will take from a priest what they will not take from a government agent."
 gua_montana_incontenible:0 "The Mountain Unleashed"
 gua_montana_incontenible_desc:0 "The east is out of the government's reach."
 gua_comisionados_montana:0 "Commissioners in the Mountain"
 gua_comisionados_montana_desc:0 "Our envoys are hearing complaints in the villages of the east."
 gua_represion_pueblos:0 "Exemplary Punishment"
 gua_represion_pueblos_desc:0 "The villages have been made an example of."
 gua_ejidos_garantizados:0 "The Ejidos Guaranteed"
 gua_ejidos_garantizados_desc:0 "One square league of common land for every town, beyond the surveyors' reach."
 gua_experimento_liberal:0 "The Liberal Experiment Survives"
 gua_experimento_liberal_desc:0 "The reform outlived the revolt."
 gua_demandas_cumplidas:0 "The Demands of the Mountain"
 gua_demandas_cumplidas_desc:0 "Lower land taxes, and no land or office for foreigners."
 gua_guerra_montana:0 "War in the Mountain"
 gua_guerra_montana_desc:0 "The war is fought in the hills, not on the roads."
 gua_estado_soberano:0 "Free, Sovereign and Independent"
 gua_estado_soberano_desc:0 "Guatemala has resumed the sovereignty it gave up in 1824."
 gua_altos_resentido:0 "Los Altos Resentful"
 gua_altos_resentido_desc:0 "The west is governed, not reconciled."
 gua_vencedor_de_morazan:0 "The Victor over Morazán"
 gua_vencedor_de_morazan_desc:0 "The man who broke the Federation's last army."
 gua_grana_de_los_valles:0 "The Cochineal of the Valleys"
 gua_grana_de_los_valles_desc:0 "Amatitlán and Antigua live on an insect, and so does the treasury."
 gua_grana_y_anil:0 "Cochineal and Indigo"
 gua_grana_y_anil_desc:0 "Two dyes earn less than one, and fall together less often."
 gua_juez_de_tierras:0 "The Land Judge"
 gua_juez_de_tierras_desc:0 "One courtroom in the capital for every land dispute in the republic."
 gua_trabajo_forzoso:0 "The Labour Law of 1846"
 gua_trabajo_forzoso_desc:0 "Every man without property or trade may be delivered to the estate that asks for him."
 gua_estanco_aguardiente:0 "The Aguardiente Monopoly"
 gua_estanco_aguardiente_desc:0 "A government agent on every still."
 gua_republica_de_guatemala:0 "The Republic of Guatemala"
 gua_republica_de_guatemala_desc:0 "Decree 15, 21 March 1847."
 gua_lucios_dominan:0 "The Lucíos Hold the East"
 gua_lucios_dominan_desc:0 "The government's writ ends where the road to Chiquimula begins."
 gua_tratado_zacapa:0 "The Treaty of Zacapa"
 gua_tratado_zacapa_desc:0 "Amnesty, local commands, and an end to the forced levies."
 gua_carrera_comandante:0 "The Caudillo Commands the Army"
 gua_carrera_comandante_desc:0 "He has the army, and the government has him."
