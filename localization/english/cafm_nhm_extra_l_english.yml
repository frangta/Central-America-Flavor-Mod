l_english:
 # CAFM - diarios, botones, modificadores y nombres de NIC/HON/MKT (10 nov 2026)
 cafm_Patrick:0 "Patrick"
 cafm_Silvestre:0 "Silvestre"
 cafm_Madriz:0 "Madriz"
 je_ca_nic_division:0 "León Against Granada"
 je_ca_nic_division_lobby:0 "The two cities that make up Nicaragua do not agree on who governs it."
 je_ca_nic_division_reason:0 "León is liberal, commercial and loud; Granada is landed, clerical and patient. Every election, every appointment and every war since 1821 has been read by both as a move against the other."
 je_ca_nic_division_status_guerra:0 "Legitimists and Democrats, with armies. This is no longer politics."
 je_ca_nic_division_status_ruptura:0 "Each city has its own government and its own treasury."
 je_ca_nic_division_status_tension:0 "The rivalry is public, and both sides are counting rifles."
 je_ca_nic_division_status_baja:0 "León and Granada are quarrelling, as always, and no more than that."
 je_ca_nic_division_conclusion_managua:0 "The seat of government is a town that belongs to neither city. It is not a reconciliation, but it will hold."
 je_ca_nic_division_conclusion_guerra:0 "The quarrel has become a war, and the war will outlast everyone now alive who started it."
 je_ca_nic_fonseca:0 "The Grand Marshal"
 je_ca_nic_fonseca_lobby:0 "The general command of the army is becoming the government of the State."
 je_ca_nic_fonseca_reason:0 "Casto Fonseca was given the army by León's politicians, who believed they would be the ones holding it. He collects the levies, he closed the press, and he closed the schools."
 je_ca_nic_fonseca_status_dictadura:0 "Levies by the bayonet, no press and no schools."
 je_ca_nic_fonseca_status_mariscal:0 "He calls himself Grand Marshal, and nobody corrects him."
 je_ca_nic_fonseca_status_mando:0 "The army answers to Fonseca, not to the Director."
 je_ca_nic_fonseca_status_baja:0 "There is a general command, and it still reports to the government."
 je_ca_nic_fonseca_conclusion_caido:0 "The Marshal is gone. Whatever replaces him, it will not be him."
 je_ca_nic_fonseca_conclusion_mariscal:0 "Nicaragua belongs to its Grand Marshal."
 je_ca_nic_transito:0 "The Transit Route"
 je_ca_nic_transito_lobby:0 "The San Juan river and the isthmus of Rivas are the shortest road between two oceans."
 je_ca_nic_transito_reason:0 "Whoever controls the mouth of the San Juan controls the route. At present that is a Mosquito king with a British consul, and two empires are bidding for what is left."
 je_ca_nic_transito_status_ruta:0 "The route runs, and it pays us by the passenger."
 je_ca_nic_transito_status_contrato:0 "There is a contract signed and a company at work."
 je_ca_nic_transito_status_interes:0 "The powers have noticed the river. That is worth something by itself."
 je_ca_nic_transito_status_bajo:0 "A river, a lake and twelve leagues of road, and nobody paying for any of it."
 je_ca_nic_transito_conclusion_nuestra:0 "The route is open and the tolls are ours."
 je_ca_nic_transito_conclusion_ajena:0 "The road between the oceans crosses our territory and is administered by other people."
 je_ca_hon_republica:0 "The Birth of the Republic"
 je_ca_hon_republica_lobby:0 "Honduras has left the Federation and has to become a state of its own."
 je_ca_hon_republica_reason:0 "A constitution, a treasury, a port, a school and a clergy at peace with the government. Honduras has none of these in 1838 and will need all of them."
 je_ca_hon_republica_status_nacion:0 "A constitution, a university and a port of our own. This is a country."
 je_ca_hon_republica_status_estado:0 "There is a constitution and a government that outlasts its president."
 je_ca_hon_republica_status_papel:0 "A republic on paper, governed from wherever the president is standing."
 je_ca_hon_republica_conclusion_hecha:0 "Honduras is a republic in fact and not only in the decree that founded it."
 je_ca_hon_republica_conclusion_papel:0 "Nine years and two constitutions, and the state is still whatever the general of the week says it is."
 je_ca_hon_costa:0 "The Coast We Do Not Govern"
 je_ca_hon_costa_lobby:0 "From Trujillo to Cabo Gracias a Dios there is no customs house and no garrison."
 je_ca_hon_costa_reason:0 "The Belize mahogany companies work our rivers and pay nobody, the Mosquito kingdom claims the coast, and the only navy in these waters is British."
 je_ca_hon_costa_status_perdida:0 "The north coast is Honduran on the map and nowhere else."
 je_ca_hon_costa_status_ocupacion:0 "A port or an island of ours is under a foreign flag."
 je_ca_hon_costa_status_presion:0 "Warships and timber cutters, and no answer from us to either."
 je_ca_hon_costa_status_nuestra:0 "The coast is ours, thinly, and for the moment nobody is testing it."
 je_ca_hon_costa_conclusion_recuperada:0 "The north coast pays customs to Honduras."
 je_ca_hon_costa_conclusion_perdida:0 "We have a seaboard we cannot reach, tax or defend."
 je_ca_mkt_protectorado:0 "The Crown and the Protector"
 je_ca_mkt_protectorado_lobby:0 "The kingdom is recognized by Britain, which is both its shield and its owner."
 je_ca_mkt_protectorado_reason:0 "London recognized us in 1837, crowned our king in Belize, and sends a consul-general who signs in the king's name. Every protection has been paid for with a decision."
 je_ca_mkt_protectorado_status_oficina:0 "The crown exists. Nobody under it decides anything."
 je_ca_mkt_protectorado_status_tutela:0 "The kingdom signs nothing by itself."
 je_ca_mkt_protectorado_status_consul:0 "A consul in Bluefields decides what the kingdom wants."
 je_ca_mkt_protectorado_status_corona:0 "There is a protector, and there is still a king who answers him."
 je_ca_mkt_protectorado_conclusion_corona:0 "The kingdom decides its own affairs, and the protector is a treaty rather than a governor."
 je_ca_mkt_protectorado_conclusion_oficina:0 "The Mosquito kingdom is filed in Belize, under protectorates."
 je_ca_mkt_reino:0 "The Kingdom of Mosquitia"
 je_ca_mkt_reino_lobby:0 "Four hundred leagues of coast, a few thousand subjects, and no state at all."
 je_ca_mkt_reino_reason:0 "A council that legislates, a militia, a land register, a court and a customs house. The kingdom has a crown and needs everything that usually comes under one."
 je_ca_mkt_reino_status_estado:0 "A militia, a court, a land register and a port that pays."
 je_ca_mkt_reino_status_consejo:0 "There is a council, and it passes laws that are written down."
 je_ca_mkt_reino_status_costa:0 "A shoreline with a king on it, and nothing behind the shoreline."
 je_ca_mkt_reino_conclusion_hecho:0 "The kingdom governs its coast with its own institutions."
 je_ca_mkt_reino_conclusion_costa:0 "After twenty years it is still a shoreline with a king on it."
 ca_button_nic_mediar:0 "Mediate Between the Cities"
 ca_button_nic_mediar_desc:0 "Send commissioners to León and Granada with money and offices for both. It buys a season of quiet and it is never cheap."
 ca_button_nic_capital_alterna:0 "Alternate the Capital"
 ca_button_nic_capital_alterna_desc:0 "The government sits in each city in turn. Nobody is satisfied and nobody is excluded, which is the most that can be managed."
 ca_button_nic_pagar_al_mariscal:0 "Pay the Marshal's Army"
 ca_button_nic_pagar_al_mariscal_desc:0 "An army that is paid in silver has less need of levies, and a general whose men are paid has less need of the government."
 ca_button_nic_cortejar_companias:0 "Court the Transit Companies"
 ca_button_nic_cortejar_companias_desc:0 "Surveys, concessions and a good dinner for whoever arrives with a letter from New York or London."
 ca_button_hon_ordenar_hacienda:0 "Put the Treasury in Order"
 ca_button_hon_ordenar_hacienda_desc:0 "Audit the customs, pay the arrears and write down who owes what. It costs money to find out how little there is."
 ca_button_hon_pactar_con_el_clero:0 "Come to Terms with the Clergy"
 ca_button_hon_pactar_con_el_clero_desc:0 "The parish priests are the only administration that reaches every town in Honduras. Governing with them is cheaper than governing without them."
 ca_button_hon_guarnecer_trujillo:0 "Garrison Trujillo"
 ca_button_hon_guarnecer_trujillo_desc:0 "A company and a battery at the one port on the north coast that we can actually reach from Comayagua."
 ca_button_hon_protestar_en_londres:0 "Protest in London"
 ca_button_hon_protestar_en_londres_desc:0 "A formal note to the Foreign Office. It has worked once: the Tigre Island occupation was disavowed by the government that ordered the squadron."
 ca_button_mkt_pedir_subvencion:0 "Ask Belize for the Allowance"
 ca_button_mkt_pedir_subvencion_desc:0 "The superintendent will pay the kingdom's bills. Every payment is also a decision he gets to make."
 ca_button_mkt_firmar_con_el_sello:0 "Sign Under Our Own Seal"
 ca_button_mkt_firmar_con_el_sello_desc:0 "The king's seal on the king's documents, without the consul's countersignature. It is a small thing and it is the whole question."
 ca_button_mkt_convocar_consejo:0 "Convene the Council"
 ca_button_mkt_convocar_consejo_desc:0 "The Creoles of Bluefields meet, legislate and go home. Each session makes the next one harder to prevent."
 ca_button_mkt_conceder_cortes:0 "Grant Timber Licences"
 ca_button_mkt_conceder_cortes_desc:0 "The Belize companies will pay for a licence rather than argue about one. The money is good and it is money from the people we are trying to be independent of."
 nic_asamblea_constituyente:0 "The Constituent Assembly"
 nic_asamblea_constituyente_desc:0 "The assembly sits at Chinandega, which is neither León nor Granada."
 nic_estado_soberano:0 "Free, Sovereign and Independent"
 nic_estado_soberano_desc:0 "Declared on 30 April 1838."
 nic_fidelidad_federal:0 "Loyal to the Union"
 nic_fidelidad_federal_desc:0 "Nicaragua has not broken the federal pact."
 nic_constitucion_1838:0 "The Constitution of 1838"
 nic_constitucion_1838_desc:0 "Two chambers and a Supreme Director with a two-year term."
 nic_guerra_del_38:0 "The War of 1839"
 nic_guerra_del_38_desc:0 "At war with El Salvador alongside Honduras."
 nic_gran_mariscal_mando:0 "Fonseca Holds the Army"
 nic_gran_mariscal_mando_desc:0 "The general command answers to one man."
 nic_levas_del_mariscal:0 "The Marshal's Levies"
 nic_levas_del_mariscal_desc:0 "Levies by the bayonet, the press silenced and the schools closed."
 nic_gran_mariscal:0 "The Grand Marshal"
 nic_gran_mariscal_desc:0 "Nicaragua belongs to its general."
 nic_gobierno_civil:0 "Civil Government"
 nic_gobierno_civil_desc:0 "The army reports to the Director again."
 nic_leon_saqueada:0 "León Sacked"
 nic_leon_saqueada_desc:0 "Fifty days of siege and the houses burned."
 nic_amnistia:0 "The Amnesty"
 nic_amnistia_desc:0 "Pardoned for the rebellion, still billed for it."
 nic_capital_managua:0 "The Seat at Managua"
 nic_capital_managua_desc:0 "A capital that belongs to neither city."
 nic_guerra_de_bandos:0 "The War of the Factions"
 nic_guerra_de_bandos_desc:0 "Legitimists in Granada, Democrats in León."
 nic_mandato_largo:0 "A Four-Year Term"
 nic_mandato_largo_desc:0 "Long enough to govern."
 nic_protesta_en_londres:0 "Protest in London"
 nic_protesta_en_londres_desc:0 "A formal note about the mouth of the San Juan."
 nic_greytown_cedido:0 "Greytown Ceded"
 nic_greytown_cedido_desc:0 "Our only Atlantic port has an English name."
 nic_contrato_del_transito:0 "The Transit Contract"
 nic_contrato_del_transito_desc:0 "Twelve years to open a canal, and the road meanwhile."
 nic_rio_del_estado:0 "The River of the State"
 nic_rio_del_estado_desc:0 "The route worked by the government and not by a company."
 nic_peaje_del_san_juan:0 "The Toll of the San Juan"
 nic_peaje_del_san_juan_desc:0 "Charged by the passenger, between New York and San Francisco."
 nic_ruta_del_transito:0 "The Transit Route"
 nic_ruta_del_transito_desc:0 "Open, working, and ours."
 nic_rio_ajeno:0 "Somebody Else's River"
 nic_rio_ajeno_desc:0 "The route crosses our ground and pays others."
 hon_fidelidad_federal:0 "Loyal to the Union"
 hon_fidelidad_federal_desc:0 "Honduras has not declared the separation."
 hon_constitucion_1839:0 "The Constitution of 1839"
 hon_constitucion_1839_desc:0 "A president, a chamber and a Catholic state."
 hon_constitucion_1848:0 "The Constitution of 1848"
 hon_constitucion_1848_desc:0 "Decreed by Juan Lindo on 4 February."
 hon_constitucion_vigente:0 "The Constitution Holds"
 hon_constitucion_vigente_desc:0 "Written down, and obeyed."
 hon_colegio_tridentino:0 "The Colegio Tridentino"
 hon_colegio_tridentino_desc:0 "The seminary at Comayagua, reopened."
 hon_colegio_laico:0 "A Lay College"
 hon_colegio_laico_desc:0 "Education that does not run through the bishop."
 hon_puerto_de_la_paz:0 "The Port of La Paz"
 hon_puerto_de_la_paz_desc:0 "Our own customs house on the Gulf of Fonseca."
 hon_diezmo_restituido:0 "The Tithe Restored"
 hon_diezmo_restituido_desc:0 "Abolished in 1829, law again under Ferrera."
 hon_universidad_nacional:0 "The National University"
 hon_universidad_nacional_desc:0 "Out of Father Reyes's literary academy."
 hon_gesto_mexicano:0 "War on the United States"
 hon_gesto_mexicano_desc:0 "A declaration in support of Mexico, and no navy to back it."
 hon_prudencia_diplomatica:0 "Diplomatic Prudence"
 hon_prudencia_diplomatica_desc:0 "Staying out of quarrels with nothing in them for us."
 hon_aduana_de_la_costa:0 "A Customs House on the Coast"
 hon_aduana_de_la_costa_desc:0 "The timber rivers pay something at last."
 hon_isla_ocupada:0 "Tigre Island Occupied"
 hon_isla_ocupada_desc:0 "Taken by one consul acting alone."
 hon_puerto_ocupado:0 "A Port Under a Foreign Flag"
 hon_puerto_ocupado_desc:0 "Occupied, and no squadron of ours to answer."
 hon_pacto_de_chinandega:0 "The Pact of Chinandega"
 hon_pacto_de_chinandega_desc:0 "American support for a canal into the Gulf of Fonseca."
 hon_alianza_ocotepeque:0 "The Alliance of Ocotepeque"
 hon_alianza_ocotepeque_desc:0 "Honduras and El Salvador, against Guatemala."
 hon_estado_en_pie:0 "A State on Its Feet"
 hon_estado_en_pie_desc:0 "A constitution, a port and a university."
 hon_republica_hecha:0 "The Republic Made"
 hon_republica_hecha_desc:0 "In fact, and not only in the founding decree."
 hon_republica_de_papel:0 "A Republic on Paper"
 hon_republica_de_papel_desc:0 "Two constitutions and no administration."
 hon_costa_recuperada:0 "The Coast Recovered"
 hon_costa_recuperada_desc:0 "Trujillo to Cabo Gracias a Dios pays customs to Honduras."
 hon_costa_perdida:0 "The Coast Lost"
 hon_costa_perdida_desc:0 "A seaboard we cannot reach, tax or defend."
 hon_costa_sin_aduana:0 "No Customs House on the Coast"
 hon_costa_sin_aduana_desc:0 "The Belize companies cut and pay nobody."
 mkt_reino_reconocido:0 "The Kingdom Recognized"
 mkt_reino_reconocido_desc:0 "Britain recognized the Mosquito kingdom in 1837."
 mkt_consul_en_bluefields:0 "A Consul at Bluefields"
 mkt_consul_en_bluefields_desc:0 "He administers well, and he decides."
 mkt_tutela_britanica:0 "British Tutelage"
 mkt_tutela_britanica_desc:0 "The kingdom signs nothing by itself."
 mkt_oficina_en_belice:0 "An Office in Belize"
 mkt_oficina_en_belice_desc:0 "A crown with nobody under it who decides."
 mkt_corona_propia:0 "A Crown of Our Own"
 mkt_corona_propia_desc:0 "The protector is a treaty rather than a governor."
 mkt_consejo_que_legisla:0 "A Council That Legislates"
 mkt_consejo_que_legisla_desc:0 "The Creoles of Bluefields write the laws down."
 mkt_estado_del_reino:0 "The Kingdom's Institutions"
 mkt_estado_del_reino_desc:0 "A militia, a court and a land register."
 mkt_reino_hecho:0 "The Kingdom Standing"
 mkt_reino_hecho_desc:0 "It governs its coast with its own institutions."
 mkt_solo_una_costa:0 "Only a Shoreline"
 mkt_solo_una_costa_desc:0 "A king, and nothing behind the beach."
 mkt_aduana_de_greytown:0 "The Customs of Greytown"
 mkt_aduana_de_greytown_desc:0 "Harbour dues on the road between the oceans."
 mkt_licencias_de_caoba:0 "Mahogany Licences"
 mkt_licencias_de_caoba_desc:0 "The Belize companies pay for the cutting at last."
 mkt_comercio_de_la_costa:0 "The Trade of the Coast"
 mkt_comercio_de_la_costa_desc:0 "Sarsaparilla, turtle shell and the Jamaican sloops."
 mkt_pacto_con_los_caciques:0 "An Understanding with the Headmen"
 mkt_pacto_con_los_caciques_desc:0 "Upriver is governed by those who live there."
 mkt_frontera_acordada:0 "A Settled Border"
 mkt_frontera_acordada_desc:0 "The northern claim ends at Cabo Gracias a Dios."
 nic_fonseca_down_15_tt:0 "#R The Grand Marshal#! falls back by #b 15#!"
 hon_costa_down_8_tt:0 "#R The coast#! falls back by #b 8#!"
 mkt_protectorado_down_12_tt:0 "#R British tutelage#! falls back by #b 12#!"
