l_english:
 # CAFM - Ruta centralista de la UCA (18 nov 2026)
 je_ca_centralist_republic:0 "The One and Indivisible Republic"
 je_ca_centralist_republic_reason:0 "The centralists want what the Constitution of 1824 never gave: one government, one capital and an army that obeys the Union rather than the States. To impose it they must first win over the army, find allies in the States and remove Morazán from power.

Every step brings the unitary Republic closer and, at the same time, feeds the resistance: first that of the liberals and federalists, later that of the separatists. The government must get there before they do."
 je_ca_centralist_status_objectives:0 "#bold Phase I: The Strong Hand#!
Before the Union can be imposed the ground must be prepared: win over the army, seek support in the States, spread propaganda and remove Morazán from power. Until then, Congress cannot be dissolved."
 je_ca_centralist_status_crisis:0 "#bold The Republic Totters#!
The capital barely governs beyond its walls. If unity reaches zero, the Federation breaks apart."
 je_ca_centralist_unity_full_tt:0 "The Republic's unity reaches #bold 100#!"
 je_ca_centralist_unity_b_tt:0 "The Republic's unity is at least #bold 40#!"
 je_ca_centralist_unity_zero_tt:0 "The Republic's unity falls to #bold 0#!"
 je_ca_centralist_fail_separatist_tt:0 "After the separatists appear, #bold 3#! of the 5 States are Rebellious or separated"
 je_ca_centralist_deadline_tt:0 "#bold January 1, 1845#! arrives"
 ca_frca_unity_bar_name:0 "Unity of the Republic"
 ca_frca_unity_bar_desc:0 "How much of the Republic the capital truly governs. At #bold 80#! phase IV begins; at #bold 100#!, the unitary Republic."
 ca_frca_unity_bar_desc2:0 "Every imposition raises it: buttons, laws and loyal States. Rebellious and separated States, intellectuals in government and the federalists lower it."
 ca_frca_unity_bar_left:0 "Unity"
 ca_frca_unity_bar_right:0 "Unitary Republic"
 ca_cen_army_bar_left:0 "Federal army"
 ca_cen_army_bar_right:0 "Centralist army"
 CA_CEN_UNITY_LAW_UNITARY:0 "Unitary law in force"
 CA_CEN_UNITY_ARMY_GOV:0 "The #bold centralist#! army is in government"
 CA_CEN_UNITY_LOYAL:0 "Loyal States"
 CA_CEN_UNITY_REBEL:0 "Rebellious States"
 CA_CEN_UNITY_SEPARATED:0 "Separated States"
 CA_CEN_UNITY_INTELLIGENTSIA:0 "The intelligentsia is in government"
 CA_CEN_UNITY_RIVAL:0 "The federalists dominate the government (−50 or less)"
 ca_frca_cvf_bar_name:0 "Who Rules the Republic"
 ca_cen_army_bar_name:0 "Support of the Army"
 ca_cen_army_bar_desc:0 "At #bold 100#! the army embraces centralism."
 ca_cen_army_bar_desc2:0 "As long as Morazán commands the army, most officers will stay loyal to him."
 CA_CEN_ARMY_GENERALS:0 "Unitarian generals"
 CA_CEN_ARMY_GOV:0 "The army is in government"
 CA_CEN_ARMY_HAPPY:0 "The army is content"
 CA_CEN_ARMY_ANGRY:0 "The army is unhappy"
 CA_CEN_ARMY_MORAZAN:0 "Morazán commands the army"
 ca_cen_button_reorganize:0 "Reorganize the Centralists"
 ca_cen_button_reorganize_desc:0 "Gather sympathetic officers, pay their debts and promise promotions. Army support +10."
 ca_cen_button_propaganda:0 "Centralist Propaganda"
 ca_cen_button_propaganda_desc:0 "Newspapers, sermons and pamphlets in favor of a single Republic."
 ca_cen_button_propaganda_tt:0 "For one year: more support for the unitarian movement and more centralist power. Separatist pressure falls."
 ca_cen_button_conspiracy:0 "Conspiracy Against Morazán"
 ca_cen_button_conspiracy_desc:0 "A bullet in the night would solve many things. If it fails, the scandal will haunt us."
 ca_cen_button_coup:0 "Prepare the Coup"
 ca_cen_button_coup_desc:0 "The barracks are with us. Only the day remains to be chosen."
 ca_cen_button_campaign:0 "Unitarian Campaign"
 ca_cen_button_campaign_desc:0 "Win votes for the federal election of June 1, 1838. Each campaign adds points to the centralists (maximum 3)."
 ca_cen_button_dissolve_congress_desc:0 "Close the federal Congress. The paralysis ends: the government will be able to pass laws. Phase II begins."
 ca_cen_can_conspire_tt:0 "There is at least one unitarian general, or centralist power is at least 45"
 ca_cen_army_won_tt:0 "The army has turned centralist (objective 1)"
 ca_cen_campaign_max_tt:0 "Fewer than 3 campaigns"
 ca_cen_morazan_removed_tt:0 "Morazán is no longer in power (objective 4)"
 ca_cen_paralysis_lifted_tt:0 "The #bold federal paralysis#! ends: the government can pass laws"
 ca_cen_propaganda:0 "Centralist Propaganda"
 ca_cen_propaganda_desc:0 "Friendly pulpits and newspapers call for a single Republic."
 ca_cen_morazan_martyr:0 "Morazán the Martyr"
 ca_cen_morazan_martyr_desc:0 "Morazán's death has turned his cause into a banner."
 ca_cen_army_neutral:0 "Out of the Campaign"
 ca_cen_army_neutral_desc:0 "The army stays out of the federal election."
 cafm_cen.1.t:0 "The Army Changes Sides"
 cafm_cen.1.d:0 "The officers no longer toast the Constitution of 1824 but a single Republic. In the barracks men say the homeland needs a strong government, and that the States have had too long to prove they cannot govern themselves."
 cafm_cen.1.f:0 "\"One government, one sword.\""
 cafm_cen.1.a:0 "The army is ours"
 cafm_cen.1.a_tt:0 "The Armed Forces adopt the #bold centralist#! ideology"
 cafm_cen.2.t:0 "Allies in the States"
 cafm_cen.2.d:0 "Not every State wants the sovereignty 1824 gave it. Some governments see the capital as a shield against local caudillos and neighbors' wars, and begin to look kindly on the Union."
 cafm_cen.2.f:0 "\"Better one distant government than ten tyrants close at hand.\""
 cafm_cen.2.a:0 "We count on them"
 cafm_cen.3.t:0 "The Conspiracy"
 cafm_cen.3.d_success:0 "The conspirators did their work. Morazán is dead and a unitarian general has taken command before anyone could react. His supporters already call him a martyr."
 cafm_cen.3.d_failure:0 "The conspiracy was discovered. The plotters have fled or are in prison, and the liberal press is printing the names of those who paid. The scandal stains the whole centralist party."
 cafm_cen.3.f:0 "\"Bullets do not always go where they are sent.\""
 cafm_cen.3.a:0 "Let the will of the Republic be done"
 cafm_cen.3.b:0 "Deny everything"
 cafm_cen.4.t:0 "The Coup Is Being Prepared"
 cafm_cen.4.d:0 "The barracks commanders have given their word. It remains to decide how much money and how much haste to put into it."
 cafm_cen.4.f:0 "\"He who strikes first strikes twice.\""
 cafm_cen.4.a:0 "What we have is enough"
 cafm_cen.4.b:0 "Buy the undecided"
 cafm_cen.5.t:0 "Rumors in the Barracks"
 cafm_cen.5.d:0 "There is too much talk in the taverns. Some officers hesitate and others ask for guarantees before committing."
 cafm_cen.5.f:0 "\"Three can keep a secret if two are dead.\""
 cafm_cen.5.a:0 "Pay for their silence"
 cafm_cen.5.b:0 "Remove the doubters"
 cafm_cen.5.c:0 "Wait for it to calm down"
 cafm_cen.6.t:0 "The Coup"
 cafm_cen.6.d:0 "At dawn the troops occupied the palace. Morazán has gone into exile and a unitarian general governs the Republic."
 cafm_cen.6.f:0 "\"The homeland is not debated: it is commanded.\""
 cafm_cen.6.a:0 "Rule by decree"
 cafm_cen.6.b:0 "Keep the forms of the Republic"
 cafm_cen.7.t:0 "The Coup Discovered"
 cafm_cen.7.d:0 "Morazán learned of the plot in time. The officers involved have been dismissed and the federalists take to the streets to defend the Constitution."
 cafm_cen.7.f:0 "\"It has failed. We must wait.\""
 cafm_cen.7.a:0 "Worse times will come for them"
 cafm_cen.8.t:0 "The Federal Election of 1838"
 cafm_cen.8.d_won:0 "The votes have spoken: the centralist candidate wins the presidency of the Republic. Morazán leaves power and departs the capital."
 cafm_cen.8.d_lost:0 "Morazán wins again. The federalists celebrate in the streets and the centralist opposition will have to find another way."
 cafm_cen.8.f:0 "\"The ballot box is a battlefield too.\""
 cafm_cen.8.a:0 "A new Republic begins today"
 cafm_cen.8.b:0 "This is not the last word"
 cafm_cen.9.t:0 "The Sword and the Ballot"
 cafm_cen.9.d:0 "The federal election approaches. As long as Morazán commands the army, the barracks will vote for him. The centralists demand that the troops stay out of the campaign."
 cafm_cen.9.f:0 "\"A soldier does not vote: he obeys.\""
 cafm_cen.9.a:0 "Let the barracks be silent"
 cafm_cen.9.a_tt:0 "During the campaign the army loses political weight and the election is decided by the strength of the factions"
 cafm_cen.10.t:0 "Morazán Strikes Back"
 cafm_cen.10.d:0 "Morazán remains in power and no longer pretends: he dismisses centralist officials, calls on the States to defend the Constitution, and the liberals fill the squares once more."
 cafm_cen.10.f:0 "\"As long as I live, the Federation lives.\""
 cafm_cen.10.a:0 "We have come too late"
 cafm_cen.11.t:0 "The Separatists Appear"
 cafm_cen.11.d:0 "They no longer ask for more autonomy: in some States men speak openly of breaking with the Union. Local elites, tired of intendants and monopolies, begin to organize on their own."
 cafm_cen.11.f:0 "\"If the capital will not listen, let it stand alone.\""
 cafm_cen.11.a:0 "Let them come"
 cafm_cen.11.a_tt:0 "From now on the States' separatist movements can appear, and a separatist revolt can make the journal fail"
 cafm_cen.12.t:0 "The Law of the Unitary Republic"
 cafm_cen.12.d:0 "With no Congress to stop it, the law that turns the States into departments is ready to be enacted."
 cafm_cen.12.f:0 "\"One law for the whole nation.\""
 cafm_cen.12.a:0 "Enact it"
 cafm_cen.12.b:0 "Not yet"
 cafm_cen.13.t:0 "The National Guard"
 cafm_cen.13.d:0 "The States' militias obey their governors. A National Guard with career officers would obey only the Republic."
 cafm_cen.13.f:0 "\"One army, one flag.\""
 cafm_cen.13.a:0 "Create the National Guard"
 cafm_cen.13.b:0 "Not yet"
 cafm_cen.14.t:0 "The Religion of the State"
 cafm_cen.14.d:0 "With the concordat signed, the clergy asks that the Catholic faith be the religion of the Republic."
 cafm_cen.14.f:0 "\"God and the homeland, one cause.\""
 cafm_cen.14.a:0 "So be it"
 cafm_cen.14.b:0 "Not yet"
