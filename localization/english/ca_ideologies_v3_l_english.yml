 ca_ideology_events.1.t:0 "A New Constitution"
 ca_ideology_events.1.d:0 "The constitutionalists have won the day: a constituent assembly has written a new charter for the Republic. The intellectuals celebrate; the officers grumble if it limits the executive, and the clergy smiles if it names the Catholic faith as the religion of the State."
 ca_ideology_events.1.f:0 ""A new constitution for a new Republic.""
 ca_ideology_events.1.a:0 "A charter that limits the executive."
 ca_ideology_events.1.b:0 "A charter that names the Catholic faith as the religion of the State."
 ca_ideology_events.2.t:0 "[SCOPE.sInterestGroup('ca_divided_ig').GetName] Divided"
 ca_ideology_events.2.d:0 "[SCOPE.sCharacter('ca_divided_leader').GetFullName], leader of [SCOPE.sInterestGroup('ca_divided_ig').GetName], does not share the group's view of the Union. The members are tired of the quarrel: either the leader goes, or the group follows him."
 ca_ideology_events.2.f:0 ""A house divided against itself cannot stand.""
 ca_ideology_events.2.a:0 "The group chooses a new leader."
 ca_ideology_events.2.b:0 "The leader leaves to lead his own movement."
 ca_ideology_events.2.c:0 "The group adopts the ideas of its leader."
