 CA_EW119_CEN_DESC:0 "#bold Goal:#! impose the unitary Republic before the resistance brings it down.\n- Win over the army and support in the States\n- Spread propaganda and remove Morazán\n- Dissolve Congress and fill the #bold Unity#! bar"
 CA_EW119_CEN_TT:0 "#bold Player only.#! Opens its own journal, #bold The One and Indivisible Republic#!. At first the army is still federal and Morazán governs: the ground must be prepared first."
 ca_central_america.119.b_guide_tt:0 "#bold Difficulty: very hard.#! Impose the Union before it is taken from you. Phase I: win over the army, seek support in the States, spread propaganda and remove Morazán (assassination, coup or election) before December 1, 1838. Then dissolve Congress, pass the unitary law and bring #bold Unity#! to 100. The liberals will oppose you first; in time, the separatists."
