l_english:
 ca_los_altos_1848.1.t:0 "The Restoration of Los Altos"
 ca_los_altos_1848.1.d:0 "With Carrera gone from power and the liberals at odds in the capital, the council of Quetzaltenango has proclaimed, once again, the separation of Los Altos from Guatemala. General #bold Agustín Guzmán#!, who commanded the army of the Sixth State eight years ago, has been named interim president, and the notables of the highlands promise to choose a provisional government within days.\n\nSan Salvador does not hide its sympathy for the rebels, and the brothers Cruz are raising men against the government in the east. We must decide whether to let the highlands go, to buy their loyalty, or to bring them back by force."
 ca_los_altos_1848.1.f:0 "\"The Sixth State was never dead; it was only waiting.\""
 ca_los_altos_1848.1.a:0 "Let Quetzaltenango govern itself."
 ca_los_altos_1848.1.b:0 "Negotiate with the highland notables."
 ca_los_altos_1848.1.c:0 "Crush the rebellion!"
 ca_altos_1848_play:0 "Reincorporation of Los Altos"
