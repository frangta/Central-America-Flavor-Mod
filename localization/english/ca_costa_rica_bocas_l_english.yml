l_english:
 # =========================================================================
 # CAFM - Bocas del Toro (1836-1837): new texts
 # Source: letter of Ildefonso de Paredes, 21 Jan 1837, Revista del
 # Archivo Nacional 3 (1938), pp. 72-73
 # =========================================================================

 ca_costa_rica_events.161.d_defendida:0 "18 December 1836. Ildefonso de Paredes has reached Bocas del Toro with two warships, only to find the Morazán District garrisoned and ready. Filemón Galindo refused to leave. After a tense exchange of notes, the Granadine ships have weighed anchor. New Granada will not forget the affront."
 ca_costa_rica_events.161.b:0 "The district stands. Paredes withdraws."

 ca_costa_rica_events.162.t:0 "The Letter from Paredes"
 ca_costa_rica_events.162.d:0 "21 January 1837. A letter arrives from Bocas del Toro, signed by Ildefonso de Paredes as political chief of the canton for the Republic of New Granada. Bocas del Toro, he writes, «indisputably belongs to New Granada». He asks San José to explain its intentions and to declare whether it recognizes the treaty of 15 March 1825 between Colombia and Central America, which New Granada still considers in force."
 ca_costa_rica_events.162.f:0 "«Libertad y Orden», reads the signature. Neither one for us."
 ca_costa_rica_events.162.a:0 "Take the protest to the Federation."
 ca_costa_rica_events.162.b:0 "Answer him ourselves, without waiting for San Salvador."
 ca_costa_rica_events.162.c:0 "Accept the status quo of the 1825 treaty."

 je_ca_cos_bocas_del_toro_status_defendida:0 "The Morazán District has held. New Granada withdrew, but it has not given up."
