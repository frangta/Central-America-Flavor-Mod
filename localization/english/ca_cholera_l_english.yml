l_english:
 # CAFM - F16 - Colera y Codigos Livingston
 ca_central_america.14.t:0 "The Livingston Codes"
 ca_central_america.14.d:0 "The penal codes written by the American jurist Edward Livingston are ready to come into force in Guatemala: trial by jury, civil marriage, divorce and an end to the privileges of the clergy. The liberals call them the law of the future; the priests and the landowners call them the law of the devil."
 ca_central_america.14.f:0 ""A code for a people that does not yet exist.""
 ca_central_america.14.a:0 "Apply the codes."
 ca_central_america.14.b:0 "Shelve the reform."
 ca_central_america.15.t:0 "Cholera in Guatemala"
 ca_central_america.15.d:0 "The cholera has appeared in Chiquimula and in the district of Mita, and is marching on the capital. The doctors propose sanitary cordons, passports, lazarettos and cemeteries outside the churches. In the villages of La Montaña a rumor spreads: the government is poisoning the water."
 ca_central_america.15.f:0 ""The cure frightens them more than the disease.""
 ca_central_america.15.a:0 "Sanitary cordons and health boards."
 ca_central_america.15.b:0 "Let it run its course."
 ca_central_america.15.c:0 "Ask the clergy to calm the rumors."
 ca_central_america.16.t:0 "Cholera in [SCOPE.sState('ca_cholera_state').GetName]"
 ca_central_america.16.d:0 "The cholera has broken out in [SCOPE.sState('ca_cholera_state').GetName]. Without hospitals or doctors, the authorities can only choose between closing the roads or letting the disease run."
 ca_central_america.16.f:0 ""The cholera does not ask for a passport.""
 ca_central_america.16.a:0 "Quarantine the state."
 ca_central_america.16.b:0 "Let it run its course."
 ca_central_america.17.t:0 "The Cholera Spreads"
 ca_central_america.17.d:0 "The cholera has crossed into [SCOPE.sState('ca_cholera_spread').GetName]. Travelers, muleteers and soldiers carry it from town to town."
 ca_central_america.17.f:0 ""From village to village, the bells toll.""
 ca_central_america.17.a:0 "Pray for it to pass."
 ca_central_america.17.b:0 "Quarantine every affected state."
 ca_generic_cholera_mod:0 "Cholera Outbreak"
 ca_generic_cholera_mod_desc:0 "The cholera is killing the people of this state."
 ca_cholera_clergy:0 "The Clergy Calms the Rumors"
 ca_cholera_clergy_desc:0 "The priests preach that the cholera is not poison."
