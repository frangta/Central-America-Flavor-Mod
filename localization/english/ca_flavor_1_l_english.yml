 ca_caudillo.2.a: "A great day for order and discipline."
 ca_caudillo.2.f: "And so the father has become, like all men, too old and too tired to continue. Now, dear child, the country is ready to take its first, true steps forward. We live without our mother's eye, and without our father's switch. Everyone makes their choices today. And your grandchildren will look at us and say, 'and they lived happy and ate partridges.'"
 ca_caudillo.4.t: "Continuismo"
 ca_caudillo.4.d: "According to the [ROOT.GetCountry.GetAdjective] Constitution, [SCOPE.sCharacter('ruler_scope').GetFullName]'s term is over and a new [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] must be appointed. Of course, the Constitution can always be amended, or perhaps the role should go to [SCOPE.sCharacter('ruler_scope').GetHerHis] protégé [SCOPE.sCharacter('president_successor_scope').GetFullName]."
 ca_caudillo.4.f: "\"Your term in office is over. The laws of [ROOT.GetCountry.GetNameNoFormatting]...\"\n\n\"I am the law in [ROOT.GetCountry.GetNameNoFormatting]!\""
 ca_caudillo.4.a: "Extend the [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle]'s term."
 ca_caudillo.5.t: "Kingmaker"
 ca_caudillo.5.desc: "As leader of the [SCOPE.gsInterestGroup('army_scope').GetName], [SCOPE.sCharacter('army_leader').GetFullName] must decide whether the military will back the [SCOPE.sParty('liberal_party').GetName] or the [SCOPE.sParty('conservative_party').GetName]."

