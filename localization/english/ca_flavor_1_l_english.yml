 # ==========================================
 # 1. CONCEPTS & DIPLOMATIC PACTS
 # ==========================================
 concept_constitution:0 "Constitution"
 concept_constitution_desc:0 "The fundamental principles according to which a state is acknowledged to be governed."
 concept_ca_confederation:0 "Confederation"
 concept_ca_confederation_desc:0 "A loose union of sovereign states united for common action."
 concept_ca_chartered_company: "Chartered Company"
 concept_ca_chartered_company_desc: "[Concept('concept_recognized_power','$concept_recognized_powers$')] may establish a $concept_chartered_company$. A $concept_chartered_company$ is a more autonomous [concept_subject] type that are able to start their own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] and are not forced to join their [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_war','$concept_wars$')]. They must pay #v 20%#! of their [concept_treasury] income to their $concept_overlord$ each week and have restrictions on declaring independence."
 concept_real_union: "Real Union"
 concept_real_union_desc: "Two [Concept('concept_country', '$concept_countries$')] may be joined together in a $concept_real_union$, a [concept_subject] symbolizing a union of two or more $concept_countries$, which share some state institutions in contrast to personal unions. The subject cannot start their own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], yet are forced to join their $concept_overlord$'s [Concept('concept_war','$concept_wars$')]."
 concept_ca_dependency: "Dependency"
 concept_ca_dependency_desc: "A large country may give a region $concept_ca_dependency$, a [concept_subject] relationship where the junior partner is almost entirely integrated into the [concept_overlord]. The subject cannot start their own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], yet are forced to join their $concept_overlord$'s [Concept('concept_war','$concept_wars$')]."
 concept_confederative_partner: "Confederative Partner"
 concept_confederative_partner_desc: "Two countries may be bound in a $confederative_partner$, a [concept_subject] relationship where the junior partner is almost entirely independent but retains a close relationship with the [concept_overlord]. The subjects is protected by their overlord in [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] and are forced to join their $concept_overlord$'s [Concept('concept_war','$concept_wars$')]."
 concept_ca_autonomous_province: "Autonomous Province"
 concept_ca_autonomous_province_desc: "A country may be little more than a region with considerable autonomy, making it an [concept_ca_autonomous_province], a [concept_subject] relationship where the junior partner is almost entirely integrated into the [concept_overlord]. The [concept_subject] is protected by their overlord in [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], but is not forced to join their $concept_overlord$'s [Concept('concept_war','$concept_wars$')].  An $concept_ca_autonomous_province$ cannot be granted independence, but the [concept_subject] may gain independence from its [concept_overlord] in a $concept_diplomatic_play$."
 concept_defensive_pact_confederation: "Defensive Pact"
 concept_defensive_pact_confederation_desc: "A [concept_diplomatic_pact] between two [Concept('concept_country','$concept_countries$')]. $concept_countries$ engaged in a $concept_defensive_pact$ may always side with each other in [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] in which they are the primary target, regardless of if the other side maintains an active [concept_active_interest] in the affected [concept_strategic_region]. This does not extend to $concept_diplomatic_plays$ where the other party is the initiator, or where they are backing a third $concept_country$ as a primary target."

