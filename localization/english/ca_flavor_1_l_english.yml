 gov_reservation: "Indian Reservation"ca_caudillo.5.t: "Kingmaker"
 gov_reservation_desc: "This is a [concept_gca_caudillo.5.desc: "As leader of the [SCOPE.gsInterestGroup('army_scope').GetName], [SCOPE.sCharacter('army_leader').GetFullName] must decide whether the military will back the [SCOPE.sParty('liberal_party').GetName] or the [SCOPE.sParty('conservative_party').GetName]."

