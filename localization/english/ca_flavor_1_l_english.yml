 ca_caudillo_rule_by_decree_modifier: "Rule by Decree"
 ca_caudillo_decree_button: "Rule by Decree"
 ca_caudillo_decree_button_desc: "The leader of our nation should not be burdened by bothersome governmental process, whether bureaucratic or democratic. If the nation is ordered to jump, it should ask "how high?""
 ca_ideology_constitutionalist: "Constitutionalist"
 ca_ideology_constitutionalist_desc: "#lore This group believes in constitutional rule and the role of strong democratic institutions in statecraft.#!"
 #Central American Journal Entries
 je_central_america_falls_apart: "The Dissolution of Central America"
 je_central_america_falls_apart_reason: "The past decade has left Central America polarized. Tensions between the liberals and conservatives are growing with every day and unless we manage to restore order in the provinces, the future of the Union seems to be one of uncertainty."
 #Centro American Flavor
 je_central_american_fragile_unity: ""
 ca_notification_unification_notification_generic_name: "[SCOPE.sCountry('formation_country').GetAdjective] Unification"
 ca_notification_unification_notification_generic_desc: "[SCOPE.sCountry('formation_country').GetName] has emerged as a rising power in [SCOPE.sStrategicRegion('capital_region_scope').GetName]."
 ca_notification_unification_notification_generic_tooltip: "#header $notification_unification_notification_generic_name$#!\n$TOOLTIP_DELIMITER$\n$notification_unification_notification_generic_desc$"
 je_ca_reunify_central_america: "Central American Reunification"
 je_ca_reunify_central_america_reason: "The collapse of the United Provinces of Central America into disparate fiefdoms has left the region impoverished and vulnerable to the most avaricious exploitation. If Central America ever wishes to take full advantage of the potential of the modern era, it must stand as one."
 dp_unify_central_america: "Unify the Great Republic of Central America"
