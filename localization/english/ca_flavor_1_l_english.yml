 gov_governorate: "Governorate"
 gov_grand_duchy_posen: "Grand Duchy"# Age of Caudillos
 gov_kurdish_state: "Kurdish Emirate"je_ca_fragile_unity: "Fragile Unity of Central America"
 gov_kurdish_state_desc: "This is a Kurdish je_ca_fragile_unity_reason: "The status of the bold Progress Bar! will be determined by various tooltippable;tooltip:[Country.GetTooltipTag],je_ca_fragile_unity_special_tooltip_advance positive#! or tooltippable;tooltip:[Country.GetTooltipTag],je_ca_fragile_unity_special_tooltip_deplete negative#! conditions. The bold Progress Bar! reaching bold 100! will cement the power of military strongmen in [SCOPE.sCountry('caudillo_country_scope').GetName]. Next month, the bold Progress Bar! will change by variable [Country.MakeScope.Var('caudillo_next').GetValue|+=]!.\n\nDepleting the progress bar and keeping the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] out of government will destroy bold Caudillismo! in the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] and end the threat of military strongmen in the country.\n\n#italic Following our independence from Spain, a power vacuum was left in the place of the dismantled colonial governments, which was quickly filled by charismatic military leaders. These "caudillos" have come to define much of South American politics.#!"
 gov_heavenly_kingdom: "Theocratic Empire"je_ca_fragile_unity_special_tooltip_advance: "The [concept_journal_entry] will end when the progress bar is either full or empty. \n\nThese factors will #bold advance#! the progress bar by #bold 10 per month each:#!\n• The [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant] are [concept_powerful]\n• The [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant] are [concept_in_government]\n• We have [GetLawType('law_autocracy').GetName], [GetLawType('law_oligarchy').GetName],[GetLawType('law_technocracy').GetName],[GetLawType('law_single_party_state').GetName],[GetLawType('law_national_supremacy').GetName],[GetLawType('law_state_religion').GetName],[GetLawType('law_censorship').GetName] and [GetLawType('law_hereditary_bureaucrats').GetName]\n•
 gov_heavenly_kingdom_desc: "This is a Chineje_ca_fragile_unity_special_tooltip_deplete: "The following factors will bold deplete! the progress bar by bold -10 per month each!:\n• The [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant] are [concept_marginalized]\n• The [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameWithCountryVariant] are not [concept_in_government]\n• We have [GetLawType('law_census_voting').GetName] or [GetLawType('law_universal_suffrage').GetName]\n• We have a [concept_politician] who is [Concept('concept_popularity','$loved$')], and belongs to any [concept_powerful] interest group that does not approve of [GetLawType('law_universal_suffrage').GetName], [GetLawType('law_total_separation').GetName], [GetLawType('law_census_voting').GetName], and [GetLawType('law_cultural_exclusion').GetName],[GetLawType('law_elected_bureaucrats').GetName],[GetLawType('law_right_of_assembly').GetName]\n•
 gov_royal_revolt: "Carlist Monarchy"ca_caudillo.1.t: "The Age of Caudillos"
 gov_royal_revolt_desc: "This is a revolutioca_caudillo.1.d: "Following [ROOT.GetCountry.GetAdjective] independence from Spain, a power vacuum was left in place of the colonial government, which was quickly filled by charismatic [SCOPE.gsInterestGroup('army_scope').GetName] leaders. These "caudillos" have come to define much of South American politics."
 gov_caucasian_viceroyalty: "Viceroyalty"ca_caudillo.1.f: "There was, once, a decree that all colonies would submit to the rule of their mother country. That all its goods and words would pass through her doors, and that she would judge them fairly. That she alone would be all they needed.\n\nThen there was Bonaparte, and the mother country made his puppet. Perhaps time had come for the children to fly. And fly they would, under a father's mailed fist. But this tale is yet to end."
 gov_caucasian_viceroyalty_desc: "This is a ca_caudillo.1.a: "Might makes right."
 gov_baltic_governorate: "Baltic Governorateca_caudillo.2.t: "The Last Caudillos"
 gov_baltic_governorate_desc: "This is a Balca_caudillo.2.d: "The age of caudillo politics is, at long last, at an end in [ROOT.GetCountry.GetName]. The [SCOPE.gsInterestGroup('army_scope').GetName] have assumed their rightful place of service to the legitimate government."
 gov_governor_generalship: "Governor-Generalca_caudillo.2.f: "And so the father has become, like all men, too old and too tired to continue. Now, dear child, the country is ready to take its first, true steps forward. We live without our mother's eye, and without our father's switch. Everyone makes their choices today. And your grandchildren will look at us and say, 'and they lived happy and ate partridges.'"
 gov_governor_generalship_desc: "A type of aca_caudillo.2.a: "A great day for order and discipline."
 gov_hermit_kingdom: "Hermit Kingdom"ca_caudillo.3.t: "The Fist Clenches"
 gov_hermit_kingdom_desc: "This is a [concepca_caudillo.3.d: "[ROOT.GetCountry.GetName] has become fully immersed in caudillo politics. The fate of the nation is governed by the whims of the most influential members of the [SCOPE.gsInterestGroup('army_scope').GetName]."
 gov_eyalet:0 "Eyalet"ca_caudillo.3.f: ""But mama, what about the parade in [SCOPE.sState('capital_scope').GetNameNoFormatting]? Will we be there in time to see Alfonso?\n\n"Seems I'll never finish the story. Fine, yes, I promise we will be there on time. But what will you do if you cannot march with your brother when you grow up? Milk cows?"\n\n"Mama, I know [SCOPE.sCharacter('general_scope').GetLastNameNoFormatting] will have me. I'm going to be strong for [ROOT.GetCountry.GetNameNoFormatting]!""
 gov_eyalet_desc:0 "This is an unreformed prca_caudillo.3.a: "The sword is mightier than the pen."
 gov_pashalik:0 "Pashalik"ca_fragile_unity_complete: "The progress bar is depleted"
 gov_pashalik_desc:0 "This is a form of goveca_je_fragile_unity_goal_tt: "The progress bar is full"
 gov_hatian_empire: "Haitian Empire"ca_lose_fragile_unity_points: "The progress bar on the #Fragile nity#! [concept_journal_entry] is depleted by #bold 100 points#!"
 gov_hatian_empire_desc: "This is a [conceptca_lose_fragile_unity_points_200: "The progress bar on the #Fragile nity#! [concept_journal_entry] is depleted by #bold 200 points#!"
 gov_eyalet:0 "Eyalet"ca_gain_fragile_unity_points: "The progress bar on the #Fragile nity#! [concept_journal_entry] is advanced by #bold 100 points#!"
 ca_gain_fragile_unity_points_200: "The progress bar on the #Fragile nity#! [concept_journal_entry] is advanced by #bold 200 points#!"
 ca_continuismo: "Continuismo"
 #Parliamentaryca_no_continuismo: "Constitutional Reappointment"
 gov_parliamentary_oligarchy_chancellor: "Paca_caudillo.4.t: "Continuismo"
 gov_parliamentary_oligarchy_chancellor_descca_caudillo.4.d: "According to the [ROOT.GetCountry.GetAdjective] Constitution, [SCOPE.sCharacter('ruler_scope').GetFullName]'s term is over and a new [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] must be appointed. Of course, the Constitution can always be ammended, or perhaps the role should go to [SCOPE.sCharacter('ruler_scope').GetHerHis] protégé [SCOPE.sCharacter('president_successor_scope').GetFullName]."
 gov_parliamentary_democracy_chancellor: "Paca_caudillo.4.f: ""Your term in office is over. The laws of [ROOT.GetCountry.GetNameNoFormatting]-"\n\n"I am the law in [ROOT.GetCountry.GetNameNoFormatting]!""
 gov_parliamentary_democracy_chancellor_descca_caudillo.4.a: "Extend the [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle]'s term."
 ca_caudillo.4.b: "The [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] must step down."
 gov_co_principality: "Co-Principality"ca_caudillo.4.c: "A chance for [SCOPE.sCharacter('president_successor_scope').GetFullName] to show [SCOPE.sCharacter('president_successor_scope').GetHerHis] quality."
 gov_co_principality_desc: "This is a [conceca_retire_ruler: "[SCOPE.sCharacter('ruler_scope').GetFullName] retires from political life"
 ca_caudillo_kingmaker_tt: "Has not supported a [concept_party]"
 gov_real_union_viceroy: "Real Union"ca_caudillo_kingmaker_effect_tt: "The [concept_leader] of the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] chooses which [concept_party] to support"
 gov_real_union_viceroy_desc: "This is a [coca_armed_forces_support_conservative: "The [SCOPE.gsInterestGroup('army_scope').GetName] will support the [SCOPE.sParty('conservative_party').GetName] under the leadership of [SCOPE.sCharacter('army_leader').GetFullName]"
 gov_grand_duchy_finland: "Grand Duchy"ca_armed_forces_support_liberal: "The [SCOPE.gsInterestGroup('army_scope').GetName] will support the [SCOPE.sParty('liberal_party').GetName] under the leadership of [SCOPE.sCharacter('army_leader').GetFullName]"
 gov_grand_duchy_finland_desc: "This is a [cca_armed_forces_support_communist: "The [SCOPE.gsInterestGroup('army_scope').GetName] will support the [SCOPE.sParty('communist_party').GetName] under the leadership of [SCOPE.sCharacter('army_leader').GetFullName]"
 ca_armed_forces_support_fascist: "The [SCOPE.gsInterestGroup('army_scope').GetName] will support the [SCOPE.sParty('fascist_party').GetName] under the leadership of [SCOPE.sCharacter('army_leader').GetFullName]"
 gov_reservation: "Indian Reservation"ca_caudillo.5.t: "Kingmaker"
 gov_reservation_desc: "This is a [concept_gca_caudillo.5.desc: "As leader of the [SCOPE.gsInterestGroup('army_scope').GetName], [SCOPE.sCharacter('army_leader').GetFullName] must decide whether the military will back the [SCOPE.sParty('liberal_party').GetName] or the [SCOPE.sParty('conservative_party').GetName]."

 central_america_two_party_system: "Central American Two-Party Dominance"
 ca_caudillo_support: "Caudillo Kingmaker"
 ca_caudillo_kingmaker_button: "Determine Army Support for Parties"
 ca_caudillo_kingmaker_button_desc: "Powerful Caudillos have immense political influence, and can turn the tide of party politics by backing one party against another."
 ca_has_elections_tt: "Country has [Concept('concept_election','$concept_elections$')]"
 ca_caudillo_rule_by_decree_modifier: "Rule by Decree"
 ca_caudillo_decree_button: "Rule by Decree"
 ca_caudillo_decree_button_desc: "The leader of our nation should not be burdened by bothersome governmental process, whether bureaucratic or democratic. If the nation is ordered to jump, it should ask "how high?""
 ca_ideology_constitutionalist: "Constitutionalist"
 ca_ideology_constitutionalist_desc: "#lore This group believes in constitutional rule and the role of strong democratic institutions in statecraft.#!"
 #Central American Journal Entries
 je_central_america_falls_apart: "The Dissolution of Central America"
 je_central_america_falls_apart_reason: "The past decade has left Central America polarized. Tensions between the liberals and conservatives are growing with every day and unless we manage to restore order in the provinces, the future of the Union seems to be one of uncertainty."
 #Centro American Flavor
 je_central_american_fragile_unity: ""
 ca_notification_unification_notification_generic_name: "[SCOPE.sCountry('formation_country').GetAdjective] Unification"
 ca_notification_unification_notification_generic_desc: "[SCOPE.sCountry('formation_country').GetName] has emerged as a rising power in [SCOPE.sStrategicRegion('capital_region_scope').GetName]."
 ca_notification_unification_notification_generic_tooltip: "#header $notification_unification_notification_generic_name$#!\n$TOOLTIP_DELIMITER$\n$notification_unification_notification_generic_desc$"
 je_ca_reunify_central_america: "Central American Reunification"
 je_ca_reunify_central_america_reason: "The collapse of the United Provinces of Central America into disparate fiefdoms has left the region impoverished and vulnerable to the most avaricious exploitation. If Central America ever wishes to take full advantage of the potential of the modern era, it must stand as one."
 dp_unify_central_america: "Unify the Great Republic of Central America"
 dp_unify_central_america_tooltip: "#header Start a $dp_unify_central_america$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_unify_central_america_desc$"
 dp_unify_central_america_desc: "Sets the initiating [concept_war_goal] to annex all lesser Central American countries."
 GCA_tt: "[SCOPE.sCountry('target_country').GetName] can form the Great Republic of Central America"
 je_central_american_national_identity: "A New National Identity"
 je_central_american_national_identity_reason: "Although once part of a greater continuum, sharing a common colonial government and common leadership with our neighbors, we have diverged considerably since we won our independence. It is time we fully assumed a new [SCOPE.sCulture('new_ca_national_culture').GetName] identity."
