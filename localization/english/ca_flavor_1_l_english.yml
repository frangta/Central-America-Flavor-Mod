 # ==========================================
 # 2. IDEOLOGIES
 # ==========================================
 ideology_taiping_moralist: "Taiping Moralism"
 ideology_taiping_king: "Son of Shangdi"
 ideology_guilds: "Economic Traditionalists"
 ideology_guilds_desc: "#lore The Guilds see progressive economical laws as a threat to their existence.#!"
 ideology_communalist: "Communalist"
 ideology_communalist_desc: "This group wants communal autonomy in their work, free from the oppression of the elites."
 ideology_silhak: "Silhak"
 ideology_donghak: "Donghak"

 # Central American Ideologies
 ideology_central_american_reactionary: "Regionalist"
 ideology_central_american_reactionary_desc: "This group believes that the government should be reformed into a confederation, or entirely dissolved, and that the individual provinces should become fully independent."
 ideology_central_american_reactionary_2: "Centralistas"
 ideology_central_american_reactionary_2_desc: "This group believes that the government should be reformed into a Unitarian Republic, or entirely dissolved, and that the individual provinces should become fully independent." 
 ideology_central_america_caudillo: "Dissolutionist"
 ideology_central_america_caudillo_desc: "This leader wants the full independence of the individual regions in the country, free from any sort of unequal or federal government."
 ideology_liberalismo: "Liberalismo"
 ideology_liberalismo_desc: "This group opposes a strong centralized government and believes in some level of societal reform in line with European ideologies. They support free trade and restricting the power of corporations."
 ideology_conservadurismo: "Conservadurismo"
 ideology_conservadurismo_desc: "This group supports a strong centralized state with protectionist trade policies and the maintenance of the aristocratic configuration of society. They are anti-foreigners, often falling into xenophobic tendencies and criticize the import of foreign ideologies."
 ideology_soberania_aristocratica: "Soberanía Aristocrática"
 ideology_soberania_aristocratica_desc: "This group has an essentially hierarchical and elitist vision of social organization."
 ideology_crucismo: "Crucismo"
 ideology_crucismo_desc: "Andrés de Santa Cruz seeks to modernize the Andes specially trough education and free trade so that it can outcompete the other South American powers"
 ideology_agroexportadores: "Agroexportadores"
 ideology_agroexportadores_desc: "This group believes the focus of the economic policy should be on agriculture and the interests of farmers who see the adjacent markets as lucrative places to sell their products"
 ideology_artesanado: "Artesanado"
 ideology_artesanado_desc: "This group believes that economic policy should be geared toward the interests of artisans and protect their profits from cheap foreign products"
 ideology_unitarian: "Unitarian"
 ideology_unitarian_desc: "This leader fervently believes that the best form of organization for the nation is a strong general government that can leverage the national potential to the benefit of all its citizens."
 ideology_federalist: "Federalist"
 ideology_federalist_desc: "This leader fervently believes that the best form of organization for the nation is a general government limited by local autonomy."
 ideology_incan_reclaimer: "Incan Reclaimer"
 ideology_incan_reclaimer_desc: "This leader seeks to free the indigenous population from colonial oppression and reclaim their imperial heritage."
 ideology_liberal_monarchist: "Liberal Monarchist"
 ideology_liberal_monarchist_desc: "This leader believes that the best way of achieving stability for a liberal state is to have a monarchy to act as a cohesive figure the nation can rally around."
 ideology_autocratic_autonomist: "Autocratic Autonomist"
 ideology_autocratic_autonomist_desc: "This leader believes in the primacy of having a stable and powerful central government to protect local autonomy from the hands of anarchy and mob rule."
 ideology_ca_leader_autocratic_autonomist: "Autocratic Autonomist"
 ideology_ca_leader_autocratic_autonomist_desc: "This leader believes in the primacy of having a stable and powerful central government to protect local autonomy from the hands of anarchy and mob rule."
 ca_ideology_constitutionalist: "Constitutionalist"
 ca_ideology_constitutionalist_desc: "#lore This group believes in constitutional rule and the role of strong democratic institutions in statecraft.#!"
 
 # Guatemala Flavor Ideologies
 ideology_maya_autonomism: "Maya Autonomy"
 ideology_maya_autonomism_desc: "This faction rejects the Creole republics, seeking to recover communal lands, protect their native languages, and establish a government of agrarian councils without interference from the capital."
 
 # El Salvador Flavor Ideologies
 ideology_coffee_liberalism: "Coffee Liberalism"
 ideology_coffee_liberalism_desc: "Driven by the 'Golden Bean' fever, these oligarchs believe that the nation's progress lies in the complete privatization of land, free trade, and a government reserved strictly for the wealthiest."
 ideology_cuscatleco_nationalism:0 "Cuscatleco Nationalism"
 ideology_cuscatleco_nationalism_desc:0 "Convinced that Salvadoran population density and discipline make them superior, this faction promotes territorial expansion through a militarized dictatorship and mass conscription."
 
 # Nicaragua Flavor Ideologies
 ideology_granadine_legitimism: "Granadan Legitimism"
 ideology_granadine_legitimism_desc: "The conservative elite of Granada abhors the enlightened ideas of their Leonese rivals. They defend a paternalistic, rigidly Catholic, and authoritarian order to save the nation from moral anarchy."
 ideology_anti_imperialist_sovereigntism: "Anti-imperialist Sovereignism"
 ideology_anti_imperialist_sovereigntism_desc: "Forged in the ashes of foreign interventions, they demand the immediate expulsion of imperialist corporate interests. They support a cooperative economy sustained by popular guerrilla movements."
 ideology_slaver_filibusterism: "Slave Filibusterism"
 ideology_slaver_filibusterism_desc: "A dark and rapacious manifest destiny. This foreign faction seeks to subjugate entire republics, reintroduce slave institutions, and govern through an absolute racial hierarchy."
 
 # Costa Rica Flavor Ideologies
 ideology_carrillismo: "Carrillismo"
 ideology_carrillismo_desc: "Inspired by Braulio Carrillo, they argue that peaceful isolation and a firm institutional hand are the only way to prevent Costa Rica from being dragged into the endless civil wars of the rest of Central America."
 ideology_olympus_liberalism: "Olympian Liberalism"
 ideology_olympus_liberalism_desc: "A generation of thinkers seeking to eradicate the influence of the Church through aggressive public education. They promote scientific advancement but believe that only the educated elite should have the right to vote."
 ideology_chacara_social_democracy: "Chacara Social Democracy"
 ideology_chacara_social_democracy_desc: "Based on the tradition of the independent small farmer (the chacarero), this faction promotes peaceful agrarian reforms, truly universal suffrage, and an early welfare state."
 
 # Panama Flavor Ideologies
 ideology_mercantile_transitism: "Mercantile Transitism"
 ideology_mercantile_transitism_desc: "The Isthmus of Panama owes its existence to world trade. This faction demands completely open borders and zero tariffs, making the country the ultimate bridge of global capitalism."
 ideology_isthmian_separatism: "Isthmian Separatism"
 ideology_isthmian_separatism_desc: "Fed up with neglect and distant centralism, the separatists seek to sever ties and establish a sovereign republic, even if that means military dependence on foreign naval powers."

 # ==========================================
 # 3. LAWS & GOVERNMENT TYPES
 # ==========================================
 law_land_reform_coffee_oligarchy: "Coffee Oligarchy Land Regime"
 law_land_reform_coffee_oligarchy_desc: "Large coffee haciendas keep legal control of land and property; smallholders face high barriers to land ownership."
 law_land_reform_communal_lands: "Communal Lands"
 law_land_reform_communal_lands_desc: "Recognises community/communal land rights and customary tenure; reduces large-scale enclosure."
 law_land_reform_banana_republic: "Banana Export Concessions"
 law_land_reform_banana_republic_desc: "Legal framework that privileges export concessions and foreign companies in plantation agriculture."
 law_land_reform_hacienda_system: "Hacienda Land Regime"
 law_land_reform_hacienda_system_desc: "Large landed estates (haciendas) legally structured to supply regional markets and the export economy."

 gov_governorate: "Governorate"
 gov_grand_duchy_posen: "Grand Duchy"
 gov_governor_generalship: "Governor-General"
 gov_governor_generalship_desc: "A type of administration characterized by sweeping executive authority."
 gov_parliamentary_oligarchy_chancellor: "Parliamentary Oligarchy"
 gov_parliamentary_oligarchy_chancellor_desc: "A political system dominated by a wealthy or privileged few through parliamentary mechanisms."
 gov_parliamentary_democracy_chancellor: "Parliamentary Democracy"
 gov_parliamentary_democracy_chancellor_desc: "A democratic system structured around a parliament and a chancellor representing the popular will."
 gov_reservation: "Indian Reservation"
 gov_reservation_desc: "This is a recognized territory managed by indigenous groups with specific treaties."

 # ==========================================
 # 4. CONCEPTS & DIPLOMATIC PACTS
 # ==========================================
 concept_constitution:0 "Constitution"
 concept_constitution_desc:0 "The fundamental principles according to which a state is acknowledged to be governed."
 concept_ca_confederation:0 "Confederation"
 concept_ca_confederation_desc:0 "A loose union of sovereign states united for common action."
 concept_ca_chartered_company: "Chartered Company"
 concept_ca_chartered_company_desc: "[Concept('concept_recognized_power','$concept_recognized_powers$')] may establish a $concept_chartered_company$. A $concept_chartered_company$ is a more autonomous [concept_subject] type that are able to start their own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] and are not forced to join their [Concept('concept_overlord','$concept_overlord_possessive$')] [Concept('concept_war','$concept_wars$')]. They must pay #v 20%#! of their [concept_treasury] income to their $concept_overlord$ each week and have restrictions on declaring independence."
 concept_real_union: "Real Union"
 concept_real_union_desc: "Two [Concept('concept_country', '$concept_countries$')] may be joined together in a $concept_real_union$, a [concept_subject] symbolizing a union of two or more $concept_countries$, which share some state institutions in contrast to personal unions. The subject cannot start their own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], yet are forced to join their $concept_overlord$'s [Concept('concept_war','$concept_wars$')]."
 concept_ca_dependency: "Dependency"
 concept_ca_dependency_desc: "A large country may give a region $concept_ca_dependency$, a [concept_subject] relationship where the junior partner is almost entirely integrated into the [concept_overlord]. The subject cannot start their own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], yet are forced to join their $concept_overlord$'s [Concept('concept_war','$concept_wars$')]."
 concept_confederative_partner: "Confederative Partner"
 concept_confederative_partner_desc: "Two countries may be bound in a $confederative_partner$, a [concept_subject] relationship where the junior partner is almost entirely independent but retains a close relationship with the [concept_overlord]. The subjects is protected by their overlord in [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] and are forced to join their $concept_overlord$'s [Concept('concept_war','$concept_wars$')]."
 concept_ca_autonomous_province: "Autonomous Province"
 concept_ca_autonomous_province_desc: "A country may be little more than a region with considerable autonomy, making it an [concept_ca_autonomous_province], a [concept_subject] relationship where the junior partner is almost entirely integrated into the [concept_overlord]. The [concept_subject] is protected by their overlord in [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')], but is not forced to join their $concept_overlord$'s [Concept('concept_war','$concept_wars$')].  An $concept_ca_autonomous_province$ cannot be granted independence, but the [concept_subject] may gain independence from its [concept_overlord] in a $concept_diplomatic_play$."
 concept_defensive_pact_confederation: "Defensive Pact"
 concept_defensive_pact_confederation_desc: "A [concept_diplomatic_pact] between two [Concept('concept_country','$concept_countries$')]. $concept_countries$ engaged in a $concept_defensive_pact$ may always side with each other in [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')] in which they are the primary target, regardless of if the other side maintains an active [concept_active_interest] in the affected [concept_strategic_region]. This does not extend to $concept_diplomatic_plays$ where the other party is the initiator, or where they are backing a third $concept_country$ as a primary target."

 ca_confederative_partner:0 "Confederative Partner"
 ca_confederative_partner_desc:0 "Make this country a partner in our Confederation."
