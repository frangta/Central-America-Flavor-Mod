 je_frca_support_progress_desc: "The current level of support for the Federal Republic of Central America amidst growing separatist tensions. Each point represents the loyalty of the states to the federal ideal. As support wanes, the dream of a united Central America fades away."
 ca_je_fragile_unity_goal_tt: "Goal: Restore and stabilise Central America's fragile unity."
 je_federalists_vs_separatists_goal_tt: "Federalists vs. Separatists — a contest for control. Federalists seek unity; Separatists press for independence."
