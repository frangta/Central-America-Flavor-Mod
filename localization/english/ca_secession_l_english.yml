 ca_fvs_beats_election_desc:0 "The elections in [SCOPE.sCountry('secession_country').GetName] have given the government to the unionists. The separatists have lost their hold on the State."
 ca_fvs_beats_coup_desc:0 "Officers loyal to the Federation have seized power in [SCOPE.sCountry('secession_country').GetName] and expelled the separatist leaders."
 ca_fvs_beats_civil_war_desc:0 "The civil war in [SCOPE.sCountry('secession_country').GetName] is over, and the federalists have won it."
 ca_fvs_beats_morazan_desc:0 "Francisco Morazán has taken the government of [SCOPE.sCountry('secession_country').GetName] himself. While he holds San Salvador, the State remains the bastion of the Federation."
 ca_fvs_falls_election_desc:0 "The elections in [SCOPE.sCountry('secession_country').GetName] have given the government to the enemies of the Union."
 ca_fvs_falls_coup_desc:0 "A coup in [SCOPE.sCountry('secession_country').GetName] has brought the separatists to power. The new government no longer obeys the federal authorities."
 ca_fvs_falls_civil_war_desc:0 "The civil war in [SCOPE.sCountry('secession_country').GetName] is over, and the separatists have won it."
 ca_fvs_falls_assembly_desc:0 "The Assembly of [SCOPE.sCountry('secession_country').GetName] has voted to assume full sovereignty. The federal government has no one left there to obey it."
 ca_fvs_falls_revolt_desc:0 "The revolt in [SCOPE.sCountry('secession_country').GetName] has brought down the liberal government. Its new leaders want nothing to do with the Federation."
 ca_central_america.79.t:0 "The Decree of May 30, 1838"
 ca_central_america.79.d:0 "Unable to keep order, the Federal Congress is debating a decree that would allow the States to organize themselves as they see fit. In practice it would open the door for every State to leave the Federation."
 ca_central_america.79.d_centralist:0 "The federal Congress has become the last refuge of those who want to dismantle the Republic. The government is ready to dissolve it and rule without it."
 ca_central_america.79.f:0 "The law itself now dismantles the law."
 ca_central_america.79.a:0 "Allow the States to organize themselves as they wish."
 ca_central_america.79.b:0 "The Republic is one and indivisible!"
 ca_central_america.79.c:0 "This Union is dead. Let us find our own path."
