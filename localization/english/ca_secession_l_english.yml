 ca_central_america.64.t:0 "Armed Uprising in Nicaragua"
 ca_central_america.64.d:0 "Nicaragua has taken up arms to win its independence from the Federation. Its militias are marching and its leaders have called on the people to defend the sovereignty of the State."
 ca_central_america.64.f:0 "Open war."
 ca_central_america.64.a:0 "Crush the uprising."
 ca_central_america.64.b:0 "Let them go."
 ca_central_america.64.c:0 "Negotiate."
