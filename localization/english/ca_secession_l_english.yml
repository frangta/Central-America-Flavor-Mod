 ca_central_america.armed_war_tt:0 "[SCOPE.sCountry('secession_country').GetName] will fight a #bold war of independence#! against the Federation.\nIf we win, it stays in the Union (with #bold Rebel#! loyalty, or annexed on the centralist path). If it wins, it is independent."
 ca_central_america.50.t:0 "Federalists Prevail in El Salvador"
 ca_central_america.50.d:0 "The federalists have won the struggle inside El Salvador. The separatists have lost their hold on the government, and the State once again looks to the Union."
 ca_central_america.50.f:0 "The Union still has friends."
 ca_central_america.50.a:0 "Reincorporate it as a federal province."
 ca_central_america.50.b:0 "Keep it as a member State."
 ca_central_america.51.t:0 "El Salvador Falls to the Separatists"
 ca_central_america.51.d:0 "The separatists have won the struggle inside El Salvador. The State still belongs to the Federation in name only."
 ca_central_america.51.f:0 "Another star falls from the flag."
 ca_central_america.51.a:0 "Accept it."
 ca_central_america.51.b:0 "Prepare the reconquest."
