 ca_button_sabotage_role_tt:0 "The State now #bold supports the separatists#!."
 ca_button_centralist_coup_tt:0 "The centralists are ready to #bold seize power#! in the State."
 ca_autonomy_granted:0 "Autonomy Granted"
 ca_autonomy_granted_desc:0 "The federal government has granted this State greater autonomy to keep it in the Union."
 ca_secession_concessions:0 "Concessions to the State"
 ca_secession_concessions_desc:0 "The Federation has negotiated the end of the uprising in exchange for concessions."
 ca_secession_consolidated:0 "Separation Consolidated"
 ca_secession_consolidated_desc:0 "The new government has consolidated its separation from the Federation."
