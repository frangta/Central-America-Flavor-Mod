l_english:
 # CAFM - F6 - Secesion, facciones y diarios del estado
 ca_central_america.18.t:0 "Separatism in Costa Rica"
 ca_central_america.18.d:0 "In San José, Head of State Braulio Carrillo no longer hides his contempt for a federal government that is far away, poor and always at war. The coffee growers of the Central Valley want to trade with the world on their own terms, and the State Assembly is preparing to declare that Costa Rica will govern itself."
 ca_central_america.18.d2:0 "The government of Costa Rica faces a separatist movement that has gained the support of the coffee growers and of much of the Assembly. If we follow it, Costa Rica will declare itself an autonomous State, still bound to the Federation only by name."
 ca_central_america.18.f:0 "Far from Guatemala, close to prosperity."
 ca_central_america.18.a:0 "Recognize the autonomy of Costa Rica."
 ca_central_america.18.b:0 "Negotiate concessions."
 ca_central_america.18.c:0 "Use a firm hand."
 ca_central_america.18.v2a:0 "Follow the movement: Costa Rica will govern itself."
 ca_central_america.18.v2b:0 "Contain the separatists."
 ca_central_america.18.v2c:0 "Ask the Federation to intervene."
 ca_central_america.19.t:0 "Separatism in Nicaragua"
 ca_central_america.19.d:0 "The eternal disputes between León and Granada have found, for once, a common enemy: the federal government. The Constituent Assembly of Nicaragua is debating whether the State should assume full sovereignty and leave a Federation that brings it nothing but taxes and conscription."
 ca_central_america.19.d2:0 "The Constituent Assembly debates whether Nicaragua should assume full sovereignty. León and Granada, for once, agree on something: the Federation has failed them."
 ca_central_america.19.f:0 "Neither León nor Granada will obey Guatemala."
 ca_central_america.19.a:0 "Recognize the autonomy of Nicaragua."
 ca_central_america.19.b:0 "Negotiate concessions."
 ca_central_america.19.c:0 "Use a firm hand."
 ca_central_america.19.v2a:0 "Follow the movement: Nicaragua will govern itself."
 ca_central_america.19.v2b:0 "Contain the separatists."
 ca_central_america.19.v2c:0 "Ask the Federation to intervene."
 ca_central_america.20.t:0 "Separatism in Guatemala"
 ca_central_america.20.d:0 "The conservative elite of Guatemala, the clergy and the peasant armies of Rafael Carrera have brought down the liberal order. In Guatemala City the Aycinena clan openly speaks of a State that no longer answers to the federal government."
 ca_central_america.20.d2:0 "The conservatives of Guatemala, backed by Carrera's peasant army, want the State to break with the federal government and its liberal reforms."
 ca_central_america.20.f:0 "Guatemala can live without the Federation."
 ca_central_america.20.a:0 "Recognize the autonomy of Guatemala."
 ca_central_america.20.b:0 "Negotiate concessions."
 ca_central_america.20.c:0 "Use a firm hand."
 ca_central_america.20.v2a:0 "Follow the movement: Guatemala will govern itself."
 ca_central_america.20.v2b:0 "Contain the separatists."
 ca_central_america.20.v2c:0 "Ask the Federation to intervene."
 ca_central_america.21.t:0 "Separatism in Honduras"
 ca_central_america.21.d:0 "Even in Morazán's homeland the discontent grows. The Honduran Assembly in Comayagua complains of a war it did not choose and of a federal government that takes its men and its silver. Many deputies now speak of an independent Honduras."
 ca_central_america.21.d2:0 "The Assembly in Comayagua is ready to declare that Honduras will govern itself. Even the homeland of Morazán is tired of the Federation's wars."
 ca_central_america.21.f:0 "Honduras shall not be the battlefield of others."
 ca_central_america.21.a:0 "Recognize the autonomy of Honduras."
 ca_central_america.21.b:0 "Negotiate concessions."
 ca_central_america.21.c:0 "Use a firm hand."
 ca_central_america.21.v2a:0 "Follow the movement: Honduras will govern itself."
 ca_central_america.21.v2b:0 "Contain the separatists."
 ca_central_america.21.v2c:0 "Ask the Federation to intervene."
 ca_central_america.22.t:0 "Separatism in El Salvador"
 ca_central_america.22.d:0 "San Salvador has been the heart of the Federation, but the Federation is dying. With the other States gone, the Salvadoran notables wonder why they should carry the weight of a Republic that no longer exists anywhere else."
 ca_central_america.22.d2:0 "The notables of San Salvador argue that El Salvador cannot carry alone the weight of a Federation that no longer exists anywhere else."
 ca_central_america.22.f:0 "The heart of the Federation is sick."
 ca_central_america.22.a:0 "Recognize the autonomy of El Salvador."
 ca_central_america.22.b:0 "Negotiate concessions."
 ca_central_america.22.c:0 "Use a firm hand."
 ca_central_america.22.v2a:0 "Follow the movement: El Salvador will govern itself."
 ca_central_america.22.v2b:0 "Contain the separatists."
 ca_central_america.22.v2c:0 "Ask the Federation to intervene."
 ca_central_america.23.t:0 "The Question of Los Altos"
 ca_central_america.23.d2:0 "The liberals of Quetzaltenango no longer trust the Federation to protect the Sixth State from Guatemala. Some want to break away and stand alone; others still hope federal troops will come."
 ca_central_america.23.f:0 "The highlands look after themselves."
 ca_central_america.23.v2a:0 "Follow the movement: Los Altos will govern itself."
 ca_central_america.23.v2b:0 "Contain the separatists."
 ca_central_america.23.v2c:0 "Ask the Federation to intervene."
 ca_central_america.24.t:0 "Opposition to Secession"
 ca_central_america.24.d:0 "Unionists and radical liberals have taken to the streets of [SCOPE.sCountry('secession_country').GetName], protesting against the separation from the Federation. Their leaders demand that the State return to the Union."
 ca_central_america.24.f:0 ""Long live the Federation!""
 ca_central_america.24.a:0 "Support the demonstrators."
 ca_central_america.24.b:0 "Call for calm and order."
 ca_central_america.24.c:0 "Repress the unionists."
 ca_central_america.24.e:0 "Negotiate with them."
 ca_central_america.25.t:0 "Acceptance of Secession"
 ca_central_america.25.d:0 "In [SCOPE.sCountry('secession_country').GetName] the separation has been received with relief more than anger. War weariness is everywhere, and many now see the State's own government as the only one able to keep the peace."
 ca_central_america.25.f:0 "It is time to let them go."
 ca_central_america.25.a:0 "It is the will of the people."
 ca_central_america.25.b:0 "It is cowardly treason."
 ca_central_america.25.c:0 "Consolidate the separation."
 ca_central_america.25.e:0 "Offer the Federation a pact of friendship."
 ca_central_america.45.t:0 "Independence of Costa Rica"
 ca_central_america.45.d:0 "On November 15, 1838, the Assembly of Costa Rica has declared that the State is free, sovereign and independent, and will no longer send deputies to the federal Congress."
 ca_central_america.45.f:0 "A solitary path."
 ca_central_america.45.d_petition:0 "The government of Costa Rica has formally asked the Federation to recognize its full sovereignty. Its envoys insist that they want peace with their neighbours, but they will no longer obey the federal government."
 ca_central_america.45.a:0 "Recognize the independence of Costa Rica."
 ca_central_america.45.b:0 "Refuse: Costa Rica belongs to the Union."
 ca_central_america.46.t:0 "Independence of Nicaragua"
 ca_central_america.46.d:0 "On April 30, 1838, the Constituent Assembly of Nicaragua has declared that the State is free, sovereign and independent of the Federation."
 ca_central_america.46.f:0 "The rupture begins."
 ca_central_america.46.d_petition:0 "The government of Nicaragua has formally asked the Federation to recognize its full sovereignty. Its envoys insist that they want peace with their neighbours, but they will no longer obey the federal government."
 ca_central_america.46.a:0 "Recognize the independence of Nicaragua."
 ca_central_america.46.b:0 "Refuse: Nicaragua belongs to the Union."
 ca_central_america.47.t:0 "Independence of Guatemala"
 ca_central_america.47.d:0 "On April 17, 1839, with Rafael Carrera in control of the capital, Guatemala has declared that it is a free and independent State, and has repealed the federal laws."
 ca_central_america.47.f:0 "The giant awakes."
 ca_central_america.47.d_petition:0 "The government of Guatemala has formally asked the Federation to recognize its full sovereignty. Its envoys insist that they want peace with their neighbours, but they will no longer obey the federal government."
 ca_central_america.47.a:0 "Recognize the independence of Guatemala."
 ca_central_america.47.b:0 "Refuse: Guatemala belongs to the Union."
 ca_central_america.48.t:0 "Independence of Honduras"
 ca_central_america.48.d:0 "On October 26, 1838, the Assembly in Comayagua has declared that Honduras is a free, sovereign and independent State."
 ca_central_america.48.f:0 "Even Morazán's homeland leaves."
 ca_central_america.48.d_petition:0 "The government of Honduras has formally asked the Federation to recognize its full sovereignty. Its envoys insist that they want peace with their neighbours, but they will no longer obey the federal government."
 ca_central_america.48.a:0 "Recognize the independence of Honduras."
 ca_central_america.48.b:0 "Refuse: Honduras belongs to the Union."
 ca_central_america.99.t:0 "Independence of El Salvador"
 ca_central_america.99.d:0 "On January 30, 1841, the Constituent Assembly of El Salvador has declared the State free and independent. The last stronghold of the Federation is gone."
 ca_central_america.99.f:0 "The heart stops beating."
 ca_central_america.99.d_petition:0 "The government of El Salvador has formally asked the Federation to recognize its full sovereignty. Its envoys insist that they want peace with their neighbours, but they will no longer obey the federal government."
 ca_central_america.99.a:0 "Recognize the independence of El Salvador."
 ca_central_america.99.b:0 "Refuse: El Salvador belongs to the Union."
 ca_central_america.26.t:0 "Costa Rica: The Question of Independence"
 ca_central_america.26.d:0 "The separatists have won the struggle inside Costa Rica. The State still belongs to the Federation in name, but its government no longer obeys it. The time has come to decide how to leave."
 ca_central_america.26.d_denied:0 "The federal government has refused to recognize the independence of Costa Rica. Our leaders must now choose between submitting to the Union or taking up arms."
 ca_central_america.26.f:0 "A goodbye, with or without gunshots."
 ca_central_america.26.a:0 "Declare independence peacefully."
 ca_central_america.26.b:0 "Declare independence in arms."
 ca_central_america.26.c:0 "Wait for a better moment."
 ca_central_america.26.d_opt:0 "Submit to the Union."
