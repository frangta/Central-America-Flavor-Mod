l_english:
 # CAFM — Nicaragua, Fase 1: El polvorín de Zepeda (1836–1837)
 # ca_nicaragua_events.2.* ya existe en ca_events_flavor_1_l_english.yml y se reutiliza.

 ca_Mendez:0 "Méndez"

 ca_nicaragua_events.1.c:0 "Play as Nicaragua."

 ca_nicaragua_events.6.t:0 "The Audacity of José Zepeda"
 ca_nicaragua_events.6.d:0 "Head of State José Zepeda will not govern a state of caudillos and private armies. From León he lays out a programme that no Nicaraguan government has dared before: trial by jury, a Court of Accounts to audit the treasury, the reopening of the universities of León and Granada, a ban on carrying firearms, and a requirement that priests complete university studies before ordination. The liberals of León cheer. In Granada, the old families read the decrees as an attack on everything the colony left them."
 ca_nicaragua_events.6.f:0 "A state of laws, or a state of barracks."
 ca_nicaragua_events.6.a:0 "Modernity does not wait."
 ca_nicaragua_events.6.b:0 "Water down the reforms and make peace with Granada."

 ca_nicaragua_events.7.t:0 "The Penal Code and the Jury"
 ca_nicaragua_events.7.d:0 "Zepeda's jurists have finished a new Penal Code to replace the tangle of colonial ordinances, together with rules for criminal procedure and trial by jury. Officers who have answered only to their own commanders would now answer to civil judges. The draft awaits the Head of State's signature."
 ca_nicaragua_events.7.f:0 "The law reaches the barracks."
 ca_nicaragua_events.7.a:0 "Sign the code."
 ca_nicaragua_events.7.b:0 "Shelve it for calmer times."

 ca_nicaragua_events.9.t:0 "El Telégrafo Nicaragüense"
 ca_nicaragua_events.9.d:0 "The government has founded an official newspaper, El Telégrafo Nicaragüense, and León's printers want more: a free press, pamphlets and broadsheets without prior censorship. Every ministerial decree will now be read, praised and mocked in the cafés of León and the halls of Granada alike."
 ca_nicaragua_events.9.f:0 "Ink travels faster than troops."
 ca_nicaragua_events.9.a:0 "Let the presses run free."
 ca_nicaragua_events.9.b:0 "The official paper is enough."

 ca_nicaragua_events.10.t:0 "Discontent in Granada"
 ca_nicaragua_events.10.d:0 "Letters intercepted on the road from Granada speak of officers who meet after dark, of merchants who refuse to pay the new contributions, and of a toast raised 'to the day León has a different master'. Nothing yet amounts to a crime, but the government's informants are worried."
 ca_nicaragua_events.10.f:0 "Granada never forgets."
 ca_nicaragua_events.10.a:0 "Arrest the suspects."
 ca_nicaragua_events.10.b:0 "Buy their loyalty."
 ca_nicaragua_events.10.c:0 "May God protect us."

 ca_nicaragua_events.11.t:0 "The Purge of the Barracks"
 ca_nicaragua_events.11.d:0 "Arming Quijano's expedition against Guanacaste has cost the army men, money and pride, and the officers who supplied it now blame the government that let it march. Zepeda is convinced that the conservative officers of the León garrison are plotting against him and proposes to dismiss them all at once."
 ca_nicaragua_events.11.f:0 "A garrison that has been humiliated looks for someone to blame."
 ca_nicaragua_events.11.a:0 "Purge the conservative officers."
 ca_nicaragua_events.11.b:0 "Step back. Not now."

 ca_nicaragua_events.12.t:0 "Rumours in the Shadows"
 ca_nicaragua_events.12.d:0 "The names repeat in every report: Colonel Bernardo Méndez, 'el Pavo', and the physician Casto Fonseca. Both are seen too often at the León barracks. A prisoner in the city jail boasts that he will soon be free. The Head of State's friends beg him to act before it is too late."
 ca_nicaragua_events.12.f:0 "Everyone knows. No one can prove it."
 ca_nicaragua_events.12.a:0 "Mass arrests, tonight."
 ca_nicaragua_events.12.b:0 "Pay the garrison whatever it asks."
 ca_nicaragua_events.12.c:0 "May God protect us."

 ca_nicaragua_events.13.t:0 "The Night of the Barracks"
 ca_nicaragua_events.13.d_triunfa:0 "On the night of 25 January, Colonel Bernardo Méndez and Casto Fonseca seize the León barracks. They free the prisoner Braulio Mendiola and send him with armed men to arrest the Head of State. José Zepeda and Colonel Román Valladares are dragged from their homes and killed. By morning there is no government in León, only the barracks."
 ca_nicaragua_events.13.d_fracasa:0 "On the night of 25 January, Colonel Bernardo Méndez and Casto Fonseca seize the León barracks and free the prisoner Braulio Mendiola to arrest the Head of State. But Zepeda's guard holds the door. Wounded, the Head of State survives; Mendiola falls in the street, and by dawn the plotters are fleeing the city. León wakes to find its government alive."
 ca_nicaragua_events.13.f:0 "25 January 1837."
 ca_nicaragua_events.13.a:0 "To arms!"
 nic_golpe_triunfa_tt:0 "#N José Zepeda is killed.#! The barracks take power and the conspiracy succeeds."
 nic_golpe_fracasa_tt:0 "#P José Zepeda survives.#! The landowners are disgraced and Nicaragua gains a period of institutional peace."

 ca_nicaragua_events.14.t:0 "The Power Vacuum"
 ca_nicaragua_events.14.d:0 "José Núñez assumes the office of Head of State to complete Zepeda's term. He does not punish the officers who rose. Instead, on 26 January, he names Bernardo Méndez Commander General of Arms. The jury, the codes and the free press remain on paper; in practice Nicaragua is governed from the barracks, and with Zepeda dies the last strong voice for the Union in León."
 ca_nicaragua_events.14.f:0 "The sword governs; the pen signs."
 ca_nicaragua_events.14.a:0 "Núñez takes office."

 nic_conspiracy_up_15_tt:0 "The #N Barracks Conspiracy#! grows by #N 15#!."
 nic_conspiracy_down_20_tt:0 "The #P Barracks Conspiracy#! falls by #P 20#!."
 nic_conspiracy_to_100_tt:0 "The #N Barracks Conspiracy#! reaches #N 100#!: the coup breaks out."

 je_ca_nic_conspiracy:0 "The Barracks Conspiracy"
 je_ca_nic_conspiracy_reason:0 "Zepeda's reforms have made enemies in Granada and in the León garrison. If the conspiracy reaches #N 100#!, the barracks will rise. Reforms, failed adventures and discontented officers feed it; arrests and money can buy time."
 je_ca_nic_conspiracy_status_baja:0 "Murmurs in the garrison. For now, the Head of State's authority holds."
 je_ca_nic_conspiracy_status_alta:0 "Officers meet at night. Granada's merchants refuse to pay."
 je_ca_nic_conspiracy_status_critica:0 "Méndez and Fonseca are ready. The coup is a matter of weeks."

 nic_gobierno_desde_leon:0 "Governing from León"
 nic_gobierno_desde_leon_desc:0 "Zepeda governs from León and keeps the caudillos at arm's length."
 nic_tutela_federal:0 "Federal Tutelage"
 nic_tutela_federal_desc:0 "Nicaragua has asked the Federation to restore order within its borders."
 nic_agitacion_aristocratica:0 "Aristocratic Agitation"
 nic_agitacion_aristocratica_desc:0 "Granada's old families refuse to pay and conspire against León."
 nic_reformas_zepeda:0 "Zepeda's Reforms"
 nic_reformas_zepeda_desc:0 "Jury trials, a Court of Accounts and reopened universities."
 nic_pacto_granadino:0 "The Granadan Pact"
 nic_pacto_granadino_desc:0 "Reforms have been diluted to keep Granada quiet."
 nic_codigo_penal:0 "The Penal Code"
 nic_codigo_penal_desc:0 "A modern penal code and trial by jury replace colonial ordinances."
 nic_codigo_engavetado:0 "Shelved Code"
 nic_codigo_engavetado_desc:0 "The new penal code gathers dust in a ministry drawer."
 nic_telegrafo_libre:0 "A Free Press"
 nic_telegrafo_libre_desc:0 "El Telégrafo Nicaragüense and León's printers publish without prior censorship."
 nic_censura_parcial:0 "Partial Censorship"
 nic_censura_parcial_desc:0 "Only the official newspaper prints without a censor's approval."
 nic_arrestos_preventivos:0 "Preventive Arrests"
 nic_arrestos_preventivos_desc:0 "Suspected conspirators fill the jails of León."
 nic_arrestos_masivos:0 "Mass Arrests"
 nic_arrestos_masivos_desc:0 "Night raids against officers and Granadan notables."
 nic_purga_cuartel:0 "Purged Garrison"
 nic_purga_cuartel_desc:0 "Conservative officers have been dismissed en masse."
 nic_purga_retroceso:0 "A Weak Head of State"
 nic_purga_retroceso_desc:0 "Zepeda backed down before his own officers."
 nic_heroe_nacional:0 "National Hero"
 nic_heroe_nacional_desc:0 "Survived the Night of the Barracks of 25 January 1837."
 nic_paz_institucional:0 "Institutional Peace"
 nic_paz_institucional_desc:0 "The failed coup has rallied Nicaragua around its civil government."
 nic_terratenientes_en_desgracia:0 "Landowners in Disgrace"
 nic_terratenientes_en_desgracia_desc:0 "Their part in the failed coup has discredited the Granadan elite."
 nic_cuartel_al_poder:0 "The Barracks in Power"
 nic_cuartel_al_poder_desc:0 "Méndez and Fonseca govern Nicaragua from the León barracks."
