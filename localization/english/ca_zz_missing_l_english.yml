l_english:
 # CAFM F27: localizacion que faltaba (tipos de gobierno, textos del menu de inicio de los diarios, condiciones del diario de la UCA)
 gov_ca_uca_republic:0 "Federal Republic"
 gov_ca_uca_republic_desc:0 "The Federal Republic of Central America: five States bound by the Constitution of 1824. A Federal President and Congress govern from the capital, while each State keeps its own Head of State and assembly."
 gov_ca_talamanca_cacique:0 "Talamanca Chiefdom"
 gov_ca_talamanca_cacique_desc:0 "The Bribri and Cabécar peoples of Talamanca follow their own hereditary cacique, who rules the mountain valleys beyond the reach of the Federation."
 gov_ca_jefe_estado_desc:0 "A member State of the Federation, governed by an elected Head of State under its own constitution while it remains bound to the federal pact."
 gov_ca_director_supremo_desc:0 "A State that has left the Federation, governed by a Supreme Director elected for a short term, as Nicaragua and Honduras were after 1838."
 gov_ca_jefe_supremo_desc:0 "A caudillo has made himself master of the State and rules for life, above the constitution."
 gov_ca_junta_desc:0 "After a barracks revolt, the officers govern the country directly."
 gov_ca_republica_bananera_desc:0 "A republic whose government answers to the foreign fruit companies that own the railways, the ports and the plantations."
 gov_ca_republica_cafetalera_desc:0 "A republic run by and for the coffee-growing families who control the land, the credit and the export trade."
 gov_ca_presidential_oligarchy_desc:0 "A presidential republic in which only the wealthy and the propertied may vote."
 gov_ca_presidential_democracy_desc:0 "A presidential republic elected by a broad popular suffrage."
 gov_ca_cos_confederacion_desc:0 "Costa Rica leads a confederation of the southern States of the isthmus under its own President."
 gov_ca_cos_ciudad_liga_desc:0 "Since the War of the League, the cities of the Central Valley govern themselves, each under its own Political Chief."
 gov_ca_cos_reino_desc:0 "Costa Rica has crowned its own monarch."
 gov_ca_cos_republica_obrera_desc:0 "A republic governed by councils of workers and peasants."
 gov_ca_cos_jefatura_morazan_desc:0 "Francisco Morazán governs Costa Rica as provisional Head of State while he prepares the restoration of the Federation."
 gov_ca_cos_jefatura_vitalicia_desc:0 "The Decree of Bases and Guarantees has made Braulio Carrillo Head of State for life."
 gov_ca_cos_primera_republica_desc:0 "Costa Rica has proclaimed itself a sovereign republic, outside the old Federation."
 gov_ca_cos_estado_1844_desc:0 "The Constitution of 1844 governs Costa Rica, with direct elections and a separation of powers."
 gov_ca_cos_republica_olimpo_desc:0 "The liberal intellectuals of the Olympus generation govern the republic in the name of order and progress."
 gov_ca_cos_cuarteles_desc:0 "The barracks of San José make and unmake presidents."
 je_frca_bar_threshold_a_tt:0 "#bold Support for the Federation#! is at least #bold 120#!"
 je_frca_bar_threshold_b_tt:0 "#bold Support for the Federation#! is at least #bold 80#!"
 je_frca_route_federal_tt:0 "The Federation follows the #bold federal path#!"
 ca_fvs_bar_display_name:0 "Federalists against Separatists"
 ca_fvs_bar_display_desc:0 "At #bold 100#! the federalists win the struggle; at #bold 0#!, the separatists."
 je_ca_fvs_result_beats_tt:0 "The struggle has been settled in favour of the #bold federalists#!"
 je_ca_fvs_result_falls_tt:0 "The struggle has been settled in favour of the #bold separatists#!"
