 ca_costa_rica_events.9.t:0 "The Jiménez Report"
 ca_costa_rica_events.9.d:0 "10 September 1836. Lieutenant Rafael Jiménez, the commander Carrillo sent to the garrison of Guanacaste, has delivered his report. It levels grave accusations against the men who turned against the government on 29 June and names those who waited for Quijano. What San José does with this list will decide whether Guanacaste stays loyal."
