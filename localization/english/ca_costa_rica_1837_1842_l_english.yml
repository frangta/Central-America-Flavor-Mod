l_english:
 # =========================================================================
 # CAFM - Costa Rica 1837-1850: new events, modifiers and names
 # Sources: TSE (2008); Villegas Arce, Rev. Ciencias Juridicas (UCR) 131 (2013);
 # Archivo Nacional de Costa Rica; Leiva, Cultura (1942)
 # =========================================================================
 
 ca_costa_rica_events.40.t:0 "The Insulted Commissioner"
 ca_costa_rica_events.40.d:0 "May 1836. Intendant Joaquín Rivas, sent as our commissioner to the Nicaraguan head of state José Zepeda, has come home humiliated: in the town of Nicaragua he was insulted and threatened. Meanwhile Manuel Quijano, the officer Carrillo exiled for plotting with the League, moves freely between León and Masaya among the League's exiles, promising to raise men against San José."
 ca_costa_rica_events.40.f:0 "In León they no longer talk about exiles. They talk about an army."
 ca_costa_rica_events.40.a:0 "Demand an explanation from Zepeda."
 ca_costa_rica_events.40.b:0 "Reinforce the northern border."
 ca_costa_rica_events.40.c:0 "Ask the Federation to call León to order."

 ca_costa_rica_events.41.t:0 "The League Returns to the Flag"
 ca_costa_rica_events.41.d:0 "24 June 1836. A courier brings word of the invasion, and the next day Quijano opens the mail bound for Costa Rica at La Flor. Carrillo convenes the Assembly, which grants him extraordinary powers on 27 June. Eight hundred men march north under Colonel Vicente Villaseñor, and many former leaders of the League come forward as volunteers. Nicolás Ulloa alone donates 1,500 pesos."
 ca_costa_rica_events.41.f:0 "Last year they fought San José. Today they march for it."
 ca_costa_rica_events.41.a:0 "Extraordinary powers, and a pardon for the League."
 ca_costa_rica_events.41.b:0 "Send Villaseñor, but pardon no one."
 ca_costa_rica_events.41.c:0 "Wait for clearer news."

 ca_costa_rica_events.61.t:0 "The Second Assault"
 ca_costa_rica_events.61.d:0 "8 July 1836. Quijano has thrown himself at the Villa de Guanacaste a second time and been driven back. Militias from Nicoya and Santa Cruz stood beside the garrison. We took two prisoners, but Juan Rafael Muñoz and the mutineers of 29 June prevented any pursuit of the invader."
 ca_costa_rica_events.61.f:0 "Some defenders fight to win. Others fight so the war does not end."
 ca_costa_rica_events.61.a:0 "Honour the militias of Nicoya and Santa Cruz."
 ca_costa_rica_events.61.b:0 "Arrest the mutineers of 29 June."

 ca_costa_rica_events.71.t:0 "Sapoá"
 ca_costa_rica_events.71.d:0 "24 July 1836. Adjutant Joaquín Alvarado has surprised Quijano at the hacienda of Sapoá. The invader fled across the border, abandoning his supplies, his papers and three prisoners. Among the traitors in our hands are the officer Joaquín Jiménez of Cartago and José de Jesús Banegas, captured in the second assault."
 ca_costa_rica_events.71.f:0 "The papers Quijano left behind name more people than he ever brought with him."
 ca_costa_rica_events.71.a:0 "Let them face the firing squad."
 ca_costa_rica_events.71.b:0 "Commute their sentences."
 ca_costa_rica_events.71.c:0 "Pursue Quijano into Nicaragua."

 ca_cos_purga_del_norte:0 "Purge of the North"
 ca_cos_purga_del_norte_desc:0 "The executions in Guanacaste have shown what happens to those who conspire with León."
 ca_costa_rica_events.192.t:0 "Aguilar in Heredia"
 ca_costa_rica_events.192.d:0 "17 April 1837. Manuel Aguilar Chacón and his vice head of state, Juan Mora Fernández, have taken office in Heredia. The new Head of State brings a programme of reconciliation: an amnesty for the exiles of the League, the end of the military fuero, and a capital shared between Heredia, seat of the legislature, and San José, seat of the executive and the courts."
 ca_costa_rica_events.192.f:0 "A government of jurists, watched by a city of soldiers."
 ca_costa_rica_events.192.a:0 "Amnesty, an end to the fuero, and shared powers."
 ca_costa_rica_events.192.b:0 "Govern with caution and leave the fuero alone."

 ca_costa_rica_events.193.t:0 "The August Conspiracy"
 ca_costa_rica_events.193.d:0 "August 1837. Supporters of Carrillo have been caught planning to overthrow the government. The plot has failed, but San José's barracks have not forgotten who gave them their pay and their pride."
 ca_costa_rica_events.193.f:0 "A failed coup is a rehearsal."
 ca_costa_rica_events.193.a:0 "Dismantle it quietly."
 ca_costa_rica_events.193.b:0 "Punish the Carrillistas as an example."
 ca_costa_rica_events.193.c:0 "Ignore it. It was nothing."

 ca_costa_rica_events.194.t:0 "The Ailing Head of State"
 ca_costa_rica_events.194.d:0 "19 December 1837. Manuel Aguilar has fallen ill, and Vice Head of State Juan Mora Fernández takes charge of the government until February. The former Head of State, who mediated in Guanacaste only a year ago, now holds a state that is divided between the courts and the barracks."
 ca_costa_rica_events.194.f:0 "A sick government is an invitation."
 ca_costa_rica_events.194.a:0 "Mora governs until Aguilar returns."

 ca_costa_rica_events.195.t:0 "The Rejected Resignation"
 ca_costa_rica_events.195.d:0 "March 1838. Exhausted and still unwell, Manuel Aguilar has presented his resignation to the Assembly."
 ca_costa_rica_events.195.f:0 "Some men are kept in office precisely because they want to leave."
 ca_costa_rica_events.195.a:0 "The Assembly will not accept it."
 ca_costa_rica_events.195.b:0 "Accept it. Juan Mora Fernández takes over."

 ca_costa_rica_events.196.t:0 "The Constituent Assembly"
 ca_costa_rica_events.196.d:0 "14 November 1838. The Federal Congress has authorized the states to organize themselves as they see fit, and Nicaragua has already gone its own way. Under Carrillo, the Constituent Assembly of Costa Rica must now decide whether the state remains in a Federation that left it alone in Bocas del Toro."
 ca_costa_rica_events.196.f:0 "A Federation that cannot defend its members has already dissolved itself."
 ca_costa_rica_events.196.a:0 "Costa Rica leaves the Federation."
 ca_costa_rica_events.196.b:0 "Remain, as an autonomous federal state."

 ca_costa_rica_events.197.t:0 "The Conspiracy of Joaquín Mora"
 ca_costa_rica_events.197.d:0 "January 1839. Former provisional Head of State Joaquín Mora Fernández has been accused of conspiring against Carrillo, and even of plotting his murder. The court has sentenced him to death."
 ca_costa_rica_events.197.f:0 "In Carrillo's state, the courts belong to the Architect."
 ca_costa_rica_events.197.a:0 "Commute the sentence to exile."
 ca_costa_rica_events.197.b:0 "Let the sentence be carried out."
 ca_costa_rica_events.197.c:0 "Pardon him."

 ca_costa_rica_events.198.t:0 "The Asylum at Puntarenas"
 ca_costa_rica_events.198.d:0 "April 1840. Defeated in El Salvador, Francisco Morazán has sailed from La Libertad on the schooner Izalco with some thirty veterans. Now the schooner has appeared off Puntarenas, and the fallen President of the Federation asks for asylum."
 ca_costa_rica_events.198.f:0 "The Eagle without his army is still the Eagle."
 ca_costa_rica_events.198.a:0 "Grant him asylum, on condition that he moves on south."
 ca_costa_rica_events.198.b:0 "Refuse him landing."

 ca_costa_rica_events.205.t:0 "The Treaty with the State of the Isthmus"
 ca_costa_rica_events.205.d:0 "22 September 1841. The State of the Isthmus, which has broken away from New Granada, seeks recognition. Its envoys propose a frontier at the Escudo de Veraguas, and Costa Rica could reserve its rights over Bocas del Toro."
 ca_costa_rica_events.205.f:0 "A neighbour who needs us is a neighbour who listens."
 ca_costa_rica_events.205.a:0 "Recognize the Isthmus and reserve our rights over Bocas."
 ca_costa_rica_events.205.b:0 "Demand Bocas del Toro in exchange."
 ca_costa_rica_events.205.c:0 "Do not sign."

 ca_costa_rica_events.321.t:0 "The Annulment of the Bases and Guarantees"
 ca_costa_rica_events.321.d:0 "6 June 1842. Morazán has declared Carrillo's Decree of Bases and Guarantees null and void. The irremovable Chief of State is gone, and the municipalities can return."
 ca_costa_rica_events.321.f:0 "One decree erases another."
 ca_costa_rica_events.321.a:0 "The decree of the dictatorship is void."

 ca_costa_rica_events.322.t:0 "The Levy for the Union"
 ca_costa_rica_events.322.d:0 "July 1842. In Chinandega, El Salvador, Honduras and Nicaragua are discussing a confederation without Morazán. The Eagle answers by raising men and money in Costa Rica to restore the Federation by force. Many fear that Carrera will intervene, and that Costa Rican sons will die for a cause that is not theirs."
 ca_costa_rica_events.322.f:0 "The Union, it seems, will be paid for in Costa Rican coin."
 ca_costa_rica_events.322.a:0 "Raise the levy and the forced loans."
 ca_costa_rica_events.322.b:0 "Moderate the levy."

 ca_costa_rica_events.323.t:0 "The Fundamental Law Restored"
 ca_costa_rica_events.323.d:0 "24 August 1842. The Constituent Assembly has confirmed the annulment of the Bases and Guarantees and restored the Fundamental Law of 1825."
 ca_costa_rica_events.323.f:0 "The old constitution returns, under a new master."
 ca_costa_rica_events.323.a:0 "The law of 1825 is in force again."

 ca_costa_rica_events.341.t:0 "The Pact of El Jocote"
 ca_costa_rica_events.341.d:0 "11 April 1842. At El Jocote, near Alajuela, Villaseñor's army has met Morazán's veterans. The soldiers whisper that the Eagle offers them more than Carrillo ever did."
 ca_costa_rica_events.341.f:0 "Everything depends on the loyalty of one army."
 ca_costa_rica_events.341.a:0 "The Pact of El Jocote: the army goes over to Morazán."
 ca_costa_rica_events.341.b:0 "Villaseñor holds firm. The invader is repelled."

 ca_costa_rica_events.351.t:0 "The Election of Alfaro"
 ca_costa_rica_events.351.d:0 "27 September 1842. António Pinto Soares, who led the revolt against Morazán, has handed over power after sixteen days. José María Alfaro Zamora has been elected Head of State, and Costa Rica restores its relations with the rest of Central America."
 ca_costa_rica_events.351.f:0 "A Portuguese soldier saved the state, and gave it back."
 ca_costa_rica_events.351.a:0 "Long live Head of State Alfaro."

 # --- Modifiers ---
 ca_cos_ciudad_heroica:0 "Heroic City"
 ca_cos_ciudad_heroica_desc:0 "The Assembly has rewarded Guanacaste for repelling Quijano."
 ca_cos_reconciliacion_1837:0 "The Reconciliation of 1837"
 ca_cos_reconciliacion_1837_desc:0 "Aguilar's government seeks to heal the wounds of the War of the League."
 ca_cos_censura_panfletos:0 "Burned Pamphlets"
 ca_cos_censura_panfletos_desc:0 "Hunting down Morazán's manifesto keeps the authorities busy."
 ca_cos_estabilidad_carrillista:0 "A Consolidated State"
 ca_cos_estabilidad_carrillista_desc:0 "The institutions of San José have survived the storms of the 1830s."

 # --- Names ---
 Villasenor:0 "Villaseñor"

 # --- Existing modifiers that had no localization in the repo ---
 ca_cos_prestige_gain:0 "National Prestige"
 ca_cos_prestige_gain_desc:0 "Recent successes have raised the standing of the state."
 ca_cos_prestige_gain_small:0 "A Small Triumph"
 ca_cos_prestige_gain_small_desc:0 "A modest success has raised the standing of the state."
 ca_cos_prestige_loss:0 "National Humiliation"
 ca_cos_prestige_loss_desc:0 "A recent humiliation has damaged the standing of the state."
 ca_cos_prestige_loss_small:0 "A Small Setback"
 ca_cos_prestige_loss_small_desc:0 "A minor setback has damaged the standing of the state."
 ca_cos_ig_suppressed:0 "Suppressed by the Government"
 ca_cos_ig_suppressed_desc:0 "The government has curtailed the influence of this group."
 ca_cos_education_reform:0 "Educational Reform"
 ca_cos_education_reform_desc:0 "New schools and a new university are shaping a generation."
 
 # CAFM - Costa Rica 1842-1850: new events, modifier and names
 # Sources: TSE (2008); Corella Ovares, Revista de Historia (UNA) 80 (2019)

 ca_costa_rica_events.221.t:0 "The Head of State Who Would Not Govern"
 ca_costa_rica_events.221.d:0 "December 1844. Francisco María Oreamuno took office on 21 November, and within weeks he resigned. The Assembly refused to accept it, so he simply returned to his estates in Cartago. Rafael Moya governs ad interim, and the factions are already looking for a successor."
 ca_costa_rica_events.221.f:0 "Some men want the title, but not the office."
 ca_costa_rica_events.221.a:0 "Let José Rafael de Gallegos take the government."
 ca_costa_rica_events.221.b:0 "Oreamuno must return to San José and govern."
 ca_costa_rica_events.222.t:0 "Death in Sociedad"
 ca_costa_rica_events.222.d:0 "May 1845. News arrives from El Salvador: Braulio Carrillo has been murdered in the town of Sociedad. Captain Domingo Lagos, with whom he had quarrelled over a mine, came looking for him with soldiers, and Carrillo was shot without trial. The Architect of the State is dead in a foreign land."
 ca_costa_rica_events.222.f:0 "He built a state, and died without one."
 ca_costa_rica_events.222.a:0 "Official silence."
 ca_costa_rica_events.222.b:0 "Honour the Architect of the State."
 ca_costa_rica_events.223.t:0 "The Fall of Gallegos"
 ca_costa_rica_events.223.d:0 "7 June 1846. The barracks have risen against the government of José Rafael de Gallegos. José María Alfaro has been proclaimed provisional Head of State once again, and he promises a new constitution."
 ca_costa_rica_events.223.f:0 "In Costa Rica, the generals vote too."
 ca_costa_rica_events.223.a:0 "Alfaro, provisional Head of State."
 ca_costa_rica_events.223.b:0 "The legal government will hold."
 ca_costa_rica_events.224.t:0 "The Constitution of 1847"
 ca_costa_rica_events.224.d:0 "January 1847. Alfaro has issued a new constitution. Puntarenas is a free port, the road to the Pacific is moving forward, and the electors are getting ready to choose a new president."
 ca_costa_rica_events.224.f:0 "Three constitutions in five years."
 ca_costa_rica_events.224.a:0 "Swear the new constitution."
 ca_costa_rica_events.224.b:0 "Postpone it."
 ca_costa_rica_events.231.t:0 "The Republic of Costa Rica"
 ca_costa_rica_events.231.d:0 "31 August 1848. President Castro Madriz has decreed what everyone already knew: the Federation is dead, and Costa Rica is a sovereign republic. The State of Costa Rica is now the Republic of Costa Rica."
 ca_costa_rica_events.231.f:0 "The last tie to the Union is cut."
 ca_costa_rica_events.231.a:0 "Long live the Republic!"
 ca_costa_rica_events.231.b:0 "Remain a State, in case the Union is reborn."
 ca_costa_rica_events.232.t:0 "The Flag of Pacífica Fernández"
 ca_costa_rica_events.232.d:0 "September 1848. The new Republic has new symbols. The President's wife, Pacífica Fernández, has designed a flag that adds a red stripe to the blue and white of the Federation, inspired by the ideals of the French Revolution."
 ca_costa_rica_events.232.f:0 "Blue, white and now red."
 ca_costa_rica_events.232.a:0 "Raise the new flag."
 ca_costa_rica_events.233.t:0 "The Reform of 1848"
 ca_costa_rica_events.233.d:0 "November 1848. The constitutional reform has tightened the requirements to vote and to hold office. The coffee growers and merchants are delighted; the artisans of San José are not."
 ca_costa_rica_events.233.f:0 "A republic for those who can pay for it."
 ca_costa_rica_events.233.a:0 "The vote belongs to those with property."
 ca_costa_rica_events.233.b:0 "Open the vote to more property owners."
 ca_costa_rica_events.234.t:0 "The Resignation of Castro"
 ca_costa_rica_events.234.d:0 "15 November 1849. With the treasury in crisis and the coffee elite turning against him, President Castro Madriz has lost the army. General José Manuel Quirós, the same officer who disowned Aguilar in 1838, now refuses to recognize the President."
 ca_costa_rica_events.234.f:0 "The same general, a different president."
 ca_costa_rica_events.234.a:0 "Castro resigns."
 ca_costa_rica_events.234.b:0 "Resist, and send Quirós into exile."
 ca_costa_rica_events.235.t:0 "«We Will Not Be Sold to Ecuador!»"
 ca_costa_rica_events.235.d:0 "4 June 1850. General Manuel Quirós and some fifteen officers, most of them from his own family, planned to seize a barracks and demand the departure of «Señor Flores» and Castro. The rumour they spread was that the government meant to sell our soldiers to the Ecuadorian general Juan José Flores. Barely twenty men answered the call."
 ca_costa_rica_events.235.f:0 "A coup that ends before it begins."
 ca_costa_rica_events.235.a:0 "The plot has failed. Arrest the leaders."
 ca_costa_rica_events.235.b:0 "Deny the rumour and purge the high command."
 ca_cos_cafe_londres:0 "Coffee to London"
 ca_cos_cafe_londres_desc:0 "Costa Rican coffee now sails straight to England."
 Quiros:0 "Quirós"
 Moya_Murillo:0 "Moya Murillo"
  # =========================================================================
 # CAFM - Bocas del Toro (1836-1837): new texts
 # Source: letter of Ildefonso de Paredes, 21 Jan 1837, Revista del
 # Archivo Nacional 3 (1938), pp. 72-73
 # =========================================================================

 ca_costa_rica_events.161.d_defendida:0 "18 December 1836. Ildefonso de Paredes has reached Bocas del Toro with two warships, only to find the Morazán District garrisoned and ready. Filemón Galindo refused to leave. After a tense exchange of notes, the Granadine ships have weighed anchor. New Granada will not forget the affront."
 ca_costa_rica_events.161.b:0 "The district stands. Paredes withdraws."

 ca_costa_rica_events.162.t:0 "The Letter from Paredes"
 ca_costa_rica_events.162.d:0 "21 January 1837. A letter arrives from Bocas del Toro, signed by Ildefonso de Paredes as political chief of the canton for the Republic of New Granada. Bocas del Toro, he writes, «indisputably belongs to New Granada». He asks San José to explain its intentions and to declare whether it recognizes the treaty of 15 March 1825 between Colombia and Central America, which New Granada still considers in force."
 ca_costa_rica_events.162.f:0 "«Libertad y Orden», reads the signature. Neither one for us."
 ca_costa_rica_events.162.a:0 "Take the protest to the Federation."
 ca_costa_rica_events.162.b:0 "Answer him ourselves, without waiting for San Salvador."
 ca_costa_rica_events.162.c:0 "Accept the status quo of the 1825 treaty."

 je_ca_cos_bocas_del_toro_status_defendida:0 "The Morazán District has held. New Granada withdrew, but it has not given up."
 
 ca_costa_rica_events.300.t:0 "The Consolidated State"
 ca_costa_rica_events.300.d_carrillo:0 "The Eagle's shadow has passed, and the Law of Bases and Guarantees stands. Whatever history says of Braulio Carrillo, he has left behind a state that answers to San José alone: roads, courts, coffee and order."
 ca_costa_rica_events.300.d_federal:0 "Against every prediction, Costa Rica has remained within the Federation without falling into anarchy. Its institutions have endured, and San José speaks in the federal congress with a voice of its own."
 ca_costa_rica_events.300.f:0 "The age of the League is over."
 ca_costa_rica_events.300.a:0 "The Architect's work endures."
 ca_costa_rica_events.300.b:0 "A loyal and stable state."

 ca_costa_rica_events.310.t:0 "The League Rises Again"
 ca_costa_rica_events.310.d:0 "San José's authority has collapsed. Cartago has proclaimed its independence and Heredia and Alajuela have followed, just as they did in 1835. Guanacaste no longer answers our messengers. The Free State of Costa Rica is now a handful of quarrelling cities."
 ca_costa_rica_events.310.f:0 "Four cities, four flags."
 ca_costa_rica_events.310.a:0 "San José will reunite Costa Rica."

 ca_costa_rica_events.320.t:0 "The Eagle in San José"
 ca_costa_rica_events.320.d:0 "13 April 1842. Francisco Morazán has entered San José at the head of the very army that was sent to stop him. The Constituent Assembly has named him Supreme Chief. Carrillo will sail from Puntarenas into exile in El Salvador."
 ca_costa_rica_events.320.f:0 "The Federation returns, carried on bayonets."
 ca_costa_rica_events.320.a:0 "Costa Rica submits to the Eagle."

 ca_costa_rica_events.330.t:0 "The Failed Coup"
 ca_costa_rica_events.330.d:0 "27 May 1838. The garrison of San José refused to follow Carrillo. Manuel Aguilar remains Head of State, and the constitutional order has survived its hardest test."
 ca_costa_rica_events.330.f:0 "The law has held."
 ca_costa_rica_events.330.a:0 "The constitution prevails. Carrillo goes into exile."
 ca_costa_rica_events.330.b:0 "Pardon the conspirators to calm the barracks."

 ca_costa_rica_events.340.t:0 "The Landing at Caldera"
 ca_costa_rica_events.340.d:0 "7 April 1842. Morazán has landed at Caldera with his veterans. Carrillo sends General Vicente Villaseñor with four hundred men to meet him."
 ca_costa_rica_events.340.f:0 "Everything depends on the loyalty of one army."
 ca_costa_rica_events.340.a:0 "Villaseñor, march to the coast."
 ca_costa_rica_events.340.b:0 "The Pact of El Jocote: the army goes over to Morazán."

 ca_costa_rica_events.350.t:0 "The September Revolt"
 ca_costa_rica_events.350.d:0 "11 September 1842. San José has risen against Morazán. António Pinto Soares leads some four hundred men against the Eagle's guard of forty. After eighty-eight hours of fighting, Morazán fled toward Cartago, where Pedro Mayorga betrayed him. He has been captured with Villaseñor, Saravia and Cabañas."
 ca_costa_rica_events.350.f:0 "The Eagle falls in San José."
 ca_costa_rica_events.350.a:0 "The firing squad, as on 15 September 1842."
 ca_costa_rica_events.350.b:0 "Exile the Eagle and spare the country a martyr."

 ca_costa_rica_events.360.t:0 "The Pact of Confederation"
 ca_costa_rica_events.360.d:0 "The delegates of San José, Cartago, Heredia and Alajuela have signed a pact among equals. Each city keeps its councils, but all now answer to a single Confederation."
 ca_costa_rica_events.360.f:0 "Costa Rica reborn as a confederation."
 ca_costa_rica_events.360.a:0 "Long live the Confederation of Costa Rica!"

 ca_costa_rica_events.361.t:0 "Unity by Arms"
 ca_costa_rica_events.361.d:0 "The last rebel city has surrendered. Costa Rica is one again, united under San José as Carrillo always intended."
 ca_costa_rica_events.361.f:0 "One state, one capital."
 ca_costa_rica_events.361.a:0 "Never again."

 ca_costa_rica_events.362.t:0 "The Sovereign Cities"
 ca_costa_rica_events.362.d:0 "A decade has passed and the cities of the League have learned to live apart. The dream of a single Costa Rica is fading."
 ca_costa_rica_events.362.f:0 "Some wounds become borders."
 ca_costa_rica_events.362.a:0 "So be it."
