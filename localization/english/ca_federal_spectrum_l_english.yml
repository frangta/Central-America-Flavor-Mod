 # CAFM - barra-espectro del diario "Our Role in the Republic"
 ca_federal_spectrum_bar_name:0 "Centralism – Federalism – Separatism"
 ca_federal_spectrum_bar_desc:0 "Where our State stands inside the Republic.\n\n#b Centralism#! (#v -50#! to #v -17#!): we bow to the federal capital and its unitary order.\n#b Federalism#! (#v -16#! to #v +16#!): we keep the pact of 1824, sovereign at home and loyal to the Union.\n#b Separatism#! (#v +17#! to #v +50#!): we put the sovereignty of our State above the Union."
