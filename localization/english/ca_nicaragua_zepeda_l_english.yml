l_english:
 # =========================================================================
 # CAFM - Zepeda's conditional offer (1836) and Manuel Quijano
 # Source: R. Fernández Guardia, "La guerra de la Liga y la invasión de
 # Quijano", Revista del Archivo Nacional 3 (1939)
 # =========================================================================

 ca_nicaragua_events.8.t:0 "Zepeda's Conditional Offer"
 ca_nicaragua_events.8.d:0 "Spring 1836. Manuel Quijano, the officer Braulio Carrillo exiled from Costa Rica, has come to us with Joaquín Bernardo Calvo and the other exiles of the League. In Masaya they are already planning an invasion of Costa Rica, with the support of local notables. San José, for its part, offers us 1,000 bundles of tobacco if we stop them. Our answer will decide what happens on the southern border, and perhaps the fate of Guanacaste, which San José took from us in 1824."
 ca_nicaragua_events.8.f:0 "In León, Guanacaste is still spoken of as ours."
 ca_nicaragua_events.8.a:0 "Let them recruit, as long as they do not compromise us. If Guanacaste declares for Nicaragua, it will have 500 men."
 ca_nicaragua_events.8.b:0 "Arm Quijano openly."
 ca_nicaragua_events.8.c:0 "Accept San José's tobacco and expel Quijano."

 Quijano:0 "Quijano"
