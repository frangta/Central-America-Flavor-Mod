l_english:
 # CAFM - F14 - Regional: Bocas del Toro, el Istmo, Talamanca y el Soconusco
 ca_central_america.6.t:0 "The Bocas del Toro Question"
 ca_central_america.6.d:0 "Bocas del Toro, the federal outpost on the Caribbean, is coveted by two powers. Great Britain, protector of the Mosquito Coast, wants it for its trade; New Granada claims it as part of the Isthmus. The Federation can only watch the coast and wait."
 ca_central_america.6.f:0 ""A few huts, a lagoon and three flags.""
 ca_central_america.6.a:0 "Watch the coast."
 ca_central_america.6.a.tt:0 "Great Britain and New Granada will decide what to do with Bocas del Toro."
 ca_central_america.7.t:0 "Bocas del Toro: Britain Decides"
 ca_central_america.7.d:0 "The Central American Federation owes London a fortune it cannot pay. Some in the Foreign Office suggest taking Bocas del Toro as payment; others prefer to keep British influence through the Mosquito protectorate, without new colonies."
 ca_central_america.7.d2:0 "The lagoon of Bocas del Toro would be a fine base for British trade on the Caribbean coast. Some in the Foreign Office want to take it; others prefer to keep British influence through the Mosquito protectorate, without new colonies."
 ca_central_america.7.f:0 ""Trade follows the flag, or the flag follows trade.""
 ca_central_america.7.a:0 "Our influence through the Mosquito Coast is enough."
 ca_central_america.7.b:0 "Take Bocas del Toro."
 ca_central_america.7.debt_tt:0 "Part of the Central American debt is written off in exchange for the territory."
 ca_central_america.8.t:0 "Bocas del Toro: New Granada Decides"
 ca_central_america.8.d:0 "Bocas del Toro lies on the border of the old viceroyalty and, for Bogotá, belongs to the Isthmus. A small expedition from Cartagena could settle the matter before the Central Americans react."
 ca_central_america.8.f:0 ""The title of 1803 is clear.""
 ca_central_america.8.a:0 "Send the expedition from Cartagena."
 ca_central_america.8.b:0 "Protest, and keep our claim."
 ca_central_america.9.t:0 "Bocas del Toro: The Federation Decides"
 ca_central_america.9.d:0 "The Federal Congress has to decide what to do with its Caribbean outpost. The Irish-born general Juan Galindo offers to lead an expedition to Bocas and to the Mosquito Coast. Some ministers go further: make Bocas a protectorate under his command."
 ca_central_america.9.f:0 ""Galindo knows the coast better than any of us.""
 ca_central_america.9.a:0 "Issue the federal decree and send Galindo."
 ca_central_america.9.b:0 "Create a protectorate under Galindo."
 ca_central_america.10.t:0 "The Federation and Its Dependency"
 ca_central_america.10.d:0 "The little Republic of Bocas del Toro survives under Galindo, but it cannot defend itself alone. London and Bogotá are watching. How much is the Federation willing to give?"
 ca_central_america.10.f:0 ""A flag needs soldiers to stay up.""
 ca_central_america.10.a:0 "Send a federal garrison."
 ca_central_america.10.b:0 "Send money and trade."
 ca_central_america.10.c:0 "Seek its international recognition."
 ca_central_america.10.opt_d:0 "Leave Bocas to its fate."
 ca_central_america.11.t:0 "The Fate of Bocas del Toro"
 ca_central_america.11.d:0 "Bocas del Toro is at a crossroads. London, Bogotá and perhaps Washington are making their moves. The Federation must decide whether it can still hold its Caribbean outpost."
 ca_central_america.11.d2:0 "The little Republic of Bocas del Toro, under Central American protection, is at a crossroads. Every power with interests on the Caribbean coast is making its move."
 ca_central_america.11.f:0 ""Whoever moves first, keeps the lagoon.""
 ca_central_america.11.uca_a:0 "Withdraw the garrison and keep the claim."
 ca_central_america.11.uca_b:0 "Secure Bocas del Toro."
 ca_central_america.11.gbr_a:0 "We will not intervene."
 ca_central_america.11.gbr_b:0 "Offer Bocas our protection."
 ca_central_america.11.clm_a:0 "Occupy Bocas del Toro."
 ca_central_america.11.clm_b:0 "Recognize Bocas in exchange for a border treaty."
 ca_central_america.11.usa_a:0 "This is not our business."
 ca_central_america.11.usa_b:0 "Offer a treaty of transit and protection."
 ca_central_america.11.weak_tt:0 "Without a garrison or money, the Federation cannot secure Bocas del Toro."
 ca_central_america.11.too_late_tt:0 "Someone else has already moved: we keep only a claim."
 ca_central_america.12.t:0 "The Granadine Usurpation"
 ca_central_america.12.d:0 "New Granada has taken Bocas del Toro. The Federation protests, but its army is busy with its own wars and its treasury is empty. In San José, the Costa Ricans take note of how little the Federation can do for them."
 ca_central_america.12.f:0 ""A protest costs nothing; a war costs everything.""
 ca_central_america.12.a:0 "A formal protest, and silence."
 ca_central_america.12.b:0 "War to recover Bocas del Toro."
 ca_bocas_recovery_play:0 "Recovery of Bocas del Toro"
 ca_central_america.61.t:0 "The Free State of the Isthmus"
 ca_central_america.61.d:0 "While New Granada is torn by civil war, the notables of Panama have proclaimed the Free State of the Isthmus. Bogotá must decide whether to negotiate with them or to crush them."
 ca_central_america.61.f:0 ""The Isthmus belongs to those who live on it.""
 ca_central_america.61.a:0 "Tolerate them, and negotiate."
 ca_central_america.61.b:0 "Crush the rebellion."
 ca_isthmus_war_play:0 "Reconquest of the Isthmus"
 ca_central_america.34.t:0 "The Isthmus Asks for Recognition"
 ca_central_america.34.d:0 "The Free State of the Isthmus has sent envoys asking us to recognize its independence. Supporting it would anger New Granada, but a friendly Panama would protect our Caribbean flank."
 ca_central_america.34.f:0 ""An isthmus between two seas, and between two nations.""
 ca_central_america.34.a:0 "Recognize and support the Isthmus."
 ca_central_america.34.b:0 "We will not intervene."
 ca_central_america.75.t:0 "War in the Isthmus"
 ca_central_america.75.d:0 "New Granada has sent its army to put down the Free State of the Isthmus. The notables of Panama must choose between fighting and returning to Bogotá on the best terms they can get."
 ca_central_america.75.f:0 ""Better a free Isthmus than a quiet province.""
 ca_central_america.75.a:0 "Resist!"
 ca_central_america.75.b:0 "Negotiate our return to New Granada."
 ca_central_america.75.support_tt:0 "Central America sends money and weapons to the Isthmus."
 ca_central_america.76.t:0 "The Isthmus Takes Up Arms"
 ca_central_america.76.d:0 "The autonomists of Panama have taken up arms. They want a State of their own, and they say Bogotá has forgotten them. New Granada must decide whether to fight for the Isthmus or to let it go."
 ca_central_america.76.f:0 ""Bogotá is far, and the sea is near.""
 ca_central_america.76.a:0 "Crush them."
 ca_central_america.76.b:0 "Let them go."
 ca_central_america.60.t:0 "The Isthmus Returns to New Granada"
 ca_central_america.60.d:0 "The Free State of the Isthmus has signed an agreement with Bogotá and returns to New Granada, with promises of autonomy that few believe."
 ca_central_america.60.f:0 ""The Isthmus returns, but it does not forget.""
 ca_central_america.60.a:0 "So be it."
 ca_central_america.62.t:0 "The Isthmus Asks to Join Central America"
 ca_central_america.62.d:0 "The government of Panama has proposed to join Central America as a State of the Federation. It would give us the road between the two seas; it would also give us a war with New Granada."
 ca_central_america.62.f:0 ""Two seas, one Union.""
 ca_central_america.62.a:0 "Welcome the Isthmus to the Federation."
 ca_central_america.62.b:0 "We cannot afford it."
 ca_central_america.59.t:0 "Panama Stands Alone"
 ca_central_america.59.d:0 "Panama has survived its first years as an independent State. Its fortune is the transit between the oceans, and every great power wants it."
 ca_central_america.59.f:0 ""The crossroads of the world.""
 ca_central_america.59.a:0 "Neutrality of the transit."
 ca_central_america.59.b:0 "Seek a powerful protector."
 ca_bocas_federal_protection:0 "Federal Protection"
 ca_bocas_federal_protection_desc:0 "The Federation guarantees the independence of Bocas del Toro."
 ca_isthmus_resistance:0 "Resistance of the Isthmus"
 ca_isthmus_resistance_desc:0 "The people of the Isthmus defend their Free State."
 ca_isthmus_occupation:0 "Occupation of the Isthmus"
 ca_isthmus_occupation_desc:0 "Granadine troops patrol the streets of Panama."
 ca_isthmus_neutral_transit:0 "Neutral Transit"
 ca_isthmus_neutral_transit_desc:0 "Panama lives from the neutral transit between the oceans."
 ca_panama_events.1.t:0 "The Russell Incident"
 ca_panama_events.1.d:0 "The British vice-consul in Panama, Joseph Russell, has been arrested after a brawl with the local authorities. London demands satisfaction, and its warships are already sailing for Cartagena."
 ca_panama_events.1.f:0 ""Insult a consul, and you insult the Crown.""
 ca_panama_events.1.a:0 "Apologize and pay compensation."
 ca_panama_events.1.b:0 "Our courts are sovereign."
 ca_panama_events.2.t:0 "The Garrison of Bocas del Toro"
 ca_panama_events.2.d:0 "Granadine soldiers from Cartagena now hold Bocas del Toro. Bogotá is pleased; the notables of Panama wonder why the government is so generous with soldiers for a lagoon and so stingy with the Isthmus."
 ca_panama_events.2.f:0 ""Soldiers for Bocas, nothing for Panama.""
 ca_panama_events.2.a:0 "Bocas is ours again."
 ca_panama_events.3.t:0 "The Constitution of the State of the Isthmus"
 ca_panama_events.3.d:0 "The Free State of the Isthmus has called a convention to write its constitution. The liberals want a federal and secular charter; the conservatives, a strong governor and the old privileges."
 ca_panama_events.3.f:0 ""A constitution for two seas.""
 ca_panama_events.3.a:0 "A liberal constitution."
 ca_panama_events.3.b:0 "A strong governor."
 ca_panama_events.4.t:0 "The Negotiated Return"
 ca_panama_events.4.d:0 "Bogotá offers to take the Isthmus back with an amnesty and promises of autonomy. The civil war in New Granada is ending, and the Free State is alone."
 ca_panama_events.4.f:0 ""Better to return with honor than to be dragged back.""
 ca_panama_events.4.a:0 "Accept the agreement."
 ca_panama_events.4.b:0 "Refuse: the Isthmus stays free."
 ca_panama_events.5.t:0 "The Mallarino-Bidlack Treaty"
 ca_panama_events.5.d:0 "The United States proposes a treaty: they will guarantee the neutrality of the Isthmus and New Granada's sovereignty over it, in exchange for free transit for their citizens and goods."
 ca_panama_events.5.f:0 ""A guarantee that may become a leash.""
 ca_panama_events.5.a:0 "Sign the treaty."
 ca_panama_events.5.b:0 "We need no guardians."
 ca_panama_events.6.t:0 "The Gold Rush"
 ca_panama_events.6.d:0 "Gold has been found in California, and the fastest road from New York to San Francisco crosses the Isthmus. Thousands of travelers are pouring into Panama: they bring money, disease and trouble."
 ca_panama_events.6.f:0 ""Everyone is going to California, and everyone passes through here.""
 ca_panama_events.6.a:0 "Open the road and tax the travelers."
 ca_panama_events.6.b:0 "Control the traffic strictly."
 ca_panama_events.7.t:0 "The Railroad Contract"
 ca_panama_events.7.d:0 "An American company asks for the right to build a railroad across the Isthmus, with land, a monopoly of the transit and ninety-nine years to run it."
 ca_panama_events.7.f:0 ""Ninety-nine years is a long time.""
 ca_panama_events.7.a:0 "Grant the contract."
 ca_panama_events.7.b:0 "Refuse the concession."
 ca_panama_events.8.t:0 "The Clayton-Bulwer Treaty"
 ca_panama_events.8.d:0 "London and Washington have agreed that neither will control alone a canal between the oceans. Nobody asked Bogotá, Panama or the Central Americans."
 ca_panama_events.8.f:0 ""The great powers divide what is not theirs.""
 ca_panama_events.8.a:0 "Take note."
 ca_panama_events.9.t:0 "A New Port on the Atlantic"
 ca_panama_events.9.d:0 "The railroad company has founded a new town on the Atlantic end of the line. The Americans call it Aspinwall, after the financier; the government wants to call it Colón."
 ca_panama_events.9.f:0 ""A name is a flag.""
 ca_panama_events.9.a:0 "It will be called Colón."
 ca_panama_events.9.b:0 "Let the Americans call it Aspinwall."
 ca_panama_events.10.t:0 "The Federal State of Panama"
 ca_panama_events.10.d:0 "The railroad between the oceans has been inaugurated, and the Isthmus is richer and prouder than ever. Its deputies demand a Federal State with its own government, inside the Republic."
 ca_panama_events.10.f:0 ""Panama for the Panamanians, inside the Republic.""
 ca_panama_events.10.a:0 "Accept the Federal State."
 ca_panama_events.10.b:0 "The Isthmus is a province like any other."
 ca_panama_events.11.t:0 "The Transit Toll"
 ca_panama_events.11.d:0 "Every traveler who crosses the Isthmus pays a toll. The merchants of Panama say it is too high; the treasury says it is too low."
 ca_panama_events.11.a:0 "Raise the toll."
 ca_panama_events.11.b:0 "Lower it."
 ca_panama_events.12.t:0 "The Muleteers of the Camino de Cruces"
 ca_panama_events.12.d:0 "The muleteers who carry goods along the old Camino de Cruces fear the new times. They demand a monopoly of the trail."
 ca_panama_events.12.a:0 "Grant them the monopoly."
 ca_panama_events.12.b:0 "The road is free for all."
 ca_panama_events.13.t:0 "Bandits on the Road"
 ca_panama_events.13.d:0 "Bandits attack the caravans crossing the Isthmus. The travelers demand protection, and the foreign consuls threaten to send their own."
 ca_panama_events.13.a:0 "Send soldiers from the capital."
 ca_panama_events.13.b:0 "Let the Isthmus form its own guard."
 ca_panama_events.14.t:0 "A Free Port?"
 ca_panama_events.14.d:0 "The merchants of Panama propose to make the city a free port, without customs duties, to attract the trade of both oceans."
 ca_panama_events.14.a:0 "Make Panama a free port."
 ca_panama_events.14.b:0 "The customs are needed."
 ca_panama_events.15.t:0 "The Tonnage Tax"
 ca_panama_events.15.d:0 "The treasury wants a tax on every ton shipped through the Isthmus. The shipping companies threaten to take their business to Nicaragua."
 ca_panama_events.15.a:0 "Impose the tax."
 ca_panama_events.15.b:0 "No new taxes."
 ca_panama_events.16.t:0 "Intramuros and Arrabal"
 ca_panama_events.16.d:0 "Inside the walls live the white notables; outside, in the arrabal of Santa Ana, the artisans and the people of color. Their rivalry decides every election in Panama."
 ca_panama_events.16.a:0 "Side with the notables."
 ca_panama_events.16.b:0 "Side with the arrabal."
 ca_panama_events.17.t:0 "Yellow Fever"
 ca_panama_events.17.d:0 "Yellow fever is killing travelers and workers by the hundreds. The city asks for doctors and money."
 ca_panama_events.17.a:0 "Send doctors."
 ca_panama_events.17.b:0 "Panama will manage alone."
 ca_panama_events.18.t:0 "Cholera in the Isthmus"
 ca_panama_events.18.d:0 "Cholera has arrived with the ships. The authorities debate whether to close the port or keep the transit open."
 ca_panama_events.18.a:0 "Close the port."
 ca_panama_events.18.b:0 "Keep the transit open."
 ca_panama_events.19.t:0 "The Railroad Workers"
 ca_panama_events.19.d:0 "Thousands of workers from Jamaica, China and Ireland have come to build the railroad. They are badly paid and dying of fever; now they are on strike."
 ca_panama_events.19.a:0 "Force them back to work."
 ca_panama_events.19.b:0 "Mediate with the company."
 ca_panama_events.20.t:0 "Foreign Vigilance Committees"
 ca_panama_events.20.d:0 "The American travelers have formed vigilance committees to keep order on the road, and they hang whoever they want."
 ca_panama_events.20.a:0 "Disband them by force."
 ca_panama_events.20.b:0 "Tolerate them."
 ca_panama_events.21.t:0 "A Governor from Outside"
 ca_panama_events.21.d:0 "The government has named a governor for the Isthmus who has never set foot in Panama. The notables are offended."
 ca_panama_events.21.a:0 "He stays."
 ca_panama_events.21.b:0 "Name a native of the Isthmus."
 ca_panama_events.22.t:0 "An Open Cabildo"
 ca_panama_events.22.d:0 "The notables of Panama have called an open cabildo to discuss the affairs of the Isthmus without waiting for orders from the capital."
 ca_panama_events.22.a:0 "Forbid it."
 ca_panama_events.22.b:0 "Let it meet."
 ca_panama_events.23.t:0 "[SCOPE.sCharacter('ca_pan_general').GetFullName] Pronounces"
 ca_panama_events.23.d:0 "[SCOPE.sCharacter('ca_pan_general').GetFullName] has issued a pronunciamiento demanding more autonomy for the Isthmus and threatening to march on the capital."
 ca_panama_events.23.a:0 "Arrest him."
 ca_panama_events.23.b:0 "Negotiate with him."
 ca_panama_events.24.t:0 "Smuggling and Customs"
 ca_panama_events.24.d:0 "Smuggling is the most profitable business of the Isthmus, and the customs officers are the best customers of the smugglers."
 ca_panama_events.24.a:0 "Purge the customs."
 ca_panama_events.24.b:0 "Look the other way."
 ca_panama_events.25.t:0 "Autonomy at the Convention"
 ca_panama_events.25.d:0 "At the national convention, the deputies of the Isthmus demand a special status for their province."
 ca_panama_events.25.a:0 "Grant a special status."
 ca_panama_events.25.b:0 "One law for all provinces."
 ca_panama_events.26.t:0 "A Foreign Gunboat"
 ca_panama_events.26.d:0 "A foreign gunboat has anchored in front of Panama to protect its citizens. Its captain gives orders as if the port were his."
 ca_panama_events.26.a:0 "Protest firmly."
 ca_panama_events.26.b:0 "Ask him to leave politely."
 ca_panama_events.27.t:0 "Filibusters in Transit"
 ca_panama_events.27.d:0 "Armed adventurers on their way to Central America are crossing the Isthmus. They say they are colonists; nobody believes them."
 ca_panama_events.27.a:0 "Arrest them."
 ca_panama_events.27.b:0 "Let them pass."
 ca_panama_events.28.t:0 "Panama or Nicaragua?"
 ca_panama_events.28.d:0 "The great powers debate where to build the canal between the oceans: across the Isthmus of Panama or through the lake of Nicaragua."
 ca_panama_events.28.a:0 "Lobby for Panama."
 ca_panama_events.28.b:0 "Let the engineers decide."
 ca_panama_events.29.t:0 "The Guna of the Coast"
 ca_panama_events.29.d:0 "The Guna of the Caribbean coast (Guna Yala) trade freely with foreign schooners and refuse to obey the authorities of the Isthmus."
 ca_panama_events.29.a:0 "Respect their autonomy."
 ca_panama_events.29.b:0 "Impose our authority."
 ca_panama_events.30.t:0 "The Darién and the Emberá"
 ca_panama_events.30.d:0 "The Emberá of the Darién jungle ask for protection against the settlers who are entering their lands."
 ca_panama_events.30.a:0 "Protect them."
 ca_panama_events.30.b:0 "The land is for the settlers."
 CA_ISTMO_TRANSIT:0 "The transit to California"
 CA_ISTMO_RAILROAD:0 "The Panama Railroad"
 CA_ISTMO_INDEPENDENT:0 "The Isthmus governs itself"
 je_ca_historic_situation_in_panama:0 "The Crossroads of the Isthmus"
 je_ca_historic_situation_in_panama_reason:0 "The Isthmus of Panama is the narrowest road between the oceans. Its notables want to govern themselves; the capital wants to keep it; the great powers want the transit. Whoever holds Panama must balance them all."
 je_ca_historic_situation_in_panama_goal:0 "At 100 autonomy, the Isthmus may rise for its independence; at 0, it is absorbed by the capital. A middle way may lead to a Federal State."
 je_ca_istmo_status_high:0 "The Isthmus wants to govern itself."
 je_ca_istmo_status_low:0 "The capital governs the Isthmus with a firm hand."
 je_ca_istmo_status_mid:0 "The Isthmus and the capital keep an uneasy balance."
 je_ca_istmo_absorbed_tt:0 "Autonomy of the Isthmus falls to 0"
 ca_isthmus_federal_state:0 "Federal State of Panama"
 ca_isthmus_federal_state_desc:0 "The Isthmus governs itself as a Federal State."
 ca_isthmus_absorbed:0 "The Isthmus Absorbed"
 ca_isthmus_absorbed_desc:0 "The capital governs the Isthmus directly."
 ca_isthmus_colon:0 "Colón"
 ca_isthmus_colon_desc:0 "The new port on the Atlantic bears the name of Columbus."
 ca_isthmus_humiliation:0 "Gunboat Diplomacy"
 ca_isthmus_humiliation_desc:0 "A foreign warship gives orders in our port."
 ca_talamanca_events.1.t:0 "A King for Talamanca"
 ca_talamanca_events.1.d:0 "The Bribri and Cabécar chiefs have crowned Santiago Mayas as king of Talamanca. The new king asks to be recognized, and to receive the gifts his ancestors received."
 ca_talamanca_events.1.f:0 ""In the mountains, the king of Talamanca rules.""
 ca_talamanca_events.1.a:0 "Recognize him and pay a stipend."
 ca_talamanca_events.1.b:0 "We recognize no kings."
 ca_talamanca_events.2.t:0 "The Caciques as Political Chiefs"
 ca_talamanca_events.2.d:0 "The government proposes to name the king of Talamanca and the main caciques as political chiefs, with a salary from the State. They would be our officials, and still their people's lords."
 ca_talamanca_events.2.f:0 ""A salary makes a subject of a king.""
 ca_talamanca_events.2.a:0 "Name them political chiefs."
 ca_talamanca_events.2.b:0 "No salaries for caciques."
 ca_talamanca_events.3.t:0 "A King of Talamanca in the Capital"
 ca_talamanca_events.3.d:0 "The king of Talamanca has come down from the mountains to visit the capital. The newspapers make fun of him; the government must decide how to receive him."
 ca_talamanca_events.3.f:0 ""The king wore a borrowed coat.""
 ca_talamanca_events.3.a:0 "Receive him with honors."
 ca_talamanca_events.3.b:0 "Treat him like any other subject."
 ca_talamanca_events.4.t:0 "The Succession Crisis"
 ca_talamanca_events.4.d:0 "King Santiago Mayas has been murdered. William Forbes and other claimants fight for the crown, and the mountain villages are at war. The government can intervene, mediate or wait."
 ca_talamanca_events.4.f:0 ""A crown without a law of succession is a dagger.""
 ca_talamanca_events.4.a:0 "Send troops to impose order."
 ca_talamanca_events.4.b:0 "Mediate between the claimants."
 ca_talamanca_events.4.c:0 "Let them settle it."
 ca_talamanca_events.5.t:0 "The Talamanca Colony"
 ca_talamanca_events.5.d:0 "A plan proposes an agricultural and military colony in Talamanca, under the protection of the new king, Antonio Saldaña. Settlers, soldiers and missionaries would open the mountains to the State."
 ca_talamanca_events.5.f:0 ""Plough, rifle and cross.""
 ca_talamanca_events.5.a:0 "Found the colony."
 ca_talamanca_events.5.b:0 "Leave the mountains alone."
 ca_talamanca_events.6.t:0 "Missionaries for Talamanca"
 ca_talamanca_events.6.d:0 "A group of missionaries asks permission to enter Talamanca and build a mission among the Bribri."
 ca_talamanca_events.6.a:0 "Let them go."
 ca_talamanca_events.6.b:0 "Talamanca is not ready."
 ca_talamanca_events.7.t:0 "Cacao and Turtle Shell"
 ca_talamanca_events.7.d:0 "The people of Talamanca trade cacao and hawksbill turtle shell with the merchants of Matina. The trade could be protected, or taxed."
 ca_talamanca_events.7.a:0 "Protect the trade."
 ca_talamanca_events.7.b:0 "Tax it."
 ca_talamanca_events.8.t:0 "A Miskito Raid"
 ca_talamanca_events.8.d:0 "Miskito raiders have come down the coast and attacked the villages of Talamanca, taking captives and goods."
 ca_talamanca_events.8.a:0 "Send troops to the coast."
 ca_talamanca_events.8.b:0 "We cannot protect every village."
 ca_talamanca_events.9.t:0 "A Claim on Talamanca"
 ca_talamanca_events.9.d:0 "The masters of Bocas del Toro claim that Talamanca belongs to the Isthmus, and their agents are visiting the caciques."
 ca_talamanca_events.9.a:0 "Reject the claim firmly."
 ca_talamanca_events.9.b:0 "Negotiate a border."
 ca_talamanca_events.10.t:0 "An Explorer Asks for a Concession"
 ca_talamanca_events.10.d:0 "A foreign explorer asks for a concession in Talamanca: he speaks of gold, rubber and a road to the Caribbean."
 ca_talamanca_events.10.a:0 "Grant the concession."
 ca_talamanca_events.10.b:0 "Refuse it."
 ca_talamanca_events.11.t:0 "Demands from [SCOPE.sCountry('ca_tal_lord').GetName]"
 ca_talamanca_events.11.d:0 "Our overlord, [SCOPE.sCountry('ca_tal_lord').GetName], is interfering in the affairs of Talamanca. The elders ask how we should answer."
 ca_talamanca_events.11.f:0 ""The mountains have always been ours.""
 ca_talamanca_events.11.a:0 "Accept, for now."
 ca_talamanca_events.11.b:0 "Resist."
 ca_button_talamanca_integrate:0 "Integrate Talamanca"
 ca_button_talamanca_integrate_desc:0 "Make the king and the caciques officials of the State, with a stipend. Influence #G +0.5#! per month; costs money every month."
 ca_button_talamanca_conquer:0 "Conquer Talamanca"
 ca_button_talamanca_conquer_desc:0 "Open the mountains by force, with military colonies. Influence #G +0.75#! per month, but relations with Talamanca fall."
 ca_button_talamanca_coexist:0 "Coexist with Talamanca"
 ca_button_talamanca_coexist_desc:0 "Respect the autonomy of Talamanca and trade with it. Influence #G +0.25#! per month; relations with Talamanca rise."
 je_ca_historic_situation_in_talamanca:0 "The Question of Talamanca"
 je_ca_historic_situation_in_talamanca_reason:0 "In the mountains of Talamanca, the Bribri and Cabécar peoples obey their own kings and caciques. The State claims the land but does not govern it. It can integrate them, conquer them or learn to live beside them."
 je_ca_historic_situation_in_talamanca_goal:0 "Reach 100 influence in Talamanca by the chosen path. At 0, Talamanca breaks free."
 je_ca_talamanca_status_integrate:0 "We are integrating the caciques into the State."
 je_ca_talamanca_status_conquer:0 "We are opening Talamanca by force."
 je_ca_talamanca_status_coexist:0 "We live beside Talamanca and trade with it."
 je_ca_talamanca_status_none:0 "We have not yet chosen how to deal with Talamanca."
 je_ca_talamanca_complete_tt:0 "Influence in Talamanca reaches 100"
 je_ca_talamanca_path_tt:0 "A path for Talamanca has been chosen"
 CA_TALAMANCA_PATH_INTEGRATE:0 "Integration of the caciques"
 CA_TALAMANCA_PATH_CONQUER:0 "Military colonies"
