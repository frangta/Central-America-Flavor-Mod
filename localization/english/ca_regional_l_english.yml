 ca_talamanca_integrated:0 "Talamanca Integrated"
 ca_talamanca_integrated_desc:0 "The caciques of Talamanca serve the State as political chiefs."
 ca_talamanca_conquered:0 "Talamanca Conquered"
 ca_talamanca_conquered_desc:0 "The mountains of Talamanca have been opened by force."
 ca_talamanca_partnership:0 "Partnership with Talamanca"
 ca_talamanca_partnership_desc:0 "Talamanca keeps its autonomy and trades freely with us."
 ca_talamanca_resistance:0 "Resistance in the Mountains"
 ca_talamanca_resistance_desc:0 "The people of Talamanca resist the interference of their overlord."
 ca_los_altos_soconusco_events.1.t:0 "The Neutral Soconusco"
 ca_los_altos_soconusco_events.1.d:0 "The Soconusco has been disputed between Mexico and Central America since independence. In 1825 both sides withdrew their troops and the province governs itself, but everyone knows the question is not settled."
 ca_los_altos_soconusco_events.1.f:0 ""Neither Mexican nor Guatemalan: Soconuscan.""
 ca_los_altos_soconusco_events.1.a:0 "We will decide our own future."
 ca_los_altos_soconusco_events.2.t:0 "Los Altos Invites the Soconusco"
 ca_los_altos_soconusco_events.2.d:0 "The new State of Los Altos invites the Soconusco to join it: the same highlands, the same coffee roads, the same distrust of Guatemala City."
 ca_los_altos_soconusco_events.2.f:0 ""From Quetzaltenango to Tapachula, one people.""
 ca_los_altos_soconusco_events.2.a:0 "Strengthen our ties with Los Altos."
 ca_los_altos_soconusco_events.2.b:0 "We belong to nobody."
 ca_los_altos_soconusco_events.3.t:0 "The Acts of Adhesion"
 ca_los_altos_soconusco_events.3.d:0 "In the town halls of the Soconusco, notables loyal to Mexico are signing acts of adhesion to the Mexican Republic. The others call them traitors."
 ca_los_altos_soconusco_events.3.f:0 ""Ink on paper, and soldiers behind it.""
 ca_los_altos_soconusco_events.3.a:0 "Annul the acts."
 ca_los_altos_soconusco_events.3.b:0 "We cannot stop them."
 ca_los_altos_soconusco_events.4.t:0 "The Irrevocable Union"
 ca_los_altos_soconusco_events.4.d:0 "President Santa Anna has decreed the irrevocable union of the Soconusco with the Mexican department of Chiapas. Mexican officials are on their way to take possession of the province."
 ca_los_altos_soconusco_events.4.f:0 ""Irrevocable is a big word.""
 ca_los_altos_soconusco_events.4.a:0 "The decree has been issued."
 ca_los_altos_soconusco_events.5.t:0 "The Protest of Guatemala"
 ca_los_altos_soconusco_events.5.d:0 "Guatemala has protested against the Mexican annexation of the Soconusco. The note is energetic; whether it will be followed by anything else is another matter."
 ca_los_altos_soconusco_events.5.f:0 ""A protest is the weapon of the weak.""
 ca_los_altos_soconusco_events.5.a:0 "Protest, and keep the claim."
 ca_los_altos_soconusco_events.5.b:0 "Prepare for war."
 ca_los_altos_soconusco_events.6.t:0 "Cacao Smuggling"
 ca_los_altos_soconusco_events.6.d:0 "The cacao of the Soconusco is smuggled across the border to avoid the duties of both sides. The smugglers have friends everywhere."
 ca_los_altos_soconusco_events.6.a:0 "Close the border to Mexico."
 ca_los_altos_soconusco_events.6.b:0 "Close the border to Guatemala."
 ca_los_altos_soconusco_events.7.t:0 "[SCOPE.sCharacter('ca_soc_caudillo').GetFullName] Pronounces"
 ca_los_altos_soconusco_events.7.d:0 "[SCOPE.sCharacter('ca_soc_caudillo').GetFullName] has gathered armed men and declared that the Soconusco must choose its master now."
 ca_los_altos_soconusco_events.7.a:0 "Back the Central American cause."
 ca_los_altos_soconusco_events.7.b:0 "Back the Mexican cause."
 ca_los_altos_soconusco_events.8.t:0 "The Priest Preaches for Mexico"
 ca_los_altos_soconusco_events.8.d:0 "The parish priest of Tapachula preaches every Sunday that the Soconusco belongs to the Mexican Church and to the Mexican nation."
 ca_los_altos_soconusco_events.8.a:0 "Ask the bishop to move him."
 ca_los_altos_soconusco_events.8.b:0 "Let him preach."
 ca_los_altos_soconusco_events.9.t:0 "A Mexican Party Crosses the Border"
 ca_los_altos_soconusco_events.9.d:0 "An armed party from Chiapas has crossed the border, raised the Mexican flag in a village and gone back."
 ca_los_altos_soconusco_events.9.a:0 "Pursue them."
 ca_los_altos_soconusco_events.9.b:0 "Avoid a confrontation."
 ca_los_altos_soconusco_events.10.t:0 "The Unpaid Garrison"
 ca_los_altos_soconusco_events.10.d:0 "The garrison of Tapachula has not been paid for months. The soldiers say Mexico pays on time."
 ca_los_altos_soconusco_events.10.a:0 "Pay them."
 ca_los_altos_soconusco_events.10.b:0 "There is no money."
 ca_central_america.5.t:0 "The Fate of the Soconusco"
 ca_central_america.5.d:0 "The Soconusco has made its choice: its people feel Central American, and the Mexican party has lost the day. Now the province must decide with whom it will walk."
 ca_central_america.5.d2:0 "The Mexican party has won in the Soconusco. Santa Anna's officials are taking possession of the province, and its Central American notables must decide whether to submit, to resist or to ask for help."
 ca_central_america.5.f:0 ""Between two nations, the Soconusco chooses.""
 ca_central_america.5.a:0 "Remain a State of the Federation."
 ca_central_america.5.b:0 "Join Guatemala."
 ca_central_america.5.c:0 "Join Los Altos."
 ca_central_america.5.opt_d:0 "Stay independent."
 ca_central_america.5.e:0 "Accept the annexation to Mexico."
 ca_central_america.5.opt_f:0 "Resist!"
 ca_central_america.5.g:0 "Ask Central America for help."
 ca_central_america.5.h:0 "We cannot resist any longer."
 ca_soconusco_war_play:0 "The Defense of the Soconusco"
 CA_SOCONUSCO_LOYAL:0 "Loyal to the Federation"
 CA_SOCONUSCO_REBEL:0 "Rebellious towards the Federation"
 CA_SOCONUSCO_SEPARATED:0 "Separated from the Federation"
 je_ca_soconusco:0 "The Soconusco"
 je_ca_soconusco_reason:0 "The Soconusco has been disputed between Mexico and Central America since independence. Its Central American, Mexican and Chiapanecan people pull in different directions, and both neighbors are watching."
 je_ca_soconusco_goal:0 "At 100, with more Central Americans than Mexicans, the Soconusco chooses Central America. At 0, or if Mexicans reach 45 % of the population, it falls to Mexico."
 je_ca_soconusco_status_ca:0 "The Soconusco leans towards Central America."
 je_ca_soconusco_status_mex:0 "The Soconusco leans towards Mexico."
 je_ca_soconusco_status_neutral:0 "The Soconusco is still undecided."
 je_ca_soconusco_complete_tt:0 "The bar reaches 100"
 je_ca_soconusco_culture_tt:0 "There are at least as many Central Americans as Mexicans"
 je_ca_soconusco_fail_tt:0 "The bar falls to 0"
 je_ca_soconusco_mexican_tt:0 "Mexicans are at least 45 % of the population"
 ca_soconusco_war_fever:0 "War Fever over the Soconusco"
 ca_soconusco_war_fever_desc:0 "The loss of the Soconusco has inflamed the country."
