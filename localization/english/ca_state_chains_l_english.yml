l_english:
 # CAFM - F15 - Cadenas de los estados (E1-E4)
 ca_nicaragua_events.3.t:0 "León against Granada"
 ca_nicaragua_events.3.d:0 "The old rivalry between liberal León and conservative Granada has flared up again. Both cities arm their militias, and each accuses the other of plotting to seize the State."
 ca_nicaragua_events.3.f:0 ""Two cities, two flags, one State.""
 ca_nicaragua_events.3.a:0 "Support Granada."
 ca_nicaragua_events.3.b:0 "Support León."
 ca_nicaragua_events.3.c:0 "Mediate between the cities."
 ca_honduras_events.41.t:0 "[SCOPE.sCharacter('hon_rebel').GetFullName] Rises"
 ca_honduras_events.41.d:0 "[SCOPE.sCharacter('hon_rebel').GetFullName] has gathered the discontented in assemblies across the country and taken up arms against the government. The caudillos who have ruled Honduras for a decade are divided, and the neighbors offer to mediate."
 ca_honduras_events.41.f:0 ""Assemblies in the morning, rifles at night.""
 ca_honduras_events.41.a:0 "Call the mediators."
 ca_honduras_events.41.b:0 "Crush the uprising."
 ca_honduras_events.42.t:0 "The Pact of Pespire"
 ca_honduras_events.42.d:0 "Under the mediation of [SCOPE.sCountry('hon_mediator').GetName], the government and the rebels have signed a pact. [SCOPE.sCharacter('hon_exile').GetFullName] will leave the country, and with him goes the power of the old caudillos. For the first time in years, Honduras will be governed by civilians."
 ca_honduras_events.42.f:0 ""The sword goes into exile; the law stays.""
 ca_honduras_events.42.a:0 "Sign the pact."
 ca_el_salvador_events.11.t:0 "The Challenge of [SCOPE.sCharacter('els_strongman').GetFullName]"
 ca_el_salvador_events.11.d:0 "[SCOPE.sCharacter('els_strongman').GetFullName] commands the army of El Salvador and no longer hides his ambitions. He wants absolute power at home and the leadership of the Central American States, by force if necessary."
 ca_el_salvador_events.11.f:0 ""El Salvador will lead, or nobody will.""
 ca_el_salvador_events.11.a:0 "The general assumes absolute power."
 ca_el_salvador_events.11.b:0 "Civil resistance rises against the caudillo!"
 ca_el_salvador_events.11.c:0 "Submit to the Diet of the Confederation."
 ca_guatemala_events.5.t:0 "The Fall of Gálvez"
 ca_guatemala_events.5.d:0 "The government of Mariano Gálvez is collapsing. The cholera, the Livingston Codes and the new taxes have turned the countryside against him, the rebels of the Mountain are at the gates of the capital, and even his own liberals ask him to step down."
 ca_guatemala_events.5.f:0 ""The reformer is undone by his reforms.""
 ca_guatemala_events.5.a:0 "Gálvez resigns."
 ca_guatemala_events.5.b:0 "Gálvez holds on to power."
 ca_guatemala_events.5.c:0 "The Mountain takes the capital."
 nic_legado_zepeda:0 "Zepeda's Legacy"
 nic_legado_zepeda_desc:0 "The reforms of José Zepeda have survived him."
 hon_ciudad_agraviada:0 "The Offended City"
 hon_ciudad_agraviada_desc:0 "The city that lost the capital nurses its grievances."
 hon_mandato_vencido_mod:0 "The Expired Mandate"
 hon_mandato_vencido_mod_desc:0 "The government rules after its mandate has expired."
 hon_gobierno_civil:0 "Civilian Government"
 hon_gobierno_civil_desc:0 "After the Pact of Pespire, Honduras is governed by civilians."
 ca_cos_castro_depuesto_mod:0 "The Deposed President"
 ca_cos_castro_depuesto_mod_desc:0 "The overthrow of the president has shaken the institutions."
 ca_cos_renuncia_rechazada_mod:0 "A Refused Resignation"
 ca_cos_renuncia_rechazada_mod_desc:0 "The Assembly refused to accept the resignation of the head of State."
 ca_cos_republica_unitaria_mod:0 "The Unitary Republic"
 ca_cos_republica_unitaria_mod_desc:0 "Costa Rica is one again, under a single government."
 ca_cos_ciudades_agraviadas:0 "The Humbled Cities"
 ca_cos_ciudades_agraviadas_desc:0 "Cartago, Heredia and Alajuela resent the loss of their sovereignty."
