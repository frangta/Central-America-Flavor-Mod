l_english:
 # CAFM - F8 - Guerra federal y desenlaces
 ca_central_america.42.t:0 "The Federal War"
 ca_central_america.42.d:0 "The States that have broken away will not return by themselves. In the barracks the officers demand a campaign to restore the Union by force; in Congress, others say the time has come to accept the end of the Federation."
 ca_central_america.42.f:0 ""The Republic will be saved by its soldiers, or not at all.""
 ca_central_america.42.a:0 "We will fight for the Federation!"
 ca_central_america.42.a_tt:0 "The Federation declares a #bold war of reannexation#! on every independent core State. If no core State is independent when the wars end, the Union has #bold won#!."
 ca_central_america.42.b:0 "Accept the dissolution."
 ca_central_america.42.b_tt:0 "#N The Federation will dissolve.#!"
 ca_central_america.43.t:0 "Defeat in the Federal War"
 ca_central_america.43.d:0 "The federal armies have been defeated. The States that broke away remain free, and there is no longer any force capable of holding the Union together."
 ca_central_america.43.f:0 "The flag of the five volcanoes is lowered."
 ca_central_america.43.a:0 "It is over."
 ca_central_america.44.t:0 "Victory in the Federal War"
 ca_central_america.44.d:0 "The rebellious States have been defeated and brought back into the Union. The Federation stands, but it has been restored by the sword, and its enemies are already plotting."
 ca_central_america.44.f:0 ""One flag, one Republic.""
 ca_central_america.44.a:0 "Long live the Federation!"
 ca_central_america.44.b:0 "Show clemency to the defeated."
 ca_central_america.77.t:0 "Morazán's Exile"
 ca_central_america.77.d:0 "After his defeat in Guatemala City on March 18 and 19, 1840, Francisco Morazán has withdrawn to El Salvador. Without an army and without allies, he has embarked at La Libertad with his last loyal officers. The Federal Republic of Central America has lost its sword and its symbol."
 ca_central_america.77.f:0 "The Eagle leaves, but the cause of the Union remains."
 ca_central_america.77.a:0 "The Eagle departs."
 ca_central_america.77.a_tt:0 "#N Morazán goes into exile: the Federation will dissolve.#!"
 ca_central_america.122.t:0 "The Federation Fades Away"
 ca_central_america.122.d:0 "There has been no victory, no union and no confederation. Year after year the States have stopped sending deputies and taxes, and now the Federal Republic exists only on paper. Its last officials agree to let the States go their own way in peace."
 ca_central_america.122.f:0 "Not with a battle, but with a signature."
 ca_central_america.122.a:0 "Let each State go its own way."
 ca_frca_six_states_tt:0 "#bold Republic of the Six States#!: Los Altos remains a loyal member of the Union."
 ca_frca_federal_victory:0 "Federal Victory"
 ca_frca_federal_victory_desc:0 "The Union has been restored on the battlefield."
 ca_frca_clemency:0 "Federal Clemency"
 ca_frca_clemency_desc:0 "The defeated States have been treated with mercy."
 ca_frca_republic_consolidated:0 "Consolidated Republic"
 ca_frca_republic_consolidated_desc:0 "The Federal Republic has survived its greatest crisis."
 ca_frca_union_by_sword:0 "Union by the Sword"
 ca_frca_union_by_sword_desc:0 "The Union rests on the bayonets of its army."
 ca_frca_reconquest_unrest:0 "Reconquered State"
 ca_frca_reconquest_unrest_desc:0 "This State was brought back into the Union by force."
 ca_frca_six_states:0 "Republic of the Six States"
 ca_frca_six_states_desc:0 "Los Altos stands with the Federation as its sixth State."
 ca_frca_federation_diminished:0 "Diminished Federation"
 ca_frca_federation_diminished_desc:0 "Only some of the States remain in the Federation."
 ca_federal_war_play:0 "The Federal War"
