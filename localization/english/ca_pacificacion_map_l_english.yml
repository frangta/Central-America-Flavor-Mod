l_english:
 CA_PN_HEADER:0 "The Northern Frontier, 1836 — pacified: #bold [GetPlayer.MakeScope.Var('ca_pacificacion_progress').GetValue|0]#! / 100"
 CA_PN_HEADER_TT:0 "How much of Guanacaste and Nicoya obeys San José again. The area on the map turns from #bold red#! (under 34) to #bold yellow#! (34 to 66) and #bold green#! (67 or more). At 100 the campaign succeeds; if 1 January 1837 arrives first, Guanacaste is lost."
 CA_PN_MAP_TT:0 "The partido of Guanacaste and Nicoya in 1836. The dashed line is the approximate border with Nicaragua. Blue markers are political events; red markers are fights."
 CA_PN_STAGES:0 "#bold The campaign of 1836#!"
 CA_PN_BEAT_1:0 "May — The insulted commissioner (Rivas)"
 CA_PN_BEAT_1_TT:0 "Intendant Joaquín Rivas, sent to the Nicaraguan head of state, is insulted and threatened in the town of Nicaragua. Quijano moves freely along the border."
 CA_PN_BEAT_2:0 "24–27 June — Extraordinary powers"
 CA_PN_BEAT_2_TT:0 "News of the invasion reaches San José. The Assembly grants Carrillo extraordinary powers and 800 men march north under Colonel Vicente Villaseñor."
 CA_PN_BEAT_3:0 "29 June — The mutiny at the Villa"
 CA_PN_BEAT_3_TT:0 "The infantry of the Villa de Guanacaste rises against its commander Antonio Elizondo while Quijano waits at Los Ahogados. The loyal authorities fall back to Bagaces."
 CA_PN_BEAT_4:0 "7 July — The sack of Bagaces"
 CA_PN_BEAT_4_TT:0 "Quijano's men sack Bagaces and loot the government's tobacco and liquor depots."
 CA_PN_BEAT_5:0 "8 July — The second assault"
 CA_PN_BEAT_5_TT:0 "Quijano attacks the Villa de Guanacaste again and is driven back by the garrison and the militias of Nicoya and Santa Cruz."
 CA_PN_BEAT_6:0 "July — The landing at El Bolsón"
 CA_PN_BEAT_6_TT:0 "A column sailing from Esparza lands at El Bolsón, on the Gulf of Nicoya, and takes Quijano from behind. Only if the campaign has reached 40."
 CA_PN_BEAT_7:0 "24 July — Sapoá"
 CA_PN_BEAT_7_TT:0 "Adjutant Joaquín Alvarado surprises Quijano at the hacienda of Sapoá; the invader flees across the border. Only with the expedition in the field."
 CA_PN_BEAT_8:0 "4 August — Morazán's mediators"
 CA_PN_BEAT_8_TT:0 "The federal government sends Juan Mora Fernández and Pedro Bermúdez to San José as mediators."
 CA_PN_EXPEDITION_ON:0 "Villaseñor's expedition is #bold in the field#!."
 CA_PN_EXPEDITION_OFF:0 "The expedition has #bold not marched#! yet."
 CA_JEMAP_ISTHMUS_TT:0 "A State of the isthmus. The redder it is, the higher its turmoil."
 CA_JEMAP_OUTSIDE_TT:0 "Outside the isthmus."
