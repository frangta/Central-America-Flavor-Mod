  ca_defensive_pact_confederation_action_notification_break_name: "Defense Pact Dissolved"
  ca_defensive_pact_confederation_action_notification_break_desc: "The defensive coordination between our states has ended."

  # --- CENTRAL AMERICAN DEPENDENCY ---
  ca_dependency: "Dependency" 
  ca_dependency_action_name: "[concept_ca_dependency]"
  ca_dependency_action_propose_name: "Make into [concept_ca_dependency]"
  ca_dependency_action_break_name: "Grant Independence"
  ca_dependency_action_ask_to_break_name: "Demand Independence"
  ca_dependency_desc: "#header $dependency$#!\n$TOOLTIP_DELIMITER$\nA [concept_diplomatic_pact] that establishes a [concept_ca_dependency] type [concept_subject] relationship between two [Concept('concept_country', '$concept_countries$')]."
  ca_dependency_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a [concept_ca_dependency] of [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
  ca_dependency_action_notification_name: "Demand for Union"
  ca_dependency_action_notification_desc: "[INITIATOR_COUNTRY.GetName] demands that we submit to them and form a [concept_ca_dependency]."
  ca_dependency_action_notification_break_name: "Independence Granted"
  ca_dependency_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] have ended our [concept_ca_dependency]. We are independent once again."
  ca_dependency_proposal_notification_break_name: "Demand for Independence"
  ca_dependency_proposal_notification_break_desc: "[INITIATOR_COUNTRY.GetName] are demanding that we end our [concept_ca_dependency] with them."
  ca_dependency_proposal_notification_break_effects_desc: "If we accept, they will become fully independent."
  ca_dependency_proposal_break_accepted_name: "Independence Granted"
  ca_dependency_proposal_break_accepted_desc: "[TARGET_COUNTRY.GetName] accepted the demand to end our [concept_ca_dependency]. We are independent once again."
  ca_dependency_proposal_break_declined_name: "Independence Refused"
  ca_dependency_proposal_break_declined_desc: "[TARGET_COUNTRY.GetName] refused the demand to end our [concept_ca_dependency]."
  ca_dependency_proposal_third_party_break_accepted_name: "Independence Granted"
  ca_dependency_proposal_third_party_break_accepted_desc: "[TARGET_COUNTRY.GetName] ended their [concept_ca_dependency] with [INITIATOR_COUNTRY.GetName], granting them full independence."
  ca_dependency_proposal_third_party_break_declined_name: "Independence Refused"
  ca_dependency_proposal_third_party_break_declined_desc: "[TARGET_COUNTRY.GetName] refused to end their [concept_ca_dependency] with [INITIATOR_COUNTRY.GetName]."
  ca_dependency_proposal_accepted_name: "Dependency Proposal Accepted"
  ca_dependency_proposal_accepted_desc: "[SCOPE.sCountry('target_country').GetName] has accepted our proposal to become a [Concept('concept_ca_dependency', '$concept_ca_dependency$')]."
  ca_dependency_proposal_declined_name: "Dependency Proposal Declined"
  ca_dependency_proposal_declined_desc: "[SCOPE.sCountry('target_country').GetName] has declined our proposal to become a [Concept('concept_ca_dependency', '$concept_ca_dependency$')]."
  ca_dependency_proposal_notification_name: "Dependency Proposal"
  ca_dependency_proposal_notification_desc: "[SCOPE.sCountry('actor').GetName] has proposed that we become their [Concept('concept_ca_dependency', '$concept_ca_dependency$')]."
  ca_dependency_proposal_third_party_accepted_name: "Dependency Accepted"
  ca_dependency_proposal_third_party_accepted_desc: "[SCOPE.sCountry('target_country').GetName] has accepted becoming a [Concept('concept_ca_dependency', '$concept_ca_dependency$')]."
  ca_dependency_proposal_third_party_declined_name: "Dependency Declined"
  ca_dependency_proposal_third_party_declined_desc: "[SCOPE.sCountry('target_country').GetName] has declined becoming a [Concept('concept_ca_dependency', '$concept_ca_dependency$')]."
  ca_dependency_action_notification_third_party_break_name: "Dependency Pact Broken"
  ca_dependency_action_notification_third_party_break_desc: "The [Concept('concept_ca_dependency', '$concept_ca_dependency$')] pact between [SCOPE.sCountry('actor').GetName] and [SCOPE.sCountry('target_country').GetName] has been broken."
