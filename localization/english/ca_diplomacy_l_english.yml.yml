l_english:
  # --- CONFEDERATIVE DEFENSIVE PACT ---
  ca_defensive_pact_confederation: "Confederative Defensive Pact"
  ca_defensive_pact_confederation_desc: "A mutual defense agreement exclusive to members of the Central American Confederation."
  ca_defensive_pact_confederation_action_notification_name: "Confederative Defense Proposed"
  ca_defensive_pact_confederation_action_notification_desc: "The federal government proposes a formal military coordination."
  ca_defensive_pact_confederation_action_propose_name: "Propose Confederative Defense"
  ca_defensive_pact_confederation_action_break_name: "Break Confederative Defense"
  ca_defensive_pact_confederation_pact_desc: "Defensive alliance within the Confederation."
  ca_defensive_pact_confederation_action_notification_break_name: "Defense Pact Dissolved"
  ca_defensive_pact_confederation_action_notification_break_desc: "The defensive coordination between our states has ended."

  # --- CENTRAL AMERICAN DEPENDENCY ---
  ca_dependency: "Dependency"
  ca_dependency_action_name: "[concept_dependency]"
  ca_dependency_action_propose_name: "Make into [concept_dependency]"
  ca_dependency_action_break_name: "Grant Independence"
  ca_dependency_action_ask_to_break_name: "Demand Independence"
  ca_dependency_desc: "#header $dependency$#!\n$TOOLTIP_DELIMITER$\nA [concept_diplomatic_pact] that establishes a [concept_dependency] type [concept_subject] relationship between two [Concept('concept_country', '$concept_countries$')]."
  ca_dependency_pact_desc: "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a [concept_dependency] of [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
  ca_dependency_action_notification_name: "Demand for Union"
  ca_dependency_action_notification_desc: "[INITIATOR_COUNTRY.GetName] demands that we submit to them and form a [concept_dependency]."
  ca_dependency_action_notification_break_name: "Independence Granted"
  ca_dependency_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] have ended our [concept_dependency]. We are independent once again."
  ca_dependency_proposal_notification_break_name: "Demand for Independence"
  ca_dependency_proposal_notification_break_desc: "[INITIATOR_COUNTRY.GetName] are demanding that we end our [concept_dependency] with them."
  ca_dependency_proposal_notification_break_effects_desc: "If we accept, they will become fully independent."
  ca_dependency_proposal_break_accepted_name: "Independence Granted"
  ca_dependency_proposal_break_accepted_desc: "[TARGET_COUNTRY.GetName] accepted the demand to end our [concept_dependency]. We are independent once again."
  ca_dependency_proposal_break_declined_name: "Independence Refused"
  ca_dependency_proposal_break_declined_desc: "[TARGET_COUNTRY.GetName] refused the demand to end our [concept_dependency]."
  ca_dependency_proposal_third_party_break_accepted_name: "Independence Granted"
  ca_dependency_proposal_third_party_break_accepted_desc: "[TARGET_COUNTRY.GetName] ended their [concept_dependency] with [INITIATOR_COUNTRY.GetName], granting them full independence."
  ca_dependency_proposal_third_party_break_declined_name: "Independence Refused"
  ca_dependency_proposal_third_party_break_declined_desc: "[TARGET_COUNTRY.GetName] refused to end their [concept_dependency] with [INITIATOR_COUNTRY.GetName]."

  ca_federal_dependency: "Federal Dependency"
  ca_federal_dependency_desc: "A state with limited sovereignty, directly overseen by the Federal District."
  ca_federal_dependency_action_notification_name: "Dependency Status Applied"
  ca_federal_dependency_action_notification_desc: "A new state has been integrated as a federal dependency."
  ca_federal_dependency_action_propose_name: "Establish Dependency"
  ca_federal_dependency_action_break_name: "Grant Independence"
  ca_federal_dependency_action_ask_to_break_name: "Demand End of Dependency"
  ca_federal_dependency_pact_desc: "Is a Federal Dependency of [ROOT.GetCountry.GetName]."
  ca_federal_dependency_proposal_notification_break_name: "Dependency Termination Requested"
  ca_federal_dependency_proposal_notification_break_desc: "The dependency seeks to alter its status within the federation."
  ca_federal_dependency_proposal_break_accepted_name: "Dependency Ended"
  ca_federal_dependency_proposal_break_accepted_desc: "The dependency is no longer under our direct supervision."
  ca_federal_dependency_proposal_break_declined_name: "Dependency Maintained"
  ca_federal_dependency_proposal_break_declined_desc: "The federal government has refused to release the dependency."
  # --- AUTONOMOUS PROVINCE ---
  ca_autonomous_province: "Autonomous Province"
  ca_autonomous_province_desc: "A member state with high internal freedom but linked to the Central American market and foreign policy."
  ca_autonomous_province_action_notification_name: "Autonomy Granted"
  ca_autonomous_province_action_notification_desc: "The state has been recognized as an Autonomous Province."
  ca_autonomous_province_action_propose_name: "Grant Provincial Autonomy"
  ca_autonomous_province_action_break_name: "Revoke Autonomy"
  ca_autonomous_province_action_ask_to_break_name: "Renounce Autonomy"
  ca_autonomous_province_pact_desc: "Member state of the Central American Confederation."
  ca_autonomous_province_proposal_notification_break_name: "Status Change Requested"
  ca_autonomous_province_proposal_notification_break_desc: "The province wishes to change its confederative status."
  ca_autonomous_province_proposal_break_accepted_name: "Autonomy Change Accepted"
  ca_autonomous_province_proposal_break_accepted_desc: "The provincial status has been successfully modified."
  ca_autonomous_province_proposal_break_declined_name: "Autonomy Change Refused"
  ca_autonomous_province_proposal_break_declined_desc: "The federal authority has denied the change in provincial status."
  
  # --- CHARTERED COMPANY ---
  ca_chartered_company: "Central American Chartered Company"
  ca_chartered_company_desc: "A corporate entity granted administrative rights over a specific territory for economic exploitation."
  ca_chartered_company_action_notification_name: "Company Charter Granted"
  ca_chartered_company_action_notification_desc: "A new territory is now managed by a Chartered Company."
  ca_chartered_company_action_propose_name: "Grant Business Charter"
  ca_chartered_company_action_break_name: "Dissolve Charter"
  ca_chartered_company_pact_desc: "Operates under a Federal Charter from [ROOT.GetCountry.GetName]."
  ca_chartered_company_action_notification_break_name: "Charter Dissolved"
  ca_chartered_company_action_notification_break_desc: "The corporate administration of the territory has ended."