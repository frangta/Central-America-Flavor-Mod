 # =========================================================================
 # CAFM - Costa Rica journals (mother journal + chapters)
 # je_ca_historic_situation_in_costarica and je_ca_pacificacion_norte keep
 # their existing name/_reason keys in content_ca_flavor_1_l_english.yml
 # =========================================================================

 # --- Mother journal: status and goals ---
 je_ca_historic_situation_in_costarica_status_inicio:0 "San José rules the Free State, but Cartago, Heredia and Alajuela have not forgotten the War of the League."
 je_ca_historic_situation_in_costarica_status_separatista:0 "Costa Rica walks its own path. Carrillo's order must now survive the Federation's champions."
 je_ca_historic_situation_in_costarica_status_federal:0 "Costa Rica remains within the Federation. Its institutions must prove they can govern without a strongman."
 je_ca_historic_situation_in_costarica_goal_carrillo:0 "The threat of Morazán's return has been overcome"
 je_ca_historic_situation_in_costarica_goal_federal:0 "Remain in the Federation with at least #v 60#! Sovereignty after 1840"
 je_ca_historic_situation_in_costarica_fail_colapso:0 "San José's Sovereignty falls to #v 0#!"
 je_ca_historic_situation_in_costarica_fail_morazan:0 "Morazán seizes power in San José"

 # --- Sovereignty bar ---
 ca_cos_soberania_bar_name:0 "Sovereignty of San José"
 ca_cos_soberania_bar_desc:0 "How firmly San José holds the Free State together. If it falls to zero, the League will rise again."
 ca_cos_soberania_carrillo_desc:0 "Braulio Carrillo governs"
 ca_cos_soberania_army_desc:0 "The Armed Forces are in government"
 ca_cos_soberania_bases_desc:0 "The Law of Bases and Guarantees is in force"
 ca_cos_soberania_federalists_desc:0 "The federalist liberals are powerful"
 ca_cos_soberania_turmoil_desc:0 "Turmoil in Costa Rica"
 ca_cos_soberania_guanacaste_desc:0 "Guanacaste has been lost"

 # --- Chapter B: Bocas del Toro ---
 je_ca_cos_bocas_del_toro:0 "The Question of Bocas del Toro"
 je_ca_cos_bocas_del_toro_reason:0 "British woodcutters and New Granadan garrisons contest the Caribbean coast that Costa Rica claims under the Royal Order of 1803. Whether the Federation stands with us will shape how San José sees the Union."
 je_ca_cos_bocas_del_toro_status_inicio:0 "Our claim to Bocas del Toro awaits a response."
 je_ca_cos_bocas_del_toro_status_reclamo:0 "Galindo's expedition has planted our claim on the Caribbean coast."
 je_ca_cos_bocas_del_toro_status_perdido:0 "New Granada has expelled our officials. San José waits for the Federation to answer."

 # --- Chapter C: The Ballot and the Barracks ---
 je_ca_cos_urnas_y_cuartel:0 "The Ballot and the Barracks"
 je_ca_cos_urnas_y_cuartel_reason:0 "Carrillo's term is ending. The electors of 1837 will choose between the constitutional order of Manuel Aguilar and the iron hand of the Architect of the State, but the barracks of San José may have the final word."

 # --- Chapter D: The Return of the Eagle ---
 je_ca_cos_regreso_aguila:0 "The Return of the Eagle"
 je_ca_cos_regreso_aguila_reason:0 "Francisco Morazán has not accepted defeat. From exile he plans his return to Central America, and Costa Rica, ruled by the man who broke with the Federation, is his most likely landing point."

 # --- Light failure: The Fall of Morazán ---
 je_ca_cos_caida_morazan:0 "The Fall of Morazán"
 je_ca_cos_caida_morazan_reason:0 "Morazán rules in San José and demands men and money to rebuild the Federation by force. Every forced loan and every levy turns the Josefinos against him."
 ca_cos_descontento_bar_name:0 "Josefino Discontent"
 ca_cos_descontento_bar_desc:0 "When discontent is complete, San José will rise against Morazán."
 ca_cos_descontento_base_desc:0 "Forced loans and conscription for the Federal war"
 ca_cos_descontento_war_desc:0 "We are at war"
 ca_cos_descontento_liberals_desc:0 "The liberals are in government"

 # --- Severe failure: The New League ---
 je_ca_cos_nueva_liga:0 "The New League"
 je_ca_cos_nueva_liga_reason:0 "Cartago, Heredia and Alajuela have broken away, as they tried in 1835, and Guanacaste has gone its own way. San José can reunite the country by arms, or by a pact among equals."
 je_ca_cos_nueva_liga_goal_armas:0 "By arms: no city of the League remains independent"
 je_ca_cos_nueva_liga_goal_pacto:0 "By pact: Reunification reaches #v 100#!"
 ca_cos_reunificacion_bar_name:0 "Reunification by Pact"
 ca_cos_reunificacion_bar_desc:0 "Negotiations with the cities of the League toward a Confederation of Costa Rica."
 ca_cos_reunificacion_base_desc:0 "Ongoing negotiations"
 ca_cos_reunificacion_liberals_desc:0 "The liberals favor a pact among equals"
 ca_cos_reunificacion_war_desc:0 "War poisons the negotiations"

 # --- Events ---
 ca_costa_rica_events.300.t:0 "The Consolidated State"
 ca_costa_rica_events.300.d_carrillo:0 "The Eagle's shadow has passed, and the Law of Bases and Guarantees stands. Whatever history says of Braulio Carrillo, he has left behind a state that answers to San José alone: roads, courts, coffee and order."
 ca_costa_rica_events.300.d_federal:0 "Against every prediction, Costa Rica has remained within the Federation without falling into anarchy. Its institutions have endured, and San José speaks in the federal congress with a voice of its own."
 ca_costa_rica_events.300.f:0 "The age of the League is over."
 ca_costa_rica_events.300.a:0 "The Architect's work endures."
 ca_costa_rica_events.300.b:0 "A loyal and stable state."

 ca_costa_rica_events.310.t:0 "The League Rises Again"
 ca_costa_rica_events.310.d:0 "San José's authority has collapsed. Cartago has proclaimed its independence and Heredia and Alajuela have followed, just as they did in 1835. Guanacaste no longer answers our messengers. The Free State of Costa Rica is now a handful of quarrelling cities."
 ca_costa_rica_events.310.f:0 "Four cities, four flags."
 ca_costa_rica_events.310.a:0 "San José will reunite Costa Rica."

 ca_costa_rica_events.320.t:0 "The Eagle in San José"
 ca_costa_rica_events.320.d:0 "13 April 1842. Francisco Morazán has entered San José at the head of the very army that was sent to stop him. The Constituent Assembly has named him Supreme Chief. Carrillo will sail from Puntarenas into exile in El Salvador."
 ca_costa_rica_events.320.f:0 "The Federation returns, carried on bayonets."
 ca_costa_rica_events.320.a:0 "Costa Rica submits to the Eagle."

 ca_costa_rica_events.330.t:0 "The Failed Coup"
 ca_costa_rica_events.330.d:0 "27 May 1838. The garrison of San José refused to follow Carrillo. Manuel Aguilar remains Head of State, and the constitutional order has survived its hardest test."
 ca_costa_rica_events.330.f:0 "The law has held."
 ca_costa_rica_events.330.a:0 "The constitution prevails. Carrillo goes into exile."
 ca_costa_rica_events.330.b:0 "Pardon the conspirators to calm the barracks."

 ca_costa_rica_events.340.t:0 "The Landing at Caldera"
 ca_costa_rica_events.340.d:0 "7 April 1842. Morazán has landed at Caldera with his veterans. Carrillo sends General Vicente Villaseñor with four hundred men to meet him."
 ca_costa_rica_events.340.f:0 "Everything depends on the loyalty of one army."
 ca_costa_rica_events.340.a:0 "Villaseñor, march to the coast."
 ca_costa_rica_events.340.b:0 "The Pact of El Jocote: the army goes over to Morazán."

 ca_costa_rica_events.350.t:0 "The September Revolt"
 ca_costa_rica_events.350.d:0 "11 September 1842. San José has risen against Morazán. António Pinto Soares leads some four hundred men against the Eagle's guard of forty. After eighty-eight hours of fighting, Morazán fled toward Cartago, where Pedro Mayorga betrayed him. He has been captured with Villaseñor, Saravia and Cabañas."
 ca_costa_rica_events.350.f:0 "The Eagle falls in San José."
 ca_costa_rica_events.350.a:0 "The firing squad, as on 15 September 1842."
 ca_costa_rica_events.350.b:0 "Exile the Eagle and spare the country a martyr."

 ca_costa_rica_events.360.t:0 "The Pact of Confederation"
 ca_costa_rica_events.360.d:0 "The delegates of San José, Cartago, Heredia and Alajuela have signed a pact among equals. Each city keeps its councils, but all now answer to a single Confederation."
 ca_costa_rica_events.360.f:0 "Costa Rica reborn as a confederation."
 ca_costa_rica_events.360.a:0 "Long live the Confederation of Costa Rica!"

 ca_costa_rica_events.361.t:0 "Unity by Arms"
 ca_costa_rica_events.361.d:0 "The last rebel city has surrendered. Costa Rica is one again, united under San José as Carrillo always intended."
 ca_costa_rica_events.361.f:0 "One state, one capital."
 ca_costa_rica_events.361.a:0 "Never again."

 ca_costa_rica_events.362.t:0 "The Sovereign Cities"
 ca_costa_rica_events.362.d:0 "A decade has passed and the cities of the League have learned to live apart. The dream of a single Costa Rica is fading."
 ca_costa_rica_events.362.f:0 "Some wounds become borders."
 ca_costa_rica_events.362.a:0 "So be it."
