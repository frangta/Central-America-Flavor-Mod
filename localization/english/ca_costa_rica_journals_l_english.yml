 # --- Mother journal: status and goals ---
 je_ca_historic_situation_in_costarica_status_inicio:0 "San José rules the Free State, but Cartago, Heredia and Alajuela have not forgotten the War of the League."
 je_ca_historic_situation_in_costarica_status_separatista:0 "Costa Rica walks its own path. Carrillo's order must now survive the Federation's champions."
 je_ca_historic_situation_in_costarica_status_federal:0 "Costa Rica remains within the Federation. Its institutions must prove they can govern without a strongman."
 je_ca_historic_situation_in_costarica_goal_carrillo:0 "The threat of Morazán's return has been overcome"
 je_ca_historic_situation_in_costarica_goal_federal:0 "Remain in the Federation with at least #v 60#! Sovereignty after 1840"
 je_ca_historic_situation_in_costarica_fail_colapso:0 "San José's Sovereignty falls to #v 0#!"
 je_ca_historic_situation_in_costarica_fail_morazan:0 "Morazán seizes power in San José"

 # --- Sovereignty bar ---
 ca_cos_soberania_bar_name:0 "Sovereignty of San José"
 ca_cos_soberania_bar_desc:0 "How firmly San José holds the Free State together. If it falls to zero, the League will rise again."
 ca_cos_soberania_carrillo_desc:0 "Braulio Carrillo governs"
 ca_cos_soberania_army_desc:0 "The Armed Forces are in government"
 ca_cos_soberania_bases_desc:0 "The Law of Bases and Guarantees is in force"
 ca_cos_soberania_federalists_desc:0 "The federalist liberals are powerful"
 ca_cos_soberania_turmoil_desc:0 "Turmoil in Costa Rica"
 ca_cos_soberania_guanacaste_desc:0 "Guanacaste has been lost"

 # --- Chapter B: Bocas del Toro ---
 je_ca_cos_bocas_del_toro:0 "The Question of Bocas del Toro"
 je_ca_cos_bocas_del_toro_reason:0 "British woodcutters and New Granadan garrisons contest the Caribbean coast that Costa Rica claims under the Royal Order of 1803. Whether the Federation stands with us will shape how San José sees the Union."
 je_ca_cos_bocas_del_toro_status_inicio:0 "Our claim to Bocas del Toro awaits a response."
 je_ca_cos_bocas_del_toro_status_reclamo:0 "Galindo's expedition has planted our claim on the Caribbean coast."
 je_ca_cos_bocas_del_toro_status_perdido:0 "New Granada has expelled our officials. San José waits for the Federation to answer."

 # --- Chapter C: The Ballot and the Barracks ---
 je_ca_cos_urnas_y_cuartel:0 "The Ballot and the Barracks"
 je_ca_cos_urnas_y_cuartel_reason:0 "Carrillo's term is ending. The electors of 1837 will choose between the constitutional order of Manuel Aguilar and the iron hand of the Architect of the State, but the barracks of San José may have the final word."

 # --- Chapter D: The Return of the Eagle ---
 je_ca_cos_regreso_aguila:0 "The Return of the Eagle"
 je_ca_cos_regreso_aguila_reason:0 "Francisco Morazán has not accepted defeat. From exile he plans his return to Central America, and Costa Rica, ruled by the man who broke with the Federation, is his most likely landing point."

 # --- Light failure: The Fall of Morazán ---
 je_ca_cos_caida_morazan:0 "The Fall of Morazán"
 je_ca_cos_caida_morazan_reason:0 "Morazán rules in San José and demands men and money to rebuild the Federation by force. Every forced loan and every levy turns the Josefinos against him."
 ca_cos_descontento_bar_name:0 "Josefino Discontent"
 ca_cos_descontento_bar_desc:0 "When discontent is complete, San José will rise against Morazán."
 ca_cos_descontento_base_desc:0 "Forced loans and conscription for the Federal war"
 ca_cos_descontento_war_desc:0 "We are at war"
 ca_cos_descontento_liberals_desc:0 "The liberals are in government"

 # --- Severe failure: The New League ---
 je_ca_cos_nueva_liga:0 "The New League"
 je_ca_cos_nueva_liga_reason:0 "Cartago, Heredia and Alajuela have broken away, as they tried in 1835, and Guanacaste has gone its own way. San José can reunite the country by arms, or by a pact among equals."
 je_ca_cos_nueva_liga_goal_armas:0 "By arms: no city of the League remains independent"
 je_ca_cos_nueva_liga_goal_pacto:0 "By pact: Reunification reaches #v 100#!"
 ca_cos_reunificacion_bar_name:0 "Reunification by Pact"
 ca_cos_reunificacion_bar_desc:0 "Negotiations with the cities of the League toward a Confederation of Costa Rica."
 ca_cos_reunificacion_base_desc:0 "Ongoing negotiations"
 ca_cos_reunificacion_liberals_desc:0 "The liberals favor a pact among equals"
 ca_cos_reunificacion_war_desc:0 "War poisons the negotiations"

