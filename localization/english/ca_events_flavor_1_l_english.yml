 ca_central_america.35.d:0 "The federal government has authorized a military campaign to restore constitutional order in Costa Rica."

 ca_central_america.36.d:0 "Federal troops are mobilizing towards Honduras to support loyalist elements and crush the rebellion."

 ca_central_america.37.d:0 "Green light has been given to pacify Nicaragua and depose the separatist authorities by force."

 ca_central_america.38.d:0 "The federal army will take direct control of security in the state of El Salvador to prevent further anarchy."

 ca_central_america.39.d:0 "Despite past tensions, the federal army will intervene to protect the state of Guatemala from the peasant revolt."

 ca_central_america.40.d:0 "Tensions are rising across the member states."
 

