 ca_prospecting.1.t:0 "Gold in the Riverbeds"
 ca_prospecting.1.d:0 "Our surveyors in [SCOPE.sState('target_state').GetName] have found traces of gold in the riverbeds. The news will not stay secret for long, and the question is who will profit from it: the prospectors who rush to the rivers, or the State itself."
 ca_prospecting.1.f:0 "Where there is gold, there are always too many owners."
 ca_prospecting.1.a:0 "Open the deposits to mining."
 ca_prospecting.1.b:0 "Declare the gold property of the State."

 ca_prospecting.2.t:0 "Iron in the Hills"
 ca_prospecting.2.d:0 "Deep veins of iron have been mapped in the hills of [SCOPE.sState('target_state').GetName]. Mining them will require land that is today farmed by peasants and coveted by the local landowners."
 ca_prospecting.2.f:0 "Iron for rails, iron for rifles, iron for the future."
 ca_prospecting.2.a:0 "Mark the veins for exploitation."
 ca_prospecting.2.b:0 "Mine them, but protect the peasants' fields."

 ca_prospecting.3.t:0 "The Breath of the Volcano"
 ca_prospecting.3.d:0 "Around the fumaroles of a volcano in [SCOPE.sState('target_state').GetName], our surveyors have found thick crusts of sulfur. The army is already asking for it: without sulfur there is no gunpowder."
 ca_prospecting.3.f:0 "The mountain smokes, and the generals smile."
 ca_prospecting.3.a:0 "Register the sulfur deposits."
 ca_prospecting.3.b:0 "Hand the deposits over to the army."

 ca_prospecting.4.t:0 "A Modest Lead Deposit"
 ca_prospecting.4.d:0 "A small lead deposit has been found in [SCOPE.sState('target_state').GetName]. It is not a great fortune, and the survey team is anxious to move on to more promising regions."
 ca_prospecting.4.f:0 "Not every discovery changes the destiny of a nation."
 ca_prospecting.4.a:0 "Mark it for future exploitation."
 ca_prospecting.4.b:0 "Record it and push the survey forward."

 ca_prospecting.5.t:0 "The Gold of the Highlands"
 ca_prospecting.5.d:0 "In [SCOPE.sState('target_state').GetName], where the Spanish once worked mines long abandoned, our geologists have found gold veins far richer than anyone suspected. The local landowners are already offering to buy the concession."
 ca_prospecting.5.f:0 "The old colonial mines were not exhausted. They were only forgotten."
 ca_prospecting.5.a:0 "The State will develop the mines."
 ca_prospecting.5.b:0 "Sell the concession to the landowners."

 ca_prospecting.6.t:0 "Gold Fever"
 ca_prospecting.6.d:0 "Word of a gold find in [SCOPE.sState('target_state').GetName] has spread like wildfire. Peasants abandon the haciendas to try their luck in the rivers, and the landowners complain that no one is left to bring in the harvest."
 ca_prospecting.6.f:0 "Every man with a pan believes he will be the next rich man."
 ca_prospecting.6.a:0 "Let the gold rush run its course."
 ca_prospecting.6.b:0 "Sell mining permits and tax the prospectors."

 ca_prospecting.7.t:0 "Coal Seams"
 ca_prospecting.7.d:0 "Coal seams have been found in [SCOPE.sState('target_state').GetName]. A group of well-connected industrialists offers to develop them at once, if the government grants them the concession without too many questions."
 ca_prospecting.7.f:0 "The fuel of the steam age, buried beneath our feet."
 ca_prospecting.7.a:0 "Register the coal for future exploitation."
 ca_prospecting.7.b:0 "Grant the concession to the industrialists."

 ca_prospecting.8.t:0 "Black Seeps in Panama"
 ca_prospecting.8.d:0 "Thanks to modern prospecting techniques, our geologists have confirmed that the black seeps found in [SCOPE.sState('target_state').GetName] are petroleum. A foreign firm offers a fortune for the exclusive rights."
 ca_prospecting.8.f:0 "The natives used it to caulk their canoes. The foreigners want it for their machines."
 ca_prospecting.8.a:0 "The oil will remain in national hands."
 ca_prospecting.8.b:0 "Sell the rights to the foreign firm."

 ca_prospecting.9.t:0 "Mine or Farm?"
 ca_prospecting.9.d:0 "A fertile valley in [SCOPE.sState('target_state').GetName] hides a sulfur deposit beneath its fields. We can open a mine and build roads to it, or leave the soil to the farmers who already work it."
 ca_prospecting.9.f:0 "The same valley cannot feed both a mine and a village."
 ca_prospecting.9.a:0 "Open the mine and build the roads."
 ca_prospecting.9.b:0 "Leave the valley to the farmers."

 ca_prospecting.10.t:0 "A Botched Survey"
 ca_prospecting.10.d:0 "Foreign engineers have discovered that many of our survey maps are grossly wrong: rivers in the wrong place, mountains that do not exist, deposits invented to justify expenses. The foreign press is mocking us."
 ca_prospecting.10.f:0 "It seems our geologists preferred the café to the mountains."
 ca_prospecting.10.a:0 "Admit the error publicly."
 ca_prospecting.10.b:0 "Quietly discard the maps and start over."

 ca_prospecting.11.t:0 "Volcanic Soils"
 ca_prospecting.11.d:0 "The survey has identified vast stretches of rich volcanic soil in [SCOPE.sState('target_state').GetName], ideal for cultivation. The landowners want to buy it; the peasants hope it will be distributed among them."
 ca_prospecting.11.f:0 "The volcano that destroys is also the volcano that feeds."
 ca_prospecting.11.a:0 "Open the land to settlement and cultivation."
 ca_prospecting.11.b:0 "Sell the land to the landowners."

 ca_prospecting.12.t:0 "Mulberries in the Highlands"
 ca_prospecting.12.d:0 "Botanists traveling with the survey report that the climate of [SCOPE.sState('target_state').GetName] is well suited for mulberry trees, and therefore for raising silkworms."
 ca_prospecting.12.f:0 "Silk from Central America? Stranger things have been seen."
 ca_prospecting.12.a:0 "Encourage the planting of mulberries."
 ca_prospecting.12.b:0 "Fund a proper scientific study."

 ca_prospecting.13.t:0 "Slopes for Tea"
 ca_prospecting.13.d:0 "The cool, misty slopes of [SCOPE.sState('target_state').GetName] resemble the tea gardens of Asia, according to one of the survey's naturalists."
 ca_prospecting.13.f:0 "Coffee has a rival, at least on paper."
 ca_prospecting.13.a:0 "Plant tea on the slopes."
 ca_prospecting.13.b:0 "Note it and keep surveying."

 ca_prospecting.14.t:0 "Cotton Lands"
 ca_prospecting.14.d:0 "The lowlands of [SCOPE.sState('target_state').GetName] are suitable for cotton. British merchants have already shown interest in buying the raw fiber, though our own manufacturers would rather keep it for themselves."
 ca_prospecting.14.f:0 "The mills of Manchester are always hungry."
 ca_prospecting.14.a:0 "Encourage cotton cultivation."
 ca_prospecting.14.b:0 "Invite the British cotton buyers."

 ca_prospecting.15.t:0 "Old Mission Vineyards"
 ca_prospecting.15.d:0 "In [SCOPE.sState('target_state').GetName] the survey has found the remains of vineyards planted by missionaries in colonial times. The vines still grow wild among the ruins."
 ca_prospecting.15.f:0 "The friars always knew where the good land was."
 ca_prospecting.15.a:0 "Restore the vineyards for commerce."
 ca_prospecting.15.b:0 "Leave the vines to the Church."

 ca_prospecting.16.t:0 "The Poppy Fields"
 ca_prospecting.16.d:0 "The survey reports that the soil of [SCOPE.sState('target_state').GetName] is ideal for the opium poppy. Foreign merchants would pay well, but the clergy has already denounced the idea from the pulpit."
 ca_prospecting.16.f:0 "A profitable flower, and a dangerous one."
 ca_prospecting.16.a:0 "Allow the cultivation of poppies."
 ca_prospecting.16.b:0 "Ban the poppy and keep the peace."

 ca_prospecting.17.t:0 "Draining the Marshes"
 ca_prospecting.17.d:0 "Large marshes in [SCOPE.sState('target_state').GetName] could become fertile farmland if drained. The works would be expensive, and local merchants suggest leaving the task to private initiative."
 ca_prospecting.17.f:0 "Mosquitoes today, harvests tomorrow."
 ca_prospecting.17.a:0 "Fund the drainage works."
 ca_prospecting.17.b:0 "Leave it to private initiative."

 ca_prospecting.18.t:0 "Communal Lands in the Way"
 ca_prospecting.18.d:0 "The best lands identified in [SCOPE.sState('target_state').GetName] belong to indigenous and peasant communities that have worked them in common for generations. Opening them to commercial cultivation would mean taking them away."
 ca_prospecting.18.f:0 "They have no deeds, only centuries of memory."
 ca_prospecting.18.a:0 "Seize the communal lands for cultivation."
 ca_prospecting.18.b:0 "Respect the communal lands."

 ca_prospecting.19.t:0 "Landslide at the Dig Site"
 ca_prospecting.19.d:0 "Heavy rains have caused a landslide at one of the survey's excavation sites in [SCOPE.sState('target_state').GetName]. Workers are trapped beneath the mud, and the engineers ask whether they should stop the work."
 ca_prospecting.19.f:0 "The mountain always collects its toll."
 ca_prospecting.19.a:0 "Stop the work and rescue the survivors."
 ca_prospecting.19.b:0 "Keep digging, whatever the cost."

 ca_prospecting.20.t:0 "Poisoned Air"
 ca_prospecting.20.d:0 "The sulfur mines of [SCOPE.sState('target_state').GetName] are filling the air with choking fumes. Crops wither, and the villagers blame the mine for coughs and fevers."
 ca_prospecting.20.f:0 "The mine smells of money. The village smells of death."
 ca_prospecting.20.a:0 "Production comes first."
 ca_prospecting.20.b:0 "Invest in ventilation and cleaner methods."

 ca_prospecting.21.t:0 "Lost in the Wilderness"
 ca_prospecting.21.d:0 "One of our survey expeditions has not reported back for weeks. The last news placed it deep in unexplored territory. Sending a search party would delay the entire survey."
 ca_prospecting.21.f:0 "The maps end where the jungle begins."
 ca_prospecting.21.a:0 "Send a search party."
 ca_prospecting.21.b:0 "Trust them to find their way back."

 ca_prospecting.22.t:0 "Indigenous Lands"
 ca_prospecting.22.d:0 "The survey has reached lands in [SCOPE.sState('target_state').GetName] inhabited by communities who refuse to let the surveyors pass. They fear, not without reason, that the maps are the first step toward taking their land."
 ca_prospecting.22.f:0 "For them, every surveyor's stake is a border being drawn against them."
 ca_prospecting.22.a:0 "Clear the way by force."
 ca_prospecting.22.b:0 "Negotiate and compensate the communities."

 ca_prospecting.23.t:0 "Bandits on the Survey Route"
 ca_prospecting.23.d:0 "Gangs of bandits are attacking survey parties and settlers along the roads of [SCOPE.sState('target_state').GetName], stealing equipment and supplies."
 ca_prospecting.23.f:0 "In the mountains, the law is whoever holds the rifle."
 ca_prospecting.23.a:0 "Arm the settlers and let them deal with it."
 ca_prospecting.23.b:0 "Send the army to clear the roads."

 ca_prospecting.24.t:0 "Jungle Fever"
 ca_prospecting.24.d:0 "Malaria and yellow fever are decimating the survey teams in the jungle regions. Porters are deserting, and those who remain can barely stand."
 ca_prospecting.24.f:0 "The jungle does not need soldiers to defend itself."
 ca_prospecting.24.a:0 "Pull back and treat the sick."
 ca_prospecting.24.b:0 "Press on through the jungle."

 ca_prospecting.25.t:0 "A Foreign Iron Consortium"
 ca_prospecting.25.d:0 "A consortium of European investors offers to develop the iron deposits of [SCOPE.sState('iron_state').GetName] with modern machinery, in exchange for a long-term monopoly. The officers of the army insist that iron is too important to be left in foreign hands."
 ca_prospecting.25.f:0 "Whoever controls the iron controls the rifles and the rails."
 ca_prospecting.25.a:0 "Accept the foreign consortium."
 ca_prospecting.25.b:0 "Keep the iron under national control."

 ca_prospecting.26.t:0 "Who Pays for the Survey?"
 ca_prospecting.26.d:0 "The survey has exhausted its budget. We can mortgage future revenues to foreign lenders, or demand that the States contribute to the costs, at the risk of angering the provinces."
 ca_prospecting.26.f:0 "Everyone wants the riches of the subsoil; nobody wants to pay for the maps."
 ca_prospecting.26.a:0 "Mortgage future revenues."
 ca_prospecting.26.b:0 "Demand contributions from the States."

 ca_prospecting.27.t:0 "A Survey Amid Unrest"
 ca_prospecting.27.d:0 "The arrival of the surveyors in [SCOPE.sState('target_state').GetName] has inflamed an already restless region. The landowners want the work to continue under military escort; the peasants demand that it stop."
 ca_prospecting.27.f:0 "In a region on the edge of revolt, a surveyor looks like a tax collector."
 ca_prospecting.27.a:0 "Side with the landowners."
 ca_prospecting.27.b:0 "Pause the survey and calm the region."

 ca_prospecting.28.t:0 "The Geological Spy"
 ca_prospecting.28.d:0 "Our guards have caught a man copying the survey maps in secret. He confesses to working for a foreign power eager to know the wealth of our subsoil."
 ca_prospecting.28.f:0 "Our maps are worth more abroad than at home."
 ca_prospecting.28.a:0 "Arrest him publicly."
 ca_prospecting.28.b:0 "Pay him off and bury the matter."

 ca_prospecting.29.t:0 "Ruins in the Jungle"
 ca_prospecting.29.d:0 "Guided by local Maya communities, our surveyors have uncovered the ruins of an ancient city in [SCOPE.sState('target_state').GetName]. Scholars call it a treasure of humanity; foreign collectors are already offering money for the artifacts."
 ca_prospecting.29.f:0 "The past of our land is older than any republic."
 ca_prospecting.29.a:0 "Protect the ruins for science and the nation."
 ca_prospecting.29.b:0 "Sell the artifacts to foreign collectors."

 ca_prospecting.30.t:0 "Who Guards the Surveyors?"
 ca_prospecting.30.d:0 "After repeated attacks on survey parties, the officers of the army propose to place the entire survey under military command. The alternative is to pay for private escorts out of the Treasury."
 ca_prospecting.30.f:0 "Science marches, but it marches better with bayonets."
 ca_prospecting.30.a:0 "Pay for private escorts."
 ca_prospecting.30.b:0 "Place the survey under military command."
 ##############
 #ca_prospecting.1.t: "Funding the Geological Survey"
 #ca_prospecting.1.d: "Mapping the rugged terrain of Central America is no small feat. Dense jungles, steep mountains, and tropical diseases stand between us and the wealth beneath our soil. How much of the national treasury are we willing to risk on this endeavor?"
 #ca_prospecting.1.a: "Equip them with the bare minimum."
 #ca_prospecting.1.b: "Provide adequate funding and supplies."
 #ca_prospecting.1.c: "Spare no expense. Bring the best experts!"
 #
 #ca_prospecting.2.t: "Disaster in the Highlands"
 #ca_prospecting.2.d: "Tragedy has struck our expedition. Heavy rains triggered a massive mudslide that not only buried our equipment and delayed our survey, but also permanently ruined several fertile terraces cultivated by local farmers."
 #ca_prospecting.2.a: "A terrible setback."
 #
 #ca_prospecting.3.t: "Clearing the Path to Progress"
 #ca_prospecting.3.d: "While carving paths through the dense vegetation for our geologists, the expedition has inadvertently cleared large tracts of highly fertile land. Local farmers are already rushing in to plant new crops."
 #ca_prospecting.3.a: "A fortunate side effect!"
 #
 #ca_prospecting.4.t: "Local Resistance"
 #ca_prospecting.4.d: "Rural communities have barricaded the roads, fearful that the arrival of state prospectors means the seizure of their ancestral lands for mining operations."
 #ca_prospecting.4.a: "Disperse them! Progress cannot be halted."
 #ca_prospecting.4.b: "Halt the survey. We must negotiate."
 #
 #ca_prospecting.5.t: "A Deep Vein Discovered"
 #ca_prospecting.5.d: "Our geologists have struck the motherlode! However, the vein runs deep below the water table. Simple picks and shovels will no longer suffice; we will need industrial pumps to extract this wealth."
 #ca_prospecting.5.a: "Mandate the use of heavy machinery."
 #ca_prospecting.5.b: "Note the location for future exploitation."
 #
 #ca_prospecting.6.t: "Local Gold Rush"
 #ca_prospecting.6.d: "News of gold nuggets found in a local river has spread like wildfire. Thousands of peasants are abandoning their harvests, rushing to the hills with pans and pickaxes in hopes of striking it rich."
 #ca_prospecting.6.a: "There's gold in those hills!"
 #
 #ca_prospecting.7.t: "The Foreign Consortium"
 #ca_prospecting.7.d: "A wealthy consortium of foreign investors has approached our government. They offer to fully finance the remainder of our geological survey, provided they are granted exclusive tax-exempt rights to the most lucrative mines."
 #ca_prospecting.7.a: "Accept their capital. We need the progress."
 #ca_prospecting.7.b: "Reject them. Our soil belongs to our people."
 #
 #ca_prospecting.8.t: "Missing Funds"
 #ca_prospecting.8.d: "A scandalous audit has revealed that a significant portion of the survey's budget has been embezzled by a regional governor and his landowning cronies to buy private estates."
 #ca_prospecting.8.a: "Arrest the thieves and seize the assets!"
 #ca_prospecting.8.b: "We cannot afford a political crisis. Ignore it."
 #
 #ca_prospecting.9.t: "The Inaccessible Vein"
 #ca_prospecting.9.d: "An immense deposit of minerals has been mapped, but it sits atop a jagged mountain range surrounded by ravines. Extracting it will be an absolute logistical nightmare."
 #ca_prospecting.9.a: "We will need railways to move this."
 #
 #ca_prospecting.10.t: "Jungle Fever"
 #ca_prospecting.10.d: "The expedition has entered the deep rainforests. Malaria and yellow fever are wreaking havoc among our porters, and morale is practically non-existent."
 #ca_prospecting.10.a: "Call them back. It's a death trap."
 #ca_prospecting.10.b: "Push forward! Replace those who fall."
 #
 #ca_prospecting.11.t: "Ancient Ruins Discovered"
 #ca_prospecting.11.d: "Instead of mineral wealth, our prospectors have stumbled upon a massive, overgrown complex of ancient Mayan ruins. It holds no economic value, but the academic world is mesmerized."
 #ca_prospecting.11.a: "A testament to our glorious past."
 #
 #ca_prospecting.12.t: "Fool's Gold"
 #ca_prospecting.12.d: "What was initially celebrated as the largest gold discovery of the century has turned out to be nothing but iron pyrite. The nation is the laughing stock of the international press."
 #ca_prospecting.12.a: "A humiliating mistake."
 #
 #ca_prospecting.13.t: "Porters on Strike"
 #ca_prospecting.13.d: "The local porters carrying the heavy surveying equipment are refusing to move another inch unless their wages are doubled immediately."
 #ca_prospecting.13.a: "Pay them what they ask."
 #ca_prospecting.13.b: "Fire them all! We'll find others."
 #
 #ca_prospecting.14.t: "Subsoil Rights Conflict"
 #ca_prospecting.14.d: "Powerful landowners are claiming that the minerals found beneath their haciendas belong entirely to them, challenging the state's authority over the subsoil."
 #ca_prospecting.14.a: "Grant them private mining rights."
 #ca_prospecting.14.b: "The subsoil is the absolute property of the State!"
 #
 #ca_prospecting.15.t: "The Church's Blessing"
 #ca_prospecting.15.d: "Local priests have enthusiastically joined the expedition, using their knowledge of the remote parishes to guide our geologists to unexplored caves and riverbeds."
 #ca_prospecting.15.a: "God guides our picks."
 #
 #ca_prospecting.16.t: "Geological Innovation"
 #ca_prospecting.16.d: "Necessity is the mother of invention. Our surveyors have developed a brilliant new technique for rapid mineral cataloging in tropical environments."
 #ca_prospecting.16.a: "Publish these findings!"
 #
 #ca_prospecting.17.t: "Black Gold"
 #ca_prospecting.17.d: "Excellent news! Massive, highly accessible coal seams have been discovered. This will undoubtedly become the fuel for our future industrialization."
 #ca_prospecting.17.a: "The steam age is upon us."
 #
 #ca_prospecting.18.t: "The Geological Spy"
 #ca_prospecting.18.d: "Our guards have caught a man making covert copies of our geological maps. He confesses to being a spy hired by a foreign power eager to know our resource capabilities."
 #ca_prospecting.18.a: "Arrest him quietly."
 #ca_prospecting.18.b: "He escaped before we could secure the maps!"