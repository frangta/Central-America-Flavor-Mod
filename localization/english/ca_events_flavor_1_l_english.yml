 ca_central_america_falls_apart:2 "Central American Dissolution"
 ca_central_america_falls_apart_reason:0 "The Central American States are crying out for independence. Will we give it to them? Soon, they will give us an ultimatum."
 ca_central_america.2.t:1 "The Dissolution of Central America"
 ca_central_america.2.d:1 "The remaining states of the union have declared their independence. It has become clear that the union of [ROOT.GetCountry.GetName] is over, and that [SCOPE.sState('capital_scope').GetName] must fend for itself."
 ca_central_america.2.f:1 ""It is reclaiming the ownership of our country, or bowing down to them. It is forgetting the names of our parents, or learning the enemy's ancestors. It is sowing our own land, or seeing them ravage it. It is freedom, or it is war!""
 ca_central_america.2.a:1 "We must accept our fate."
 ca_central_america.2.b:1 "We will not abandon the union so lightly."
 ca_central_america.3.t:0 "[SCOPE.sCountry('secession_country').GetName] Secedes"
 ca_central_america.3.d:0 "[SCOPE.sCountry('secession_country').GetName] has declared its secession from [ROOT.GetCountry.GetName]. This has prompted further instability and turmoil in the remaining states of our fragile union."
 ca_central_america.3.f:0 ""The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] signed a decree allowing the remaining states to secede, but this was nothing more than a formality; the dissolution of our confederation was already a reality. But perhaps what was may come again, given time for the wounds of division to heal.""
 ca_central_america.3.a:0 "Let them have their independence."
 ca_central_america.3.b:0 "They will regret this betrayal."
 ca_central_america_capital_tt:0 "When Central America is dissolved, you will play as the country most appropriate to your capital state. You can change your national capital through the Political Lens."
 ca_central_america_breakup_status:0 "Central American states with high turmoil may secede"
