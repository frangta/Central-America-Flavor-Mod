 # Costa Rica cae ante los separatistas (84)
 ca_central_america.84.t:0 "Costa Rica Falls"
 ca_central_america.84.d:0 "The forces loyal to the federation in Costa Rica have been defeated by the secessionists."
 ca_central_america.84.f:0 "The Morazanist dream fades in the south."
 ca_central_america.84.a:0 "A tragedy."
 
 # Nicaragua vence a los separatistas (86)
 ca_central_america.86.t:0 "Victory in Nicaragua"
 ca_central_america.86.d:0 "Our troops have crushed the separatist uprising in Nicaragua."
 ca_central_america.86.f:0 "Federal order has been restored in León and Granada."
 ca_central_america.86.a:0 "The Union prevails."
 ca_central_america.87.f:0 "Nicaragua has been irretrievably lost."

 # Caudillos (100)
 ca_central_america.100.t:0 "The Rise of the Caudillo"
 ca_central_america.100.d:0 "Political instability has given rise to a charismatic leader who has taken local control by force of arms."
 ca_central_america.100.f:0 "His loyalty is doubtful, but his control over the militias is absolute."
 ca_central_america.100.a:0 "Appoint him political chief and hope for the best."
 ca_central_america.100.b:0 "He is a traitor. Arrest him!"

 # Crisis y Economía (200 - 201)
 ca_central_america.200.t:0 "The Golden Grain Fever"
 ca_central_america.200.d:0 "Coffee exports have reached record levels, attracting foreign capital and filling the coffers of the oligarchy."
 ca_central_america.200.a:0 "Encourage exportation."
 ca_central_america.200.b:0 "Aggressively tax exports."
 ca_central_america.201.t:0 "Financial Chaos"
 ca_central_america.201.d:0 "The inability to pay our debts has paralyzed the government. Foreign creditors demand their money."
 ca_central_america.201.a:0 "Implement severe austerity measures."
 ca_central_america.201.b:0 "Formally declare bankruptcy."

 # Sociedad (300 - 302)
 ca_central_america.300.t:0 "The Earth Trembles"
 ca_central_america.300.d:0 "A devastating earthquake has reduced one of our main cities to rubble."
 ca_central_america.300.a:0 "Allocate federal emergency funds."
 ca_central_america.300.b:0 "There are no funds. Let the survivors fend for themselves."
 ca_central_america.301.t:0 "Literacy Campaign"
 ca_central_america.301.d:0 "The Intelligentsia is pushing to establish a network of public secular schools."
 ca_central_america.301.a:0 "Ignorance is the mother of tyranny."
 ca_central_america.301.b:0 "The church must continue to guide morality."
 ca_central_america.302.t:0 "Peasant Uprising"
 ca_central_america.302.d:0 "The expropriations of ejido lands have exhausted the patience of the indigenous and peasant communities."
 ca_central_america.302.a:0 "Return some communal lands."
 ca_central_america.302.b:0 "Send the army to pacify the region."

 # Diplomacia (400 - 402)
 ca_central_america.400.t:0 "Foreign Interests"
 ca_central_america.400.d:0 "A foreign power offers advantageous loans in exchange for influence over our market."
 ca_central_america.400.a:0 "Accept their 'generous' help."
 ca_central_america.400.b:0 "We will be no one's puppets."
 ca_central_america.401.t:0 "Border Incidents"
 ca_central_america.401.d:0 "A neighboring country has mobilized troops near our border."
 ca_central_america.401.a:0 "Send the army to defend our sovereignty."
 ca_central_america.401.b:0 "Seek a peaceful diplomatic solution."
 ca_central_america.402.t:0 "Military Reform"
 ca_central_america.402.d:0 "It is time to centralize command and put an end to the private militias of the caudillos."
 ca_central_america.402.a:0 "Establish a Federal General Staff."
 ca_central_america.402.b:0 "The caudillos are a necessary evil." 
