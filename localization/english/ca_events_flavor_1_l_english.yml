 ca_costa_rica_events.81.t:0 "The Answer from San José"
 ca_costa_rica_events.81.d:0 "11 August 1836. A note from the federal minister Miguel Álvarez announces the mediation of Juan Mora Fernández and Pedro Bermúdez. By the time it arrives, Costa Rican arms have already driven Quijano out of the north."
 ca_costa_rica_events.81.f:0 "Help that arrives late is still help... in the eyes of the newspapers."
 ca_costa_rica_events.81.a:0 "We appreciate the offer, but the matter has been settled by Costa Rican arms."
 ca_costa_rica_events.99.t:0 "The Collapse of the North"
 ca_costa_rica_events.99.d:0 "San José has failed to restore order in time. Guanacaste has broken its ties with Costa Rica, and Nicaragua is already presenting itself as the protector of the northern province."
 ca_costa_rica_events.99.f:0 "The north was lost not in a battle, but in a thousand days of neglect."
 ca_costa_rica_events.99.a:0 "We have lost the North!"
 ca_costa_rica_events.161.t:0 "The Landing of Paredes"
 ca_costa_rica_events.161.d:0 "18 December 1836. Ildefonso de Paredes has landed at Bocas del Toro and asked Filemón Galindo for his credentials. He had none. Without a shot being fired, the political chief of the Morazán District boarded the English schooner Constanza, anchored in the harbour, and left. New Granada's flag flies over the lagoons again."
 ca_costa_rica_events.161.f:0 "A district founded on paper, lost in an afternoon."
 ca_costa_rica_events.161.a:0 "We have been humiliated, but we will not give up our claim."
 ca_costa_rica_events.191.t:0 "Mourning in San José"
 ca_costa_rica_events.191.d:0 "Toribio Argüello, the man the electors chose against all expectations, has died. With no clear successor, the constitutional faction closes ranks and hands the government to its own men."
 ca_costa_rica_events.191.a:0 "The Republic mourns its leader."
 ca_costa_rica_events.201.t:0 "The Manifesto of David"
 ca_costa_rica_events.201.d:0 "16 July 1841. From David, in Chiriquí, Francisco Morazán has published a manifesto defending the federal cause. It opens with Montesquieu: «When the traitors of the Fatherland hold the highest offices, government is oppression.» Copies are already circulating in San José and Cartago."
 ca_costa_rica_events.201.f:0 "Exiled, but not silenced."
 ca_costa_rica_events.201.a:0 "Burn those subversive pamphlets!"
 ca_costa_rica_events.201.b:0 "Let his words circulate in the shadows."
 ca_costa_rica_events.202.t:0 "Shadows in Lima"
 ca_costa_rica_events.202.d:0 "Our agents report that Morazán is in Lima. General Pedro Bermúdez is said to be paying for his return, and old veterans of the Union are gathering around him. Some say he will serve Peru; others say he is preparing to come back."
 ca_costa_rica_events.202.f:0 "An exile with an army is no longer an exile."
 ca_costa_rica_events.202.a:0 "Demand his extradition from Lima."
 ca_costa_rica_events.202.b:0 "Send him gold in secret."
 ca_costa_rica_events.203.t:0 "The Andean Crossroads"
 ca_costa_rica_events.203.d:0 "December 1841. Morazán has turned down the command of a Peruvian division. In the port of Callao he is boarding the Crusader with Cabañas, Saravia and a handful of officers, bound for Central America."
 ca_costa_rica_events.203.f:0 "Some men cannot live far from their cause."
 ca_costa_rica_events.203.a:0 "\"My destiny lies in Central America.\""
 ca_costa_rica_events.203.b:0 "\"I accept the command in Peru.\"" 
 # ==========================================
 # 7. EVENTOS DE ESTADOS ESPECÍFICOS (Flavor Histórico)
 # ==========================================
 ca_nicaragua_events.1.t:0 "Anarchy in the Lakes"
 ca_nicaragua_events.1.d:0 "Distressing reports emerge from Nicaragua, a state utterly paralyzed by the bitter and bloody rivalry between the liberal elites of León and the conservative bloc of Granada. While the current Head of State, José Zepeda, desperately attempts to implement progressive reforms and pacify the territory ahead of the 1837 political cycle, local military caudillos constantly plot against his administration. For the federal government in San Salvador, Nicaragua's perpetual state of near-anarchy is a massive liability that threatens to sever the physical and political communication between our northern and southern states."
 ca_nicaragua_events.1.f:0 "The Federation bleeds in the divided cities."
 ca_nicaragua_events.1.a:0 "We must support Zepeda's fragile government."
 ca_nicaragua_events.1.b:0 "Leave them to their endless civil wars."

 ca_nicaragua_events.2.t:0 "The Divided State"
 ca_nicaragua_events.2.d:0 "The Federal Republic has brought us little peace, but in truth, our deepest wounds are self-inflicted. Nicaragua is violently torn between the liberal stronghold of León and the conservative bastion of Granada. Head of State José Zepeda struggles to maintain a semblance of constitutional order and implement vital reforms amidst constant plots from insubordinate military figures. As we approach the critical year of 1837, the state teeters on the edge of total internal collapse. We must find a way to unite our divided cities and rein in the caudillos, or the ongoing chaos will destroy us before the Federation even has a chance to intervene."
 ca_nicaragua_events.2.f:0 "León and Granada cannot coexist in peace."
 ca_nicaragua_events.2.a:0 "We must restore order by any means necessary."
 ca_nicaragua_events.2.b:0 "The Federation must intervene to save us."


 ca_el_salvador_events.1.t:0 "The Liberal Bastion"
 ca_el_salvador_events.1.d:0 "San Salvador remains the absolute beating heart of our Federation. While other states fracture, radical enlightened ideas continue to flourish here, providing Francisco Morazán with the loyal political base and the armies he needs to keep this union pieced together. However, their unwavering radicalism and constant mobilization against the traditional landowners are creating deep resentment among the conservative factions of the neighboring states."
 ca_el_salvador_events.1.f:0 "The cradle of Central American unionism."
 ca_el_salvador_events.1.a:0 "Long live Morazán and the Republic!"
 ca_el_salvador_events.1.b:0 "Their radicalism alienates the rest of the states."
 
 ca_guatemala_events.1.t:0 "The Rebellion of La Montaña"
 ca_guatemala_events.1.d:0 "A massive and terrifying uprising threatens the stability of our northern borders. Rafael Carrera has rallied thousands of angry peasants, indigenous communities, and fundamentalist clerics from the mountains. They are marching towards Guatemala City with a single, violent purpose: to completely dismantle the liberal reforms of Mariano Gálvez, expel all foreigners, and destroy the modern state apparatus we have worked so hard to build."
 ca_guatemala_events.1.f:0 "Long live Religion and Death to Foreigners!"
 ca_guatemala_events.1.a:0 "Send federal troops immediately."
 ca_guatemala_events.1.b:0 "This is a local matter for Gálvez to solve."
 ca_guatemala_events.1.c:0 "Attempt to negotiate with Carrera."
 
 ca_honduras_events.1.t:0 "Tension in Comayagua"
 ca_honduras_events.1.d:0 "Honduras finds itself deeply and perilously divided. As the geographic bridge of our republic, its stability is paramount. Yet, while some provincial leaders remain stubbornly loyal to the federal ideal, powerful conservative voices in Comayagua are rapidly gaining ground. They threaten to sever the physical link between El Salvador and the rest of the Union, replacing our liberal mandates with their own autonomous, traditionalist agendas."
 ca_honduras_events.1.f:0 "The fragile middle province."
 ca_honduras_events.1.a:0 "We must secure their loyalty."
 ca_honduras_events.1.b:0 "Their internal bickering is exhausting."
 ca_el_salvador_events.2.t:0 "The Burden of the Republic"
 ca_el_salvador_events.2.d:0 "As the capital and the vanguard of the Federation, the survival of the great Central American dream rests squarely on our weary shoulders. The conservative reactionaries, rebellious peasants, and ambitious local dictators surround us on all sides. We have bled our youth and emptied our coffers to fund Morazán's campaigns, but we will not allow the liberal project of enlightenment and unity to perish in the darkness. The fight continues."
 ca_el_salvador_events.2.f:0 "We bleed for the Union."
 ca_el_salvador_events.2.a:0 "We will march with Morazán to the bitter end."
 ca_el_salvador_events.2.b:0 "Is this burden too heavy for us alone?"
 
 ca_guatemala_events.2.t:0 "A State in Flames"
 ca_guatemala_events.2.d:0 "The liberal administration of Mariano Gálvez is on the brink of total collapse. A devastating cholera epidemic ravages the countryside, and the Church has successfully weaponized the tragedy, stoking the fury of the rural population. Now, Rafael Carrera's mountain army is marching on the capital, promising to restore traditional values, protect the faith, and violently end the foreign reforms that have alienated the common people. Our state is fracturing from within."
 ca_guatemala_events.2.f:0 "The old order strikes back."
 ca_guatemala_events.2.a:0 "We must crush Carrera to save the Republic."
 ca_guatemala_events.2.b:0 "Embrace the conservative uprising."
 ca_guatemala_events.2.c:0 "Can we find a middle ground?"
 
 
 ca_los_altos_soconusco_events.1.b:0 "They are rebels of Guatemala."

 ca_nicaragua_events.4.t:0 "Clayton-Bulwer Treaty"
 ca_nicaragua_events.4.d:0 "The British and Americans agree not to exclusively colonize Central America."
 ca_nicaragua_events.4.f:0 "They decide on our lands without consulting us."
 # Evento Setup
 ca_central_america.setup.t:0 "Central American Setup"
 ca_central_america.setup.d:0 "Configuring the initial state of Central America."
 ca_central_america.setup.f:0 "History begins now."
 ca_central_america.setup.a:0 "Historical Mode"
 ca_central_america.setup.b:0 "Alternate Mode"
 ca_central_america.setup.c:0 "Sandbox Mode"
 # ==========================================
 # El Salvador Electoral Events
 # ==========================================
 ca_el_salvador_events.9.t:0 "The Departure of Vigil and the Rise of Menéndez"
 ca_el_salvador_events.9.d:0 "Diego Vigil has left the government of the State, and Timoteo Menéndez has taken charge as acting head of state, a moderate liberal acceptable to the Federation. He faces immense pressure from both radical Morazanist officers and conservative schemers looking to shift the balance of power."
 ca_el_salvador_events.9.a:0 "Timoteo Menéndez takes office as a moderate."
 ca_el_salvador_events.9.b:0 "Radical pro-Morazán officers demand total control."
 ca_el_salvador_events.9.c:0 "Conservatives attempt a political coup."

 ca_el_salvador_events.10.t:0 "The Election of Juan José Guzmán"
 ca_el_salvador_events.10.d:0 "El Salvador holds a regular election under the Constitution of 1841. Juan José Guzmán seeks to build a consensus to stabilize the state, but purist factions on all sides are reluctant to compromise their ideals."
 ca_el_salvador_events.10.a:0 "Juan José Guzmán seeks stability through consensus."
 ca_el_salvador_events.10.b:0 "Pure liberals reject the consensus."
 ca_el_salvador_events.10.c:0 "A preemptive military intervention occurs."


 ca_el_salvador_events.12.t:0 "The Fall of Malespín and Eugenio Aguilar"
 ca_el_salvador_events.12.d:0 "The dictatorship of Malespín has finally fallen. Eugenio Aguilar steps up to restore a civilian liberal government, but remnants of the old regime are attempting to sabotage the transition."
 ca_el_salvador_events.12.a:0 "Eugenio Aguilar restores civilian liberal rule."
 ca_el_salvador_events.12.b:0 "Malespín loyalists sabotage the elections."

 ca_el_salvador_events.13.t:0 "Doroteo Vasconcelos and the Drums of War"
 ca_el_salvador_events.13.d:0 "Doroteo Vasconcelos has been elected, riding a wave of anti-Guatemalan sentiment. He is rapidly mobilizing the army and preparing for a major conflict against Rafael Carrera's forces in Guatemala."
 ca_el_salvador_events.13.a:0 "Vasconcelos prepares for war against Guatemala."
 ca_el_salvador_events.13.b:0 "Moderates manage to halt the martial rhetoric."

 # ==========================================
 # Guatemala Events
 # ==========================================



 ca_guatemala_events.6.t:0 "Institutional Ratification"
 ca_guatemala_events.6.d:0 "The dust begins to settle. The assembly must decide whether to formally ratify Mariano Rivera Paz as the head of state, solidifying conservative rule over Guatemala."
 ca_guatemala_events.6.a:0 "Mariano Rivera Paz is ratified."
 ca_guatemala_events.6.b:0 "The liberal opposition attempts to retake the assembly."

 ca_guatemala_events.7.t:0 "The Official Rise of Rafael Carrera"
 ca_guatemala_events.7.d:0 "The illiterate but brilliantly charismatic military commander Rafael Carrera has become the undisputed strongman of Guatemala. The time has come to make his power official."
 ca_guatemala_events.7.a:0 "Rafael Carrera is elected Head of State."
 ca_guatemala_events.7.b:0 "The conservative elite tries to retain a civilian leader."

 ca_guatemala_events.8.t:0 "Carrera's Resignation and the Succession Chaos"
 ca_guatemala_events.8.d:0 "In a surprising move, Rafael Carrera has temporarily stepped down, leaving a power vacuum in Guatemala. The ensuing political chaos sees various factions vying for control over the state."
 ca_guatemala_events.8.a:0 "Juan Antonio Martínez is elected."
 ca_guatemala_events.8.b:0 "General Mariano Paredes takes control."
 ca_guatemala_events.8.c:0 "The Liberals capitalize on Carrera's exile."

 # ==========================================
 # Honduras Events
 # ==========================================

 ca_honduras_events.14.t:0 "The Election of Justo José de Herrera"
 ca_honduras_events.14.d:0 "The political climate in Honduras requires a delicate touch. Justo José de Herrera has emerged as a moderate civilian candidate capable of bridging the gap between conflicting factions."
 ca_honduras_events.14.a:0 "Herrera assumes office as a moderate civilian."
 ca_honduras_events.14.b:0 "The military demands a man of arms."
 ca_honduras_events.14.c:0 "Radical liberals attempt to seize the Assembly."

 ca_honduras_events.15.t:0 "The Ascendancy of General Francisco Ferrera"
 ca_honduras_events.15.d:0 "General Francisco Ferrera, known as 'El Mulatillo', has consolidated his grip on the Honduran state, shifting its allegiance toward a militaristic and conservative path."
 ca_honduras_events.15.a:0 "Ferrera consolidates the conservative state."
 ca_honduras_events.15.b:0 "Liberal civilian resistance rises against him."

 ca_honduras_events.16.t:0 "Ferrera's Succession"
 ca_honduras_events.16.d:0 "Ferrera's second term is ending and he cannot be re-elected again, but he still commands the army. He wants a loyal successor in the presidency, while segments of the landowning elite and the urban middle classes are growing tired of his military rule."
 ca_honduras_events.16.a:0 "Ferrera's man, Coronado Chávez, is elected; Ferrera keeps the army."
 ca_honduras_events.16.b:0 "The landowners grow tired of militarism."
 ca_honduras_events.16.c:0 "An urban uprising against the dictatorship!"

 ca_honduras_events.17.t:0 "The Triumph of Juan Lindo"
 ca_honduras_events.17.d:0 "The statesman Juan Lindo has risen to power in Honduras, promising to restore civilian institutions, promote education, and curb the influence of the caudillos."
 ca_honduras_events.17.a:0 "Lindo promises education and institutionality."
 ca_honduras_events.17.b:0 "Ferrera attempts to sabotage Lindo from the shadows."

 ca_honduras_events.18.t:0 "The Constitution of 1848"
 ca_honduras_events.18.d:0 "A new constitution has been drafted in Honduras to solidify a civilian government and limit the power of the military strongmen. Its ratification will test the ultimate loyalty of the armed forces."
 ca_honduras_events.18.a:0 "Lindo is ratified under the new civilian constitution."
 ca_honduras_events.18.b:0 "The military rebels against the new constitution."

 # ==========================================
 # Nicaragua Events
 # ==========================================
 ca_nicaragua_events.01.t:0 "The Divided State"
 ca_nicaragua_events.01.d:0 "Nicaragua is torn apart by a fierce and bloody rivalry between the liberal city of León and the conservative stronghold of Granada. This internal conflict defines Nicaraguan politics above all else."
 ca_nicaragua_events.01.f:0 "A house divided against itself cannot stand."
 ca_nicaragua_events.01.a:0 "We must navigate this bitter rivalry."



 ca_nicaragua_events.19.t:0 "José Núñez and the End of the Federation"
 ca_nicaragua_events.19.d:0 "As the Federal Republic falters, José Núñez steps forward in Nicaragua. Navigating the treacherous waters between León and Granada, he prepares to steer Nicaragua towards full sovereignty."
 ca_nicaragua_events.19.a:0 "José Núñez assumes power as a Leonese moderate."
 ca_nicaragua_events.19.b:0 "The conservatives of Granada impose their strength."

 ca_nicaragua_events.20.t:0 "The First Constitutional Elections"
 ca_nicaragua_events.20.d:0 "With Nicaragua establishing itself as an independent nation, the first constitutional elections are held. Patricio Rivas, a conservative from Granada, emerges as a leading figure."
 ca_nicaragua_events.20.a:0 "Patricio Rivas of Granada claims victory."
 ca_nicaragua_events.20.b:0 "The Leonese reject Rivas's authority."

 ca_nicaragua_events.21.t:0 "Pablo Buitrago and the Liberal Return"
 ca_nicaragua_events.21.d:0 "The political pendulum swings back towards León as Pablo Buitrago ascends to power, signaling a resurgence of liberal dominance in Nicaragua."
 ca_nicaragua_events.21.a:0 "Pablo Buitrago assumes power for León."
 ca_nicaragua_events.21.b:0 "Granada launches a political boycott."

 ca_nicaragua_events.22.t:0 "The Presidency of Manuel Pérez"
 ca_nicaragua_events.22.d:0 "Manuel Pérez takes the reins of the state in an attempt to stabilize the volatile nation, but ambitious military caudillos remain a constant threat to civilian rule."
 ca_nicaragua_events.22.a:0 "Manuel Pérez assumes power."
 ca_nicaragua_events.22.b:0 "Military caudillos demand control."

 ca_nicaragua_events.23.t:0 "The Ruins of León and José León Sandoval"
 ca_nicaragua_events.23.d:0 "Following a brutal military sacking of León, the conservative José León Sandoval is elevated to power, leaving the liberal factions devastated and yearning for revenge."
 ca_nicaragua_events.23.a:0 "The conservative Sandoval assumes command."
 ca_nicaragua_events.23.b:0 "The survivors of León initiate armed resistance."

 ca_nicaragua_events.24.t:0 "José María Guerrero and the British Threat"
 ca_nicaragua_events.24.d:0 "José María Guerrero de Arcos takes office amidst a severe diplomatic crisis. The British Empire is expanding its influence over the Mosquito Coast, directly threatening Nicaragua's territorial integrity."
 ca_nicaragua_events.24.a:0 "Guerrero takes office amid tensions over Mosquitia."
 ca_nicaragua_events.24.b:0 "Liberals capitalize on diplomatic weakness."

 ca_nicaragua_events.25.t:0 "Norberto Ramírez and the Canal Treaties"
 ca_nicaragua_events.25.d:0 "Norberto Ramírez seeks to secure Nicaragua's future by negotiating treaties with foreign powers for the construction of an interoceanic canal. This move, however, draws the ire of radical nationalists."
 ca_nicaragua_events.25.a:0 "Ramírez initiates foreign canal treaties."
 ca_nicaragua_events.25.b:0 "Radicals reject the foreign pacts."


