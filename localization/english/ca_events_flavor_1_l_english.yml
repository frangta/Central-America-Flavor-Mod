 ca_central_america_falls_apart:2 "Central American Dissolution"
 ca_central_america_falls_apart_reason:0 "The Central American States are crying out for independence. Will we give it to them? Soon, they will give us an ultimatum."
 ca_central_america.2.t:1 "The Federal Congress Votes on Los Altos"
 ca_central_america.2.d:1 "The petition of the western highlands has reached the Federal Congress. The deputies of Quetzaltenango ask that Los Altos be admitted as the Sixth State of the Federation. Guatemala's delegation calls it an amputation; the liberals see a loyal ally against the conservatives of the capital. The vote cannot be delayed forever."
 ca_central_america.2.f:1 ""A Republic of six States is no weaker than one of five, if all six are loyal.""
 ca_central_america.2.a:1 "Approve the Sixth State."
 ca_central_america.2.b:1 "Reject the petition: Guatemala remains whole."
 ca_central_america.3.t:0 "The State of Los Altos"
 ca_central_america.3.d:0 "The Chamber of Deputies has approved the creation of the State of Los Altos. Quetzaltenango celebrates with bells and fireworks: the highlands now have their own government, their own assembly and their own seat in the Federation. In Guatemala City, the conservatives speak of betrayal."
 ca_central_america.3.f:0 ""Long live the Sixth State!""
 ca_central_america.3.a:0 "Long live the Sixth State!"
 ca_central_america.3.b:0 "I will lead Los Altos myself."
 ca_central_america_capital_tt:0 "When Central America is dissolved, you will play as the country most appropriate to your capital state. You can change your national capital through the Political Lens."
 ca_central_america_breakup_status:0 "Central American states with high turmoil may secede"
 #ca_central_america.2.t: "The fragility of Central America"
 #ca_central_america.2.d: "After the civil war, the liberals led by [SCOPE.sCharacter('ruler_scope').GetFullName],won the popular vote in the presidential election of 1830. outcome in the liberals having consolidated their power thanks to the president [SCOPE.sCharacter('ruler_scope').GetFullName]"
 #ca_central_america.2.f: "During the late 1833 presidential election, the electoral college elected Valle as Central America's next president. Valle defeated Morazán as many voters and politicians opposed Morazán's use of military force to settle disputes between [GetInterestGroupVariant('ig_intelligentsia',GetPlayer) and [GetInterestGroupVariant('ig_landowners',GetPlayer), and saw Valle as a moderate who could offer peace,The possible dissolution of [ROOT.GetCountry.GetName] and a civil war is imminent"
 ca_central_america.4.t:0 "The Highlands Rise"
 ca_central_america.4.d:0 "The Federation refused to recognize Los Altos, and the highlands have answered with rifles. The creole notables of Quetzaltenango have proclaimed their own government, raised militias and seized the western departments of Guatemala. Federal authority in the region has simply ceased to exist."
 ca_central_america.4.f:0 "What Congress would not grant, Quetzaltenango has taken."
 ca_central_america.4.a:0 "Accept the fait accompli."
 ca_central_america.4.b:0 "The highlands belong to Guatemala and to the Union!"

 # --- Dissolution and Reforms (Events 13-14) ---
 ca_central_america.13.t:0 "The Dissolution of Central America"
 ca_central_america.13.d:0 "Francisco Morazán's dream is fading into the mist. Bitter local rivalries, geographical isolation, and deep resentment against Guatemalan hegemony have made the federal pact unsustainable. The Congress has issued a decree declaring that the states are free to organize themselves as they see fit—a death sentence for the Union."
 ca_central_america.13.f:0 "Patria Grande, rest in peace."
 ca_central_america.13.a:0 "Let each State follow its own path"
 ca_central_america.13.b:0 "Never! We shall fight to the last man for the Union"


