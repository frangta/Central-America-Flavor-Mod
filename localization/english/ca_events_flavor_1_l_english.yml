 ca_central_america.7.t: "A local newspaper proposed the formation of a state that would include the regions of Quetzaltenango, Totonicapán, Sololá and Suchitepéquez"
 ca_central_america.7.d: "which would have around two hundred thousand inhabitants and would allow them greater freedom of action and better representation before the [ROOT.GetCountry.GetName],The area of ​​Quetzaltenango, Totonicapán, Sololá is populated mostly by indigenous people, who have and want to maintain their ancestral traditions and their lands in the cold highlands of western Guatemala. Throughout the colonial period there had been revolts against the Spanish government. After independence, the local mestizos and creoles favored the liberal party, while the indigenous majority was a supporter of the Catholic Church and, therefore, conservative."
 ca_central_america.7.f: "hunger, unemployment, the great resentment among the merchants of Guatemala City, and without our port on the Pacific, in addition to the rumor that the government had poisoned the rivers and streams with the purpose of annihilating the indigenous population."
 ca_central_america.7.a: "It is the people's decision"
 ca_central_america.7.b: "We have to overshadow this idea of ​​a new state, WE HAVE TO ARREST THE OWNER OF THE NEWSPAPER" 
 ca_central_america.7.c: "Ignore the situation in Guatemala," 
ca_central_america.8.t:0 "Ambitions in the Caribbean"
 ca_central_america.8.d:0 "The Republic of New Granada has effectively consolidated its control over the Bocas del Toro region. Although historically linked to the audiences of Guatemala and Costa Rica, the chronic weakness of our Federal Union has allowed Bogotá to extend its influence unchallenged. Local merchants are growing anxious, and national pride is at stake. Shall we reaffirm our sovereign right over these waters?"
 ca_central_america.8.f:0 "The map of the Republic cannot be redrawn by foreigners with impunity."
 ca_central_america.8.a:0 "We must reclaim what is rightfully ours"
 ca_central_america.8.b:0 "The region is not worth a conflict we cannot afford"

 ca_central_america.9.t:0 "Military Intervention in Bocas"
 ca_central_america.9.d:0 "Tensions on the southern border have escalated beyond mere diplomatic notes. Our generals believe we have a window of opportunity to launch a direct military intervention, expel the New Granadian garrison from Bocas del Toro, and secure the archipelago by force of arms."
 ca_central_america.9.f:0 "Gunpowder is the only language they seem to understand."
 ca_central_america.9.a:0 "To arms! Intervene immediately"
 ca_central_america.9.b:0 "A retreat would be prudent for now"

 ca_central_america.10.t:0 "The State of Bocas del Toro"
 ca_central_america.10.d:0 "Amidst the chaos between the Federation and New Granada, the local inhabitants—supported by foreign commercial interests—have proclaimed the formation of an autonomous state in Bocas del Toro. They seek international recognition, distancing themselves from the instability of both powers."
 ca_central_america.10.f:0 "Neither here nor there, but free."
 ca_central_america.10.a:0 "Recognize their autonomy under our protection"
 ca_central_america.10.b:0 "This is sedition! Reject their existence"

 ca_central_america.11.t:0 "The Fate of Bocas del Toro"
 ca_central_america.11.d:0 "The situation in the archipelago has reached a critical turning point. Multiple great powers watch with interest as the region destabilizes. Will it become a British protectorate, return to the fold of the Union, or be devoured by New Granada?"
 ca_central_america.11.f:0 "A strategic port in dispute."
 ca_central_america.11.a:0 "Secure control of the region"
 ca_central_america.11.b:0 "Abandon our territorial claims"

 ca_central_america.12.t:0 "New Granadian Usurpation"
 ca_central_america.12.d:0 "Forces from New Granada have formally occupied Bocas del Toro, declaring it an integral territory of their republic. The government of Costa Rica is furious and demands a forceful federal response against this outrage to our territorial integrity."
 ca_central_america.12.f:0 "The Federation crumbles at the edges."
 ca_central_america.12.a:0 "Declare war for the recovery of the territory"
 ca_central_america.12.b:0 "Accept the territorial loss"
 ca_central_america.12.c:0 "Seek international arbitration"

 # --- Dissolution and Reforms (Events 13-14) ---
 ca_central_america.13.t:0 "The Dissolution of Central America"
 ca_central_america.13.d:0 "Francisco Morazán's dream is fading into the mist. Bitter local rivalries, geographical isolation, and deep resentment against Guatemalan hegemony have made the federal pact unsustainable. The Congress has issued a decree declaring that the states are free to organize themselves as they see fit—a death sentence for the Union."
 ca_central_america.13.f:0 "Patria Grande, rest in peace."
 ca_central_america.13.a:0 "Let each State follow its own path"
 ca_central_america.13.b:0 "Never! We shall fight to the last man for the Union"

 ca_central_america.14.t:0 "The Livingston Codes"
 ca_central_america.14.d:0 "The state government of Guatemala is attempting to implement the penal system designed by Edward Livingston. Although modern and liberal, it includes trial by jury—a concept alien and incomprehensible to the indigenous population. The conservative clergy is already branding it as a foreign heresy designed to destroy our traditions."
 ca_central_america.14.f:0 "Laws written in English for a people who speak K'iche'."
 ca_central_america.14.a:0 "Implement the codes (Increases Progress)"
 ca_central_america.14.b:0 "Discard the reform to maintain peace"

 # --- The Epidemic (Events 15-17) ---
 ca_central_america.15.t:0 "Cholera in Guatemala"
 ca_central_america.15.d:0 "A terrible plague has arrived. Cholera Morbus moves swiftly along the rivers. In the highlands, priests are accusing the liberal government of poisoning the waters to kill the indigenous population. Panic is rapidly turning into an armed rebellion."
 ca_central_america.15.f:0 "The waters bring death."
 ca_central_america.15.a:0 "Impose strict quarantine (High political cost)"
 ca_central_america.15.b:0 "Let the disease run its course"

 ca_central_america.16.t:0 "Cholera Outbreak"
 ca_central_america.16.d:0 "The epidemic has spread far beyond the borders. Corpses pile up in the streets, and commerce has ground to a halt. The terrified population demands answers that medical science can barely provide, while political enemies use the tragedy to stoke unrest."
 ca_central_america.16.f:0 "Lord, have mercy upon us."
 ca_central_america.16.a:0 "Close the state borders immediately"
 ca_central_america.16.b:0 "We cannot stop trade, keep borders open"

 ca_central_america.17.t:0 "The Plague Spreads"
 ca_central_america.17.d:0 "Our containment efforts have failed miserably. Cholera has jumped to neighboring provinces, carrying with it not only death but also political instability and deep discontent against federal inefficiency."
 ca_central_america.17.f:0 "Death travels fast."
 ca_central_america.17.a:0 "It is an inevitable tragedy"
 ca_central_america.17.b:0 "Attempt to send medical aid"

 # --- State Separatism (Events 18-23) ---
 ca_central_america.18.t:0 "Separatism in Costa Rica"
 ca_central_america.18.d:0 "Braulio Carrillo, Head of State of Costa Rica, has openly declared that the Federation is a burden. He argues that Costa Rica pays taxes but receives nothing but wars in return, and advocates for immediate withdrawal from the Union to pursue prosperity alone."
 ca_central_america.18.f:0 "Far from Guatemala, close to prosperity."
 ca_central_america.18.a:0 "Attempt to negotiate with Carrillo"
 ca_central_america.18.b:0 "Denounce him as a traitor"

 ca_central_america.19.t:0 "Separatism in Nicaragua"
 ca_central_america.19.d:0 "The eternal and bloody disputes between León and Granada have found a common enemy: the federal government. Supreme Director José Núñez leads a movement to declare the absolute sovereignty of Nicaragua, rejecting federal authority."
 ca_central_america.19.f:0 "Neither León nor Granada will obey Guatemala."
 ca_central_america.19.a:0 "Seek allies in León"
 ca_central_america.19.b:0 "Prepare the federal army"
 ca_central_america.19.c:0 "Proceed."

 ca_central_america.20.t:0 "Separatism in Guatemala"
 ca_central_america.20.d:0 "The conservative elite of Guatemala, particularly the Aycinena Clan, is tired of subsidizing the other states and fighting Morazán's endless wars. They conspire to dissolve the Federation and create a strong, centralized Republic of Guatemala."
 ca_central_america.20.f:0 "Guatemala can live without the Federation."
 ca_central_america.20.a:0 "Appease the Aycinena Clan"
 ca_central_america.20.b:0 "Purge the conservatives"
 ca_central_america.20.c:0 "Understood."

 ca_central_america.21.t:0 "Separatism in Honduras"
 ca_central_america.21.d:0 "Even in the bastion of Morazán, discontent grows. Juan Francisco de Molina is agitating the Honduran landowners, claiming that the Union brings nothing but war to their lands and demanding separation."
 ca_central_america.21.f:0 "Honduras shall not be the battlefield of others."
 ca_central_america.21.a:0 "Promise greater autonomy"
 ca_central_america.21.b:0 "Send loyal troops to Comayagua"
 ca_central_america.21.c:0 "Very well."
 

 ca_central_america.22.t:0 "Separatism in El Salvador"
 ca_central_america.22.d:0 "Juan Lindo is maneuvering politically in San Salvador. Although the city is the federal capital, Salvadoran nationalist sentiment is being weaponized to undermine the authority of the Union from within."
 ca_central_america.22.f:0 "The heart of the Federation is sick."
 ca_central_america.22.a:0 "Negotiate with Lindo"
 ca_central_america.22.b:0 "Declare a state of siege"
 ca_central_america.22.c:0 "Let it be done."

 ca_central_america.23.t:0 "The Question of Los Altos"
 ca_central_america.23.d:0 "Liberals from Quetzaltenango have proclaimed the Sixth State of Los Altos, separating themselves from Guatemala. While this weakens the conservative power base in Guatemala City, it creates a new, fragile focus of tension in the highlands."
 ca_central_america.23.f:0 "Long live the Sixth State!"
 ca_central_america.23.a:0 "Recognize Los Altos as a federal ally"
 ca_central_america.23.b:0 "Allow Guatemala to reconquer them"
 ca_central_america.23.c:0 "Accept the outcome."

 # --- Reactions to Secession (Events 24-25) ---
 ca_central_america.24.t:0 "Opposition to Secession"
 ca_central_america.24.d:0 "Unionist groups and radical liberals have taken to the streets, protesting against the separatist attempts of the local oligarchies. They demand immediate federal intervention to save the fatherland from fragmentation."
 ca_central_america.24.f:0 "Death to the separatists!"
 ca_central_america.24.a:0 "Support the demonstrators"
 ca_central_america.24.b:0 "Call for calm and order"

 ca_central_america.25.t:0 "Acceptance of Secession"
 ca_central_america.25.d:0 "War weariness is palpable across the nation. Many sectors of society now view separation as a necessary evil to stop the constant bloodshed and restore economic stability."
 ca_central_america.25.f:0 "It is time to let them go."
 ca_central_america.25.a:0 "It is the will of the people"
 ca_central_america.25.b:0 "It is cowardly treason"

 # --- Declarations of Independence and War (Events 26-34) ---
 ca_central_america.26.t:0 "Nicaragua: Armed Independence"
 ca_central_america.26.d:0 "Nicaragua has not only declared its independence but has mobilized its militias to forcefully expel any federal official remaining in the territory. This is a de facto declaration of war."
 ca_central_america.26.f:0 "Sovereignty is won with blood."
 ca_central_america.26.a:0 "Accept the challenge"
 ca_central_america.26.b:0 "Attempt a diplomatic solution"

 ca_central_america.27.t:0 "Nicaragua: Peaceful Exit"
 ca_central_america.27.d:0 "The government of Nicaragua has issued a decree separating from the Federation, citing the central government's inability to maintain order. They request a peaceful transition of power."
 ca_central_america.27.f:0 "A goodbye without gunshots."
 ca_central_america.27.a:0 "Allow their departure"
 ca_central_america.27.b:0 "We cannot allow this precedent"

 ca_central_america.28.t:0 "Nicaragua Requests Intervention"
 ca_central_america.28.d:0 "Loyalist factions in Nicaragua are being overwhelmed by separatists. They desperately request the immediate intervention of the Federal Army, Protector of the Law, to save the state."
 ca_central_america.28.f:0 "Help us, General!"
 ca_central_america.28.a:0 "Send the army"
 ca_central_america.28.b:0 "We have no resources to spare"

 ca_central_america.29.t:0 "Costa Rica Requests Intervention"
 ca_central_america.29.d:0 "Unionists in San José beg for assistance to overthrow Braulio Carrillo and restore the federal constitutional order in Costa Rica before it drifts away forever."
 ca_central_america.29.f:0 "Distance complicates everything."
 ca_central_america.29.a:0 "Send an expedition south"
 ca_central_america.29.b:0 "They are too far away"

 ca_central_america.30.t:0 "Honduras Requests Intervention"
 ca_central_america.30.d:0 "Chaos reigns in Comayagua. Those loyal to the Federation ask for reinforcements to prevent the separatists from seizing total control of the state."
 ca_central_america.30.f:0 "Honduras is key to the Union."
 ca_central_america.30.a:0 "Intervene with force"
 ca_central_america.30.b:0 "Leave them to their fate"

 ca_central_america.31.t:0 "El Salvador Requests Intervention"
 ca_central_america.31.d:0 "San Salvador is divided. Rival factions fight in the streets, and federalists demand that the central government take direct control of the situation to prevent anarchy."
 ca_central_america.31.f:0 "Chaos in the capital."
 ca_central_america.31.a:0 "Restore order at once"
 ca_central_america.31.b:0 "Negotiate with local leaders"

 ca_central_america.32.t:0 "Guatemala Requests Intervention"
 ca_central_america.32.d:0 "Carrera's highlanders threaten Guatemala City. The desperate liberal state government, swallowing its pride, asks for help from the federal army they once despised."
 ca_central_america.32.f:0 "Carrera comes down from the mountain."
 ca_central_america.32.a:0 "Save the State of Guatemala"
 ca_central_america.32.b:0 "Let them fall"

 ca_central_america.33.t:0 "Los Altos Requests Intervention"
 ca_central_america.33.d:0 "The nascent state of Los Altos fears an imminent Guatemalan invasion and formally requests the protection of the Federal Army to secure its existence."
 ca_central_america.33.f:0 "A state born of the Federation."
 ca_central_america.33.a:0 "Protect Los Altos"
 ca_central_america.33.b:0 "We cannot antagonize Guatemala"

 ca_central_america.34.t:0 "Panama Requests Intervention"
 ca_central_america.34.d:0 "Secessionist movements in Panama see an opportunity in the region's chaos. Pro-Central American groups ask for support to break away from Colombia and join our sphere."
 ca_central_america.34.f:0 "An unexpected opportunity."
 ca_central_america.34.a:0 "Support Panamanian integration"
 ca_central_america.34.b:0 "This is a matter for New Granada"

 # --- Federal Responses (Events 35-41) ---
 ca_central_america.35.t:0 "Intervention in Costa Rica Accepted"
 ca_central_america.35.d:0 "The federal government has authorized a military campaign to restore constitutional order in Costa Rica."
 ca_central_america.35.f:0 "We march south."
 ca_central_america.35.a:0 "Proceed"
 ca_central_america.35.b:0 "Cancel the order"

 ca_central_america.36.t:0 "Intervention in Honduras Accepted"
 ca_central_america.36.d:0 "Federal troops are mobilizing towards Honduras to support loyalist elements and crush the rebellion."
 ca_central_america.36.f:0 "For the Union."
 ca_central_america.36.a:0 "Proceed"
 ca_central_america.36.b:0 "Halt the advance"

 ca_central_america.37.t:0 "Intervention in Nicaragua Accepted"
 ca_central_america.37.d:0 "Green light has been given to pacify Nicaragua and depose the separatist authorities by force."
 ca_central_america.37.f:0 "We shall restore the law."
 ca_central_america.37.a:0 "Begin operations"
 ca_central_america.37.b:0 "Abort mission"

 ca_central_america.38.t:0 "Intervention in El Salvador Accepted"
 ca_central_america.38.d:0 "The federal army will take direct control of security in the state of El Salvador to prevent further anarchy."
 ca_central_america.38.f:0 "Order at any price."
 ca_central_america.38.a:0 "Execute plan"
 ca_central_america.38.b:0 "Reconsider"

 ca_central_america.39.t:0 "Intervention in Guatemala Accepted"
 ca_central_america.39.d:0 "Despite past tensions, the federal army will intervene to protect the state of Guatemala from the peasant revolt."
 ca_central_america.39.f:0 "The enemy of my enemy..."
 ca_central_america.39.a:0 "Deploy troops"
 ca_central_america.39.b:0 "Withdraw support"

 ca_central_america.40.t:0 "Crisis in the Federation"
 ca_central_america.40.d:0 "Tensions are rising across the member states."
 ca_central_america.40.f:0 "The situation is becoming untenable."
 ca_central_america.40.a:0 "We must act!"
 
 ca_central_america.41.t:0 "Intervention Rejected"
 ca_central_america.41.d:0 "The federal government has decided that it has neither the capacity nor the political will to intervene militarily at this time."
 ca_central_america.41.f:0 "They stand alone."
 ca_central_america.41.a:0 "It is for the best"

 # --- Civil War and Results (Events 42-44) ---
 ca_central_america.42.t:0 "Second Central American Civil War"
 ca_central_america.42.d:0 "Diplomacy has died. The states have taken up arms against one another. It is the final battle for the soul of Central America: Union or Fragmentation?"
 ca_central_america.42.f:0 "Brothers against brothers."
 ca_central_america.42.a:0 "Fight for the Federation!"
 ca_central_america.42.b:0 "Surrender and accept dissolution"

 ca_central_america.43.t:0 "Defeat in the Civil War"
 ca_central_america.43.d:0 "The federal army has been defeated. Central authority has collapsed completely. The Federal Republic of Central America has ceased to exist, giving way to five small, quarrelsome nations."
 ca_central_america.43.f:0 "The dream is over."
 ca_central_america.43.a:0 "Continue as El Salvador"

 ca_central_america.44.t:0 "Victory in the Civil War"
 ca_central_america.44.d:0 "Against all odds, the federal forces have prevailed. The separatists have been crushed, and the authority of the Union restored. Now begins the arduous task of reconstruction."
 ca_central_america.44.f:0 "One and indivisible."
 ca_central_america.44.a:0 "Long live the Federation!"

 # --- Historical Independences (Events 45-62) ---
 ca_central_america.45.t:0 "Independence of Costa Rica"
 ca_central_america.45.d:0 "On November 15, 1838, Costa Rica formally separates from the Federation, declaring itself a sovereign and free state."
 ca_central_america.45.f:0 "A solitary path."
 ca_central_america.45.a:0 "Recognize independence"
 ca_central_america.45.b:0 "Refuse."

 ca_central_america.46.t:0 "Independence of Nicaragua"
 ca_central_america.46.d:0 "On April 30, 1838, the Constituent Assembly of Nicaragua declares that the state is free, sovereign, and independent."
 ca_central_america.46.f:0 "The rupture begins."
 ca_central_america.46.a:0 "Recognize independence"
 ca_central_america.46.b:0 "Decline."

 ca_central_america.47.t:0 "Independence of Guatemala"
 ca_central_america.47.d:0 "On April 17, 1839, Rafael Carrera enters triumphant, and Guatemala declares the end of its federal pact, sentencing the Union to death."
 ca_central_america.47.f:0 "The giant awakes."
 ca_central_america.47.a:0 "Recognize independence"
 ca_central_america.47.b:0 "Ignore."

 ca_central_america.48.t:0 "Independence of Honduras"
 ca_central_america.48.d:0 "Despite its attempts to save the union, Honduras is forced to declare its absolute independence on November 5, 1839."
 ca_central_america.48.f:0 "The last bastion falls."
 ca_central_america.48.a:0 "Recognize independence"
 ca_central_america.48.b:0 "Reject."

 ca_central_america.49.t:0 "Peaceful Secession of Honduras"
 ca_central_america.49.d:0 "Honduras withdraws peacefully from the union, seeking to avoid further armed conflict amidst the regional chaos."
 ca_central_america.49.f:0 "A quiet goodbye."
 ca_central_america.49.a:0 "Accept"

 ca_central_america.50.t:0 "El Salvador Defeats Separatists"
 ca_central_america.50.d:0 "Loyalist forces in El Salvador have managed to quell the internal rebellion, securing the state for the Federation."
 ca_central_america.50.f:0 "Order restored."
 ca_central_america.50.a:0 "Excellent"

 ca_central_america.51.t:0 "El Salvador Falls to Separatists"
 ca_central_america.51.d:0 "The federal government has lost control of San Salvador. The state is now in the hands of those who wish to see the Union dissolve."
 ca_central_america.51.f:0 "We have lost the heart."
 ca_central_america.51.a:0 "Terrible"

 ca_central_america.52.t:0 "Peaceful Secession of El Salvador"
 ca_central_america.52.d:0 "El Salvador opts to dissolve its federal ties without bloodshed, acknowledging the reality of the political situation."
 ca_central_america.52.f:0 "The end of an era."
 ca_central_america.52.a:0 "Accept"

 ca_central_america.53.t:0 "Guatemala Defeats Separatists"
 ca_central_america.53.d:0 "The federal government has succeeded in subduing the rebel factions in Guatemala, maintaining the most populous state within the Union."
 ca_central_america.53.f:0 "Victory in the north."
 ca_central_america.53.a:0 "Excellent"

 ca_central_america.54.t:0 "Guatemala Falls to Separatists"
 ca_central_america.54.d:0 "Conservative forces have taken total control of Guatemala and are severing all ties with the federal capital."
 ca_central_america.54.f:0 "The north is lost."
 ca_central_america.54.a:0 "Curse them"

 ca_central_america.55.t:0 "Peaceful Secession of Guatemala"
 ca_central_america.55.d:0 "Guatemala negotiates its exit from the federation diplomatically, preferring autonomy over war."
 ca_central_america.55.f:0 "A gentleman's agreement."
 ca_central_america.55.a:0 "Accept"

 ca_central_america.56.t:0 "Los Altos Defeats Separatists"
 ca_central_america.56.d:0 "The Sixth State has secured its position against its detractors and remains a loyal member of the Federation."
 ca_central_america.56.f:0 "The mountain endures."
 ca_central_america.56.a:0 "Good"

 ca_central_america.57.t:0 "Los Altos Falls"
 ca_central_america.57.d:0 "The experiment of Los Altos has failed; it is being reincorporated into Guatemala or falling into anarchy."
 ca_central_america.57.f:0 "A brief dream."
 ca_central_america.57.a:0 "Regrettable"

 ca_central_america.58.t:0 "Peaceful Secession of Los Altos"
 ca_central_america.58.d:0 "Los Altos formalizes its separation without armed conflict, seeking to survive as an independent entity."
 ca_central_america.58.f:0 "Freedom in the heights."
 ca_central_america.58.a:0 "Accept"

 ca_central_america.59.t:0 "Panama Defeats Separatists"
 ca_central_america.59.d:0 "Pro-unionists in Panama have secured control of the isthmus, bringing it closer to the Central American sphere."
 ca_central_america.59.f:0 "The bridge is ours."
 ca_central_america.59.a:0 "Excellent"

 ca_central_america.60.t:0 "Panama Falls"
 ca_central_america.60.d:0 "Separatist forces or Colombian loyalists have taken control of Panama, ending our hopes for the isthmus."
 ca_central_america.60.f:0 "We have lost the connection."
 ca_central_america.60.a:0 "Damnit"

 ca_central_america.61.t:0 "Independence of Panama"
 ca_central_america.61.d:0 "Panama declares its total independence, rejecting both Colombia and Central America to forge its own destiny."
 ca_central_america.61.f:0 "Neither of one nor the other."
 ca_central_america.61.a:0 "Accept"

 ca_central_america.62.t:0 "Peaceful Secession of Panama (UCA)"
 ca_central_america.62.d:0 "The state of Panama withdraws amicably from the Central American sphere."
 ca_central_america.62.f:0 "Goodbye to the canal."
 ca_central_america.62.a:0 "Accept"

 # --- State Civil Wars (Events 63-79) ---
 ca_central_america.63.t:0 "Civil War in Nicaragua"
 ca_central_america.63.d:0 "Violence has erupted in Nicaragua. The opposing factions show no mercy, tearing the state apart."
 ca_central_america.63.f:0 "Fire on the lake."
 ca_central_america.63.a:0 "Intervene"
 ca_central_america.63.b:0 "Observe"

 ca_central_america.64.t:0 "Armed Uprising in Nicaragua"
 ca_central_america.64.d:0 "Nicaraguan rebels have taken up arms to force independence from the Federation."
 ca_central_america.64.f:0 "Open war."
 ca_central_america.64.a:0 "Crush them"
 ca_central_america.64.b:0 "Let them go."

 ca_central_america.65.t:0 "Civil War in Costa Rica"
 ca_central_america.65.d:0 "Order in Costa Rica has broken down. Rival factions fight for power in the Central Valley."
 ca_central_america.65.f:0 "Unrest in the south."
 ca_central_america.65.a:0 "Intervene"
 ca_central_america.65.b:0 "Observe"

 ca_central_america.66.t:0 "Armed Uprising in Costa Rica"
 ca_central_america.66.d:0 "Costa Rica rises in arms against federal authority, rejecting directives from Guatemala City."
 ca_central_america.66.f:0 "Rebellion in the valley."
 ca_central_america.66.a:0 "Crush them"
 ca_central_america.66.b:0 "Do nothing."

 ca_central_america.67.t:0 "Civil War in Honduras"
 ca_central_america.67.d:0 "Honduras is consumed by internal struggles between factions vying for control."
 ca_central_america.67.f:0 "Chaos in the center."
 ca_central_america.67.a:0 "Intervene"
 ca_central_america.67.b:0 "Observe"

 ca_central_america.68.t:0 "Armed Uprising in Honduras"
 ca_central_america.68.d:0 "Honduran rebels declare war on the Federation, seeking absolute sovereignty."
 ca_central_america.68.f:0 "Betrayal in the heartland."
 ca_central_america.68.a:0 "Crush them"
 ca_central_america.68.b:0 "Stay neutral."

 ca_central_america.69.t:0 "Civil War in Guatemala"
 ca_central_america.69.d:0 "Civil war ravages the highlands of Guatemala as Carrera's forces clash with the state government."
 ca_central_america.69.f:0 "The mountain bleeds."
 ca_central_america.69.a:0 "Intervene"
 ca_central_america.69.b:0 "Observe"

 ca_central_america.70.t:0 "Armed Uprising in Guatemala"
 ca_central_america.70.d:0 "Guatemala rises in arms demanding the immediate end of the Union."
 ca_central_america.70.f:0 "The giant attacks."
 ca_central_america.70.a:0 "Crush them"
 ca_central_america.70.b:0 "Not our concern."

 ca_central_america.71.t:0 "Civil War in El Salvador"
 ca_central_america.71.d:0 "El Salvador is divided by war, with factions fighting block by block in the capital."
 ca_central_america.71.f:0 "Fratricidal struggle."
 ca_central_america.71.a:0 "Intervene"
 ca_central_america.71.b:0 "Observe"

 ca_central_america.72.t:0 "Armed Uprising in El Salvador"
 ca_central_america.72.d:0 "Salvadoran factions rise against the federal government, demanding local autonomy."
 ca_central_america.72.f:0 "Rebellion close to home."
 ca_central_america.72.a:0 "Crush them"
 ca_central_america.72.b:0 "Focus internally."

 ca_central_america.73.t:0 "Regional Summit"
 ca_central_america.73.d:0 "Leaders meet to discuss the future."
 ca_central_america.73.f:0 "Diplomacy is the only way forward."
 ca_central_america.73.a:0 "Agree to terms."
 ca_central_america.73.b:0 "Walk out."
 
 ca_central_america.74.t:0 "Armed Uprising in Los Altos"
 ca_central_america.74.d:0 "Los Altos defends its sovereignty with arms against both Guatemala and the Federation."
 ca_central_america.74.f:0 "Resistance in the sierra."
 ca_central_america.74.a:0 "Crush them"
 ca_central_america.74.b:0 "Negotiate"

 ca_central_america.75.t:0 "Civil War in Panama"
 ca_central_america.75.d:0 "Panama suffers severe civil unrest as different groups vie for the future of the transit zone."
 ca_central_america.75.f:0 "Crisis on the isthmus."
 ca_central_america.75.a:0 "Intervene"
 ca_central_america.75.b:0 "Observe"

 ca_central_america.76.t:0 "Armed Uprising in Panama"
 ca_central_america.76.d:0 "Panama fights for its independence through force of arms."
 ca_central_america.76.f:0 "War on the canal route."
 ca_central_america.76.a:0 "Crush them"
 ca_central_america.76.b:0 "Let them go"

 ca_central_america.77.t:0 "Consolidation of New States"
 ca_central_america.77.d:0 "With the dissolution effectively complete, the new states begin to consolidate their borders and local governments."
 ca_central_america.77.f:0 "New flags are raised."
 ca_central_america.77.a:0 "Observe"
 ca_central_america.77.b:0 "Interfere"
 ca_central_america.78.t:0 "Independence of Los Altos"
 ca_central_america.78.d:0 "On May 31, 1839, the political situation in the highlands has reached a point of no return. Following the example of other states and amidst the collapse of federal authority, the State of Los Altos has issued a decree declaring its absolute sovereignty. The leaders in Quetzaltenango argue that neither Guatemala nor the Federation can guarantee their security or prosperity any longer."
 ca_central_america.78.f:0 "The Sixth State stands alone against the storm."
 ca_central_america.78.a:0 "Recognize the Free State of Los Altos"
 ca_central_america.78.b:0 "This is illegal! They belong to Guatemala"

 ca_central_america.79.t:0 "The Decree of May 30, 1838"
 ca_central_america.79.d:0 "Acknowledging its inability to maintain order amidst the chaos, the Federal Congress has issued a historic decree. It officially permits the States to organize themselves 'as best suits their interests' and to maintain foreign relations, provided they remain part of the 'Central American family'. In practice, this legalizes the dismantling of the Federal Republic."
 ca_central_america.79.f:0 "The law itself now dismantles the law."
 ca_central_america.79.a:0 "Authorize the self-organization of the States"
 ca_central_america.79.b:0 "Veto the decree! The Union must remain centralized"
