 #Centro American Flavor
 
 ca_central_america.1.t: "Central American Reunification"
 ca_central_america.1.d: "The dissident states that so foolishly abandoned [ROOT.GetCountry.GetAdjective] unity have been brough back into the fold. The nation is once again united."
 ca_central_america.1.f: ""The days of the Spanish crown are no more. We are free to pursue our own destinies now, yet we trample each other in a stampede to our ends. And all around us, our enemies unite into greater wholes. If greater machines, greater bodies, and greater scopes are our future, let us embrace it. Let us embrace each other. Let us offer each other the sign of peace. Let us seek our greater destinies together.""
 ca_central_america.1.a: "Here's to a more stable union."
 culture_central_america.1.t: "National Foundations"
 culture_central_america.1.d: "A national awakening in our country has led to the emergence of a distinct [SCOPE.sCulture('new_ca_national_culture').GetName] identity among leading nationalists."
 culture_central_america.1.f: ""Our sacred cry is ours and ours alone! Hear the sound of broken chains, and see a sacred temple raised to law, peace, and union! How blue is the sky, how glorious is the fatherland!"" # this is, like, five national anthems slammed together
 culture_central_america.1.a: "[SCOPE.sCulture('old_central_american_culture').GetName] no more—we are now the [SCOPE.sCulture('new_ca_national_culture').GetName] people!"
 culture_central_america.1.b: "We are the heirs of a greater ideal!"
 culture_central_america.2.t: "National Values"
 culture_central_america.2.d: "An upsurge of people in the regions neighboring [SCOPE.sState('central_american_culture_state').GetName] have begun to embrace their new [SCOPE.sCulture('new_ca_national_culture').GetName] identity."
 culture_central_america.2.f: ""What majestic land is this, that houses such a fair people? Beloved nation, beloved land, I belong to thee!"\n\nThe crowd politely applauded the poet's purple prose. While his words were... florid, the sentiment was still appreciated."
 culture_central_america.2.a: "Welcome to the [SCOPE.sCulture('new_ca_national_culture').GetName] nation!"
 culture_central_america.3.t: "The [SCOPE.sCulture('new_ca_national_culture').GetName] Nation"
 culture_central_america.3.d: "From every corner of the land, people speak of their [SCOPE.sCulture('new_ca_national_culture').GetName] homeland. The [SCOPE.sCulture('old_ca_national_culture').GetName] identity is no more."
 culture_central_america.3.f: "The flag flapped in the central square, as a procession marched around, trumpets blaring and drums beating in unison. "May the sun renounce its light before we ever break the solemn vow we made to our home!" the crowd roared, more sincerely than they ever had before."
 culture_central_america.3.a: "Glory to the [SCOPE.sCulture('new_ca_national_culture').GetName] people!"
 culture_central_america.4.t: "A Nation of Our Own"
 culture_central_america.4.d: "The legacy of our nation's independence from Spain has spurred the beginnings of a developed national identity. Conflicts have begun between the vision of a unique and independent [ROOT.GetCountry.GetName], and the dream of an indivisible Latin America."
 culture_central_america.4.f: "For centuries, the guns had fired, first turned on those who resisted conquest, and then those who sought to chain the nation to its former master. An informal peace had come with the flight of the Spanish armies - but they had never truly stopped. They remain shouldered, pointed inwards and outwards - waiting for the end of this momentary confusion, and a single target to pursue."
 culture_central_america.4.a: "Our homeland takes another step towards freedom."
 culture_central_america.4.b: "We are but one nation amongst many."
