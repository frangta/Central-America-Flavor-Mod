 ca_central_america.77.b:0 "Interfere"
 ca_central_america.78.t:0 "Independence of Los Altos"
 ca_central_america.78.d:0 "The government of Los Altos has formally asked the Federation to recognize its full sovereignty. With federal authority collapsing all around them, the notables of Quetzaltenango no longer trust the Union to protect them from Guatemala, and prefer to stand alone."
 ca_central_america.78.f:0 "The Sixth State stands alone against the storm."
 ca_central_america.78.a:0 "Recognize the Free State of Los Altos"
 ca_central_america.78.b:0 "This is illegal! They belong to Guatemala"

 ca_central_america.80.t:0 "The Union Breaks Apart"
 ca_central_america.80.d:0 "The Federal Republic of Central America is coming apart. One by one, the States are withdrawing their deputies and their taxes, and the federal government governs little more than its own capital. As the leader of this dying Union, you may try to save it to the end, or take the reins of one of the States that will survive it."
 ca_central_america.80.f:0 "When the house collapses, each one takes shelter where he can."
 ca_central_america.80.a:0 "Assume control of Guatemala."
 ca_central_america.80.b:0 "Assume control of El Salvador."
 ca_central_america.80.nic:0 "Assume control of Nicaragua."
 ca_central_america.80.alt:0 "Assume control of Los Altos."
 ca_central_america.87.t:0 "The Congress of the Republic"
 ca_central_america.87.d:0 "The congress has convened to decide the fate of the union."
 ca_central_america.87.a:0 "Preserve the Union!"
 ca_central_america.87.b:0 "Dissolve the Union."






# ==========================================
 # CAPÍTULO 1: NICARAGUA
 # ==========================================
 ca_central_america.101.t:0 "The Echo of Granada"
 ca_central_america.101.d:0 "News reaches the capital. The conservative Granadians and liberal Leonese have taken up arms or seceded. The Central American people are beginning to doubt the Federation."
 ca_central_america.101.f:0 "\"The union trembles when its brothers fight.\""
 ca_central_america.101.a:0 "Damn traitors..."
 ca_central_america.101.b:0 "We must censor the press to prevent a panic."

 ca_central_america.102.t:0 "The Dilemma in the Capital"
 ca_central_america.102.d:0 "Refugees from León, loyal to the Federation, have arrived begging for urgent funds because Granada is crushing them."
 ca_central_america.102.f:0 "\"They ask for gold we do not have, to fight a war we did not start.\""
 ca_central_america.102.a:0 "Open the treasury coffers."
 ca_central_america.102.b:0 "Our reserves are empty."

 ca_central_america.103.t:0 "Tears on Lake Cocibolca"
 ca_central_america.103.d:0 "The war in Nicaragua has finally come to an end. The fate of the region, and perhaps the Federation itself, is sealed."
 ca_central_america.103.a:0 "Order has been restored in the Isthmus."
 ca_central_america.103.b:0 "Nicaragua is lost to us forever..."

 # ==========================================
 # CAPÍTULO 2: COSTA RICA
 # ==========================================
 ca_central_america.104.t:0 "The Silence of San José"
 ca_central_america.104.d:0 "Unlike the chaos in Nicaragua, the news from Costa Rica comes as a shock. The Costa Rican coffee elites have simply stopped sending taxes to the federal capital, arguing that the Federation brings them nothing."
 ca_central_america.104.a:0 "They are an ungrateful lot."
 ca_central_america.104.b:0 "Confiscate their coffee exports in our ports."

 ca_central_america.105.t:0 "The Scent of Betrayal"
 ca_central_america.105.d:0 "Foreign powers, such as Great Britain, who purchase Costa Rican coffee are upset by the port blockade. They have offered the Federation funds to finance the war in exchange for commercial favors."
 ca_central_america.105.a:0 "We accept the foreign gold."
 ca_central_america.105.b:0 "Central America is not for sale."

 ca_central_america.106.t:0 "The Fate of the Pact"
 ca_central_america.106.d:0 "The conflict in the south has reached its conclusion. The outcome will shape the future of our southern border."
 ca_central_america.106.a:0 "Carrillo has consolidated his tyranny..."
 ca_central_america.106.b:0 "The south returns to the fold."

 # ==========================================
 # CAPÍTULO 3: HONDURAS
 # ==========================================
 ca_central_america.107.t:0 "The Backstab in Comayagua"
 ca_central_america.107.d:0 "News reaches the federal capital: the Honduran conservatives have taken control and renounced the authority of the Federation. It is a devastating moral blow, proving that not even the Supreme Director's home state supports the unionist project."
 ca_central_america.107.a:0 "This is an unforgivable betrayal!"
 ca_central_america.107.b:0 "We must negotiate with Ferrera..."

 ca_central_america.108.t:0 "Blood on the Ulúa River"
 ca_central_america.108.d:0 "Unlike other conflicts, the war in Honduras has devolved into a brutal guerrilla campaign. Peasant and indigenous populations are being forced to fight for both sides, and the agricultural economy is collapsing."
 ca_central_america.108.a:0 "Send officers to discipline the loyalist militias."
 ca_central_america.108.b:0 "Let them kill each other."

 ca_central_america.109.t:0 "The Fate of General Ferrera"
 ca_central_america.109.d:0 "The guns have fallen silent in Honduras. The time has come to face the consequences of this bitter civil war."
 ca_central_america.109.a:0 "Ferrera has triumphed..."
 ca_central_america.109.b:0 "Morazán's homeland is free."

 # ==========================================
 # CAPÍTULO 4: GUATEMALA
 # ==========================================
 ca_central_america.110.t:0 "The Roar of the Mountain"
 ca_central_america.110.d:0 "The news arriving at the capital is terrifying. This is not a coup by men in suits; thousands of peasants armed with machetes and muskets are shouting \"Long live Religion and Death to Foreigners!\", accusing the federal government of poisoning the rivers."
 ca_central_america.110.a:0 "Ignorance is our worst enemy."
 ca_central_america.110.b:0 "Send the doctors and the army!"

 ca_central_america.111.t:0 "Gálvez's Panic"
 ca_central_america.111.d:0 "Mariano Gálvez, the liberal leader of Guatemala, is cornered in the capital. His reforms caused this disaster, and now he demands that Morazán send the entire army to save him from being lynched by Carrera's mobs."
 ca_central_america.111.a:0 "Morazán will march to Guatemala."
 ca_central_america.111.b:0 "Gálvez dug his own grave..."

 ca_central_america.112.t:0 "The Fate of the Caudillo"
 ca_central_america.112.d:0 "The great war in the north has ended. The struggle between the liberals and the mountain militias has reached a definitive conclusion."
 ca_central_america.112.a:0 "The Conservative Republic is born."
 ca_central_america.112.b:0 "The Hydra has been decapitated."

 # ==========================================
 # CAPÍTULO 5: EL SALVADOR
 # ==========================================
 ca_central_america.113.t:0 "The Enemy at Home"
 ca_central_america.113.d:0 "Conservative and autonomist militias have raised barricades in San Salvador. The Supreme Director looks out the palace window and realizes the rebellion is no longer in Honduras or Nicaragua... it is at his doorstep."
 ca_central_america.113.a:0 "Protect the capital at all costs!"
 ca_central_america.113.b:0 "Evacuate the officials."

 ca_central_america.114.t:0 "The Supreme Levy"
 ca_central_america.114.d:0 "The federal army is exhausted. The \"Supreme Levy\" is decreed: every man capable of holding a rifle must join the army. Local leaders are demanding political promises in exchange for fighting."
 ca_central_america.114.a:0 "Arm the artisans and peasants."
 ca_central_america.114.b:0 "I only trust my veterans."

 ca_central_america.115.t:0 "The End of the Utopia"
 ca_central_america.115.d:0 "The battle for El Salvador, the very heart of the Federation, has been decided. History will remember this day forever."
 ca_central_america.115.a:0 "The exile of the Supreme Director..."
 ca_central_america.115.b:0 "The Federation Still Lives!"

 # ==========================================
 # CAPÍTULO 6: LOS ALTOS
 # ==========================================

 ca_central_america.117.t:0 "The Shadow of Carrera"
 ca_central_america.117.d:0 "Rafael Carrera will not allow half of Guatemala to be stolen from him. His fearsome \"Mountain Army\" marches towards Quetzaltenango. The diplomats from Los Altos beg for rifles, claiming that \"if Los Altos falls, the entire north is lost.\""
 ca_central_america.117.a:0 "Divert all available weapons to the north."
 ca_central_america.117.b:0 "We can only offer them asylum."

 ca_central_america.118.t:0 "The Martyrs of Quetzaltenango"
 ca_central_america.118.d:0 "The conflict over the independence of Los Altos has ended. The streets of Quetzaltenango bear witness to the outcome of this desperate struggle."
 ca_central_america.118.a:0 "An unforgivable massacre..."
 ca_central_america.118.b:0 "The northern bastion holds fast!"
 ca_central_america.119.t:0 "The Federation at the Crossroads"
 ca_central_america.119.d:0 "1836. The Federal Republic of Central America survives, but only barely. The States resent the taxes and the authority of the federal capital, the conservatives conspire in Guatemala and Honduras, and Francisco Morazán's liberal project hangs by a thread. The path we choose now will decide the fate of the isthmus."
 ca_central_america.119.f:0 "Five States, one flag, and not a single shared idea of what the nation should be."
 ca_central_america.119.a:0 "Federalists: respect the rights of the States."
 ca_central_america.119.b:0 "Centralists: impose the Union by force."
 ca_central_america.119.c:0 "This Union is doomed. I will lead a single State."

 ca_central_america.120.t:0 "The Cry of the Sixth State"
 ca_central_america.120.d:0 "Quetzaltenango is in turmoil. The creole elites of the western highlands, tired of being governed from Guatemala City, demand to be recognized as the Sixth State of the Federation: Los Altos. If we grant their wish, Guatemala will be divided; if we refuse, the highlands could rise up on their own."
 ca_central_america.120.f:0 "The mountains of Los Altos have never obeyed anyone for long."
 ca_central_america.120.a:0 "Take the matter to the Federal Congress."
 ca_central_america.120.b:0 "Silence the separatists with a firm hand."
 ca_central_america.120.c:0 "Let Guatemala resolve its own crisis."

 ca_central_america.121.t:0 "The Weight of Guatemala"
 ca_central_america.121.d:0 "Guatemala, the largest and richest State of the Federation, is fully under federal control. Its conservative elite and its Church resent the liberal reforms, yet its taxes sustain half of the Republic. Congress must decide how far it dares to go."
 ca_central_america.121.f:0 "Whoever governs Guatemala governs Central America... or is devoured by it."
 ca_central_america.121.a:0 "Push the liberal reforms through, whatever the cost."
 ca_central_america.121.b:0 "Keep the Guatemalan elites on our side."
 ca_central_america.121.c:0 "Congress cannot reach an agreement."

 ca_central_america.122.b:0 "Reconquer the highlands!"
 
 
 
 ###########################
 ca_central_america.150.c:0 ""
 ca_central_america.1.b:0 "We will censor their press in the capital."
 ca_central_america.1.c:0 "We will not yield to provincial complaints."
 ca_central_america.80.c:0 "Assume control of Honduras."
 ca_central_america.80.e:0 "Assume control of Costa Rica."
 ca_central_america.80.g:0 "Remain loyal and attempt to save the UCA."
 
 # Costa Rica cae ante los separatistas (84)
 
 # Nicaragua vence a los separatistas (86)
 ca_central_america.87.f:0 "Nicaragua has been irretrievably lost."

 # Caudillos (100)
 ca_central_america.100.t:0 "The Rise of the Caudillo"
 ca_central_america.100.d:0 "Political instability has given rise to a charismatic leader who has taken local control by force of arms."
 ca_central_america.100.f:0 "His loyalty is doubtful, but his control over the militias is absolute."
 ca_central_america.100.a:0 "Appoint him political chief and hope for the best."
 ca_central_america.100.b:0 "He is a traitor. Arrest him!"

 # Crisis y Economía (200 - 201)
 ca_central_america.200.t:0 "The Golden Grain Fever"
 ca_central_america.200.d:0 "Coffee exports have reached record levels, attracting foreign capital and filling the coffers of the oligarchy."
 ca_central_america.200.a:0 "Encourage exportation."
 ca_central_america.200.b:0 "Aggressively tax exports."
 ca_central_america.201.t:0 "Financial Chaos"
 ca_central_america.201.d:0 "The inability to pay our debts has paralyzed the government. Foreign creditors demand their money."
 ca_central_america.201.a:0 "Implement severe austerity measures."
 ca_central_america.201.b:0 "Formally declare bankruptcy."

 # Sociedad (300 - 302)
 ca_central_america.300.t:0 "The Earth Trembles"
 ca_central_america.300.d:0 "A devastating earthquake has reduced one of our main cities to rubble."
 ca_central_america.300.a:0 "Allocate federal emergency funds."
 ca_central_america.300.b:0 "There are no funds. Let the survivors fend for themselves."
 ca_central_america.301.t:0 "Literacy Campaign"
 ca_central_america.301.d:0 "The Intelligentsia is pushing to establish a network of public secular schools."
 ca_central_america.301.a:0 "Ignorance is the mother of tyranny."
 ca_central_america.301.b:0 "The church must continue to guide morality."
 ca_central_america.302.t:0 "Peasant Uprising"
 ca_central_america.302.d:0 "The expropriations of ejido lands have exhausted the patience of the indigenous and peasant communities."
 ca_central_america.302.a:0 "Return some communal lands."
 ca_central_america.302.b:0 "Send the army to pacify the region."

 # Diplomacia (400 - 402)
 ca_central_america.400.t:0 "Foreign Interests"
 ca_central_america.400.d:0 "A foreign power offers advantageous loans in exchange for influence over our market."
 ca_central_america.400.a:0 "Accept their 'generous' help."
 ca_central_america.400.b:0 "We will be no one's puppets."
 ca_central_america.401.t:0 "Border Incidents"
 ca_central_america.401.d:0 "A neighboring country has mobilized troops near our border."
 ca_central_america.401.a:0 "Send the army to defend our sovereignty."
 ca_central_america.401.b:0 "Seek a peaceful diplomatic solution."
 ca_central_america.402.t:0 "Military Reform"
 ca_central_america.402.d:0 "It is time to centralize command and put an end to the private militias of the caudillos."
 ca_central_america.402.a:0 "Establish a Federal General Staff."
 ca_central_america.402.b:0 "The caudillos are a necessary evil." 
 
 
 ###########Costarica events##########
 ca_costa_rica_events.1.t:0 "The Distant Dictator"
 ca_costa_rica_events.1.d:0 "Troubling reports arrive from the southern periphery. Following the bloody War of the League in 1835, where Braulio Carrillo crushed the opposition of Cartago, Alajuela, and Heredia to centralize power in San José, he has forcefully severed ties with our federal mandates. Operating through absolute decrees, Carrillo is molding Costa Rica into his own vision of an isolated state. As internal political tensions rise ahead of the upcoming 1837 elections for Head of State, liberal and constitutionalist figures—led by Manuel Aguilar Chacón and supported by Lic. Toribio Argüello—struggle to keep the province aligned with legal and federal principles. Should Carrillo neutralize Aguilar's movement, the state may break away from the Union permanently."
 ca_costa_rica_events.1.f:0 "The Federation's grip weakens in the periphery."
 ca_costa_rica_events.1.a:0 "We must restore federal law."
 ca_costa_rica_events.1.b:0 "Let him rule his isolated mountains."
 ca_costa_rica_events.1.c:1 ""
# Eventos de introducción: Perspectiva del Estado Jugador (Local)
 ca_costa_rica_events.2.t:0 "Architect of the State"
 ca_costa_rica_events.2.d:0 "The Federal Republic has brought us nothing but economic disruption and endless civil wars. Just last year, the bloody War of the League (1835) tore our state apart over the location of our capital, ending only when Braulio Carrillo unified the province under the absolute dominance of San José. Now, as Costa Rica approaches its upcoming 1837 elections for Head of State, our political leadership stands deeply divided. Manuel Aguilar Chacón, backed by Toribio Argüello and traditional constitutionalists, defends institutional legality and our ties to the Central American region. Meanwhile, Carrillo advocates for a centralist, sovereign path to enforce order by decree, rejecting the chaotic Federation. Our nation must decide its future at the ballot box—or through force."
 ca_costa_rica_events.2.f:0 "Order and Progress through force."
 ca_costa_rica_events.2.a:0 "Costa Rica will stand alone and strong."
 ca_costa_rica_events.2.b:0 "Perhaps the Federation can still be saved..." 
ca_costa_rica_events.3:1 ""
 ca_costa_rica_events.3.t:1 "The Architect's Weariness"
 ca_costa_rica_events.3.d:1 "Exhausted by the War of the League and by the endless intrigues of Cartago, Heredia and Alajuela, Braulio Carrillo has submitted his resignation to the Assembly. Many suspect it is a maneuver to force the deputies to renew their loyalty to him; others believe the man who built the state is truly tired of carrying it on his shoulders."
 ca_costa_rica_events.3.f:1 "\"I did not seek power. Power sought me, and it does not let me go.\""
 ca_costa_rica_events.3.a:1 "The Assembly rejects the resignation."
 ca_costa_rica_events.3.b:1 "Accept the resignation."
 ca_costa_rica_events.3.c:1 "" 
 ca_costa_rica_events.4:1 ""
 ca_costa_rica_events.4.t:1 "The Mutiny at the Villa"
ca_costa_rica_events.4.d:1 "29 June 1836. Manuel Quijano lay in ambush at Los Ahogados while the infantry of the Villa de Guanacaste, local men and Nicaraguans, rose against their commander Antonio Elizondo, fired on the cavalry and seized Enrique Cooper. The loyal authorities fell back to Bagaces. Only at four in the afternoon did the truth come out: the dreaded invader had brought just fourteen armed men."
 ca_costa_rica_events.4.f:1 "The north has always looked toward Nicaragua more than toward San José."
 ca_costa_rica_events.4.a:1 "Treason in the North!"
 ca_costa_rica_events.4.b:1 ""
 ca_costa_rica_events.4.c:1 "" 
 ca_costa_rica_events.5:1 ""
 ca_costa_rica_events.5.t:1 "The Power Vacuum"
 ca_costa_rica_events.5.d:1 "With the loyal authorities gone, the second alcalde Juan Rafael Muñoz has proclaimed himself political chief, and there is talk of handing the post to the Nicaraguan Toribio Toruño. Behind them stands the household of don Pedro Muñoz, the richest and most Nicaraguan-minded in the villa. When they saw how few men Quijano had, the mutineers changed sides and drove him off with gunfire. Yet San José's authority in the north is still in the hands of the men who betrayed it that morning."
 ca_costa_rica_events.5.f:1 "Where the State does not arrive, the strongest man rules."
 ca_costa_rica_events.5.a:1 "Let Villaseñor restore the loyal authorities."
 ca_costa_rica_events.5.b:1 "Tolerate Muñoz for now."
 ca_costa_rica_events.5.c:1 "" 
 ca_costa_rica_events.6.t:1 "The Sack of Bagaces"
 ca_costa_rica_events.6.d:1 "7 July 1836. Quijano's men have sacked Bagaces. The political chief Rudesindo de la Guardia escaped with more than 3,300 pesos of the treasury, but the government's tobacco and liquor depots were looted. Our troops cannot be everywhere: they must either guard the money or protect the people."
 ca_costa_rica_events.6.f:1 "A town can be rebuilt. Trust in the government, not so easily."
 ca_costa_rica_events.6.a:1 "Save the treasury."
 ca_costa_rica_events.6.b:1 "Our priority is to save the civilians."
 ca_costa_rica_events.6.c:1 "" 
 ca_costa_rica_events.7:1 ""
 ca_costa_rica_events.7.t:1 "The Landing at El Bolsón"
 ca_costa_rica_events.7.d:1 "July 1836. Juan Belatín's column, sailing from Esparza, has landed at El Bolsón on the Gulf of Nicoya and taken Quijano from behind. The invader is fleeing toward the border with a few stolen crates of wine as his only booty."
 ca_costa_rica_events.7.f:1 "The rebels watched the road. No one watched the sea."
 ca_costa_rica_events.7.a:1 "A brilliant maneuver by Belatín!"
 ca_costa_rica_events.7.b:1 ""
 ca_costa_rica_events.7.c:1 "" 
 ca_costa_rica_events.8:1 ""
 ca_costa_rica_events.8.t:1 "Morazán's Offer"
 ca_costa_rica_events.8.d:1 "4 August 1836. News of the invasion of Guanacaste has reached the federal government. Morazán, who has already ordered Quijano to lay down his arms, is sending the former head of state Juan Mora Fernández and Pedro Bermúdez to San José as mediators."
 ca_costa_rica_events.8.f:1 "The Federation cannot put out every fire, but it can at least send someone to watch the smoke."
 ca_costa_rica_events.8.a:1 "Send Mora Fernández and Bermúdez to mediate."
 ca_costa_rica_events.8.b:1 ""
 ca_costa_rica_events.8.c:1 ""
 ca_costa_rica_events.9.f:1 "Every rebellion leaves behind a list of names."
 ca_costa_rica_events.9.a:1 "Carrillo reads it in silence."
 ca_costa_rica_events.9.b:1 ""
 ca_costa_rica_events.9.c:1 ""
 ca_costa_rica_events.10:1 ""
 ca_costa_rica_events.10.t:1 "Guanacaste, Heroic City"
 ca_costa_rica_events.10.d:1 "3 September 1836. The Assembly has granted the Villa de Guanacaste the title of city for repelling Quijano. A gesture of gratitude... and a reminder of who grants the titles."
 ca_costa_rica_events.10.f:1 "Loyalty that is rewarded is loyalty that endures."
 ca_costa_rica_events.10.a:1 "A decree to exalt their courage."
 ca_costa_rica_events.10.b:1 ""
 ca_costa_rica_events.10.c:1 ""
 ca_costa_rica_events.11:1 ""
 ca_costa_rica_events.11.t:1 "Carrillo's Master Maneuver"
 ca_costa_rica_events.11.d:1 "The north is quiet again, and the Jiménez Report lies on Carrillo's desk. He could punish the men of 29 June and make martyrs of them. Or he could do something cleverer: promote and decorate the officers of Guanacaste, so that León stops trusting them. A silent amnesty would close the wound without any spectacle at all."
 ca_costa_rica_events.11.f:1 "Winning the war is easy. Winning the peace is the real art."
 ca_costa_rica_events.11.a:1 "Promotions and honors for the loyal."
 ca_costa_rica_events.11.b:1 "Execute the ringleaders."
 ca_costa_rica_events.11.c:1 "A silent amnesty."
 ca_costa_rica_events.12:1 ""
 ca_costa_rica_events.12.t:1 "Subjects of the Crown in the Caribbean"
 ca_costa_rica_events.12.d:1 "February 1836. Reports arrive from the Caribbean coast: some six or seven hundred Jamaicans, subjects of the British Crown, have settled around the lagoons of Bocas del Toro. They trade with the local peoples and fly the British flag over a coast that no Spanish-American government has ever really governed."
 ca_costa_rica_events.12.f:1 "Where there is a British merchant, a British warship is never far behind."
 ca_costa_rica_events.12.a:1 "We must keep an eye on those settlements."
 ca_costa_rica_events.12.b:1 ""
 ca_costa_rica_events.12.c:1 ""  
 ca_costa_rica_events.13:1 ""
 ca_costa_rica_events.13.t:1 "The Disputed Title of 1803"
 ca_costa_rica_events.13.d:1 "New Granada claims Bocas del Toro under the Royal Order of 20 November 1803, which placed the Mosquito Coast under the Viceroyalty of Santa Fe. Our jurists answer that the order was military, not territorial, and that the treaty of 15 March 1825 between Colombia and Central America froze each republic's possession as it stood. On that coast, they say, possession was ours."
 ca_costa_rica_events.13.f:1 "Old Spanish papers are the weapons of the new republics."
 ca_costa_rica_events.13.a:1 "Our rights are undeniable. Inform the Federation."
 ca_costa_rica_events.13.b:1 "We cannot defend that coast. Let New Granada have it."
 ca_costa_rica_events.13.c:1 ""  
 ca_costa_rica_events.14:1 ""
 ca_costa_rica_events.14.t:1 "The Expedition of Juan Galindo"
 ca_costa_rica_events.14.d:1 "30 May 1836. The federal government proclaims its jurisdiction over Bocas del Toro, determined to stop the British advance along the coast. It entrusts the mission to Colonel Juan Galindo, just back from fruitless talks with Washington and London over Belize. He offers to raise the federal flag over the lagoons before New Granada can react."
 ca_costa_rica_events.14.f:1 "Galindo has more ambition than soldiers, but ambition is sometimes enough."
 ca_costa_rica_events.14.a:1 "Fund the expedition. For our sovereignty!"
 ca_costa_rica_events.14.b:1 "We have no funds for adventures in the jungle."
 ca_costa_rica_events.14.c:1 ""  
 ca_costa_rica_events.15:1 ""
 ca_costa_rica_events.15.t:1 "The Morazán District"
 ca_costa_rica_events.15.d:1 "Galindo has reached Bocas del Toro and organized the coast as the Morazán District of Costa Rica. To govern it he has left his own father, Filemón Galindo, as political chief. Costa Rica now holds a claim over the lagoons, and New Granada is furious."
 ca_costa_rica_events.15.f:1 "A flag planted in the sand is a claim; defending it is another matter."
 ca_costa_rica_events.15.a:1 "A bold move."
 ca_costa_rica_events.15.b:1 ""
 ca_costa_rica_events.15.c:1 ""  
 ca_costa_rica_events.16:1 ""
 ca_costa_rica_events.16.t:1 "Granadine Sails"
 ca_costa_rica_events.16.d:1 "December 1836. Lookouts on the coast report two warships on the horizon, carrying a detachment of Granadine troops and a new political chief for Bocas del Toro, Ildefonso de Paredes. Filemón Galindo has no soldiers worth the name."
 ca_costa_rica_events.16.f:1 "The sea brings news before the couriers do."
 ca_costa_rica_events.16.a:1 "We have nothing to defend the district with."
 ca_costa_rica_events.16.b:1 "Send reinforcements to Filemón Galindo."
 ca_costa_rica_events.16.c:1 ""  
 ca_costa_rica_events.17:1 ""
 ca_costa_rica_events.17.t:1 "Carrillo's Outcry"
 ca_costa_rica_events.17.d:1 "19 April 1837. San José learns the full story: New Granada sent Paredes to occupy Bocas del Toro, and Galindo barely escaped in a boat. Carrillo denounces the federal government, which ordered the expedition and then left Costa Rica alone against New Granada. He demands that the Federation answer the affront."
 ca_costa_rica_events.17.f:1 "\"What use is a Federation that does not defend its members?\""
 ca_costa_rica_events.17.a:1 "We demand immediate action from the Federation!"
 ca_costa_rica_events.17.b:1 ""
 ca_costa_rica_events.17.c:1 ""  
 ca_costa_rica_events.18:1 ""
 ca_costa_rica_events.18.t:1 "The Silence of the Federation"
 ca_costa_rica_events.18.d:1 "Costa Rica demands that the Federation respond to New Granada's aggression in Bocas del Toro. But the federal treasury is empty, the army is busy with rebellions in the north, and a war with New Granada could finish off the Union."
 ca_costa_rica_events.18.f:1 "Sometimes silence is the loudest answer."
 ca_costa_rica_events.18.a:1 "We have too many problems at home. Silence."
 ca_costa_rica_events.18.b:1 "To arms for Central America!"
 ca_costa_rica_events.18.c:1 "" 
 ca_costa_rica_events.19:1 ""
 ca_costa_rica_events.19.t:1 "The Electors of 1837"
 ca_costa_rica_events.19.d:1 "9 April 1837. The second-degree electors have voted. Carrillo's term is over, and San José backs him for re-election. Cartago, Alajuela and Heredia, which still remember the War of the League, stand behind the jurist Manuel Aguilar Chacón, the man who refused the post of Head of State in 1835. A third name, Toribio Argüello, gathers a handful of votes."
 ca_costa_rica_events.19.f:1 "The ballot decides, but the barracks listen."
 ca_costa_rica_events.19.a:1 "Aguilar wins, twenty-two votes to seventeen."
 ca_costa_rica_events.19.b:1 "The electors swing to Carrillo."
 ca_costa_rica_events.19.c:1 "The third man: Toribio Argüello."
 ca_costa_rica_events.20:1 ""
 ca_costa_rica_events.20.t:1 "The Pronouncement of San José"
 ca_costa_rica_events.20.d:1 "27 May 1838. The forces of San José have pronounced against the government. Manuel Aguilar has been given twelve hours to leave the city, and Braulio Carrillo is once again Head of State. Vice Head of State Juan Mora Fernández calls it what it is: a dictatorship."
 ca_costa_rica_events.20.f:1 "The Architect has returned to finish his building."
 ca_costa_rica_events.20.a:1 "Into exile with Aguilar and Mora."
 ca_costa_rica_events.20.b:1 "Keep Juan Mora at our side, for legitimacy."
 ca_costa_rica_events.20.c:1 ""
 ca_costa_rica_events.21:1 ""
 ca_costa_rica_events.21.t:1 "The Law of Bases and Guarantees"
 ca_costa_rica_events.21.d:1 "8 March 1841. Carrillo has issued the Decree of Bases and Guarantees. The First Chief of State becomes irremovable and answerable to no one. A five-member Consultative Chamber, chosen by census suffrage in four degrees, and a Judicial Chamber appointed by Carrillo replace the old powers. The municipalities are abolished, and the country is divided into five departments: San José, Cartago, Heredia, Alajuela and Guanacaste."
 ca_costa_rica_events.21.f:1 "Order and progress, whether they like it or not."
 ca_costa_rica_events.21.a:1 "Order and progress demand a firm hand."
 ca_costa_rica_events.21.b:1 "Govern without a decree."
 ca_costa_rica_events.21.c:1 ""
 ca_costa_rica_events.22:1 ""
 ca_costa_rica_events.22.t:1 "The First Direct Election"
 ca_costa_rica_events.22.d:1 "2–4 June 1844. For the first time, Costa Ricans have voted directly for their Head of State. The Cartago landowner Francisco María Oreamuno has won 1,541 votes, against 486 for Alfaro and 97 for the old Juan Mora Fernández."
 ca_costa_rica_events.22.f:1 "Thirty names on the ballot, and one clear winner."
 ca_costa_rica_events.22.a:1 "Oreamuno, by a landslide."
 ca_costa_rica_events.22.b:1 "Alfaro stays in office."
 ca_costa_rica_events.22.c:1 "The electors turn to Juan Mora Fernández."
 ca_costa_rica_events.23:1 ""
 ca_costa_rica_events.23.t:1 "The Electors of 1847"
 ca_costa_rica_events.23.d:1 "11 April 1847. The second-degree electors have given 99 votes to José María Castro Madriz, the young doctor of Santo Tomás, against 52 for Alfaro. At 29 he will be the youngest man ever to lead Costa Rica, with Juan Rafael Mora Porras as his vice president."
 ca_costa_rica_events.23.f:1 "A university rector in the presidential chair."
 ca_costa_rica_events.23.a:1 "Castro Madriz, the youngest president."
 ca_costa_rica_events.23.b:1 "Alfaro remains in office."
 ca_costa_rica_events.23.c:1 "Support the merchant Manuel José Carazo."
 ca_costa_rica_events.24:1 ""
 ca_costa_rica_events.24.t:1 "The Electors of 1849"
 ca_costa_rica_events.24.d:1 "2–9 December 1849. After ten days of Miguel Mora as interim, the electors have met. The coffee magnate Juan Rafael Mora Porras has won 49 votes, against 32 for Rafael Moya and 9 for the old Carrillista Manuel Antonio Bonilla."
 ca_costa_rica_events.24.f:1 "Coffee has found its president."
 ca_costa_rica_events.24.a:1 "Juan Rafael Mora Porras."
 ca_costa_rica_events.24.b:1 "Rafael Moya."
 ca_costa_rica_events.24.c:1 "Manuel Antonio Bonilla."
 ca_costa_rica_events.25:1 ""
 ca_costa_rica_events.25.t:1 "The University of Santo Tomás"
 ca_costa_rica_events.25.d:1 "3 May 1843. At the urging of his Minister General, the young doctor José María Castro Madriz, Head of State Alfaro has issued Decree 11, which turns the old Casa de Enseñanza de Santo Tomás, founded by Bishop García Jerez in 1814, into a university. It will be the first in the country."
 ca_costa_rica_events.25.f:1 "A republic of coffee needs lawyers, and lawyers need a university."
 ca_costa_rica_events.25.a:1 "Found the University."
 ca_costa_rica_events.25.b:1 "The treasury cannot pay for professors yet."
 ca_costa_rica_events.25.c:1 ""  
 ca_costa_rica_events.26:1 ""
 ca_costa_rica_events.26.t:1 "Le Lacheur's Monarch"
 ca_costa_rica_events.26.d:1 "1843. William Le Lacheur, a Guernsey captain, has anchored the Monarch at Puntarenas. Until now our coffee has reached England only through Valparaíso, re-bagged as «Café Chileno». Le Lacheur offers to carry it straight to London and to pay the growers on credit when he returns."
 ca_costa_rica_events.26.f:1 "The road to London no longer passes through Chile."
 ca_costa_rica_events.26.a:1 "Load the Monarch. To London!"
 ca_costa_rica_events.26.b:1 "Keep selling through Valparaíso."
 ca_costa_rica_events.26.c:1 ""  
 ca_costa_rica_events.27:1 ""
 ca_costa_rica_events.27.t:1 "The Constitution of 1844"
 ca_costa_rica_events.27.d:1 "9 April 1844. The Constituent Assembly has given the Free State of Costa Rica a new constitution, which replaces the Fundamental Law of 1825. For the first time, the Head of State will be chosen by the direct vote of the citizens."
 ca_costa_rica_events.27.f:1 "The people will vote, as long as they own something."
 ca_costa_rica_events.27.a:1 "Proclaim the new constitution."
 ca_costa_rica_events.27.b:1 "Keep the Fundamental Law of 1825."
ca_costa_rica_events.27.c:1 ""  
