 ca_setup_events.2.d: "After the civil war, the liberals led by [SCOPE.sCharacter('ruler_scope').GetFullName],won the popular vote in the presidential election of 1830. outcome in the liberals having consolidated their power thanks to the president [SCOPE.sCharacter('ruler_scope').GetFullName]"""
