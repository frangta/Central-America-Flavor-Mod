l_english:
 # ============================================================
 # CAFM - Journal: The British Debt
 # English version of localization/spanish/ca_british_debt_l_spanish.yml
 # ============================================================
 je_ca_british_debt:0 "The British Debt"
 je_ca_british_debt_reason:0 "In 1825 the Federation contracted a loan in London with the house of Barclay, Herring, Richardson & Co. to sustain the young republic. The bank collapsed the following year and the federal Treasury received only a fraction of the promised money, yet the bonds remained alive in the hands of the City's investors. Ever since, the 'English debt' has weighed on Central American finances and on every negotiation with His Britannic Majesty."

 je_ca_british_debt_status_4:0 "The Federation bears the entirety of the London loan."
 je_ca_british_debt_status_3:0 "We still owe a considerable share of the English debt."
 je_ca_british_debt_status_2:0 "Our share of the English debt remains a burden on the Treasury."
 je_ca_british_debt_status_1:0 "Only a final installment of the English debt remains to be paid."

 je_ca_british_debt_paid_tt:0 "Our entire share of the #v English Debt#! has been paid off"
 je_ca_british_debt_repudiated_tt:0 "We have #n repudiated#! the #v English Debt#!"
 je_ca_british_debt_negotiation_cooldown_tt:0 "We have not requested a debt conversion in the last #v 5#! years"

 # --- Buttons ---
 je_ca_british_debt_negotiation_button:0 "Request a Debt Conversion"
 je_ca_british_debt_negotiation_button_desc:0 "Send our financial agent to London to propose that the bondholders convert the old bonds on more favorable terms. Great Britain will decide whether to accept."
 je_ca_british_debt_payment_button:0 "Extraordinary Payment"
 je_ca_british_debt_payment_button_desc:0 "Allocate #v 25,000#! pounds from the Treasury to pay off an installment of the English debt."
 je_ca_british_debt_repudiate_button:0 "Repudiate the Debt"
 je_ca_british_debt_repudiate_button_desc:0 "Declare that this nation does not recognize the obligations contracted in London. Payments will stop, but no European banker will trust us again for a long time."

 # --- Modifiers ---
 modifier_ca_british_debt_4:0 "London Loan (Full)"
 modifier_ca_british_debt_4_desc:0 "The interest on the entire federal loan is paid to the London bondholders."
 modifier_ca_british_debt_3:0 "London Loan (Major Share)"
 modifier_ca_british_debt_3_desc:0 "We pay the largest share of the federal loan divided among the States."
 modifier_ca_british_debt_2:0 "London Loan (Medium Share)"
 modifier_ca_british_debt_2_desc:0 "We pay our share of the federal loan divided among the States."
 modifier_ca_british_debt_1:0 "London Loan (Final Installment)"
 modifier_ca_british_debt_1_desc:0 "Only a small balance of the debt to the London bondholders remains."
 modifier_ca_british_debt_good_credit:0 "Good Credit in the City"
 modifier_ca_british_debt_good_credit_desc:0 "Having honored the English debt opens the doors of London's banks to us."
 modifier_ca_british_debt_sovereign_finances:0 "Sovereign Finances"
 modifier_ca_british_debt_sovereign_finances_desc:0 "No foreign banker holds a claim over our customs houses any longer."
 modifier_ca_british_debt_repudiated:0 "Repudiated Debt"
 modifier_ca_british_debt_repudiated_desc:0 "After repudiating the English debt, no foreign lender trusts our signature."

 # --- Events ---
 ca_british_debt.1.t:0 "The English Debt, Settled"
 ca_british_debt.1.d:0 "With the last payment sent to London, our share of the old federal loan is paid off. The City's bondholders withdraw their claims and, for the first time since independence, the revenues of our customs houses belong entirely to us."
 ca_british_debt.1.f:0 "\"A republic that pays what it owes is a republic that can borrow again.\""
 ca_british_debt.1.a:0 "Let us cultivate our credit in London."
 ca_british_debt.1.b:0 "Never again will we depend on foreign bankers!"

 ca_british_debt.2.t:0 "Settlement in Central America"
 ca_british_debt.2.d:0 "[SCOPE.sCountry('ca_debtor_scope').GetName] has finished paying its share of the Central American loan of 1825. The bondholders celebrate recovering an investment that many in the City had given up for lost."
 ca_british_debt.2.f:0 "\"Late, but they paid. Let no one say the Americans do not keep their word.\""
 ca_british_debt.2.a:0 "Good news for the City."

 ca_british_debt.3.t:0 "A Central American Conversion Proposal"
 ca_british_debt.3.d:0 "The financial agent of [SCOPE.sCountry('ca_debtor_scope').GetName] has arrived in London with a proposal: convert the old bonds of the federal loan into new securities at a lower interest rate, in exchange for guarantees over their customs houses. The bondholders ask for the Foreign Office's opinion."
 ca_british_debt.3.f:0 "\"Better to collect something than nothing, and better a grateful friend than a resentful debtor.\""
 ca_british_debt.3.a:0 "Advise the bondholders to accept."
 ca_british_debt.3.b:0 "Let them pay what they signed."

 ca_british_debt.4.t:0 "London Accepts the Conversion"
 ca_british_debt.4.d:0 "The bondholders, with the approval of [SCOPE.sCountry('britain_scope').GetName], have accepted our conversion proposal. The annual burden of the English debt is reduced, though the gesture was not free: London will expect reciprocity."
 ca_british_debt.4.f:0 "\"Our agent came back with less debt and more commitments.\""
 ca_british_debt.4.a:0 "A relief for the Treasury."

 ca_british_debt.5.t:0 "London Rejects the Conversion"
 ca_british_debt.5.d:0 "The bondholders have flatly rejected our proposal and demand full compliance with what was agreed. The London press speaks with contempt of the 'insolvent republics' of Central America."
 ca_british_debt.5.f:0 "\"They lent us a fraction and charge us for the whole.\""
 ca_british_debt.5.a:0 "We will remember this slight."

 ca_british_debt.6.t:0 "Repudiation in Central America"
 ca_british_debt.6.d:0 "[SCOPE.sCountry('ca_debtor_scope').GetName] has declared that it does not recognize the debt contracted in London. The bondholders demand that His Majesty's government intervene in defense of their interests."
 ca_british_debt.6.f:0 "\"A gunboat off their ports will convince those gentlemen better than a hundred letters.\""
 ca_british_debt.6.a:0 "A formal protest will suffice."
 ca_british_debt.6.b:0 "Send a gunboat to their ports."
