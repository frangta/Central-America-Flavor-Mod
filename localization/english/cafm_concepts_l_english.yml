l_english:
 # =====================================================================
 # CAFM - Concepts (2026-10-27)
 # =====================================================================
 concept_ca_frca:0 "Federal Republic of Central America"
 concept_ca_frca_short:0 "Federation"
 concept_ca_frca_desc:0 "The $concept_ca_frca$ was born from the Constitution of 1824, which joined Guatemala, El Salvador, Honduras, Nicaragua and Costa Rica as sovereign [Concept('concept_state','$concept_states$')] under a federal government. By 1836 the Union is worn down by civil war, debt and the rivalry between liberals and conservatives. Whether it survives, is rebuilt by force or breaks into five republics depends on its [concept_ca_frca_support] and on the [concept_ca_state_structure] its members choose."
 concept_ca_frca_support:0 "Federal Support"
 concept_ca_frca_support_desc:0 "$concept_ca_frca_support$ measures how much the member [Concept('concept_state','$concept_states$')] still believe in the [concept_ca_frca]. It is tracked in the #b Fall of the Federation#! [concept_journal_entry] and changes every month with the loyalty of each State, federal aid, rebellions and the choices of their governments. If it collapses, the Union dissolves."
 concept_ca_state_structure:0 "State Structure"
 concept_ca_state_structure_desc:0 "The $concept_ca_state_structure$ is a [concept_law_group] that defines how power is shared between the federal capital and the [Concept('concept_state','$concept_states$')].\n\n#title The sovereign of the Union#! chooses between a #b Federal#!, #b Unitary#! or #b Confederated#! republic.\n#title Each member State#! follows the sovereign: #b Federal State#!, #b Departmental State#!, #b Confederated State#! or #b Autonomous State#!.\n#title A Central American country outside the Union#! is a #b Sovereign State#!."
 concept_ca_federal_spectrum:0 "Federal Spectrum"
 concept_ca_federal_spectrum_desc:0 "The $concept_ca_federal_spectrum$ shows where a member State stands inside the [concept_ca_frca], from #v -50#! to #v +50#!.\n\n#b [concept_ca_centralists]#! (#v -50#! to #v -17#!): the State submits to the federal capital.\n#b [concept_ca_federalists]#! (#v -16#! to #v +16#!): the State keeps the pact of 1824.\n#b [concept_ca_separatists]#! (#v +17#! to #v +50#!): the State puts its own sovereignty first.\n\nPowerful Armed Forces and the Church pull it toward centralism; liberals and urban artisans in government pull it toward the centre; high [concept_liberty_desire], powerful local elites and rural particularism push it toward separatism."
 concept_ca_centralists:0 "Centralists"
 concept_ca_centralists_desc:0 "The $concept_ca_centralists$, also called #i unitarios#! or #i serviles#!, want a single strong government in the capital. Their base is the Armed Forces, the Church, the great families of Guatemala City and much of the rural population, who trusted the old colonial order more than the liberal reforms."
 concept_ca_federalists:0 "Federalists"
 concept_ca_federalists_desc:0 "The $concept_ca_federalists$ defend the Constitution of 1824: sovereign [Concept('concept_state','$concept_states$')] joined under a federal government. Led by liberals such as Francisco Morazán, they draw support from lawyers, academics, merchants and the urban artisans and laborers who filled the liberal militias."
 concept_ca_separatists:0 "Separatists"
 concept_ca_separatists_desc:0 "The $concept_ca_separatists$ put the sovereignty of their own State above the Union. Some want a loose [concept_ca_confederation]; others want a fully independent republic. They are strongest among local elites, provincial caudillos and regions that resent the federal capital."
 concept_ca_federal_dependency:0 "Federal State"
 concept_ca_federal_dependency_desc:0 "A $concept_ca_federal_dependency$ is a [concept_subject] that governs itself at home but shares a federal government, army and foreign policy with its [concept_overlord]."
 concept_ca_protectorate:0 "Protectorate"
 concept_ca_protectorate_desc:0 "A $concept_ca_protectorate$ is a [concept_subject] that runs its own affairs but entrusts its defence and foreign relations to a stronger [concept_overlord]."
 concept_ca_confederative_partner:0 "Confederative Partner"
 concept_ca_confederative_partner_desc:0 "A $concept_ca_confederative_partner$ is a [concept_subject] that is almost entirely independent but remains bound to its [concept_overlord] in a [concept_ca_confederation]."
 concept_ca_caudillo:0 "Caudillo"
 concept_ca_caudillo_desc:0 "A $concept_ca_caudillo$ is a strongman whose authority rests on personal loyalty, armed followers and local patronage rather than on laws or institutions. In the decades after independence, caudillos such as Rafael Carrera or Francisco Malespín made and unmade governments across Central America."
 concept_ca_prospecting:0 "National Geological Survey"
 concept_ca_prospecting_short:0 "Survey"
 concept_ca_prospecting_desc:0 "Once #b Prospecting#! is researched, a Central American country can start a $concept_ca_prospecting$ to map the mineral wealth of its territory. Expeditions and foreign geologists speed up the survey, and its discoveries can reveal new [concept_resource_potential] in our [Concept('concept_state','$concept_states$')]."
