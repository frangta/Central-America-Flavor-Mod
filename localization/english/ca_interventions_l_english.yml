 # CAFM - F7 - Intervenciones y guerras civiles de los estados
 ca_central_america.28.t:0 "Nicaragua Requests Federal Intervention"
 ca_central_america.28.d:0 "The government of Nicaragua can no longer contain the separatists on its own and asks the Federation for help. Its envoys speak of armed bands in the countryside and of a capital that may not hold much longer."
 ca_central_america.28.f:0 ""Without the Union, there will be no order.""
 ca_central_america.28.a:0 "Send the federal army."
 ca_central_america.28.b:0 "Send money and weapons."
 ca_central_america.28.c:0 "Ignore the request."
