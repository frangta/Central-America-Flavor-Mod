 ca_central_america.35.t:0 "Federal Intervention in Costa Rica"
 ca_central_america.35.d_ok:0 "The federal expedition has entered San José. Carrillo has been forced to step aside, and a unionist head of State has taken his place."
 ca_central_america.35.d_ko:0 "The federal expedition has failed in the Central Valley. Carrillo emerges stronger than ever, and his supporters mock the Federation's weakness."
 ca_central_america.35.f:0 "War decides what Congress could not."
 ca_central_america.35.a:0 "Leave a federal garrison."
 ca_central_america.35.b:0 "Withdraw the troops."
 ca_central_america.35.c:0 "Retreat."
 ca_central_america.35.e:0 "Send reinforcements."
 ca_central_america.36.t:0 "Federal Intervention in Honduras"
 ca_central_america.36.d_ok:0 "Federal troops have restored order in Comayagua. Ferrera and his men have been driven from the field and will not trouble the State for some time."
 ca_central_america.36.d_ko:0 "The federal campaign in Honduras has failed. Ferrera has won the day, and his prestige among the soldiers grows."
 ca_central_america.36.f:0 "War decides what Congress could not."
 ca_central_america.36.a:0 "Leave a federal garrison."
 ca_central_america.36.b:0 "Withdraw the troops."
 ca_central_america.36.c:0 "Retreat."
 ca_central_america.36.e:0 "Send reinforcements."
 ca_central_america.37.t:0 "Federal Intervention in Nicaragua"
 ca_central_america.37.d_ok:0 "The federal army has secured León, which now stands as a bastion of the Union in Nicaragua."
 ca_central_america.37.d_ko:0 "The federal intervention has failed. The old war between León and Granada flares up again."
 ca_central_america.37.f:0 "War decides what Congress could not."
 ca_central_america.37.a:0 "Leave a federal garrison."
 ca_central_america.37.b:0 "Withdraw the troops."
 ca_central_america.37.c:0 "Retreat."
 ca_central_america.37.e:0 "Send reinforcements."
 ca_central_america.38.t:0 "Federal Intervention in El Salvador"
 ca_central_america.38.d_ok:0 "The federal army has crushed the rebels around San Salvador. The State is once again the stronghold of the Federation."
 ca_central_america.38.d_ko:0 "The federal intervention in El Salvador has failed, and the separatists grow bolder in the very seat of the Union."
 ca_central_america.38.f:0 "War decides what Congress could not."
 ca_central_america.38.a:0 "Leave a federal garrison."
 ca_central_america.38.b:0 "Withdraw the troops."
 ca_central_america.38.c:0 "Retreat."
 ca_central_america.38.e:0 "Send reinforcements."
 ca_central_america.39.t:0 "Federal Intervention in Guatemala"
 ca_central_america.39.d_ok:0 "Federal troops have dispersed Carrera's bands and retaken control of the Guatemalan countryside. For now."
 ca_central_america.39.d_ko:0 "The federal army has been defeated in the mountains of Guatemala. Carrera's power grows, and the conservatives no longer fear the Union."
 ca_central_america.39.f:0 "War decides what Congress could not."
 ca_central_america.39.a:0 "Leave a federal garrison."
 ca_central_america.39.b:0 "Withdraw the troops."
 ca_central_america.39.c:0 "Retreat."
 ca_central_america.39.e:0 "Send reinforcements."
 ca_central_america.40.t:0 "Federal Intervention in Los Altos"
 ca_central_america.40.d_ok:0 "Federal troops have reached Quetzaltenango and secured the Sixth State against its enemies."
 ca_central_america.40.d_ko:0 "The federal relief column has failed to reach the highlands. Los Altos stands alone, exposed to the armies of Guatemala."
 ca_central_america.40.f:0 "War decides what Congress could not."
 ca_central_america.40.a:0 "Leave a federal garrison."
 ca_central_america.40.b:0 "Withdraw the troops."
 ca_central_america.40.c:0 "Retreat."
 ca_central_america.40.e:0 "Send reinforcements."
 ca_central_america.35.ok_tt:0 "Carrillo is #bold deposed#! and a unionist head of State returns."
 ca_central_america.36.ok_tt:0 "#bold Ferrera#! is out of Honduran politics for #bold 2 years#!."
 ca_central_america.37.ok_tt:0 "#bold León#! becomes a federal bastion in Nicaragua."
 ca_central_america.38.ok_tt:0 "#bold Federal Bastion#!: the loyalty of El Salvador cannot fall below Wavering for #bold 24 months#!."
 ca_central_america.39.ok_tt:0 "Carrera has been driven back, at least for a while."
 ca_central_america.40.ok_tt:0 "Los Altos is safe from Guatemala, for now."
 ca_central_america.reinforce_ok_tt:0 "If the reinforcements win, the State is #bold pacified#!."
 ca_central_america.reinforce_ko_tt:0 "If they fail again, the State falls into #N crisis#! and may slide into #N civil war#!."
 ca_central_america.41.t:0 "Intervention Refused"
 ca_central_america.41.d:0 "The federal government has refused to send help to [SCOPE.sCountry('ca_target').GetName]. The officers grumble at the inaction, and the State will remember who abandoned it."
 ca_central_america.41.f:0 "Our resources are too scarce for everyone."
 ca_central_america.41.a:0 "It is for the best."
 ca_central_america.41.b:0 "Send an envoy to explain ourselves."
 ca_central_america.41.b_tt:0 "The envoy has a #bold 50%#! chance of avoiding the consequences in the State."
 ca_intervention_cooldown_tt:0 "The Federation has refused an intervention in the last 180 days."
 ca_request_intervention_button_name:0 "Answer a Request for Intervention"
 ca_request_intervention_button_desc:0 "A member State has asked the Federation for help against its separatists."
 ca_central_america.63.t:0 "Civil War in Nicaragua"
 ca_central_america.63.d:0 "León and Granada are at war again. Liberals and conservatives, federalists and separatists, have taken up arms across the State."
 ca_central_america.63.f:0 "Brother against brother."
 ca_central_america.63.a:0 "Fight the rebels."
 ca_central_america.63.b:0 "Ask the Federation for help."
 ca_central_america.63.c:0 "Negotiate with them."
 ca_central_america.65.t:0 "Civil War in Costa Rica"
 ca_central_america.65.d:0 "The quarrels of the Central Valley have turned into open war. The cities of Costa Rica are divided between the friends and the enemies of the Federation."
 ca_central_america.65.f:0 "Brother against brother."
 ca_central_america.65.a:0 "Fight the rebels."
 ca_central_america.65.b:0 "Ask the Federation for help."
 ca_central_america.65.c:0 "Negotiate with them."
 ca_central_america.67.t:0 "Civil War in Honduras"
 ca_central_america.67.d:0 "Armed bands loyal to rival caudillos are fighting across Honduras. The fate of the State, and of its place in the Union, will be decided by force."
 ca_central_america.67.f:0 "Brother against brother."
 ca_central_america.67.a:0 "Fight the rebels."
 ca_central_america.67.b:0 "Ask the Federation for help."
 ca_central_america.67.c:0 "Negotiate with them."
 ca_central_america.69.t:0 "Civil War in Guatemala"
 ca_central_america.69.d:0 "The peasant armies of the mountains have risen against the government. Carrera's name is on every lip, and the countryside is in flames."
 ca_central_america.69.f:0 "Brother against brother."
 ca_central_america.69.a:0 "Fight the rebels."
 ca_central_america.69.b:0 "Ask the Federation for help."
 ca_central_america.69.c:0 "Negotiate with them."
 ca_central_america.71.t:0 "Civil War in El Salvador"
 ca_central_america.71.d:0 "The heart of the Federation is torn apart. Unionists and separatists fight in the streets of San Salvador and across the State."
 ca_central_america.71.f:0 "Brother against brother."
 ca_central_america.71.a:0 "Fight the rebels."
 ca_central_america.71.b:0 "Ask the Federation for help."
 ca_central_america.71.c:0 "Negotiate with them."
 ca_central_america.73.t:0 "War in the Highlands"
 ca_central_america.73.d:0 "Guatemalan troops and conservative bands march on Quetzaltenango. The Sixth State must fight for its survival."
 ca_central_america.73.f:0 "Brother against brother."
 ca_central_america.73.a:0 "Fight the rebels."
 ca_central_america.73.b:0 "Ask the Federation for help."
 ca_central_america.73.c:0 "Negotiate with them."
 ca_central_america.116.t:0 "The Highlands Ask for Help"
 ca_central_america.116.d:0 "Envoys from Quetzaltenango have reached the federal capital. Guatemala is marching on the Sixth State, and Los Altos begs the Federation for weapons and men."
 ca_central_america.116.f:0 ""Do not abandon the Sixth State.""
 ca_central_america.116.a:0 "Send help to the highlands."
 ca_central_america.116.b:0 "We cannot divide Guatemala."
