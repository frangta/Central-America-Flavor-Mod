 ca_button_convoke_diet:0 "Convoke the Diet"
 ca_button_convoke_diet_desc:0 "Call the delegates of the States to a Diet to sign a Pact of Confederation. The Federation will not survive as it was, but the Union may survive as a Confederation."
 ca_button_supreme_levy:0 "Supreme Levy"
 ca_button_supreme_levy_desc:0 "Conscript every able man for the federal army."
 ca_button_dissolve_congress:0 "Dissolve the Congress"
 ca_button_dissolve_congress_desc:0 "Close the federal Congress and govern without it."
 ca_button_concordat:0 "Concordat with the Church"
 ca_button_concordat_desc:0 "Restore the privileges and tithes of the Church in exchange for its support."
 ca_button_repeal_livingston:0 "Repeal the Livingston Codes"
 ca_button_repeal_livingston_desc:0 "Abolish trial by jury and the new penal code, hated in the countryside."
 ca_button_capital_guatemala:0 "Capital in Guatemala"
 ca_button_capital_guatemala_desc:0 "Move the federal capital to Guatemala City, the largest city of the Union."
 ca_button_federal_monopolies:0 "Federal Monopolies"
 ca_button_federal_monopolies_desc:0 "Take over the tobacco and liquor monopolies, the main income of the States."
 ca_button_standing_army:0 "Standing Army"
 ca_button_standing_army_desc:0 "Disband the militias of the States and raise a single federal army."
 ca_button_press_watch:0 "Watched Press and Exile"
 ca_button_press_watch_desc:0 "Censor the press and exile the leaders of the opposition."
 ca_button_convoke_diet_bar_tt:0 "Federation support is between #bold 50#! and #bold 150#!"
 ca_button_convoke_diet_states_tt:0 "At least #bold 3#! core States have separated"
 ca_button_convoke_diet_tt:0 "The Diet signs the #bold Pact of Confederation#!."
 los_altos_intervention_central_america_button:0 "Reannex Los Altos"
 los_altos_intervention_central_america_button_desc:0 "Bring the highlands back into the Union by force."
 ca_federal_campaign_unrest:0 "Federal Campaign"
 ca_federal_campaign_unrest_desc:0 "Federal agents are campaigning in the State."
 ca_military_intendant:0 "Military Intendant"
 ca_military_intendant_desc:0 "A federal officer governs the State."
 ca_state_of_siege:0 "State of Siege"
 ca_state_of_siege_desc:0 "Constitutional guarantees have been suspended."
 ca_supreme_levy:0 "Supreme Levy"
 ca_supreme_levy_desc:0 "Every able man has been called to arms."
 ca_concordat:0 "Concordat"
 ca_concordat_desc:0 "The Church has recovered its privileges."
 ca_livingston_repealed:0 "Livingston Codes Repealed"
 ca_livingston_repealed_desc:0 "The countryside welcomes the return of the old laws."
 ca_federal_monopolies:0 "Federal Monopolies"
 ca_federal_monopolies_desc:0 "The Federation collects the tobacco and liquor monopolies."
 ca_standing_army:0 "Standing Army"
 ca_standing_army_desc:0 "A single federal army replaces the militias of the States."
 ca_press_watch:0 "Watched Press"
 ca_press_watch_desc:0 "The press is censored and the opposition exiled."
