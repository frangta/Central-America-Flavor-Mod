l_english:
 # CAFM - F17 - Eventos genericos (grupo 16), cadenas y dinamicos
 ca_central_america.88.t:0 "[SCOPE.sCharacter('regional_caudillo').GetFullName], Caudillo of [SCOPE.sState('caudillo_state').GetName]"
 ca_central_america.88.d:0 "In [SCOPE.sState('caudillo_state').GetName], where the authority of the capital is weak, [SCOPE.sCharacter('regional_caudillo').GetFullName] has gathered armed men who obey only him. He offers to keep order in the region, on his own terms."
 ca_central_america.88.f:0 ""Where the law does not reach, the caudillo rules.""
 ca_central_america.88.a:0 "Recognize him as the strongman of the region."
 ca_central_america.88.b:0 "Send him into exile."
 ca_central_america.89.t:0 "A Palace Intrigue"
 ca_central_america.89.d:0 "[SCOPE.sCharacter('corrupt_politician').GetFullName], leader of the landowners, is plotting to bring down the ministers who oppose him. The capital talks of nothing else."
 ca_central_america.89.f:0 ""In the palace, the knives are sharpened at night.""
 ca_central_america.89.a:0 "Let the intrigue run its course."
 ca_central_america.89.b:0 "Purge the cabinet."
 ca_central_america.90.t:0 "[SCOPE.sState('demanding_state').GetName] Demands Autonomy"
 ca_central_america.90.d:0 "The notables of [SCOPE.sState('demanding_state').GetName] demand to govern their own affairs: their taxes, their militia and their judges."
 ca_central_america.90.f:0 ""Nobody knows our needs better than we do.""
 ca_central_america.90.a:0 "Grant the autonomy."
 ca_central_america.90.b:0 "Refuse."
 ca_central_america.91.t:0 "Coffee Boom in [SCOPE.sState('boom_state').GetName]"
 ca_central_america.91.d:0 "Coffee prices are high and the plantations of [SCOPE.sState('boom_state').GetName] are making their owners rich. The treasury wants its share."
 ca_central_america.91.f:0 ""Every bean is a coin.""
 ca_central_america.91.a:0 "Let the planters prosper."
 ca_central_america.91.b:0 "Tax the coffee heavily."
 ca_central_america.92.t:0 "The Creditors Knock"
 ca_central_america.92.d:0 "The treasury cannot pay its debts. The London bondholders demand their money, and the local merchants refuse to lend any more."
 ca_central_america.92.f:0 ""A country that does not pay, does not borrow.""
 ca_central_america.92.a:0 "Austerity."
 ca_central_america.92.b:0 "Stop paying."
 ca_central_america.93.t:0 "Earthquake in [SCOPE.sState('earthquake_state').GetName]"
 ca_central_america.93.d:0 "The earth has shaken [SCOPE.sState('earthquake_state').GetName]. Churches and houses have fallen, and the survivors sleep in the open."
 ca_central_america.93.f:0 ""The volcanoes are never quiet for long.""
 ca_central_america.93.a:0 "Send relief."
 ca_central_america.93.b:0 "They will rebuild on their own."
 ca_central_america.94.t:0 "The Literacy Campaign"
 ca_central_america.94.d:0 "The liberals propose a campaign to teach the people to read: schools in every town, teachers paid by the State. The clergy prefers to keep teaching the catechism."
 ca_central_america.94.f:0 ""A people that reads cannot be fooled.""
 ca_central_america.94.a:0 "Secular education."
 ca_central_america.94.b:0 "Leave education to the Church."
 ca_central_america.95.t:0 "Peasant Revolt in [SCOPE.sState('rebellion_state').GetName]"
 ca_central_america.95.d:0 "The peasants of [SCOPE.sState('rebellion_state').GetName] have risen against the tax collectors and the landowners who take their communal lands."
 ca_central_america.95.f:0 ""Land for those who work it.""
 ca_central_america.95.a:0 "Agrarian concessions."
 ca_central_america.95.b:0 "Military repression."
 ca_central_america.96.t:0 "An Offer from [SCOPE.sCountry('foreign_power').GetName]"
 ca_central_america.96.d:0 "The envoy of [SCOPE.sCountry('foreign_power').GetName] offers a loan on generous terms. Generous, at least, until the first payment is due."
 ca_central_america.96.f:0 ""Gold from abroad always comes with strings.""
 ca_central_america.96.a:0 "Accept the loan."
 ca_central_america.96.b:0 "Refuse."
 ca_central_america.97.t:0 "Border Trouble with [SCOPE.sCountry('border_neighbor').GetName]"
 ca_central_america.97.d:0 "Troops of [SCOPE.sCountry('border_neighbor').GetName] have been seen on our side of the border. Is it a mistake, a provocation or the first step of an invasion?"
 ca_central_america.97.f:0 ""Borders are drawn with ink and erased with blood.""
 ca_central_america.97.a:0 "Mobilize the army."
 ca_central_america.97.b:0 "Seek a peaceful settlement."
 ca_central_america.98.t:0 "The Army Wants More"
 ca_central_america.98.d:0 "The officers complain: they are badly paid, badly armed and badly commanded. They want a real army, and they want a voice in the government."
 ca_central_america.98.f:0 ""An army without bread is a danger to everyone.""
 ca_central_america.98.a:0 "Build a centralized army."
 ca_central_america.98.b:0 "Leave the army as it is."
 ca_central_america.168.t:0 "[SCOPE.sCharacter('ca_cau').GetFullName] Pronounces"
 ca_central_america.168.d:0 "The caudillo we recognized has gone further. [SCOPE.sCharacter('ca_cau').GetFullName] has proclaimed his own government in his stronghold and no longer recognizes the authority of the capital."
 ca_central_america.168.f:0 ""I do not rebel; I simply govern.""
 ca_central_america.168.a:0 "We must deal with him."
 ca_central_america.169.t:0 "Dealing with the Caudillo"
 ca_central_america.169.d:0 "The caudillo holds his stronghold with loyal men. We can recognize him as a vassal, march against him or buy him off."
 ca_central_america.169.f:0 ""Every man has a price; some prefer to be paid in power.""
 ca_central_america.169.a:0 "A pact: he will be our vassal."
 ca_central_america.169.b:0 "A campaign to crush him."
 ca_central_america.169.c:0 "Buy him off."
 ca_caudillo_campaign_play:0 "Campaign against the Caudillo"
 ca_central_america.170.t:0 "The Caudillo Marches on the Capital"
 ca_central_america.170.d:0 "After two years in his stronghold, the caudillo sees that the government is weak. His men are marching on the capital, and in the barracks some officers are waiting for him."
 ca_central_america.170.f:0 ""He who holds the capital, holds the Republic.""
 ca_central_america.170.a:0 "Defend the capital."
 ca_central_america.170.b:0 "Let him take power."
 ca_central_america.171.t:0 "The End of the Caudillo"
 ca_central_america.171.d:0 "The caudillo has outlasted every attempt to remove him. His stronghold is now a State of its own, and nobody expects it to come back."
 ca_central_america.171.d2:0 "The caudillo's adventure is over. His stronghold has returned to the authority of the government, one way or another."
 ca_central_america.171.f:0 ""Caudillos come and go; the mountains remain.""
 ca_central_america.171.a:0 "So ends the age of this caudillo."
 ca_central_america.172.t:0 "The Villages of [SCOPE.sState('ca_pst').GetName] Rise"
 ca_central_america.172.d:0 "The repression has not ended the revolt. The villages of [SCOPE.sState('ca_pst').GetName] have expelled the authorities and govern themselves through their own councils."
 ca_central_america.172.f:0 ""We were Indians before we were citizens.""
 ca_central_america.172.a:0 "This cannot stand."
 ca_central_america.173.t:0 "The Church Mediates"
 ca_central_america.173.d:0 "The bishop offers to mediate with the rebel villages: they will return to obedience if the government respects their lands and their customs."
 ca_central_america.173.f:0 ""The cross can do what the rifle cannot.""
 ca_central_america.173.a:0 "Accept the mediation."
 ca_central_america.173.b:0 "No concessions to rebels."
 ca_central_america.174.t:0 "The Mountain Resists"
 ca_central_america.174.d:0 "The rebel villages have taken to the mountains. The army cannot catch them, and the war is costing more every month. In the neighboring valleys, the peasants are listening."
 ca_central_america.174.f:0 ""Every hill is a fortress.""
 ca_central_america.174.a:0 "Send the army."
 ca_central_america.174.b:0 "Endure and wait."
 ca_peasant_campaign_play:0 "Campaign in the Mountains"
 ca_central_america.175.t:0 "The End of the Rebellion"
 ca_central_america.175.d:0 "The rebel communities have kept their autonomy. They govern themselves, pay no taxes and recognize the government only in name."
 ca_central_america.175.d2:0 "The rebel communities have returned to the authority of the State, by agreement or by force."
 ca_central_america.175.f:0 ""The land remembers.""
 ca_central_america.175.a:0 "So ends the rebellion."
 ca_central_america.130.t:0 "A Volcano Erupts in [SCOPE.sState('ca_dyn_state').GetName]"
 ca_central_america.130.d:0 "One of the volcanoes of [SCOPE.sState('ca_dyn_state').GetName] has erupted. Ash covers the fields and the villages on its slopes are buried."
 ca_central_america.130.a:0 "Send relief."
 ca_central_america.130.b:0 "There is nothing to be done."
 ca_central_america.131.t:0 "A Plague of Locusts"
 ca_central_america.131.d:0 "Clouds of locusts have descended on the fields. The maize, the beans and the young coffee trees are gone."
 ca_central_america.131.a:0 "Buy grain abroad."
 ca_central_america.131.b:0 "The peasants will manage."
 ca_central_america.132.t:0 "A Hurricane on the Caribbean Coast"
 ca_central_america.132.d:0 "A hurricane has swept the Caribbean coast of [SCOPE.sState('ca_dyn_state').GetName]. The ports and the plantations are in ruins, and the British offer help from Belize."
 ca_central_america.132.a:0 "Accept British help."
 ca_central_america.132.b:0 "We will rebuild alone."
 ca_central_america.133.t:0 "A Smallpox Epidemic"
 ca_central_america.133.d:0 "Smallpox is spreading in the towns. The doctors have the vaccine, but the people fear it more than the disease."
 ca_central_america.133.a:0 "A vaccination campaign."
 ca_central_america.133.b:0 "Let it pass."
 ca_central_america.134.t:0 "The Indigo Crisis"
 ca_central_america.134.d:0 "The price of indigo has collapsed in Europe. The planters, the merchants and the workers of the dye works are ruined."
 ca_central_america.134.a:0 "Help the indigo planters."
 ca_central_america.134.b:0 "Let the market decide."
 ca_central_america.135.t:0 "Smuggling on the Coast"
 ca_central_america.135.d:0 "The customs officers report that half the goods that reach the country enter through hidden coves, without paying a cent."
 ca_central_america.135.a:0 "Crack down on the smugglers."
 ca_central_america.135.b:0 "Better a little trade than none."
 ca_central_america.136.t:0 "Bandits on the Roads"
 ca_central_america.136.d:0 "Bandits are robbing the mule trains on the royal roads. The merchants demand protection."
 ca_central_america.136.a:0 "Send the army."
 ca_central_america.136.b:0 "Let the towns arm their own guards."
 ca_central_america.137.t:0 "Mutiny in the Barracks"
 ca_central_america.137.d:0 "The garrison of the capital has mutinied: the soldiers have not been paid for months."
 ca_central_america.137.a:0 "Pay them."
 ca_central_america.137.b:0 "Punish the leaders."
 ca_central_america.138.t:0 "A Rigged Election"
 ca_central_america.138.d:0 "Everyone knows the election was rigged: the dead voted, the living did not, and the ballot boxes arrived full."
 ca_central_america.138.a:0 "Annul the election."
 ca_central_america.138.b:0 "Accept the result."
 ca_central_america.139.t:0 "The Tithe in Dispute"
 ca_central_america.139.d:0 "The peasants refuse to pay the tithe to the Church, and the liberals propose abolishing it altogether."
 ca_central_america.139.a:0 "Abolish the tithe."
 ca_central_america.139.b:0 "Keep the tithe."
 ca_central_america.140.t:0 "The Rivalry of the Cities"
 ca_central_america.140.d:0 "León and Granada both claim to be the true capital of Nicaragua, and neither will obey a government seated in the other."
 ca_central_america.140.d2:0 "Comayagua and Tegucigalpa both claim to be the true capital of Honduras: one has the bishop and the tradition, the other the silver and the merchants."
 ca_central_america.140.d3:0 "Cartago, the old colonial capital, and San José, the rich new city, both claim to be the heart of Costa Rica."
 ca_central_america.140.f:0 ""Two cities, one throne.""
 ca_central_america.140.a:0 "The capital stays where it is."
 ca_central_america.140.b:0 "Move the capital to the rival city."
 ca_central_america.140.c:0 "The capital will alternate between them."
 ca_central_america.141.t:0 "Drought in the Countryside"
 ca_central_america.141.d:0 "The rains have not come. The maize is dying in the fields and food prices are rising in the markets."
 ca_central_america.141.a:0 "Buy grain."
 ca_central_america.141.b:0 "Let prices settle."
 ca_central_america.142.t:0 "European Colonists"
 ca_central_america.142.d:0 "A European colonization company proposes to settle families on our empty Atlantic lands, with roads and a port of their own."
 ca_central_america.142.a:0 "Welcome the colonists."
 ca_central_america.142.b:0 "We do not need foreigners."
 ca_central_america.143.t:0 "The Canal Concession"
 ca_central_america.143.d:0 "A foreign company asks for a concession to dig a canal between the oceans across our territory. It promises riches; it also promises a foreign enclave."
 ca_central_america.143.a:0 "Grant the concession."
 ca_central_america.143.b:0 "The canal must be ours."
 ca_central_america.144.t:0 "The California Gold Rush"
 ca_central_america.144.d:0 "Gold has been found in California. Thousands of travelers want to cross Central America on their way to the mines, and they pay well."
 ca_central_america.144.a:0 "Open a transit route."
 ca_central_america.144.b:0 "Keep the foreigners out."
 ca_central_america.145.t:0 "Filibusters"
 ca_central_america.145.d:0 "Armed adventurers have landed on the coast, talking of colonies, slaves and empires. They are few, but they are well armed."
 ca_central_america.145.a:0 "Mobilize against them."
 ca_central_america.145.b:0 "Ignore them."
 ca_central_america.146.t:0 "A Border Dispute with [SCOPE.sCountry('ca_dyn_neighbor').GetName]"
 ca_central_america.146.d:0 "A village on the border claims to belong to [SCOPE.sCountry('ca_dyn_neighbor').GetName], and both governments have sent soldiers."
 ca_central_america.146.a:0 "Negotiate."
 ca_central_america.146.b:0 "Hold the line."
 ca_central_america.147.t:0 "Exiles Ask for Asylum"
 ca_central_america.147.d:0 "A group of exiles from [SCOPE.sCountry('ca_dyn_neighbor').GetName] has crossed the border and asks for asylum. Their government demands that we hand them over."
 ca_central_america.147.a:0 "Grant them asylum."
 ca_central_america.147.b:0 "Hand them over."
 ca_central_america.148.t:0 "A Shortage of Coin"
 ca_central_america.148.d:0 "There is not enough coin in the markets. Merchants pay in cacao beans and IOUs, and the treasury cannot collect its taxes."
 ca_central_america.148.a:0 "Mint new coins."
 ca_central_america.148.b:0 "Allow foreign coins."
 ca_central_america.149.t:0 "Weapons from Belize"
 ca_central_america.149.d:0 "British merchants in Belize are selling rifles to anyone who pays: rebels, caudillos and Mosquito chiefs alike."
 ca_central_america.149.a:0 "Confiscate the weapons."
 ca_central_america.149.b:0 "Let them sell."
 ca_peasant_concessions:0 "Concessions to the Villages"
 ca_peasant_concessions_desc:0 "The government has respected the lands and customs of the villages."
 ca_peasant_guerrilla:0 "War in the Mountains"
 ca_peasant_guerrilla_desc:0 "The army is fighting a guerrilla war it cannot win."
 ca_clean_vote:0 "A Clean Vote"
 ca_clean_vote_desc:0 "The rigged election was annulled."
 ca_rigged_vote:0 "A Rigged Vote"
 ca_rigged_vote_desc:0 "Everyone knows the election was rigged."
 ca_capital_moved:0 "The Capital Moved"
 ca_capital_moved_desc:0 "The government is moving to a new capital."
 ca_capital_alternating:0 "An Alternating Capital"
 ca_capital_alternating_desc:0 "The capital moves between two rival cities."
 ca_food_relief:0 "Food Relief"
 ca_food_relief_desc:0 "The government buys grain for the hungry."
 ca_drought:0 "Drought"
 ca_drought_desc:0 "The rains have not come."
 ca_european_colony:0 "European Colonists"
 ca_european_colony_desc:0 "European families are settling the Atlantic lands."
 ca_new_coinage:0 "New Coinage"
 ca_new_coinage_desc:0 "The mint has issued new coins."
 ca_foreign_coin:0 "Foreign Coin"
 ca_foreign_coin_desc:0 "Foreign coins circulate freely in the markets."
