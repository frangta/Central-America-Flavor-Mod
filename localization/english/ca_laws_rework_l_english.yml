l_english:

 # ===================================================================
 # NEW LAWS - STATE STRUCTURE
 # ===================================================================
 law_ca_departmental_state:0 "Department"
 law_ca_departmental_state_desc:0 "Under a unitary republic this former state is governed as a department of the Union. Its governors are appointed by the capital, its revenues flow to the central treasury, and local resentment grows."
 law_ca_sovereign_state:0 "Sovereign State"
 law_ca_sovereign_state_desc:0 "This Central American nation stands outside any Union and answers to no federal or confederal authority."

 # ===================================================================
 # NEW LAWS - INDEPENDENT AND VARIANTS
 # ===================================================================
 law_ca_mandamientos:0 "Mandamientos"
 law_ca_mandamientos_desc:0 "Indigenous villages are required to supply quotas of labourers to the plantations. The harvest is secured, but at a terrible cost to the communities."
 law_ca_municipalismo:0 "Municipalism"
 law_ca_municipalismo_desc:0 "Town councils administer and tax their own districts. The old cabildos act as a counterweight to the power of the capital."
 law_ca_escuela_laica:0 "Free and Compulsory Lay Schooling"
 law_ca_escuela_laica_desc:0 "Primary education is free, compulsory and paid for by the State, independent of the Church."
 law_ca_guardia_nacional:0 "National Guard"
 law_ca_guardia_nacional_desc:0 "A combined military and police force trained and armed by a foreign power. Effective at keeping order, but it opens the door to foreign influence."
 law_ca_federal_army:0 "Federal Army"
 law_ca_federal_army_desc:0 "A professional army that answers to the federal government rather than to the individual states."

 # ===================================================================
 # GOVERNMENT TYPES
 # ===================================================================
 gov_ca_coffeacracia:0 "Coffee Republic"
 gov_ca_coffeacracia_desc:0 "A republic governed in the interest of the great coffee growers."
 gov_ca_tecnocracy:0 "Positivist Republic"
 gov_ca_tecnocracy_desc:0 "A republic directed by scientists and engineers under the banner of Order and Progress."
 gov_ca_military_junta:0 "Military Junta"
 gov_ca_military_junta_desc:0 "The officer corps governs the nation directly."
 gov_ca_consejo_junta:0 "Junta Council"
 gov_ca_consejo_junta_desc:0 "A civil and military council that shares power while the country prepares a return to constitutional rule."
 gov_ca_director_supremo:0 "Supreme Directorate"
 gov_ca_jefe_estado:0 "Free State"
 gov_ca_jefe_supremo:0 "Perpetual Dictatorship"
 gov_ca_republica_cafetalera:0 "Coffee Oligarchy"
 gov_ca_republica_bananera:0 "Banana Republic"
 gov_ca_junta:0 "Central American Junta"
 gov_ca_presidential_democracy:0 "Presidential Democracy"
 gov_ca_presidential_oligarchy:0 "Presidential Oligarchy"

 RULER_TITLE_CA_COFFEE_PRESIDENT:0 "President"
 RULER_TITLE_CA_SUPREME_DIRECTOR_OF_PROGRESS:0 "Director of Progress"
 RULER_TITLE_CA_JUNTA_PRESIDENT:0 "President of the Junta"
 RULER_TITLE_CA_COUNCIL_PRESIDENT:0 "President of the Council"
 RULER_TITLE_SUPREME_DIRECTOR:0 "Supreme Director"
 RULER_TITLE_JEFE_DE_ESTADO:0 "Head of State"
 RULER_TITLE_PERPETUAL_DICTATOR:0 "Perpetual Dictator"



 # ===================================================================
 # AMENDMENTS - GENERIC
 # ===================================================================
 amendment_vagrancy_laws:0 "Vagrancy Laws"
 amendment_vagrancy_laws_desc:0 "Anyone unable to prove employment may be pressed into work on the estates."
 amendment_jefes_politicos:0 "Political Chiefs"
 amendment_jefes_politicos_desc:0 "Each department is ruled by an agent of the Executive who commands its police and militia."

 # ===================================================================
 # AMENDMENTS - HISTORICAL CONSTITUTIONS
 # ===================================================================
 amendment_costa_rica_1830s:0 "Fundamental Law of the Free State"
 amendment_costa_rica_1830s_desc:0 "The founding charter of the Free State of Costa Rica."
 amendment_ca_bases_y_garantias:0 "Decree of Bases and Guarantees"
 amendment_ca_bases_y_garantias_desc:0 "Braulio Carrillo's decree of 1841 abolishes the municipalities and concentrates power in a perpetual head of state."
 amendment_free_costa_rica_reform:0 "Constitution of 1844"
 amendment_free_costa_rica_reform_desc:0 "A new charter for the Free State of Costa Rica that restores representative government."
 amendment_costa_rica_1st_republic:0 "Constitution of 1847"
 amendment_costa_rica_1st_republic_desc:0 "Costa Rica proclaims itself a republic, fully independent of any Union."
 amendment_costa_rica_socialist_republic:0 "National Workers' Pact"
 amendment_costa_rica_socialist_republic_desc:0 "Workers and peasants bind themselves together in a new social compact."
 amendment_nicaragua_1826:0 "Constitution of 1826"
 amendment_nicaragua_1826_desc:0 "The first constitution of the State of Nicaragua, inspired by the Charter of Cádiz."
 amendment_nicaragua_1838:0 "Constitution of 1838"
 amendment_nicaragua_1838_desc:0 "A conservative charter that separates Nicaragua from the Federation."
 amendment_nicaragua_1858:0 "Constitution of 1858"
 amendment_nicaragua_1858_desc:0 "After the National War, the conservatives open three decades of stable rule."
 amendment_nicaragua_1893:0 "La Libérrima"
 amendment_nicaragua_1893_desc:0 "José Santos Zelaya's liberal constitution secularises the state."
 amendment_nicaragua_1905:0 "Constitution of 1905"
 amendment_nicaragua_1905_desc:0 "Zelaya rewrites the constitution to remain in power."
 amendment_nicaragua_1911:0 "Constitution of 1911"
 amendment_nicaragua_1911_desc:0 "A conservative restoration backed by the United States."
 amendment_honduras_1839:0 "Constitution of 1839"
 amendment_honduras_1839_desc:0 "Honduras's first charter after leaving the Federation."
 amendment_honduras_1880:0 "Constitution of 1880"
 amendment_honduras_1880_desc:0 "Marco Aurelio Soto's liberal reform opens the country to mining and modernisation."
 amendment_el_salvador_1824:0 "Constitution of 1824"
 amendment_el_salvador_1824_desc:0 "The first liberal constitution of the State of El Salvador within the Federation."
 amendment_el_salvador_1841:0 "Constitution of 1841"
 amendment_el_salvador_1841_desc:0 "El Salvador leaves the Federation under the influence of its generals."
 amendment_el_salvador_1886:0 "Constitution of 1886"
 amendment_el_salvador_1886_desc:0 "The coffee republic consolidates the power of the great families."
 amendment_guatemala_1825:0 "Constitution of 1825"
 amendment_guatemala_1825_desc:0 "The liberal constitution of the State of Guatemala during the federal era."
 amendment_guatemala_1851:0 "Constitutive Act of 1851"
 amendment_guatemala_1851_desc:0 "Rafael Carrera's conservative order, allied with the Church."
 amendment_guatemala_1879:0 "Constitution of 1879"
 amendment_guatemala_1879_desc:0 "Justo Rufino Barrios's liberal reform anticlericalism and railways."
 amendment_los_altos_1838:0 "Constitution of Los Altos"
 amendment_los_altos_1838_desc:0 "Quetzaltenango and the western highlands proclaim their own state."
 amendment_chiapas_1826:0 "Constitution of Chiapas"
 amendment_chiapas_1826_desc:0 "The first constitution of Chiapas."

 # ===================================================================
 # AMENDMENTS - CENTRAL AMERICAN LAWS
 # ===================================================================
 amendment_ca_libretas_jornaleros:0 "Labourers' Workbooks"
 amendment_ca_libretas_jornaleros_desc:0 "Every labourer must carry a workbook recording his debts and his employer."
 amendment_ca_exencion_fiscal:0 "Planters' Tax Exemption"
 amendment_ca_exencion_fiscal_desc:0 "Coffee estates are exempted from most taxes."
 amendment_ca_inversion_barones:0 "Coffee Barons' Investment"
 amendment_ca_inversion_barones_desc:0 "The coffee barons pay for the roads and ports that carry their harvest."
 amendment_ca_darwinismo_social:0 "Social Darwinism"
 amendment_ca_darwinismo_social_desc:0 "The state favours European immigration and treats the indigenous majority as an obstacle to progress."
 amendment_ca_educacion_positivista:0 "Positivist Education"
 amendment_ca_educacion_positivista_desc:0 "Schools teach science and civic duty in place of catechism."
 amendment_ca_fomento_cientifico:0 "Scientific Development"
 amendment_ca_fomento_cientifico_desc:0 "State engineers direct the development of mines and workshops."
 amendment_ca_tribunales_militares:0 "Military Tribunals"
 amendment_ca_tribunales_militares_desc:0 "Civilians accused of sedition are tried by courts martial."
 amendment_ca_presupuesto_negro:0 "Secret Budget"
 amendment_ca_presupuesto_negro_desc:0 "A hidden share of the treasury goes to the officers."
 amendment_ca_leva_suprema:0 "Supreme Levy"
 amendment_ca_leva_suprema_desc:0 "Every able-bodied man can be pressed into service."
 amendment_ca_gabinete_transicion:0 "Transitional Cabinet"
 amendment_ca_gabinete_transicion_desc:0 "Civilian ministers share the cabinet with the generals."
 amendment_ca_pacto_generales:0 "Generals' Pact"
 amendment_ca_pacto_generales_desc:0 "The officers are paid well so that they stay in their barracks."
 amendment_ca_amnistia_politica:0 "Political Amnesty"
 amendment_ca_amnistia_politica_desc:0 "Exiles are allowed to return and prisoners are released."
 amendment_ca_justicia_consuetudinaria:0 "Customary Justice"
 amendment_ca_justicia_consuetudinaria_desc:0 "Village elders settle disputes according to local custom."
 amendment_ca_milicias_autodefensa:0 "Self-Defence Militias"
 amendment_ca_milicias_autodefensa_desc:0 "Villages arm themselves to defend their lands."
 amendment_ca_patrullajes_agricolas:0 "Field Patrols"
 amendment_ca_patrullajes_agricolas_desc:0 "Community patrols guard the crops and the granaries."

 # ===================================================================
 # AMENDMENTS - NEW HISTORICAL
 # ===================================================================
 amendment_ca_extincion_ejidos:0 "Abolition of the Ejidos"
 amendment_ca_extincion_ejidos_desc:0 "Communal lands are abolished and sold to expand the coffee estates."
 amendment_ca_reglamento_jornaleros:0 "Labourers' Regulation"
 amendment_ca_reglamento_jornaleros_desc:0 "Workbooks and debts bind labourers to the estates."
 amendment_ca_matrimonio_civil:0 "Civil Marriage"
 amendment_ca_matrimonio_civil_desc:0 "Marriage becomes a civil contract registered by the State."
 amendment_ca_expulsion_jesuitas:0 "Expulsion of the Jesuits"
 amendment_ca_expulsion_jesuitas_desc:0 "The Society of Jesus is expelled and its property seized."
 amendment_ca_concordato:0 "Concordat with the Holy See"
 amendment_ca_concordato_desc:0 "The Church regains its privileges and its role in education."
 amendment_ca_patronato:0 "National Patronage"
 amendment_ca_patronato_desc:0 "The State appoints bishops and parish priests."
 amendment_ca_contrato_keith:0 "Railway Concession Contract"
 amendment_ca_contrato_keith_desc:0 "A foreign entrepreneur builds the railway to the Atlantic in exchange for vast tracts of land."
 amendment_ca_abolicion_pena_muerte:0 "Abolition of the Death Penalty"
 amendment_ca_abolicion_pena_muerte_desc:0 "Capital punishment is abolished."
 amendment_ca_estanco:0 "Liquor and Tobacco Monopoly"
 amendment_ca_estanco_desc:0 "The State keeps its colonial monopoly over liquor and tobacco."

 # ===================================================================
 # AMENDMENTS - NEW DYNAMIC
 # ===================================================================
 amendment_ca_continuismo:0 "Continuismo"
 amendment_ca_continuismo_desc:0 "The president is re-elected in defiance of the constitution."
 amendment_ca_estado_de_sitio:0 "State of Siege"
 amendment_ca_estado_de_sitio_desc:0 "Constitutional guarantees are suspended while the emergency lasts."
 amendment_ca_intervencion_aduanera:0 "Customs Receivership"
 amendment_ca_intervencion_aduanera_desc:0 "Foreign creditors collect their debts directly at the customs houses."

 # ===================================================================
 # AMENDMENTS - NEW ALTERNATE HISTORY
 # ===================================================================
 amendment_ca_senado_de_estados:0 "Senate of the States"
 amendment_ca_senado_de_estados_desc:0 "Every state holds an equal number of seats in the federal senate."
 amendment_ca_capital_rotativa:0 "Rotating Capital"
 amendment_ca_capital_rotativa_desc:0 "The federal capital moves between the states so that none can dominate the Union."
 amendment_ca_dieta_confederal:0 "Confederal Diet"
 amendment_ca_dieta_confederal_desc:0 "A common diet of delegates coordinates the policy of the confederated states."
 amendment_ca_ejercito_unico:0 "Single Army"
 amendment_ca_ejercito_unico_desc:0 "The state militias are dissolved into one national army."
 amendment_ca_ciudadania_centroamericana:0 "Central American Citizenship"
 amendment_ca_ciudadania_centroamericana_desc:0 "Every Central American is a citizen in any state of the Union."
