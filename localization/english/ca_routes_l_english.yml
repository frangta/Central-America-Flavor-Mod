l_english:
 # CAFM - F11 - Rutas federal y centralista
 ca_federalist_events.1.t:0 "The Federal Pact"
 ca_federalist_events.1.d:0 "The Federation needs allies to survive the coming storm. Each of the great interests of the Republic offers its support, at a price."
 ca_federalist_events.1.f:0 ""The Union is a contract, and every contract has its terms.""
 ca_federalist_events.1.a:0 "Rely on the liberal intelligentsia."
 ca_federalist_events.1.b:0 "Reassure the landowners of the States."
 ca_federalist_events.1.c:0 "Trust the federal army."
 ca_federalist_events.2.t:0 "The Constitution at Stake"
 ca_federalist_events.2.d:0 "The States are leaving and Congress has opened the door. The federal Constitution of 1824 must be defended, reformed or abandoned."
 ca_federalist_events.2.f:0 ""A constitution that nobody obeys is just paper.""
 ca_federalist_events.2.a:0 "Defend it by force of arms."
 ca_federalist_events.2.b:0 "Reform it: give the States more autonomy."
 ca_federalist_events.2.c:0 "Accept what cannot be changed."
 ca_federalist_events.3.t:0 "[SCOPE.sCharacter('ca_general').GetFullName] Defends the Federation"
 ca_federalist_events.3.d:0 "War has come. [SCOPE.sCharacter('ca_general').GetFullName] offers to lead the federal army against the rebellious States, but asks for full command and the means to win."
 ca_federalist_events.3.f:0 ""Give me soldiers and I will give you a Republic.""
 ca_federalist_events.3.a:0 "Give the general full command."
 ca_federalist_events.3.b:0 "Keep the army under civilian control."
 ca_federalist_events.4.t:0 "The Federal Resistance"
 ca_federalist_events.4.d:0 "The Federation has survived the war, but its enemies are everywhere: British consuls, Mexican agents, angry priests and ambitious colonels. The government must choose where to stand firm."
 ca_federalist_events.4.f:0 ""We cannot be strong everywhere.""
 ca_federalist_events.4.a:0 "Concentrate on the most dangerous front."
 ca_federalist_events.4.b:0 "Mobilize the whole Republic."
 ca_federalist_events.5.t:0 "The Republic Restored"
 ca_federalist_events.5.d:0 "Against all odds, the Federal Republic of Central America has survived its darkest years. The bells ring in San Salvador and Guatemala, and the five volcanoes fly again over the whole isthmus."
 ca_federalist_events.5.f:0 ""Union, God and Liberty!""
 ca_federalist_events.5.a:0 "Celebrate the Republic."
 ca_federalist_events.5.b:0 "Reward the loyal States."
 ca_federalist_events.6.t:0 "Teachers Reach the Villages"
 ca_federalist_events.6.d:0 "Young teachers trained in the capital are arriving in the villages to open the new secular schools. Where they are welcomed, the reform advances quickly."
 ca_federalist_events.6.f:0 ""Laws are made in the capital, but obeyed in the provinces.""
 ca_federalist_events.6.a:0 "Pay them well and protect them."
 ca_federalist_events.6.b:0 "Let the villages pay for their schools."
 ca_federalist_events.7.t:0 "School or Catechism?"
 ca_federalist_events.7.d:0 "The bishops demand that the new schools keep teaching the catechism. The liberals answer that the Republic must educate citizens, not parishioners."
 ca_federalist_events.7.f:0 ""Laws are made in the capital, but obeyed in the provinces.""
 ca_federalist_events.7.a:0 "No catechism in the public school."
 ca_federalist_events.7.b:0 "A compromise: religion on Sundays."
 ca_federalist_events.8.t:0 "Pulpits Against the School"
 ca_federalist_events.8.d:0 "From every pulpit the priests preach against the godless schools. Parents keep their children at home, and the reform has stalled."
 ca_federalist_events.8.f:0 ""Laws are made in the capital, but obeyed in the provinces.""
 ca_federalist_events.8.a:0 "Close the most rebellious parishes."
 ca_federalist_events.8.b:0 "Wait for calmer times."
 ca_federalist_events.9.t:0 "The Civil Registry"
 ca_federalist_events.9.d:0 "Births, marriages and deaths will no longer be recorded by the parish priest but by the State. The liberals want to go further and recognize civil marriage."
 ca_federalist_events.9.f:0 ""Laws are made in the capital, but obeyed in the provinces.""
 ca_federalist_events.9.a:0 "Introduce civil marriage."
 ca_federalist_events.9.b:0 "The registry is enough."
 ca_federalist_events.10.t:0 "Exile the Rebellious Prelate?"
 ca_federalist_events.10.d:0 "The archbishop has excommunicated the federal authorities. Some ministers want him expelled from the country, as was done in 1829."
 ca_federalist_events.10.f:0 ""Laws are made in the capital, but obeyed in the provinces.""
 ca_federalist_events.10.a:0 "Exile him."
 ca_federalist_events.10.b:0 "Negotiate with the Church."
 ca_federalist_events.11.t:0 "The Epidemic as Divine Punishment"
 ca_federalist_events.11.d:0 "The faithful say the epidemic is God's punishment for the impiety of the government. The separation of Church and State has lost all popular support."
 ca_federalist_events.11.f:0 ""Laws are made in the capital, but obeyed in the provinces.""
 ca_federalist_events.11.a:0 "Send doctors, not priests."
 ca_federalist_events.11.b:0 "Allow the processions."
 ca_federalist_events.12.t:0 "Open Town Councils"
 ca_federalist_events.12.d:0 "In the towns of the Republic the citizens gather in open councils to elect their authorities. The municipal reform is popular wherever it arrives."
 ca_federalist_events.12.f:0 ""Laws are made in the capital, but obeyed in the provinces.""
 ca_federalist_events.12.a:0 "Extend the open councils."
 ca_federalist_events.12.b:0 "Keep them under the jefes politicos."
 ca_federalist_events.13.t:0 "A Senate of the States?"
 ca_federalist_events.13.d:0 "The deputies of the smaller States demand a Senate where every State has the same voice, or a capital that rotates among them."
 ca_federalist_events.13.f:0 ""Laws are made in the capital, but obeyed in the provinces.""
 ca_federalist_events.13.a:0 "A Senate of the States."
 ca_federalist_events.13.b:0 "A rotating capital."
 ca_federalist_events.14.t:0 "[SCOPE.sState('ca_weak_state').GetName] Resists"
 ca_federalist_events.14.d:0 "The authorities of [SCOPE.sState('ca_weak_state').GetName] refuse to apply the municipal reform. They say it is one more order from a capital they no longer trust."
 ca_federalist_events.14.f:0 ""Laws are made in the capital, but obeyed in the provinces.""
 ca_federalist_events.14.a:0 "Insist on the reform."
 ca_federalist_events.14.b:0 "Let them keep their old councils."
 ca_federalist_events.15.t:0 "A Foreign Concession Asks for Land"
 ca_federalist_events.15.d:0 "A foreign company offers to colonize the empty lands of the Caribbean coast, with roads and settlers, in exchange for a vast concession."
 ca_federalist_events.15.f:0 ""Progress has a price.""
 ca_federalist_events.15.a:0 "Grant the concession."
 ca_federalist_events.15.b:0 "The land of the Republic is not for sale."
 ca_federalist_events.16.t:0 "The Federal Revenues Fall Short"
 ca_federalist_events.16.d:0 "The States keep the tobacco and liquor monopolies for themselves, and the federal treasury cannot pay the army or the officials."
 ca_federalist_events.16.f:0 ""A Republic without money is a Republic without soldiers.""
 ca_federalist_events.16.a:0 "Borrow from the merchants."
 ca_federalist_events.16.b:0 "Cut the salaries of the officials."
 ca_federalist_events.17.t:0 "Congress Without a Quorum"
 ca_federalist_events.17.d:0 "So many deputies have gone home that the federal Congress cannot meet. The laws of the Republic wait for a vote that never comes."
 ca_federalist_events.17.f:0 ""The empty benches speak louder than any speech.""
 ca_federalist_events.17.a:0 "Call an extraordinary session."
 ca_federalist_events.17.b:0 "Govern by decree for now."
 ca_federalist_events.18.t:0 "The Exiles Conspire"
 ca_federalist_events.18.d:0 "The conservatives exiled after 1829 are plotting from Havana and Chiapas. Their agents are everywhere, buying weapons and promising rewards."
 ca_federalist_events.18.f:0 ""The past never stays in exile.""
 ca_federalist_events.18.a:0 "Offer them an amnesty."
 ca_federalist_events.18.b:0 "Watch them closely."
 ca_federalist_events.19.t:0 "The Civic Militia"
 ca_federalist_events.19.d:0 "The liberal clubs propose arming a civic militia of artisans and small farmers to defend the Federation, independent of the regular army."
 ca_federalist_events.19.f:0 ""Every citizen a soldier of the Republic.""
 ca_federalist_events.19.a:0 "Arm the civic militia."
 ca_federalist_events.19.b:0 "Only the army bears arms."
 ca_federalist_events.20.t:0 "[SCOPE.sCharacter('ca_candidate').GetFullName] Wins the Federal Election"
 ca_federalist_events.20.d:0 "The federal election is over. [SCOPE.sCharacter('ca_candidate').GetFullName] will lead the Republic, but the losers already speak of fraud."
 ca_federalist_events.20.f:0 ""The votes are counted; the quarrels are not over.""
 ca_federalist_events.20.a:0 "Accept the result."
 ca_federalist_events.20.b:0 "Challenge the count in the provinces."
 ca_centralist_events.1.t:0 "The Strong Hand"
 ca_centralist_events.1.d:0 "The government has chosen the path of a single Republic. It needs a pillar to stand on: the army, the Church or the great landowners."
 ca_centralist_events.1.f:0 ""Order first; liberty, perhaps, later.""
 ca_centralist_events.1.a:0 "The army will be our pillar."
 ca_centralist_events.1.b:0 "The Church will bless the Republic."
 ca_centralist_events.1.c:0 "The landowners will keep the provinces in order."
 ca_centralist_events.2.t:0 "The Congress Dissolved"
 ca_centralist_events.2.d:0 "The federal Congress is no more. The ministers ask how the Republic will be governed now."
 ca_centralist_events.2.f:0 ""The Republic has fewer voices, but one will.""
 ca_centralist_events.2.a:0 "By decree of the government."
 ca_centralist_events.2.b:0 "By a provisional Council of State."
 ca_centralist_events.3.t:0 "[SCOPE.sCharacter('ca_general').GetFullName] and the War of the Union"
 ca_centralist_events.3.d:0 "[SCOPE.sCharacter('ca_general').GetFullName] will lead the war to restore the one and indivisible Republic. The general asks for extraordinary powers over the provinces at war."
 ca_centralist_events.3.f:0 ""Unity or death.""
 ca_centralist_events.3.a:0 "Grant extraordinary powers."
 ca_centralist_events.3.b:0 "The government keeps command."
 ca_centralist_events.4.t:0 "[SCOPE.sCharacter('ca_ruler').GetFullName] Proclaims Himself Supreme Director"
 ca_centralist_events.4.d:0 "The war is won, but the Republic is exhausted. [SCOPE.sCharacter('ca_ruler').GetFullName] is urged by the officers to take the title of Supreme Director and rule without limits."
 ca_centralist_events.4.f:0 ""One man, one Republic.""
 ca_centralist_events.4.a:0 "Accept the supreme power."
 ca_centralist_events.4.b:0 "Refuse: the Republic needs laws, not a master."
 ca_centralist_events.5.t:0 "The Unitary Republic"
 ca_centralist_events.5.d:0 "The one and indivisible Republic stands. From Guatemala to Costa Rica the orders of the central government are obeyed, willingly or not."
 ca_centralist_events.5.f:0 ""One flag, one law, one Republic.""
 ca_centralist_events.5.a:0 "Long live the Republic!"
 ca_centralist_events.7.t:0 "The Intendants Take Their Oath"
 ca_centralist_events.7.d:0 "The new federal intendants have sworn loyalty to the Republic and are leaving for the provinces. Their arrival will make the unitary law a reality."
 ca_centralist_events.7.f:0 ""The Republic is built one law at a time.""
 ca_centralist_events.7.a:0 "Give them broad powers."
 ca_centralist_events.7.b:0 "Let them work with the local notables."
 ca_centralist_events.8.t:0 "Move the Capital?"
 ca_centralist_events.8.d:0 "If the Republic is to be one, where should its capital be? The deputies of Guatemala want it back in their city; others propose a capital that rotates among the provinces."
 ca_centralist_events.8.f:0 ""The Republic is built one law at a time.""
 ca_centralist_events.8.a:0 "Guatemala City, the largest city of the isthmus."
 ca_centralist_events.8.b:0 "A capital that rotates among the provinces."
 ca_centralist_events.9.t:0 "[SCOPE.sState('ca_weak_state').GetName] Protests"
 ca_centralist_events.9.d:0 "The notables of [SCOPE.sState('ca_weak_state').GetName] protest against the loss of their State's rights. The unitary law has stalled."
 ca_centralist_events.9.f:0 ""The Republic is built one law at a time.""
 ca_centralist_events.9.a:0 "Send troops."
 ca_centralist_events.9.b:0 "Promise them local privileges."
 ca_centralist_events.10.t:0 "Career Officers"
 ca_centralist_events.10.d:0 "The first class of career officers has graduated from the military academy. They want a single army, without the militias of the States."
 ca_centralist_events.10.f:0 ""The Republic is built one law at a time.""
 ca_centralist_events.10.a:0 "A single army for the Republic."
 ca_centralist_events.10.b:0 "Keep the militias for now."
 ca_centralist_events.11.t:0 "Conscription or Volunteers?"
 ca_centralist_events.11.d:0 "The National Guard needs men. The officers want a general levy; the landowners do not want to lose their workers."
 ca_centralist_events.11.f:0 ""The Republic is built one law at a time.""
 ca_centralist_events.11.a:0 "A general levy."
 ca_centralist_events.11.b:0 "Volunteers only."
 ca_centralist_events.12.t:0 "The Militias of [SCOPE.sState('ca_weak_state').GetName] Refuse to Disband"
 ca_centralist_events.12.d:0 "The militias of [SCOPE.sState('ca_weak_state').GetName] refuse to hand over their weapons to the National Guard."
 ca_centralist_events.12.f:0 ""The Republic is built one law at a time.""
 ca_centralist_events.12.a:0 "Disarm them by force."
 ca_centralist_events.12.b:0 "Incorporate them as they are."
 ca_centralist_events.13.t:0 "The Concordat"
 ca_centralist_events.13.d:0 "Rome is ready to sign a concordat with the Republic: the Church will support the government in exchange for its old privileges."
 ca_centralist_events.13.f:0 ""The Republic is built one law at a time.""
 ca_centralist_events.13.a:0 "Sign the Concordat."
 ca_centralist_events.13.b:0 "Not yet."
 ca_centralist_events.14.t:0 "The Patronage"
 ca_centralist_events.14.d:0 "Who appoints the bishops: Rome or the Republic? The government wants to keep the old royal patronage of the Spanish kings."
 ca_centralist_events.14.f:0 ""The Republic is built one law at a time.""
 ca_centralist_events.14.a:0 "The Republic keeps the patronage."
 ca_centralist_events.14.b:0 "Leave it to Rome."
 ca_centralist_events.15.t:0 "The Intellectuals Denounce the Privileges"
 ca_centralist_events.15.d:0 "Lawyers and journalists denounce the return of the Church's privileges. The state religion law has lost momentum."
 ca_centralist_events.15.f:0 ""The Republic is built one law at a time.""
 ca_centralist_events.15.a:0 "Close their newspapers."
 ca_centralist_events.15.b:0 "Let them speak."
 ca_centralist_events.6.t:0 "Centralist Coup in [SCOPE.sCountry('ca_coup_state').GetName]"
 ca_centralist_events.6.d:0 "Officers loyal to the central government have seized power in [SCOPE.sCountry('ca_coup_state').GetName]. The new authorities promise obedience to the Republic."
 ca_centralist_events.6.f:0 ""Order has been restored.""
 ca_centralist_events.6.a:0 "Support the new government."
 ca_centralist_events.6.b:0 "Keep our distance."
 ca_centralist_events.16.t:0 "The Press Under Censorship"
 ca_centralist_events.16.d:0 "The censors read every newspaper before it is printed. The liberal press has gone underground, and its pamphlets circulate secretly."
 ca_centralist_events.16.f:0 ""What cannot be printed is whispered.""
 ca_centralist_events.16.a:0 "Tighten the censorship."
 ca_centralist_events.16.b:0 "Allow some criticism."
 ca_centralist_events.17.t:0 "The Liberal Exiles"
 ca_centralist_events.17.d:0 "The liberals exiled by the government have found refuge in neighboring countries. From there they write, plot and wait for their moment."
 ca_centralist_events.17.f:0 ""Exile is the antechamber of return.""
 ca_centralist_events.17.a:0 "Ask our neighbors to expel them."
 ca_centralist_events.17.b:0 "Ignore them."
 ca_centralist_events.18.t:0 "Conspiracy in [SCOPE.sState('ca_weak_state').GetName]"
 ca_centralist_events.18.d:0 "The police have discovered a conspiracy against the central government in [SCOPE.sState('ca_weak_state').GetName]. Its leaders are well-known local notables."
 ca_centralist_events.18.f:0 ""Every province has its conspirators.""
 ca_centralist_events.18.a:0 "Arrest them all."
 ca_centralist_events.18.b:0 "Buy their silence."
 ca_centralist_events.19.t:0 "The Council of State"
 ca_centralist_events.19.d:0 "The ministers propose a Council of State of notables to advise the government, a substitute for the dissolved Congress."
 ca_centralist_events.19.f:0 ""Advice is cheaper than votes.""
 ca_centralist_events.19.a:0 "Create the Council."
 ca_centralist_events.19.b:0 "We need no advisers."
 ca_centralist_events.20.t:0 "Continuity?"
 ca_centralist_events.20.d:0 "The term of the government is coming to an end, but its supporters say that the Republic cannot afford a change of leadership now."
 ca_centralist_events.20.f:0 ""Why change what works?""
 ca_centralist_events.20.a:0 "Extend the mandate."
 ca_centralist_events.20.b:0 "Respect the term."

 # Modificadores (F11)
 ca_fed_pact_liberal:0 "Federal Pact: the Liberals"
 ca_fed_pact_liberal_desc:0 "The liberal intelligentsia is the pillar of the Federal Pact."
 ca_fed_pact_states:0 "Federal Pact: the States"
 ca_fed_pact_states_desc:0 "The landowners of the States have been reassured by the federal government."
 ca_fed_pact_army:0 "Federal Pact: the Army"
 ca_fed_pact_army_desc:0 "The federal army is the guarantor of the Union."
 ca_fed_constitutional_reform:0 "Constitutional Reform"
 ca_fed_constitutional_reform_desc:0 "The Constitution of 1824 has been reformed to give the States more autonomy."
 ca_fed_realism:0 "Federal Realism"
 ca_fed_realism_desc:0 "The government accepts what it cannot change."
 ca_fed_general_command:0 "Supreme Command"
 ca_fed_general_command_desc:0 "This general holds the supreme command of the army of the Union."
 ca_fed_war_effort:0 "War Effort of the Union"
 ca_fed_war_effort_desc:0 "The whole Republic is mobilized for war."
 ca_fed_republic_restored:0 "The Republic Restored"
 ca_fed_republic_restored_desc:0 "The Republic has survived its darkest years."
 ca_fed_national_pride:0 "Land Not for Sale"
 ca_fed_national_pride_desc:0 "The Republic has refused to sell its land to foreigners."
 ca_fed_austerity:0 "Federal Austerity"
 ca_fed_austerity_desc:0 "The salaries of the federal officials have been cut."
 ca_fed_rule_by_decree:0 "Rule by Decree"
 ca_fed_rule_by_decree_desc:0 "The government governs by decree while Congress cannot meet."
 ca_fed_civic_militia:0 "Civic Militia"
 ca_fed_civic_militia_desc:0 "Artisans and small farmers are armed to defend the Republic."
 ca_fed_clean_election:0 "A Clean Election"
 ca_fed_clean_election_desc:0 "The result of the election has been accepted by all."
 ca_cen_pillar_army:0 "Pillar of the Republic: the Army"
 ca_cen_pillar_army_desc:0 "The army is the pillar of the unitary Republic."
 ca_cen_pillar_church:0 "Pillar of the Republic: the Church"
 ca_cen_pillar_church_desc:0 "The Church blesses the unitary Republic."
 ca_cen_pillar_landowners:0 "Pillar of the Republic: the Landowners"
 ca_cen_pillar_landowners_desc:0 "The landowners keep the provinces in order."
 ca_cen_rule_by_decree:0 "Government by Decree"
 ca_cen_rule_by_decree_desc:0 "Without a Congress, the Republic is governed by decree."
 ca_cen_council_of_state:0 "Council of State"
 ca_cen_council_of_state_desc:0 "A Council of State of notables advises the government."
 ca_cen_supreme_director:0 "Supreme Director"
 ca_cen_supreme_director_desc:0 "The head of state rules as Supreme Director, without limits."
 ca_enact_teachers_arrive:0 "Teachers in the Villages"
 ca_enact_teachers_arrive_desc:0 "The teachers of the new secular schools are welcomed in the villages."
 ca_enact_slow_support:0 "Lukewarm Support"
 ca_enact_slow_support_desc:0 "The reform advances, but without enthusiasm."
 ca_enact_firm_reform:0 "Firm Reform"
 ca_enact_firm_reform_desc:0 "The government will not yield an inch."
 ca_enact_compromise:0 "A Compromise"
 ca_enact_compromise_desc:0 "The reform has been softened to win support."
 ca_enact_civil_registry:0 "The Civil Registry"
 ca_enact_civil_registry_desc:0 "The State now records births, marriages and deaths."
 ca_enact_open_councils:0 "Open Town Councils"
 ca_enact_open_councils_desc:0 "The citizens gather in open councils to support the reform."
 ca_enact_intendants_sworn:0 "The Intendants Sworn"
 ca_enact_intendants_sworn_desc:0 "The federal intendants carry the law to the provinces."
 ca_enact_career_officers:0 "Career Officers"
 ca_enact_career_officers_desc:0 "The officers of the academy support a single army."
 ca_enact_concordat_talks:0 "Talks with Rome"
 ca_enact_concordat_talks_desc:0 "Rome supports the government in exchange for privileges."
