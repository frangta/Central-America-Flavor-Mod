l_english:
 # CAFM P11: eventos de movimientos, agitadores, revolucion, golpes y bastiones; modificadores nuevos.

 age_of_federal_stronghold:0 "Federal Heartland"
 age_of_federal_stronghold_desc:0 "This province is the heart of federalism: its town councils, schools and militia answer to the Union."
 age_of_unitary_stronghold:0 "Conservative Fortress"
 age_of_unitary_stronghold_desc:0 "The clergy, the landowners and the garrison rule this province as a single conservative block."
 age_of_reactionary_stronghold:0 "Servile Parishes"
 age_of_reactionary_stronghold_desc:0 "The reactionaries control every parish and brotherhood of this province."
 fading_liberal_stronghold:0 "Fading Liberal City"
 fading_liberal_stronghold_desc:0 "The liberal clubs and lodges of this province are losing their members."
 ca_sh_federal_country:0 "Federalist Bastions"
 ca_sh_federal_country_desc:0 "Some of our provinces are bastions of federalism, and their deputies strengthen the liberal intelligentsia."
 ca_sh_unitary_country:0 "Unitarian Bastions"
 ca_sh_unitary_country_desc:0 "Some of our provinces are conservative bastions that obey the capital without question."
 ca_sh_waning_country:0 "Crumbling Bastions"
 ca_sh_waning_country_desc:0 "Old political bastions are falling apart, and with them the authority of the government."
 ca_sh_liberal_country:0 "Liberal Cities"
 ca_sh_liberal_country_desc:0 "Our liberal cities supply the Intelligentsia with members and money."
 ca_sh_reactionary_country:0 "Servile Strongholds"
 ca_sh_reactionary_country_desc:0 "The reactionary provinces give the Petite Bourgeoisie a voice in the capital."
 ca_sh_conservative_country:0 "Landowners' Provinces"
 ca_sh_conservative_country_desc:0 "The great families rule whole provinces, and the Landowners are stronger for it."
 ca_p11_ig_emboldened:0 "Emboldened"
 ca_p11_ig_emboldened_desc:0 "Recent events have given this group confidence and new followers."
 ca_p11_ig_humiliated:0 "Humiliated"
 ca_p11_ig_humiliated_desc:0 "This group has been publicly humiliated by the government."
 ca_p11_ig_purged:0 "Purged"
 ca_p11_ig_purged_desc:0 "The leaders of this group have been arrested, exiled or shot."
 ca_p11_ig_coopted:0 "Co-opted"
 ca_p11_ig_coopted_desc:0 "The government has won over the leaders of this group with posts and favours."
 ca_p11_civil_peace:0 "Civil Concord"
 ca_p11_civil_peace_desc:0 "After the last upheaval, the factions have agreed to a fragile peace."
 ca_p11_martial_law:0 "Martial Law"
 ca_p11_martial_law_desc:0 "The army rules the streets. Order is kept, but the government pays for it in authority."
 ca_p11_coup_regime:0 "Regime of the Coup"
 ca_p11_coup_regime_desc:0 "A government born of a coup rules with a firm hand, but its legitimacy is doubtful."
 ca_p11_plot_paranoia:0 "Hunting Conspirators"
 ca_p11_plot_paranoia_desc:0 "The police see conspirators everywhere, and the arrests make new enemies."
 ca_p11_army_split:0 "Divided Army"
 ca_p11_army_split_desc:0 "Part of the army has gone over to the rebels, and no one trusts the rest."
 ca_p11_lost_revenue:0 "Lost Customs Revenue"
 ca_p11_lost_revenue_desc:0 "The customs houses have been sacked or abandoned."
 ca_p11_foreign_mediation:0 "Foreign Mediation"
 ca_p11_foreign_mediation_desc:0 "A foreign consul mediated our internal quarrels, and the whole isthmus knows it."
 ca_p11_state_barricades:0 "Barricades"
 ca_p11_state_barricades_desc:0 "The streets of this province are blocked by barricades."

 ca_movement_events.1.t:0 "The Patriotic Society"
 ca_movement_events.1.d:0 "Lawyers, printers and young officers have founded a \"Patriotic Society\" in the capital. Every Thursday they read the Constitution of 1824 aloud and toast to the Federation. Their next meeting promises to fill the cloisters of the old convent."
 ca_movement_events.1.f:0 "\"The Union is not a treaty between governments, but a pact between free citizens.\""
 ca_movement_events.1.a:0 "Let them meet in peace."
 ca_movement_events.1.b:0 "Close the society and fine its founders."
 ca_movement_events.1.c:0 "Invite its leaders to the ministries."
 ca_movement_events.2.t:0 "The Federal Pamphlet"
 ca_movement_events.2.d:0 "A pamphlet titled \"To the Peoples of Central America\" circulates from hand to hand. It accuses the provincial notables of selling out the common homeland and calls on the states to obey the Federal Congress."
 ca_movement_events.2.f:0 "\"Divided, we are five little republics at the mercy of any consul with a gunboat.\""
 ca_movement_events.2.a:0 "Free speech is the soul of the Republic."
 ca_movement_events.2.b:0 "Seize the presses."
 ca_movement_events.2.c:0 "Answer with a pamphlet of our own."
 ca_movement_events.3.t:0 "An Open Town Council"
 ca_movement_events.3.d:0 "The neighbours of a town have called an open town council, a cabildo abierto, and voted a declaration of loyalty to the Federation. They ask the government to send it to the Federal Congress."
 ca_movement_events.3.f:0 "\"The cabildo is older than the Republic, and it still speaks for the people.\""
 ca_movement_events.3.a:0 "Forward the declaration to the Congress."
 ca_movement_events.3.b:0 "Town councils do not make policy."
 ca_movement_events.4.t:0 "Petition of the States"
 ca_movement_events.4.d:0 "Deputies from the provinces deliver a petition with thousands of signatures: a Senate of the States, a federal army paid by all, and a common customs house. The federalists call it the minimum for the Union to survive."
 ca_movement_events.4.f:0 "\"Every state must give something, or every state will lose everything.\""
 ca_movement_events.4.a:0 "Receive the petition with honours."
 ca_movement_events.4.b:0 "Shelve it."
 ca_movement_events.4.c:0 "Promise reform, deliver nothing."
 ca_movement_events.5.t:0 "A Federal Rally"
 ca_movement_events.5.d:0 "A crowd fills the main square under the blue and white flag of the Federation. Speakers recall Morazan's victories and demand that the government stand firm against the separatists."
 ca_movement_events.5.f:0 "\"Long live the Federation! Death to the serviles!\""
 ca_movement_events.5.a:0 "Let the rally proceed."
 ca_movement_events.5.b:0 "Disperse the crowd."
 ca_movement_events.5.c:0 "Speak to the crowd yourself."
 ca_movement_events.6.t:0 "The Procession of the Brotherhoods"
 ca_movement_events.6.d:0 "The religious brotherhoods, the cofradias, have turned the feast of their patron saint into a procession against the \"impious laws\". Behind the image of the saint march hacendados, friars and hundreds of peasants."
 ca_movement_events.6.f:0 "\"Long live religion, and death to the foreigners!\""
 ca_movement_events.6.a:0 "Let the faithful worship as they please."
 ca_movement_events.6.b:0 "Arrest the friars who stirred it up."
 ca_movement_events.7.t:0 "The Sermon Against the Fiebres"
 ca_movement_events.7.d:0 "From the pulpit of the cathedral, a canon thunders against the liberal \"fiebres\": their civil marriage, their trial by jury and their schools without catechism. Order, he says, can only come from one strong government."
 ca_movement_events.7.f:0 "\"Where there is no authority, there is no faith; and where there is no faith, there is no peace.\""
 ca_movement_events.7.a:0 "The Church has the right to speak."
 ca_movement_events.7.b:0 "Exile the canon."
 ca_movement_events.8.t:0 "The Notables Ask for Order"
 ca_movement_events.8.d:0 "The richest families sign a letter to the government: the federal experiment has brought only debts, revolts and cholera. They ask for one government, one army and one treasury, under a firm hand."
 ca_movement_events.8.f:0 "\"We were richer and safer under the Captaincy General.\""
 ca_movement_events.8.a:0 "Their concerns are fair."
 ca_movement_events.8.b:0 "The Republic will not go backwards."
 ca_movement_events.9.t:0 "The Hacendados' Militia"
 ca_movement_events.9.d:0 "In the countryside, the landowners are arming their peons \"to defend property and religion\". The new militia answers to the parish priest and the patron, not to the government."
 ca_movement_events.9.f:0 "\"Our men know how to use a machete better than any federal recruit.\""
 ca_movement_events.9.a:0 "Tolerate it; the roads are safer."
 ca_movement_events.9.b:0 "Disarm the militia."
 ca_movement_events.9.c:0 "Absorb it into the regular army."
 ca_movement_events.10.t:0 "The Servile Newspaper"
 ca_movement_events.10.d:0 "A new newspaper, financed by the conservative families, mocks the federal deputies every week and prints the sermons of the clergy. Its caricatures are the talk of every cafe."
 ca_movement_events.10.f:0 "\"The Federation is a costume too large for five small states.\""
 ca_movement_events.10.a:0 "Let it print."
 ca_movement_events.10.b:0 "Close it under the press law."
 ca_agitator_events.1.t:0 "A Young Lawyer Speaks"
 ca_agitator_events.1.d:0 "A young lawyer, educated in the halls of the university, has won fame defending federalist printers in court. Now he speaks in the squares, and the students follow him."
 ca_agitator_events.1.f:0 "\"The law is the only sovereign a free man should obey.\""
 ca_agitator_events.1.a:0 "Let the voice be heard."
 ca_agitator_events.1.b:0 "Have the police keep an eye on him."
 ca_agitator_events.2.t:0 "The Liberal Printer"
 ca_agitator_events.2.d:0 "A printer from the artisans' quarter publishes cheap broadsheets in favour of the Federation. Shopkeepers and craftsmen read them aloud in the taverns."
 ca_agitator_events.2.f:0 "\"Ink is cheaper than powder, and travels farther.\""
 ca_agitator_events.2.a:0 "Let the voice be heard."
 ca_agitator_events.2.b:0 "Have the police keep an eye on him."
 ca_agitator_events.3.t:0 "A Morazanist Veteran"
 ca_agitator_events.3.d:0 "A veteran of the campaigns of 1829, who marched with Morazan into Guatemala City, has returned to politics. The old soldiers trust him; the notables fear him."
 ca_agitator_events.3.f:0 "\"I did not bleed at San Antonio to see the Union sold by the parish.\""
 ca_agitator_events.3.a:0 "Let the voice be heard."
 ca_agitator_events.3.b:0 "Have the police keep an eye on him."
 ca_agitator_events.4.t:0 "The Exile Returns"
 ca_agitator_events.4.d:0 "A federalist exiled after the last upheaval has returned from Panama with letters from friends all over the isthmus. He wants to reorganise the party."
 ca_agitator_events.4.f:0 "\"The Union lives as long as one of us still remembers it.\""
 ca_agitator_events.4.a:0 "Let the voice be heard."
 ca_agitator_events.4.b:0 "Have the police keep an eye on him."
 ca_agitator_events.5.t:0 "The Canon of the Cathedral"
 ca_agitator_events.5.d:0 "A canon of the cathedral, famous for his sermons, has become the voice of those who want a single, Catholic and orderly government."
 ca_agitator_events.5.f:0 "\"Liberty without faith is only license.\""
 ca_agitator_events.5.a:0 "Let the voice be heard."
 ca_agitator_events.5.b:0 "Have the police keep an eye on him."
 ca_agitator_events.6.t:0 "The Hacendado of the East"
 ca_agitator_events.6.d:0 "A wealthy hacendado from the eastern valleys has organised the landowners of his district. He promises order on the roads and an end to the \"experiments\" of the capital."
 ca_agitator_events.6.f:0 "\"A country is governed like an hacienda: with one patron.\""
 ca_agitator_events.6.a:0 "Let the voice be heard."
 ca_agitator_events.6.b:0 "Have the police keep an eye on him."
 ca_agitator_events.7.t:0 "A Colonel of the Garrison"
 ca_agitator_events.7.d:0 "A colonel of the garrison complains openly that the army is unpaid and humiliated by the federal deputies. The officers listen to him more than to their generals."
 ca_agitator_events.7.f:0 "\"Give us one government, and we will give you peace.\""
 ca_agitator_events.7.a:0 "Let the voice be heard."
 ca_agitator_events.7.b:0 "Have the police keep an eye on him."
 ca_agitator_events.8.t:0 "The Orator of the Brotherhoods"
 ca_agitator_events.8.d:0 "A layman of the religious brotherhoods preaches in the villages against the liberal laws. The peasants call him \"the holy man\", and the priests protect him."
 ca_agitator_events.8.f:0 "\"They took the tithe; next they will take the saints.\""
 ca_agitator_events.8.a:0 "Let the voice be heard."
 ca_agitator_events.8.b:0 "Have the police keep an eye on him."
 ca_revolution_events.1.t:0 "Barricades in the Square"
 ca_revolution_events.1.d:0 "Federalist students and artisans have raised barricades in the main square of [SCOPE.sState('ca_p11_state').GetName]. Church bells ring the alarm all night."
 ca_revolution_events.1.f:0 "\"Behind every barricade stands a citizen who has read the Constitution.\""
 ca_revolution_events.1.a:0 "Storm the barricades."
 ca_revolution_events.1.b:0 "Surround them and wait."
 ca_revolution_events.2.t:0 "The Cabildo Proclaims the Federation"
 ca_revolution_events.2.d:0 "The town council of a rebel town has proclaimed itself a \"free municipality of the Federation\" and called on the others to follow."
 ca_revolution_events.2.f:0 "\"Where the government abandons the Union, the people will keep it.\""
 ca_revolution_events.2.a:0 "Dissolve the cabildo by force."
 ca_revolution_events.2.b:0 "Negotiate with the municipal leaders."
 ca_revolution_events.3.t:0 "The Students Take Up Arms"
 ca_revolution_events.3.d:0 "The university has emptied: its students have joined the federal columns, and the printers have turned their presses into a war office."
 ca_revolution_events.3.f:0 "\"Today the classroom, tomorrow the barricade.\""
 ca_revolution_events.3.a:0 "Close the university."
 ca_revolution_events.3.b:0 "Offer an amnesty to the students."
 ca_revolution_events.4.t:0 "The Civic Militia Changes Sides"
 ca_revolution_events.4.d:0 "A battalion of the civic militia, recruited among shopkeepers and artisans, has gone over to the federalists with its arms and its drums."
 ca_revolution_events.4.f:0 "\"We swore loyalty to the Republic, not to its jailers.\""
 ca_revolution_events.4.a:0 "Decimate the remaining battalions."
 ca_revolution_events.4.b:0 "Double the pay of the loyal troops."
 ca_revolution_events.4.c:0 "There is nothing we can do."
 ca_revolution_events.5.t:0 "The Morazanist Exiles Return"
 ca_revolution_events.5.d:0 "Federalist exiles have landed on the coast with weapons bought abroad. They bring officers who fought with Morazan."
 ca_revolution_events.5.f:0 "\"The General is coming back.\""
 ca_revolution_events.5.a:0 "Hunt them down on the beaches."
 ca_revolution_events.5.b:0 "Let them come; they will divide the rebels."
 ca_revolution_events.5.c:0 "Bribe their officers."
 ca_revolution_events.6.t:0 "The Priest Preaches Holy War"
 ca_revolution_events.6.d:0 "In the parishes of [SCOPE.sState('ca_p11_state').GetName], the priests preach that fighting the government is a duty of faith. Peasants come to the rebel camps with rosaries and machetes."
 ca_revolution_events.6.f:0 "\"Long live religion!\""
 ca_revolution_events.6.a:0 "Arrest the priests."
 ca_revolution_events.6.b:0 "Ask the bishop to call for peace."
 ca_revolution_events.7.t:0 "The Mountain Rises"
 ca_revolution_events.7.d:0 "The mountain villages have risen: guerrillas of peasants, led by a cattle drover who cannot read, ambush the government columns in the ravines."
 ca_revolution_events.7.f:0 "\"The mountain does not surrender. It only waits.\""
 ca_revolution_events.7.a:0 "Burn the rebel villages."
 ca_revolution_events.7.b:0 "Offer land and pardon to the peasants."
 ca_revolution_events.8.t:0 "The Hacendados Arm Their Peons"
 ca_revolution_events.8.d:0 "The great landowners have opened their arsenals and armed their peons. Entire haciendas have become rebel fortresses."
 ca_revolution_events.8.f:0 "\"Each hacienda is a fortress, and each patron a general.\""
 ca_revolution_events.8.a:0 "Confiscate the rebel haciendas."
 ca_revolution_events.8.b:0 "Promise to respect their property."
 ca_revolution_events.9.t:0 "The Garrison Pronounces"
 ca_revolution_events.9.d:0 "The garrison of a provincial capital has issued a pronunciamiento in favour of the rebels. Its colonel asks for \"one government, one army and one treasury\"."
 ca_revolution_events.9.f:0 "\"The army does not deliberate... until it does.\""
 ca_revolution_events.9.a:0 "March on the garrison."
 ca_revolution_events.9.b:0 "Promote the colonel to general."
 ca_revolution_events.10.t:0 "The Customs House Is Sacked"
 ca_revolution_events.10.d:0 "Rebel bands have sacked the customs house of a port. The revenue of the whole quarter is lost, and the merchants demand protection."
 ca_revolution_events.10.f:0 "\"Without customs, there is no State; without State, there are only bands.\""
 ca_revolution_events.10.a:0 "Send troops to the ports."
 ca_revolution_events.10.b:0 "Leave the ports to the merchants."
 ca_revolution_events.11.t:0 "The Consul Offers Mediation"
 ca_revolution_events.11.d:0 "A foreign consul offers to mediate between the government and the rebels. He asks, in exchange, for guarantees for his merchants."
 ca_revolution_events.11.f:0 "\"Her Majesty's Government desires only peace... and the payment of what is owed.\""
 ca_revolution_events.11.a:0 "Accept the mediation."
 ca_revolution_events.11.b:0 "We need no foreign guardians."
 ca_revolution_events.12.t:0 "Amnesty or the Firing Squad"
 ca_revolution_events.12.d:0 "Hundreds of rebel prisoners fill the jails. The ministers are divided: some ask for a general amnesty, others for exemplary punishment."
 ca_revolution_events.12.f:0 "\"Mercy wins more provinces than the gallows.\""
 ca_revolution_events.12.a:0 "Proclaim a general amnesty."
 ca_revolution_events.12.b:0 "Shoot the leaders."
 ca_coup_events.1.t:0 "Conspiracy in the Barracks"
 ca_coup_events.1.d:0 "Officers and conservative notables meet at night in a hacienda outside the capital. They speak of \"saving the country from the anarchy of the fiebres\" with a single strong government."
 ca_coup_events.1.f:0 "\"Order first; the Constitution can wait.\""
 ca_coup_events.1.a:0 "We know nothing of this."
 ca_coup_events.1.b:0 "Double the guard at the palace."
 ca_coup_events.2.t:0 "The Liberal Lodge Conspires"
 ca_coup_events.2.d:0 "In a masonic lodge of the capital, liberal officers and lawyers plan to overthrow the government and \"restore the Federation and the Constitution\"."
 ca_coup_events.2.f:0 "\"Tyrants fall when the brothers keep their word.\""
 ca_coup_events.2.a:0 "We know nothing of this."
 ca_coup_events.2.b:0 "Have the lodge watched."
 ca_coup_events.3.t:0 "The Conspiracy Is Discovered"
 ca_coup_events.3.d:0 "A servant has denounced the conspirators. The police have the names of several officers and a list of weapons hidden in a convent."
 ca_coup_events.3.f:0 "\"Every conspiracy has one traitor too many.\""
 ca_coup_events.3.a:0 "Arrest them all."
 ca_coup_events.3.b:0 "Arrest only the minor figures."
 ca_coup_events.4.t:0 "The General Hesitates"
 ca_coup_events.4.d:0 "The commander of the capital's garrison has been approached by the conspirators. He has not said yes, and he has not said no."
 ca_coup_events.4.f:0 "\"A general who waits is a general who chooses the winner.\""
 ca_coup_events.4.a:0 "Buy his loyalty."
 ca_coup_events.4.b:0 "Replace him with a loyal officer."
 ca_coup_events.4.c:0 "Trust his word."
 ca_coup_events.5.t:0 "Money from Abroad"
 ca_coup_events.5.d:0 "Gold from exiles and foreign merchants is reaching the conspirators. They are buying rifles and paying soldiers in advance."
 ca_coup_events.5.f:0 "\"A revolution is made with ideas, but paid with pesos.\""
 ca_coup_events.5.a:0 "Close the ports to suspicious ships."
 ca_coup_events.5.b:0 "We cannot stop the flow of money."
 ca_coup_events.6.t:0 "The Barracks Divided"
 ca_coup_events.6.d:0 "In the barracks, sergeants argue with officers. Some companies would follow the conspirators; others swear to defend the government."
 ca_coup_events.6.f:0 "\"The army is the State in uniform; when it splits, so does the State.\""
 ca_coup_events.6.a:0 "Pay the soldiers their arrears."
 ca_coup_events.6.b:0 "Transfer suspect companies to the frontier."
 ca_coup_events.7.t:0 "The Pulpit and the Press"
 ca_coup_events.7.d:0 "The conspirators look for allies outside the barracks: the clergy, the newspapers and the guilds. Whoever wins public opinion will win the streets."
 ca_coup_events.7.f:0 "\"A coup that the people do not accept is only a mutiny.\""
 ca_coup_events.7.a:0 "Win them over first."
 ca_coup_events.7.b:0 "Censor them all."
 ca_coup_events.8.t:0 "The Night of the Coup"
 ca_coup_events.8.d:0 "At dawn, the conspirators took the palace, the arsenal and the bell towers. The ministers are under arrest, and a new government addresses the people from the balcony."
 ca_coup_events.8.f:0 "\"Citizens: the Nation has been saved from itself.\""
 ca_coup_events.8.a:0 "The new order is proclaimed."
 ca_coup_events.9.t:0 "The Plot Is Crushed"
 ca_coup_events.9.d:0 "The conspiracy has collapsed. Its leaders have fled across the border or wait for trial in the fortress."
 ca_coup_events.9.f:0 "\"Treason never prospers... this time.\""
 ca_coup_events.9.a:0 "Exile the ringleaders."
 ca_coup_events.9.b:0 "Pardon them, in the name of concord."
 ca_coup_events.10.t:0 "After the Coup"
 ca_coup_events.10.d:0 "Weeks after the coup, the country takes stock. The defeated faction hides, the winners divide the ministries, and the provinces wait to see whom to obey."
 ca_coup_events.10.f:0 "\"Every coup promises to be the last.\""
 ca_coup_events.10.a:0 "Reconcile the factions."
 ca_coup_events.10.b:0 "Purge the defeated."
 ca_stronghold_events.1.t:0 "A Federalist Stronghold Emerges"
 ca_stronghold_events.1.d:0 "The federalist clubs of [SCOPE.sState('ca_p11_state').GetName] have won the town councils and the militia. The province is becoming a bastion of the Union."
 ca_stronghold_events.1.f:0 "\"Here the Constitution of 1824 is still law.\""
 ca_stronghold_events.1.a:0 "Encourage it."
 ca_stronghold_events.1.b:0 "Keep the province under watch."
 ca_stronghold_events.2.t:0 "A Unitarian Stronghold Emerges"
 ca_stronghold_events.2.d:0 "In [SCOPE.sState('ca_p11_state').GetName], the priests, the hacendados and the garrison speak with one voice: one government, one army, one faith. A conservative bastion is taking shape."
 ca_stronghold_events.2.f:0 "\"Here the patron and the priest rule, and the people obey.\""
 ca_stronghold_events.2.a:0 "Let the notables organise."
 ca_stronghold_events.2.b:0 "Send a liberal governor."
 ca_stronghold_events.3.t:0 "The Federalist Bastion Consolidates"
 ca_stronghold_events.3.d:0 "Years of patient work have paid off: in [SCOPE.sState('ca_p11_state').GetName] every town council, every school and every militia company answers to the federalists."
 ca_stronghold_events.3.f:0 "\"A bastion is not built in a day, but it can stand for a generation.\""
 ca_stronghold_events.3.a:0 "Recognise the bastion."
 ca_stronghold_events.3.b:0 "Limit its power."
 ca_stronghold_events.4.t:0 "The Unitarian Bastion Consolidates"
 ca_stronghold_events.4.d:0 "The conservative families now control the town councils, the parishes and the garrison of [SCOPE.sState('ca_p11_state').GetName]. Nothing happens there without their blessing."
 ca_stronghold_events.4.f:0 "\"Order has returned to the province.\""
 ca_stronghold_events.4.a:0 "Recognise the bastion."
 ca_stronghold_events.4.b:0 "Limit its power."
 ca_stronghold_events.5.t:0 "The Federal Heartland"
 ca_stronghold_events.5.d:0 "[SCOPE.sState('ca_p11_state').GetName] has become the heart of federalism. Its deputies lead the Congress, its printers supply the whole isthmus and its militia is the best armed in the country."
 ca_stronghold_events.5.f:0 "\"As long as this province stands, the Union lives.\""
 ca_stronghold_events.5.a:0 "Glory to the Federation!"
 ca_stronghold_events.5.b:0 "One bastion is enough."
 ca_stronghold_events.6.t:0 "The Conservative Fortress"
 ca_stronghold_events.6.d:0 "[SCOPE.sState('ca_p11_state').GetName] has become the fortress of the unitarians. The clergy, the landowners and the army form a single block that no liberal government can break."
 ca_stronghold_events.6.f:0 "\"Here the Republic kneels before the altar and the sword.\""
 ca_stronghold_events.6.a:0 "Let the fortress rise."
 ca_stronghold_events.6.b:0 "One bastion is enough."
 ca_stronghold_events.7.t:0 "The Federal Clubs Ask for Funds"
 ca_stronghold_events.7.d:0 "The federalist clubs of [SCOPE.sState('ca_p11_state').GetName] ask the government for money to pay teachers, printers and militiamen. Without it, they warn, the bastion will crumble."
 ca_stronghold_events.7.f:0 "\"Patriotism does not feed a family.\""
 ca_stronghold_events.7.a:0 "Pay them."
 ca_stronghold_events.7.b:0 "The Treasury is empty."
 ca_stronghold_events.8.t:0 "The Notables Ask for Privileges"
 ca_stronghold_events.8.d:0 "The notables of [SCOPE.sState('ca_p11_state').GetName] ask for the tithe to be collected by the State and for their militia to be paid by the Treasury. In exchange, they promise loyalty and order."
 ca_stronghold_events.8.f:0 "\"Loyalty has a price, and it is paid every year.\""
 ca_stronghold_events.8.a:0 "Grant the privileges."
 ca_stronghold_events.8.b:0 "The State owes them nothing."
 ca_stronghold_events.9.t:0 "The Federalist Bastion Weakens"
 ca_stronghold_events.9.d:0 "The federalist clubs of [SCOPE.sState('ca_p11_state').GetName] are empty. Their leaders have gone into exile or changed sides, and the town councils elect conservatives again."
 ca_stronghold_events.9.f:0 "\"The flag still flies, but no one salutes it.\""
 ca_stronghold_events.9.a:0 "Let it fade."
 ca_stronghold_events.9.b:0 "Spend to keep it alive."
 ca_stronghold_events.10.t:0 "The Unitarian Bastion Weakens"
 ca_stronghold_events.10.d:0 "In [SCOPE.sState('ca_p11_state').GetName], the conservative block has broken: the young hacendados trade with liberal merchants and the parish priests quarrel with the bishop."
 ca_stronghold_events.10.f:0 "\"Even fortresses crack when their stones disagree.\""
 ca_stronghold_events.10.a:0 "Let it fade."
 ca_stronghold_events.10.b:0 "Spend to keep it alive."
 ca_stronghold_events.11.t:0 "The Federalists Return"
 ca_stronghold_events.11.d:0 "After years of silence, the federalist clubs of [SCOPE.sState('ca_p11_state').GetName] have reopened. Old veterans and young students meet again under the blue and white flag."
 ca_stronghold_events.11.f:0 "\"The Union sleeps; it does not die.\""
 ca_stronghold_events.11.a:0 "Welcome them back."
 ca_stronghold_events.11.b:0 "Keep them out of the town councils."
 ca_stronghold_events.12.t:0 "The Conservatives Regroup"
 ca_stronghold_events.12.d:0 "In [SCOPE.sState('ca_p11_state').GetName], the notables and the clergy have made peace among themselves. The conservative block is rebuilding."
 ca_stronghold_events.12.f:0 "\"Order always returns.\""
 ca_stronghold_events.12.a:0 "Let them regroup."
 ca_stronghold_events.12.b:0 "Keep them out of the town councils."
 ca_stronghold_events.13.t:0 "The Liberal City"
 ca_stronghold_events.13.d:0 "The merchants, lawyers and teachers of [SCOPE.sState('ca_p11_state').GetName] have turned the city into a liberal stronghold: schools, newspapers and a lodge in every street."
 ca_stronghold_events.13.f:0 "\"Here we read Rousseau, not the catechism.\""
 ca_stronghold_events.13.a:0 "Support the liberals."
 ca_stronghold_events.13.b:0 "Ignore them."
 ca_stronghold_events.14.t:0 "The Servile Parish"
 ca_stronghold_events.14.d:0 "In [SCOPE.sState('ca_p11_state').GetName], the reactionaries have won the parishes and the brotherhoods. Every Sunday, the sermon is a political speech."
 ca_stronghold_events.14.f:0 "\"God, King and order: the King can wait.\""
 ca_stronghold_events.14.a:0 "Respect the parishes."
 ca_stronghold_events.14.b:0 "Rein in the clergy."
 ca_stronghold_events.15.t:0 "The Landowners' Province"
 ca_stronghold_events.15.d:0 "The great families of [SCOPE.sState('ca_p11_state').GetName] own the land, the mills and the votes. The province has become a conservative stronghold."
 ca_stronghold_events.15.f:0 "\"Here the hacienda is the State.\""
 ca_stronghold_events.15.a:0 "The landowners keep the peace."
 ca_stronghold_events.15.b:0 "Break up their power."
 ca_stronghold_events.16.t:0 "The Separatist Province"
 ca_stronghold_events.16.d:0 "[SCOPE.sState('ca_p11_state').GetName] no longer recognises the authority of the capital. Its notables collect their own taxes and speak of a \"sovereign State\"."
 ca_stronghold_events.16.f:0 "\"We owe the capital nothing but our patience, and it is running out.\""
 ca_stronghold_events.16.a:0 "Suppress the separatists."
 ca_stronghold_events.16.b:0 "Grant them autonomy."
