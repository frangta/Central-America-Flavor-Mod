 ca_frca_unitary_republic:0 "The Unitary Republic"
 ca_frca_unitary_republic_desc:0 "The states have become departments of a single republic ruled from Guatemala."
 ca_ig_struggle_negotiation:0 "Negotiating with the Factions"
 ca_ig_struggle_negotiation_desc:0 "The government has had to bargain with both sides of a divided interest group."
 cafm_ig_struggle.1.t:0 "A Divided Group"
 cafm_ig_struggle.1.d_federal:0 "The Federalists are gaining ground among [SCOPE.sInterestGroup('ca_struggle_ig').GetName]. Their meetings are full, and many old members now speak of the Republic of Morazán as the only way to hold the isthmus together."
 cafm_ig_struggle.1.d_centralist:0 "The Centralists are gaining ground among [SCOPE.sInterestGroup('ca_struggle_ig').GetName]. Many members now say that only a strong government in Guatemala can bring order to the Union."
 cafm_ig_struggle.1.d_separatist:0 "The Separatists are gaining ground among [SCOPE.sInterestGroup('ca_struggle_ig').GetName]. More and more members say that each state should govern itself and leave the Union behind."
 cafm_ig_struggle.1.f:0 "\"A house divided against itself cannot stand.\" Every faction in the Union is now fighting for the same people."
 cafm_ig_struggle.1.a:0 "Let them choose the new path"
 cafm_ig_struggle.1.a_tt:0 "The struggle bar rises by #b 20#! next month."
 cafm_ig_struggle.1.b:0 "The group must stay as it is"
 cafm_ig_struggle.1.b_tt:0 "The struggle bar falls by #b 20#! next month, and the group is unhappy."
 cafm_ig_struggle.1.c:0 "We will negotiate with both sides"
 cafm_ig_struggle.2.t:0 "The Group Changes Sides"
 cafm_ig_struggle.2.d_federal:0 "After months of debate, [SCOPE.sInterestGroup('ca_struggle_ig').GetName] now stand with the #b Federalists#!."
 cafm_ig_struggle.2.d_centralist:0 "After months of debate, [SCOPE.sInterestGroup('ca_struggle_ig').GetName] now stand with the #b Centralists#!."
 cafm_ig_struggle.2.d_separatist:0 "After months of debate, [SCOPE.sInterestGroup('ca_struggle_ig').GetName] now stand with the #b Separatists#!."
 cafm_ig_struggle.2.f:0 "Old loyalties do not last long in times of crisis."
 cafm_ig_struggle.2.a:0 "So be it"
 cafm_ig_struggle.2.a_tt:0 "The group has changed its ideology."
 cafm_ig_struggle.3.t:0 "The Group Holds Firm"
 cafm_ig_struggle.3.d_federal:0 "The rival faction has failed. [SCOPE.sInterestGroup('ca_struggle_ig').GetName] remain loyal to the #b Federalists#!."
 cafm_ig_struggle.3.d_centralist:0 "The rival faction has failed. [SCOPE.sInterestGroup('ca_struggle_ig').GetName] remain loyal to the #b Centralists#!."
 cafm_ig_struggle.3.d_separatist:0 "The rival faction has failed. [SCOPE.sInterestGroup('ca_struggle_ig').GetName] remain loyal to the #b Separatists#!."
 cafm_ig_struggle.3.f:0 "The defeated faction leaves weaker than it came."
 cafm_ig_struggle.3.a:0 "Order has been restored"
 cafm_ig_struggle.3.a_tt:0 "The rival faction loses #b 5#! power for one year."
 cafm_ig_struggle.4.t:0 "A New Ally"
 cafm_ig_struggle.4.d_federal:0 "The Federalists are now so strong that [SCOPE.sInterestGroup('ca_struggle_ig').GetName] have joined them."
 cafm_ig_struggle.4.d_centralist:0 "The Centralists are now so strong that [SCOPE.sInterestGroup('ca_struggle_ig').GetName] have joined them."
 cafm_ig_struggle.4.d_separatist:0 "The Separatists are now so strong that [SCOPE.sInterestGroup('ca_struggle_ig').GetName] have joined them."
 cafm_ig_struggle.4.f:0 "Everyone wants to be on the winning side."
 cafm_ig_struggle.4.a:0 "Understood"
 cafm_ig_struggle.4.a_tt:0 "The group has gained a new ideology."
 cafm_ig_struggle.5.t:0 "A Lost Cause"
 cafm_ig_struggle.5.d_federal:0 "The Federalists have collapsed, and [SCOPE.sInterestGroup('ca_struggle_ig').GetName] no longer stand with them."
 cafm_ig_struggle.5.d_centralist:0 "The Centralists have collapsed, and [SCOPE.sInterestGroup('ca_struggle_ig').GetName] no longer stand with them."
 cafm_ig_struggle.5.d_separatist:0 "The Separatists have collapsed, and [SCOPE.sInterestGroup('ca_struggle_ig').GetName] no longer stand with them."
 cafm_ig_struggle.5.f:0 "Nobody wants to stay on a sinking ship."
 cafm_ig_struggle.5.a:0 "Understood"
 cafm_ig_struggle.5.a_tt:0 "The group has lost its ideology."
