 # CAFM - F5 - Los Altos: textos nuevos
 ca_central_america.2.c:0 "Approve the Sixth State, with Soconusco."
 ca_central_america.2.opt_d:0 "Send a commission to study the matter."
 ca_central_america.2.approve_tt:0 "#bold Los Altos#! will be established as a #bold member State#! of the Federation, without Soconusco."
 ca_central_america.2.approve_soconusco_tt:0 "#bold Los Altos#! will be established as a #bold member State#! of the Federation, #bold including Soconusco#!. Mexico will not be pleased."
 ca_central_america.2.postpone_tt:0 "Congress will vote again in #bold 6 months#!. If it postpones a second time, the highlands will lose patience."
 ca_central_america.2.postpone_rebellion_tt:0 "This is the second postponement: #N the highlands will rise up#!."
 ca_central_america.4.c:0 "Let Guatemala deal with its own highlands."
 ca_central_america.4.c_tt:0 "The Federation will not intervene. When Guatemala leaves the Union it will #bold claim Los Altos#! and may take it back by force.\nThe #bold Conservative front#! will start one level higher in Phase IV."
 ca_central_america.120.b_tt:0 "The highlands will be silenced for now, but if the cry rises again #N they will take up arms#!."
