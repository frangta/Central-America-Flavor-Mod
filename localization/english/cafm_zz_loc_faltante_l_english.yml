 from_ca_communist_leader:0 "A communist leads the party"
 from_ca_communist_ig:0 "The Trade Unions back the party"
 movement_ca_guatemala_national_desc:0 "Guatemalans who want their State to stand alone, free of the federal Congress and of the other States' quarrels."
 movement_ca_elsalvador_national_desc:0 "Salvadorans who put their own State before the Union and want San Salvador to answer to no one."
 movement_ca_honduras_national_desc:0 "Hondurans who want their State's mines, forests and ports governed from Comayagua and Tegucigalpa, not from abroad."
 movement_ca_nicaragua_national_desc:0 "Nicaraguans who want a sovereign State, whatever the rivalry between León and Granada."
 movement_ca_costarica_national_desc:0 "Costa Ricans who want to keep their State out of the wars of the north and govern it from San José."
 movement_ca_panama_national_desc:0 "People of the Isthmus who want Panama to rule itself instead of being governed from Bogotá."
 movement_ca_chiapas_national_desc:0 "Chiapanecans who want their State's own government, between Mexico and Central America."
 movement_ca_los_altos_national_desc:0 "The people of Quetzaltenango and the western highlands, who want Los Altos to be a State of its own, apart from Guatemala."
 creation_of_a_new_union_cos:0 "Proclaim the Confederation of Costa Rica"
 creation_of_a_new_union_cos_desc:0 "With Costa Rica, Nicaragua and Panama under one government, San José can proclaim a new union in the south of the isthmus."
 creation_of_a_new_union_gua:0 "Proclaim the Greater Republic of Guatemala"
 creation_of_a_new_union_gua_desc:0 "With Guatemala, Chiapas and Yucatán under one government, Guatemala can proclaim a greater republic in the north."
 creation_of_a_new_union_els:0 "Proclaim the Union of Salvador"
 creation_of_a_new_union_els_desc:0 "With El Salvador, Guatemala and Honduras under one government, San Salvador can proclaim a new union."
 creation_of_a_new_union_nic:0 "Proclaim the Commonwealth of Nicaragua"
 creation_of_a_new_union_nic_desc:0 "With Nicaragua, Honduras and Costa Rica under one government, Nicaragua can proclaim a new union in the heart of the isthmus."
 creation_of_a_new_union_hon:0 "Proclaim the League of Honduras"
 creation_of_a_new_union_hon_desc:0 "With Honduras, Nicaragua and El Salvador under one government, Honduras can proclaim a new league."
 creation_of_a_new_union_pnm:0 "Proclaim the Dominion of Panama"
 creation_of_a_new_union_pnm_desc:0 "With Panama, Costa Rica and Antioquia under one government, the Isthmus can proclaim a dominion of its own."
