 # CAFM: textos que faltaban (6 nov 2026)
 je_ca_pacificacion_norte_goal:0 "Guanacaste and Nicoya pacified"
 je_ca_state_role_in_federation_support_federation:0 "Our State's leaders stand with the #bold Federation#!: the federalist faction has the upper hand."
 je_ca_state_role_in_federation_support_confederation:0 "Our State's leaders lean towards a #bold Confederation#! of sovereign States, or towards leaving the Union altogether."
 CA_UNIFY_ACCEPT_SHARED_RELIGION:0 "Shared religion"
 CA_UNIFY_ACCEPT_SAME_POWER_BLOC:0 "Same power bloc"
