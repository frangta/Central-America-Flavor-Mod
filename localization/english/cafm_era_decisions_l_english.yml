 cafm_the_rights_of_man:0 "The Rights of Man"
 cafm_the_rights_of_man_desc:0 "Independence in 1821 and the Federal Constitution of 1824 proclaimed popular sovereignty and abolished slavery. Enlightened men such as Valle and Barrundia carry the ideals of the age into our republic."
 cafm_era_rights_of_man:0 "The Rights of Man"
 cafm_era_rights_of_man_desc:0 "Independence in 1821 and the Federal Constitution of 1824 proclaimed popular sovereignty and abolished slavery. Enlightened men such as Valle and Barrundia carry the ideals of the age into our republic."
 cafm_political_ideology:0 "Political Ideology"
 cafm_political_ideology_desc:0 "Liberals and conservatives, "fiebres" and "serviles", the Church and the parties of notables: the civil war of 1826–1829 taught every faction to organize."
 cafm_era_political_ideology:0 "Political Ideology"
