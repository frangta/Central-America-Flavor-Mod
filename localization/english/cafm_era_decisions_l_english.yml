 cafm_of_state_n_government:0 "Of State and Government"
 cafm_of_state_n_government_desc:0 "After 1838 each State builds its own apparatus: its own constitution, treasury and army."
 cafm_era_state_and_government:0 "Of State and Government"
 cafm_era_state_and_government_desc:0 "After 1838 each State builds its own apparatus: its own constitution, treasury and army."
 cafm_dreams_of_empire:0 "Dreams of Empire"
 cafm_dreams_of_empire_desc:0 "The Patria Grande never died. Morazán, Barrios and the Greater Republic dreamed of one Central America, and every strong state dreams of leading it."
