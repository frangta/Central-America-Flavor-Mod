  je_ca_historic_situation_in_talamanca:0 "The Talamanca Situation"
  je_ca_historic_situation_in_talamanca_reason:0 "The indigenous populations of the Talamanca region have long maintained their autonomy and resisted central authority. We must carefully decide how to integrate, conquer, or interact with these historic communities."
  
  je_ca_agro_export_boom:0 "The Agro-Export Boom"
  je_ca_agro_export_boom_reason:0 "Global demand for our cash crops is skyrocketing. By expanding our plantations, securing foreign investment, and modernizing our infrastructure, we can usher in an unprecedented era of economic prosperity."
  
  je_ca_military_reform:0 "Central American Military Reforms"
  je_ca_military_reform_reason:0 "Our armed forces currently rely on outdated colonial tactics and undisciplined local militias. We must professionalize the army and centralize command to secure our sovereignty and maintain internal order."
  
  je_national_geological_survey:0 "National Geological Survey"
  je_national_geological_survey_reason:0 "To fully exploit our nation's hidden natural wealth, we must commission a comprehensive geological survey. Mapping our untamed regions will reveal new veins of minerals and potential excavation sites."
  
