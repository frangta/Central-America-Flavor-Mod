  ca_central_america.7.t:1 "A local newspaper proposed the formation of a state that would include the regions of Quetzaltenango, Totonicapán, Sololá and Suchitepéquez"
  ca_central_america.7.d:1 "which would have around two hundred thousand inhabitants and would allow them greater freedom of action and better representation before the [ROOT.GetCountry.GetName],The area of ​​Quetzaltenango, Totonicapán, Sololá is populated mostly by indigenous people, who have and want to maintain their ancestral traditions and their lands in the cold highlands of western Guatemala. Throughout the colonial period there had been revolts against the Spanish government. After independence, the local mestizos and creoles favored the liberal party, while the indigenous majority was a supporter of the Catholic Church and, therefore, conservative."
  ca_central_america.7.f:1 "hunger, unemployment, the great resentment among the merchants of Guatemala City, and without our port on the Pacific, in addition to the rumor that the government had poisoned the rivers and streams with the purpose of annihilating the indigenous population."
  ca_central_america.7.a:1 "It is the people's decision"
  ca_central_america.7.b:1 "We have to overshadow this idea of ​​a new state, WE HAVE TO ARREST THE OWNER OF THE NEWSPAPER" 
  ca_central_america.7.c:1 "Ignore the situation in Guatemala," 
