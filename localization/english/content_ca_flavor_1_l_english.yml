  federal_congress_decree_button:0 "Convene Federal Congress"
  federal_congress_decree_button_desc:0 "Summon the representatives of the states to negotiate the future of the Federation, attempting to bridge the divide between centralists and autonomists."
  
  fragile_unity_decree_button:0 "Enforce Fragile Unity"
  fragile_unity_decree_button_desc.:0 "Take extraordinary and authoritarian measures to keep our fracturing republic together, at the cost of local liberties and public approval."
  
  fragile_unity_decree_button2:0 "Maintain Fragile Unity"
  fragile_unity_decree_button_desc2.:0 "Continue to enforce the delicate unity of our nation through centralized control and military oversight."
  
  nicaragua_intervention_central_america_button:0 "Intervene in Nicaragua"
  nicaragua_intervention_central_america_button_desc:0 "Deploy federal forces to quell the endless chaos and bitter fighting between the liberals of León and the conservatives of Granada."
  
  restore_order_gua_button:0 "Restore Order in Guatemala"
  restore_order_gua_button_desc:0 "Send troops to pacify the mountain rebellions and bring the stubborn conservative elites back under federal authority."
  
  restore_order_hon_button:0 "Restore Order in Honduras"
  restore_order_hon_button_desc:0 "March into Honduras to suppress separatist caudillos and restore the rule of law within the state."
  
  restore_order_nic_button:0 "Restore Order in Nicaragua"
  restore_order_nic_button_desc:0 "Intervene directly in Nicaragua to end the civil strife, expel foreign filibusters, and secure the region for the Republic."
  
  restore_order_cos_button:0 "Restore Order in Costa Rica"
  restore_order_cos_button_desc:0 "Force Costa Rica to abandon its isolationist policies and forcibly reintegrate it into the Federal Republic."
  
