  je_ca_historic_situation_in_nicaragua:0 "The Nicaraguan Question"
  je_ca_historic_situation_in_nicaragua_reason:0 "Nicaragua stands divided between León and Granada — between liberals and conservatives — as local caudillos fight for power under the fading shadow of the Federation. Foreign merchants, regional elites, and church leaders all compete to determine the nation's fate. Whether Nicaragua remains loyal to the Central American cause or seeks independence will shape the destiny of the isthmus."
  je_ca_historic_situation_in_costarica:0 "The Costa Rican Dilemma"
  je_ca_historic_situation_in_costarica_reason:0 "Far from the centers of federal power, Costa Rica has long been torn between isolation and loyalty to the union. Economic stagnation and disputes with Guatemala over taxation and representation have fueled calls for autonomy. San José and Cartago vie for dominance — and the question remains: will Costa Rica continue to obey a distant federal authority, or forge its own path?"
  je_ca_historic_situation_in_elsalvador:0 "The Salvadoran Struggle"
  je_ca_historic_situation_in_elsalvador_reason:0 "El Salvador, once the beating heart of the Federation, now faces rising turmoil. The defeat of Morazán’s forces and the growing influence of conservative factions threaten to undo years of liberal reform. As rebellion spreads, the Salvadoran government must choose between holding the banner of federation or embracing national independence."
  je_ca_historic_situation_in_guatemala:0 "The Guatemalan Crisis"
  je_ca_historic_situation_in_guatemala_reason:0 "Guatemala, home of the Federal capital, is the center of both authority and dissent. Its powerful church, entrenched elites, and peasant uprisings have made it a battlefield of ideologies. The collapse of order here would mean the end of the federation itself — yet strongmen and regional factions are already carving out their own domains."
  je_ca_situation_in_losaltos:0 "The Rise of Los Altos"
  je_ca_situation_in_losaltos_reason:0 "The highlands of Quetzaltenango and Totonicapán have declared themselves the State of Los Altos, rejecting domination from Guatemala City. Inspired by liberal ideals and economic autonomy, the Altenses seek recognition as a separate federal entity. Their rebellion represents both the hope of reform and the risk of total fragmentation."
  je_ca_historic_situation_in_panama:0 "The Panamanian Crossroads"
  je_ca_historic_situation_in_panama_reason:0 "Though historically tied to New Granada, Panama’s strategic position and rising Creole ambitions pull it toward the Central American orbit. Local leaders debate whether to join the collapsing Federation or remain under Colombian influence. The choice will define Panama’s identity for generations to come."
  je_ca_historic_situation_in_honduras:0 "The Honduran Division"
  je_ca_historic_situation_in_honduras_reason:0 "Honduras, scarred by wars between liberals and conservatives, has become a land of shifting loyalties. Regional caudillos hold sway in Comayagua and Tegucigalpa, while federal troops struggle to maintain unity. As neighboring states secede, Honduras stands at a crossroads — to fight for the Federation’s survival or to claim sovereignty for itself."
  je_historic_central_america_falls_apart:0 "The Fall of the Central American Federation"
  je_historic_central_america_falls_apart_reason:0 "The dream of a united Central America is crumbling. Years of internal division, regional rivalries, and liberal-conservative struggles have pushed the Federation to the brink of dissolution. The outbreak of civil wars, separatist movements, and foreign meddling threatens to tear apart what remains of the Federal Republic.\n\nAs the turmoil spreads across Guatemala, El Salvador, Honduras, Nicaragua, and Costa Rica, the central government must decide whether to maintain unity through reform or to fight to preserve the old order. Every passing month brings new rebellions, new declarations of independence, and the fading hope of a united Central America."
