l_english:
 # CAFM - Nicaragua fase 2, Honduras fase 2 y la Mosquitia (10 nov 2026)
 ca_honduras_events.43.t:0 "Honduras Leaves the Union"
 ca_honduras_events.43.d:0 "In October the assembly declares Honduras separated from the Federal Republic. Nicaragua went in April, Costa Rica before that. What is left of the Union is El Salvador and a bill."
 ca_honduras_events.43.f:0 "\"We are a state that has stopped being part of something and has not yet started being anything.\""
 ca_honduras_events.43.a:0 "Declare the separation"
 ca_honduras_events.43.b:0 "Wait for the other states"
 ca_honduras_events.44.t:0 "A President at Juticalpa"
 ca_honduras_events.44.d:0 "On the twenty-first of September the conservatives name General Francisco Zelaya y Ayes president, and he takes office at Juticalpa because Comayagua and Tegucigalpa are both unsafe for him."
 ca_honduras_events.44.f:0 "\"The government of Honduras is wherever the president happens to be standing.\""
 ca_honduras_events.44.a:0 "Zelaya y Ayes, president"
 ca_honduras_events.45.t:0 "San Pedro Perulapán"
 ca_honduras_events.45.d:0 "On the twenty-fifth of September the allied columns met Morazán in Salvadoran territory and were broken. He is beaten everywhere except on a battlefield."
 ca_honduras_events.45.f:0 "\"Four states against him, and he still wins the actual fighting.\""
 ca_honduras_events.45.a:0 "A defeat we can afford"
 ca_honduras_events.46.t:0 "La Soledad"
 ca_honduras_events.46.d:0 "On the thirteenth of November Zelaya lost again, outside Tegucigalpa and against Cabañas. The president has now been beaten in his own country, within sight of the second city."
 ca_honduras_events.46.f:0 "\"Comayagua governs and Tegucigalpa fights. That is the arrangement.\""
 ca_honduras_events.46.a:0 "Hold Comayagua"
 ca_honduras_events.46.b:0 "Come to terms with Tegucigalpa"
 ca_honduras_events.47.t:0 "The Constitution of the State"
 ca_honduras_events.47.d:0 "The constituent assembly that met in 1838 has a text at last: a president, a chamber, a Catholic state and property requirements for the vote. On paper, Honduras exists."
 ca_honduras_events.47.f:0 "\"On paper. We will find out about the rest.\""
 ca_honduras_events.47.a:0 "Promulgate it"
 ca_honduras_events.47.b:0 "Govern by decree a while longer"
 ca_honduras_events.48.t:0 "Ferrera, First Constitutional President"
 ca_honduras_events.48.d:0 "Elected in June and sworn in on the first of January. He is a soldier who means to govern through the classes that lost ground under the Federation, and he will give them back what Morazán took."
 ca_honduras_events.48.f:0 "\"The first president under the Constitution, and the first to find out how little it binds him.\""
 ca_honduras_events.48.a:0 "Francisco Ferrera"
 ca_honduras_events.48.b:0 "A civilian president"
 ca_honduras_events.69.t:0 "The Cuttings of Belize"
 ca_honduras_events.69.d:0 "The mahogany companies out of Belize work the rivers of the north coast and pay nobody. There is no customs house between Trujillo and Cabo Gracias a Dios, and the only authority on that coast flies a flag we do not recognize."
 ca_honduras_events.69.f:0 "\"We own the coast on the map and nothing on the ground.\""
 ca_honduras_events.69.a:0 "Tax the cuttings"
 ca_honduras_events.69.b:0 "We cannot police a jungle"
 ca_honduras_events.49.t:0 "The Colegio Tridentino Reopens"
 ca_honduras_events.49.d:0 "Ferrera has reopened the seminary at Comayagua. It is the only institution in Honduras that trains anyone for anything, and it trains them for the Church."
 ca_honduras_events.49.f:0 "\"Our entire educated class will owe its education to the bishop.\""
 ca_honduras_events.49.a:0 "Reopen it"
 ca_honduras_events.49.b:0 "A lay college instead"
 ca_honduras_events.50.t:0 "The Port of La Paz"
 ca_honduras_events.50.d:0 "The government reopens the Pacific port on the Gulf of Fonseca. Everything Honduras sells has been going out through somebody else's customs house, and this is the first attempt in twenty years to change that."
 ca_honduras_events.50.f:0 "\"A country that exports through foreign ports does not set its own prices.\""
 ca_honduras_events.50.a:0 "Reopen the port"
 ca_honduras_events.50.b:0 "The treasury cannot build a port"
 ca_honduras_events.51.t:0 "The Tithe Restored"
 ca_honduras_events.51.d:0 "The tithe abolished in 1829 is law again. The Church gets its income back and the government gets a clergy that will read its decrees from the pulpit."
 ca_honduras_events.51.f:0 "\"The cheapest administration in Central America: one that the parish priests run for you.\""
 ca_honduras_events.51.a:0 "Restore the tithe"
 ca_honduras_events.51.b:0 "Leave 1829 alone"
 ca_honduras_events.52.t:0 "The Smallpox Year"
 ca_honduras_events.52.d:0 "Smallpox has gone through Comayagua and Tegucigalpa, and the treasury has nothing to spend on it. What is left of the public revenue is already committed to the army."
 ca_honduras_events.52.f:0 "\"The state's one visible act this year will be a quarantine it cannot enforce.\""
 ca_honduras_events.52.a:0 "Spend what we do not have"
 ca_honduras_events.52.b:0 "The parishes will have to manage"
 ca_honduras_events.53.t:0 "The Church Lands Returned"
 ca_honduras_events.53.d:0 "Ferrera orders the property confiscated under the Federation returned. The men who lost it are the men who put him in office, which is the whole explanation."
 ca_honduras_events.53.f:0 "\"A revolution undone by decree, in favour of the people who paid for the decree.\""
 ca_honduras_events.53.a:0 "Return the property"
 ca_honduras_events.53.b:0 "The state keeps what it took"
 ca_honduras_events.54.t:0 "Texiguat, Liure, El Corpus, Danlí"
 ca_honduras_events.54.d:0 "Four towns in the south have risen in as many years, and the administration has spent its whole term putting them down. Nobody remembers what the first one was about."
 ca_honduras_events.54.f:0 "\"A government whose only policy is the march on the next village.\""
 ca_honduras_events.54.a:0 "Put them down"
 ca_honduras_events.54.b:0 "Hear what they want"
 ca_honduras_events.55.t:0 "The End of Ferrera's Second Term"
 ca_honduras_events.55.d:0 "On the thirty-first of December his term runs out. He has restored the tithe, the seminary, the church lands and the army, and he leaves the treasury where he found it."
 ca_honduras_events.55.f:0 "\"He hands over the presidency. He does not hand over the army.\""
 ca_honduras_events.55.a:0 "Let the term end"
 ca_honduras_events.55.b:0 "Extend him once more"
 ca_honduras_events.56.t:0 "Coronado Chávez"
 ca_honduras_events.56.d:0 "The chamber elects him for two years and he takes office on the eighth of January. He will govern with a council of ministers, and two of its members are Santos Guardiola and Casto Alvarado."
 ca_honduras_events.56.f:0 "\"Note the names in the council. One of them will be the next problem.\""
 ca_honduras_events.56.a:0 "Coronado Chávez, president"
 ca_honduras_events.57.t:0 "Juan Lindo Comes Home"
 ca_honduras_events.57.d:0 "On the twelfth of February the lawyer from Tegucigalpa who governed in Comayagua, in Guatemala and in San Salvador takes the presidency of his own country. He is fifty-six and has run three states already."
 ca_honduras_events.57.f:0 "\"He has governed half of Central America. Honduras is the last one on the list.\""
 ca_honduras_events.57.a:0 "Juan Lindo, president"
 ca_honduras_events.58.t:0 "War on the United States"
 ca_honduras_events.58.d:0 "Lindo declares war on the United States in support of Mexico. Honduras has no navy, no money and no border with either party. Carrera has told us plainly that this is madness."
 ca_honduras_events.58.f:0 "\"A gesture. But it is the first foreign policy anyone here has had in ten years.\""
 ca_honduras_events.58.a:0 "Declare it anyway"
 ca_honduras_events.58.b:0 "Listen to Carrera"
 ca_honduras_events.59.t:0 "The Academy of Father Reyes"
 ca_honduras_events.59.d:0 "José Trinidad Reyes has opened a literary academy in Tegucigalpa, and the government means to make a university out of it. He is a priest who writes plays and teaches physics, which in Honduras makes him an institution by himself."
 ca_honduras_events.59.f:0 "\"One man, a room, and the first university this country will ever have.\""
 ca_honduras_events.59.a:0 "Make it a university"
 ca_honduras_events.59.b:0 "An academy is enough"
 ca_honduras_events.60.t:0 "The Constitution of 1848"
 ca_honduras_events.60.d:0 "Lindo decrees a new constitution on the fourth of February. It is the second in nine years, which is either a sign of progress or a sign that nobody obeys the first one."
 ca_honduras_events.60.f:0 "\"A new constitution is cheaper than enforcing the old one.\""
 ca_honduras_events.60.a:0 "Decree it"
 ca_honduras_events.60.b:0 "Keep the one we have"
 ca_honduras_events.61.t:0 "The Plumper at Trujillo"
 ca_honduras_events.61.d:0 "In October HMS Plumper entered Trujillo demanding twelve hundred pesos for mahogany seized from the Belize companies. The landing party took the port, broke what it found and left with the money."
 ca_honduras_events.61.f:0 "\"Twelve hundred pesos, collected by a warship, from a country with no navy.\""
 ca_honduras_events.61.a:0 "Pay and protest"
 ca_honduras_events.61.b:0 "Garrison Trujillo"
 ca_honduras_events.62.t:0 "Tigre Island"
 ca_honduras_events.62.d:0 "Consul Chatfield has ordered troops off HMS Gorgon to occupy Tigre Island, in our own gulf, without authorization from his own government. Colonel Lechuga's garrison did not fire a shot."
 ca_honduras_events.62.f:0 "\"One consul, acting alone, has taken an island from a republic.\""
 ca_honduras_events.62.a:0 "Protest in every capital"
 ca_honduras_events.62.b:0 "Offer the island to Washington"
 ca_honduras_events.63.t:0 "The Pact of Chinandega"
 ca_honduras_events.63.d:0 "Squier has pushed through a pact guaranteeing American support for any canal emptying into the Gulf of Fonseca, and he wants a bilateral treaty securing our sovereignty over Tigre Island. He is using us against Chatfield, and we are using him back."
 ca_honduras_events.63.f:0 "\"The island is worth nothing. Being wanted by two empires is worth a great deal.\""
 ca_honduras_events.63.a:0 "Sign with Squier"
 ca_honduras_events.63.b:0 "Settle it with London directly"
 ca_honduras_events.64.t:0 "Twenty-One Guns"
 ca_honduras_events.64.d:0 "On the twenty-sixth of December the British squadron evacuates Tigre Island and returns it with a twenty-one gun salute. London had disavowed the occupation almost as soon as it heard of it."
 ca_honduras_events.64.f:0 "\"They took it in silence and gave it back with a band.\""
 ca_honduras_events.64.a:0 "The island is ours again"
 ca_honduras_events.65.t:0 "Squier Goes Too Far"
 ca_honduras_events.65.d:0 "In January the American agent proclaims joint sovereignty over the island. Washington disavows him within weeks. Both empires have now disowned their own man in the same quarrel."
 ca_honduras_events.65.f:0 "\"Our sovereignty survived because both of their agents exceeded their orders.\""
 ca_honduras_events.65.a:0 "Accept the disavowal gratefully"
 ca_honduras_events.66.t:0 "Clayton and Bulwer"
 ca_honduras_events.66.d:0 "On the nineteenth of April the two powers agree to neutralize Central America with respect to an interoceanic canal. Neither will occupy, fortify or colonize. The crisis in our gulf ends in a treaty we did not sign."
 ca_honduras_events.66.f:0 "\"Protected by an agreement between the two countries we needed protection from.\""
 ca_honduras_events.66.a:0 "A treaty we did not sign"
 ca_honduras_events.67.t:0 "The Pact of Pespire"
 ca_honduras_events.67.d:0 "Guardiola has called his assemblies at La Paz and Cedros and risen against the government. El Salvador has sent Victoriano Castellanos to mediate, on Vasconcelos's instructions. The general leaves the country and the civilians keep the presidency."
 ca_honduras_events.67.f:0 "\"A caudillo talked out of the country by a neighbour. It has never happened here before.\""
 ca_honduras_events.67.a:0 "Accept the mediation"
 ca_honduras_events.67.b:0 "Settle it with the army"
 ca_honduras_events.68.t:0 "Ocotepeque"
 ca_honduras_events.68.d:0 "On the fourth of January, at Ocotepeque, Lindo signs with El Salvador against Guatemala. Nicaragua was invited and declined. Two thousand Hondurans will march with Vasconcelos's four thousand."
 ca_honduras_events.68.f:0 "\"Lindo governed Guatemala once. He knows exactly who he is marching against.\""
 ca_honduras_events.68.a:0 "Sign the alliance"
 ca_honduras_events.68.b:0 "Honduras stays home"
