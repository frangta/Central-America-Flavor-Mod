l_english:
 # CAFM P12 - diario "Nuestro papel en la República" (espectro federal y widget)
 CA_ROLE_BOX:0 "#bold [GetPlayer.GetRuler.GetFullName]#! governs the State.  Needle: #bold [GetPlayer.MakeScope.ScriptValue('ca_role_spectrum_value')|0]#! (from -50 to +50)\nLoyalty to the Federation: #bold [GetPlayer.MakeScope.ScriptValue('ca_role_own_loyalty')|0]#! / 3  ·  Internal struggle: #bold [GetPlayer.MakeScope.Var('ca_fvs_bar').GetValue|0]#! / 100 (100 = federalists win)\nFactions in the State: Federalists #bold [GetPlayer.MakeScope.Var('ca_federalist_influence').GetValue|0]#! / 3 · Centralists #bold [GetPlayer.MakeScope.Var('ca_centralist_influence').GetValue|0]#! / 3 · Separatists #bold [GetPlayer.MakeScope.Var('ca_separatist_influence').GetValue|0]#! / 3"
 je_ca_state_role_in_federation_zone_centralist:0 "The needle is in #bold centralism#!: our State submits to the federal capital and its unitary order."
 je_ca_state_role_in_federation_zone_federal:0 "The needle is in the #bold federal pact#!: sovereign at home and loyal to the Union, as the Constitution of 1824 intended."
 je_ca_state_role_in_federation_zone_separatist:0 "The needle is in #bold separatism#!: the sovereignty of the State weighs more than the Union."
 ca_role_zone_cen_on:0 "#bold Centralism#!"
 ca_role_zone_cen_off:0 "#lore Centralism#!"
 ca_role_zone_fed_on:0 "#bold Federal pact#!"
 ca_role_zone_fed_off:0 "#lore Federal pact#!"
 ca_role_zone_sep_on:0 "#bold Separatism#!"
 ca_role_zone_sep_off:0 "#lore Separatism#!"
 ca_role_zone_cen_tt:0 "#bold Centralism#! (needle from #v -50#! to #v -17#!)\nEffect: +20 authority, -10 liberty desire, -2 Intelligentsia approval.\nWith the centralist faction at 3, the centralist coup is prepared."
 ca_role_zone_fed_tt:0 "#bold Federal pact#! (needle from #v -16#! to #v +16#!)\nEffect: +5 legitimacy."
 ca_role_zone_sep_tt:0 "#bold Separatism#! (needle from #v +17#! to #v +50#!)\nEffect: +10 liberty desire, +1 Landowners approval.\nIn dynamic mode, separatism and independence events can only fire in this zone."
 ca_role_btn_federation:0 "Support the Federation (needle to 0)"
 ca_role_btn_confederation:0 "Support the Confederation (needle +5)"
 ca_role_btn_sabotage:0 "Sabotage the Federation (needle +10)"
 ca_role_btn_centralists:0 "Support the centralists (needle -10)"
 ca_role_spectrum_allows_separatism_tt:0 "The needle of #bold Our Role in the Republic#! is in the separatist zone (#v +17#! or more)"
 ca_spectrum_zone_centralist:0 "Centralist State"
 ca_spectrum_zone_centralist_desc:0 "Our State submits to the federal capital."
 ca_spectrum_zone_federal:0 "Federal State"
 ca_spectrum_zone_federal_desc:0 "Our State keeps the federal pact of 1824."
 ca_spectrum_zone_separatist:0 "Separatist State"
 ca_spectrum_zone_separatist_desc:0 "Our State puts its sovereignty above the Union."
