l_english:
 # CAFM - F10 - Los 4 frentes de la fase IV
 ca_central_america.150.t:0 "British Demands"
 ca_central_america.150.d:0 "The British consul has delivered a note: the debt of the old Federation must be paid, the woodcutters of Belize must be left alone, and the Mosquito King is under the protection of the Crown. London expects an answer."
 ca_central_america.150.f:0 ""Her Majesty's Government takes a grave view of the matter.""
 ca_central_america.150.a:0 "Give them what they want, for now."
 ca_central_america.150.b:0 "We will not bow to London."
 ca_central_america.151.t:0 "The Mosquito Protectorate"
 ca_central_america.151.d:0 "British warships have landed marines on the Mosquito Coast. The Caribbean coast of Nicaragua, from Cape Gracias a Dios to San Juan del Norte, is now under the protection of the British Crown."
 ca_central_america.151.f:0 "The Union has lost its Caribbean shore."
 ca_central_america.151.a:0 "We cannot stop them."
 ca_central_america.152.t:0 "Mexico Eyes Soconusco"
 ca_central_america.152.d:0 "Mexican agents travel freely through Soconusco, and the town councils are signing acts of adhesion to Mexico. The government in Mexico City says it only answers the will of the people."
 ca_central_america.152.f:0 ""Soconusco has always been Mexican.""
 ca_central_america.152.a:0 "Send federal troops and money to Soconusco."
 ca_central_america.152.b:0 "Protest through diplomatic channels."
 ca_central_america.153.t:0 "The Irrevocable Union"
 ca_central_america.153.d:0 "Mexico has proclaimed the irrevocable union of Soconusco with Chiapas. Our protests have gone unanswered, and Mexican troops now guard the border."
 ca_central_america.153.f:0 "Soconusco is lost."
 ca_central_america.153.a:0 "A bitter loss."
 ca_central_america.154.t:0 "The Altar and the Throne"
 ca_central_america.154.d:0 "The clergy preaches against the Federation from every pulpit. Carrera's men are seen in the villages, and the conservatives of Guatemala openly demand the return of the Church's privileges."
 ca_central_america.154.f:0 ""Long live religion, death to the foreigners!""
 ca_central_america.154.a:0 "Make concessions to the Church."
 ca_central_america.154.b:0 "The Republic will not bow to the clergy."
 ca_central_america.155.t:0 "Guatemala Turns Its Back"
 ca_central_america.155.d:0 "The conservatives have won the battle for Guatemala. Its notables, its clergy and its peasants no longer recognize the federal government."
 ca_central_america.155.f:0 "The giant of the north has chosen its side."
 ca_central_america.155.a:0 "So be it."
 ca_central_america.156.t:0 "Restless Barracks"
 ca_central_america.156.d:0 "Unpaid officers and ambitious colonels meet behind closed doors. In every State a caudillo waits for the moment when the federal government shows weakness."
 ca_central_america.156.f:0 ""Who pays the army, rules the country.""
 ca_central_america.156.a:0 "Pay the officers what they are owed."
 ca_central_america.156.b:0 "The army will obey the Republic."
 ca_central_america.157.t:0 "The Generals Take Power"
 ca_central_america.157.d:0 "The officers have lost patience. Troops have surrounded the government palace, and the generals now dictate the policy of the Union."
 ca_central_america.157.f:0 "The sword has replaced the law."
 ca_central_america.157.a:0 "We have no choice."
 ca_frca_british_concessions:0 "Concessions to Britain"
 ca_frca_british_concessions_desc:0 "The Federation has given in to British demands."
 ca_frca_military_coup:0 "Military Rule"
 ca_frca_military_coup_desc:0 "The generals dictate the policy of the Union."
