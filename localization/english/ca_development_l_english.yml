 ca_coffee_events.1.t:0 "The Coffee Elite"
 ca_coffee_events.1.d:0 "A handful of families have grown rich from coffee. They want more land, cheap credit and a government that listens to them."
 ca_coffee_events.1.f:0 ""Coffee is gold that grows on trees.""
 ca_coffee_events.1.a:0 "Give them land and credit."
 ca_coffee_events.1.b:0 "Limit their power."
 ca_coffee_events.2.t:0 "The Coffee Republic"
 ca_coffee_events.2.d:0 "Coffee has transformed the country. The roads lead to the ports, the banks lend to the planters, and the great coffee families sit in the government."
 ca_coffee_events.2.f:0 ""The Republic smells of roasted coffee.""
 ca_coffee_events.2.a:0 "The future is in the coffee."
 ca_coffee_events.3.t:0 "The Ejidos"
 ca_coffee_events.3.d:0 "The planters covet the communal lands of the villages, the old ejidos. If they were sold, coffee would cover the whole country; but the peasants would lose the land that feeds them."
 ca_coffee_events.3.f:0 ""Land for coffee, or land for maize?""
 ca_coffee_events.3.a:0 "Abolish the communal lands."
 ca_coffee_events.3.b:0 "Respect the ejidos."
 ca_economy.1.t:0 "The Agro-Export Miracle"
 ca_economy.1.d:0 "Coffee, bananas and the ships that carry them have made the country richer than ever. The question is who will keep the profits."
 ca_economy.1.f:0 ""The world wants our fruit.""
 ca_economy.1.a:0 "Prosperity at last!"
 ca_economy.2.t:0 "The Banana Companies"
 ca_economy.2.d:0 "Foreign fruit companies offer to build plantations, railways and ports on the Caribbean coast. In exchange they want land, tax exemptions and a free hand."
 ca_economy.2.f:0 ""They bring railways; they will take the country.""
 ca_economy.2.a:0 "Grant the concessions."
 ca_economy.2.b:0 "Only on our conditions."
 ca_economy.3.t:0 "The Railway to the Atlantic"
 ca_economy.3.d:0 "A railway from the capital to the Caribbean would bring the coffee to Europe in weeks instead of months. The question is who will pay for it."
 ca_economy.3.f:0 ""Iron rails to the sea.""
 ca_economy.3.a:0 "Foreign capital will build it."
 ca_economy.3.b:0 "We will build it with our own money."
 ca_military.1.t:0 "The End of the Age of Caudillos"
 ca_military.1.d:0 "The army now obeys the government and not the other way around. The generals who once made and unmade presidents have retired, or have learned to salute."
 ca_military.1.f:0 ""The sword serves the law.""
 ca_military.1.a:0 "A modern army for a modern Republic."
 ca_military.2.t:0 "The Caudillos Entrench"
 ca_military.2.d:0 "The reform has failed. The caudillos are stronger than ever, and every general with a few hundred men dreams of the presidential sash."
 ca_military.2.f:0 ""Whoever has the soldiers, has the Republic.""
 ca_military.2.a:0 "So be it."
 ca_military.3.t:0 "The Military Academy"
 ca_military.3.d:0 "The government wants to found a military academy to train officers who owe their rank to merit and not to a caudillo. Who will teach them?"
 ca_military.3.f:0 ""Officers are made, not born.""
 ca_military.3.a:0 "Hire foreign instructors."
 ca_military.3.b:0 "Our own officers will teach."
 ca_military.4.t:0 "[SCOPE.sCharacter('ca_caudillo_general').GetFullName] Refuses to Disband His Troops"
 ca_military.4.d:0 "The government has ordered the militias to disband, but [SCOPE.sCharacter('ca_caudillo_general').GetFullName] refuses. His men are loyal to him, not to the Republic."
 ca_military.4.f:0 ""My soldiers go where I go.""
 ca_military.4.a:0 "Disarm him by force."
 ca_military.4.b:0 "Buy his loyalty."
 ca_culture.1.t:0 "The Central American Enlightenment"
 ca_culture.1.d:0 "Schools in every town, newspapers in every café and a university that is the pride of the nation. A generation of lawyers, doctors and poets has grown up reading."
 ca_culture.1.f:0 ""A people that reads cannot be enslaved.""
 ca_culture.1.a:0 "Knowledge is our wealth."
 ca_culture.1.tt:0 "The Enlightenment has been completed."
 ca_culture.2.t:0 "The University"
 ca_culture.2.d:0 "The country needs a university to train its lawyers, doctors and engineers. The liberals want a secular university of the State; the Church wants a pontifical one."
 ca_culture.2.f:0 ""Light, liberty and learning.""
 ca_culture.2.a:0 "A secular university of the State."
 ca_culture.2.b:0 "A pontifical university."
 ca_culture.3.t:0 "The Liberal Press"
 ca_culture.3.d:0 "A group of young liberals wants to found a newspaper that will discuss everything: the government, the Church and the future of the Union."
 ca_culture.3.f:0 ""Ink is more dangerous than gunpowder.""
 ca_culture.3.a:0 "Let them print what they want."
 ca_culture.3.b:0 "Only with a government license."
 ca_culture.4.t:0 "The Normal Schools"
 ca_culture.4.d:0 "To teach the people to read, the country needs teachers. The government can found normal schools to train them, or leave education to the parish priests as before."
 ca_culture.4.f:0 ""First the teachers, then the schools.""
 ca_culture.4.a:0 "Found normal schools."
 ca_culture.4.b:0 "The priests will teach as before."
 ca_coffee_republic_modifier:0 "The Coffee Republic"
 ca_coffee_republic_modifier_desc:0 "Coffee rules the economy and the coffee families rule the country."
