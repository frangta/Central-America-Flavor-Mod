 CA_CONF_CAUDILLOS:0 "The caudillos defy the Diet"
 CA_CONF_HOSTILE_GUATEMALA:0 "Guatemala is hostile"
 CA_UNITY_CONFEDERATED_PARTNER:0 "Confederated partner"
 CA_UNITY_FAILED_CAMPAIGN:0 "The failed campaign of union"
 CA_CONGRESS_UNITY:0 "Central American unity"
 CA_CONGRESS_AT_WAR:0 "At war with a Central American state"
 CA_CONGRESS_CLOSED_REPUBLIC:0 "Costa Rica has closed itself off"
 CA_CONGRESS_NIC_UNIONISM_DEAD:0 "Nicaragua has given up on the Union"
 CA_INVITE_FRIENDLY:0 "Friendly relations"
 CA_INVITE_LIBERALS:0 "Liberals in the government"
 CA_INVITE_LANDOWNERS:0 "Powerful landowners"
 CA_INVITE_CLOSED_REPUBLIC:0 "A closed republic"
 je_ca_confederation:0 "The Central American Confederation"
 je_ca_confederation_reason:0 "The Pact of Chinandega has created a Confederation of sovereign States. A Supreme Delegate presides over it and a Diet represents the partners, but each State keeps its own army, its own treasury and its own quarrels. The Confederation will only survive if its partners learn to act together."
 je_ca_conf_status_strong:0 "The partners act together and the Diet is respected."
 je_ca_conf_status_weak:0 "The Confederation is falling apart: the partners ignore the Diet."
 je_ca_conf_status_normal:0 "The Confederation survives, but every partner looks after itself."
 je_ca_conf_complete_tt:0 "Confederal cohesion reaches 100"
 je_ca_conf_partners_tt:0 "At least 3 confederated partners"
 je_ca_conf_fail_tt:0 "Confederal cohesion falls to 0"
 je_ca_conf_few_partners_tt:0 "Fewer than 2 confederated partners"
 je_ca_conf_timeout_tt:0 "The year 1850 arrives"
 je_ca_patria_grande:0 "The Patria Grande"
 je_ca_patria_grande_reason:0 "Central America was one nation, and many still dream of seeing it united again. Congresses, treaties and, when all else fails, armies may one day restore the Patria Grande."
 je_ca_patria_grande_status_close:0 "The dream of the Union has never been so close."
 je_ca_patria_grande_status_far:0 "The Union is still a distant dream."
 je_ca_patria_grande_unity_tt:0 "Central American unity reaches 100"
 je_ca_patria_grande_states_tt:0 "At least 4 of the 5 States of 1823 under our rule or as confederated partners"
 ca_button_conf_diet:0 "Convoke the Diet"
 ca_button_conf_diet_desc:0 "The Diet of the Confederation meets to settle the common affairs of the partners.\n\nConfederal cohesion #G +10#!; relations with the partners #G +10#!."
 ca_button_conf_defense:0 "Common Defense"
 ca_button_conf_defense_desc:0 "The partners promise to defend each other against any aggression.\n\nA defensive pact with each partner; confederal cohesion #G +10#!."
 ca_button_conf_customs:0 "Common Customs and Currency"
 ca_button_conf_customs_desc:0 "A single customs tariff and a common currency for the whole Confederation.\n\nConfederal cohesion #G +15#! and #G +1#! per month."
 ca_button_conf_cohesion_40_tt:0 "Confederal cohesion is at least 40"
 ca_button_conf_invite:0 "Invite a State to the Confederation"
 ca_button_conf_invite_desc:0 "We invite the independent States of Central America to join the Confederation. Each one decides for itself; those who refuse will not listen again for five years."
 ca_button_conf_invite_target_tt:0 "There is an independent Central American State that can be invited"
 ca_button_unionist_congress:0 "Convoke a Unionist Congress"
 ca_button_unionist_congress_desc:0 "Delegates of the Central American States meet to discuss the restoration of the Union. If the congress succeeds, the friendliest States may join us as confederated partners."
 ca_button_unionist_congress_tt:0 "The chance of success depends on Central American unity and on the wars between the States."
 ca_conf_consolidated_mod:0 "Consolidated Confederation"
 ca_conf_consolidated_mod_desc:0 "The Confederation has proved that the States can act together."
 ca_conf_broken_mod:0 "Broken Confederation"
 ca_conf_broken_mod_desc:0 "The Confederation has broken apart."
 ca_conf_customs_union_mod:0 "Confederal Customs"
 ca_conf_customs_union_mod_desc:0 "A common customs tariff and currency for the whole Confederation."
 ca_conf_strong_delegate:0 "A Strong Supreme Delegate"
 ca_conf_strong_delegate_desc:0 "The Supreme Delegate speaks with the authority of the head of the Confederation."
 ca_national_war_mod:0 "The National War"
 ca_national_war_mod_desc:0 "The Central American armies have fought together against the filibusters."
 ca_patria_mayor_mod:0 "The Greater Republic"
 ca_patria_mayor_mod_desc:0 "A Greater Republic of Central America represents its members abroad."
 ca_patria_grande_reborn_mod:0 "The Patria Grande Reborn"
 ca_patria_grande_reborn_mod_desc:0 "Central America is one nation again."
 ca_central_america.158.t:0 "The Supreme Delegate"
 ca_central_america.158.d:0 "Every year the Diet must choose the Supreme Delegate who represents the Confederation. The head State wants one of its own; the partners want a man they can trust."
 ca_central_america.158.f:0 ""The Delegate is supreme in name only.""
 ca_central_america.158.a:0 "A delegate from one of the partners."
 ca_central_america.158.b:0 "A delegate from the head State."
 ca_central_america.158.c:0 "Leave the post vacant this year."
 ca_central_america.159.t:0 "Guatemala and Costa Rica Answer"
 ca_central_america.159.d:0 "The Confederation has invited the States that did not sign the Pact of Chinandega. Their answers have arrived."
 ca_central_america.159.f:0 ""Every State is jealous of its sovereignty.""
 ca_central_america.159.a:0 "Respect their decision."
 ca_central_america.159.b:0 "Welcome the new partners."
 ca_central_america.160.t:0 "The Challenge of [SCOPE.sCharacter('ca_conf_caudillo').GetFullName]"
 ca_central_america.160.d:0 "[SCOPE.sCharacter('ca_conf_caudillo').GetFullName], strongman of [SCOPE.sCountry('ca_conf_rebel').GetName], no longer obeys the Diet. He wants to lead the Confederation himself, with his army behind him."
 ca_central_america.160.f:0 ""The Diet has laws; he has bayonets.""
 ca_central_america.160.a:0 "Accept his leadership."
 ca_central_america.160.b:0 "Stand up to him."
 ca_central_america.160.c:0 "Buy his loyalty."
 ca_central_america.161.t:0 "The Sack of León"
 ca_central_america.161.d:0 "The armies of the partners have turned against each other. A Central American city has been sacked by Central American soldiers, and the Confederation that was meant to keep the peace among them has done nothing."
 ca_central_america.161.f:0 ""Brothers killing brothers, in the name of the Union.""
 ca_central_america.161.a:0 "The Confederation is dead."
 ca_central_america.161.b:0 "Rally the partners one last time."
 ca_central_america.162.t:0 "The Unionist Congress"
 ca_central_america.162.d:0 "The delegates of the Central American States have met to discuss the restoration of the Union. After weeks of speeches and banquets, the congress has reached its verdict."
 ca_central_america.162.f:0 ""Every congress ends with a toast; few end with a Union.""
 ca_central_america.162.a:0 "A step towards the Union!"
 ca_central_america.162.b:0 "Another congress, another failure."
 ca_central_america.162.success_tt:0 "The congress has succeeded: unity has risen and the friendliest States may have joined us as confederated partners."
 ca_central_america.162.fail_tt:0 "The congress has failed: unity has fallen."
 ca_central_america.163.t:0 "The National War"
 ca_central_america.163.d:0 "Foreign filibusters have seized power in one of the States of the isthmus and threaten all the others. For the first time in years, the Central American armies may fight on the same side."
 ca_central_america.163.f:0 ""Against the invader, all Central Americans are brothers.""
 ca_central_america.163.a:0 "Send our army against the filibusters."
 ca_central_america.163.b:0 "It is not our war."
 ca_central_america.164.t:0 "The Campaign of Union"
 ca_central_america.164.d:0 "[SCOPE.sCharacter('ca_unionist_ruler').GetFullName] has decided that words are not enough. If the States will not unite by agreement, the Union will be proclaimed by decree and defended by arms."
 ca_central_america.164.f:0 ""The Union or death!""
 ca_central_america.164.a:0 "Proclaim the Union by decree."
 ca_central_america.164.b:0 "Not yet: the time is not ripe."
 ca_central_america.164.historic_tt:0 "The campaign ends at the battle of Chalchuapa: the leader of the Union falls and the dream dies with him."
 ca_central_america.165.t:0 "The Greater Republic"
 ca_central_america.165.d:0 "Several States propose a pact: a Greater Republic that will represent them abroad and prepare, step by step, the definitive Union."
 ca_central_america.165.f:0 ""First a pact, then a Republic.""
 ca_central_america.165.a:0 "Sign the pact."
 ca_central_america.165.b:0 "Decline: a pact without a Union is worthless."
 ca_central_america.167.t:0 "The Greater Republic Dissolves"
 ca_central_america.167.d:0 "The Greater Republic has not survived the quarrels of its members. One of them has withdrawn, and the others no longer see the point."
 ca_central_america.167.f:0 ""Another Union that lived only on paper.""
 ca_central_america.167.a:0 "So it ends."
 ca_central_america.166.t:0 "The Patria Grande Reborn"
 ca_central_america.166.d:0 "From Guatemala to Costa Rica, the five volcanoes fly again over one nation. The dream of Morazán and of so many others, which so many congresses failed to fulfill, has become reality."
 ca_central_america.166.f:0 ""Central America is one again.""
 ca_central_america.166.a:0 "Long live the Patria Grande!"
 ca_conf_consolidated_tt:0 "The Confederation is consolidated: the Patria Grande can be pursued."
 je_ca_confederation_goal:0 "Reach 100 confederal cohesion with at least 3 partners and no wars between them before 1850."
 je_ca_patria_grande_goal:0 "Reach 100 Central American unity with at least 4 of the 5 States of 1823 under our rule or as confederated partners."
