l_english:
 CA_EW119_BOX_TITLE:0 "The State of the Union, 1836"
 CA_EW119_BAR:0 "Federation support: #bold [GetPlayer.MakeScope.ScriptValue('ca_ew119_bar_value')|0]#! / 200"
 CA_EW119_BAR_TT:0 "#bold Federation support#! is the bar of the journal #bold The Federation Falls Apart#!.\n\nIt starts at 75. It rises when the States obey and the federal government works, and it falls with secession, civil war and broken promises. At 0 the Federation dissolves."
 CA_EW119_LOYALTY:0 "Loyalty of the States:"
 CA_EW119_LOYALTY_TT:0 "Each dot is one State of the Federation:\n#bold Green#!: loyal\n#bold Yellow#!: wavering\n#bold Orange#!: rebellious\n#bold Grey#!: separated\n\nThe map above shows the same colours."
 CA_EW119_GUA:0 "GUA"
 CA_EW119_ELS:0 "ELS"
 CA_EW119_HON:0 "HON"
 CA_EW119_NIC:0 "NIC"
 CA_EW119_COS:0 "COS"
 CA_EW119_DEBT:0 "British debt: tier #bold [GetPlayer.MakeScope.ScriptValue('ca_ew119_debt_tier')|0]#! of 4"
 CA_EW119_DEBT_TT:0 "The loan of 1825 from the house of Barclay, Herring, Richardson & Co. Tier 4 is the heaviest. Paying or renegotiating lowers the tier; defaulting angers Britain."
 CA_EW119_PARALYSIS_ON:0 "Federal paralysis: #bold active#! (laws cannot be changed)"
 CA_EW119_PARALYSIS_OFF:0 "Federal paralysis: none"
 CA_EW119_PARALYSIS_TT:0 "The federal Congress is deadlocked. While it lasts, no law can be started or cancelled and the central government loses authority. It ends on its own after five years."
 CA_EW119_ARMY_ON:0 "Federal army: #bold in disarray#!"
 CA_EW119_ARMY_OFF:0 "Federal army: in order"
 CA_EW119_ARMY_TT:0 "After years of civil war the federal army is unpaid and divided. While it lasts, generals command fewer troops and units fight worse."
 CA_EW119_CHOOSE:0 "Choose the path of the Federation"
 CA_EW119_DIFFICULTY:0 "Difficulty:"
 CA_EW119_DIFF_VARIES:0 "#bold varies#!"
 CA_EW119_FED_TITLE:0 "Federalists"
 CA_EW119_FED_DESC:0 "#bold Goal:#! keep the Federation alive until 1845.\n- Spend #bold Federal Cohesion#! on federal actions\n- Congress proposes reforms\n- Win the States back by campaigns and negotiation"
 CA_EW119_FED_TT:0 "#bold The historical path.#! Morazán and the liberals defend the Constitution of 1824 and the rights of the States."
 CA_EW119_CEN_TITLE:0 "Centralists"
 CA_EW119_CEN_DESC:0 "#bold Goal:#! hold the Union together by force.\n- No cohesion: intendants and states of siege\n- Buy or crush the caudillos\n- Every order risks a rebellion"
 CA_EW119_CEN_TT:0 "#bold Only for the player.#! The federal capital rules the isthmus with the army. The army approves; the landowners do not."
 CA_EW119_STA_TITLE:0 "A Single State"
 CA_EW119_STA_DESC:0 "#bold Goal:#! leave the Federation and lead one State.\n- Its own journals and elections\n- Its own road to sovereignty\n- Choose the State in the next window"
 CA_EW119_STA_TT:0 "#bold Only for the player.#! Opens the State selector. You can come back to this window from there."
 CA_EW119_GUIDE:0 "How to play?"
 CA_EW119_GUIDE_TT:0 "Opens the short guide to the Federation: loyalty, the bar, cohesion, the paths, the fronts and the debt."
 CA_EW119_HISTORICAL_HINT:0 "The Federalist path is the historical one."
